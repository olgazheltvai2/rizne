<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory та Kartka Game</title>
    
    <!-- Підключення Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        /* Базові налаштування */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #333; /* Заглушка, поки тема не завантажиться */
            color: #fff;
            overflow-x: hidden;
        }

        /* Прозорі контейнери для гри */
        .game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100vh;
            box-sizing: border-box;
            padding: 20px;
            gap: 20px;
        }

        .main-area {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: space-between;
            align-items: flex-start;
            flex: 1;
        }

        /* Меморі поле */
        .memory-board {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            min-width: 300px;
        }

        /* 3D Картки Меморі (Вертикальний формат 3:4) */
        .memory-card {
            width: 12vw;
            max-width: 120px;
            min-width: 70px;
            aspect-ratio: 3/4;
            perspective: 1000px;
            cursor: pointer;
        }

        .memory-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .memory-card.flipped .memory-inner {
            transform: rotateY(180deg);
        }

        .memory-front, .memory-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            border-radius: 10px;
            box-shadow: 4px 4px 12px rgba(0,0,0,0.7), inset 2px 2px 5px rgba(255,255,255,0.3);
            border: 1px solid rgba(255, 255, 255, 0.7);
            background-color: #fff;
        }

        /* Сорочка картки */
        .memory-front {
            background-color: #2c3e50;
            background-image: repeating-linear-gradient(45deg, #2c3e50 0, #2c3e50 15px, #34495e 15px, #34495e 30px);
        }

        /* Лицьова сторона картки (щоб не обрізало) */
        .memory-back {
            transform: rotateY(180deg);
            background-size: 100% 100%; /* Вписуємо зображення цілком */
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Зона Kartka */
        .kartka-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            min-width: 250px;
        }

        .current-kartka {
            width: 18vw;
            max-width: 200px;
            min-width: 120px;
            aspect-ratio: 3/4; /* Вертикальний формат */
            background-size: 100% 100%; /* Без обрізання */
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 12px;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.8), inset 2px 2px 5px rgba(255,255,255,0.3);
            border: 1px solid rgba(255, 255, 255, 0.7);
            background-color: #fff;
        }

        .kartka-controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 250px;
        }

        button {
            font-family: Arial, sans-serif;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
            box-sizing: border-box;
            width: 100%;
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        .skip-btn {
            background-color: #f39c12;
        }
        .skip-btn:hover {
            background-color: #e67e22;
        }

        /* Колекції гравців */
        .players-collections {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            width: 100%;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }

        .player-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 15px;
            min-width: 150px;
        }

        .player-name {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        .collected-cards {
            display: flex;
            flex-wrap: wrap;
            gap: -15px; /* Накладання карток */
            justify-content: center;
        }

        .collected-card {
            width: 70px;
            aspect-ratio: 3/4; /* Вертикальний формат */
            background-size: 100% 100%;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.6);
            margin-right: -25px; /* Ефект віяла/стопки */
            position: relative;
        }
        .collected-card:last-child {
            margin-right: 0;
        }

        /* Екран налаштувань гри */
        #setup-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
            width: 80%;
            max-width: 350px;
            box-sizing: border-box;
            text-align: center;
        }

        .secret-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255,255,255,0.5);
            color: transparent !important;
            text-shadow: 0 0 0 transparent;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }
        .secret-input::selection {
            color: transparent;
            background: transparent;
        }
        .secret-input:focus {
            outline: none;
            border-color: #4CAF50;
        }

        /* Управління (Теми та Скидання) */
        .controls-wrapper {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 1000;
        }

        .circle-btn {
            width: 50px;
            height: 50px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .circle-btn:hover {
            transform: scale(1.1);
            background-color: rgba(0,0,0,0.9);
        }
        #reset-btn {
            background-color: rgba(220, 53, 69, 0.7);
        }
        #reset-btn:hover {
            background-color: rgba(220, 53, 69, 1);
        }

        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 600px;
            max-height: 60vh;
            background: rgba(30, 30, 30, 0.95);
            border: 2px solid #555;
            border-radius: 15px;
            z-index: 1001;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            flex-direction: column;
        }
        #theme-modal-close {
            align-self: flex-end;
            cursor: pointer;
            font-size: 20px;
            margin-bottom: 10px;
        }
        #theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            overflow-y: auto;
            max-height: calc(60vh - 60px);
            padding-right: 10px;
        }
        .theme-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            position: relative;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            transition: 0.2s;
        }
        .theme-thumb:hover {
            transform: scale(1.05);
            border: 2px solid #4CAF50;
        }
        .theme-thumb span {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 4px 0;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        /* Універсальний блок контролю */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 999999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #block-overlay h1 {
            color: red;
            font-size: 40px;
            text-align: center;
            font-family: Arial, sans-serif;
            text-transform: uppercase;
        }

        /* Адаптивність */
        @media (max-width: 768px) {
            .main-area {
                flex-direction: column;
                align-items: center;
            }
            .kartka-area {
                width: 100%;
                border-top: 1px solid rgba(255,255,255,0.3);
                padding-top: 20px;
            }
            .kartka-controls {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- Екран налаштувань (для першого запуску) -->
    <div id="setup-screen">
        <h3 style="margin:0;">Налаштування гри</h3>
        <p style="margin:5px 0 15px; font-size:14px; color:#ccc;">Меморі завжди генерує 16 карток на полі (8 пар).</p>
        
        <label style="text-align:left;">Кількість карток Kartka (за замовчуванням 15):</label>
        <input type="number" id="kartka-count" class="secret-input" placeholder="Введіть число" value="15">
        <button onclick="startGame()">Розпочати гру</button>
    </div>

    <!-- Основний контейнер гри -->
    <div class="game-container" id="game-container" style="display: none;">
        <div class="main-area">
            <!-- Поле для меморі -->
            <div class="memory-board" id="memory-board">
                <!-- Картки будуть згенеровані тут -->
            </div>

            <!-- Зона окремої картки (kartka) -->
            <div class="kartka-area" id="kartka-area">
                <div id="current-kartka" class="current-kartka" style="display:none;"></div>
                <div class="kartka-controls" id="kartka-controls" style="display:none;">
                    <!-- Кнопка автоматично присвоює картку тому, хто її натиснув -->
                    <button onclick="takeKartka()">Взяти картку</button>
                    <button class="skip-btn" onclick="skipKartka()">Змінити картку (вниз колоди)</button>
                </div>
                <h3 id="empty-deck-msg" style="display:none; text-align:center;">Колода порожня!</h3>
            </div>
        </div>

        <!-- Зона колекцій гравців -->
        <div class="players-collections" id="players-collections">
            <!-- Тут будуть відображатися здобутки гравців -->
        </div>
    </div>

    <!-- Theme Manager та Кнопка Скидання -->
    <div class="controls-wrapper">
        <div id="reset-btn" class="circle-btn" onclick="resetGame()" title="Почати нову гру (Скинути)">🔄</div>
        <div id="theme-btn" class="circle-btn" onclick="openThemeModal()" title="Змінити фон">⚙️</div>
    </div>

    <div id="theme-modal">
        <div id="theme-modal-close" onclick="closeThemeModal()">✖</div>
        <div id="theme-grid"></div>
    </div>

    <script>
        // Ініціалізація базових ідентифікаторів
        let myName = new URLSearchParams(window.location.search).get('user');
        if (myName) {
            sessionStorage.setItem('myName', myName);
        } else {
            myName = sessionStorage.getItem('myName');
            if (!myName) {
                myName = "Гість_" + Math.floor(Math.random() * 1000);
                sessionStorage.setItem('myName', myName);
            }
        }
        const tabId = Math.random().toString(36).substr(2, 9);

        // ІНІЦІАЛІЗАЦІЯ FIREBASE
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // СТАН ГРИ (Локальна копія)
        let localGameState = null;

        // ВІДПРАВКА ДІЙ ТА СИНХРОНІЗАЦІЯ СТАНУ
        function sendAction(type, data) {
            // Оновлюємо унікальну гілку стану. Змінено на _v3 для чистого старту без багів.
            db.ref('memory_kartka_state_v3').set(localGameState);
            
            // Відправляємо дію для миттєвої синхронізації
            db.ref('memory_kartka_action_v3').set({
                senderId: tabId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                type: type,
                data: data
            });
        }

        // Слухаємо дії інших гравців
        db.ref('memory_kartka_action_v3').on('value', snap => {
            const action = snap.val();
            if (!action || action.senderId === tabId) return; // Запобігаємо зацикленню
            
            if (action.type === 'START_GAME') {
                localGameState = action.data;
            } else if (action.type === 'FLIP_MEMORY') {
                if(localGameState && localGameState.memoryCards) {
                    localGameState.memoryCards[action.data.index].flipped = action.data.flipped;
                }
            } else if (action.type === 'TAKE_KARTKA') {
                if(localGameState && localGameState.deck && localGameState.deck.length > 0) {
                    localGameState.deck.shift();
                }
                if (localGameState) {
                    // Запобіжник від видалення порожнього об'єкта Firebase
                    if (!localGameState.players) localGameState.players = {}; 
                    
                    if (!localGameState.players[action.data.playerName]) {
                        localGameState.players[action.data.playerName] = [];
                    }
                    localGameState.players[action.data.playerName].push(action.data.card);
                }
            } else if (action.type === 'SKIP_KARTKA') {
                if(localGameState && localGameState.deck && localGameState.deck.length > 0) {
                    let card = localGameState.deck.shift();
                    localGameState.deck.push(card);
                }
            }
            renderGame();
        });

        // Завантаження стану при старті
        db.ref('memory_kartka_state_v3').once('value', snap => {
            const state = snap.val();
            // Додано сувору перевірку (state.memoryCards.length === 16), щоб захиститися від старих нескінченних масивів
            if (state && state.memoryCards && state.memoryCards.length === 16) { 
                localGameState = state;
                document.getElementById('setup-screen').style.display = 'none';
                document.getElementById('game-container').style.display = 'flex';
                renderGame();
            } else {
                document.getElementById('setup-screen').style.display = 'flex';
                document.getElementById('game-container').style.display = 'none';
            }
        });

        // ЛОГІКА ГРИ
        function startGame() {
            const kartkaCount = parseInt(document.getElementById('kartka-count').value) || 15;

            let memoryCards = [];
            // Завжди беремо 8 пар (рівно 16 карток)
            for(let i = 1; i <= 8; i++) {
                memoryCards.push({ id: `m_${i}_1`, pairId: i, flipped: false, image: `memory_${i}.webp` });
                memoryCards.push({ id: `m_${i}_2`, pairId: i, flipped: false, image: `memory_${i}.webp` });
            }
            // Перемішування
            memoryCards.sort(() => Math.random() - 0.5);

            let deck = [];
            for(let i = 1; i <= kartkaCount; i++) {
                deck.push({ id: `k_${i}`, image: `kartka_${i}.webp` });
            }
            // Перемішування колоди
            deck.sort(() => Math.random() - 0.5);

            localGameState = {
                memoryCards: memoryCards,
                deck: deck,
                players: {} // Спочатку порожній, Firebase його видалить, але ми відновимо його в функціях
            };

            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';

            sendAction('START_GAME', localGameState);
            renderGame();
        }

        function resetGame() {
            if(confirm("Ви впевнені, що хочете скинути гру і почати заново?")) {
                db.ref('memory_kartka_state_v3').remove();
                location.reload();
            }
        }

        function toggleMemory(index) {
            localGameState.memoryCards[index].flipped = !localGameState.memoryCards[index].flipped;
            sendAction('FLIP_MEMORY', { index: index, flipped: localGameState.memoryCards[index].flipped });
            renderGame();
        }

        function takeKartka() {
            // Гравець визначається автоматично за параметром URL (ім'я в сесії)
            const playerName = myName;
            
            if (!localGameState.deck || localGameState.deck.length === 0) return;

            // ВАЖЛИВО: Відновлюємо об'єкт players, якщо Firebase його видалив (коли він був порожнім)
            if (!localGameState.players) {
                localGameState.players = {};
            }

            const card = localGameState.deck.shift();
            if (!localGameState.players[playerName]) {
                localGameState.players[playerName] = [];
            }
            localGameState.players[playerName].push(card);

            sendAction('TAKE_KARTKA', { playerName: playerName, card: card });
            renderGame();
        }

        function skipKartka() {
            if (!localGameState.deck || localGameState.deck.length === 0) return;
            
            const card = localGameState.deck.shift();
            localGameState.deck.push(card);
            
            sendAction('SKIP_KARTKA', {});
            renderGame();
        }

        // РЕНДЕР ІНТЕРФЕЙСУ
        function renderGame() {
            if (!localGameState) return;

            // Рендер Меморі
            const board = document.getElementById('memory-board');
            board.innerHTML = '';
            if (localGameState.memoryCards) {
                localGameState.memoryCards.forEach((card, index) => {
                    const cardDiv = document.createElement('div');
                    cardDiv.className = 'memory-card' + (card.flipped ? ' flipped' : '');
                    cardDiv.onclick = () => toggleMemory(index);
                    
                    const inner = document.createElement('div');
                    inner.className = 'memory-inner';

                    const front = document.createElement('div');
                    front.className = 'memory-front';

                    const back = document.createElement('div');
                    back.className = 'memory-back';
                    back.style.backgroundImage = `url('${card.image}')`;

                    inner.appendChild(front);
                    inner.appendChild(back);
                    cardDiv.appendChild(inner);
                    board.appendChild(cardDiv);
                });
            }

            // Рендер Kartka
            const currKartkaDiv = document.getElementById('current-kartka');
            const controls = document.getElementById('kartka-controls');
            const emptyMsg = document.getElementById('empty-deck-msg');

            if (localGameState.deck && localGameState.deck.length > 0) {
                const currentCard = localGameState.deck[0];
                currKartkaDiv.style.display = 'block';
                currKartkaDiv.style.backgroundImage = `url('${currentCard.image}')`;
                controls.style.display = 'flex';
                emptyMsg.style.display = 'none';
            } else {
                currKartkaDiv.style.display = 'none';
                controls.style.display = 'none';
                emptyMsg.style.display = 'block';
            }

            // Рендер Колекцій
            const collections = document.getElementById('players-collections');
            collections.innerHTML = '';
            if (localGameState.players) {
                for (const [pName, cards] of Object.entries(localGameState.players)) {
                    if (cards.length === 0) continue;

                    const box = document.createElement('div');
                    box.className = 'player-box';

                    const title = document.createElement('div');
                    title.className = 'player-name';
                    title.textContent = pName;

                    const cardsDiv = document.createElement('div');
                    cardsDiv.className = 'collected-cards';

                    cards.forEach(c => {
                        const cDiv = document.createElement('div');
                        cDiv.className = 'collected-card';
                        cDiv.style.backgroundImage = `url('${c.image}')`;
                        cardsDiv.appendChild(cDiv);
                    });

                    box.appendChild(title);
                    box.appendChild(cardsDiv);
                    collections.appendChild(box);
                }
            }
        }

        // СИСТЕМА ДИНАМІЧНИХ ФОНІВ (Theme Manager)
        function openThemeModal() {
            document.getElementById('theme-modal').style.display = 'flex';
        }
        function closeThemeModal() {
            document.getElementById('theme-modal').style.display = 'none';
        }

        async function loadThemes() {
            const grid = document.getElementById('theme-grid');
            let errorCount = 0;
            for(let i = 1; i <= 1000; i++) {
                if(errorCount >= 5) break; 
                await new Promise(resolve => {
                    let url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                    let img = new Image();
                    img.onload = () => {
                        errorCount = 0;
                        let thumb = document.createElement('div');
                        thumb.className = 'theme-thumb';
                        thumb.style.backgroundImage = `url('${url}')`;
                        thumb.innerHTML = `<span>Фон ${i}</span>`;
                        thumb.onclick = () => {
                            db.ref('game_theme').set(url);
                            closeThemeModal();
                        };
                        grid.appendChild(thumb);
                        resolve();
                    };
                    img.onerror = () => {
                        errorCount++;
                        resolve();
                    };
                    img.src = url;
                });
            }
        }
        loadThemes();

        // Синхронізація фону
        db.ref('game_theme').on('value', snap => {
            let url = snap.val();
            if(url) {
                document.body.style.backgroundImage = `url('${url}')`;
                localStorage.setItem('mySavedGameBg', url);
            }
        });
        
        let savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) {
            document.body.style.backgroundImage = `url('${savedBg}')`;
        }
    </script>

    <!-- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ (Ідентифікація, Радар, Блокування) -->
    <div id="block-overlay">
        <h1>Зачекай! Зараз не твій урок.</h1>
    </div>

    <script>
        // myName та tabId вже ініціалізовані на початку скрипта
        const userRef = db.ref(`online_users/${myName}/${tabId}`);

        db.ref('.info/connected').on('value', snap => {
            if (snap.val() === true) {
                userRef.set(true);
                userRef.onDisconnect().remove();
            }
        });

        window.addEventListener('beforeunload', () => {
            userRef.remove();
        });

        // Блокування користувача
        db.ref(`blocked_users/${myName}`).on('value', snap => {
            if (snap.val() === true) {
                document.getElementById('block-overlay').style.display = 'flex';
            } else {
                document.getElementById('block-overlay').style.display = 'none';
            }
        });

        // Оновлення списку (перепідключення)
        db.ref('force_refresh').on('value', snap => {
            if (snap.val() === true) {
                location.reload();
            }
        });

        // Повернення в Лобі (з імунітетом 1 сек)
        const appStartTime = Date.now();
        db.ref('current_activity').on('value', snap => {
            const timePassed = Date.now() - appStartTime;
            if (timePassed < 1000) return; // Імунітет при старті

            if (snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });
    </script>
</body>
</html>
