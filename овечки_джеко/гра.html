<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ферма</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <style>
        /* Основні стилі контейнера */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow: auto; /* Дозволяє скролити екран, якщо гра наближена або не влазить */
            touch-action: pan-x pan-y; /* Дозволяє вільно пересувати екран пальцем */
            overscroll-behavior: none; /* Запобігає випадковому оновленню сторінки при свайпі вниз */
            font-family: Arial, sans-serif;
            user-select: none;
            transition: background-image 0.5s ease;
        }

        /* Контейнер гри */
        #game-wrapper {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            background: transparent;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            transform-origin: 0 0; 
        }

        /* Деталізований сюжетний фон */
        .scenery {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        /* Анімація хмар */
        @keyframes cloud-move {
            0% { transform: translateX(-400px); }
            100% { transform: translateX(2000px); }
        }
        .cloud-1 { animation: cloud-move 50s linear infinite; }
        .cloud-2 { animation: cloud-move 70s linear infinite reverse; }

        /* Ігрове поле - 4x4, рамка 20px */
        #board-container {
            position: absolute;
            left: 640px; 
            top: 100px;  
            width: 720px;
            height: 720px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180"><rect width="180" height="180" fill="%238B5A2B"/><path d="M0,0 L180,0 L180,180 L0,180 Z" fill="none" stroke="%23A0522D" stroke-width="4"/><path d="M10,10 L170,170 M170,10 L10,170" stroke="%23704214" stroke-width="2" opacity="0.2"/></svg>');
            background-color: #8B5A2B;
            border: 20px solid #4E342E;
            border-radius: 15px;
            box-shadow: 15px 15px 35px rgba(0,0,0,0.6), inset 0 0 50px rgba(0,0,0,0.7);
            z-index: 10;
            box-sizing: content-box;
            transition: all 0.3s ease;
        }

        /* Внутрішня сітка поля для візуального розуміння */
        #board-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 180px);
            grid-template-rows: repeat(4, 180px);
            pointer-events: none;
        }

        .cell {
            box-sizing: border-box;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            width: 180px;
            height: 180px;
        }

        /* Деталі - Тіні повністю видалено, плоский чистий вигляд */
        .piece {
            position: absolute;
            width: 360px;
            height: 180px;
            transform-origin: 90px 90px;
            cursor: grab;
            z-index: 20;
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.15);
            box-sizing: border-box;
            transition: background-color 0.2s, transform 0.1s;
            overflow: hidden;
        }

        .piece.dragging {
            z-index: 100;
            cursor: grabbing;
            filter: brightness(1.1); /* Лише легке висвітлення при переносі */
        }

        /* Чітка рамка для заблокованих деталей замість сірості */
        .piece.locked {
            border: 6px solid #FF3333;
            box-shadow: inset 0 0 10px rgba(255, 51, 51, 0.5);
            cursor: default;
            z-index: 15;
        }

        /* Інтерфейс */
        .ui-btn {
            position: absolute;
            border-radius: 50%;
            border: 6px solid #fff;
            cursor: pointer;
            z-index: 200;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: transform 0.1s, background 0.3s;
        }

        .ui-btn:active { transform: scale(0.9); }
        .ui-btn svg { fill: white; }
        
        #btn-teacher {
            top: 40px;
            left: 40px;
            width: 100px;
            height: 100px;
            background: #9C27B0;
        }
        #btn-teacher svg { width: 60px; height: 60px; }
        
        #btn-teacher.active {
            background: #FF9800;
            border-color: #FFF3E0;
            animation: pulse-ring 1.5s infinite;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0.7); }
            70% { box-shadow: 0 0 0 25px rgba(255, 152, 0, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 152, 0, 0); }
        }
        
        /* Зум Кнопки (Лупа) всередині гри */
        #btn-zoom-in, #btn-zoom-out {
            position: absolute;
            width: 90px; height: 90px;
            border-radius: 50%; border: 6px solid #fff;
            cursor: pointer; z-index: 200;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            font-size: 45px; font-weight: bold; color: white;
            background: #3498db;
            transition: transform 0.1s;
        }
        #btn-zoom-in:active, #btn-zoom-out:active { transform: scale(0.9); }
        #btn-zoom-in { top: 40px; right: 40px; }
        #btn-zoom-out { top: 150px; right: 40px; background: #e74c3c; }

        /* Живий персонаж (Фермер) */
        #farmer {
            position: absolute;
            left: 80px;
            top: 380px;
            width: 400px;
            height: 500px;
            z-index: 5;
            cursor: pointer; 
            transition: transform 0.3s ease;
        }

        .farmer-happy {
            transform: translateY(-60px) scale(1.05);
        }

        /* Нижня панель для деталей (Док) */
        #dock {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1920px;
            height: 250px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 250" preserveAspectRatio="none"><path d="M0,60 Q200,-10 400,50 T800,40 T1200,70 T1600,30 T1920,60 L1920,250 L0,250 Z" fill="%232E7D32" /><path d="M0,90 Q150,30 300,80 T700,60 T1100,100 T1500,50 T1920,90 L1920,250 L0,250 Z" fill="%231B5E20" opacity="0.7"/></svg>');
            z-index: 10;
            pointer-events: none;
        }

        /* ================= ДОДАТКОВІ МОДУЛІ (ФОНИ, БЛОК, МАЛЮВАННЯ) ================= */

        /* Блок-заглушка */
        #block-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            color: red;
            display: none;
            justify-content: center;
            align-items: center;
            font-size: 5vw;
            font-weight: bold;
            z-index: 999999;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        /* Theme Manager */
        #theme-btn {
            position: fixed;
            bottom: 20px; right: 20px;
            width: 60px; height: 60px;
            border-radius: 50%;
            background: #34495e; color: white;
            font-size: 30px;
            border: 3px solid white;
            cursor: pointer;
            z-index: 80000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        #theme-modal {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 15px;
            z-index: 80001;
            display: none;
            width: 80vw;
            max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        #theme-modal h2 { margin-top: 0; }
        .theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 10px;
        }
        .theme-card {
            position: relative;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid transparent;
            height: 80px;
            background-color: #ccc;
            background-size: cover;
            background-position: center;
        }
        .theme-card:hover { border-color: #3498db; }
        .theme-card span {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 14px;
            padding: 2px 0;
        }
        #theme-close {
            position: absolute;
            top: 10px; right: 15px;
            font-size: 24px; cursor: pointer; color: red;
        }

        /* Глобальне малювання всередині гри */
        #draw-canvas-global {
            position: absolute;
            top: 0; left: 0;
            width: 1920px;
            height: 1080px;
            pointer-events: none;
            z-index: 90000;
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px; right: 20px;
            background: #8e44ad; color: white;
            border: 2px solid white; border-radius: 30px;
            padding: 10px 20px; font-size: 16px; font-weight: bold;
            cursor: pointer; z-index: 90001;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        #draw-panel-global {
            position: fixed;
            top: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px; padding: 10px;
            display: none; flex-direction: column; gap: 10px;
            z-index: 90002; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 2px solid #8e44ad;
            width: 200px;
        }
        .draw-panel-header {
            cursor: grab;
            background: #8e44ad; color: white;
            text-align: center; border-radius: 8px;
            padding: 5px; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
        }
        .draw-panel-header:active { cursor: grabbing; }
        .draw-btn-row { display: flex; gap: 5px; justify-content: space-between; }
        .draw-btn-row button {
            flex: 1; padding: 5px; border: none; border-radius: 5px;
            cursor: pointer; background: #ddd; font-weight: bold;
        }
        .draw-btn-row button.active { background: #3498db; color: white; }
        #draw-clear-global { background: #e74c3c; color: white; margin-top: 5px; }

        @media (max-width: 768px) {
            .theme-gallery { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
            .theme-card { height: 60px; }
        }
    </style>
</head>
<body>

    <!-- Поле -->

<!-- Додатковий UI -->
<button id="theme-btn">⚙️</button>

    <span id="theme-close">✕</span>

    <div class="draw-panel-header" id="draw-panel-header">
        <span>Панель малювання</span>
        <span id="draw-close-global" style="cursor:pointer; color:#fff;">✕</span>
    </div>
    <div class="draw-btn-row">
        <button id="draw-pencil-global" class="active">✏️ Олівець</button>
        <button id="draw-eraser-global">🧽 Гумка</button>
    </div>
    <label style="font-size: 14px;">Товщина: <span id="draw-size-val">5</span>px</label>
    <input type="range" id="draw-size-global" min="1" max="50" value="5" style="width: 100%;">
    <label style="font-size: 14px;">Колір:</label>
    <input type="color" id="draw-color-global" value="#ff0000" style="width: 100%; height: 30px; cursor: pointer;">
    <button id="draw-clear-global">🗑️ Очистити</button>
</div>

<div id="block-overlay">Зачекай! Зараз не твій урок.</div>

<script>
    // --- 1. КОНФІГУРАЦІЯ ТА ІДЕНТИФІКАЦІЯ ---
    const CONFIG = {
        gameId: 'farm_puzzle_001',
        firebaseUrl: 'https://lesson-13c44-default-rtdb.firebaseio.com/',
        projectId: 'lesson-13c44'
    };

    const urlParams = new URLSearchParams(window.location.search);
    let myName = urlParams.get('user');
    if (myName) {
        sessionStorage.setItem('userName', myName);
    } else {
        myName = sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('userName', myName);
        }
    }
    const tabId = Math.random().toString(36).substring(2, 9);
    let isOnline = false;

    // Ініціалізація Firebase
    const app = firebase.initializeApp({
        databaseURL: CONFIG.firebaseUrl,
        projectId: CONFIG.projectId
    });
    const db = firebase.database(app);

    // --- 2. РАДАР, БЛОКУВАННЯ ТА ЛОБІ ---
    const onlineRef = db.ref(`online_users/${myName}/${tabId}`);
    db.ref('.info/connected').on('value', (snap) => {
        if (snap.val() === true) {
            isOnline = true;
            onlineRef.set(true);
            onlineRef.onDisconnect().remove();
        } else {
            isOnline = false;
        }
    });

    window.addEventListener('beforeunload', () => {
        if (isOnline) onlineRef.remove();
    });

    db.ref('force_refresh').on('value', (snap) => {
        if (snap.val() === true) window.location.reload();
    });

    db.ref(`blocked_users/${myName}`).on('value', (snap) => {
        document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
    });

    let immunity = true;
    setTimeout(() => immunity = false, 1000);
    db.ref('current_activity').on('value', (snap) => {
        if (immunity) return;
        if (snap.val() === 'lobby') {
            window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
        }
    });

    // --- 3. СИНХРОНІЗАЦІЯ ДІЙ ТА ФОНІВ ---
    function sendAction(type, data) {
        if (!isOnline) return;
        db.ref('game_action').set({
            senderId: myName + '_' + tabId,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            type: type,
            data: data
        });
    }

    db.ref('game_action').on('value', (snap) => {
        const action = snap.val();
        if (!action) return;
        const isRemoteAction = action.senderId !== (myName + '_' + tabId);
        
        if (action.type === 'piece_update' && isRemoteAction) {
            const p = pieces[action.data.id];
            if (p) {
                p._state = {...action.data};
                applyState(p);
                updateGridFromState();
            }
        } else if (action.type === 'board_lock' && isRemoteAction) {
            isBoardLocked = action.data.locked;
            if (isBoardLocked) btnTeacher.classList.add('active');
            else btnTeacher.classList.remove('active');
            pieces.forEach(p => {
                const s = p._state;
                if (s.gridX !== -1) {
                    s.locked = isBoardLocked;
                    applyState(p);
                }
            });
        } else if (action.type === 'draw_line' && isRemoteAction) {
            remoteDrawLine(action.data);
        } else if (action.type === 'clear_canvas' && isRemoteAction) {
            ctxGlobal.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        } else if (action.type === 'farmer_happy' && isRemoteAction) {
            triggerFarmerHappy();
        }
    });

    // Theme Manager
    const savedBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
    if (savedBg) {
        document.body.style.backgroundImage = savedBg === 'none' ? 'none' : `url('${savedBg}')`;
    }

    db.ref('game_theme').on('value', (snap) => {
        const bgUrl = snap.val();
        if (bgUrl) {
            document.body.style.backgroundImage = bgUrl === 'none' ? 'none' : `url('${bgUrl}')`;
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, bgUrl);
        }
    });

    const themeBtn = document.getElementById('theme-btn');
    const themeModal = document.getElementById('theme-modal');
    const themeClose = document.getElementById('theme-close');
    const themeGallery = document.getElementById('theme-gallery');

    themeBtn.addEventListener('click', () => { themeModal.style.display = 'block'; loadThemes(); });
    themeClose.addEventListener('click', () => themeModal.style.display = 'none');

    let themesLoaded = false;
    async function loadThemes() {
        if (themesLoaded) return;
        
        const noBgCard = document.createElement('div');
        noBgCard.className = 'theme-card';
        noBgCard.style.backgroundColor = '#2c3e50';
        noBgCard.innerHTML = '<span>Без фону</span>';
        noBgCard.addEventListener('click', () => applyTheme('none'));
        themeGallery.appendChild(noBgCard);

        let i = 1;
        while(true) {
            const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
            try {
                const response = await fetch(url, { method: 'HEAD' });
                if (!response.ok) break;
                
                const card = document.createElement('div');
                card.className = 'theme-card';
                card.style.backgroundImage = `url('${url}')`;
                card.innerHTML = `<span>Фон ${i}</span>`;
                card.addEventListener('click', () => applyTheme(url));
                themeGallery.appendChild(card);
                i++;
            } catch (e) {
                break;
            }
        }
        themesLoaded = true;
    }

    function applyTheme(url) {
        if (isOnline) {
            db.ref('game_theme').set(url);
        } else {
            document.body.style.backgroundImage = url === 'none' ? 'none' : `url('${url}')`;
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
        }
        themeModal.style.display = 'none';
    }

    // --- 4. МАСШТАБУВАННЯ ТА ЗУМ (Вдосконалено для скролінгу/свайпів) ---
    const wrapper = document.getElementById('game-wrapper');
    let globalScale = 1;
    let userZoom = 1;

    function resize() {
        let baseScale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
        globalScale = baseScale * userZoom;
        
        let scaledWidth = 1920 * globalScale;
        let scaledHeight = 1080 * globalScale;
        
        // Центруємо, якщо гра менша за екран. Якщо більша - відступ 0, щоб був природній скрол
        let offsetX = Math.max(0, (window.innerWidth - scaledWidth) / 2);
        let offsetY = Math.max(0, (window.innerHeight - scaledHeight) / 2);
        
        wrapper.style.transform = `translate(${offsetX}px, ${offsetY}px) scale(${globalScale})`;
    }
    window.addEventListener('resize', resize);
    resize();

    document.getElementById('btn-zoom-in').addEventListener('click', () => { userZoom += 0.1; resize(); });
    document.getElementById('btn-zoom-out').addEventListener('click', () => { userZoom = Math.max(0.3, userZoom - 0.1); resize(); });

    // --- 5. ГЛОБАЛЬНЕ МАЛЮВАННЯ (Точне масштабування всередині гри) ---
    const drawCanvas = document.getElementById('draw-canvas-global');
    const ctxGlobal = drawCanvas.getContext('2d');
    const toggleDrawBtn = document.getElementById('toggle-draw-btn-global');
    const drawPanel = document.getElementById('draw-panel-global');
    const drawClose = document.getElementById('draw-close-global');
    const drawPencil = document.getElementById('draw-pencil-global');
    const drawEraser = document.getElementById('draw-eraser-global');
    const drawSize = document.getElementById('draw-size-global');
    const drawSizeVal = document.getElementById('draw-size-val');
    const drawColor = document.getElementById('draw-color-global');
    const drawClear = document.getElementById('draw-clear-global');

    // Жорстко фіксуємо розмір полотна під розмір гри
    drawCanvas.width = 1920;
    drawCanvas.height = 1080;

    let isDrawingMode = false;
    let isDrawing = false;
    let currentMode = 'pencil';
    let lastDrawPoint = null;

    toggleDrawBtn.addEventListener('click', () => {
        drawPanel.style.display = 'flex';
        isDrawingMode = true;
        drawCanvas.style.pointerEvents = 'auto';
    });

    drawClose.addEventListener('click', () => {
        drawPanel.style.display = 'none';
        isDrawingMode = false;
        drawCanvas.style.pointerEvents = 'none';
    });

    drawPencil.addEventListener('click', () => { currentMode = 'pencil'; drawPencil.classList.add('active'); drawEraser.classList.remove('active'); });
    drawEraser.addEventListener('click', () => { currentMode = 'eraser'; drawEraser.classList.add('active'); drawPencil.classList.remove('active'); });
    drawSize.addEventListener('input', (e) => drawSizeVal.innerText = e.target.value);
    
    drawClear.addEventListener('click', () => {
        ctxGlobal.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        if (isOnline) sendAction('clear_canvas', {});
    });

    const header = document.getElementById('draw-panel-header');
    let isDraggingPanel = false, panOffsetX, panOffsetY;
    header.addEventListener('pointerdown', (e) => {
        isDraggingPanel = true;
        panOffsetX = e.clientX - drawPanel.getBoundingClientRect().left;
        panOffsetY = e.clientY - drawPanel.getBoundingClientRect().top;
    });
    window.addEventListener('pointermove', (e) => {
        if (!isDraggingPanel) return;
        drawPanel.style.left = (e.clientX - panOffsetX) + 'px';
        drawPanel.style.top = (e.clientY - panOffsetY) + 'px';
        drawPanel.style.right = 'auto';
    });
    window.addEventListener('pointerup', () => isDraggingPanel = false);

    function getPointerPos(e) {
        const rect = wrapper.getBoundingClientRect();
        return {
            x: (e.clientX - rect.left) / globalScale / 1920,
            y: (e.clientY - rect.top) / globalScale / 1080
        };
    }

    drawCanvas.addEventListener('pointerdown', (e) => {
        if (!isDrawingMode) return;
        isDrawing = true;
        lastDrawPoint = getPointerPos(e);
    });

    drawCanvas.addEventListener('pointermove', (e) => {
        if (!isDrawing || !isDrawingMode) return;
        const currentPoint = getPointerPos(e);
        const drawData = {
            fromX: lastDrawPoint.x, fromY: lastDrawPoint.y,
            toX: currentPoint.x, toY: currentPoint.y,
            color: currentMode === 'eraser' ? null : drawColor.value,
            size: drawSize.value
        };
        
        localDrawLine(drawData);
        if (isOnline) sendAction('draw_line', drawData);
        lastDrawPoint = currentPoint;
    });

    drawCanvas.addEventListener('pointerup', () => isDrawing = false);
    drawCanvas.addEventListener('pointerleave', () => isDrawing = false);

    function localDrawLine(data) {
        ctxGlobal.beginPath();
        ctxGlobal.moveTo(data.fromX * 1920, data.fromY * 1080);
        ctxGlobal.lineTo(data.toX * 1920, data.toY * 1080);
        if (data.color === null) {
            ctxGlobal.globalCompositeOperation = 'destination-out';
            ctxGlobal.lineWidth = data.size * 2;
        } else {
            ctxGlobal.globalCompositeOperation = 'source-over';
            ctxGlobal.strokeStyle = data.color;
            ctxGlobal.lineWidth = data.size;
        }
        ctxGlobal.lineCap = 'round';
        ctxGlobal.stroke();
        ctxGlobal.globalCompositeOperation = 'source-over';
    }

    function remoteDrawLine(data) {
        localDrawLine(data);
    }

    // --- 6. ЛОГІКА ГРИ "ФЕРМА" ---
    
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    const playSound = (type) => {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        switch (type) {
            case 'pickup':
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(900, now + 0.1);
                gain.gain.setValueAtTime(0, now); gain.gain.linearRampToValueAtTime(0.6, now + 0.02); gain.gain.linearRampToValueAtTime(0, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                break;
            case 'drop':
                osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.exponentialRampToValueAtTime(150, now + 0.1);
                gain.gain.setValueAtTime(0.7, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
                break;
            case 'rotate':
                osc.type = 'square'; osc.frequency.setValueAtTime(800, now); osc.frequency.setValueAtTime(1000, now + 0.05);
                gain.gain.setValueAtTime(0.2, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
                break;
            case 'lock':
                osc.type = 'sine'; osc.frequency.setValueAtTime(1500, now); osc.frequency.linearRampToValueAtTime(900, now + 0.2);
                gain.gain.setValueAtTime(0.4, now); gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
                break;
            case 'win':
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                    o.connect(g); g.connect(audioCtx.destination);
                    o.type = 'triangle'; o.frequency.value = freq;
                    g.gain.setValueAtTime(0, now + i * 0.1); g.gain.linearRampToValueAtTime(0.5, now + i * 0.1 + 0.05); g.gain.linearRampToValueAtTime(0, now + i * 0.1 + 0.4);
                    o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.5);
                });
                break;
        }
    };

    const boardGridEl = document.getElementById('board-grid');
    const farmerMouth = document.getElementById('farmer-mouth');
    const farmer = document.getElementById('farmer');
    const pupilLeft = document.getElementById('pupil-left');
    const pupilRight = document.getElementById('pupil-right');
    const btnTeacher = document.getElementById('btn-teacher');

    const BOARD_SIZE = 4;
    const CELL_SIZE = 180;
    
    // ІДЕАЛЬНИЙ ВІДСТУП: 640px (від лівого краю до рамки поля) + 20px (товщина самої рамки) = 660px
    const BOARD_OFFSET_X = 660; 
    // Аналогічно зверху: 100px + 20px = 120px
    const BOARD_OFFSET_Y = 120; 
    
    let grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));

    for (let i = 0; i < BOARD_SIZE * BOARD_SIZE; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        boardGridEl.appendChild(cell);
    }

    const pieceSources = [
        'деталь1.png', 'деталь2.png',
        'деталь3.png', 'деталь4.png',
        'деталь5.png', 'деталь6.png',
        'деталь7.png', 'деталь8.png',
        'деталь9.png', 'деталь10.png'
    ];

    let pieces = [];
    let isBoardLocked = false; 

    pieceSources.forEach((src, i) => {
        const el = document.createElement('div');
        el.className = 'piece';
        
        el.style.backgroundImage = `url('${encodeURI(src)}')`;
        el.style.backgroundColor = `hsl(${i * 40}, 70%, 45%)`;
        el.innerHTML = `<div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; font-size:40px; font-weight:bold; color:rgba(255,255,255,0.4); pointer-events:none;">${i+1}</div>`;
        
        el.dataset.id = i;
        
        let dockX, dockY;
        if (i < 8) {
            dockX = 100 + i * 185; 
            dockY = 880;          
        } else {
            dockX = 1450;         
            dockY = 250 + (i - 8) * 200; 
        }

        el._state = {
            id: i,
            dockX: dockX,
            dockY: dockY,
            x: dockX,
            y: dockY,
            rot: 0,
            scale: 0.5,
            gridX: -1,
            gridY: -1,
            locked: false
        };

        applyState(el);
        el.addEventListener('pointerdown', onPointerDown);
        wrapper.appendChild(el);
        pieces.push(el);
    });

    function applyState(el) {
        const s = el._state;
        el.style.left = s.x + 'px';
        el.style.top = s.y + 'px';
        el.style.transform = `rotate(${s.rot}deg) scale(${s.scale})`;
        
        if (s.locked) el.classList.add('locked');
        else el.classList.remove('locked');
    }

    function updateGridFromState() {
        grid = Array(BOARD_SIZE).fill().map(() => Array(BOARD_SIZE).fill(null));
        pieces.forEach(p => {
            let s = p._state;
            if (s.gridX !== -1) {
                let gx = s.gridX, gy = s.gridY;
                let rotNorm = ((s.rot % 360) + 360) % 360;
                grid[gy][gx] = s.id;
                if (rotNorm === 0) grid[gy][gx+1] = s.id;
                else if (rotNorm === 90) grid[gy+1][gx] = s.id;
                else if (rotNorm === 180) grid[gy][gx-1] = s.id;
                else if (rotNorm === 270) grid[gy-1][gx] = s.id;
            }
        });
    }

    // Глобальний замок (Ключ)
    btnTeacher.addEventListener('click', () => {
        playSound('lock');
        isBoardLocked = !isBoardLocked;
        if (isBoardLocked) {
            btnTeacher.classList.add('active');
        } else {
            btnTeacher.classList.remove('active');
        }
        
        pieces.forEach(p => {
            const s = p._state;
            if (s.gridX !== -1) {
                s.locked = isBoardLocked;
                applyState(p);
                if (isOnline) sendAction('piece_update', s);
            }
        });
        
        if (isOnline) sendAction('board_lock', { locked: isBoardLocked });
    });

    // Реакція Фермера при натисканні
    function triggerFarmerHappy() {
        playSound('win');
        farmer.classList.add('farmer-happy');
        farmerMouth.setAttribute('d', 'M115,135 Q150,180 185,135'); 
        setTimeout(() => {
            farmer.classList.remove('farmer-happy');
            farmerMouth.setAttribute('d', 'M125,145 Q150,165 175,145');
        }, 2000);
    }

    farmer.addEventListener('pointerdown', () => {
        triggerFarmerHappy();
        if(isOnline) sendAction('farmer_happy', {});
    });

    document.addEventListener('pointermove', (e) => {
        const rect = wrapper.getBoundingClientRect();
        const mx = (e.clientX - rect.left) / globalScale;
        const my = (e.clientY - rect.top) / globalScale;

        const eyeLeftX = 80 + 120; const eyeLeftY = 380 + 100;
        const eyeRightX = 80 + 180; const eyeRightY = 380 + 100;

        const trackPupil = (pupil, ex, ey) => {
            const dx = mx - ex; const dy = my - ey;
            const dist = Math.sqrt(dx*dx + dy*dy);
            const maxR = 6; 
            let moveX = dx, moveY = dy;
            if (dist > maxR) {
                moveX = (dx / dist) * maxR;
                moveY = (dy / dist) * maxR;
            }
            pupil.setAttribute('transform', `translate(${moveX}, ${moveY})`);
        };

        trackPupil(pupilLeft, eyeLeftX, eyeLeftY);
        trackPupil(pupilRight, eyeRightX, eyeRightY);
    });

    let activePiece = null;
    let dragOffsetX = 0;
    let dragOffsetY = 0;
    let didMove = false;
    let startX = 0;
    let startY = 0;
    let lastTap = 0;

    function onPointerDown(e) {
        if (e.button !== 0 && e.type !== 'touchstart') return;
        
        const el = e.currentTarget;
        const s = el._state;

        if (s.locked) {
            playSound('lock');
            return;
        }

        activePiece = el;
        didMove = false;
        
        removeFromGrid(s);
        
        el.classList.add('dragging');
        applyState(el);
        
        const rect = wrapper.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / globalScale;
        const mouseY = (e.clientY - rect.top) / globalScale;
        
        dragOffsetX = mouseX - s.x;
        dragOffsetY = mouseY - s.y;
        startX = mouseX;
        startY = mouseY;
        
        playSound('pickup');
        farmerMouth.setAttribute('d', 'M125,155 Q150,175 175,155');

        document.addEventListener('pointermove', onPointerMove);
        document.addEventListener('pointerup', onPointerUp);
        // Не запобігаємо default для touch подій, щоб не заблокувати загальний скрол сторінки
        if (e.type !== 'touchstart') e.preventDefault(); 
    }

    function onPointerMove(e) {
        if (!activePiece) return;

        const rect = wrapper.getBoundingClientRect();
        const mouseX = (e.clientX - rect.left) / globalScale;
        const mouseY = (e.clientY - rect.top) / globalScale;

        // Поріг 5 пікселів для уникнення хибних спрацювань при повороті.
        // Збільшуємо деталь ТІЛЬКИ якщо її реально потягнули
        if (Math.abs(mouseX - startX) > 5 || Math.abs(mouseY - startY) > 5) {
            if (!didMove) {
                didMove = true;
                if (activePiece._state.scale !== 1) {
                    // Зміщуємо координати, щоб деталь не "стрибнула" з під пальця при зміні масштабу
                    activePiece._state.x = activePiece._state.x + 90 - (90 * 1);
                    activePiece._state.y = activePiece._state.y + 90 - (90 * 1);
                    activePiece._state.scale = 1;
                    dragOffsetX = mouseX - activePiece._state.x;
                    dragOffsetY = mouseY - activePiece._state.y;
                }
            }
        }

        if (didMove) {
            activePiece._state.x = mouseX - dragOffsetX;
            activePiece._state.y = mouseY - dragOffsetY;
            applyState(activePiece);
        }
    }

    function onPointerUp(e) {
        if (!activePiece) return;
        document.removeEventListener('pointermove', onPointerMove);
        document.removeEventListener('pointerup', onPointerUp);

        const el = activePiece;
        const s = el._state;
        activePiece = null;
        el.classList.remove('dragging');

        // Подвійний клік = поворот БЕЗ збільшення розміру
        if (!didMove) {
            let currentTime = new Date().getTime();
            let tapLength = currentTime - lastTap;
            
            if (tapLength < 400 && tapLength > 0) {
                s.rot = (s.rot + 90) % 360; 
                playSound('rotate');
                lastTap = 0;
            } else {
                lastTap = currentTime;
            }
        }

        if (!trySnapToGrid(s)) {
            // ВІЛЬНЕ РОЗМІЩЕННЯ ПОЗА ПОЛЕМ: деталь залишається там, де її кинули
            s.gridX = -1; 
            s.gridY = -1;
            playSound('drop');
        } else {
            // Успішно стала на поле
            s.scale = 1; 
            playSound('drop');
        }
        
        farmerMouth.setAttribute('d', 'M125,145 Q150,165 175,145');
        applyState(el);
        if(isOnline) sendAction('piece_update', s);
    }

    function trySnapToGrid(s) {
        const cx = s.x + 90; // Візуальний центр обертання
        const cy = s.y + 90;

        if (cx < BOARD_OFFSET_X || cx > BOARD_OFFSET_X + BOARD_SIZE * CELL_SIZE || 
            cy < BOARD_OFFSET_Y || cy > BOARD_OFFSET_Y + BOARD_SIZE * CELL_SIZE) {
            return false;
        }

        const gx = Math.floor((cx - BOARD_OFFSET_X) / CELL_SIZE);
        const gy = Math.floor((cy - BOARD_OFFSET_Y) / CELL_SIZE);
        
        let rotNorm = ((s.rot % 360) + 360) % 360;

        if (rotNorm === 0) {
            if (gx >= 0 && gx < BOARD_SIZE - 1 && gy >= 0 && gy < BOARD_SIZE) {
                if (grid[gy][gx] === null && grid[gy][gx+1] === null) {
                    s.gridX = gx; s.gridY = gy;
                    grid[gy][gx] = s.id; grid[gy][gx+1] = s.id;
                    s.x = BOARD_OFFSET_X + gx * CELL_SIZE;
                    s.y = BOARD_OFFSET_Y + gy * CELL_SIZE;
                    return true;
                }
            }
        } else if (rotNorm === 90) {
            if (gx >= 0 && gx < BOARD_SIZE && gy >= 0 && gy < BOARD_SIZE - 1) {
                if (grid[gy][gx] === null && grid[gy+1][gx] === null) {
                    s.gridX = gx; s.gridY = gy;
                    grid[gy][gx] = s.id; grid[gy+1][gx] = s.id;
                    s.x = BOARD_OFFSET_X + gx * CELL_SIZE;
                    s.y = BOARD_OFFSET_Y + gy * CELL_SIZE;
                    return true;
                }
            }
        } else if (rotNorm === 180) {
            if (gx >= 1 && gx < BOARD_SIZE && gy >= 0 && gy < BOARD_SIZE) {
                if (grid[gy][gx-1] === null && grid[gy][gx] === null) {
                    s.gridX = gx; s.gridY = gy;
                    grid[gy][gx-1] = s.id; grid[gy][gx] = s.id;
                    s.x = BOARD_OFFSET_X + gx * CELL_SIZE;
                    s.y = BOARD_OFFSET_Y + gy * CELL_SIZE;
                    return true;
                }
            }
        } else if (rotNorm === 270) {
            if (gx >= 0 && gx < BOARD_SIZE && gy >= 1 && gy < BOARD_SIZE) {
                if (grid[gy-1][gx] === null && grid[gy][gx] === null) {
                    s.gridX = gx; s.gridY = gy;
                    grid[gy-1][gx] = s.id; grid[gy][gx] = s.id;
                    s.x = BOARD_OFFSET_X + gx * CELL_SIZE;
                    s.y = BOARD_OFFSET_Y + gy * CELL_SIZE;
                    return true;
                }
            }
        }
        return false;
    }

    function removeFromGrid(s) {
        if (s.gridX !== -1) {
            let gx = s.gridX, gy = s.gridY;
            let rotNorm = ((s.rot % 360) + 360) % 360;
            grid[gy][gx] = null;
            if (rotNorm === 0) grid[gy][gx+1] = null;
            else if (rotNorm === 90) grid[gy+1][gx] = null;
            else if (rotNorm === 180) grid[gy][gx-1] = null;
            else if (rotNorm === 270) grid[gy-1][gx] = null;
            s.gridX = -1; s.gridY = -1;
        }
    }

</script>
