<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cave Age Card Game</title>
    
    <!-- Підключення Firebase (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <style>
        /* Скидання стилів та налаштування повноекранного режиму */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: radial-gradient(circle at 50% 100%, #8a2100 0%, #4a0d00 40%, #1a0500 80%, #0a0200 100%);
            font-family: Arial, sans-serif;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* SVG Фон: Печера та вогонь */
        #cave-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* Контейнер для стопки карт */
        #card-stage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s ease;
            transform-origin: center center;
        }

        /* Стилізація карток: квадратні, обрізані краї, заокруглені */
        .card {
            position: absolute;
            width: 400px;
            height: 400px;
            object-fit: cover;
            border-radius: 35px;
            clip-path: inset(12px round 35px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 100, 0, 0.3);
            background-color: #3e1a0b;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
            transform-origin: center center;
            border: 4px solid #5a200a;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 20px;
            text-align: center;
            font-weight: bold;
        }

        /* Анімація появи карти */
        .card.entering {
            transform: scale(0.2) translateY(500px) rotate(-30deg);
            opacity: 0;
        }

        /* Пуста колода - підказка для кліку */
        .deck-placeholder {
            width: 400px;
            height: 400px;
            border: 4px dashed #8a2100;
            border-radius: 35px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(40, 10, 0, 0.5);
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }

        /* Контейнер для кнопок управління */
        #controls {
            position: absolute;
            bottom: 30px;
            right: 30px;
            z-index: 10;
            display: flex;
            gap: 20px;
        }

        /* Стилізація кам'яних кнопок */
        .stone-btn {
            background: linear-gradient(135deg, #5c3a21, #3a2212);
            border: 3px solid #8c5a35;
            border-bottom-width: 8px;
            border-right-width: 6px;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.6), inset 2px 2px 5px rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, border-width 0.1s;
            width: 70px;
            height: 70px;
        }

        .stone-btn:active {
            transform: translate(4px, 4px);
            border-bottom-width: 3px;
            border-right-width: 3px;
        }

        .stone-btn svg {
            width: 40px;
            height: 40px;
            fill: #d97530;
            filter: drop-shadow(2px 2px 2px rgba(0,0,0,0.8));
        }

        /* Модальне вікно історії карток */
        #history-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(20, 5, 0, 0.9);
            backdrop-filter: blur(5px);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        #history-modal.active {
            opacity: 1;
            pointer-events: all;
        }

        #history-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 90%;
            max-height: 80%;
            overflow-y: auto;
            padding: 20px;
            scrollbar-width: thin;
            scrollbar-color: #8a2100 #2a0a00;
        }

        #history-grid::-webkit-scrollbar {
            width: 10px;
        }
        #history-grid::-webkit-scrollbar-thumb {
            background-color: #8a2100;
            border-radius: 10px;
        }

        .history-card {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 15px;
            clip-path: inset(5px round 15px);
            border: 2px solid #8a2100;
            box-shadow: 0 5px 15px rgba(0,0,0,0.8);
            transform: scale(0.9);
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: transparent;
            font-size: 14px;
            text-align: center;
        }

        .history-card:hover {
            transform: scale(1.1);
            z-index: 2;
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            background: transparent;
            border: none;
            cursor: pointer;
        }
        .close-btn svg {
            width: 60px;
            height: 60px;
            fill: #ff6a00;
            filter: drop-shadow(0 0 10px #ff0000);
        }

        /* Анімація іскор */
        @keyframes float-spark {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-100vh) scale(0); opacity: 0; }
        }
        .spark {
            position: absolute;
            bottom: 0;
            width: 6px;
            height: 6px;
            background: #ffaa00;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffaa00, 0 0 20px #ff3300;
            pointer-events: none;
            z-index: 2;
        }

        /* ---------------- УНІВЕРСАЛЬНІ СИСТЕМИ ---------------- */
        
        #block-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            color: red;
            font-size: 3rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0s, opacity 0.3s linear;
        }
        #block-overlay.active {
            visibility: visible;
            opacity: 1;
        }

        #theme-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 30px;
            background: rgba(255, 255, 255, 0.8);
            border: 2px solid #333;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            z-index: 95000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #theme-btn:hover { transform: scale(1.1); }
        #theme-modal {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            z-index: 96000;
            display: none;
            flex-direction: column;
            width: 90%;
            max-width: 600px;
        }
        #theme-modal.active { display: flex; }
        .theme-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
        }
        .theme-close { cursor: pointer; font-size: 1.5rem; color: #ff0000; }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 5px;
        }
        .theme-card {
            position: relative;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            border: 3px solid transparent;
            transition: transform 0.2s, border-color 0.2s;
            height: 80px;
            background: #eee;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .theme-card:hover { transform: scale(1.05); }
        .theme-card.selected { border-color: #27ae60; }
        .theme-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 12px;
            text-align: center;
            padding: 3px 0;
        }

        #global-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 90000;
            pointer-events: none; 
            background: transparent;
        }
        #toggle-draw-btn-global {
            position: fixed;
            bottom: 85px;
            right: 20px;
            background: #8e44ad;
            color: white;
            border: none;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            z-index: 95000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        #toggle-draw-btn-global:hover { transform: scale(1.05); }
        #draw-panel-global {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.95);
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 95001;
            display: none;
            flex-direction: column;
            gap: 10px;
            width: 200px;
            border: 2px solid #8e44ad;
        }
        .draw-handle {
            cursor: grab;
            background: #8e44ad;
            color: white;
            text-align: center;
            font-weight: bold;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 5px;
            user-select: none;
        }
        .draw-close {
            position: absolute;
            top: 20px;
            right: 25px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        .draw-controls { display: flex; flex-direction: column; gap: 8px; }
        .draw-btn {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            cursor: pointer;
            background: #f9f9f9;
            font-weight: bold;
            transition: background 0.2s;
        }
        .draw-btn.active { background: #dcdde1; border-color: #8e44ad; }
        .draw-btn.danger { background: #ff7675; color: white; border: none; }
        .draw-row { display: flex; gap: 5px; align-items: center; }
        .draw-row input[type="range"] { flex: 1; }
        .draw-row input[type="color"] { width: 100%; height: 30px; cursor: pointer; border: none; }

        #zoom-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        @media (max-width: 768px) {
            #controls { bottom: 85px; right: 10px; gap: 10px; }
            .stone-btn { width: 55px; height: 55px; padding: 10px; }
            .stone-btn svg { width: 30px; height: 30px; }
            .card, .deck-placeholder { width: 280px; height: 280px; }
            #theme-btn { bottom: 20px; left: 10px; width: 45px; height: 45px; }
            #toggle-draw-btn-global { bottom: 20px; right: 80px; font-size: 14px; padding: 8px 15px; }
            #zoom-controls { top: 10px; right: 10px; gap: 10px; }
        }
    </style>
</head>
<body>

    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <div id="zoom-controls">
        <div class="stone-btn" id="btn-zoom-in" title="Збільшити">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M12 10h-2v2H9v-2H7V9h2V7h1v2h2v1z"/></svg>
        </div>
        <div class="stone-btn" id="btn-zoom-out" title="Зменшити">
            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/><path d="M7 9h5v1H7z"/></svg>
        </div>
    </div>

    <svg id="cave-background" viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <defs>
            <linearGradient id="caveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#140400" />
                <stop offset="30%" stop-color="#2a0d02" />
                <stop offset="100%" stop-color="#000000" stop-opacity="0" />
            </linearGradient>
            <radialGradient id="fireGlow" cx="50%" cy="100%" r="60%">
                <stop offset="0%" stop-color="rgba(255, 60, 0, 0.4)" />
                <stop offset="50%" stop-color="rgba(200, 30, 0, 0.1)" />
                <stop offset="100%" stop-color="rgba(0, 0, 0, 0)" />
            </radialGradient>
            <filter id="rockTexture">
                <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" result="noise" />
                <feColorMatrix type="matrix" values="1 0 0 0 0  0 0.5 0 0 0  0 0.2 0 0 0  0 0 0 1 0" in="noise" result="coloredNoise" />
                <feComposite operator="in" in="coloredNoise" in2="SourceGraphic" result="texture" />
                <feBlend mode="multiply" in="texture" in2="SourceGraphic" />
            </filter>
        </defs>
        <rect width="100%" height="100%" fill="url(#fireGlow)" />
        <path d="M0,0 L1920,0 L1920,150 Q1800,300 1650,120 T1300,250 T950,100 T600,300 T300,80 Q150,200 0,100 Z" fill="url(#caveGrad)" filter="url(#rockTexture)" />
        <path d="M0,1080 L1920,1080 L1920,950 Q1750,850 1600,1000 T1200,880 T800,980 T400,850 L0,950 Z" fill="#1a0600" filter="url(#rockTexture)" />
    </svg>

    <div id="card-stage">
        <div class="deck-placeholder"></div>
    </div>

    <div id="controls">
        <div class="stone-btn" id="btn-history">
            <svg viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </div>
        <div class="stone-btn" id="btn-restart">
            <svg viewBox="0 0 24 24">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
        </div>
    </div>

    <div id="history-modal">
        <button class="close-btn" id="btn-close-history">
            <svg viewBox="0 0 24 24">
                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
        </button>
        <div id="history-grid"></div>
    </div>

    <button id="theme-btn" title="Налаштування фону">⚙️</button>
    <div id="theme-modal">
        <div class="theme-header">
            <span>Оберіть фон</span>
            <span class="theme-close" id="theme-close">✕</span>
        </div>
        <div id="theme-gallery">
            <div class="theme-card" data-bg="none">
                <div style="font-size: 24px; color: #555;">🚫</div>
                <div class="theme-title">Без фону</div>
            </div>
        </div>
    </div>

    <canvas id="global-canvas"></canvas>
    <button id="toggle-draw-btn-global">✏️ Малювати</button>
    <div id="draw-panel-global">
        <div class="draw-handle" id="draw-handle">Перемістити панель <span class="draw-close" id="draw-close">✕</span></div>
        <div class="draw-controls">
            <div class="draw-row">
                <button class="draw-btn active" id="btn-pencil">✏️ Олівець</button>
                <button class="draw-btn" id="btn-eraser">🧽 Гумка</button>
            </div>
            <div class="draw-row">
                <span style="font-size:12px;font-weight:bold;">Товщина:</span>
                <input type="range" id="draw-size" min="1" max="50" value="5">
            </div>
            <div class="draw-row">
                <span style="font-size:12px;font-weight:bold;">Колір:</span>
                <input type="color" id="draw-color" value="#ff0000">
            </div>
            <button class="draw-btn danger" id="btn-clear-draw">🗑️ Очистити</button>
        </div>
    </div>

    <script>
        const CONFIG = {
            gameId: 'caveAgeCardGame',
            projectId: 'lesson-13c44'
        };

        const firebaseConfig = {
            databaseURL: `https://${CONFIG.projectId}-default-rtdb.firebaseio.com/`,
            projectId: CONFIG.projectId
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function getQueryParam(param) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(param);
        }

        let myName = getQueryParam('user');
        if (myName) {
            sessionStorage.setItem('userName', myName);
        } else {
            myName = sessionStorage.getItem('userName');
            if (!myName) {
                myName = 'Гість_' + Math.floor(Math.random() * 100000);
                sessionStorage.setItem('userName', myName);
            }
        }
        const mySenderId = myName;

        const tabId = Math.random().toString(36).substr(2, 9);
        const userRef = db.ref(`online_users/${myName}/${tabId}`);
        const connectedRef = db.ref('.info/connected');

        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                userRef.set({
                    game: window.location.pathname.split('/').pop() || CONFIG.gameId,
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                userRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => userRef.remove());

        const blockOverlay = document.getElementById('block-overlay');
        db.ref(`blocked_users/${myName}`).on('value', (snap) => {
            if (snap.val() === true) blockOverlay.classList.add('active');
            else blockOverlay.classList.remove('active');
        });

        let isFirstRefreshCheck = true;
        db.ref('force_refresh').on('value', (snap) => {
            if (isFirstRefreshCheck) {
                isFirstRefreshCheck = false;
                return;
            }
            if (snap.val() === true) window.location.reload();
        });

        let isFirstActivityCheck = true;
        db.ref('current_activity').on('value', (snap) => {
            if (isFirstActivityCheck) {
                isFirstActivityCheck = false;
                return;
            }
            if (snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        // Ізольований та безпечний час з'єднання для запобігання дублюванню дій при старті
        const gameConnectTime = Date.now();
        let isRemoteAction = false;

        function sendGameAction(type, data = {}) {
            if (isRemoteAction) return;
            db.ref(`game_action/${CONFIG.gameId}`).push({
                senderId: mySenderId,
                clientTime: Date.now(),
                type: type,
                ...data
            });
            
            if (type === 'init_game' || type === 'draw_card') {
                db.ref(`game_state/${CONFIG.gameId}`).set({ deck: deck, history: history });
            }
        }

        let currentZoom = 1;
        const stageContainer = document.getElementById('card-stage');
        document.getElementById('btn-zoom-in').addEventListener('click', () => {
            currentZoom += 0.1;
            stageContainer.style.transform = `scale(${currentZoom})`;
        });
        document.getElementById('btn-zoom-out').addEventListener('click', () => {
            currentZoom -= 0.1;
            if (currentZoom < 0.3) currentZoom = 0.3;
            stageContainer.style.transform = `scale(${currentZoom})`;
        });

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playCardDrawSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function playStoneClickSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        let deck = [];
        let history = [];
        const stage = document.getElementById('card-stage');
        const historyGrid = document.getElementById('history-grid');
        const historyModal = document.getElementById('history-modal');
        const caveSvg = document.getElementById('cave-background');

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function initGame(remoteDeck = null, remoteHistory = null) {
            stage.innerHTML = '<div class="deck-placeholder"></div>';
            historyGrid.innerHTML = '';
            
            if (remoteDeck !== null) {
                deck = remoteDeck;
                history = remoteHistory || [];
            } else {
                deck = [];
                for (let i = 1; i <= 24; i++) {
                    if (i !== 11 && i !== 12) {
                        deck.push(`kartka_${i}.webp`);
                    }
                }
                shuffleArray(deck);
                history = [];
                sendGameAction('init_game', { deck: deck });
            }
        }

        function createSparks() {
            for (let i = 0; i < 5; i++) {
                const spark = document.createElement('div');
                spark.className = 'spark';
                spark.style.left = 45 + Math.random() * 10 + '%';
                spark.style.bottom = 10 + Math.random() * 20 + '%';
                spark.style.animation = `float-spark ${0.5 + Math.random()}s ease-in forwards`;
                document.body.appendChild(spark);
                setTimeout(() => spark.remove(), 1500);
            }
        }

        function performDrawVisuals(cardSrc, rot, x, y) {
            playCardDrawSound();
            createSparks();
            const img = document.createElement('img');
            img.src = cardSrc; 
            img.alt = `Помилка:\n${cardSrc}`;
            img.className = 'card entering';
            
            img.onerror = function() {
                this.style.backgroundColor = '#5c2c16';
                this.style.color = '#ffaa00';
            };

            stage.appendChild(img);
            void img.offsetWidth; 
            img.classList.remove('entering');
            img.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
        }

        function drawCard(remoteCard = null, remoteRot = null, remoteX = null, remoteY = null) {
            if (deck.length === 0 && !remoteCard) return;

            let cardSrc, randomRotation, randomOffsetX, randomOffsetY;

            if (remoteCard) {
                cardSrc = remoteCard;
                randomRotation = remoteRot;
                randomOffsetX = remoteX;
                randomOffsetY = remoteY;
                const idx = deck.indexOf(cardSrc);
                if (idx > -1) deck.splice(idx, 1);
            } else {
                cardSrc = deck.pop();
                randomRotation = (Math.random() - 0.5) * 16; 
                randomOffsetX = (Math.random() - 0.5) * 20;
                randomOffsetY = (Math.random() - 0.5) * 20;
                sendGameAction('draw_card', { cardSrc: cardSrc, rotation: randomRotation, offsetX: randomOffsetX, offsetY: randomOffsetY });
            }

            history.push(cardSrc);
            performDrawVisuals(cardSrc, randomRotation, randomOffsetX, randomOffsetY);
        }

        stage.addEventListener('click', (e) => {
            if (e.target.closest('#zoom-controls') || e.target.closest('.deck-placeholder') === null && e.target.closest('.card') === null && e.target.id !== 'card-stage') return;
            drawCard();
        });

        document.getElementById('btn-restart').addEventListener('click', (e) => {
            e.stopPropagation();
            playStoneClickSound();
            initGame();
        });

        document.getElementById('btn-history').addEventListener('click', (e) => {
            e.stopPropagation();
            playStoneClickSound();
            historyGrid.innerHTML = '';
            history.forEach(src => {
                const img = document.createElement('img');
                img.src = src;
                img.alt = `Помилка: ${src}`;
                img.className = 'history-card';
                img.onerror = function() { 
                    this.style.backgroundColor = '#5c2c16'; 
                    this.style.color = '#ffaa00';
                };
                historyGrid.appendChild(img);
            });
            historyModal.classList.add('active');
        });

        document.getElementById('btn-close-history').addEventListener('click', (e) => {
            e.stopPropagation();
            playStoneClickSound();
            historyModal.classList.remove('active');
        });

        db.ref(`game_state/${CONFIG.gameId}`).once('value', snap => {
            const state = snap.val();
            if (state && state.deck) {
                initGame(state.deck, state.history || []);
                const recentHistory = state.history ? state.history.slice(-5) : [];
                recentHistory.forEach((card) => {
                    const r = (Math.random() - 0.5) * 16;
                    const x = (Math.random() - 0.5) * 20;
                    const y = (Math.random() - 0.5) * 20;
                    performDrawVisuals(card, r, x, y);
                });
            } else {
                initGame();
            }
        });

        // Надійний слухач дій, який відсікає всі старі ходи завдяки фільтру по clientTime
        db.ref(`game_action/${CONFIG.gameId}`)
          .orderByChild('clientTime')
          .startAt(gameConnectTime)
          .on('child_added', (snap) => {
            const data = snap.val();
            if (!data || data.senderId === mySenderId) return;

            isRemoteAction = true;
            if (data.type === 'init_game') {
                initGame(data.deck);
            } else if (data.type === 'draw_card') {
                drawCard(data.cardSrc, data.rotation, data.offsetX, data.offsetY);
            }
            isRemoteAction = false;
        });

        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeClose = document.getElementById('theme-close');
        const themeGallery = document.getElementById('theme-gallery');

        themeBtn.addEventListener('click', () => themeModal.classList.add('active'));
        themeClose.addEventListener('click', () => themeModal.classList.remove('active'));

        function applyBackground(url) {
            if (url === 'none') {
                document.body.style.backgroundImage = 'none';
                document.body.style.backgroundColor = '#1a0500';
                caveSvg.style.display = 'block';
            } else {
                document.body.style.backgroundImage = `url('${url}')`;
                caveSvg.style.display = 'none';
            }
            localStorage.setItem('mySavedBg_' + CONFIG.gameId, url);
            
            document.querySelectorAll('.theme-card').forEach(c => c.classList.remove('selected'));
            const activeCard = document.querySelector(`.theme-card[data-bg="${url}"]`);
            if (activeCard) activeCard.classList.add('selected');
        }

        async function loadBackgrounds() {
            let index = 1;
            while (true) { 
                const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${index}.webp`;
                try {
                    const response = await fetch(url, { method: 'HEAD' });
                    if (response.ok) {
                        const card = document.createElement('div');
                        card.className = 'theme-card';
                        card.dataset.bg = url;
                        card.innerHTML = `<img src="${url}" alt="Фон ${index}"><div class="theme-title">Фон ${index}</div>`;
                        card.addEventListener('click', () => {
                            applyBackground(url);
                            db.ref(`game_theme/${CONFIG.gameId}`).set(url);
                        });
                        themeGallery.appendChild(card);
                        index++;
                    } else {
                        break; 
                    }
                } catch (e) {
                    break;
                }
            }
            
            const savedLocalBg = localStorage.getItem('mySavedBg_' + CONFIG.gameId);
            if (savedLocalBg) applyBackground(savedLocalBg);
        }
        
        document.querySelector('.theme-card[data-bg="none"]').addEventListener('click', () => {
            applyBackground('none');
            db.ref(`game_theme/${CONFIG.gameId}`).set('none');
        });

        db.ref(`game_theme/${CONFIG.gameId}`).on('value', (snap) => {
            const bgUrl = snap.val();
            if (bgUrl && bgUrl !== localStorage.getItem('mySavedBg_' + CONFIG.gameId)) {
                applyBackground(bgUrl);
            }
        });

        loadBackgrounds();


        const drawCanvas = document.getElementById('global-canvas');
        const drawCtx = drawCanvas.getContext('2d');
        const btnToggleDraw = document.getElementById('toggle-draw-btn-global');
        const drawPanel = document.getElementById('draw-panel-global');
        const btnDrawClose = document.getElementById('draw-close');
        
        let isDrawingMode = false;
        let isDrawing = false;
        let drawMode = 'pencil';
        let drawColor = '#ff0000';
        let drawSize = 5;
        let lastX = 0, lastY = 0;

        function resizeDrawCanvas() {
            drawCanvas.width = window.innerWidth;
            drawCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeDrawCanvas);
        resizeDrawCanvas();

        btnToggleDraw.addEventListener('click', () => {
            drawPanel.style.display = 'flex';
            drawCanvas.style.pointerEvents = 'auto';
            isDrawingMode = true;
            drawMode = 'pencil';
            document.getElementById('btn-pencil').classList.add('active');
            document.getElementById('btn-eraser').classList.remove('active');
        });
        
        btnDrawClose.addEventListener('click', () => {
            drawPanel.style.display = 'none';
            drawCanvas.style.pointerEvents = 'none'; 
            isDrawingMode = false;
        });

        document.getElementById('btn-pencil').addEventListener('click', (e) => {
            drawMode = 'pencil';
            e.target.classList.add('active');
            document.getElementById('btn-eraser').classList.remove('active');
        });
        document.getElementById('btn-eraser').addEventListener('click', (e) => {
            drawMode = 'eraser';
            e.target.classList.add('active');
            document.getElementById('btn-pencil').classList.remove('active');
        });
        document.getElementById('draw-size').addEventListener('input', (e) => drawSize = e.target.value);
        document.getElementById('draw-color').addEventListener('input', (e) => drawColor = e.target.value);

        function drawLine(x0, y0, x1, y1, color, size, mode, remote = false) {
            drawCtx.beginPath();
            drawCtx.moveTo(x0, y0);
            drawCtx.lineTo(x1, y1);
            drawCtx.strokeStyle = mode === 'eraser' ? 'rgba(0,0,0,1)' : color;
            drawCtx.lineWidth = size;
            drawCtx.lineCap = 'round';
            drawCtx.globalCompositeOperation = mode === 'eraser' ? 'destination-out' : 'source-over';
            drawCtx.stroke();
            
            if (!remote) {
                db.ref(`game_action_draw/${CONFIG.gameId}`).push({
                    type: 'draw_line',
                    x0: x0 / window.innerWidth, y0: y0 / window.innerHeight,
                    x1: x1 / window.innerWidth, y1: y1 / window.innerHeight,
                    color, size, mode, senderId: mySenderId,
                    clientTime: Date.now()
                });
            }
        }

        drawCanvas.addEventListener('mousedown', (e) => {
            if (!isDrawingMode) return;
            isDrawing = true;
            lastX = e.clientX; lastY = e.clientY;
        });
        drawCanvas.addEventListener('mousemove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            drawLine(lastX, lastY, e.clientX, e.clientY, drawColor, drawSize, drawMode);
            lastX = e.clientX; lastY = e.clientY;
        });
        drawCanvas.addEventListener('mouseup', () => isDrawing = false);
        drawCanvas.addEventListener('mouseout', () => isDrawing = false);

        drawCanvas.addEventListener('touchstart', (e) => {
            if (!isDrawingMode) return;
            isDrawing = true;
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        }, {passive:false});
        drawCanvas.addEventListener('touchmove', (e) => {
            if (!isDrawing || !isDrawingMode) return;
            e.preventDefault();
            drawLine(lastX, lastY, e.touches[0].clientX, e.touches[0].clientY, drawColor, drawSize, drawMode);
            lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
        }, {passive:false});
        drawCanvas.addEventListener('touchend', () => isDrawing = false);

        document.getElementById('btn-clear-draw').addEventListener('click', () => {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            db.ref(`game_action_draw/${CONFIG.gameId}`).push({ 
                type: 'clear_canvas', 
                senderId: mySenderId,
                clientTime: Date.now()
            });
        });

        // Ізольований слухач для малювання
        const drawingConnectTime = Date.now();
        db.ref(`game_action_draw/${CONFIG.gameId}`)
          .orderByChild('clientTime')
          .startAt(drawingConnectTime)
          .on('child_added', snap => {
            const data = snap.val();
            if (!data || data.senderId === mySenderId) return;
            
            if (data.type === 'draw_line') {
                drawLine(data.x0 * window.innerWidth, data.y0 * window.innerHeight, 
                         data.x1 * window.innerWidth, data.y1 * window.innerHeight, 
                         data.color, data.size, data.mode, true);
            } else if (data.type === 'clear_canvas') {
                drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
            }
        });

        const drawHandle = document.getElementById('draw-handle');
        let isDraggingPanel = false, panelOffsetX, panelOffsetY;
        drawHandle.addEventListener('mousedown', (e) => {
            if(e.target === btnDrawClose) return;
            isDraggingPanel = true;
            panelOffsetX = e.clientX - drawPanel.offsetLeft;
            panelOffsetY = e.clientY - drawPanel.offsetTop;
        });
        document.addEventListener('mousemove', (e) => {
            if (!isDraggingPanel) return;
            drawPanel.style.left = (e.clientX - panelOffsetX) + 'px';
            drawPanel.style.top = (e.clientY - panelOffsetY) + 'px';
        });
        document.addEventListener('mouseup', () => isDraggingPanel = false);
        
        drawHandle.addEventListener('touchstart', (e) => {
            if(e.target === btnDrawClose) return;
            isDraggingPanel = true;
            panelOffsetX = e.touches[0].clientX - drawPanel.offsetLeft;
            panelOffsetY = e.touches[0].clientY - drawPanel.offsetTop;
        }, {passive:true});
        document.addEventListener('touchmove', (e) => {
            if (!isDraggingPanel) return;
            drawPanel.style.left = (e.touches[0].clientX - panelOffsetX) + 'px';
            drawPanel.style.top = (e.touches[0].clientY - panelOffsetY) + 'px';
        }, {passive:true});
        document.addEventListener('touchend', () => isDraggingPanel = false);

    </script>
</body>
</html>
