<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game</title>
    
    <!-- Підключення Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.11/firebase-database-compat.js"></script>

    <style>
        /* CSS Змінні для динамічного масштабування поля */
        :root {
            --grid-size: 10;
            --cell-size: 48px;
        }

        /* Скидання стилів та базові налаштування */
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            user-select: none; 
        }
        
        /* Живий, сюжетний фон: магічні хащі (початковий стан, перекривається Theme Manager) */
        body {
            background: radial-gradient(circle at 50% 50%, #1e5a4a 0%, #08211a 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            transition: background-image 0.5s ease;
        }

        /* Анімовані елементи фону (світлячки/пилок) */
        .spore {
            position: absolute;
            background: rgba(188, 255, 188, 0.6);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(188, 255, 188, 0.4);
            pointer-events: none;
            z-index: 0;
            animation: float-up infinite linear;
        }

        @keyframes float-up {
            0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
            20% { opacity: 0.8; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }

        /* Головний контейнер для позиціонування поля та кнопок */
        #main-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            z-index: 1;
        }

        /* Контейнер ігрового поля (зроблено прозорим для фонів) */
        #game-board {
            background: rgba(17, 56, 43, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 16px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(38, 107, 86, 0.5);
            position: relative;
        }

        /* Права панель з розмірами та кнопкою далі (горизонтальна) */
        #right-panel {
            display: flex;
            flex-direction: row;
            gap: 25px;
            align-items: center;
        }

        /* Панель вибору розміру поля (Квадратна) */
        #size-selector {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            background: rgba(17, 56, 43, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 0 2px rgba(38, 107, 86, 0.5);
            justify-items: center;
        }

        .size-label {
            grid-column: 1 / -1; /* Розтягується на обидві колонки */
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-bottom: 5px;
            text-align: center;
        }

        .size-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s;
            font-family: Arial, sans-serif;
        }

        .size-btn:hover { background: rgba(255,255,255,0.3); }
        .size-btn.active {
            background: #06D6A0;
            border-color: #FFF;
            color: #11382b;
            box-shadow: 0 0 15px rgba(6, 214, 160, 0.8);
            transform: scale(1.15);
        }

        /* Динамічна сітка */
        #grid {
            display: grid;
            grid-template-columns: repeat(var(--grid-size), var(--cell-size));
            grid-template-rows: repeat(var(--grid-size), var(--cell-size));
            gap: 6px;
            background-color: rgba(5, 20, 15, 0.2);
            padding: 10px;
            border-radius: 12px;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.3);
            margin: 0 auto;
        }

        /* Клітинки */
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            box-shadow: 0 4px 0 rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.2);
            transition: transform 0.1s, filter 0.2s;
        }

        /* Візерунок на клітинках */
        .cell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 2px, transparent 2px, transparent 8px);
            pointer-events: none;
            border-radius: 10px;
        }

        /* SVG іконки в клітинках */
        .cell svg {
            width: 75%;
            height: 75%;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6));
            z-index: 2;
        }

        /* Ефект натискання */
        .cell:active:not(.shake) {
            transform: translateY(4px);
            box-shadow: 0 0 0 rgba(0,0,0,0.3), inset 0 2px 5px rgba(255,255,255,0.2);
        }

        /* АКТИВНА КЛІТИНКА (Рамка без розмиття) */
        .cell.active {
            box-shadow: 0 0 0 4px #FFF;
            transform: scale(1.05);
            z-index: 10;
            animation: pulse-glow 1s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 2px #FFF; transform: scale(1.02); }
            100% { box-shadow: 0 0 0 5px #FFF; transform: scale(1.08); }
        }

        /* ФІШКА ГРАВЦЯ (Рамка/куточки без розмиття) */
        #player-token {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            pointer-events: none;
            animation: pulse-token 1.5s infinite alternate;
        }

        @keyframes pulse-token {
            0% { transform: scale(0.95); }
            100% { transform: scale(1.05); }
        }

        /* КЛІТИНКА ЦІЛІ (Надійна рамка поверх клітинки без розмиття) */
        .target-cell::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 4px solid #FF0000;
            border-radius: 10px;
            animation: pulse-target 1s infinite alternate;
            z-index: 15;
            pointer-events: none;
        }

        @keyframes pulse-target {
            0% { border-width: 2px; border-color: #FF4500; transform: scale(0.98); }
            100% { border-width: 5px; border-color: #FF0000; transform: scale(1.02); }
        }

        /* Анімація помилки */
        .shake {
            animation: shake-anim 0.3s cubic-bezier(.36,.07,.19,.97) both;
            z-index: 5;
        }

        @keyframes shake-anim {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px) rotate(-5deg); }
            50% { transform: translateX(6px) rotate(5deg); }
            75% { transform: translateX(-6px) rotate(-5deg); }
        }

        /* Анімація успішного вибору (хвиля) */
        .pop {
            animation: pop-anim 0.4s ease-out;
        }

        @keyframes pop-anim {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.2); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }

        /* Кнопка далі (Стрілка вправо) */
        #btn-next {
            background: linear-gradient(to bottom, #FFD166, #F4A261);
            border: none;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 8px 0 #E76F51, 0 15px 20px rgba(0,0,0,0.5), inset 0 4px 5px rgba(255,255,255,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s;
            position: relative;
        }

        #btn-next:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #E76F51, 0 5px 10px rgba(0,0,0,0.5), inset 0 4px 5px rgba(255,255,255,0.6);
        }

        #btn-next svg {
            width: 38px;
            height: 38px;
            fill: #780000;
            margin-left: 5px;
        }

        /* --- THEME MANAGER UI --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            border: 2px solid white;
            transition: transform 0.2s;
        }
        #theme-btn:hover { transform: scale(1.1); }

        #theme-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            z-index: 1001;
            justify-content: center;
            align-items: center;
        }
        
        #theme-modal {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            max-height: 60vh;
            display: flex;
            flex-direction: column;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        #theme-modal h2 { margin-bottom: 15px; text-align: center; font-size: 20px; }
        #theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 15px;
            overflow-y: auto;
            padding-right: 10px;
            flex-grow: 1;
        }
        .theme-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            background-size: cover;
            background-position: center;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            overflow: hidden;
            transition: transform 0.2s, border 0.2s;
        }
        .theme-thumb:hover { transform: scale(1.05); border: 2px solid #06D6A0; }
        .theme-thumb span {
            width: 100%;
            background: rgba(0,0,0,0.6);
            color: white;
            text-align: center;
            font-size: 12px;
            padding: 4px 0;
            pointer-events: none;
        }
        #theme-close {
            margin-top: 15px;
            padding: 10px;
            background: #EF476F;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        /* Адаптивність (Mobile Friendly) */
        @media (max-width: 800px) {
            #main-layout {
                flex-direction: column;
                gap: 20px;
            }
            #right-panel {
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                width: 100%;
            }
            #size-selector {
                padding: 15px;
            }
            :root {
                --cell-size: 40px;
            }
            #btn-next { width: 65px; height: 65px; }
            #btn-next svg { width: 32px; height: 32px; }
        }
        @media (max-width: 480px) {
            :root {
                --cell-size: 32px;
            }
            .size-btn { width: 35px; height: 35px; font-size: 14px; }
            #grid { gap: 4px; padding: 6px; }
        }
        @media (max-width: 380px) {
            :root {
                --cell-size: 26px;
            }
            #grid { gap: 3px; }
        }

        /* --- БЛОК ДОСТУПУ --- */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            color: #ff3333;
            font-size: 2.5rem;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            font-weight: bold;
        }

        /* Фідбек перемоги */
        #win-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 9000;
            display: none; justify-content: center; align-items: center;
            background: rgba(255, 255, 255, 0);
        }
        #win-overlay.active {
            display: flex;
            animation: flash 1.5s ease-out;
        }
        .win-star {
            font-size: 150px;
            animation: pop-star 0.8s cubic-bezier(.36,-0.04,.15,1.64) forwards;
            filter: drop-shadow(0 0 20px #FFD166);
        }
        @keyframes flash { 0% { background: rgba(255, 255, 255, 0.7); } 100% { background: rgba(255, 255, 255, 0); } }
        @keyframes pop-star { 0% { transform: scale(0) rotate(-180deg); opacity: 0; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
    </style>
</head>
<body>

    <!-- Overlay блокування доступу -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <!-- Overlay фідбеку перемоги -->
    <div id="win-overlay">
        <div class="win-star">🏆</div>
    </div>

    <!-- Theme Manager кнопка та модальне вікно -->
    <div id="theme-btn">⚙️</div>
    <div id="theme-modal-overlay">
        <div id="theme-modal">
            <h2>Виберіть фон</h2>
            <div id="theme-grid"></div>
            <button id="theme-close">Закрити</button>
        </div>
    </div>

    <div id="main-layout">
        <!-- Поле зліва -->
        <div id="game-board">
            <div id="grid"></div>
        </div>

        <!-- Права панель з вибором розміру і кнопкою далі (горизонтальна) -->
        <div id="right-panel">
            <!-- Квадратна панель розміру -->
            <div id="size-selector">
                <span class="size-label">Поле:</span>
                <button class="size-btn active" data-size="10">10</button>
                <button class="size-btn" data-size="9">9</button>
                <button class="size-btn" data-size="8">8</button>
                <button class="size-btn" data-size="7">7</button>
                <button class="size-btn" data-size="6">6</button>
                <button class="size-btn" data-size="5">5</button>
            </div>

            <!-- Кнопка далі справа від панелі -->
            <button id="btn-next">
                <svg viewBox="0 0 24 24">
                    <path d="M19,12 l-10,-8 v5 h-4 v6 h4 v5 z" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // --- 1. ІНІЦІАЛІЗАЦІЯ FIREBASE ТА КОНТРОЛЬ ДОСТУПУ ---
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        
        let db;
        let isFirebaseActive = false;
        
        try {
            if (typeof firebase !== 'undefined') {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseActive = true;
            }
        } catch(e) {
            console.warn("Firebase не вдалося ініціалізувати (локальний режим)", e);
        }

        // Ідентифікація
        let myName = new URLSearchParams(window.location.search).get('user') || sessionStorage.getItem('myName');
        if (!myName) {
            myName = "Гість_" + Math.floor(Math.random() * 1000);
        }
        sessionStorage.setItem('myName', myName);
        
        // Унікальна вкладка
        const tabId = Math.random().toString(36).substr(2, 9);
        
        if (isFirebaseActive) {
            // Радар
            const presenceRef = db.ref(`online_users/${myName}/${tabId}`);
            db.ref('.info/connected').on('value', snap => {
                if (snap.val()) {
                    presenceRef.onDisconnect().remove();
                    presenceRef.set(true);
                }
            });
            window.addEventListener('beforeunload', () => { presenceRef.remove(); });
            
            // Блокування доступу
            db.ref(`blocked_users/${myName}`).on('value', snap => {
                document.getElementById('block-overlay').style.display = snap.val() ? 'flex' : 'none';
            });
            
            // Повернення в лоббі з імунітетом 1с
            let immunity = true;
            setTimeout(() => { immunity = false; }, 1000);
            db.ref('current_activity').on('value', snap => {
                if (!immunity && snap.val() === 'lobby') {
                    window.location.href = `https://olgazheltvai2.github.io/rizne/lobby.html?user=${encodeURIComponent(myName)}`;
                }
            });
            
            // Перепідключення (із захистом від миттєвого спрацьовування при старті)
            let ignoreFirstRefresh = true;
            db.ref('force_refresh').on('value', snap => {
                if (ignoreFirstRefresh) {
                    ignoreFirstRefresh = false;
                    return;
                }
                if (snap.val()) window.location.reload();
            });
        }

        // --- 2. СИСТЕМА ДИНАМІЧНИХ ФОНІВ (THEME MANAGER) ---
        const themeBtn = document.getElementById('theme-btn');
        const themeModalOverlay = document.getElementById('theme-modal-overlay');
        const themeClose = document.getElementById('theme-close');
        const themeGrid = document.getElementById('theme-grid');
        
        themeBtn.onclick = () => { themeModalOverlay.style.display = 'flex'; };
        themeClose.onclick = () => { themeModalOverlay.style.display = 'none'; };
        
        function applyTheme(url) {
            document.body.style.backgroundImage = `url(${url})`;
            document.body.style.backgroundSize = 'cover';
            document.body.style.backgroundPosition = 'center';
            localStorage.setItem('mySavedGameBg', url);
        }

        function selectTheme(url) {
            if (isFirebaseActive) db.ref('game_theme').set(url);
            applyTheme(url);
            themeModalOverlay.style.display = 'none';
        }

        // Завантаження збереженого або з бази
        const savedTheme = localStorage.getItem('mySavedGameBg');
        if (savedTheme) applyTheme(savedTheme);
        if (isFirebaseActive) {
            db.ref('game_theme').on('value', snap => {
                if (snap.val()) applyTheme(snap.val());
            });
        }

        // Послідовне завантаження фонів (запобігає блокуванню GitHub Rate Limit)
        let currentBgIndex = 1;
        function loadNextTheme() {
            const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${currentBgIndex}.webp`;
            const img = new Image();
            
            img.onload = () => {
                const div = document.createElement('div');
                div.className = 'theme-thumb';
                div.style.backgroundImage = `url(${url})`;
                div.innerHTML = `<span>Фон ${currentBgIndex}</span>`;
                div.onclick = () => selectTheme(url);
                themeGrid.appendChild(div);
                
                currentBgIndex++;
                loadNextTheme(); // Завантажуємо наступний ТІЛЬКИ якщо поточний існує
            };
            
            img.onerror = () => {
                // Якщо помилка (404) - значить фони закінчились, зупиняємо цикл
                console.log("Завантаження фонів завершено. Знайдено:", currentBgIndex - 1);
            };
            
            img.src = url;
        }
        loadNextTheme();

        // --- 3. АУДІО СИНТЕЗАТОР ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playTone(freq, type, dur, vol = 0.1) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(vol, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        function playSelect() { 
            playTone(800, 'sine', 0.15, 0.15); 
            setTimeout(() => playTone(1200, 'sine', 0.1, 0.1), 50);
        }
        function playError() { 
            playTone(200, 'sawtooth', 0.2, 0.2); 
            setTimeout(() => playTone(150, 'sawtooth', 0.3, 0.2), 100);
        }
        function playNext() {
            [400, 600, 800, 1000].forEach((f, i) => {
                setTimeout(() => playTone(f, 'square', 0.1, 0.1), i * 50);
            });
        }
        function playWinSound() {
            [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                setTimeout(() => playTone(f, 'triangle', 0.4, 0.2), i * 150);
            });
        }

        // --- 4. КОНФІГУРАЦІЯ ГРИ ТА UI РОЗМІРУ ---
        let SIZE = 10;
        // Оновлені кольори: зелений та синій тепер максимально відрізняються
        const COLORS = ['#EF476F', '#00D26A', '#FFD166', '#1D70F5', '#9D4EDD'];
        
        const SHAPES = [
            `<path d="M50,15 C75,15 90,40 90,60 C90,80 50,90 50,90 C50,90 10,80 10,60 C10,40 25,15 50,15 Z M50,15 L50,85 M30,50 L50,70 M70,50 L50,70 M35,35 L50,50 M65,35 L50,50" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`,
            `<path d="M50,50 m-25,0 a25,25 0 1,1 50,0 a25,25 0 1,1 -50,0 M50,50 m0,-25 a25,25 0 1,1 0,50 a25,25 0 1,1 0,-50 M50,50 m-17,-17 a25,25 0 1,1 34,34 a25,25 0 1,1 -34,-34 M50,50 m17,-17 a25,25 0 1,1 -34,34 a25,25 0 1,1 34,-34" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="50" cy="50" r="10" fill="currentColor"/>`,
            `<path d="M50,90 C20,90 15,60 30,40 C45,20 70,20 80,40 C90,60 75,80 60,80 C45,80 35,65 40,55 C45,45 55,45 60,50 C65,55 60,60 55,60" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round"/>`,
            `<path d="M50,15 C50,15 20,55 20,70 C20,86.5 33.5,100 50,100 C66.5,100 80,86.5 80,70 C80,55 50,15 50,15 Z" fill="none" stroke="currentColor" stroke-width="6"/><path d="M35,65 Q35,80 50,85" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><circle cx="60" cy="60" r="4" fill="currentColor"/>`,
            `<path d="M50,10 L85,40 L50,90 L15,40 Z M15,40 L85,40 M50,10 L50,90 M30,25 L50,40 L70,25 M30,60 L50,40 L70,60" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>`
        ];

        let gridData = [];
        let activeCellCoords = null; 
        let currentStart = null;
        let currentTarget = null;
        let gameFinished = false;

        const gridEl = document.getElementById('grid');

        // Живий фон (світлячки)
        function createBackgroundSpores() {
            for(let i = 0; i < 25; i++) {
                let spore = document.createElement('div');
                spore.className = 'spore';
                spore.style.left = Math.random() * 100 + 'vw';
                spore.style.width = spore.style.height = (Math.random() * 6 + 2) + 'px';
                spore.style.animationDuration = (Math.random() * 10 + 5) + 's';
                spore.style.animationDelay = Math.random() * 10 + 's';
                document.body.appendChild(spore);
            }
        }

        // Обробка кнопок розміру
        document.querySelectorAll('.size-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                const newSize = parseInt(e.target.dataset.size);
                if (SIZE !== newSize) {
                    SIZE = newSize;
                    updateSizeUI();
                    initBoard(true); // Генеруємо нове поле і відправляємо в Firebase
                }
            });
        });

        function updateSizeUI() {
            document.documentElement.style.setProperty('--grid-size', SIZE);
            document.querySelectorAll('.size-btn').forEach(b => {
                b.classList.toggle('active', parseInt(b.dataset.size) === SIZE);
            });
        }

        // --- 5. АЛГОРИТМ ПЕРЕВІРКИ ШЛЯХІВ (DFS) ---
        // Гарантує, що існує мінімум потрібна кількість варіантів дійти до мети
        function countPaths(start, target, grid) {
            let pathsFound = 0;
            let visited = new Set();
            
            function dfs(x, y, depth) {
                if (pathsFound >= 3) return; 
                if (depth > 5) return; // Обмеження глибини
                
                if (x === target.x && y === target.y) {
                    pathsFound++;
                    return;
                }
                
                let key = `${x},${y}`;
                if (visited.has(key)) return;
                visited.add(key);
                
                const currentData = grid[y][x];
                
                // Перевірка горизонтальних стрибків на будь-яку відстань
                for (let nx = 0; nx < SIZE; nx++) {
                    if (nx !== x) {
                        const targetData = grid[y][nx];
                        if (currentData.color === targetData.color || currentData.shape === targetData.shape) {
                            dfs(nx, y, depth + 1);
                        }
                    }
                }
                // Перевірка вертикальних стрибків на будь-яку відстань
                for (let ny = 0; ny < SIZE; ny++) {
                    if (ny !== y) {
                        const targetData = grid[ny][x];
                        if (currentData.color === targetData.color || currentData.shape === targetData.shape) {
                            dfs(x, ny, depth + 1);
                        }
                    }
                }
                
                visited.delete(key);
            }
            
            dfs(start.x, start.y, 0);
            return pathsFound;
        }

        // --- 6. ЛОГІКА І СИНХРОНІЗАЦІЯ ГРИ ---
        
        function sendAction(type, x = null, y = null) {
            if (!isFirebaseActive) return;
            const actionData = {
                type: type,
                senderId: tabId,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                x: x,
                y: y,
                fullState: {
                    grid: gridData,
                    start: currentStart,
                    target: currentTarget,
                    activeCoords: activeCellCoords,
                    finished: gameFinished
                }
            };
            db.ref('game_action').set(actionData);
        }

        function restoreState(state) {
            gridData = state.grid;
            currentStart = state.start;
            currentTarget = state.target;
            activeCellCoords = state.activeCoords;
            gameFinished = state.finished;
            
            // Якщо інший гравець змінив розмір - підлаштовуємо свій інтерфейс
            if (gridData && gridData.length && SIZE !== gridData.length) {
                SIZE = gridData.length;
                updateSizeUI();
            }
            
            renderBoardFromData();
        }

        let isFirstSync = true;
        let localInitTime = Date.now();

        if (isFirebaseActive) {
            db.ref('game_action').on('value', snap => {
                const data = snap.val();
                
                if (isFirstSync) {
                    isFirstSync = false;
                    if (data && data.timestamp && (Date.now() - data.timestamp < 12 * 60 * 60 * 1000) && data.fullState) {
                        restoreState(data.fullState);
                        return;
                    } else {
                        initBoard(true);
                        return;
                    }
                }

                if (!data || data.senderId === tabId) return; 
                if (data.timestamp && data.timestamp < localInitTime) return; 
                
                if (data.fullState) {
                    restoreState(data.fullState);
                }
            });
        } else {
            initBoard(true);
        }

        // Генерація нового поля з ГАРАНТІЄЮ мінімум 3 шляхів
        function initBoard(sync = true) {
            gridEl.innerHTML = '';
            gridData = [];
            activeCellCoords = null;
            gameFinished = false;

            let validBoard = false;
            let attempts = 0;
            
            // Fallback змінні, якщо 3 шляхи не знайдено за 300 спроб (актуально для поля 5х5)
            let bestGrid = null;
            let bestStart = null;
            let bestTarget = null;
            let maxPathsFound = 0;

            while (!validBoard && attempts < 300) {
                attempts++;
                let tempGrid = [];
                for(let y = 0; y < SIZE; y++) {
                    let row = [];
                    for(let x = 0; x < SIZE; x++) {
                        row.push({
                            color: Math.floor(Math.random() * COLORS.length),
                            shape: Math.floor(Math.random() * SHAPES.length)
                        });
                    }
                    tempGrid.push(row);
                }
                
                let tempStart = { x: Math.floor(Math.random()*SIZE), y: Math.floor(Math.random()*SIZE) };
                let tempTarget = { x: 0, y: 0 };
                do {
                    tempTarget = { x: Math.floor(Math.random()*SIZE), y: Math.floor(Math.random()*SIZE) };
                } while (tempTarget.x === tempStart.x && tempTarget.y === tempStart.y);

                // Перевірка алгоритмом DFS
                let paths = countPaths(tempStart, tempTarget, tempGrid);
                
                if (paths > maxPathsFound) {
                    maxPathsFound = paths;
                    bestGrid = JSON.parse(JSON.stringify(tempGrid));
                    bestStart = { ...tempStart };
                    bestTarget = { ...tempTarget };
                }

                if (paths >= 3) {
                    validBoard = true;
                    gridData = tempGrid;
                    currentStart = tempStart;
                    currentTarget = tempTarget;
                }
            }

            // Якщо за 300 спроб не знайдено 3 шляхи, беремо найкраще з того, що було
            if (!validBoard && bestGrid) {
                gridData = bestGrid;
                currentStart = bestStart;
                currentTarget = bestTarget;
            }

            activeCellCoords = { x: currentStart.x, y: currentStart.y };
            renderBoardFromData();

            if (sync) {
                sendAction('init_board');
            }
        }

        function renderBoardFromData() {
            gridEl.innerHTML = '';
            
            for(let y = 0; y < SIZE; y++) {
                for(let x = 0; x < SIZE; x++) {
                    const cellData = gridData[y][x];
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.x = x;
                    cell.dataset.y = y;
                    
                    cell.style.backgroundColor = COLORS[cellData.color];
                    const strokeColor = (cellData.color === 2 || cellData.color === 1) ? '#1A1A1A' : '#FFFFFF';
                    cell.innerHTML = `<svg viewBox="0 0 100 100" style="color: ${strokeColor}">${SHAPES[cellData.shape]}</svg>`;
                    
                    cell.addEventListener('click', () => handleCellClick(x, y, cell));
                    gridEl.appendChild(cell);
                }
            }

            if (currentTarget) {
                const targetEl = document.querySelector(`.cell[data-x="${currentTarget.x}"][data-y="${currentTarget.y}"]`);
                if (targetEl) targetEl.classList.add('target-cell');
            }

            if (activeCellCoords) {
                const startEl = document.querySelector(`.cell[data-x="${activeCellCoords.x}"][data-y="${activeCellCoords.y}"]`);
                if (startEl) setActiveCell(activeCellCoords.x, activeCellCoords.y, startEl, true);
            }
        }

        // Обробка ходу (рух по горизонталі/вертикалі)
        function handleCellClick(x, y, cellEl, sync = true) {
            if (gameFinished) return;
            if (!activeCellCoords) return;

            const isAligned = (activeCellCoords.x === x) || (activeCellCoords.y === y);
            
            if (isAligned) {
                const currentData = gridData[activeCellCoords.y][activeCellCoords.x];
                const targetData = gridData[y][x];

                if (currentData.color === targetData.color || currentData.shape === targetData.shape) {
                    setActiveCell(x, y, cellEl);
                    playSelect();
                    
                    if (x === currentTarget.x && y === currentTarget.y) {
                        triggerWin();
                    }
                    
                    if (sync) sendAction('move', x, y);
                } else {
                    triggerError(cellEl);
                }
            } else {
                triggerError(cellEl);
            }
        }

        // Переміщення активної клітинки та фішки
        function setActiveCell(x, y, cellEl, isSilent = false) {
            if (activeCellCoords) {
                const prevCell = document.querySelector(`.cell[data-x="${activeCellCoords.x}"][data-y="${activeCellCoords.y}"]`);
                if (prevCell) prevCell.classList.remove('active');
            }
            
            activeCellCoords = { x, y };
            cellEl.classList.add('active');
            
            let token = document.getElementById('player-token');
            if (!token) {
                token = document.createElement('div');
                token.id = 'player-token';
                // Фішка змінена на "куточки/рамку", щоб не закривати малюнок під нею
                token.innerHTML = `<svg viewBox="0 0 100 100" style="width:100%; height:100%;">
                    <path d="M 15 35 L 15 15 L 35 15" fill="none" stroke="#06D6A0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 85 35 L 85 15 L 65 15" fill="none" stroke="#06D6A0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 85 65 L 85 85 L 65 85" fill="none" stroke="#06D6A0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M 15 65 L 15 85 L 35 85" fill="none" stroke="#06D6A0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>`;
            }
            cellEl.appendChild(token);
            
            if (!isSilent) {
                cellEl.classList.remove('pop');
                void cellEl.offsetWidth; 
                cellEl.classList.add('pop');
            }
        }

        function triggerError(cellEl) {
            playError();
            cellEl.classList.remove('shake');
            void cellEl.offsetWidth; 
            cellEl.classList.add('shake');
        }

        function triggerWin() {
            gameFinished = true;
            playWinSound();
            const overlay = document.getElementById('win-overlay');
            overlay.classList.add('active');
            setTimeout(() => {
                overlay.classList.remove('active');
            }, 1500);
        }

        function executeNextLevel(sync = true) {
            playNext();
            gridEl.style.transition = 'opacity 0.2s';
            gridEl.style.opacity = '0';
            
            setTimeout(() => {
                initBoard(sync);
                gridEl.style.opacity = '1';
            }, 200);
        }

        document.getElementById('btn-next').addEventListener('click', () => {
            executeNextLevel(true);
        });

        // Запуск фонових ефектів та ініціалізація
        createBackgroundSpores();
        updateSizeUI();

    </script>
