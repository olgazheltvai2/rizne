  // =========================================================================
  // СТАТИЧНИЙ ФОН КУХНІ (малюється один раз в offscreen-canvas для 60 FPS)
  // =========================================================================
  function buildKitchenBackground() {
    const off = document.createElement('canvas');
    off.width = W; off.height = H;
    const c = off.getContext('2d');

    // Тепла стіна старої кухні
    const wall = c.createRadialGradient(780, 380, 90, 800, 440, 1050);
    wall.addColorStop(0, '#6e472b');
    wall.addColorStop(0.5, '#462b1a');
    wall.addColorStop(1, '#22120a');
    c.fillStyle = wall;
    c.fillRect(0, 0, W, H);

    // Керамічна плитка на задньому плані (праворуч і ліворуч)
    c.save();
    c.globalAlpha = 0.28;
    for (let tx = 0; tx < W; tx += 74) {
      for (let ty = 220; ty < 640; ty += 74) {
        const shade = ((tx + ty) % 148 === 0) ? '#8f6544' : '#7a5234';
        c.fillStyle = shade;
        c.fillRect(tx + 2, ty + 2, 70, 70);
        c.strokeStyle = '#2e190c';
        c.lineWidth = 2;
        c.strokeRect(tx + 2, ty + 2, 70, 70);
      }
    }
    c.restore();

    // Металева витяжка зверху по центру
    const hood = c.createLinearGradient(520, 0, 1080, 0);
    hood.addColorStop(0, '#363538');
    hood.addColorStop(0.35, '#727278');
    hood.addColorStop(0.55, '#999aa1');
    hood.addColorStop(1, '#2a292d');
    c.fillStyle = hood;
    c.beginPath();
    c.moveTo(640, 0); c.lineTo(960, 0);
    c.lineTo(1060, 175); c.lineTo(540, 175);
    c.closePath(); c.fill();
    c.fillStyle = '#242226';
    c.fillRect(534, 168, 532, 16);
    c.strokeStyle = 'rgba(255,235,205,0.22)'; c.lineWidth = 2;
    c.beginPath(); c.moveTo(545, 168); c.lineTo(1055, 168); c.stroke();

    // Дерев'яні полиці (ліворуч і праворуч)
    function drawShelf(sx, sy, sw) {
      c.fillStyle = 'rgba(0,0,0,0.42)';
      c.fillRect(sx + 6, sy + 18, sw, 14);
      const sg = c.createLinearGradient(sx, sy, sx, sy + 22);
      sg.addColorStop(0, '#804d29'); sg.addColorStop(0.5, '#593218'); sg.addColorStop(1, '#361c0c');
      c.fillStyle = sg;
      c.beginPath(); c.roundRect(sx, sy, sw, 20, 4); c.fill();
      c.strokeStyle = '#241106'; c.lineWidth = 2; c.stroke();
      // Кронштейни
      c.fillStyle = '#291a12';
      c.fillRect(sx + 26, sy + 20, 12, 34);
      c.fillRect(sx + sw - 38, sy + 20, 12, 34);
    }

    function drawJar(jx, jy, jw, jh, fillColor, fillLevel = 0.72) {
      // Тінь банки
      c.fillStyle = 'rgba(0,0,0,0.28)';
      c.beginPath(); c.ellipse(jx + jw / 2, jy + jh + 2, jw * 0.55, 5, 0, 0, Math.PI * 2); c.fill();
      // Вміст
      const contentH = jh * fillLevel;
      const cg = c.createLinearGradient(jx, jy, jx + jw, jy);
      cg.addColorStop(0, fillColor); cg.addColorStop(1, '#26140a');
      c.fillStyle = cg;
      c.beginPath(); c.roundRect(jx + 4, jy + jh - contentH, jw - 8, contentH - 3, 6); c.fill();
      // Скло
      c.fillStyle = 'rgba(255, 242, 220, 0.16)';
      c.strokeStyle = 'rgba(255, 232, 195, 0.42)'; c.lineWidth = 2;
      c.beginPath(); c.roundRect(jx, jy, jw, jh, 9); c.fill(); c.stroke();
      // Блік на склі
      c.fillStyle = 'rgba(255,255,255,0.28)';
      c.fillRect(jx + 6, jy + 8, 5, jh - 16);
      // Кришка / корок
      c.fillStyle = '#9c6c3f';
      c.beginPath(); c.roundRect(jx + 5, jy - 11, jw - 10, 13, 4); c.fill();
      c.strokeStyle = '#3d240f'; c.lineWidth = 1.5; c.stroke();
    }

    // Ліві полиці та банки зі спеціями
    drawShelf(20, 115, 230);
    drawJar(45, 36, 48, 78, '#b83c20', 0.8);
    drawJar(108, 46, 52, 68, '#d99e30', 0.65);
    drawJar(174, 30, 46, 84, '#5e8232', 0.78);

    drawShelf(15, 265, 245);
    drawJar(34, 192, 54, 72, '#d46c2a', 0.75);
    drawJar(102, 180, 56, 84, '#9e532b', 0.6);
    drawJar(174, 198, 50, 66, '#ccb25e', 0.85);

    // Рейлінг із кухонним приладдям ліворуч
    c.fillStyle = '#7a4b29';
    c.fillRect(24, 338, 200, 8);
    [54, 96, 138, 184].forEach((ux, i) => {
      c.strokeStyle = '#a89f96'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(ux, 344); c.lineTo(ux, 430 + (i % 2) * 18); c.stroke();
      c.fillStyle = i === 0 ? '#78757a' : '#8a522a';
      c.beginPath();
      if (i === 0) c.arc(ux, 456, 24, 0, Math.PI * 2);
      else c.ellipse(ux, 446 + (i % 2) * 18, 10, 18, 0, 0, Math.PI * 2);
      c.fill();
    });

    // Обробна дошка на задній стільниці ліворуч
    const boardG = c.createLinearGradient(255, 340, 360, 520);
    boardG.addColorStop(0, '#965c30'); boardG.addColorStop(1, '#593216');
    c.fillStyle = boardG;
    c.beginPath(); c.roundRect(245, 355, 118, 155, 14); c.fill();
    c.strokeStyle = '#30190a'; c.lineWidth = 3; c.stroke();

    // Праві полиці
    drawShelf(1265, 128, 320);
    drawShelf(1275, 286, 310);
    drawJar(1352, 206, 56, 78, '#668736', 0.82);
    drawJar(1426, 214, 52, 70, '#c24327', 0.72);
    drawJar(1498, 202, 54, 82, '#d49a35', 0.66);

    // Задня стільниця кухні
    const cntG = c.createLinearGradient(0, 520, 0, 650);
    cntG.addColorStop(0, '#663c1e'); cntG.addColorStop(0.4, '#472711'); cntG.addColorStop(1, '#261206');
    c.fillStyle = cntG;
    c.fillRect(0, 525, W, 175);
    c.strokeStyle = '#210f05'; c.lineWidth = 4;
    c.beginPath(); c.moveTo(0, 525); c.lineTo(W, 525); c.stroke();

    // Пучок сушених трав ліворуч від витяжки
    c.save(); c.translate(345, 20);
    c.strokeStyle = '#5c4123'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(0, 0); c.lineTo(0, 48); c.stroke();
    for (let i = 0; i < 24; i++) {
      const ang = (i - 12) * 0.065;
      const len = 75 + (i % 4) * 28;
      c.fillStyle = i % 2 ? '#4d6e28' : '#37521b';
      c.beginPath();
      c.ellipse(Math.sin(ang) * len * 0.55, 55 + Math.cos(ang) * len * 0.75, 11, 28, -ang * 1.4, 0, Math.PI * 2);
      c.fill();
    }
    c.strokeStyle = '#c4985a'; c.lineWidth = 6;
    c.beginPath(); c.moveTo(-14, 52); c.lineTo(14, 52); c.stroke();
    c.restore();

    // Теплий віньєт по краях
    const vig = c.createRadialGradient(W * 0.5, H * 0.45, 350, W * 0.5, H * 0.5, 1020);
    vig.addColorStop(0, 'rgba(255,190,110,0.06)');
    vig.addColorStop(1, 'rgba(10,4,1,0.52)');
    c.fillStyle = vig;
    c.fillRect(0, 0, W, H);

    bgCache = off;
  }

  // =========================================================================
  // ЖИВІ КАСТРУЛЬКИ З ОЧИМА НА ПОЛИЦЯХ
  // =========================================================================
  function drawLivingPot(c, x, y, w, h, lookX, lookY, mood, blink, t) {
    c.save();
    const hop = mood === 'happy' ? Math.abs(Math.sin(t * 14)) * -12 : (mood === 'shock' ? Math.sin(t * 40) * 3 : 0);
    c.translate(x, y + hop);

    // Тінь
    c.fillStyle = 'rgba(0,0,0,0.4)';
    c.beginPath(); c.ellipse(0, h / 2 + 4, w * 0.55, 8, 0, 0, Math.PI * 2); c.fill();

    // Ручки
    c.strokeStyle = '#3d3e42'; c.lineWidth = 6;
    c.beginPath(); c.arc(-w / 2, 0, 12, Math.PI * 0.5, Math.PI * 1.5); c.stroke();
    c.beginPath(); c.arc(w / 2, 0, 12, -Math.PI * 0.5, Math.PI * 0.5); c.stroke();

    // Металевий корпус
    const pg = c.createLinearGradient(-w / 2, 0, w / 2, 0);
    pg.addColorStop(0, '#44464d'); pg.addColorStop(0.28, '#9da0a8');
    pg.addColorStop(0.55, '#686b73'); pg.addColorStop(1, '#292a2e');
    c.fillStyle = pg;
    c.beginPath(); c.roundRect(-w / 2, -h / 2, w, h, 10); c.fill();
    c.strokeStyle = '#1c1d20'; c.lineWidth = 2.5; c.stroke();

    // Ободок зверху
    c.fillStyle = '#aeb1ba';
    c.beginPath(); c.roundRect(-w / 2 - 4, -h / 2 - 4, w + 8, 9, 4); c.fill();

    // Очі, що стежать за дією
    const dx = lookX - x, dy = lookY - y;
    const ang = Math.atan2(dy, dx);
    const dist = Math.min(4.2, Math.hypot(dx, dy) / 90);
    const ex = Math.cos(ang) * dist, ey = Math.sin(ang) * dist;

    [-w * 0.2, w * 0.2].forEach(ox => {
      const er = mood === 'shock' ? 12.5 : 10.5;
      c.fillStyle = '#faf6ed';
      c.beginPath();
      if (blink) c.ellipse(ox, -4, er, 2, 0, 0, Math.PI * 2);
      else c.arc(ox, -4, er, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = '#292726'; c.lineWidth = 2; c.stroke();
      if (!blink) {
        c.fillStyle = '#1c1614';
        c.beginPath(); c.arc(ox + ex, -4 + ey, mood === 'shock' ? 3.8 : 5.2, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#fff';
        c.beginPath(); c.arc(ox + ex - 1.8, -6 + ey, 2, 0, Math.PI * 2); c.fill();
      }
    });

    // Ротик
    c.strokeStyle = '#262322'; c.lineWidth = 3; c.lineCap = 'round';
    c.beginPath();
    if (mood === 'happy') {
      c.arc(0, 12, 11, 0.15, Math.PI - 0.15);
    } else if (mood === 'shock') {
      c.fillStyle = '#261412';
      c.ellipse(0, 18, 7, 9, 0, 0, Math.PI * 2); c.fill();
    } else {
      c.arc(0, 10, 8, 0.3, Math.PI - 0.3);
    }
    c.stroke();

    c.restore();
  }

  // =========================================================================
  // СТАН ГРИ, ФІЗИКА ЧАСТИНОК ТА АНІМАЦІЯ КУХАРЯ
  // =========================================================================
  const CAULDRON = { x: 785, y: 545, mouthY: 422, rx: 220 };
  const CONVEYOR_Y = 746;

  let cycleStage = 0;       // 0..3 -> на 4-му раунді тиск досягає піку -> ФІНАЛ!
  let cycleCount = 0;       // Безкінечний генератор циклів
  let sequence = [];        // Послідовність ID предметів
  let beltItems = [];       // Об'єкти на конвеєрі { id, x, targetX, baseY, hover, bounce, wrongShake }
  let inputIndex = 0;       // Поточний крок гравця
  let state = 'demo';       // 'demo' | 'input' | 'round_win' | 'finale'
  let stateTimer = 0;

  // Демонстрація кухаря
  let demoStep = 0;
  let demoPhase = 'reach';  // 'reach' | 'hold' | 'drop' | 'pause'
  let demoT = 0;
  let chefHeldItem = null;

  // Анімація кухаря та казана
  let chefMood = 'normal';  // 'normal' | 'happy' | 'shock' | 'excited'
  let chefMoodT = 0;
  let cauldronShake = 0;
  let cauldronHeat = 0;     // 0..1 (на фіналі росте до 1!)
  let pressureNeedle = 0.08;
  let targetPressure = 0.08;
  let beltScroll = 0;
  let mouseX = W * 0.5, mouseY = H * 0.5;
  let hoveredIdx = -1;

  // Фінальний політ кухаря на ополонику
  let finalePhase = 0;      // 0: нагрів, 1: ВИБУХ+політ, 2: спуск на парашуті-ковпаку
  let finaleT = 0;
  let chefFlyY = 0, chefFlyX = 0, chefFlyRot = 0;

  // Масиви живих частинок
  const steam = [];
  const sparks = [];
  const splashes = [];
  const bubbles = [];
  const smokePuffs = [];
  const flyingItems = [];
  const popcorn = [];
  const confetti = [];
  const soapBubbles = [];

  // Ініціалізація фонової пари
  for (let i = 0; i < 24; i++) {
    steam.push({
      x: CAULDRON.x + (Math.random() - 0.5) * 280,
      y: CAULDRON.mouthY - Math.random() * 340,
      r: 26 + Math.random() * 44,
      vx: (Math.random() - 0.5) * 18,
      vy: -36 - Math.random() * 32,
      a: Math.random() * 0.35
    });
  }

  function spawnSparks(x, y, count = 16, speedMul = 1, hueShift = 0) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = (90 + Math.random() * 260) * speedMul;
      sparks.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 90,
        life: 0.35 + Math.random() * 0.45,
        maxLife: 0.8,
        size: 2.2 + Math.random() * 3.5,
        color: hueShift ? `hsl(${38 + Math.random() * 25}, 100%, 72%)` : `hsl(${28 + Math.random() * 28}, 100%, 68%)`
      });
    }
  }

  function spawnSplash(x, y, intensity = 1, tint = '#f7e5c3') {
    for (let i = 0; i < Math.floor(18 * intensity); i++) {
      const a = -Math.PI * (0.15 + Math.random() * 0.7);
      const sp = (160 + Math.random() * 260) * intensity;
      splashes.push({
        x: x + (Math.random() - 0.5) * 60,
        y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        r: 4 + Math.random() * 8 * intensity,
        life: 0.55 + Math.random() * 0.35,
        color: tint
      });
    }
    for (let i = 0; i < Math.floor(8 * intensity); i++) {
      bubbles.push({
        x: CAULDRON.x + (Math.random() - 0.5) * 260,
        y: CAULDRON.mouthY + (Math.random() - 0.5) * 14,
        r: 5 + Math.random() * 14,
        vy: -30 - Math.random() * 55,
        life: 0.9 + Math.random() * 0.8
      });
    }
  }

  function spawnSmoke(x, y, count = 12, color = '#66755d') {
    for (let i = 0; i < count; i++) {
      smokePuffs.push({
        x: x + (Math.random() - 0.5) * 70,
        y: y + (Math.random() - 0.5) * 20,
        vx: (Math.random() - 0.5) * 90,
        vy: -70 - Math.random() * 80,
        r: 18 + Math.random() * 28,
        life: 0.9 + Math.random() * 0.5,
        maxLife: 1.4,
        color
      });
    }
  }

  function triggerFinaleExplosion() {
    Sound.playFinaleBoom();
    cauldronShake = 28;
    spawnSparks(CAULDRON.x, CAULDRON.mouthY - 20, 75, 2.2, 1);

    // 110 шматочків попкорну!
    for (let i = 0; i < 110; i++) {
      const a = -Math.PI * (0.08 + Math.random() * 0.84);
      const sp = 280 + Math.random() * 680;
      popcorn.push({
        x: CAULDRON.x + (Math.random() - 0.5) * 180,
        y: CAULDRON.mouthY - 10,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 180,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 12,
        s: 0.7 + Math.random() * 0.9,
        life: 4.5 + Math.random() * 1.5
      });
    }

    // 95 різнокольорових конфеті
    const colors = ['#ff4f5e', '#ffd93d', '#3be8b0', '#4db8ff', '#ff7ae5', '#ff9f43'];
    for (let i = 0; i < 95; i++) {
      const a = -Math.PI * (0.05 + Math.random() * 0.9);
      const sp = 220 + Math.random() * 620;
      confetti.push({
        x: CAULDRON.x + (Math.random() - 0.5) * 200,
        y: CAULDRON.mouthY - 20,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 120,
        w: 10 + Math.random() * 10,
        h: 5 + Math.random() * 6,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 10,
        color: colors[i % colors.length],
        life: 4.8 + Math.random() * 1.5
      });
    }

    // 42 райдужні мильні бульбашки
    for (let i = 0; i < 42; i++) {
      soapBubbles.push({
        x: CAULDRON.x + (Math.random() - 0.5) * 320,
        y: CAULDRON.mouthY - Math.random() * 60,
        vx: (Math.random() - 0.5) * 180,
        vy: -120 - Math.random() * 240,
        r: 14 + Math.random() * 28,
        wobble: Math.random() * Math.PI * 2,
        life: 4.5 + Math.random() * 1.8
      });
    }
  }

  // =========================================================================
  // ГЕНЕРАТОР ЗАВДАНЬ (БЕЗКІНЕЧНИЙ, АДАПТОВАНИЙ ДЛЯ 3–4 КЛАСУ)
  // =========================================================================
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startNewRound(advanceStage = false) {
    if (advanceStage) {
      cycleStage++;
      if (cycleStage >= 4) {
        cycleStage = 0;
        cycleCount++;
      }
    }

    // Довжина послідовності: цикл 1 -> 2, 3, 4, 5; наступні цикли -> 3, 4, 5, 5 (весело і підсильно!)
    const seqLen = cycleCount === 0 ? (2 + cycleStage) : Math.min(6, 3 + cycleStage);
    const beltCount = Math.min(ALL_ITEMS.length, Math.max(6, seqLen + 2));

    // Вибираємо предмети на конвеєр
    const chosenPool = shuffle(ALL_ITEMS).slice(0, beltCount);

    // Генеруємо послідовність (можуть повторюватись, але без двох однакових поспіль на початку)
    sequence = [];
    for (let i = 0; i < seqLen; i++) {
      let pick;
      let guard = 0;
      do {
        pick = chosenPool[Math.floor(Math.random() * chosenPool.length)].id;
        guard++;
      } while (guard < 8 && i > 0 && sequence[i - 1] === pick && Math.random() < 0.7);
      sequence.push(pick);
    }

    // Розміщуємо предмети на конвеєрі (заїжджають зліва з плавним рухом!)
    const leftPad = 145, rightPad = 240;
    const span = W - leftPad - rightPad;
    const stepX = span / Math.max(1, chosenPool.length - 1);
    beltItems = chosenPool.map((item, idx) => ({
      id: item.id,
      color: item.color,
      targetX: leftPad + idx * stepX,
      x: leftPad + idx * stepX - 420 - idx * 45,
      baseY: CONVEYOR_Y - 12,
      hover: 0,
      bounce: 0,
      wrongShake: 0
    }));

    inputIndex = 0;
    demoStep = 0;
    demoPhase = 'reach';
    demoT = 0;
    chefHeldItem = null;
    chefMood = 'normal';
    state = 'demo';
    stateTimer = 0;
    targetPressure = 0.08 + cycleStage * 0.21;
    cauldronHeat = cycleStage * 0.14;
    flyingItems.length = 0;
  }

  function startFinale() {
    state = 'finale';
    finalePhase = 0;
    finaleT = 0;
    chefHeldItem = null;
    chefFlyX = 0; chefFlyY = 0; chefFlyRot = 0;
    targetPressure = 1.0;
    Sound.playSteamBuild();
  }

  // Кнопка "ДАЛІ ➔" одразу генерує наступне завдання без проходження!
  nextBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    Sound.unlock();
    Sound.playClick();
    if (state === 'finale') {
      popcorn.length = 0; confetti.length = 0; soapBubbles.length = 0;
      cycleStage = 0;
      cycleCount++;
      startNewRound(false);
    } else {
      startNewRound(true);
    }
  });

  // =========================================================================
  // МАЛЮВАННЯ МІДНОЇ ТРУБИ, КАЗАНА, КУХАРЯ ТА КОНВЕЄРА
  // =========================================================================
  function drawCopperPipe(c, t) {
    c.save();
    // Тінь труби
    c.fillStyle = 'rgba(0,0,0,0.32)';
    c.fillRect(468, 120, 74, 410);

    // Вертикальна мідна труба
    function pipeSeg(x, y, w, h, horizontal = false) {
      const g = horizontal
        ? c.createLinearGradient(x, y, x, y + h)
        : c.createLinearGradient(x, y, x + w, y);
      g.addColorStop(0, '#542611');
      g.addColorStop(0.28, '#cf7d46');
      g.addColorStop(0.48, '#f5ba84');
      g.addColorStop(0.75, '#994c23');
      g.addColorStop(1, '#3b180a');
      c.fillStyle = g;
      c.beginPath(); c.roundRect(x, y, w, h, 8); c.fill();
      c.strokeStyle = '#2b1006'; c.lineWidth = 2.5; c.stroke();
    }

    // Нижній відвід у казан
    pipeSeg(486, 488, 130, 56, true);
    // Головний стояк
    pipeSeg(454, 112, 74, 428, false);
    // Верхній гусак, з якого ллється пара/окріп у казан
    pipeSeg(508, 224, 132, 48, true);
    pipeSeg(604, 232, 46, 116, false);

    // Фланці з заклепками
    [[444, 110, 94, 24], [444, 212, 94, 22], [444, 342, 94, 22], [596, 336, 62, 18]].forEach(([fx, fy, fw, fh]) => {
      pipeSeg(fx, fy, fw, fh, true);
      c.fillStyle = '#f2c191';
      for (let rx = fx + 12; rx < fx + fw - 8; rx += 22) {
        c.beginPath(); c.arc(rx, fy + fh / 2, 3.2, 0, Math.PI * 2); c.fill();
      }
    });

    // Струмінь гарячої пінної води з труби в казан
    const wg = c.createLinearGradient(612, 354, 642, 430);
    wg.addColorStop(0, 'rgba(235, 244, 250, 0.78)');
    wg.addColorStop(1, 'rgba(255, 238, 200, 0.25)');
    c.fillStyle = wg;
    const wob = Math.sin(t * 14) * 3;
    c.beginPath();
    c.moveTo(612, 354); c.lineTo(642, 354);
    c.lineTo(646 + wob, 435); c.lineTo(608 + wob, 435);
    c.closePath(); c.fill();

    // Бічний клапан, що іноді пускає іскри
    c.fillStyle = '#7a3719';
    c.fillRect(436, 408, 22, 18);
    c.strokeStyle = '#291006'; c.strokeRect(436, 408, 22, 18);

    c.restore();
  }

  function drawChef(c, t) {
    c.save();
    let cx = 1105 + chefFlyX;
    let cy = 345 + chefFlyY;
    const breath = Math.sin(t * 3.1) * 4;
    const happyBounce = chefMood === 'happy' ? Math.abs(Math.sin(t * 16)) * -18 : 0;
    const shockRecoil = chefMood === 'shock' ? Math.sin(t * 38) * 7 : 0;

    c.translate(cx + shockRecoil, cy + breath + happyBounce);
    c.rotate(chefFlyRot);

    // Якщо кухар летить на ополонику у фіналі — малюємо гігантський мідний ополоник!
    if (state === 'finale' && finalePhase >= 1) {
      c.save();
      c.translate(0, 145);
      c.rotate(-0.22);
      const lg = c.createLinearGradient(-150, -10, 140, 10);
      lg.addColorStop(0, '#f2b87e'); lg.addColorStop(0.5, '#a8572a'); lg.addColorStop(1, '#52220d');
      c.fillStyle = lg;
      c.beginPath(); c.roundRect(-160, -9, 280, 18, 8); c.fill();
      c.strokeStyle = '#331407'; c.lineWidth = 3; c.stroke();
      // Чаша ополоника
      const cup = c.createRadialGradient(130, -4, 6, 135, 8, 48);
      cup.addColorStop(0, '#ffd4a3'); cup.addColorStop(0.5, '#bd6431'); cup.addColorStop(1, '#54220b');
      c.fillStyle = cup;
      c.beginPath(); c.arc(135, 6, 42, 0, Math.PI); c.closePath(); c.fill(); c.stroke();
      c.restore();
    }

    // ---- ТУЛУБ ТА ФАРТУХ ----
    const torsoG = c.createLinearGradient(-115, 0, 120, 260);
    torsoG.addColorStop(0, '#ebe0cc'); torsoG.addColorStop(0.6, '#cbbca3'); torsoG.addColorStop(1, '#7d6e58');
    c.fillStyle = torsoG;
    c.beginPath();
    c.moveTo(-115, 35);
    c.quadraticCurveTo(-135, 130, -118, 255);
    c.lineTo(118, 255);
    c.quadraticCurveTo(135, 130, 108, 35);
    c.quadraticCurveTo(0, 0, -115, 35);
    c.closePath(); c.fill();
    c.strokeStyle = '#47392a'; c.lineWidth = 3; c.stroke();

    // Лямки фартуха та плями соусу для живого реалізму
    c.strokeStyle = '#9e8d75'; c.lineWidth = 5;
    c.beginPath(); c.moveTo(-58, 30); c.lineTo(-65, 225); c.stroke();
    c.beginPath(); c.moveTo(58, 30); c.lineTo(65, 225); c.stroke();
    // Кумедні плями соусу на фартуху
    c.fillStyle = 'rgba(130, 62, 26, 0.32)';
    c.beginPath(); c.ellipse(-22, 148, 22, 16, 0.3, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(34, 185, 14, 11, -0.4, 0, Math.PI * 2); c.fill();
    c.fillStyle = 'rgba(176, 54, 24, 0.24)';
    c.beginPath(); c.arc(8, 126, 8, 0, Math.PI * 2); c.fill();

    // Ліва рука (жестикулює)
    c.save();
    const lArmAng = state === 'finale' && finalePhase >= 1
      ? -0.9 + Math.sin(t * 18) * 0.45
      : (chefMood === 'happy' ? -0.55 + Math.sin(t * 16) * 0.25 : 0.12 + Math.sin(t * 2.5) * 0.08);
    c.translate(92, 65);
    c.rotate(lArmAng);
    // Рукав
    c.fillStyle = '#ddd0ba';
    c.beginPath(); c.roundRect(-24, -18, 118, 56, 26); c.fill();
    c.strokeStyle = '#4f4030'; c.lineWidth = 2.8; c.stroke();
    // Кисть
    const handG = c.createRadialGradient(108, 6, 4, 110, 10, 32);
    handG.addColorStop(0, '#ffcfb0'); handG.addColorStop(1, '#c97d55');
    c.fillStyle = handG;
    c.beginPath(); c.ellipse(112, 12, 28, 21, 0.15, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#733e24'; c.lineWidth = 2.2; c.stroke();
    c.restore();

    // ---- ГОЛОВА ----
    c.save();
    const headTilt = chefMood === 'shock' ? 0.14 : (chefHeldItem ? -0.14 : Math.sin(t * 1.9) * 0.04);
    c.translate(0, -68);
    c.rotate(headTilt);

    // Розпатлане сиве волосся з боків
    c.fillStyle = '#6b635e';
    [-76, 76].forEach((hx, idx) => {
      c.beginPath();
      c.ellipse(hx, -8, 22, 30, idx === 0 ? -0.3 : 0.3, 0, Math.PI * 2);
      c.fill();
    });

    // Вуха
    c.fillStyle = '#d98f68';
    c.beginPath(); c.ellipse(-74, 4, 13, 20, -0.1, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(74, 4, 13, 20, 0.1, 0, Math.PI * 2); c.fill();

    // Обличчя
    const faceG = c.createRadialGradient(-16, -12, 12, 0, 8, 86);
    faceG.addColorStop(0, '#ffd8bc'); faceG.addColorStop(0.55, '#ebaa83'); faceG.addColorStop(1, '#b56a45');
    c.fillStyle = faceG;
    c.beginPath();
    c.ellipse(0, 6, 72, 78, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#6e3b22'; c.lineWidth = 2.8; c.stroke();

    // Рум'яні щоки
    c.fillStyle = 'rgba(224, 92, 68, 0.34)';
    c.beginPath(); c.ellipse(-42, 16, 18, 12, 0, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(42, 16, 18, 12, 0, 0, Math.PI * 2); c.fill();

    // Очі (стежать за предметом або мишею)
    const targetX = chefHeldItem ? chefHeldItem.x : mouseX;
    const targetY = chefHeldItem ? chefHeldItem.y : mouseY;
    const lookAng = Math.atan2(targetY - (cy - 68), targetX - cx);
    const px = Math.cos(lookAng) * 5.2, py = Math.sin(lookAng) * 4.5;
    const eyeBlink = (Math.sin(t * 0.9) > 0.985) && chefMood === 'normal';

    [-26, 24].forEach((ex, i) => {
      const er = chefMood === 'shock' ? 18 : 14.5;
      c.fillStyle = '#fffaf2';
      c.beginPath();
      if (eyeBlink) c.ellipse(ex, -14, er, 2.2, 0, 0, Math.PI * 2);
      else c.ellipse(ex, -14, er, er * 1.06, 0, 0, Math.PI * 2);
      c.fill();
      c.strokeStyle = '#5c311c'; c.lineWidth = 2.2; c.stroke();
      if (!eyeBlink) {
        c.fillStyle = '#472a18';
        c.beginPath(); c.arc(ex + px, -14 + py, chefMood === 'shock' ? 5.2 : 7.5, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#120a05';
        c.beginPath(); c.arc(ex + px, -14 + py, 3.8, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#ffffff';
        c.beginPath(); c.arc(ex + px - 2.6, -17 + py, 2.6, 0, Math.PI * 2); c.fill();
      }
      // Густі кудлаті брови
      c.save();
      const browLift = chefMood === 'shock' ? -14 : (chefMood === 'happy' ? -7 : 0);
      c.translate(ex, -34 + browLift);
      c.rotate((i === 0 ? -0.18 : 0.18) * (chefMood === 'shock' ? -1.4 : 1));
      c.fillStyle = '#594a42';
      c.beginPath(); c.ellipse(0, 0, 21, 7.5, 0, 0, Math.PI * 2); c.fill();
      c.restore();
    });

    // Смішний округлий ніс
    const noseG = c.createRadialGradient(-5, 2, 2, 0, 8, 22);
    noseG.addColorStop(0, '#ffbfa3'); noseG.addColorStop(0.6, '#db7b58'); noseG.addColorStop(1, '#9e472b');
    c.fillStyle = noseG;
    c.beginPath(); c.ellipse(0, 10, 19, 15, 0, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#73341e'; c.lineWidth = 2; c.stroke();

    // Рот (під вусами)
    c.save();
    if (chefMood === 'shock') {
      c.fillStyle = '#3b110d';
      c.beginPath(); c.ellipse(0, 48, 16, 20, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#753924'; c.lineWidth = 2.5; c.stroke();
    } else {
      c.fillStyle = '#571812';
      c.beginPath();
      c.arc(0, 36, chefMood === 'happy' ? 28 : 22, 0.1, Math.PI - 0.1);
      c.closePath(); c.fill();
      // Білі зубки
      c.fillStyle = '#fff9ed';
      c.fillRect(-16, 38, 32, 8);
    }
    c.restore();

    // РОЗКІШНІ ПРУЖНІ ВУСА
    const mWig = Math.sin(t * (chefMood === 'happy' ? 22 : 5)) * 0.08;
    [-1, 1].forEach(dir => {
      c.save();
      c.translate(dir * 6, 26);
      c.rotate(dir * (0.06 + mWig));
      const mg = c.createLinearGradient(0, -12, dir * 75, 22);
      mg.addColorStop(0, '#786254'); mg.addColorStop(0.5, '#47362c'); mg.addColorStop(1, '#291e18');
      c.fillStyle = mg;
      c.beginPath();
      c.moveTo(0, -6);
      c.bezierCurveTo(dir * 26, -18, dir * 64, -6, dir * 82, 8);
      c.bezierCurveTo(dir * 68, 26, dir * 32, 24, 0, 12);
      c.closePath(); c.fill();
      c.strokeStyle = '#241710'; c.lineWidth = 2; c.stroke();
      c.restore();
    });

    // ПИШНИЙ КУХАРСЬКИЙ КОВПАК (у фіналі при спуску роздувається як парашут!)
    const hatScale = (state === 'finale' && finalePhase === 2) ? 1.55 : 1;
    const hatTilt = chefMood === 'shock' ? 0.22 : Math.sin(t * 2.4) * 0.03;
    c.save();
    c.translate(4, -68);
    c.rotate(hatTilt);
    c.scale(hatScale, hatScale);
    const hg = c.createRadialGradient(-25, -75, 16, 0, -52, 115);
    hg.addColorStop(0, '#ffffff'); hg.addColorStop(0.55, '#ede4d5'); hg.addColorStop(1, '#a89b87');
    c.fillStyle = hg;
    // Пишні хмарки ковпака
    c.beginPath();
    c.arc(-44, -64, 42, 0, Math.PI * 2);
    c.arc(46, -60, 42, 0, Math.PI * 2);
    c.arc(2, -88, 52, 0, Math.PI * 2);
    c.fill();
    // Нижній обідок ковпака
    c.fillStyle = '#dfd4c1';
    c.beginPath(); c.roundRect(-64, -46, 128, 48, 12); c.fill();
    c.strokeStyle = '#756857'; c.lineWidth = 2.6; c.stroke();
    // Складки
    c.strokeStyle = 'rgba(120,104,86,0.38)'; c.lineWidth = 2.4;
    [-30, 0, 30].forEach(fx => {
      c.beginPath(); c.moveTo(fx, -44); c.quadraticCurveTo(fx * 1.15, -78, fx * 0.9, -104); c.stroke();
    });
    c.restore();

    c.restore(); // кінець голови

    // ---- ПРАВА РУКА (КИДАЄ ПРЕДМЕТИ В КАЗАН!) ----
    // Ціль руки в локальних координатах кухаря
    let targetHandX = -155, targetHandY = 65;
    if (state === 'demo') {
      if (demoPhase === 'reach') {
        const p = Math.min(1, demoT / 0.35);
        targetHandX = -155 - p * 125;
        targetHandY = 55 - Math.sin(p * Math.PI) * 140 - p * 95;
      } else if (demoPhase === 'hold') {
        const p = Math.min(1, demoT / 0.55);
        targetHandX = -315 + Math.sin(t * 9) * 8;
        targetHandY = -58 - Math.sin(p * Math.PI) * 28;
      } else if (demoPhase === 'drop') {
        targetHandX = -320;
        targetHandY = -30 + Math.min(1, demoT / 0.25) * 42;
      } else {
        targetHandX = -210;
        targetHandY = 25;
      }
    } else if (state === 'finale' && finalePhase >= 1) {
      targetHandX = -135;
      targetHandY = -95 + Math.sin(t * 20) * 35;
    } else if (chefMood === 'happy') {
      targetHandX = -175;
      targetHandY = -30 + Math.sin(t * 16) * 24;
    }

    // Малюємо руку (плече -> лікоть -> кисть)
    const shX = -88, shY = 52;
    const midX = (shX + targetHandX) * 0.52;
    const midY = (shY + targetHandY) * 0.5 - 38;
    c.lineCap = 'round'; c.lineJoin = 'round';
    // Тінь рукава
    c.strokeStyle = '#5c4c3b'; c.lineWidth = 54;
    c.beginPath(); c.moveTo(shX, shY); c.quadraticCurveTo(midX, midY, targetHandX + 26, targetHandY); c.stroke();
    // Світлий рукав
    c.strokeStyle = '#e6dac5'; c.lineWidth = 46;
    c.beginPath(); c.moveTo(shX, shY); c.quadraticCurveTo(midX, midY, targetHandX + 26, targetHandY); c.stroke();
    // Передпліччя (шкіра)
    c.strokeStyle = '#e39e76'; c.lineWidth = 34;
    c.beginPath(); c.moveTo(midX - 18, midY + 4); c.lineTo(targetHandX, targetHandY); c.stroke();

    // Кисть, що тримає предмет
    c.fillStyle = '#f2b188';
    c.beginPath(); c.ellipse(targetHandX, targetHandY, 26, 20, -0.2, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#733e24'; c.lineWidth = 2.4; c.stroke();

    // Якщо кухар тримає предмет — оновлюємо координату предмета під кистю
    if (chefHeldItem && (demoPhase === 'reach' || demoPhase === 'hold')) {
      chefHeldItem.x = cx + shockRecoil + targetHandX - 10;
      chefHeldItem.y = cy + breath + happyBounce + targetHandY + 46;
    }

    c.restore();
  }

  function drawCauldronBack(c, t) {
    c.save();
    const sx = (Math.random() - 0.5) * cauldronShake;
    const sy = (Math.random() - 0.5) * cauldronShake * 0.6;
    c.translate(CAULDRON.x + sx, CAULDRON.y + sy);

    // Задній обідок горловини
    c.fillStyle = '#3b1909';
    c.beginPath();
    c.ellipse(0, -122, 224, 34, 0, 0, Math.PI * 2);
    c.fill();

    // КИПЛЯЧИЙ БУЛЬЙОН (хвиляста поверхня!)
    const brothG = c.createLinearGradient(0, -148, 0, -96);
    brothG.addColorStop(0, cauldronHeat > 0.65 ? '#ffdf8c' : '#f2e2be');
    brothG.addColorStop(1, cauldronHeat > 0.65 ? '#e88b3a' : '#c9b084');
    c.fillStyle = brothG;
    c.beginPath();
    const waveAmp = 5 + cauldronHeat * 9;
    c.moveTo(-210, -118);
    for (let x = -210; x <= 210; x += 20) {
      const wy = -124 + Math.sin(x * 0.045 + t * (6 + cauldronHeat * 10)) * waveAmp
                      + Math.cos(x * 0.09 - t * 9) * (waveAmp * 0.5);
      c.lineTo(x, wy);
    }
    c.lineTo(210, -98); c.lineTo(-210, -98);
    c.closePath(); c.fill();

    c.restore();
  }

  function drawCauldronFront(c, t) {
    c.save();
    const sx = (Math.random() - 0.5) * cauldronShake;
    const sy = (Math.random() - 0.5) * cauldronShake * 0.6;
    const swell = state === 'finale' && finalePhase === 0 ? 1 + Math.sin(t * 28) * 0.03 + finaleT * 0.09 : 1;
    c.translate(CAULDRON.x + sx, CAULDRON.y + sy);
    c.scale(swell, swell);

    // Вогняний відблиск знизу
    const fire = c.createRadialGradient(0, 145, 25, 0, 145, 250);
    fire.addColorStop(0, `rgba(255, 130, 30, ${0.42 + Math.sin(t * 11) * 0.1 + cauldronHeat * 0.3})`);
    fire.addColorStop(1, 'rgba(255, 70, 0, 0)');
    c.fillStyle = fire;
    c.beginPath(); c.ellipse(0, 145, 255, 68, 0, 0, Math.PI * 2); c.fill();

    // Тіло гігантського мідного казана
    const bodyG = c.createRadialGradient(-78, -28, 30, 0, 12, 265);
    bodyG.addColorStop(0, cauldronHeat > 0.7 ? '#ffd299' : '#f2aa6d');
    bodyG.addColorStop(0.38, cauldronHeat > 0.7 ? '#d95b26' : '#b86231');
    bodyG.addColorStop(0.75, '#733315');
    bodyG.addColorStop(1, '#301206');
    c.fillStyle = bodyG;
    c.beginPath();
    c.moveTo(-218, -118);
    c.bezierCurveTo(-244, 24, -182, 148, 0, 152);
    c.bezierCurveTo(182, 148, 244, 24, 218, -118);
    c.quadraticCurveTo(0, -90, -218, -118);
    c.closePath(); c.fill();
    c.strokeStyle = '#290e04'; c.lineWidth = 4; c.stroke();

    // Кований металевий блік ліворуч
    c.fillStyle = 'rgba(255, 220, 175, 0.22)';
    c.beginPath(); c.ellipse(-102, -16, 46, 84, -0.18, 0, Math.PI * 2); c.fill();

    // Права мідна ручка казана
    c.strokeStyle = '#6b3116'; c.lineWidth = 18; c.lineCap = 'round';
    c.beginPath(); c.moveTo(205, -52); c.quadraticCurveTo(268, -42, 200, 18); c.stroke();
    c.strokeStyle = '#d4844c'; c.lineWidth = 7;
    c.beginPath(); c.moveTo(206, -54); c.quadraticCurveTo(258, -44, 202, 10); c.stroke();

    // Передній товстий обідок горловини з заклепками
    const rimG = c.createLinearGradient(-230, -120, 230, -100);
    rimG.addColorStop(0, '#692f14'); rimG.addColorStop(0.32, '#eba063');
    rimG.addColorStop(0.55, '#ffd09c'); rimG.addColorStop(0.85, '#994a21'); rimG.addColorStop(1, '#471d0a');
    c.fillStyle = rimG;
    c.beginPath();
    c.moveTo(-232, -124);
    c.quadraticCurveTo(0, -94, 232, -124);
    c.lineTo(228, -98);
    c.quadraticCurveTo(0, -68, -228, -98);
    c.closePath(); c.fill();
    c.strokeStyle = '#2b1005'; c.lineWidth = 3; c.stroke();

    // ДІЄГЕТИЧНІ ВОГНИКИ ПРОГРЕСУ ПОТОЧНОЇ ПОСЛІДОВНОСТІ (жодних цифр!)
    if (sequence.length > 0 && state !== 'finale') {
      const n = sequence.length;
      const spread = Math.min(280, n * 52);
      for (let i = 0; i < n; i++) {
        const frac = n === 1 ? 0.5 : i / (n - 1);
        const gx = -spread / 2 + frac * spread;
        const gy = -94 + Math.cos((frac - 0.5) * Math.PI) * 10;
        const lit = i < inputIndex || state === 'round_win';
        // Мідна оправа
        c.fillStyle = '#3b1908';
        c.beginPath(); c.arc(gx, gy, 10, 0, Math.PI * 2); c.fill();
        if (lit) {
          const glow = c.createRadialGradient(gx, gy, 1, gx, gy, 16);
          glow.addColorStop(0, '#fff9bd'); glow.addColorStop(0.5, '#ffbb2e'); glow.addColorStop(1, 'rgba(255,150,20,0)');
          c.fillStyle = glow;
          c.beginPath(); c.arc(gx, gy, 16, 0, Math.PI * 2); c.fill();
          c.fillStyle = '#fff08a';
        } else {
          c.fillStyle = '#5e321a';
        }
        c.beginPath(); c.arc(gx, gy, 6.2, 0, Math.PI * 2); c.fill();
      }
    }

    // МАНОМЕТР ТИСКУ НА КАЗАНІ (візуально показує близькість неочікуваного фіналу!)
    c.save();
    c.translate(-86, 48);
    // Латунний корпус манометра
    const mg = c.createRadialGradient(-10, -10, 4, 0, 0, 42);
    mg.addColorStop(0, '#ffe3a8'); mg.addColorStop(0.6, '#9c5a27'); mg.addColorStop(1, '#3b1908');
    c.fillStyle = mg;
    c.beginPath(); c.arc(0, 0, 39, 0, Math.PI * 2); c.fill();
    c.strokeStyle = '#240d04'; c.lineWidth = 3; c.stroke();
    // Циферблат
    c.fillStyle = '#f5eedc';
    c.beginPath(); c.arc(0, 0, 30, 0, Math.PI * 2); c.fill();
    // Зелена, жовта і ЧЕРВОНА зони тиску
    c.lineWidth = 6;
    c.strokeStyle = '#48a842';
    c.beginPath(); c.arc(0, 0, 22, Math.PI * 0.78, Math.PI * 1.32); c.stroke();
    c.strokeStyle = '#f0a824';
    c.beginPath(); c.arc(0, 0, 22, Math.PI * 1.32, Math.PI * 1.82); c.stroke();
    c.strokeStyle = '#e03124';
    c.beginPath(); c.arc(0, 0, 22, Math.PI * 1.82, Math.PI * 2.22); c.stroke();
    // Тремтяча стрілка
    const jitter = Math.sin(t * (18 + pressureNeedle * 30)) * (0.03 + pressureNeedle * 0.08);
    const nAng = Math.PI * 0.78 + Math.min(1.04, pressureNeedle + jitter) * (Math.PI * 1.44);
    c.strokeStyle = '#24140d'; c.lineWidth = 3.6; c.lineCap = 'round';
    c.beginPath(); c.moveTo(0, 0); c.lineTo(Math.cos(nAng) * 23, Math.sin(nAng) * 23); c.stroke();
    c.fillStyle = '#b82a1c';
    c.beginPath(); c.arc(0, 0, 5.2, 0, Math.PI * 2); c.fill();
    // Блік на склі
    c.fillStyle = 'rgba(255,255,255,0.35)';
    c.beginPath(); c.ellipse(-9, -10, 12, 6, -0.5, 0, Math.PI * 2); c.fill();
    c.restore();

    c.restore();
  }

  function drawConveyor(c, t) {
    // Верхня поверхня конвеєра з рухомими металевими ламелями
    const topY = CONVEYOR_Y - 38;
    const beltH = 74;

    // Тінь під стрічкою
    c.fillStyle = 'rgba(0,0,0,0.55)';
    c.fillRect(0, topY - 12, W, 16);

    // Стрічка конвеєра
    const bg = c.createLinearGradient(0, topY, 0, topY + beltH);
    bg.addColorStop(0, '#595350'); bg.addColorStop(0.5, '#8c837c'); bg.addColorStop(1, '#3d3733');
    c.fillStyle = bg;
    c.fillRect(0, topY, W, beltH);

    // Металеві ребра стрічки (плавно рухаються!)
    const slatW = 54;
    const offset = ((beltScroll % slatW) + slatW) % slatW;
    for (let sx = -slatW + offset; sx < W + slatW; sx += slatW) {
      c.fillStyle = 'rgba(255, 240, 220, 0.14)';
      c.fillRect(sx, topY + 2, 18, beltH - 4);
      c.strokeStyle = '#292421'; c.lineWidth = 3;
      c.beginPath();
      c.moveTo(sx, topY); c.lineTo(sx - 12, topY + beltH);
      c.stroke();
    }

    // Дерев'яно-залізна передня балка конвеєра
    const beamY = topY + beltH;
    const wg = c.createLinearGradient(0, beamY, 0, H);
    wg.addColorStop(0, '#784826'); wg.addColorStop(0.28, '#542e15');
    wg.addColorStop(0.7, '#33190a'); wg.addColorStop(1, '#1c0c04');
    c.fillStyle = wg;
    c.fillRect(0, beamY, W, H - beamY);

    // Горизонтальна фактура дерева
    c.strokeStyle = 'rgba(20, 8, 2, 0.42)'; c.lineWidth = 3;
    for (let gy = beamY + 18; gy < H; gy += 22) {
      c.beginPath(); c.moveTo(0, gy); c.lineTo(W, gy); c.stroke();
    }

    // Ковані сталеві накладки із заклепками
    c.fillStyle = '#33302f';
    c.fillRect(0, beamY - 4, W, 14);
    [130, 560, 1020, 1340].forEach(bx => {
      c.fillStyle = '#403b39';
      c.beginPath(); c.roundRect(bx, beamY + 12, 110, 44, 6); c.fill();
      c.strokeStyle = '#1a1716'; c.lineWidth = 2.5; c.stroke();
      [bx + 22, bx + 88].forEach(rx => {
        c.fillStyle = '#99908a';
        c.beginPath(); c.arc(rx, beamY + 34, 6.5, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#24201e'; c.lineWidth = 2; c.stroke();
      });
    });

    // Предмети на конвеєрі
    beltItems.forEach((item, idx) => {
      const shake = item.wrongShake > 0 ? Math.sin(item.wrongShake * 55) * 12 : 0;
      const lift = item.hover * -16 - Math.sin(item.bounce * Math.PI) * 18;
      const sc = 1.06 + item.hover * 0.14;
      const ix = item.x + shake;
      const iy = item.baseY + lift;

      // Контактна тінь на стрічці
      c.fillStyle = `rgba(12, 6, 2, ${0.48 - item.hover * 0.16})`;
      c.beginPath();
      c.ellipse(ix, CONVEYOR_Y + 26, 48 - item.hover * 6, 13, 0, 0, Math.PI * 2);
      c.fill();

      // Промені іскор при наведенні (як на будильнику!)
      if (item.hover > 0.25 && state === 'input') {
        c.save();
        c.translate(ix, iy);
        c.strokeStyle = `rgba(255, 224, 115, ${item.hover * 0.85})`;
        c.lineWidth = 3; c.lineCap = 'round';
        for (let r = 0; r < 10; r++) {
          const a = (r / 10) * Math.PI * 2 + t * 1.4;
          const r1 = 54 + Math.sin(t * 10 + r) * 5;
          const r2 = 72 + Math.cos(t * 12 + r) * 7;
          c.beginPath();
          c.moveTo(Math.cos(a) * r1, Math.sin(a) * r1);
          c.lineTo(Math.cos(a) * r2, Math.sin(a) * r2);
          c.stroke();
        }
        c.restore();
      }

      drawItem(c, item.id, ix, iy, sc, shake * 0.015, item.hover);
    });
  }

  // =========================================================================
  // ОНОВЛЕННЯ ЛОГІКИ ТА ФІЗИКИ (60 FPS)
  // =========================================================================
  let lastTime = performance.now();
  let pipeSparkTimer = 1.2;

  function update(dt, t) {
    // Плавний рух стрілки манометра та затухання тряски
    pressureNeedle += (targetPressure - pressureNeedle) * Math.min(1, dt * 4.5);
    cauldronShake = Math.max(0, cauldronShake - dt * 32);

    if (chefMoodT > 0) {
      chefMoodT -= dt;
      if (chefMoodT <= 0 && state !== 'finale') chefMood = 'normal';
    }

    // Періодичні реалістичні іскри з клапана мідної труби
    pipeSparkTimer -= dt;
    if (pipeSparkTimer <= 0) {
      pipeSparkTimer = 1.4 + Math.random() * 2.4;
      for (let i = 0; i < 12; i++) {
        sparks.push({
          x: 438, y: 416,
          vx: -90 - Math.random() * 170,
          vy: -130 - Math.random() * 140,
          life: 0.4 + Math.random() * 0.45,
          maxLife: 0.85,
          size: 2 + Math.random() * 3,
          color: `hsl(${30 + Math.random() * 26}, 100%, 72%)`
        });
      }
      if (Math.random() < 0.35) Sound.playSpark();
    }

    // Плавне під'їжджання предметів на конвеєрі
    let beltMoving = false;
    beltItems.forEach((item, idx) => {
      const diff = item.targetX - item.x;
      if (Math.abs(diff) > 0.8) {
        item.x += diff * Math.min(1, dt * 6.5);
        beltMoving = true;
      } else {
        item.x = item.targetX;
      }
      const wantHover = (state === 'input' && hoveredIdx === idx) ? 1 : 0;
      item.hover += (wantHover - item.hover) * Math.min(1, dt * 14);
      if (item.bounce > 0) item.bounce = Math.max(0, item.bounce - dt * 3.2);
      if (item.wrongShake > 0) item.wrongShake = Math.max(0, item.wrongShake - dt * 1.9);
    });
    beltScroll += dt * (beltMoving ? 150 : 18);

    // ---- МАШИНА СТАНІВ ----
    if (state === 'demo') {
      demoT += dt;
      const speedMul = Math.max(0.68, 1 - cycleStage * 0.08 - cycleCount * 0.05);

      if (demoPhase === 'reach') {
        if (!chefHeldItem && demoStep < sequence.length) {
          chefHeldItem = { id: sequence[demoStep], x: 960, y: 310, vy: 0, rot: 0 };
        }
        if (demoT >= 0.36 * speedMul) {
          demoPhase = 'hold';
          demoT = 0;
          Sound.playObjectCue(sequence[demoStep]);
          chefMood = 'excited';
        }
      } else if (demoPhase === 'hold') {
        if (demoT >= 0.62 * speedMul) {
          demoPhase = 'drop';
          demoT = 0;
          if (chefHeldItem) {
            chefHeldItem.vy = 140;
          }
        }
      } else if (demoPhase === 'drop') {
        if (chefHeldItem) {
          chefHeldItem.vy += 1850 * dt;
          chefHeldItem.y += chefHeldItem.vy * dt;
          chefHeldItem.rot += 3.5 * dt;
          if (chefHeldItem.y >= CAULDRON.mouthY + 12) {
            Sound.playSplash(1.1);
            spawnSplash(chefHeldItem.x, CAULDRON.mouthY, 1.15);
            spawnSparks(chefHeldItem.x, CAULDRON.mouthY - 12, 10, 0.8);
            cauldronShake = 9;
            chefHeldItem = null;
            demoPhase = 'pause';
            demoT = 0;
          }
        }
      } else if (demoPhase === 'pause') {
        if (demoT >= 0.34 * speedMul) {
          demoStep++;
          if (demoStep >= sequence.length) {
            state = 'input';
            chefMood = 'normal';
            demoT = 0;
          } else {
            demoPhase = 'reach';
            demoT = 0;
          }
        }
      }
    }

    else if (state === 'round_win') {
      stateTimer += dt;
      if (stateTimer >= 1.15) {
        if (cycleStage === 3) {
          startFinale();
        } else {
          startNewRound(true);
        }
      }
    }

    else if (state === 'finale') {
      finaleT += dt;
      if (finalePhase === 0) {
        // Казан роздувається, шипить і трясеться!
        cauldronHeat = Math.min(1, 0.5 + finaleT * 0.5);
        cauldronShake = 6 + finaleT * 18;
        chefMood = 'shock';
        if (Math.random() < 0.45) {
          spawnSparks(CAULDRON.x + (Math.random() - 0.5) * 320, CAULDRON.mouthY, 3, 1.3);
        }
        if (finaleT >= 1.35) {
          finalePhase = 1;
          finaleT = 0;
          chefMood = 'happy';
          triggerFinaleExplosion();
        }
      } else if (finalePhase === 1) {
        // Кухар ефектно злітає на гігантському ополонику вгору!
        const p = Math.min(1, finaleT / 1.8);
        chefFlyY = -Math.sin(p * Math.PI * 0.5) * 680;
        chefFlyX = -Math.sin(p * Math.PI) * 260;
        chefFlyRot = -0.35 + Math.sin(finaleT * 9) * 0.16;
        if (finaleT >= 2.2) {
          finalePhase = 2;
          finaleT = 0;
        }
      } else if (finalePhase === 2) {
        // Плавно спускається на своєму величезному ковпаку-парашуті!
        const p = Math.min(1, finaleT / 2.2);
        const ease = 1 - Math.pow(1 - p, 3);
        chefFlyY = -680 * (1 - ease);
        chefFlyX = Math.sin(p * Math.PI * 3) * 85 * (1 - p);
        chefFlyRot = Math.cos(p * Math.PI * 3) * 0.14 * (1 - p);
        cauldronHeat = Math.max(0, 1 - p * 1.2);
        targetPressure = Math.max(0.08, 1 - p);
        if (finaleT >= 2.55) {
          chefFlyX = 0; chefFlyY = 0; chefFlyRot = 0;
          Sound.playSplash(0.7);
          startNewRound(true); // Безкінечний генератор: новий цикл!
        }
      }
    }

    // ---- ЛЕТЯЧІ ПРЕДМЕТИ ВІД ГРАВЦЯ У КАЗАН ----
    for (let i = flyingItems.length - 1; i >= 0; i--) {
      const f = flyingItems[i];
      f.t += dt / f.dur;
      if (f.t >= 1) {
        Sound.playSplash(1.15);
        Sound.playCorrect(f.stepIndex);
        spawnSplash(CAULDRON.x, CAULDRON.mouthY, 1.25, '#ffe7a8');
        spawnSparks(CAULDRON.x, CAULDRON.mouthY - 16, 22, 1.2, 1);
        cauldronShake = 11;
        chefMood = 'happy';
        chefMoodT = 0.7;
        targetPressure = Math.min(0.96, targetPressure + 0.055);
        flyingItems.splice(i, 1);

        if (f.isLast) {
          state = 'round_win';
          stateTimer = 0;
          Sound.playRoundClear();
          spawnSparks(CAULDRON.x, CAULDRON.mouthY - 40, 36, 1.5, 1);
          chefMood = 'happy';
          chefMoodT = 1.4;
        }
      } else {
        const u = f.t;
        f.x = f.sx + (CAULDRON.x - f.sx) * u;
        f.y = f.sy + (CAULDRON.mouthY - f.sy) * u - Math.sin(u * Math.PI) * 290;
        f.rot += dt * 7;
        f.scale = 1.05 - u * 0.22;
      }
    }

    // ---- ЧАСТИНКИ ----
    // Пара
    for (const s of steam) {
      s.x += s.vx * dt + Math.sin(t * 1.5 + s.y * 0.01) * 14 * dt;
      s.y += s.vy * dt * (1 + cauldronHeat * 0.8);
      s.r += 14 * dt;
      if (s.y < 140) {
        s.x = CAULDRON.x + (Math.random() - 0.5) * 290;
        s.y = CAULDRON.mouthY - 10;
        s.r = 24 + Math.random() * 30;
      }
    }
    // Іскри
    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];
      p.life -= dt;
      p.vy += 520 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) sparks.splice(i, 1);
    }
    // Бризки
    for (let i = splashes.length - 1; i >= 0; i--) {
      const p = splashes[i];
      p.life -= dt;
      p.vy += 880 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.life <= 0) splashes.splice(i, 1);
    }
    // Бульбашки в казані
    if (Math.random() < dt * (7 + cauldronHeat * 18)) {
      bubbles.push({
        x: CAULDRON.x + (Math.random() - 0.5) * 320,
        y: CAULDRON.mouthY + (Math.random() - 0.5) * 10,
        r: 4 + Math.random() * 10,
        vy: -20 - Math.random() * 40,
        life: 0.7 + Math.random() * 0.7
      });
    }
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      b.life -= dt; b.y += b.vy * dt; b.r += 5 * dt;
      if (b.life <= 0) bubbles.splice(i, 1);
    }
    // Дим при помилці
    for (let i = smokePuffs.length - 1; i >= 0; i--) {
      const p = smokePuffs[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.r += 26 * dt;
      if (p.life <= 0) smokePuffs.splice(i, 1);
    }
    // Попкорн
    for (let i = popcorn.length - 1; i >= 0; i--) {
      const p = popcorn[i];
      p.life -= dt; p.vy += 680 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vrot * dt;
      if (p.y > CONVEYOR_Y + 25 && p.vy > 0) {
        p.y = CONVEYOR_Y + 25; p.vy *= -0.45; p.vx *= 0.78;
      }
      if (p.life <= 0) popcorn.splice(i, 1);
    }
    // Конфеті
    for (let i = confetti.length - 1; i >= 0; i--) {
      const p = confetti[i];
      p.life -= dt;
      p.vy += 240 * dt; p.vx *= 0.985;
      p.x += p.vx * dt + Math.sin(t * 7 + i) * 32 * dt;
      p.y += p.vy * dt; p.rot += p.vrot * dt;
      if (p.life <= 0) confetti.splice(i, 1);
    }
    // Мильні бульбашки
    for (let i = soapBubbles.length - 1; i >= 0; i--) {
      const b = soapBubbles[i];
      b.life -= dt;
      b.wobble += dt * 4;
      b.x += (b.vx + Math.sin(b.wobble) * 55) * dt;
      b.y += b.vy * dt;
      b.vy *= 0.985;
      if (b.life <= 0 || b.y < -80) soapBubbles.splice(i, 1);
    }
  }

  // =========================================================================
  // РЕНДЕРИНГ СЦЕНИ
  // =========================================================================
  function render(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#140b06';
    ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

    ctx.save();
    ctx.translate(viewOffX, viewOffY);
    ctx.scale(viewScale, viewScale);

    // 1. Статична кухня
    if (bgCache) ctx.drawImage(bgCache, 0, 0);

    // 2. Живі каструльки з очима на полицях (реагують на події!)
    const lookX = chefHeldItem ? chefHeldItem.x : (flyingItems[0] ? flyingItems[0].x : mouseX);
    const lookY = chefHeldItem ? chefHeldItem.y : (flyingItems[0] ? flyingItems[0].y : mouseY);
    const potMood = (state === 'finale' && finalePhase === 0) ? 'shock' : chefMood;
    const potBlink = Math.sin(t * 1.15) > 0.985;
    drawLivingPot(ctx, 1320, 96, 84, 62, lookX, lookY, potMood, potBlink, t);
    drawLivingPot(ctx, 1445, 514, 118, 76, lookX, lookY, potMood, Math.sin(t * 1.15 + 2) > 0.985, t);

    // 3. Пара, що піднімається у витяжку
    for (const s of steam) {
      const alpha = Math.max(0, Math.min(0.26, (s.y - 140) / 360 * 0.24));
      const sg = ctx.createRadialGradient(s.x, s.y, 4, s.x, s.y, s.r);
      sg.addColorStop(0, `rgba(255, 244, 228, ${alpha})`);
      sg.addColorStop(1, 'rgba(255, 240, 220, 0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }

    // 4. Задня стінка казана та бульйон
    drawCauldronBack(ctx, t);

    // 5. Кухар (за казаном, а при польоті — поверх усього!)
    if (!(state === 'finale' && finalePhase >= 1)) {
      drawChef(ctx, t);
    }

    // 6. Предмет, який кухар тримає або кидає
    if (chefHeldItem) {
      drawItem(ctx, chefHeldItem.id, chefHeldItem.x, chefHeldItem.y, 1.05, chefHeldItem.rot, 0.55);
    }

    // 7. Предмети, що летять від гравця у казан
    for (const f of flyingItems) {
      drawItem(ctx, f.id, f.x, f.y, f.scale, f.rot, 0.75);
    }

    // 8. Бульбашки та бризки на поверхні бульйону
    for (const b of bubbles) {
      ctx.strokeStyle = `rgba(255, 245, 222, ${Math.min(0.8, b.life)})`;
      ctx.lineWidth = 2.2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = `rgba(255,255,255, ${Math.min(0.6, b.life * 0.7)})`;
      ctx.beginPath(); ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.25, 0, Math.PI * 2); ctx.fill();
    }
    for (const p of splashes) {
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 9. Передня частина казана + мідна труба
    drawCauldronFront(ctx, t);
    drawCopperPipe(ctx, t);

    // 10. Кумедний дим при помилці
    for (const p of smokePuffs) {
      ctx.globalAlpha = Math.max(0, (p.life / p.maxLife) * 0.65);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 11. Конвеєр із предметами на передньому плані
    drawConveyor(ctx, t);

    // 12. Іскри (з труби та при успіху)
    for (const p of sparks) {
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 0.045, p.y - p.vy * 0.045);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    // 13. ФІНАЛЬНИЙ ПОЛІТ КУХАРЯ + ПОПКОРН + КОНФЕТІ + МИЛЬНІ БУЛЬБАШКИ!
    if (state === 'finale' && finalePhase >= 1) {
      drawChef(ctx, t);
    }

    // Попкорн (реалістичні пухкі хмарки)
    for (const p of popcorn) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(p.s, p.s);
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = '#fff5d1';
      ctx.beginPath();
      ctx.arc(-6, -3, 8, 0, Math.PI * 2);
      ctx.arc(6, -4, 7.5, 0, Math.PI * 2);
      ctx.arc(0, 5, 8.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e09b34';
      ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // Конфеті
    for (const p of confetti) {
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.min(1, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (0.4 + Math.abs(Math.sin(t * 8 + p.rot)) * 0.6));
      ctx.restore();
    }
    ctx.globalAlpha = 1;

    // Райдужні мильні бульбашки
    for (const b of soapBubbles) {
      ctx.save();
      ctx.globalAlpha = Math.min(0.85, b.life);
      const bg = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 2, b.x, b.y, b.r);
      bg.addColorStop(0, 'rgba(255,255,255,0.65)');
      bg.addColorStop(0.55, 'rgba(140,220,255,0.18)');
      bg.addColorStop(0.82, 'rgba(255,140,235,0.34)');
      bg.addColorStop(1, 'rgba(130,255,220,0.62)');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath(); ctx.ellipse(b.x - b.r * 0.34, b.y - b.r * 0.34, b.r * 0.26, b.r * 0.14, -0.6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }

  // =========================================================================
  // ВЗАЄМОДІЯ (МИША ТА СЕНСОРНИЙ ЕКРАН / ІНТЕРАКТИВНА ДОШКА)
  // =========================================================================
  function toWorld(clientX, clientY) {
    return {
      x: (clientX - viewOffX) / viewScale,
      y: (clientY - viewOffY) / viewScale
    };
  }

  function findBeltItem(wx, wy) {
    for (let i = 0; i < beltItems.length; i++) {
      const it = beltItems[i];
      if (Math.hypot(wx - it.x, wy - it.baseY) < 76) return i;
    }
    return -1;
  }

  canvas.addEventListener('pointermove', (e) => {
    const p = toWorld(e.clientX, e.clientY);
    mouseX = p.x; mouseY = p.y;
    hoveredIdx = findBeltItem(p.x, p.y);
    const overChef = state === 'input' && Math.hypot(p.x - 1105, p.y - 310) < 120;
    canvas.style.cursor = (state === 'input' && (hoveredIdx !== -1 || overChef)) ? 'pointer' : 'default';
  });

  canvas.addEventListener('pointerdown', (e) => {
    Sound.unlock();
    const p = toWorld(e.clientX, e.clientY);
    mouseX = p.x; mouseY = p.y;

    if (state !== 'input') return;

    // Клік по кухарю — кумедно повторює послідовність, якщо дитина забула!
    if (Math.hypot(p.x - 1105, p.y - 310) < 125) {
      Sound.playClick();
      inputIndex = 0;
      demoStep = 0;
      demoPhase = 'reach';
      demoT = 0;
      chefHeldItem = null;
      state = 'demo';
      return;
    }

    const idx = findBeltItem(p.x, p.y);
    if (idx === -1) return;

    const item = beltItems[idx];
    const expectedId = sequence[inputIndex];

    if (item.id === expectedId) {
      // ВІРНО! Предмет з іскрами летить у казан!
      item.bounce = 1;
      Sound.playObjectCue(item.id);
      spawnSparks(item.x, item.baseY, 16, 1.1, 1);

      const currentStep = inputIndex;
      inputIndex++;
      const isLast = inputIndex >= sequence.length;
      if (isLast) state = 'input_locked';

      flyingItems.push({
        id: item.id,
        sx: item.x, sy: item.baseY - 12,
        x: item.x, y: item.baseY - 12,
        rot: 0, scale: 1.05,
        t: 0, dur: 0.44,
        stepIndex: currentStep,
        isLast
      });
    } else {
      // ПОМИЛКА! Кумедний дим, гикавка казана і здивований кухар (без скидання раунду)
      item.wrongShake = 1;
      Sound.playWrong();
      spawnSmoke(item.x, item.baseY - 10, 8, '#756f68');
      spawnSmoke(CAULDRON.x, CAULDRON.mouthY - 20, 10, '#6a8255');
      cauldronShake = 14;
      chefMood = 'shock';
      chefMoodT = 0.95;
    }
  });

  // Адаптація під широкий екран (cover з безпечним масштабуванням ключової зони)
  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    const vw = window.innerWidth, vh = window.innerHeight;
    canvas.width = Math.floor(vw * dpr);
    canvas.height = Math.floor(vh * dpr);
    // Вміщуємо всю ігрову сцену, максимально заповнюючи широкий екран
    const sx = vw / W, sy = vh / H;
    viewScale = Math.min(sx, sy);
    // Якщо екран майже 16:9 — розтягуємо без полів
    if (Math.abs(sx - sy) / Math.max(sx, sy) < 0.08) {
      viewScale = Math.max(sx, sy);
    }
    viewOffX = (vw - W * viewScale) * 0.5;
    viewOffY = (vh - H * viewScale) * 0.5;
  }

  window.addEventListener('resize', resize);
  buildKitchenBackground();
  resize();
  updateLangUI();
  startNewRound(false);

  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    const t = now / 1000;
    update(dt, t);
    render(t);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
