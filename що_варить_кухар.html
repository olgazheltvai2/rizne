<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Буль-Буль Хаос</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #140b06;
    font-family: 'Trebuchet MS', 'Segoe UI', sans-serif;
  }
  canvas {
    display: block; width: 100vw; height: 100vh;
    touch-action: none;
  }
  .copper-plate {
    position: fixed;
    z-index: 20;
    cursor: pointer;
    border: 3px solid #3c1f10;
    border-radius: 14px;
    background:
      radial-gradient(circle at 12px 50%, #5c3318 0 4px, #d99b66 4.5px 6px, transparent 6.5px),
      radial-gradient(circle at calc(100% - 12px) 50%, #5c3318 0 4px, #d99b66 4.5px 6px, transparent 6.5px),
      linear-gradient(180deg, #d79a63 0%, #9b5a2e 38%, #6d3717 82%, #4a230d 100%);
    box-shadow:
      0 6px 18px rgba(0,0,0,0.65),
      inset 0 2px 2px rgba(255,226,184,0.65),
      inset 0 -3px 6px rgba(32,12,4,0.75);
    color: #fff2d6;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-shadow: 0 2px 3px rgba(25,10,2,0.9);
    transition: transform 0.14s ease, filter 0.14s ease, box-shadow 0.14s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .copper-plate:hover {
    filter: brightness(1.13);
    transform: translateY(-2px) scale(1.03);
    box-shadow: 0 9px 22px rgba(0,0,0,0.75), 0 0 18px rgba(255,180,75,0.45), inset 0 2px 3px rgba(255,235,200,0.8);
  }
  .copper-plate:active {
    transform: translateY(2px) scale(0.97);
    filter: brightness(0.96);
  }
  #langBtn {
    top: 18px; right: 22px;
    min-width: 108px; height: 48px;
    padding: 0 24px;
    font-size: 20px;
  }
  #nextBtn {
    bottom: 18px; right: 22px;
    min-width: 146px; height: 54px;
    padding: 0 26px;
    font-size: 22px;
    background:
      radial-gradient(circle at 12px 50%, #5c3318 0 4px, #f2c388 4.5px 6px, transparent 6.5px),
      radial-gradient(circle at calc(100% - 12px) 50%, #5c3318 0 4px, #f2c388 4.5px 6px, transparent 6.5px),
      linear-gradient(180deg, #e5b77b 0%, #b57b42 45%, #7c4b21 88%, #522e12 100%);
  }
</style>
</head>
<body>
<canvas id="game"></canvas>
<button id="langBtn" class="copper-plate" aria-label="Language">УКР</button>
<button id="nextBtn" class="copper-plate" aria-label="Next">ДАЛІ ➔</button>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const langBtn = document.getElementById('langBtn');
  const nextBtn = document.getElementById('nextBtn');

  // Логічна сцена 16:9 (адаптується під будь-який широкий екран без чорних смуг)
  const W = 1600, H = 900;
  let viewScale = 1, viewOffX = 0, viewOffY = 0, dpr = 1;
  let bgCache = null;

  // Мова інтерфейсу (одна кнопка: УКР або РУС)
  let lang = 'uk';
  function updateLangUI() {
    langBtn.textContent = lang === 'uk' ? 'УКР' : 'РУС';
    nextBtn.textContent = lang === 'uk' ? 'ДАЛІ ➔' : 'ДАЛЕЕ ➔';
  }
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    Sound.unlock();
    lang = lang === 'uk' ? 'ru' : 'uk';
    updateLangUI();
    Sound.playClick();
  });

  // =========================================================================
  // ПРОЦЕДУРНИЙ ЗВУКОВИЙ РУШІЙ (Web Audio API — без жодних зовнішніх файлів)
  // =========================================================================
  const Sound = (() => {
    let ac = null;
    function unlock() {
      if (!ac) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) ac = new AudioCtx();
      }
      if (ac && ac.state === 'suspended') ac.resume();
    }
    function noiseBuffer(dur = 0.5) {
      const len = Math.floor(ac.sampleRate * dur);
      const buf = ac.createBuffer(1, len, ac.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      return buf;
    }
    function playClick() {
      if (!ac) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(520, t);
      o.frequency.exponentialRampToValueAtTime(220, t + 0.07);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.09);
    }
    function playBubble(pitchMul = 1) {
      if (!ac) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      const base = (240 + Math.random() * 140) * pitchMul;
      o.frequency.setValueAtTime(base, t);
      o.frequency.exponentialRampToValueAtTime(base * 2.5, t + 0.09);
      g.gain.setValueAtTime(0.001, t);
      g.gain.linearRampToValueAtTime(0.14, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.12);
    }
    function playSplash(heavy = 1) {
      if (!ac) return;
      const t = ac.currentTime;
      // Водний шум
      const src = ac.createBufferSource();
      src.buffer = noiseBuffer(0.35);
      const flt = ac.createBiquadFilter();
      flt.type = 'bandpass';
      flt.frequency.setValueAtTime(950, t);
      flt.frequency.exponentialRampToValueAtTime(340, t + 0.3);
      flt.Q.value = 1.6;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.26 * heavy, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      src.connect(flt); flt.connect(g); g.connect(ac.destination);
      src.start(t);
      // Глибокий «бульк»
      const o = ac.createOscillator(), og = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(175, t);
      o.frequency.exponentialRampToValueAtTime(65, t + 0.08);
      o.frequency.exponentialRampToValueAtTime(390, t + 0.18);
      og.gain.setValueAtTime(0.28 * heavy, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.21);
      o.connect(og); og.connect(ac.destination);
      o.start(t); o.stop(t + 0.22);
      setTimeout(() => playBubble(1.1), 90);
      setTimeout(() => playBubble(1.45), 160);
    }
    function playSpark() {
      if (!ac) return;
      const t = ac.currentTime;
      const src = ac.createBufferSource();
      src.buffer = noiseBuffer(0.12);
      const flt = ac.createBiquadFilter();
      flt.type = 'highpass';
      flt.frequency.value = 3200;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.09, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.11);
      src.connect(flt); flt.connect(g); g.connect(ac.destination);
      src.start(t);
    }
    function playObjectCue(id) {
      if (!ac) return;
      const t = ac.currentTime;
      if (id === 'clock') {
        for (let i = 0; i < 6; i++) {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'sine';
          o.frequency.setValueAtTime(i % 2 ? 2250 : 1850, t + i * 0.045);
          g.gain.setValueAtTime(0.11, t + i * 0.045);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.045 + 0.04);
          o.connect(g); g.connect(ac.destination);
          o.start(t + i * 0.045); o.stop(t + i * 0.045 + 0.045);
        }
      } else if (id === 'train') {
        [0, 0.18].forEach((off, idx) => {
          [520, 650].forEach(freq => {
            const o = ac.createOscillator(), g = ac.createGain();
            o.type = 'triangle';
            o.frequency.setValueAtTime(freq, t + off);
            g.gain.setValueAtTime(0.001, t + off);
            g.gain.linearRampToValueAtTime(0.09, t + off + 0.02);
            g.gain.exponentialRampToValueAtTime(0.001, t + off + (idx ? 0.22 : 0.14));
            o.connect(g); g.connect(ac.destination);
            o.start(t + off); o.stop(t + off + 0.24);
          });
        });
      } else if (id === 'plunger') {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(110, t);
        o.frequency.exponentialRampToValueAtTime(480, t + 0.14);
        o.frequency.exponentialRampToValueAtTime(190, t + 0.22);
        g.gain.setValueAtTime(0.24, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.24);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + 0.25);
      } else if (id === 'phone') {
        for (let i = 0; i < 4; i++) {
          const o = ac.createOscillator(), g = ac.createGain();
          o.type = 'square';
          o.frequency.setValueAtTime(i % 2 ? 980 : 1220, t + i * 0.055);
          g.gain.setValueAtTime(0.055, t + i * 0.055);
          g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.055 + 0.05);
          o.connect(g); g.connect(ac.destination);
          o.start(t + i * 0.055); o.stop(t + i * 0.055 + 0.055);
        }
      } else if (id === 'boot') {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(150, t);
        o.frequency.exponentialRampToValueAtTime(52, t + 0.17);
        g.gain.setValueAtTime(0.28, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.19);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + 0.2);
      } else if (id === 'umbrella') {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(280, t);
        o.frequency.exponentialRampToValueAtTime(860, t + 0.13);
        g.gain.setValueAtTime(0.15, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        o.connect(g); g.connect(ac.destination);
        o.start(t); o.stop(t + 0.16);
      } else if (id === 'shower') {
        const src = ac.createBufferSource();
        src.buffer = noiseBuffer(0.22);
        const flt = ac.createBiquadFilter();
        flt.type = 'bandpass'; flt.frequency.value = 2600;
        const g = ac.createGain();
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        src.connect(flt); flt.connect(g); g.connect(ac.destination);
        src.start(t);
        playBubble(1.6);
      } else { // camera
        const src = ac.createBufferSource();
        src.buffer = noiseBuffer(0.06);
        const g = ac.createGain();
        g.gain.setValueAtTime(0.22, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
        src.connect(g); g.connect(ac.destination);
        src.start(t);
        const o = ac.createOscillator(), og = ac.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(1400, t + 0.05);
        o.frequency.exponentialRampToValueAtTime(2100, t + 0.14);
        og.gain.setValueAtTime(0.08, t + 0.05);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        o.connect(og); og.connect(ac.destination);
        o.start(t + 0.05); o.stop(t + 0.16);
      }
    }
    function playCorrect(step) {
      if (!ac) return;
      const t = ac.currentTime;
      const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5];
      const f = scale[step % scale.length];
      [f, f * 1.25].forEach((freq, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = i === 0 ? 'triangle' : 'sine';
        o.frequency.setValueAtTime(freq, t + i * 0.06);
        g.gain.setValueAtTime(0.16, t + i * 0.06);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.06 + 0.28);
        o.connect(g); g.connect(ac.destination);
        o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.3);
      });
    }
    function playRoundClear() {
      if (!ac) return;
      const t = ac.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((f, i) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(f, t + i * 0.08);
        g.gain.setValueAtTime(0.17, t + i * 0.08);
        g.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.35);
        o.connect(g); g.connect(ac.destination);
        o.start(t + i * 0.08); o.stop(t + i * 0.08 + 0.36);
      });
    }
    function playWrong() {
      if (!ac) return;
      const t = ac.currentTime;
      // Кумедний «пук-бульк» + слайд-тромбон
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(210, t);
      o.frequency.linearRampToValueAtTime(140, t + 0.16);
      o.frequency.linearRampToValueAtTime(92, t + 0.36);
      const flt = ac.createBiquadFilter();
      flt.type = 'lowpass'; flt.frequency.value = 620;
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
      o.connect(flt); flt.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.4);
    }
    function playSteamBuild() {
      if (!ac) return;
      const t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(420, t);
      o.frequency.exponentialRampToValueAtTime(1750, t + 1.35);
      g.gain.setValueAtTime(0.01, t);
      g.gain.linearRampToValueAtTime(0.15, t + 1.1);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.45);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 1.48);
    }
    function playFinaleBoom() {
      if (!ac) return;
      const t = ac.currentTime;
      // Комічний бум
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(34, t + 0.45);
      g.gain.setValueAtTime(0.42, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.connect(g); g.connect(ac.destination);
      o.start(t); o.stop(t + 0.52);

      // Шум вибуху попкорну
      const src = ac.createBufferSource();
      src.buffer = noiseBuffer(0.6);
      const flt = ac.createBiquadFilter();
      flt.type = 'lowpass'; flt.frequency.value = 1400;
      const ng = ac.createGain();
      ng.gain.setValueAtTime(0.28, t);
      ng.gain.exponentialRampToValueAtTime(0.001, t + 0.58);
      src.connect(flt); flt.connect(ng); ng.connect(ac.destination);
      src.start(t);

      // Свист польоту кухаря на ополонику!
      const w = ac.createOscillator(), wg = ac.createGain();
      w.type = 'sine';
      w.frequency.setValueAtTime(360, t + 0.08);
      w.frequency.exponentialRampToValueAtTime(1580, t + 0.85);
      wg.gain.setValueAtTime(0.14, t + 0.08);
      wg.gain.exponentialRampToValueAtTime(0.001, t + 0.92);
      w.connect(wg); wg.connect(ac.destination);
      w.start(t + 0.08); w.stop(t + 0.95);

      // Каскад попкорну + фанфара
      for (let i = 0; i < 16; i++) {
        setTimeout(() => playBubble(0.8 + Math.random() * 1.4), 120 + i * 95);
      }
      const fanfare = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
      const times = [0.35, 0.48, 0.61, 0.76, 0.96, 1.12];
      fanfare.forEach((f, i) => {
        const fo = ac.createOscillator(), fg = ac.createGain();
        fo.type = 'triangle';
        fo.frequency.setValueAtTime(f, t + times[i]);
        fg.gain.setValueAtTime(0.18, t + times[i]);
        fg.gain.exponentialRampToValueAtTime(0.001, t + times[i] + 0.42);
        fo.connect(fg); fg.connect(ac.destination);
        fo.start(t + times[i]); fo.stop(t + times[i] + 0.45);
      });
    }
    return {
      unlock, playClick, playBubble, playSplash, playSpark,
      playObjectCue, playCorrect, playRoundClear, playWrong,
      playSteamBuild, playFinaleBoom
    };
  })();

  // =========================================================================
  // КОЛЕКЦІЯ ПРЕДМЕТІВ (8 кумедних реалістичних предметів без тварин/роботів)
  // =========================================================================
  const ALL_ITEMS = [
    { id: 'boot',     color: '#8c502b' },
    { id: 'umbrella', color: '#395a63' },
    { id: 'clock',    color: '#e6b240' },
    { id: 'plunger',  color: '#d45136' },
    { id: 'phone',    color: '#2c3038' },
    { id: 'shower',   color: '#f0c737' },
    { id: 'train',    color: '#d9382e' },
    { id: 'camera',   color: '#4e8ab8' }
  ];

  function drawItem(c, id, x, y, scale = 1, rot = 0, highlight = 0) {
    c.save();
    c.translate(x, y);
    c.rotate(rot);
    c.scale(scale, scale);

    if (highlight > 0.01) {
      const g = c.createRadialGradient(0, 0, 8, 0, 0, 74);
      g.addColorStop(0, `rgba(255, 224, 110, ${0.75 * highlight})`);
      g.addColorStop(0.55, `rgba(255, 165, 40, ${0.35 * highlight})`);
      g.addColorStop(1, 'rgba(255, 140, 20, 0)');
      c.fillStyle = g;
      c.beginPath(); c.arc(0, 0, 74, 0, Math.PI * 2); c.fill();
    }

    if (id === 'boot') {
      // Шкіряний чобіт зі шнурівкою
      const lg = c.createLinearGradient(-34, -46, 36, 40);
      lg.addColorStop(0, '#7c4829');
      lg.addColorStop(0.45, '#593019');
      lg.addColorStop(1, '#30170b');
      c.fillStyle = lg;
      c.beginPath();
      c.moveTo(-30, -44); c.lineTo(6, -44); c.lineTo(12, -2);
      c.quadraticCurveTo(38, 2, 46, 22);
      c.quadraticCurveTo(48, 35, 36, 38);
      c.lineTo(-34, 38); c.quadraticCurveTo(-38, 12, -30, -44);
      c.closePath(); c.fill();
      c.strokeStyle = '#241007'; c.lineWidth = 2.4; c.stroke();
      // Підошва
      c.fillStyle = '#1f120b';
      c.beginPath();
      c.roundRect(-36, 33, 84, 11, 4);
      c.fill();
      c.fillStyle = '#9c663b';
      c.fillRect(-33, 31, 78, 3);
      // Блік на носку
      const gloss = c.createRadialGradient(24, 17, 2, 24, 18, 20);
      gloss.addColorStop(0, 'rgba(255,210,165,0.45)');
      gloss.addColorStop(1, 'rgba(255,210,165,0)');
      c.fillStyle = gloss;
      c.beginPath(); c.ellipse(24, 18, 18, 10, 0.25, 0, Math.PI * 2); c.fill();
      // Шнурівка та люверси
      c.strokeStyle = '#d7ab79'; c.lineWidth = 2.6; c.lineCap = 'round';
      for (let i = 0; i < 4; i++) {
        const ly = -32 + i * 10;
        c.beginPath(); c.moveTo(-2, ly); c.lineTo(12, ly + 5); c.stroke();
        c.beginPath(); c.moveTo(10, ly); c.lineTo(-2, ly + 5); c.stroke();
        c.fillStyle = '#c99352';
        c.beginPath(); c.arc(-2, ly + 2, 2.3, 0, Math.PI * 2); c.fill();
      }
      // Верхній манжет
      c.fillStyle = '#472411';
      c.beginPath(); c.ellipse(-12, -44, 18, 5, 0, 0, Math.PI * 2); c.fill();
    }

    else if (id === 'umbrella') {
      // Складена парасолька з дерев'яною ручкою
      c.save(); c.rotate(-0.42);
      // Гачок ручки
      c.strokeStyle = '#9c5a28'; c.lineWidth = 9; c.lineCap = 'round';
      c.beginPath();
      c.moveTo(-2, -32); c.lineTo(-2, -48);
      c.arc(-11, -48, 9, 0, Math.PI, true);
      c.stroke();
      c.strokeStyle = '#d48d52'; c.lineWidth = 3;
      c.beginPath(); c.moveTo(-4, -33); c.lineTo(-4, -47); c.stroke();
      // Складена тканина парасольки
      const ug = c.createLinearGradient(-16, -24, 18, 46);
      ug.addColorStop(0, '#5a7880');
      ug.addColorStop(0.5, '#314952');
      ug.addColorStop(1, '#18262c');
      c.fillStyle = ug;
      c.beginPath();
      c.moveTo(-9, -30); c.lineTo(9, -30);
      c.lineTo(17, 16); c.lineTo(3, 52); c.lineTo(-3, 52); c.lineTo(-17, 16);
      c.closePath(); c.fill();
      c.strokeStyle = '#142026'; c.lineWidth = 2; c.stroke();
      // Складки тканини
      c.strokeStyle = 'rgba(180,220,235,0.35)'; c.lineWidth = 2;
      c.beginPath(); c.moveTo(-4, -26); c.lineTo(-8, 16); c.lineTo(-1, 46); c.stroke();
      c.beginPath(); c.moveTo(4, -26); c.lineTo(8, 16); c.lineTo(1, 46); c.stroke();
      // Латунний наконечник та ремінець
      c.fillStyle = '#d9a44a';
      c.fillRect(-13, -4, 26, 5);

    else if (id === 'clock') {
      // Латунний будильник з двома дзвіночками

      c.strokeStyle = '#9a681e'; c.lineWidth = 6; c.lineCap = 'round';
      c.beginPath(); c.moveTo(-22, 26); c.lineTo(-29, 41); c.stroke();
      c.beginPath(); c.moveTo(22, 26); c.lineTo(29, 41); c.stroke();
      // Дзвіночки
      [-23, 23].forEach((bx, idx) => {

      });

      // Корпус

    else if (id === 'plunger') {

    else if (id === 'phone') {

      c.beginPath(); c.ellipse(-30, 10, 11, 7, 0.4, 0, Math.PI * 2); c.fill();

    else if (id === 'shower') {

      c.save(); c.rotate(0.28);
      // Ручка
      const sg = c.createLinearGradient(-14, -40, 22, 42);
      sg.addColorStop(0, '#fff29c'); sg.addColorStop(0.45, '#e6b822'); sg.addColorStop(1, '#8c6308');

      c.strokeStyle = '#5c3f05'; c.lineWidth = 2.4; c.stroke();

      c.stroke();
      // Диск з отворами
      const dg = c.createRadialGradient(-16, -18, 2, -14, -16, 20);
      dg.addColorStop(0, '#fff7c2'); dg.addColorStop(1, '#b88918');
      c.fillStyle = dg;
      c.beginPath(); c.ellipse(-14, -16, 15, 19, -0.35, 0, Math.PI * 2); c.fill();

      }

    else if (id === 'train') {

      c.beginPath(); c.roundRect(-47, -39, 44, 10, 4); c.fill(); c.stroke();
      // Віконце
      c.fillStyle = '#cfefff';
      c.fillRect(-34, -22, 18, 16);
      c.strokeStyle = '#5c1810'; c.strokeRect(-34, -22, 18, 16);
      // Котел (синій)
      const boil = c.createLinearGradient(-8, -14, -8, 20);
      boil.addColorStop(0, '#4ca3e8'); boil.addColorStop(0.5, '#2561a3'); boil.addColorStop(1, '#12335c');
      c.fillStyle = boil;
      c.beginPath(); c.roundRect(-10, -14, 48, 34, 8); c.fill(); c.stroke();
      // Труба
      c.fillStyle = '#2e8c4c';
      c.fillRect(16, -34, 14, 22); c.strokeRect(16, -34, 14, 22);
      c.fillStyle = '#ebb634';
      c.beginPath(); c.roundRect(12, -39, 22, 7, 3); c.fill(); c.stroke();
      // Передній бампер
      c.fillStyle = '#d93829';
      c.beginPath(); c.moveTo(38, 4); c.lineTo(50, 22); c.lineTo(38, 22); c.closePath(); c.fill(); c.stroke();
      // Колеса
      [-26, 2, 26].forEach((wx, idx) => {
        const r = idx === 0 ? 15 : 12;
        c.fillStyle = '#c42b1c';
        c.beginPath(); c.arc(wx, 24, r, 0, Math.PI * 2); c.fill();

        c.fillStyle = '#f2c144';
        c.beginPath(); c.arc(wx, 24, r * 0.45, 0, Math.PI * 2); c.fill();
      });

    else if (id === 'camera') {
      // Ретро-фотоапарат зі скляним об'єктивом

      const topG = c.createLinearGradient(-42, -34, 42, -10);

      c.beginPath(); c.roundRect(-42, -26, 84, 22, 7); c.fill();
      c.strokeStyle = '#262b30'; c.lineWidth = 2.2; c.stroke();
      // Кнопка спуску (червона)
      c.fillStyle = '#d93829';
      c.beginPath(); c.roundRect(18, -35, 14, 9, 3); c.fill(); c.stroke();
      // Видошукач
      c.fillStyle = '#73828f';
      c.beginPath(); c.roundRect(-14, -36, 28, 12, 4); c.fill(); c.stroke();
      // Шкіряний корпус
      const bodyG = c.createLinearGradient(0, -10, 0, 36);
