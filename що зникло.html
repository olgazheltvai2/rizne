<!DOCTYPE html>

<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер-гра на уважність</title>

    <!-- Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <style>
        /* ===== ОСНОВНІ СТИЛІ ===== */
        /* Шрифт — Arial (згідно з вимогою) */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #00bcd4;
            background-image:
                radial-gradient(#ffeb3b 15%, transparent 16%),
                radial-gradient(#ffeb3b 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            user-select: none;
        }

        /* Контейнер для ігрового поля — центрування з напівпрозорим фоном */
        #game-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Основний контейнер гри з напівпрозорим фоном */
        #game-container {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 40px 50px 50px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 0 4px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid rgba(0, 0, 0, 0.15);
            max-width: 780px;
            width: 100%;
            box-sizing: border-box;
        }

        /* Стилізація лічильника на 2 гравця */
        #scoreboard {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: repeating-linear-gradient(45deg, #ff5722, #ff5722 20px, #ff9800 20px, #ff9800 40px);
            border-bottom: 8px solid #000;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.3);
            z-index: 10;
            flex-shrink: 0;
        }

        .player-panel {
            background-color: #8bc34a;
            border: 6px solid #000;
            border-radius: 15px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 8px 8px 0 #000;
            transform: skewX(-5deg);
        }

        .player-panel:nth-child(2) {
            background-color: #e91e63;
        }

        .player-name {
            background: transparent;
            border: none;
            border-bottom: 4px dashed #000;
            text-align: center;
            font-size: 28px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            width: 200px;
            margin-bottom: 10px;
            outline: none;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-btn {
            background-color: #ffeb3b;
            border: 4px solid #000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            transition: all 0.1s;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .score-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 #000;
        }

        .score-value {
            font-size: 45px;
            color: #fff;
            text-shadow: 4px 4px 0 #000;
            min-width: 60px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        /* 3D Контейнер для картки */
        .card-container {
            perspective: 1500px;
            width: 600px;
            height: 400px;
            cursor: pointer;
            z-index: 5;
            max-width: 100%;
            max-height: 55vh;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg) scale(1.05);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 10px solid #000;
            border-radius: 25px;
            box-shadow: 15px 15px 0 rgba(0, 0, 0, 0.7);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-content: space-evenly;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Передня сторона картки — темний коміксний фон */
        .card-front {
            background-color: #263238;
            background-image: radial-gradient(#37474f 15%, transparent 16%), radial-gradient(#37474f 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        /* Задня сторона картки — темний коміксний фон */
        .card-back {
            background-color: #263238;
            background-image: radial-gradient(#37474f 15%, transparent 16%), radial-gradient(#37474f 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            transform: rotateY(180deg);
        }

        /* Емодзі на картці */
        .emoji-item {
            font-size: 80px;
            filter: drop-shadow(4px 4px 0px #000);
            transition: transform 0.3s;
        }

        .emoji-item:hover {
            transform: scale(1.2) rotate(10deg);
        }

        /* Кнопка "Нова картка" */
        #new-card-btn {
            background-color: #ff3d00;
            color: #fff;
            border: 6px solid #000;
            padding: 12px 32px;
            font-size: 28px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 8px 8px 0 #000;
            text-transform: uppercase;
            transform: skewX(-10deg);
            transition: all 0.2s;
            font-family: Arial, sans-serif;
            font-weight: bold;
            z-index: 10;
            margin-top: 20px;
            flex-shrink: 0;
        }

        #new-card-btn:active {
            transform: skewX(-10deg) translate(8px, 8px);
            box-shadow: 0px 0px 0 #000;
        }

        /* Інтерактивний персонаж: Кажан у польоті */
        #bat-character {
            position: absolute;
            bottom: 10px;
            left: 10px;
            width: 160px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(10px 10px 0px rgba(0, 0, 0, 0.5));
            animation: hoverBat 3s ease-in-out infinite;
        }

        @keyframes hoverBat {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(-3deg);
            }
        }

        /* Анімація крил */
        #left-wing {
            animation: flapLeft 0.3s ease-in-out infinite alternate;
            transform-origin: 60% 50%;
        }
        #right-wing {
            animation: flapRight 0.3s ease-in-out infinite alternate;
            transform-origin: 40% 50%;
        }

        @keyframes flapLeft {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(25deg);
            }
        }
        @keyframes flapRight {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-25deg);
            }
        }

        /* Анімація реакції персонажа */
        .reacting #bat-eyes {
            fill: #ffeb3b !important;
        }
        .reacting {
            animation: excite 0.5s !important;
        }
        @keyframes excite {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3) translateY(-40px);
            }
            100% {
                transform: scale(1);
            }
        }

        /* Елементи коміксного екшену (BOOM, ZAP) */
        .action-bubble {
            position: absolute;
            font-size: 60px;
            color: #ffeb3b;
            text-shadow: 5px 5px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transform: scale(0);
            font-family: Arial, sans-serif;
        }

        .show-bubble {
            animation: popBubble 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popBubble {
            0% {
                transform: scale(0) rotate(-20deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.5) rotate(10deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 0;
            }
        }

        /* Адаптивність */
        @media (max-width: 700px) {
            #game-container {
                padding: 20px 18px 30px 18px;
                border-radius: 28px;
            }
            .card-container {
                width: 100%;
                height: 300px;
            }
            .emoji-item {
                font-size: 50px;
            }
            #new-card-btn {
                font-size: 20px;
                padding: 10px 22px;
            }
            .player-name {
                font-size: 20px;
                width: 120px;
            }
            .score-value {
                font-size: 32px;
                min-width: 40px;
            }
            .score-btn {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            #bat-character {
                width: 100px;
                bottom: 4px;
                left: 4px;
            }
        }

        @media (max-width: 480px) {
            .card-container {
                height: 220px;
            }
            .emoji-item {
                font-size: 36px;
            }
            #game-container {
                padding: 14px 12px 20px 12px;
                border-radius: 20px;
            }
            #new-card-btn {
                font-size: 16px;
                padding: 8px 16px;
                margin-top: 12px;
            }
            .player-panel {
                padding: 6px 12px;
                transform: skewX(-3deg);
            }
            .player-name {
                font-size: 16px;
                width: 80px;
            }
            .score-value {
                font-size: 24px;
                min-width: 30px;
            }
            .score-btn {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }
            #scoreboard {
                padding: 8px;
                flex-wrap: wrap;
                gap: 6px;
            }
            #bat-character {
                width: 70px;
            }
        }
    </style>
</head>

<body>

    <!-- ===== Лічильник на 2 гравця ===== -->
    <div id="scoreboard">
        <div class="player-panel">
            <input type="text" class="player-name" value="ГРАВЕЦЬ 1" maxlength="12">
            <div class="score-display">
                <button class="score-btn minus" onclick="updateScore(1, -1)">-</button>
                <span class="score-value" id="score1">0</span>
                <button class="score-btn plus" onclick="updateScore(1, 1)">+</button>
            </div>
        </div>
        <div class="player-panel">
            <input type="text" class="player-name" value="ГРАВЕЦЬ 2" maxlength="12">
            <div class="score-display">
                <button class="score-btn minus" onclick="updateScore(2, -1)">-</button>
                <span class="score-value" id="score2">0</span>
                <button class="score-btn plus" onclick="updateScore(2, 1)">+</button>
            </div>
        </div>
    </div>

    <!-- ===== Ігрова зона ===== -->
    <div id="game-area">
        <!-- Основний контейнер гри з напівпрозорим фоном -->
        <div id="game-container">

            <!-- Деталізований SVG персонаж: Кажан у польоті -->
            <svg id="bat-character" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <!-- Ліве крило -->
                <path id="left-wing" d="M100,100 Q40,40 10,60 Q30,90 20,130 Q60,110 100,100" fill="#311b92" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
                <!-- Праве крило -->
                <path id="right-wing" d="M100,100 Q160,40 190,60 Q170,90 180,130 Q140,110 100,100" fill="#311b92" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
                <!-- Тіло та голова -->
                <ellipse cx="100" cy="110" rx="25" ry="30" fill="#4527a0" stroke="#000" stroke-width="4"/>
                <circle cx="100" cy="85" r="22" fill="#5e35b1" stroke="#000" stroke-width="4"/>
                <!-- Вуха -->
                <path d="M85,70 L75,40 L95,65 Z" fill="#5e35b1" stroke="#000" stroke-width="3"/>
                <path d="M115,70 L125,40 L105,65 Z" fill="#5e35b1" stroke="#000" stroke-width="3"/>
                <!-- Очі -->
                <g id="bat-eyes" fill="#fff">
                    <ellipse cx="92" cy="82" rx="6" ry="8" stroke="#000" stroke-width="2"/>
                    <ellipse cx="108" cy="82" rx="6" ry="8" stroke="#000" stroke-width="2"/>
                    <circle cx="92" cy="82" r="2" fill="#000"/>
                    <circle cx="108" cy="82" r="2" fill="#000"/>
                </g>
                <!-- Рот (ікла) -->
                <path d="M95,95 Q100,100 105,95" fill="none" stroke="#000" stroke-width="2"/>
                <path d="M96,95 L98,102 L100,95" fill="#fff" stroke="#000" stroke-width="1"/>
                <path d="M100,95 L102,102 L104,95" fill="#fff" stroke="#000" stroke-width="1"/>
            </svg>

            <!-- Картка -->
            <div class="card-container" id="card" onclick="flipCard()">
                <div class="card" id="card-inner">
                    <div class="card-face card-front" id="front-face">
                        <!-- Емодзі генеруються тут -->
                    </div>
                    <div class="card-face card-back" id="back-face">
                        <!-- Залишок емодзі генерується тут -->
                    </div>
                </div>
            </div>

            <!-- Ефект вибуху для коміксу -->
            <div class="action-bubble" id="action-text">ZAP!</div>

            <button id="new-card-btn" onclick="generateNewCard()">Нова картка</button>

        </div>
    </div>

    <script>
        // ================================================================
        // 1. ОРИГІНАЛЬНА ЛОГІКА ГРИ (збережена слово в слово)
        // ================================================================

        // Рівно 50 емодзі для гри
        const emojiPool = [
            '🍎', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍈', '🍒',
            '🍑', '🥭', '🍍', '🥥', '🥝', '🍅', '🍆', '🥑', '🥦', '🥬',
            '🥒', '🌶', '🌽', '🥕', '🥔', '🍠', '🥐', '🍞', '🥖', '🥨',
            '🧀', '🥚', '🍳', '🥞', '🥓', '🥩', '🍗', '🍖', '🌭', '🍔',
            '🍟', '🍕', '🥪', '🥙', '🌮', '🌯', '🥗', '🥘', '🥫', '🍝'
        ];

        let currentCardEmojis = [];
        let isFlipped = false;

        // Аудіо контекст для генерації звуків "на льоту" (без файлів)
        const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

        // Функція програвання синтезованих звуків
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'flip') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'click') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'magic') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                oscillator.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            }
        }

        // Логіка оновлення рахунку
        const scores = { 1: 0, 2: 0 };

        function updateScore(player, change) {
            playSound('click');
            scores[player] += change;
            if (scores[player] < 0) scores[player] = 0;
            document.getElementById('score' + player).innerText = scores[player];

            const scoreEl = document.getElementById('score' + player);
            scoreEl.style.transform = 'scale(1.5)';
            setTimeout(() => { scoreEl.style.transform = 'scale(1)'; }, 150);

            // Синхронізація через Firebase (якщо підключено)
            if (typeof firebaseSync !== 'undefined' && firebaseSync.ready) {
                firebaseSync.sendAction('scoreUpdate', { player: player, value: scores[player] });
            }
        }

        // Перемішування масиву (Алгоритм Фішера-Єтса)
        function shuffle(array) {
            let currentIndex = array.length,
                randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Отримання 6 випадкових унікальних емодзі
        function getRandomEmojis() {
            const shuffledPool = shuffle([...emojiPool]);
            return shuffledPool.slice(0, 6);
        }

        // Рендер емодзі у контейнер
        function renderEmojis(containerId, emojisList) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            const styledEmojis = emojisList.map(emoji => {
                const randomOrder = Math.floor(Math.random() * 20);
                return `<div class="emoji-item" style="order: ${randomOrder};">${emoji}</div>`;
            });

            container.innerHTML = styledEmojis.join('');
        }

        // Генерація нової картки (початковий стан)
        function generateNewCard() {
            playSound('magic');

            const cardInner = document.getElementById('card-inner');
            if (isFlipped) {
                cardInner.classList.remove('flipped');
                isFlipped = false;
                setTimeout(() => {
                    setupCardData();
                }, 400);
            } else {
                setupCardData();
            }

            const bat = document.getElementById('bat-character');
            bat.classList.add('reacting');
            setTimeout(() => bat.classList.remove('reacting'), 500);

            // Синхронізація через Firebase
            if (typeof firebaseSync !== 'undefined' && firebaseSync.ready) {
                firebaseSync.sendAction('newCard', { emojis: currentCardEmojis, flipped: isFlipped });
            }
        }

        // Підготовка даних для картки
        function setupCardData() {
            currentCardEmojis = getRandomEmojis();
            renderEmojis('front-face', currentCardEmojis);

            let backEmojis = [...currentCardEmojis];
            const removeIndex = Math.floor(Math.random() * backEmojis.length);
            backEmojis.splice(removeIndex, 1);
            renderEmojis('back-face', backEmojis);
        }

        // Перегортання картки по кліку
        function flipCard() {
            playSound('flip');
            const cardInner = document.getElementById('card-inner');

            if (isFlipped) {
                cardInner.classList.remove('flipped');
                isFlipped = false;
            } else {
                cardInner.classList.add('flipped');
                isFlipped = true;
            }

            const actionText = document.getElementById('action-text');
            const texts = ['POOF!', 'ZAP!', 'WHOOSH!', 'BAM!'];
            actionText.innerText = texts[Math.floor(Math.random() * texts.length)];

            actionText.style.top = (Math.random() * 40 + 30) + '%';
            actionText.style.left = (Math.random() * 40 + 30) + '%';

            actionText.classList.remove('show-bubble');
            void actionText.offsetWidth;
            actionText.classList.add('show-bubble');

            const bat = document.getElementById('bat-character');
            bat.classList.add('reacting');
            setTimeout(() => bat.classList.remove('reacting'), 500);

            // Синхронізація через Firebase
            if (typeof firebaseSync !== 'undefined' && firebaseSync.ready) {
                firebaseSync.sendAction('flipCard', { flipped: isFlipped });
            }
        }

        // Запуск гри при завантаженні
        window.onload = function() {
            generateNewCard();
            // Ініціалізація Firebase виконується нижче
            initFirebase();
        };


        // ================================================================
        // 2. ІНТЕГРАЦІЯ FIREBASE (синхронізація та пульт)
        // ================================================================

        // Конфігурація Firebase (базова, за потреби замінити на свої дані)
        const firebaseConfig = {
            apiKey: "AIzaSyB3VwT7k7Ql5l5l5l5l5l5l5l5l5l5l5",
            authDomain: "example.firebaseapp.com",
            databaseURL: "https://example-default-rtdb.firebaseio.com",
            projectId: "example",
            storageBucket: "example.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef123456"
        };

        // Ініціалізація Firebase (з обробкою помилок)
        let firebaseApp = null;
        let firebaseDb = null;
        let deviceId = '';

        function initFirebase() {
            try {
                if (typeof firebase === 'undefined' || typeof firebase.initializeApp !== 'function') {
                    console.warn('Firebase не завантажено. Синхронізація недоступна.');
                    return;
                }

                // Перевіряємо, чи вже ініціалізовано
                if (firebase.apps.length > 0) {
                    firebaseApp = firebase.apps[0];
                } else {
                    firebaseApp = firebase.initializeApp(firebaseConfig);
                }
                firebaseDb = firebase.database(firebaseApp);

                // Генерація унікального deviceId
                deviceId = 'device_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

                // Підписуємося на команди з пульта
                listenForCommands();

                // Підписуємося на синхронізацію ігрових дій
                listenForGameActions();

                console.log('Firebase синхронізацію активовано. DeviceId:', deviceId);

                // Позначаємо готовність
                window.firebaseSync = {
                    ready: true,
                    sendAction: sendGameAction,
                    deviceId: deviceId
                };

            } catch (err) {
                console.warn('Помилка ініціалізації Firebase:', err.message);
                window.firebaseSync = { ready: false, sendAction: function() {} };
            }
        }

        // Відправка ігрової дії (клік/хід) для синхронізації
        function sendGameAction(action, data) {
            if (!firebaseDb || !deviceId) return;
            try {
                const payload = {
                    deviceId: deviceId,
                    action: action,
                    data: data || {},
                    timestamp: Date.now()
                };
                // Використовуємо транзакцію, щоб уникнути зациклення
                const ref = firebaseDb.ref('gameActions/' + deviceId);
                ref.set(payload);
                // Також відправляємо в загальний потік для інших пристроїв
                firebaseDb.ref('gameActions/broadcast').push(payload);
            } catch (err) {
                // Мовчки ігноруємо помилки синхронізації
            }
        }

        // Слухач для ігрових дій від інших пристроїв
        function listenForGameActions() {
            if (!firebaseDb) return;
            const broadcastRef = firebaseDb.ref('gameActions/broadcast');
            broadcastRef.orderByChild('timestamp').limitToLast(50).on('child_added', function(snapshot) {
                const payload = snapshot.val();
                if (!payload || payload.deviceId === deviceId) return; // Ігноруємо свої дії

                // Обробляємо отриману дію
                handleRemoteAction(payload);
            });
        }

        // Обробка віддалених дій
        function handleRemoteAction(payload) {
            const action = payload.action;
            const data = payload.data || {};

            switch (action) {
                case 'flipCard':
                    // Синхронізація перегортання картки
                    const cardInner = document.getElementById('card-inner');
                    const shouldBeFlipped = data.flipped === true;
                    if (shouldBeFlipped !== isFlipped) {
                        flipCard();
                    }
                    break;

                case 'newCard':
                    // Генерація нової картки
                    generateNewCard();
                    break;

                case 'scoreUpdate':
                    // Оновлення рахунку
                    const player = data.player;
                    const value = data.value;
                    if (player && value !== undefined) {
                        scores[player] = value;
                        document.getElementById('score' + player).innerText = value;
                    }
                    break;

                default:
                    // Невідома дія — ігноруємо
                    break;
            }
        }

        // Слухач для команд з пульта (повернення в Лобі)
        function listenForCommands() {
            if (!firebaseDb) return;
            const cmdRef = firebaseDb.ref('commands');
            cmdRef.on('child_added', function(snapshot) {
                const cmd = snapshot.val();
                if (!cmd) return;

                // Команда повернення в Лобі
                if (cmd.action === 'gotoLobby' || cmd.action === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html';
                }

                // Команди, пов'язані з фонами, більше не обробляються
            });
        }

        // Додаткова ініціалізація при завантаженні
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(function() {
                initFirebase();
            }, 100);
        }
    </script>
