<!DOCTYPE html>

<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Супер-гра на уважність</title>

    <!-- Firebase compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js">
    </script>

    <style>
        /* ===== ОСНОВНІ СТИЛІ ===== */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-color: #00bcd4;
            background-image:
                radial-gradient(#ffeb3b 15%, transparent 16%),
                radial-gradient(#ffeb3b 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            user-select: none;
        }

        #game-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-container {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 40px 50px 50px 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), inset 0 0 0 4px rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            border: 4px solid rgba(0, 0, 0, 0.15);
            max-width: 780px;
            width: 100%;
            box-sizing: border-box;
        }

        #scoreboard {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: repeating-linear-gradient(45deg, #ff5722, #ff5722 20px, #ff9800 20px, #ff9800 40px);
            border-bottom: 8px solid #000;
            box-shadow: 0 10px 0 rgba(0, 0, 0, 0.3);
            z-index: 10;
            flex-shrink: 0;
        }

        .player-panel {
            background-color: #8bc34a;
            border: 6px solid #000;
            border-radius: 15px;
            padding: 10px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 8px 8px 0 #000;
            transform: skewX(-5deg);
        }

        .player-panel:nth-child(2) {
            background-color: #e91e63;
        }

        .player-name {
            background: transparent;
            border: none;
            border-bottom: 4px dashed #000;
            text-align: center;
            font-size: 28px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #fff;
            text-shadow: 3px 3px 0 #000;
            width: 200px;
            margin-bottom: 10px;
            outline: none;
        }

        .score-display {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .score-btn {
            background-color: #ffeb3b;
            border: 4px solid #000;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 30px;
            cursor: pointer;
            box-shadow: 4px 4px 0 #000;
            transition: all 0.1s;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .score-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0 #000;
        }

        .score-value {
            font-size: 45px;
            color: #fff;
            text-shadow: 4px 4px 0 #000;
            min-width: 60px;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        .card-container {
            perspective: 1500px;
            width: 600px;
            height: 400px;
            cursor: pointer;
            z-index: 5;
            max-width: 100%;
            max-height: 55vh;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card.flipped {
            transform: rotateY(180deg) scale(1.05);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border: 10px solid #000;
            border-radius: 25px;
            box-shadow: 15px 15px 0 rgba(0, 0, 0, 0.7);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-content: space-evenly;
            padding: 20px;
            box-sizing: border-box;
        }

        .card-front {
            background-color: #263238;
            background-image: radial-gradient(#37474f 15%, transparent 16%), radial-gradient(#37474f 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        .card-back {
            background-color: #263238;
            background-image: radial-gradient(#37474f 15%, transparent 16%), radial-gradient(#37474f 15%, transparent 16%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            transform: rotateY(180deg);
        }

        .emoji-item {
            font-size: 80px;
            filter: drop-shadow(4px 4px 0px #000);
            transition: transform 0.3s;
        }

        .emoji-item:hover {
            transform: scale(1.2) rotate(10deg);
        }

        #new-card-btn {
            background-color: #ff3d00;
            color: #fff;
            border: 6px solid #000;
            padding: 12px 32px;
            font-size: 28px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 8px 8px 0 #000;
            text-transform: uppercase;
            transform: skewX(-10deg);
            transition: all 0.2s;
            font-family: Arial, sans-serif;
            font-weight: bold;
            z-index: 10;
            margin-top: 20px;
            flex-shrink: 0;
        }

        #new-card-btn:active {
            transform: skewX(-10deg) translate(8px, 8px);
            box-shadow: 0px 0px 0 #000;
        }

        #bat-character {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 160px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            filter: drop-shadow(10px 10px 0px rgba(0, 0, 0, 0.5));
            animation: hoverBat 3s ease-in-out infinite;
        }

        @keyframes hoverBat {
            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(-3deg);
            }
        }

        #left-wing {
            animation: flapLeft 0.3s ease-in-out infinite alternate;
            transform-origin: 60% 50%;
        }
        #right-wing {
            animation: flapRight 0.3s ease-in-out infinite alternate;
            transform-origin: 40% 50%;
        }

        @keyframes flapLeft {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(25deg);
            }
        }
        @keyframes flapRight {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(-25deg);
            }
        }

        .reacting #bat-eyes {
            fill: #ffeb3b !important;
        }
        .reacting {
            animation: excite 0.5s !important;
        }
        @keyframes excite {
            0% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3) translateY(-40px);
            }
            100% {
                transform: scale(1);
            }
        }

        .action-bubble {
            position: absolute;
            font-size: 60px;
            color: #ffeb3b;
            text-shadow: 5px 5px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transform: scale(0);
            font-family: Arial, sans-serif;
        }

        .show-bubble {
            animation: popBubble 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popBubble {
            0% {
                transform: scale(0) rotate(-20deg);
                opacity: 0;
            }
            50% {
                transform: scale(1.5) rotate(10deg);
                opacity: 1;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 0;
            }
        }

        @media (max-width: 700px) {
            #game-container {
                padding: 20px 18px 30px 18px;
                border-radius: 28px;
            }
            .card-container {
                width: 100%;
                height: 300px;
            }
            .emoji-item {
                font-size: 50px;
            }
            #new-card-btn {
                font-size: 20px;
                padding: 10px 22px;
            }
            .player-name {
                font-size: 20px;
                width: 120px;
            }
            .score-value {
                font-size: 32px;
                min-width: 40px;
            }
            .score-btn {
                width: 40px;
                height: 40px;
                font-size: 22px;
            }
            #bat-character {
                width: 100px;
                bottom: 4px;
                left: 0;
            }
        }

        @media (max-width: 480px) {
            .card-container {
                height: 220px;
            }
            .emoji-item {
                font-size: 36px;
            }
            #game-container {
                padding: 14px 12px 20px 12px;
                border-radius: 20px;
            }
            #new-card-btn {
                font-size: 16px;
                padding: 8px 16px;
                margin-top: 12px;
            }
            .player-panel {
                padding: 6px 12px;
                transform: skewX(-3deg);
            }
            .player-name {
                font-size: 16px;
                width: 80px;
            }
            .score-value {
                font-size: 24px;
                min-width: 30px;
            }
            .score-btn {
                width: 32px;
                height: 32px;
                font-size: 18px;
            }
            #scoreboard {
                padding: 8px;
                flex-wrap: wrap;
                gap: 6px;
            }
            #bat-character {
                width: 70px;
                bottom: 4px;
                left: 0;
            }
        }
    </style>
</head>

<body>

    <div id="scoreboard">
        <div class="player-panel">
            <input type="text" class="player-name" value="ГРАВЕЦЬ 1" maxlength="12">
            <div class="score-display">
                <button class="score-btn minus" onclick="updateScore(1, -1)">-</button>
                <span class="score-value" id="score1">0</span>
                <button class="score-btn plus" onclick="updateScore(1, 1)">+</button>
            </div>
        </div>
        <div class="player-panel">
            <input type="text" class="player-name" value="ГРАВЕЦЬ 2" maxlength="12">
            <div class="score-display">
                <button class="score-btn minus" onclick="updateScore(2, -1)">-</button>
                <span class="score-value" id="score2">0</span>
                <button class="score-btn plus" onclick="updateScore(2, 1)">+</button>
            </div>
        </div>
    </div>

    <div id="game-area">
        <div id="game-container">

            <svg id="bat-character" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
                <path id="left-wing" d="M100,100 Q40,40 10,60 Q30,90 20,130 Q60,110 100,100" fill="#311b92" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
                <path id="right-wing" d="M100,100 Q160,40 190,60 Q170,90 180,130 Q140,110 100,100" fill="#311b92" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
                <ellipse cx="100" cy="110" rx="25" ry="30" fill="#4527a0" stroke="#000" stroke-width="4"/>
                <circle cx="100" cy="85" r="22" fill="#5e35b1" stroke="#000" stroke-width="4"/>
                <path d="M85,70 L75,40 L95,65 Z" fill="#5e35b1" stroke="#000" stroke-width="3"/>
                <path d="M115,70 L125,40 L105,65 Z" fill="#5e35b1" stroke="#000" stroke-width="3"/>
                <g id="bat-eyes" fill="#fff">
                    <ellipse cx="92" cy="82" rx="6" ry="8" stroke="#000" stroke-width="2"/>
                    <ellipse cx="108" cy="82" rx="6" ry="8" stroke="#000" stroke-width="2"/>
                    <circle cx="92" cy="82" r="2" fill="#000"/>
                    <circle cx="108" cy="82" r="2" fill="#000"/>
                </g>
                <path d="M95,95 Q100,100 105,95" fill="none" stroke="#000" stroke-width="2"/>
                <path d="M96,95 L98,102 L100,95" fill="#fff" stroke="#000" stroke-width="1"/>
                <path d="M100,95 L102,102 L104,95" fill="#fff" stroke="#000" stroke-width="1"/>
            </svg>

            <div class="card-container" id="card" onclick="flipCard()">
                <div class="card" id="card-inner">
                    <div class="card-face card-front" id="front-face"></div>
                    <div class="card-face card-back" id="back-face"></div>
                </div>
            </div>

            <div class="action-bubble" id="action-text">ZAP!</div>

            <button id="new-card-btn" onclick="generateNewCard()">Нова картка</button>

        </div>
    </div>

    <script>
        // ================================================================
        // ОРИГІНАЛЬНА ЛОГІКА ГРИ
        // ================================================================

        const emojiPool = [
            '🍎', '🍐', '🍊', '🍋', '🍌', '🍉', '🍇', '🍓', '🍈', '🍒',
            '🍑', '🥭', '🍍', '🥥', '🥝', '🍅', '🍆', '🥑', '🥦', '🥬',
            '🥒', '🌶', '🌽', '🥕', '🥔', '🍠', '🥐', '🍞', '🥖', '🥨',
            '🧀', '🥚', '🍳', '🥞', '🥓', '🥩', '🍗', '🍖', '🌭', '🍔',
            '🍟', '🍕', '🥪', '🥙', '🌮', '🌯', '🥗', '🥘', '🥫', '🍝'
        ];

        let currentCardEmojis = [];
        let isFlipped = false;
        const scores = { 1: 0, 2: 0 };

        const audioCtx = new(window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            if (type === 'flip') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(400, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.15);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'click') {
                oscillator.type = 'square';
                oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'magic') {
                oscillator.type = 'triangle';
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
                oscillator.frequency.linearRampToValueAtTime(400, audioCtx.currentTime + 0.2);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.2);
            }
        }

        function shuffle(array) {
            let currentIndex = array.length,
                randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function getRandomEmojis() {
            const shuffledPool = shuffle([...emojiPool]);
            return shuffledPool.slice(0, 6);
        }

        // Однаковий порядок на всіх пристроях – без випадкового сортування
        function renderEmojis(containerId, emojisList) {
            const container = document.getElementById(containerId);
            if (!container) return;
            container.innerHTML = '';
            const styledEmojis = emojisList.map(emoji => {
                return `<div class="emoji-item">${emoji}</div>`;
            });
            container.innerHTML = styledEmojis.join('');
        }

        function setCardData(emojis, flippedState) {
            currentCardEmojis = emojis || getRandomEmojis();
            renderEmojis('front-face', currentCardEmojis);
            let backEmojis = [...currentCardEmojis];
            if (backEmojis.length > 1) {
                const removeIndex = Math.floor(Math.random() * backEmojis.length);
                backEmojis.splice(removeIndex, 1);
            } else {
                backEmojis = [];
            }
            renderEmojis('back-face', backEmojis);

            const cardInner = document.getElementById('card-inner');
            if (flippedState) {
                cardInner.classList.add('flipped');
            } else {
                cardInner.classList.remove('flipped');
            }
            isFlipped = !!flippedState;
        }

        // ===== ОСНОВНІ ФУНКЦІЇ (ВИКЛИКАЮТЬ BROADCAST) =====
        function generateNewCard() {
            playSound('magic');
            const newEmojis = getRandomEmojis();
            setCardData(newEmojis, false);
            const bat = document.getElementById('bat-character');
            bat.classList.add('reacting');
            setTimeout(() => bat.classList.remove('reacting'), 500);
            broadcastAction({ type: 'newCard', emojis: currentCardEmojis, flipped: false });
        }

        function flipCard() {
            playSound('flip');
            const newFlipped = !isFlipped;
            const cardInner = document.getElementById('card-inner');
            if (newFlipped) {
                cardInner.classList.add('flipped');
            } else {
                cardInner.classList.remove('flipped');
            }
            isFlipped = newFlipped;

            const actionText = document.getElementById('action-text');
            const texts = ['POOF!', 'ZAP!', 'WHOOSH!', 'BAM!'];
            actionText.innerText = texts[Math.floor(Math.random() * texts.length)];
            actionText.style.top = (Math.random() * 40 + 30) + '%';
            actionText.style.left = (Math.random() * 40 + 30) + '%';
            actionText.classList.remove('show-bubble');
            void actionText.offsetWidth;
            actionText.classList.add('show-bubble');

            const bat = document.getElementById('bat-character');
            bat.classList.add('reacting');
            setTimeout(() => bat.classList.remove('reacting'), 500);

            broadcastAction({ type: 'flip', flipped: isFlipped });
        }

        function updateScore(player, change) {
            playSound('click');
            scores[player] += change;
            if (scores[player] < 0) scores[player] = 0;
            document.getElementById('score' + player).innerText = scores[player];

            const scoreEl = document.getElementById('score' + player);
            scoreEl.style.transform = 'scale(1.5)';
            setTimeout(() => { scoreEl.style.transform = 'scale(1)'; }, 150);

            broadcastAction({ type: 'scoreUpdate', player: player, value: scores[player] });
        }

        // ================================================================
        // FIREBASE СИНХРОНІЗАЦІЯ (спрощена, як у зразку)
        // ================================================================

        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        const myDeviceId = Math.random().toString(36).substring(2, 10);
        let isRemoteAction = false;
        let isInitialized = false;

        // ---- Слухач для переходу в лобі ----
        db.ref('current_activity').on('value', (snapshot) => {
            if (snapshot.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html';
            }
        });

        // ---- Слухач для синхронізації дій (один вузол) ----
        db.ref('chess_action_sync').on('value', (snap) => {
            const action = snap.val();
            // Якщо дії немає або вона відправлена цим же пристроєм – ігноруємо
            if (!action || action.senderId === myDeviceId) return;

            isRemoteAction = true;

            switch (action.type) {
                case 'flip':
                    const cardInner = document.getElementById('card-inner');
                    if (action.flipped) {
                        cardInner.classList.add('flipped');
                    } else {
                        cardInner.classList.remove('flipped');
                    }
                    isFlipped = !!action.flipped;
                    break;

                case 'newCard':
                    if (action.emojis && action.emojis.length > 0) {
                        setCardData(action.emojis, action.flipped || false);
                    }
                    break;

                case 'scoreUpdate':
                    const player = action.player;
                    const value = action.value;
                    if (player && value !== undefined) {
                        scores[player] = value;
                        document.getElementById('score' + player).innerText = value;
                    }
                    break;

                default:
                    break;
            }

            isRemoteAction = false;
        });

        // ---- Відправка дії (set) ----
        function broadcastAction(actionData) {
            if (!isRemoteAction) {
                actionData.senderId = myDeviceId;
                actionData.time = Date.now();
                db.ref('chess_action_sync').set(actionData);
            }
        }

        // ---- Ініціалізація гри ----
        function initGame() {
            if (isInitialized) return;
            isInitialized = true;

            const newEmojis = getRandomEmojis();
            setCardData(newEmojis, false);

            // Відправляємо початковий стан, щоб інші пристрої синхронізувалися
            setTimeout(() => {
                broadcastAction({ type: 'newCard', emojis: currentCardEmojis, flipped: false });
            }, 500);
        }

        // ---- Запуск ----
        window.onload = function() {
            if (firebase.apps.length > 0) {
                initGame();
            } else {
                // Локальний запуск, якщо Firebase не завантажився
                const newEmojis = getRandomEmojis();
                setCardData(newEmojis, false);
            }
        };

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            setTimeout(() => {
                if (firebase.apps.length > 0) initGame();
            }, 100);
        }
    </script>

<!-- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ -->
<!-- 1. Екран-заглушка -->
<div id="block-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); color: white; z-index: 99999; justify-content: center; align-items: center; flex-direction: column; font-family: sans-serif;">
    <h1 style="color: #e74c3c; font-size: 50px; margin:0;">Зачекай! ✋</h1>
    <p style="font-size: 24px;">Зараз не твій урок.</p>
</div>

<!-- 2. Логіка Firebase (переконайтеся, що бібліотеки Firebase підключені в <head> гри) -->
<script>
    // Якщо у грі ще не ініціалізовано Firebase, розкоментуйте наступні два рядки:
    // firebase.initializeApp({ databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/" });
    // const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const myName = urlParams.get('user') || 'Гість';

    const myPresenceRef = db.ref('online_users/' + myName);
    myPresenceRef.set(true);
    myPresenceRef.onDisconnect().remove();

    db.ref('blocked_users/' + myName).on('value', (snapshot) => {
        const overlay = document.getElementById('block-overlay');
        if (snapshot.val() === true) { overlay.style.display = 'flex'; } 
        else { overlay.style.display = 'none'; }
    });
</script>
