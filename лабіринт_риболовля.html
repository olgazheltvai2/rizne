<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title></title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #07222d;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      width: 100vw;
      height: 100vh;
      cursor: pointer;
    }

    /* Minimalist circular glass-and-brass "Next" button (no text) */
    #nextBtn {
      position: fixed;
      top: 18px;
      right: 18px;
      width: 54px;
      height: 54px;
      border-radius: 50%;
      border: 2.5px solid rgba(226, 189, 118, 0.85);
      background: radial-gradient(circle at 32% 28%, rgba(255, 248, 225, 0.42), rgba(24, 68, 78, 0.45) 70%, rgba(12, 36, 44, 0.62));
      box-shadow:
        0 6px 18px rgba(0, 0, 0, 0.32),
        inset 0 2px 4px rgba(255, 250, 230, 0.45),
        inset 0 -3px 6px rgba(10, 30, 38, 0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 20;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      outline: none;
      padding: 0;
    }

    #nextBtn:hover {
      transform: scale(1.09);
      border-color: rgba(252, 222, 152, 0.98);
      box-shadow:
        0 8px 24px rgba(0, 0, 0, 0.38),
        0 0 16px rgba(245, 208, 128, 0.35),
        inset 0 2px 6px rgba(255, 250, 235, 0.6);
    }

    #nextBtn:active {
      transform: scale(0.93);
    }

    #nextBtn svg {
      width: 26px;
      height: 26px;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.45));
      transition: transform 0.2s ease;
    }

    #nextBtn:hover svg {
      transform: translateX(2px);
    }

    /* Minimalist wood-and-brass 2-level switcher (top-left, digits 1 & 2 only) */
    #levelSwitcher {
      position: fixed;
      top: 18px;
      left: 18px;
      display: flex;
      gap: 12px;
      z-index: 20;
    }

    .lvl-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2.5px solid rgba(205, 165, 98, 0.78);
      background: radial-gradient(circle at 32% 28%, rgba(138, 92, 54, 0.88), rgba(74, 46, 25, 0.92) 72%, rgba(44, 26, 14, 0.96));
      box-shadow:
        0 6px 16px rgba(0, 0, 0, 0.34),
        inset 0 2px 4px rgba(255, 228, 175, 0.35),
        inset 0 -3px 6px rgba(20, 10, 4, 0.55);
      color: #f7e6c4;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.22s ease, border-color 0.22s ease, background 0.22s ease;
    }

    .lvl-btn:hover {
      transform: scale(1.08);
      border-color: rgba(246, 212, 134, 0.95);
    }

    .lvl-btn:active {
      transform: scale(0.93);
    }

    .lvl-btn.active {
      border-color: #ffe38e;
      background: radial-gradient(circle at 32% 26%, #e7b85d, #a86c2c 68%, #6d4117);
      color: #fffdf4;
      box-shadow:
        0 6px 20px rgba(0, 0, 0, 0.38),
        0 0 18px rgba(255, 216, 112, 0.65),
        inset 0 2px 6px rgba(255, 250, 224, 0.72);
      transform: scale(1.06);
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <!-- Minimalist wood-and-brass level selector (1 = classic 4 lines, 2 = tangled 5 lines) -->
  <div id="levelSwitcher">
    <button class="lvl-btn active" id="lvlBtn1" data-level="1" aria-label="1">1</button>
    <button class="lvl-btn" id="lvlBtn2" data-level="2" aria-label="2">2</button>
  </div>

  <!-- Minimalist circular Next button with clean right-pointing arrow icon (zero text) -->
  <button id="nextBtn" aria-label="Next">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff7e2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h13" />
      <path d="M13 6l6 6-6 6" />
    </svg>
  </button>

  <script>
    (() => {
      'use strict';

      // =========================================================================
      // 1. CANVAS & VIEWPORT SETUP
      // =========================================================================
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const nextBtn = document.getElementById('nextBtn');
      const lvlBtn1 = document.getElementById('lvlBtn1');
      const lvlBtn2 = document.getElementById('lvlBtn2');

      let W = window.innerWidth;
      let H = window.innerHeight;
      let DPR = Math.min(window.devicePixelRatio || 1, 2);
      let waterlineY = H * 0.285;

      function resizeCanvas() {
        W = window.innerWidth;
        H = window.innerHeight;
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        waterlineY = H * 0.285;
        if (game && game.initialized) {
          rebuildSceneGeometry();
        }
      }

      // =========================================================================
      // 2. WEB AUDIO API PROCEDURAL SOUND ENGINE (ZERO EXTERNAL FILES)
      // =========================================================================
      class SoundEngine {
        constructor() {
          this.ctx = null;
          this.noiseBuffer = null;
        }

        ensureContext() {
          try {
            if (!this.ctx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              if (!AudioCtx) return null;
              this.ctx = new AudioCtx();
              this.createNoiseBuffer();
            }
            if (this.ctx.state === 'suspended') {
              this.ctx.resume();
            }
            return this.ctx;
          } catch (e) {
            return null;
          }
        }

        createNoiseBuffer() {
          if (!this.ctx) return;
          const length = this.ctx.sampleRate * 1.5;
          const buffer = this.ctx.createBuffer(1, length, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < length; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          this.noiseBuffer = buffer;
        }

        playBubblePop(baseFreq = 420, volume = 0.08) {
          const ac = this.ensureContext();
          if (!ac) return;
          const now = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(baseFreq, now);
          osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.1, now + 0.085);
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(volume, now + 0.015);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.095);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(now);
          osc.stop(now + 0.1);
        }

        playNextPlop() {
          const ac = this.ensureContext();
          if (!ac) return;
          const now = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(340, now);
          osc.frequency.exponentialRampToValueAtTime(660, now + 0.07);
          osc.frequency.exponentialRampToValueAtTime(480, now + 0.14);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.11, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        }

        playLevelSwitch(lvl) {
          const ac = this.ensureContext();
          if (!ac) return;
          const now = ac.currentTime;
          const freqs = lvl === 1 ? [440, 554.37] : [523.25, 698.46];
          freqs.forEach((f, idx) => {
            const t = now + idx * 0.06;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, t);
            gain.gain.setValueAtTime(0.001, t);
            gain.gain.linearRampToValueAtTime(0.1, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(t);
            osc.stop(t + 0.24);
          });
        }

        playWrongWobble() {
          const ac = this.ensureContext();
          if (!ac) return;
          const now = ac.currentTime;
          const osc = ac.createOscillator();
          const lfo = ac.createOscillator();
          const lfoGain = ac.createGain();
          const gain = ac.createGain();
          const filter = ac.createBiquadFilter();

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(210, now);
          osc.frequency.exponentialRampToValueAtTime(135, now + 0.34);

          lfo.type = 'sine';
          lfo.frequency.setValueAtTime(14, now);
          lfoGain.gain.setValueAtTime(22, now);
          lfo.connect(lfoGain);
          lfoGain.connect(osc.frequency);

          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(520, now);

          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.14, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.36);

          osc.connect(filter);
          filter.connect(gain);
          gain.connect(ac.destination);

          osc.start(now);
          lfo.start(now);
          osc.stop(now + 0.38);
          lfo.stop(now + 0.38);

          setTimeout(() => this.playBubblePop(320, 0.06), 70);
          setTimeout(() => this.playBubblePop(460, 0.05), 160);
        }

        playTraceChime() {
          const ac = this.ensureContext();
          if (!ac) return;
          const notes = [523.25, 587.33, 659.25, 783.99, 880.0, 1046.5];
          const now = ac.currentTime;
          notes.forEach((freq, idx) => {
            const t = now + idx * 0.09;
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.linearRampToValueAtTime(0.085, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(t);
            osc.stop(t + 0.36);
          });
        }

        playReelClick() {
          const ac = this.ensureContext();
          if (!ac) return;
          const now = ac.currentTime;
          const osc = ac.createOscillator();
          const gain = ac.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(1400 + Math.random() * 300, now);
          osc.frequency.exponentialRampToValueAtTime(420, now + 0.022);
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(0.045, now + 0.003);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.028);
          osc.connect(gain);
          gain.connect(ac.destination);
          osc.start(now);
          osc.stop(now + 0.03);
        }

        playSplash(heavy = false) {
          const ac = this.ensureContext();
          if (!ac || !this.noiseBuffer) return;
          const now = ac.currentTime;

          // Filtered noise burst for water spray
          const src = ac.createBufferSource();
          src.buffer = this.noiseBuffer;
          const filter = ac.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(heavy ? 680 : 1050, now);
          filter.frequency.exponentialRampToValueAtTime(240, now + (heavy ? 0.65 : 0.45));
          filter.Q.setValueAtTime(0.9, now);

          const gain = ac.createGain();
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.linearRampToValueAtTime(heavy ? 0.28 : 0.19, now + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (heavy ? 0.72 : 0.5));

          src.connect(filter);
          filter.connect(gain);
          gain.connect(ac.destination);
          src.start(now);
          src.stop(now + 0.75);

          // Sub-water plunk
          const thump = ac.createOscillator();
          const tGain = ac.createGain();
          thump.type = 'sine';
          thump.frequency.setValueAtTime(heavy ? 140 : 210, now);
          thump.frequency.exponentialRampToValueAtTime(55, now + 0.24);
          tGain.gain.setValueAtTime(heavy ? 0.22 : 0.12, now);
          tGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.26);
          thump.connect(tGain);
          tGain.connect(ac.destination);
          thump.start(now);
          thump.stop(now + 0.27);
        }

        playGoodFanfare() {
          const ac = this.ensureContext();
          if (!ac) return;
          const now = ac.currentTime;
          // Joyful marimba / harp arpeggio
          const chord = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98];
          chord.forEach((freq, i) => {
            const t = now + i * 0.075;
            const osc = ac.createOscillator();
            const osc2 = ac.createOscillator();
            const gain = ac.createGain();
            osc.type = 'triangle';
            osc2.type = 'sine';
            osc.frequency.setValueAtTime(freq, t);
            osc2.frequency.setValueAtTime(freq * 2, t);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.linearRampToValueAtTime(0.11, t + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
            osc.connect(gain);
            osc2.connect(gain);
            gain.connect(ac.destination);
            osc.start(t);
            osc2.start(t);
            osc.stop(t + 0.68);
            osc2.stop(t + 0.68);
          });
        }

        playFunnyCatch() {
          const ac = this.ensureContext();
          if (!ac) return;
          const now = ac.currentTime;
          // Comical playful brass/trombone slide + boing
          const steps = [
            { f1: 392, f2: 365, t: 0, d: 0.18 },
            { f1: 349, f2: 325, t: 0.19, d: 0.18 },
            { f1: 311, f2: 245, t: 0.38, d: 0.42 }
          ];
          steps.forEach((s) => {
            const osc = ac.createOscillator();
            const filter = ac.createBiquadFilter();
            const gain = ac.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(s.f1, now + s.t);
            osc.frequency.exponentialRampToValueAtTime(s.f2, now + s.t + s.d);
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(950, now + s.t);
            gain.gain.setValueAtTime(0.001, now + s.t);
            gain.gain.linearRampToValueAtTime(0.09, now + s.t + 0.025);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + s.t + s.d);
            osc.connect(filter);
            filter.connect(gain);
            gain.connect(ac.destination);
            osc.start(now + s.t);
            osc.stop(now + s.t + s.d + 0.02);
          });

          // Goofy spring boing at the end
          const boing = ac.createOscillator();
          const bGain = ac.createGain();
          boing.type = 'sine';
          boing.frequency.setValueAtTime(175, now + 0.56);
          boing.frequency.exponentialRampToValueAtTime(430, now + 0.72);
          boing.frequency.exponentialRampToValueAtTime(240, now + 0.88);
          bGain.gain.setValueAtTime(0.001, now + 0.56);
          bGain.gain.linearRampToValueAtTime(0.11, now + 0.59);
          bGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.92);
          boing.connect(bGain);
          bGain.connect(ac.destination);
          boing.start(now + 0.56);
          boing.stop(now + 0.94);
        }
      }

      const sound = new SoundEngine();

      // =========================================================================
      // 3. OBJECT CATALOG (12 REALISTIC CUSTOM-DRAWN UNDERWATER OBJECTS)
      // =========================================================================
      const OBJECT_POOL = [
        { id: 'carp',     good: true,  weight: 0.75 },
        { id: 'goldfish', good: true,  weight: 0.55 },
        { id: 'pike',     good: true,  weight: 0.80 },
        { id: 'chest',    good: true,  weight: 1.00 },
        { id: 'bottle',   good: true,  weight: 0.45 },
        { id: 'pearl',    good: true,  weight: 0.65 },
        { id: 'boot',     good: false, weight: 0.85 },
        { id: 'anchor',   good: false, weight: 1.05 },
        { id: 'can',      good: false, weight: 0.45 },
        { id: 'crab',     good: false, weight: 0.60 },
        { id: 'teapot',   good: false, weight: 0.80 },
        { id: 'tire',     good: false, weight: 0.95 }
      ];

      // =========================================================================
      // 4. GAME STATE & AMBIENT ENTITIES
      // =========================================================================
      const game = {
        initialized: false,
        time: 0,
        level: 1,            // 1 = classic (4 lines, 4-6 layers), 2 = tangled (5 lines, 8-10 layers)
        numLines: 4,
        state: 'playing', // 'playing' | 'tracing' | 'reeling' | 'arc' | 'celebrate' | 'transition'
        stateTimer: 0,
        transitionAlpha: 0,

        // Labyrinth data
        slotsX: [0.17, 0.39, 0.61, 0.83],
        topSlotsX: [0.21, 0.40, 0.60, 0.79],
        trueLineIdx: 0,      // which line by top slot is Grandpa's
        winningObjIdx: 0,    // which bottom object connects to Grandpa's line
        lines: [],           // line objects with Bezier segments & sampled points
        layerDrawOrder: [],  // z-ordering per layer for crystal-clear over/under crossings
        objects: [],         // bottom objects for this round
        bobberX: 0,
        bobberY: 0,
        rodTipX: 0,
        rodTipY: 0,
        rodBend: 0,
        reelAngle: 0,
        reelClickAccum: 0,
        boatRockVel: 0,
        boatRockAngle: 0,
        blinkTimer: 2.5,
        isBlinking: false,
        grandpaMood: 'calm', // 'calm' | 'pulling' | 'happy' | 'funny'
        hatBounce: 0,

        // Catch animation state
        caughtObj: null,
        caughtX: 0,
        caughtY: 0,
        caughtRot: 0,
        caughtScale: 1,
        arcStartX: 0,
        arcStartY: 0,
        arcEndX: 0,
        arcEndY: 0,

        // Pointer & tracing interaction
        pointerDown: false,
        pointerX: -999,
        pointerY: -999,
        hoverObjIdx: -1,
        lastTraceX: 0,
        lastTraceY: 0,
        traceTrail: [],

        // Visual FX pools
        clouds: [],
        birds: [],
        dragonfly: null,
        bgFish: [],
        bubbles: [],
        particles: [],
        splashes: [],
        surfaceRipples: [],
        sparkles: [],
        pebbles: [],
        kelpLeft: [],
        kelpRight: [],
        reedsLeft: [],
        reedsRight: []
      };

      // =========================================================================
      // 5. AMBIENT ENVIRONMENT INITIALIZATION
      // =========================================================================
      function initAmbientWorld() {
        // Clouds
        game.clouds = [];
        for (let i = 0; i < 6; i++) {
          game.clouds.push({
            x: Math.random(),
            y: 0.04 + Math.random() * 0.13,
            scale: 0.65 + Math.random() * 0.75,
            speed: 0.003 + Math.random() * 0.005,
            seed: Math.random() * 100
          });
        }

        // Distant birds
        game.birds = [];
        for (let i = 0; i < 4; i++) {
          game.birds.push({
            x: Math.random(),
            y: 0.05 + Math.random() * 0.11,
            speed: 0.012 + Math.random() * 0.012,
            phase: Math.random() * Math.PI * 2,
            size: 4 + Math.random() * 4
          });
        }

        // Shimmering dragonfly
        game.dragonfly = {
          x: 0.12,
          y: 0.22,
          vx: 0.04,
          vy: 0,
          targetX: 0.18,
          targetY: 0.23,
          pauseTimer: 1.2,
          wingPhase: 0
        };

        // Background underwater fish silhouettes
        game.bgFish = [];
        for (let i = 0; i < 9; i++) {
          const dir = Math.random() < 0.5 ? 1 : -1;
          game.bgFish.push({
            x: Math.random(),
            y: 0.36 + Math.random() * 0.45,
            dir,
            speed: (0.008 + Math.random() * 0.014) * dir,
            size: 9 + Math.random() * 14,
            phase: Math.random() * Math.PI * 2,
            alpha: 0.1 + Math.random() * 0.12
          });
        }

        // Rising ambient bubbles
        game.bubbles = [];
        for (let i = 0; i < 34; i++) {
          game.bubbles.push({
            x: Math.random() * W,
            y: waterlineY + 20 + Math.random() * (H - waterlineY - 30),
            r: 1.6 + Math.random() * 4.2,
            vy: 14 + Math.random() * 26,
            wobble: Math.random() * Math.PI * 2,
            alpha: 0.22 + Math.random() * 0.38,
            isTrace: false,
            life: 1
          });
        }

        // Underwater suspended micro-particles
        game.particles = [];
        for (let i = 0; i < 48; i++) {
          game.particles.push({
            x: Math.random(),
            y: 0.3 + Math.random() * 0.65,
            r: 0.8 + Math.random() * 1.8,
            vx: (Math.random() - 0.5) * 0.005,
            vy: (Math.random() - 0.5) * 0.003,
            alpha: 0.12 + Math.random() * 0.25
          });
        }

        // Riverbed pebbles
        game.pebbles = [];
        for (let i = 0; i < 65; i++) {
          game.pebbles.push({
            x: Math.random(),
            yOff: Math.random(),
            rx: 5 + Math.random() * 14,
            ry: 3 + Math.random() * 6,
            rot: (Math.random() - 0.5) * 0.45,
            shade: Math.random()
          });
        }

        // Kelp clusters on left & right underwater edges
        game.kelpLeft = [];
        game.kelpRight = [];
        for (let i = 0; i < 7; i++) {
          game.kelpLeft.push({
            xNorm: 0.008 + i * 0.016 + Math.random() * 0.008,
            heightNorm: 0.16 + Math.random() * 0.24,
            width: 8 + Math.random() * 7,
            phase: Math.random() * Math.PI * 2,
            hueShift: (Math.random() - 0.5) * 18
          });
          game.kelpRight.push({
            xNorm: 0.992 - i * 0.016 - Math.random() * 0.008,
            heightNorm: 0.16 + Math.random() * 0.24,
            width: 8 + Math.random() * 7,
            phase: Math.random() * Math.PI * 2,
            hueShift: (Math.random() - 0.5) * 18
          });
        }

        // Lakeside reeds & cattails framing top left and right
        game.reedsLeft = [];
        game.reedsRight = [];
        for (let i = 0; i < 11; i++) {
          game.reedsLeft.push({
            xNorm: 0.005 + i * 0.013 + Math.random() * 0.006,
            hNorm: 0.08 + Math.random() * 0.12,
            hasCattail: i % 3 === 1,
            lean: 0.12 + Math.random() * 0.22,
            phase: Math.random() * Math.PI * 2
          });
          game.reedsRight.push({
            xNorm: 0.995 - i * 0.013 - Math.random() * 0.006,
            hNorm: 0.08 + Math.random() * 0.12,
            hasCattail: i % 3 === 1,
            lean: -(0.12 + Math.random() * 0.22),
            phase: Math.random() * Math.PI * 2
          });
        }
      }

      // =========================================================================
      // 6. INFINITE TANGLED-LINE LABYRINTH GENERATOR
      // =========================================================================
      function shuffleArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function generateNewLabyrinth() {
        game.state = 'playing';
        game.stateTimer = 0;
        game.grandpaMood = 'calm';
        game.rodBend = 0;
        game.hatBounce = 0;
        game.caughtObj = null;
        game.hoverObjIdx = -1;
        game.sparkles = [];
        game.splashes = [];
        game.surfaceRipples = [];
        game.traceTrail = [];

        const isLvl2 = game.level === 2;
        const nLines = isLvl2 ? 5 : 4;
        game.numLines = nLines;

        if (isLvl2) {
          game.slotsX = [0.13, 0.315, 0.50, 0.685, 0.87];
          game.topSlotsX = [0.16, 0.33, 0.50, 0.67, 0.84];
        } else {
          game.slotsX = [0.17, 0.39, 0.61, 0.83];
          game.topSlotsX = [0.21, 0.40, 0.60, 0.79];
        }

        // 1. Choose unique objects from the 12-object pool (balanced mix of good & funny)
        const goodPool = shuffleArray(OBJECT_POOL.filter(o => o.good));
        const funnyPool = shuffleArray(OBJECT_POOL.filter(o => !o.good));
        const chosenList = isLvl2
          ? [goodPool[0], goodPool[1], funnyPool[0], funnyPool[1], Math.random() < 0.5 ? goodPool[2] : funnyPool[2]]
          : [goodPool[0], goodPool[1], funnyPool[0], Math.random() < 0.5 ? goodPool[2] : funnyPool[1]];
        const chosenSpecs = shuffleArray(chosenList);

        game.objects = chosenSpecs.map((spec, idx) => ({
          ...spec,
          slotIdx: idx,
          x: 0,
          y: 0,
          baseY: 0,
          scale: 1,
          hoverAmount: 0,
          jiggleTimer: 0,
          wrongDim: 0,
          phase: Math.random() * Math.PI * 2,
          caught: false
        }));

        // 2. Choose which top slot is Grandpa's bobber
        game.trueLineIdx = Math.floor(Math.random() * nLines);

        // Position Grandpa's boat organically near center while naturally reaching the bobber
        const bobberNorm = game.topSlotsX[game.trueLineIdx];
        if (bobberNorm < 0.45) {
          game.boatXNorm = Math.min(0.62, bobberNorm + 0.14);
          game.boatFacing = -1;
        } else if (bobberNorm > 0.55) {
          game.boatXNorm = Math.max(0.38, bobberNorm - 0.14);
          game.boatFacing = 1;
        } else {
          game.boatFacing = Math.random() < 0.5 ? 1 : -1;
          game.boatXNorm = bobberNorm - game.boatFacing * 0.14;
        }

        // 3. Build tangled depth layers:
        //    Level 1: 4-6 layers | Level 2: 8-10 layers (more tangled yet 100% readable)
        const numLayers = isLvl2
          ? (8 + Math.floor(Math.random() * 3))   // 8, 9, or 10 layers
          : (4 + Math.floor(Math.random() * 3));  // 4, 5, or 6 layers

        const lineCols = Array.from({ length: nLines }, (_, i) => [i]);
        const layerSwaps = [];

        let colToLine = Array.from({ length: nLines }, (_, i) => i);
        let prevPattern = -1;

        for (let layer = 0; layer < numLayers; layer++) {
          const nextColToLine = colToLine.slice();

          if (!isLvl2) {
            // Level 1 patterns (4 lines)
            const candidates = [0, 1, 2, 3, 4, 5].filter(p => p !== prevPattern);
            const pattern = candidates[Math.floor(Math.random() * candidates.length)];
            prevPattern = pattern;

            if (pattern === 0) {
              [nextColToLine[0], nextColToLine[1]] = [colToLine[1], colToLine[0]];
            } else if (pattern === 1) {
              [nextColToLine[1], nextColToLine[2]] = [colToLine[2], colToLine[1]];
            } else if (pattern === 2) {
              [nextColToLine[2], nextColToLine[3]] = [colToLine[3], colToLine[2]];
            } else if (pattern === 3) {
              [nextColToLine[0], nextColToLine[1]] = [colToLine[1], colToLine[0]];
              [nextColToLine[2], nextColToLine[3]] = [colToLine[3], colToLine[2]];
            } else if (pattern === 4) {
              nextColToLine[0] = colToLine[1];
              nextColToLine[1] = colToLine[2];
              nextColToLine[2] = colToLine[0];
            } else {
              nextColToLine[1] = colToLine[3];
              nextColToLine[2] = colToLine[1];
              nextColToLine[3] = colToLine[2];
            }
          } else {
            // Level 2 patterns (5 lines): rich non-overlapping double swaps & gentle 3-line weaves
            const candidates = [0, 1, 2, 3, 4, 5, 6].filter(p => p !== prevPattern);
            const pattern = candidates[Math.floor(Math.random() * candidates.length)];
            prevPattern = pattern;

            if (pattern === 0) {
              // swap(0,1) & swap(2,3)
              [nextColToLine[0], nextColToLine[1]] = [colToLine[1], colToLine[0]];
              [nextColToLine[2], nextColToLine[3]] = [colToLine[3], colToLine[2]];
            } else if (pattern === 1) {
              // swap(1,2) & swap(3,4)
              [nextColToLine[1], nextColToLine[2]] = [colToLine[2], colToLine[1]];
              [nextColToLine[3], nextColToLine[4]] = [colToLine[4], colToLine[3]];
            } else if (pattern === 2) {
              // swap(0,1) & swap(3,4)
              [nextColToLine[0], nextColToLine[1]] = [colToLine[1], colToLine[0]];
              [nextColToLine[3], nextColToLine[4]] = [colToLine[4], colToLine[3]];
            } else if (pattern === 3) {
              // swap(1,2) only for breathing room
              [nextColToLine[1], nextColToLine[2]] = [colToLine[2], colToLine[1]];
            } else if (pattern === 4) {
              // swap(2,3) only for breathing room
              [nextColToLine[2], nextColToLine[3]] = [colToLine[3], colToLine[2]];
            } else if (pattern === 5) {
              // smooth 3-line weave on left (0,1,2) + swap(3,4)
              nextColToLine[0] = colToLine[1];
              nextColToLine[1] = colToLine[2];
              nextColToLine[2] = colToLine[0];
              [nextColToLine[3], nextColToLine[4]] = [colToLine[4], colToLine[3]];
            } else {
              // swap(0,1) + smooth 3-line weave on right (2,3,4)
              [nextColToLine[0], nextColToLine[1]] = [colToLine[1], colToLine[0]];
              nextColToLine[2] = colToLine[4];
              nextColToLine[3] = colToLine[2];
              nextColToLine[4] = colToLine[3];
            }
          }

          colToLine = nextColToLine;
          for (let col = 0; col < nLines; col++) {
            const lineId = colToLine[col];
            lineCols[lineId].push(col);
          }

          layerSwaps.push(shuffleArray(Array.from({ length: nLines }, (_, i) => i)));
        }

        game.layerDrawOrder = layerSwaps;

        // 4. Construct normalized line definitions with organic curve offsets
        const anchorTypes = shuffleArray(['driftwood', 'lilypad', 'driftwood', 'lilypad', 'reedtuft']);
        game.lines = [];
        for (let lineId = 0; lineId < nLines; lineId++) {
          const cols = lineCols[lineId];
          const bottomSlot = cols[cols.length - 1];
          const isTrue = (lineId === game.trueLineIdx);
          if (isTrue) {
            game.winningObjIdx = bottomSlot;
          }

          const jitterAmp = isLvl2 ? 0.026 : 0.036;
          const jitters = cols.map((_, i) => {
            if (i === 0 || i === cols.length - 1) return 0;
            return (Math.random() - 0.5) * jitterAmp;
          });

          // Extra subtle wave curvature per segment on Level 2 for natural tangled feel
          const waveBends = Array.from({ length: numLayers }, () =>
            isLvl2 ? (Math.random() - 0.5) * 0.032 : 0
          );

          game.lines.push({
            id: lineId,
            isTrue,
            topSlot: lineId,
            bottomSlot,
            cols,
            jitters,
            waveBends,
            numLayers,
            segments: [],
            sampledPoints: [],
            twangTimer: 0,
            fadeAlpha: 1,
            snagSeed: Math.random() * 10,
            anchorType: anchorTypes[lineId % anchorTypes.length]
          });
        }

        rebuildSceneGeometry();
      }

      // Compute pixel coordinates for lines, objects, bobber, and sampled curve paths
      function rebuildSceneGeometry() {
        const nLines = game.numLines;
        const objY = H * 0.875;
        const baseScale = Math.min(W / 1280, H / 720) * (nLines === 5 ? 0.94 : 1.05);
        const objScale = Math.max(0.62, Math.min(1.12, baseScale));

        for (let i = 0; i < nLines; i++) {
          const o = game.objects[i];
          if (!o) continue;
          o.x = W * game.slotsX[i];
          o.baseY = objY;
          if (!o.caught) {
            o.y = objY;
          }
          o.scale = objScale;
        }

        const yTop = waterlineY + 14;
        const yBot = objY - 34 * objScale;
        const totalDepth = yBot - yTop;

        // Horizontal lanes for intermediate waypoints
        const midLanes = nLines === 5
          ? [0.145, 0.322, 0.50, 0.678, 0.855]
          : [0.19, 0.395, 0.605, 0.81];

        for (const line of game.lines) {
          const n = line.numLayers;
          const pts = [];
          for (let k = 0; k <= n; k++) {
            const t = k / n;
            let xNorm;
            if (k === 0) {
              xNorm = game.topSlotsX[line.topSlot];
            } else if (k === n) {
              xNorm = game.slotsX[line.bottomSlot];
            } else {
              xNorm = midLanes[line.cols[k]] + line.jitters[k];
            }
            const y = yTop + totalDepth * t;
            pts.push({ x: xNorm * W, y });
          }

          // Build smooth vertical-tangent cubic Bezier segments per layer
          line.segments = [];
          line.sampledPoints = [];
          for (let k = 0; k < n; k++) {
            const p0 = pts[k];
            const p1 = pts[k + 1];
            const dy = p1.y - p0.y;
            const bendPx = (line.waveBends ? line.waveBends[k] : 0) * W;
            const seg = {
              x0: p0.x,
              y0: p0.y,
              cx0: p0.x + bendPx,
              cy0: p0.y + dy * 0.52,
              cx1: p1.x - bendPx,
              cy1: p1.y - dy * 0.52,
              x1: p1.x,
              y1: p1.y
            };
            line.segments.push(seg);

            // Sample dense points along this Bezier for the glowing trace & reeling
            const steps = 16;
            for (let s = 0; s < steps; s++) {
              const u = s / steps;
              line.sampledPoints.push(evalCubic(seg, u));
            }
          }
          line.sampledPoints.push(pts[pts.length - 1]);
        }

        game.bobberX = W * game.topSlotsX[game.trueLineIdx];
        game.bobberY = waterlineY + 2;
      }

      function evalCubic(seg, t) {
        const mt = 1 - t;
        const mt2 = mt * mt;
        const t2 = t * t;
        return {
          x: mt2 * mt * seg.x0 + 3 * mt2 * t * seg.cx0 + 3 * mt * t2 * seg.cx1 + t2 * t * seg.x1,
          y: mt2 * mt * seg.y0 + 3 * mt2 * t * seg.cy0 + 3 * mt * t2 * seg.cy1 + t2 * t * seg.y1
        };
      }

      // =========================================================================
      // 7. INPUT HANDLING (MOUSE + TOUCH BUBBLE-TRACING & OBJECT CLICKING)
      // =========================================================================
      function getCanvasPos(e) {
        const rect = canvas.getBoundingClientRect();
        if (e.touches && e.touches.length > 0) {
          return {
            x: e.touches[0].clientX - rect.left,
            y: e.touches[0].clientY - rect.top
          };
        }
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }

      function hitTestObject(px, py) {
        const hitR = game.numLines === 5
          ? Math.max(46, Math.min(68, W * 0.056))
          : Math.max(54, Math.min(78, W * 0.068));
        for (let i = 0; i < game.objects.length; i++) {
          const o = game.objects[i];
          const dx = px - o.x;
          const dy = py - o.y;
          if (dx * dx + dy * dy <= hitR * hitR) {
            return i;
          }
        }
        return -1;
      }

      function spawnTraceBubbles(x, y) {
        if (y < waterlineY + 8) return;
        game.traceTrail.push({ x, y, life: 1.0 });
        if (game.traceTrail.length > 26) game.traceTrail.shift();

        const dx = x - game.lastTraceX;
        const dy = y - game.lastTraceY;
        if (dx * dx + dy * dy < 144) return;
        game.lastTraceX = x;
        game.lastTraceY = y;

        for (let i = 0; i < 2; i++) {
          game.bubbles.push({
            x: x + (Math.random() - 0.5) * 10,
            y: y + (Math.random() - 0.5) * 10,
            r: 2.2 + Math.random() * 3.4,
            vy: 18 + Math.random() * 18,
            wobble: Math.random() * Math.PI * 2,
            alpha: 0.78,
            isTrace: true,
            life: 1.0
          });
        }
        if (Math.random() < 0.25) {
          sound.playBubblePop(520 + Math.random() * 240, 0.032);
        }
      }

      function spawnBurstBubbles(x, y, count = 14) {
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 20 + Math.random() * 65;
          game.bubbles.push({
            x: x + Math.cos(ang) * 12,
            y: y + Math.sin(ang) * 12,
            vx: Math.cos(ang) * spd,
            vy: 35 + Math.random() * 55 - Math.sin(ang) * 20,
            r: 2.2 + Math.random() * 5.2,
            wobble: Math.random() * Math.PI * 2,
            alpha: 0.85,
            isTrace: true,
            life: 1.35
          });
        }
      }

      function spawnWaterSplash(x, y, heavy = false) {
        const count = heavy ? 32 : 20;
        for (let i = 0; i < count; i++) {
          const ang = -Math.PI * 0.12 - Math.random() * Math.PI * 0.76;
          const spd = (heavy ? 180 : 130) + Math.random() * (heavy ? 210 : 150);
          game.splashes.push({
            x: x + (Math.random() - 0.5) * 24,
            y: y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd,
            r: 2.5 + Math.random() * (heavy ? 5.5 : 4.2),
            life: 1.0
          });
        }
        for (let i = 0; i < 3; i++) {
          game.surfaceRipples.push({
            x,
            y: waterlineY + 2,
            rx: 12 + i * 16,
            maxRx: (heavy ? 145 : 95) + i * 32,
            alpha: 0.85 - i * 0.18
          });
        }
      }

      function spawnCelebrationSparkles(x, y, isGood) {
        const count = isGood ? 26 : 16;
        for (let i = 0; i < count; i++) {
          const ang = Math.random() * Math.PI * 2;
          const spd = 40 + Math.random() * 130;
          game.sparkles.push({
            x,
            y,
            vx: Math.cos(ang) * spd,
            vy: Math.sin(ang) * spd - 45,
            size: isGood ? (4 + Math.random() * 7) : (3 + Math.random() * 5),
            isGood,
            life: 1.0 + Math.random() * 0.6,
            rot: Math.random() * Math.PI
          });
        }
      }

      function handleObjectClick(idx) {
        if (game.state !== 'playing') return;
        const obj = game.objects[idx];
        if (!obj) return;

        if (idx === game.winningObjIdx) {
          // CORRECT CATCH! Start multi-stage celebratory sequence
          game.state = 'tracing';
          game.stateTimer = 0;
          game.caughtObj = obj;
          sound.playTraceChime();
          spawnBurstBubbles(obj.x, obj.y, 16);
        } else {
          // WRONG CLICK: jiggle object, twang its disconnected line, keep playing
          obj.jiggleTimer = 0.65;
          obj.wrongDim = Math.min(1, obj.wrongDim + 0.45);
          const wrongLine = game.lines.find(l => l.bottomSlot === idx);
          if (wrongLine) {
            wrongLine.twangTimer = 0.75;
          }
          sound.playWrongWobble();
          spawnBurstBubbles(obj.x, obj.y, 11);
        }
      }

      canvas.addEventListener('pointerdown', (e) => {
        sound.ensureContext();
        const pos = getCanvasPos(e);
        game.pointerDown = true;
        game.pointerX = pos.x;
        game.pointerY = pos.y;
        game.lastTraceX = pos.x;
        game.lastTraceY = pos.y;

        const hit = hitTestObject(pos.x, pos.y);
        if (hit !== -1) {
          handleObjectClick(hit);
        } else if (pos.y > waterlineY + 10) {
          spawnTraceBubbles(pos.x, pos.y);
        }
      });

      canvas.addEventListener('pointermove', (e) => {
        const pos = getCanvasPos(e);
        game.pointerX = pos.x;
        game.pointerY = pos.y;
        game.hoverObjIdx = (game.state === 'playing') ? hitTestObject(pos.x, pos.y) : -1;
        canvas.style.cursor = game.hoverObjIdx !== -1 ? 'pointer' : 'default';

        if (game.pointerDown && game.state === 'playing') {
          spawnTraceBubbles(pos.x, pos.y);
        }
      });

      window.addEventListener('pointerup', () => {
        game.pointerDown = false;
      });

      nextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        sound.ensureContext();
        sound.playNextPlop();
        generateNewLabyrinth();
      });

      function setDifficultyLevel(lvl) {
        if (game.level === lvl && game.state === 'playing') return;
        game.level = lvl;
        lvlBtn1.classList.toggle('active', lvl === 1);
        lvlBtn2.classList.toggle('active', lvl === 2);
        sound.ensureContext();
        sound.playLevelSwitch(lvl);
        generateNewLabyrinth();
      }

      lvlBtn1.addEventListener('click', (e) => {
        e.stopPropagation();
        setDifficultyLevel(1);
      });

      lvlBtn2.addEventListener('click', (e) => {
        e.stopPropagation();
        setDifficultyLevel(2);
      });

      // =========================================================================
      // 8. UPDATE LOOP (ANIMATION PHYSICS & STATE MACHINE)
      // =========================================================================
      function update(dt) {
        game.time += dt;

        // Blinking Grandpa
        game.blinkTimer -= dt;
        if (game.blinkTimer <= 0) {
          if (!game.isBlinking) {
            game.isBlinking = true;
            game.blinkTimer = 0.14;
          } else {
            game.isBlinking = false;
            game.blinkTimer = 2.4 + Math.random() * 3.2;
          }
        }

        // Boat rocking physics
        const springK = 18;
        const damping = 4.2;
        game.boatRockVel += (-springK * game.boatRockAngle - damping * game.boatRockVel) * dt;
        game.boatRockAngle += game.boatRockVel * dt;

        // Clouds
        for (const c of game.clouds) {
          c.x += c.speed * dt;
          if (c.x > 1.2) c.x = -0.2;
        }

        // Birds
        for (const b of game.birds) {
          b.x += b.speed * dt;
          if (b.x > 1.15) {
            b.x = -0.15;
            b.y = 0.04 + Math.random() * 0.11;
          }
        }

        // Dragonfly
        const df = game.dragonfly;
        df.wingPhase += dt * 52;
        df.pauseTimer -= dt;
        if (df.pauseTimer <= 0) {
          const dx = df.targetX - df.x;
          const dy = df.targetY - df.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 0.015) {
            df.pauseTimer = 0.8 + Math.random() * 1.8;
            df.targetX = Math.random() < 0.5 ? (0.08 + Math.random() * 0.22) : (0.70 + Math.random() * 0.22);
            df.targetY = 0.16 + Math.random() * 0.10;
          } else {
            df.x += (dx / dist) * 0.18 * dt;
            df.y += (dy / dist) * 0.18 * dt;
          }
        } else {
          df.y += Math.sin(game.time * 6) * 0.00025;
        }

        // Background fish
        for (const f of game.bgFish) {
          f.x += f.speed * dt;
          if (f.dir > 0 && f.x > 1.12) f.x = -0.12;
          if (f.dir < 0 && f.x < -0.12) f.x = 1.12;
        }

        // Underwater particles
        for (const p of game.particles) {
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.x < 0) p.x = 1;
          if (p.x > 1) p.x = 0;
          if (p.y < 0.3) p.y = 0.92;
          if (p.y > 0.94) p.y = 0.31;
        }

        // Bubbles
        for (let i = game.bubbles.length - 1; i >= 0; i--) {
          const b = game.bubbles[i];
          b.y -= b.vy * dt;
          if (b.vx) {
            b.x += b.vx * dt;
            b.vx *= Math.pow(0.18, dt);
          }
          b.x += Math.sin(game.time * 3.2 + b.wobble) * 10 * dt;

          if (b.isTrace) {
            b.life -= dt * 0.95;
            if (b.life <= 0 || b.y < waterlineY + 4) {
              game.bubbles.splice(i, 1);
            }
          } else if (b.y < waterlineY + 4) {
            b.y = H - 20 - Math.random() * 30;
            b.x = Math.random() * W;
          }
        }

        // Splash droplets
        for (let i = game.splashes.length - 1; i >= 0; i--) {
          const s = game.splashes[i];
          s.x += s.vx * dt;
          s.y += s.vy * dt;
          s.vy += 580 * dt;
          s.life -= dt * 1.15;
          if (s.life <= 0 || (s.vy > 0 && s.y > waterlineY + 14)) {
            game.splashes.splice(i, 1);
          }
        }

        // Surface ripples
        for (let i = game.surfaceRipples.length - 1; i >= 0; i--) {
          const r = game.surfaceRipples[i];
          r.rx += (r.maxRx - r.rx) * 3.2 * dt + 22 * dt;
          r.alpha -= dt * 0.72;
          if (r.alpha <= 0) game.surfaceRipples.splice(i, 1);
        }

        // Celebration sparkles / water drops
        for (let i = game.sparkles.length - 1; i >= 0; i--) {
          const sp = game.sparkles[i];
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.vy += (sp.isGood ? 85 : 260) * dt;
          sp.rot += dt * 3.5;
          sp.life -= dt * 0.9;
          if (sp.life <= 0) game.sparkles.splice(i, 1);
        }

        // Decay finger/mouse glowing trace trail
        for (let i = game.traceTrail.length - 1; i >= 0; i--) {
          game.traceTrail[i].life -= dt * 2.2;
          if (game.traceTrail[i].life <= 0) game.traceTrail.splice(i, 1);
        }

        // Objects hover & jiggle
        for (let i = 0; i < game.objects.length; i++) {
          const o = game.objects[i];
          const targetHover = (i === game.hoverObjIdx && game.state === 'playing') ? 1 : 0;
          o.hoverAmount += (targetHover - o.hoverAmount) * Math.min(1, dt * 10);
          if (o.jiggleTimer > 0) o.jiggleTimer = Math.max(0, o.jiggleTimer - dt);
        }

        // Line twangs
        for (const l of game.lines) {
          if (l.twangTimer > 0) l.twangTimer = Math.max(0, l.twangTimer - dt);
        }

        // STATE MACHINE FOR CATCH SEQUENCE
        if (game.state === 'tracing') {
          game.stateTimer += dt;
          // Gently fade non-winning lines
          for (const l of game.lines) {
            if (!l.isTrue) l.fadeAlpha = Math.max(0.18, l.fadeAlpha - dt * 1.1);
          }
          if (game.stateTimer >= 0.85) {
            game.state = 'reeling';
            game.stateTimer = 0;
            game.grandpaMood = 'pulling';
            game.caughtObj.caught = true;
            game.caughtX = game.caughtObj.x;
            game.caughtY = game.caughtObj.y;
            game.caughtRot = 0;
            game.caughtScale = game.caughtObj.scale;
            game.boatRockVel = -game.boatFacing * 0.9;
            spawnWaterSplash(game.bobberX, waterlineY, false);
            sound.playSplash(false);
          }
        } else if (game.state === 'reeling') {
          game.stateTimer += dt;
          const dur = 1.25;
          const p = Math.min(1, game.stateTimer / dur);
          const ease = p * p * (3 - 2 * p);

          for (const l of game.lines) {
            if (!l.isTrue) l.fadeAlpha = Math.max(0, l.fadeAlpha - dt * 1.8);
          }

          game.rodBend = Math.min(1, game.rodBend + dt * 3.8) * (0.7 + 0.3 * game.caughtObj.weight);
          game.reelAngle += dt * 24;
          game.reelClickAccum += dt;
          if (game.reelClickAccum >= 0.085) {
            game.reelClickAccum = 0;
            sound.playReelClick();
          }

          // Pull object up toward the bobber on the surface
          const startX = game.caughtObj.x;
          const startY = game.caughtObj.baseY;
          const targetX = game.bobberX;
          const targetY = waterlineY + 12;
          game.caughtX = startX + (targetX - startX) * ease + Math.sin(game.time * 18) * (1 - p) * 6;
          game.caughtY = startY + (targetY - startY) * ease;
          game.caughtRot = Math.sin(game.time * 14) * 0.22;

          if (Math.random() < 0.45) {
            game.bubbles.push({
              x: game.caughtX + (Math.random() - 0.5) * 26,
              y: game.caughtY + 10,
              r: 2.5 + Math.random() * 4.5,
              vy: 30 + Math.random() * 40,
              wobble: Math.random() * Math.PI * 2,
              alpha: 0.78,
              isTrace: true,
              life: 1.0
            });
          }

          if (p >= 1) {
            game.state = 'arc';
            game.stateTimer = 0;
            game.arcStartX = game.caughtX;
            game.arcStartY = waterlineY + 6;
            game.arcEndX = game.boatXNorm * W + game.boatFacing * 56;
            game.arcEndY = waterlineY - 46;
            const heavy = !game.caughtObj.good || game.caughtObj.weight > 0.85;
            spawnWaterSplash(game.bobberX, waterlineY, heavy);
            sound.playSplash(heavy);
            game.boatRockVel = game.boatFacing * 1.15;
          }
        } else if (game.state === 'arc') {
          game.stateTimer += dt;
          const dur = 0.68;
          const p = Math.min(1, game.stateTimer / dur);
          game.rodBend = Math.max(0.15, game.rodBend - dt * 1.5);

          // Parabolic burst out of water into Grandpa's boat
          game.caughtX = game.arcStartX + (game.arcEndX - game.arcStartX) * p;
          const arcPeak = Math.min(waterlineY - 120, H * 0.08);
          const linearY = game.arcStartY + (game.arcEndY - game.arcStartY) * p;
          game.caughtY = linearY - Math.sin(p * Math.PI) * (linearY - arcPeak) * 0.85;
          game.caughtRot = Math.sin(p * Math.PI * 2) * 0.45;
          game.caughtScale = game.caughtObj.scale * (1 + Math.sin(p * Math.PI) * 0.16);

          if (p >= 1) {
            game.state = 'celebrate';
            game.stateTimer = 0;
            game.rodBend = 0;
            game.caughtRot = 0;
            game.grandpaMood = game.caughtObj.good ? 'happy' : 'funny';
            game.hatBounce = 1.0;
            game.boatRockVel = -game.boatFacing * 0.85;
            spawnCelebrationSparkles(game.caughtX, game.caughtY, game.caughtObj.good);
            if (game.caughtObj.good) {
              sound.playGoodFanfare();
            } else {
              sound.playFunnyCatch();
            }
          }
        } else if (game.state === 'celebrate') {
          game.stateTimer += dt;
          game.hatBounce = Math.max(0, game.hatBounce - dt * 1.6);
          // Gentle joyful bob (or comical wiggle for funny catches) in the boat
          game.caughtY = game.arcEndY + Math.sin(game.time * 5) * 4;
          if (game.caughtObj && !game.caughtObj.good) {
            game.caughtRot = Math.sin(game.time * 9) * 0.14;
            // Comical water drops dripping from boot/tire/anchor/teapot
            if (Math.random() < 0.22) {
              game.splashes.push({
                x: game.caughtX + (Math.random() - 0.5) * 26,
                y: game.caughtY + 14,
                vx: (Math.random() - 0.5) * 24,
                vy: 30 + Math.random() * 45,
                r: 2.2 + Math.random() * 2.2,
                life: 0.7
              });
            }
          }
          if (game.stateTimer < 2.2 && Math.random() < 0.18) {
            spawnCelebrationSparkles(game.caughtX + (Math.random() - 0.5) * 40, game.caughtY, game.caughtObj.good);
          }
          if (game.stateTimer >= 3.4) {
            game.state = 'transition';
            game.stateTimer = 0;
          }
        } else if (game.state === 'transition') {
          game.stateTimer += dt;
          const half = 0.35;
          if (game.stateTimer < half) {
            game.transitionAlpha = game.stateTimer / half;
          } else {
            if (game.caughtObj) {
              generateNewLabyrinth();
              game.state = 'transition';
              game.stateTimer = half;
            }
            game.transitionAlpha = Math.max(0, 1 - (game.stateTimer - half) / half);
            if (game.stateTimer >= half * 2) {
              game.state = 'playing';
              game.transitionAlpha = 0;
            }
          }
        }
      }

      // =========================================================================
      // 9. RENDERING: ABOVE-WATER WORLD (SKY, TREES, REEDS, BIRDS, DRAGONFLY)
      // =========================================================================
      function drawSkyAndScenery() {
        // Golden afternoon sky gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, waterlineY);
        skyGrad.addColorStop(0, '#5a9ec8');
        skyGrad.addColorStop(0.45, '#8ec2d8');
        skyGrad.addColorStop(0.78, '#e6d3a7');
        skyGrad.addColorStop(1, '#f7c982');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, W, waterlineY + 4);

        // Warm afternoon sun + atmospheric glow
        const sunX = W * 0.78;
        const sunY = waterlineY * 0.36;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, waterlineY * 0.95);
        sunGlow.addColorStop(0, 'rgba(255, 250, 220, 0.95)');
        sunGlow.addColorStop(0.18, 'rgba(255, 232, 168, 0.55)');
        sunGlow.addColorStop(0.5, 'rgba(255, 206, 130, 0.16)');
        sunGlow.addColorStop(1, 'rgba(255, 206, 130, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(0, 0, W, waterlineY);

        // Soft multi-layered clouds
        for (const c of game.clouds) {
          drawCloud(c.x * W, c.y * H, c.scale * Math.min(W / 1200, 1.2));
        }

        // Distant misty treeline
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, waterlineY);
        const steps = 42;
        for (let i = 0; i <= steps; i++) {
          const x = (i / steps) * W;
          const ridge =
            Math.sin(i * 0.45) * 10 +
            Math.cos(i * 1.15) * 6 +
            Math.sin(i * 2.3) * 3;
          const distFactor = 1 - Math.exp(-Math.pow((i / steps - 0.5) * 2.3, 2)) * 0.38;
          ctx.lineTo(x, waterlineY - (14 + ridge) * distFactor);
        }
        ctx.lineTo(W, waterlineY);
        ctx.closePath();
        const mistGrad = ctx.createLinearGradient(0, waterlineY - 36, 0, waterlineY);
        mistGrad.addColorStop(0, 'rgba(92, 132, 130, 0.55)');
        mistGrad.addColorStop(1, 'rgba(130, 162, 148, 0.75)');
        ctx.fillStyle = mistGrad;
        ctx.fill();
        ctx.restore();

        // Closer lush lakeside trees on left & right shores
        drawShoreTrees(0, 1);
        drawShoreTrees(W, -1);

        // Distant gliding birds
        ctx.save();
        ctx.strokeStyle = 'rgba(54, 68, 76, 0.65)';
        ctx.lineWidth = 1.6;
        ctx.lineCap = 'round';
        for (const b of game.birds) {
          const bx = b.x * W;
          const by = b.y * H;
          const flap = Math.sin(game.time * 6.5 + b.phase) * b.size * 0.55;
          ctx.beginPath();
          ctx.moveTo(bx - b.size, by + flap);
          ctx.quadraticCurveTo(bx - b.size * 0.4, by - b.size * 0.4, bx, by);
          ctx.quadraticCurveTo(bx + b.size * 0.4, by - b.size * 0.4, bx + b.size, by + flap);
          ctx.stroke();
        }
        ctx.restore();

        // Gently swaying reeds & cattails on left and right edges
        drawReeds(game.reedsLeft);
        drawReeds(game.reedsRight);

        // Shimmering dragonfly
        drawDragonfly();
      }

      function drawCloud(x, y, s) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(s, s);
        const puffs = [
          { x: -38, y: 8, r: 22 },
          { x: -12, y: -4, r: 30 },
          { x: 22, y: 2, r: 26 },
          { x: 46, y: 10, r: 18 },
          { x: 4, y: 12, r: 22 }
        ];
        // Warm sunlit cloud highlight
        ctx.fillStyle = 'rgba(255, 251, 240, 0.72)';
        ctx.beginPath();
        for (const p of puffs) {
          ctx.moveTo(p.x + p.r, p.y);
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        }
        ctx.fill();

        // Soft peach-blue underside shading
        ctx.fillStyle = 'rgba(218, 206, 198, 0.35)';
        ctx.beginPath();
        ctx.ellipse(6, 18, 52, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      function drawShoreTrees(edgeX, dir) {
        ctx.save();
        const bankW = W * 0.17;
        // Earthy grassy shore bank
        ctx.beginPath();
        ctx.moveTo(edgeX, waterlineY + 2);
        ctx.quadraticCurveTo(edgeX + dir * bankW * 0.55, waterlineY - 22, edgeX + dir * bankW, waterlineY + 2);
        ctx.closePath();
        ctx.fillStyle = '#3f623d';
        ctx.fill();

        // Layered trees (pines & leafy crowns)
        const trees = [
          { off: 0.03, h: 66, r: 28, c: '#2d5234' },
          { off: 0.075, h: 52, r: 24, c: '#3a663b' },
          { off: 0.115, h: 36, r: 19, c: '#4c7843' }
        ];
        for (const tr of trees) {
          const tx = edgeX + dir * W * tr.off;
          const ty = waterlineY - 6;
          // Trunk
          ctx.strokeStyle = '#4e3928';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(tx, ty);
          ctx.lineTo(tx, ty - tr.h * 0.6);
          ctx.stroke();

          // Foliage clusters
          ctx.fillStyle = tr.c;
          ctx.beginPath();
          ctx.arc(tx, ty - tr.h * 0.72, tr.r, 0, Math.PI * 2);
          ctx.arc(tx - tr.r * 0.55, ty - tr.h * 0.52, tr.r * 0.72, 0, Math.PI * 2);
          ctx.arc(tx + tr.r * 0.55, ty - tr.h * 0.55, tr.r * 0.72, 0, Math.PI * 2);
          ctx.fill();

          // Golden sunlight rim
          ctx.fillStyle = 'rgba(232, 214, 130, 0.18)';
          ctx.beginPath();
          ctx.arc(tx + tr.r * 0.25, ty - tr.h * 0.8, tr.r * 0.6, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      }

      function drawReeds(list) {
        ctx.save();
        for (const r of list) {
          const bx = r.xNorm * W;
          const by = waterlineY + 5;
          const h = r.hNorm * H;
          const sway = Math.sin(game.time * 1.6 + r.phase) * 7;
          const tipX = bx + r.lean * h + sway;
          const tipY = by - h;

          ctx.strokeStyle = '#3b6436';
          ctx.lineWidth = 2.6;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(bx, by);
          ctx.quadraticCurveTo(bx + sway * 0.4, by - h * 0.55, tipX, tipY);
          ctx.stroke();

          if (r.hasCattail) {
            ctx.strokeStyle = '#5a3520';
            ctx.lineWidth = 6.5;
            ctx.beginPath();
            ctx.moveTo(tipX - (tipX - bx) * 0.14, tipY + h * 0.16);
            ctx.lineTo(tipX - (tipX - bx) * 0.04, tipY + h * 0.03);
            ctx.stroke();
          }
        }
        ctx.restore();
      }

      function drawDragonfly() {
        const df = game.dragonfly;
        const x = df.x * W;
        const y = df.y * H;
        ctx.save();
        ctx.translate(x, y);
        const wingFlap = Math.sin(df.wingPhase) * 0.4;

        // Translucent shimmering wings
        ctx.fillStyle = 'rgba(225, 250, 255, 0.55)';
        ctx.save();
        ctx.rotate(-0.35 + wingFlap);
        ctx.beginPath();
        ctx.ellipse(-7, -3, 9, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.rotate(0.35 - wingFlap);
        ctx.beginPath();
        ctx.ellipse(7, -3, 9, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // Iridescent teal body
        ctx.strokeStyle = '#1899a8';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -4);
        ctx.lineTo(0, 10);
        ctx.stroke();
        ctx.restore();
      }

      // =========================================================================
      // 10. RENDERING: GRANDPA & WOODEN ROWBOAT (MAXIMUM REALISM)
      // =========================================================================
      function drawGrandpaAndBoat() {
        const bx = game.boatXNorm * W;
        const bobY = Math.sin(game.time * 2.1) * 3.2;
        const pitch = Math.cos(game.time * 1.7) * 0.025 + game.boatRockAngle * 0.18;
        const scale = Math.max(0.72, Math.min(1.08, Math.min(W / 1280, H / 720) * 1.02));
        const by = waterlineY - 4 + bobY;

        ctx.save();
        ctx.translate(bx, by);
        ctx.rotate(pitch);
        ctx.scale(scale, scale);

        // Subtle water reflection/shadow under boat
        ctx.fillStyle = 'rgba(8, 34, 42, 0.35)';
        ctx.beginPath();
        ctx.ellipse(0, 12, 108, 12, 0, 0, Math.PI * 2);
        ctx.fill();

        // --- BACK INTERIOR OF WOODEN BOAT ---
        ctx.fillStyle = '#5e3b22';
        ctx.beginPath();
        ctx.moveTo(-98, -12);
        ctx.quadraticCurveTo(0, -20, 98, -12);
        ctx.lineTo(84, 6);
        ctx.lineTo(-84, 6);
        ctx.closePath();
        ctx.fill();

        // Bench seat
        ctx.fillStyle = '#7e5230';
        ctx.fillRect(-38, -14, 76, 8);

        // --- GRANDPA CHARACTER (facing game.boatFacing) ---
        ctx.save();
        ctx.scale(game.boatFacing, 1);

        const breathe = Math.sin(game.time * 2.4) * 1.3;
        const leanBack = game.grandpaMood === 'pulling' ? -0.18 : (game.grandpaMood === 'happy' ? -0.05 : 0.04);
        ctx.translate(-8, -12);
        ctx.rotate(leanBack);

        // Torso: Plaid flannel shirt + olive fishing vest
        // Back arm / sleeve (scratches head in confusion on funny catch, waves joyfully on good catch!)
        ctx.strokeStyle = '#9c362c';
        ctx.lineWidth = 13;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (game.grandpaMood === 'funny') {
          const scratch = Math.sin(game.time * 12) * 3;
          ctx.moveTo(2, -36 + breathe);
          ctx.quadraticCurveTo(-16, -54 + breathe, -8 + scratch, -72 + breathe);
        } else if (game.grandpaMood === 'happy') {
          const waveArm = Math.sin(game.time * 10) * 8;
          ctx.moveTo(4, -36 + breathe);
          ctx.quadraticCurveTo(-18, -56 + breathe, -14 + waveArm, -78 + breathe);
        } else {
          ctx.moveTo(4, -34 + breathe);
          ctx.lineTo(26, -24 + breathe);
        }
        ctx.stroke();

        // Back hand when scratching head or waving
        if (game.grandpaMood === 'funny' || game.grandpaMood === 'happy') {
          const hx = game.grandpaMood === 'funny' ? (-8 + Math.sin(game.time * 12) * 3) : (-14 + Math.sin(game.time * 10) * 8);
          const hy = game.grandpaMood === 'funny' ? (-72 + breathe) : (-78 + breathe);
          ctx.fillStyle = '#e5b38f';
          ctx.beginPath();
          ctx.arc(hx, hy, 5.5, 0, Math.PI * 2);
          ctx.fill();
        }

        // Shirt torso
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(0, -24 + breathe, 22, 26, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.fillStyle = '#b43d30';
        ctx.fillRect(-26, -54, 52, 56);
        // Subtle plaid pattern
        ctx.strokeStyle = 'rgba(42, 22, 20, 0.35)';
        ctx.lineWidth = 2;
        for (let px = -24; px <= 24; px += 9) {
          ctx.beginPath(); ctx.moveTo(px, -54); ctx.lineTo(px, 6); ctx.stroke();
        }
        for (let py = -52; py <= 6; py += 9) {
          ctx.beginPath(); ctx.moveTo(-26, py); ctx.lineTo(26, py); ctx.stroke();
        }
        ctx.restore();

        // Olive-khaki fishing vest over shirt
        ctx.fillStyle = '#5c6b47';
        ctx.beginPath();
        ctx.moveTo(-19, -42 + breathe);
        ctx.lineTo(-6, -42 + breathe);
        ctx.lineTo(-2, -6 + breathe);
        ctx.lineTo(-21, -8 + breathe);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(6, -42 + breathe);
        ctx.lineTo(18, -42 + breathe);
        ctx.lineTo(20, -8 + breathe);
        ctx.lineTo(8, -6 + breathe);
        ctx.closePath();
        ctx.fill();

        // Vest pockets
        ctx.fillStyle = '#4a5738';
        ctx.fillRect(-17, -25 + breathe, 10, 9);
        ctx.fillRect(10, -25 + breathe, 8, 9);

        // Neck
        ctx.fillStyle = '#e2b08d';
        ctx.fillRect(-6, -54 + breathe, 12, 12);

        // Head
        ctx.save();
        const headTilt = game.grandpaMood === 'funny' ? -0.1 : (game.grandpaMood === 'happy' ? -0.06 : 0.04);
        ctx.translate(2, -63 + breathe);
        ctx.rotate(headTilt);

        // Ear
        ctx.fillStyle = '#dba580';
        ctx.beginPath();
        ctx.arc(-13, 2, 4.5, 0, Math.PI * 2);
        ctx.fill();

        // Face oval with warm shading
        const faceGrad = ctx.createRadialGradient(4, -3, 2, 0, 0, 17);
        faceGrad.addColorStop(0, '#f3c7a4');
        faceGrad.addColorStop(1, '#d89c76');
        ctx.fillStyle = faceGrad;
        ctx.beginPath();
        ctx.ellipse(0, 0, 14, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        // Rosy cheek
        ctx.fillStyle = 'rgba(218, 105, 92, 0.28)';
        ctx.beginPath();
        ctx.ellipse(6, 4, 4.5, 3, 0, 0, Math.PI * 2);
        ctx.fill();

        // Nose
        ctx.fillStyle = '#d99a74';
        ctx.beginPath();
        ctx.arc(12, 1, 3.6, -Math.PI * 0.5, Math.PI * 0.5);
        ctx.fill();

        // Eyes & Blinking
        ctx.fillStyle = '#2a221e';
        if (game.isBlinking) {
          ctx.strokeStyle = '#3a2b24';
          ctx.lineWidth = 1.6;
          ctx.beginPath();
          ctx.moveTo(4, -3); ctx.lineTo(9, -3);
          ctx.stroke();
        } else if (game.grandpaMood === 'happy') {
          // Joyful smiling squint eyes
          ctx.strokeStyle = '#2c221d';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(6.5, -2.5, 3.2, Math.PI * 1.1, Math.PI * 1.9);
          ctx.stroke();
        } else {
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.ellipse(6.5, -3, 3.2, game.grandpaMood === 'funny' ? 3.8 : 2.6, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#253238';
          ctx.beginPath();
          ctx.arc(7.3, -3, 1.7, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(7.8, -3.7, 0.65, 0, Math.PI * 2);
          ctx.fill();
        }

        // Expressive white eyebrows
        ctx.strokeStyle = '#f2f0eb';
        ctx.lineWidth = 2.8;
        ctx.lineCap = 'round';
        ctx.beginPath();
        if (game.grandpaMood === 'funny') {
          ctx.moveTo(3, -10.5); ctx.quadraticCurveTo(7, -13, 11, -10);
        } else if (game.grandpaMood === 'pulling') {
          ctx.moveTo(3, -8.5); ctx.lineTo(11, -6.5);
        } else {
          ctx.moveTo(3, -8); ctx.quadraticCurveTo(7, -9.5, 11, -8);
        }
        ctx.stroke();

        // White beard & bushy mustache
        ctx.fillStyle = '#edeae4';
        ctx.beginPath();
        ctx.moveTo(-9, 5);
        ctx.quadraticCurveTo(-8, 17, 3, 19);
        ctx.quadraticCurveTo(13, 17, 13, 7);
        ctx.quadraticCurveTo(4, 10, -9, 5);
        ctx.fill();

        // Mouth expression
        if (game.grandpaMood === 'happy') {
          ctx.fillStyle = '#8b2e2e';
          ctx.beginPath();
          ctx.arc(6.5, 9, 4.2, 0, Math.PI);
          ctx.fill();
        } else if (game.grandpaMood === 'funny') {
          ctx.fillStyle = '#732929';
          ctx.beginPath();
          ctx.ellipse(7.5, 10, 2.8, 3.6, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Mustache
        ctx.fillStyle = '#f8f6f2';
        ctx.beginPath();
        ctx.moveTo(11, 5.5);
        ctx.quadraticCurveTo(15, 7, 14, 10);
        ctx.quadraticCurveTo(8, 9, 4, 7.5);
        ctx.quadraticCurveTo(0, 10, -2, 8.5);
        ctx.quadraticCurveTo(2, 4.5, 11, 5.5);
        ctx.fill();
        // Straw Sunhat (bounces joyfully on good catch, tilts sideways on funny catch!)
        const hatLift = Math.sin(game.hatBounce * Math.PI) * 10;
        const funnyTilt = game.grandpaMood === 'funny' ? 0.28 : 0;
        ctx.save();
        ctx.translate(game.grandpaMood === 'funny' ? 4 : 0, -10 - hatLift);
        ctx.rotate(-0.08 + funnyTilt - Math.sin(game.hatBounce * Math.PI) * 0.12);
        // Hat brim
        ctx.fillStyle = '#dfc178';
        ctx.beginPath();
        ctx.ellipse(1, 0, 24, 6.5, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#b9964e';
        ctx.lineWidth = 1.2;
        ctx.stroke();
        // Hat crown
        ctx.fillStyle = '#e7cb83';
        ctx.beginPath();
        ctx.moveTo(-13, -1);
        ctx.quadraticCurveTo(-12, -16, 0, -16);
        ctx.quadraticCurveTo(12, -16, 13, -1);
        ctx.closePath();
        ctx.fill();
        // Hat ribbon
        ctx.fillStyle = '#2b5270';
        ctx.fillRect(-12.5, -5, 25, 4);
        ctx.restore();

        ctx.restore(); // end head

        // --- FISHING ROD & FRONT ARM ---
        const rodAngleBase = -0.52 - game.rodBend * 0.28 + Math.sin(game.time * 2.1) * 0.02;
        const handX = 18;
        const handY = -20 + breathe;

        // Front plaid sleeve
        ctx.strokeStyle = '#c44637';
        ctx.lineWidth = 13;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-8, -32 + breathe);
        ctx.quadraticCurveTo(4, -18 + breathe, handX, handY);
        ctx.stroke();

        // Weathered hand holding cork rod grip
        ctx.fillStyle = '#e5b38f';
        ctx.beginPath();
        ctx.arc(handX, handY, 6, 0, Math.PI * 2);
        ctx.fill();

        // Rod geometry in local Grandpa space
        const rodLen = 138;
        const tipLocalX = handX + Math.cos(rodAngleBase) * rodLen;
        const tipLocalY = handY + Math.sin(rodAngleBase) * rodLen + game.rodBend * 44;
        const ctrlLocalX = handX + Math.cos(rodAngleBase) * (rodLen * 0.62);
        const ctrlLocalY = handY + Math.sin(rodAngleBase) * (rodLen * 0.62) - 8 + game.rodBend * 6;

        // Cork handle
        ctx.strokeStyle = '#b8834b';
        ctx.lineWidth = 6.5;
        ctx.beginPath();
        ctx.moveTo(handX - Math.cos(rodAngleBase) * 14, handY - Math.sin(rodAngleBase) * 14);
        ctx.lineTo(handX + Math.cos(rodAngleBase) * 14, handY + Math.sin(rodAngleBase) * 14);
        ctx.stroke();

        // Metallic spinning reel
        const reelX = handX + Math.cos(rodAngleBase) * 16;
        const reelY = handY + Math.sin(rodAngleBase) * 16 + 7;
        ctx.fillStyle = '#b9c6cc';
        ctx.beginPath();
        ctx.arc(reelX, reelY, 6.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#48565e';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        // Spinning reel crank
        ctx.strokeStyle = '#2d373d';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(reelX, reelY);
        ctx.lineTo(reelX + Math.cos(game.reelAngle) * 7.5, reelY + Math.sin(game.reelAngle) * 7.5);
        ctx.stroke();

        // Flexible tapered fishing rod shaft
        ctx.strokeStyle = '#4c3422';
        ctx.lineWidth = 4.2;
        ctx.beginPath();
        ctx.moveTo(handX + Math.cos(rodAngleBase) * 12, handY + Math.sin(rodAngleBase) * 12);
        ctx.quadraticCurveTo(ctrlLocalX, ctrlLocalY, tipLocalX, tipLocalY);
        ctx.stroke();

        ctx.strokeStyle = '#d4a66a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(handX + Math.cos(rodAngleBase) * 14, handY + Math.sin(rodAngleBase) * 14);
        ctx.quadraticCurveTo(ctrlLocalX, ctrlLocalY, tipLocalX, tipLocalY);
        ctx.stroke();

        // Compute world coordinates of rod tip for the above-water fishing line
        // Transform local (tipLocalX, tipLocalY) -> world
        const cosL = Math.cos(leanBack), sinL = Math.sin(leanBack);
        const rx1 = tipLocalX * cosL - tipLocalY * sinL - 8;
        const ry1 = tipLocalX * sinL + tipLocalY * cosL - 12;
        const rx2 = rx1 * game.boatFacing;
        const ry2 = ry1;
        const cosP = Math.cos(pitch), sinP = Math.sin(pitch);
        game.rodTipX = bx + (rx2 * cosP - ry2 * sinP) * scale;
        game.rodTipY = by + (rx2 * sinP + ry2 * cosP) * scale;

        ctx.restore(); // end Grandpa

        // --- FRONT WOODEN ROWBOAT HULL (CLINKER PLANKS) ---
        const hullGrad = ctx.createLinearGradient(0, -14, 0, 18);
        hullGrad.addColorStop(0, '#9c663c');
        hullGrad.addColorStop(0.55, '#7c4c2a');
        hullGrad.addColorStop(1, '#4f2f19');

        ctx.fillStyle = hullGrad;
        ctx.beginPath();
        ctx.moveTo(-104, -14);
        ctx.quadraticCurveTo(0, -6, 104, -14);
        ctx.quadraticCurveTo(94, 12, 66, 16);
        ctx.lineTo(-66, 16);
        ctx.quadraticCurveTo(-94, 12, -104, -14);
        ctx.closePath();
        ctx.fill();

        // Plank seam lines
        ctx.strokeStyle = 'rgba(42, 22, 10, 0.55)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(-98, -4); ctx.quadraticCurveTo(0, 3, 98, -4);
        ctx.moveTo(-88, 6); ctx.quadraticCurveTo(0, 12, 88, 6);
        ctx.stroke();

        // Gunwale wooden rim
        ctx.strokeStyle = '#c48d5a';
        ctx.lineWidth = 4.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(-105, -14);
        ctx.quadraticCurveTo(0, -6, 105, -14);
        ctx.stroke();

        // Tucked wooden oar resting along side
        ctx.strokeStyle = '#b47d4a';
        ctx.lineWidth = 4.2;
        ctx.beginPath();
        ctx.moveTo(-48, -10);
        ctx.lineTo(36, -6);
        ctx.stroke();
        ctx.fillStyle = '#c9935d';
        ctx.beginPath();
        ctx.ellipse(-56, -10, 14, 4.5, 0.05, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      // =========================================================================
      // 11. RENDERING: UNDERWATER WORLD, GOD RAYS, KELP, RIVERBED
      // =========================================================================
      function drawUnderwaterWorld() {
        // Rich depth gradient
        const waterGrad = ctx.createLinearGradient(0, waterlineY, 0, H);
        waterGrad.addColorStop(0, '#2c9aa0');
        waterGrad.addColorStop(0.18, '#197380');
        waterGrad.addColorStop(0.55, '#0e4959');
        waterGrad.addColorStop(0.88, '#092f3d');
        waterGrad.addColorStop(1, '#07222c');
        ctx.fillStyle = waterGrad;
        ctx.fillRect(0, waterlineY, W, H - waterlineY);

        // Volumetric swaying sunbeams (god rays)
        ctx.save();
        ctx.beginPath();
        ctx.rect(0, waterlineY, W, H - waterlineY);
        ctx.clip();
        for (let i = 0; i < 6; i++) {
          const baseX = W * (0.14 + i * 0.16) + Math.sin(game.time * 0.4 + i) * 28;
          const beamW = 55 + (i % 3) * 26;
          const skew = -110 - i * 14;
          const alpha = 0.045 + Math.sin(game.time * 0.9 + i * 1.4) * 0.018;
          const rayGrad = ctx.createLinearGradient(baseX, waterlineY, baseX + skew, H * 0.88);
          rayGrad.addColorStop(0, `rgba(190, 248, 242, ${alpha * 1.9})`);
          rayGrad.addColorStop(0.65, `rgba(120, 224, 222, ${alpha})`);
          rayGrad.addColorStop(1, 'rgba(60, 160, 170, 0)');
          ctx.fillStyle = rayGrad;
          ctx.beginPath();
          ctx.moveTo(baseX - beamW * 0.4, waterlineY);
          ctx.lineTo(baseX + beamW * 0.6, waterlineY);
          ctx.lineTo(baseX + skew + beamW * 1.4, H * 0.92);
          ctx.lineTo(baseX + skew - beamW * 0.4, H * 0.92);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        // Background fish silhouettes
        for (const f of game.bgFish) {
          ctx.save();
          const fx = f.x * W;
          const fy = f.y * H + Math.sin(game.time * 2 + f.phase) * 4;
          ctx.translate(fx, fy);
          ctx.scale(f.dir, 1);
          ctx.fillStyle = `rgba(9, 44, 56, ${f.alpha + 0.14})`;
          ctx.beginPath();
          ctx.ellipse(0, 0, f.size, f.size * 0.42, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.beginPath();
          ctx.moveTo(-f.size * 0.85, 0);
          ctx.lineTo(-f.size * 1.45, -f.size * 0.45);
          ctx.lineTo(-f.size * 1.45, f.size * 0.45);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }

        // Suspended underwater micro-particles
        for (const p of game.particles) {
          ctx.fillStyle = `rgba(195, 242, 245, ${p.alpha})`;
          ctx.beginPath();
          ctx.arc(p.x * W, p.y * H, p.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Swaying underwater kelp on left and right edges
        drawKelpCluster(game.kelpLeft);
        drawKelpCluster(game.kelpRight);

        // Detailed sandy/pebbly riverbed along bottom
        drawRiverbed();
      }

      function drawKelpCluster(cluster) {
        for (const k of cluster) {
          const bx = k.xNorm * W;
          const by = H * 0.96;
          const kh = k.heightNorm * H;
          ctx.save();
          ctx.strokeStyle = `hsl(${152 + k.hueShift}, 44%, 22%)`;
          ctx.lineWidth = k.width;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(bx, by);
          const segs = 6;
          for (let s = 1; s <= segs; s++) {
            const t = s / segs;
            const sway = Math.sin(game.time * 1.8 + k.phase + t * 2.6) * 14 * t;
            ctx.lineTo(bx + sway, by - kh * t);
          }
          ctx.stroke();

          // Soft lighter highlight edge
          ctx.strokeStyle = `hsla(${146 + k.hueShift}, 55%, 36%, 0.45)`;
          ctx.lineWidth = k.width * 0.35;
          ctx.stroke();
          ctx.restore();
        }
      }

      function drawRiverbed() {
        const bedTop = H * 0.855;
        // Back dune
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, bedTop + 12);
        ctx.bezierCurveTo(W * 0.25, bedTop - 16, W * 0.55, bedTop + 20, W, bedTop - 4);
        ctx.lineTo(W, H);
        ctx.closePath();
        const sandBack = ctx.createLinearGradient(0, bedTop - 16, 0, H);
        sandBack.addColorStop(0, '#5a634b');
        sandBack.addColorStop(1, '#2b3228');
        ctx.fillStyle = sandBack;
        ctx.fill();

        // Front sandy riverbed
        ctx.beginPath();
        ctx.moveTo(0, H);
        ctx.lineTo(0, bedTop + 26);
        ctx.bezierCurveTo(W * 0.32, bedTop + 8, W * 0.68, bedTop + 34, W, bedTop + 14);
        ctx.lineTo(W, H);
        ctx.closePath();
        const sandFront = ctx.createLinearGradient(0, bedTop + 6, 0, H);
        sandFront.addColorStop(0, '#7c7858');
        sandFront.addColorStop(0.5, '#59553e');
        sandFront.addColorStop(1, '#313024');
        ctx.fillStyle = sandFront;
        ctx.fill();

        // Smooth river pebbles
        for (const p of game.pebbles) {
          const px = p.x * W;
          const py = bedTop + 28 + p.yOff * (H - bedTop - 32);
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(p.rot);
          const lum = 22 + Math.floor(p.shade * 26);
          ctx.fillStyle = `hsl(42, 14%, ${lum}%)`;
          ctx.beginPath();
          ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, Math.PI * 2);
          ctx.fill();
