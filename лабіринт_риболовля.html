          ctx.fillStyle = `rgba(210, 224, 210, 0.14)`;
          ctx.beginPath();
          ctx.ellipse(-p.rx * 0.22, -p.ry * 0.28, p.rx * 0.55, p.ry * 0.35, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      // =========================================================================
      // 12. RENDERING: TANGLED FISHING-LINE LABYRINTH (CLEAR OVER/UNDER)
      // =========================================================================
      function drawFloatingSnagsAndBobber() {
        const bobWave = Math.sin(game.time * 3.1) * 2.8;

        for (const line of game.lines) {
          const sx = W * game.topSlotsX[line.topSlot];
          const sy = waterlineY + 3 + Math.sin(game.time * 2.5 + line.snagSeed) * 2.2;

          if (line.isTrue) {
            // Grandpa's above-water fishing line from rod tip to bobber
            ctx.save();
            ctx.strokeStyle = 'rgba(240, 250, 255, 0.72)';
            ctx.lineWidth = 1.6;
            ctx.beginPath();
            ctx.moveTo(game.rodTipX, game.rodTipY);
            if (game.state === 'reeling' || game.state === 'arc') {
              ctx.lineTo(game.caughtX, game.caughtY);
            } else {
              const sag = 16;
              ctx.quadraticCurveTo(
                (game.rodTipX + sx) * 0.5,
                (game.rodTipY + sy) * 0.5 + sag,
                sx,
                sy - 8 + bobWave
              );
            }
            ctx.stroke();

            // Classic red-and-white oval fishing bobber (hidden during arc/celebrate)
            if (game.state === 'playing' || game.state === 'tracing' || game.state === 'reeling') {
              const dip = game.state === 'reeling' ? 7 : bobWave;
              ctx.save();
              ctx.translate(sx, sy + dip);
              ctx.rotate(Math.sin(game.time * 2.8) * 0.1);
              // Top antenna stem
              ctx.strokeStyle = '#f5e6c8';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(0, -14); ctx.lineTo(0, 12);
              ctx.stroke();
              // Red upper half
              ctx.fillStyle = '#e0392d';
              ctx.beginPath();
              ctx.arc(0, -2, 8.5, Math.PI, 0);
              ctx.closePath();
              ctx.fill();
              // White lower half
              ctx.fillStyle = '#f8f6f0';
              ctx.beginPath();
              ctx.arc(0, -2, 8.5, 0, Math.PI);
              ctx.closePath();
              ctx.fill();
              // Glossy highlight
              ctx.fillStyle = 'rgba(255,255,255,0.6)';
              ctx.beginPath();
              ctx.ellipse(-3, -5, 2.2, 3.5, -0.4, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            }
            ctx.restore();
          } else if (line.fadeAlpha > 0.05) {
            // Natural floating surface anchor (driftwood, lily pad, or reed tuft) for decoy lines
            const twang = line.twangTimer > 0 ? Math.sin(line.twangTimer * 36) * 5 : 0;
            ctx.save();
            ctx.globalAlpha = line.fadeAlpha;
            ctx.translate(sx, sy + twang);
            ctx.rotate(Math.sin(game.time * 1.9 + line.snagSeed) * 0.08);

            if (line.anchorType === 'lilypad') {
              // Floating green lily pad with small notch & pale blossom
              ctx.fillStyle = '#3b7d42';
              ctx.beginPath();
              ctx.ellipse(0, 1, 18, 6.5, 0, 0.2, Math.PI * 1.9);
              ctx.lineTo(0, 1);
              ctx.closePath();
              ctx.fill();
              ctx.strokeStyle = '#68ab64';
              ctx.lineWidth = 1.2;
              ctx.stroke();
              // Tiny cream water-lily flower
              ctx.fillStyle = '#fff3d6';
              ctx.beginPath();
              ctx.arc(-4, -3, 3.6, 0, Math.PI * 2);
              ctx.fill();
              ctx.fillStyle = '#f2c14e';
              ctx.beginPath();
              ctx.arc(-4, -3, 1.4, 0, Math.PI * 2);
              ctx.fill();
            } else if (line.anchorType === 'reedtuft') {
              // Floating tangled reed stems
              ctx.strokeStyle = '#5c7a3e';
              ctx.lineWidth = 3;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(-14, 2); ctx.quadraticCurveTo(0, -4, 14, 1);
              ctx.moveTo(-8, 4); ctx.quadraticCurveTo(2, -7, 10, -5);
              ctx.stroke();
            } else {
              // Natural driftwood twig
              ctx.strokeStyle = '#6c4d32';
              ctx.lineWidth = 5.5;
              ctx.lineCap = 'round';
              ctx.beginPath();
              ctx.moveTo(-18, 1);
              ctx.quadraticCurveTo(0, -3, 17, 2);
              ctx.stroke();
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(4, 0);
              ctx.lineTo(13, -7);
              ctx.stroke();
              ctx.strokeStyle = 'rgba(190, 154, 114, 0.5)';
              ctx.lineWidth = 1.4;
              ctx.beginPath();
              ctx.moveTo(-13, -1);
              ctx.lineTo(10, -1);
              ctx.stroke();
            }
            ctx.restore();
          }
        }
      }

      function drawLabyrinthLines() {
        // During reeling, draw the taut winning line directly to the rising caught object
        if (game.state === 'reeling') {
          ctx.save();
          ctx.strokeStyle = 'rgba(255, 244, 195, 0.92)';
          ctx.lineWidth = 2.6;
          ctx.beginPath();
          ctx.moveTo(game.bobberX, waterlineY + 8);
          ctx.lineTo(game.caughtX, game.caughtY);
          ctx.stroke();
          ctx.restore();
          return;
        }
        if (game.state === 'arc' || game.state === 'celebrate') return;

        // Draw layer-by-layer using layerDrawOrder so OVER/UNDER crossings are 100% unmistakable
        const numLayers = game.lines[0] ? game.lines[0].numLayers : 0;

        for (let layer = 0; layer < numLayers; layer++) {
          const order = game.layerDrawOrder[layer];
          for (const lineId of order) {
            const line = game.lines[lineId];
            if (!line || line.fadeAlpha <= 0.02) continue;
            const seg = line.segments[layer];
            if (!seg) continue;

            const twang = line.twangTimer > 0 ? Math.sin(game.time * 42 + layer) * 6 * line.twangTimer : 0;

            ctx.save();
            ctx.globalAlpha = line.fadeAlpha;
            ctx.lineCap = 'round';

            // 1. Dark underwater gap halo behind the over-passing line (crucial for readability!)
            ctx.strokeStyle = 'rgba(6, 36, 48, 0.72)';
            ctx.lineWidth = game.numLines === 5 ? 10.5 : 11.5;
            ctx.beginPath();
            ctx.moveTo(seg.x0 + twang * 0.4, seg.y0);
            ctx.bezierCurveTo(
              seg.cx0 + twang, seg.cy0,
              seg.cx1 - twang, seg.cy1,
              seg.x1 - twang * 0.4, seg.y1
            );
            ctx.stroke();

            // 2. Main crisp luminous fishing line
            ctx.strokeStyle = line.twangTimer > 0
              ? 'rgba(255, 196, 155, 0.85)'
              : 'rgba(212, 245, 255, 0.86)';
            ctx.lineWidth = game.numLines === 5 ? 2.9 : 3.2;
            ctx.stroke();

            // 3. Inner white specular core
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.62)';
            ctx.lineWidth = 1.1;
            ctx.stroke();

            ctx.restore();
          }
        }

        // During 'tracing' state: race a bright luminous aqua-gold pulse down the EXACT true path!
        if (game.state === 'tracing') {
          const trueLine = game.lines[game.trueLineIdx];
          if (trueLine && trueLine.sampledPoints.length > 1) {
            const pts = trueLine.sampledPoints;
            const p = Math.min(1, game.stateTimer / 0.78);
            const maxIdx = Math.floor(p * (pts.length - 1));

            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Outer golden-aqua glow
            ctx.strokeStyle = 'rgba(255, 226, 120, 0.45)';
            ctx.lineWidth = 14;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (let i = 1; i <= maxIdx; i++) {
              ctx.lineTo(pts[i].x, pts[i].y);
            }
            ctx.stroke();

            // Bright crisp core
            ctx.strokeStyle = '#fff5b8';
            ctx.lineWidth = 4.6;
            ctx.stroke();

            // Leading bright orb
            const head = pts[maxIdx];
            const orb = ctx.createRadialGradient(head.x, head.y, 1, head.x, head.y, 16);
            orb.addColorStop(0, 'rgba(255, 255, 240, 1)');
            orb.addColorStop(0.45, 'rgba(255, 220, 105, 0.85)');
            orb.addColorStop(1, 'rgba(100, 240, 235, 0)');
            ctx.fillStyle = orb;
            ctx.beginPath();
            ctx.arc(head.x, head.y, 16, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }
        }

        // Subtle glowing aqua trail following finger/mouse tracing
        if (game.traceTrail.length > 1) {
          ctx.save();
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          for (let i = 1; i < game.traceTrail.length; i++) {
            const a = game.traceTrail[i - 1];
            const b = game.traceTrail[i];
            const alpha = Math.max(0, b.life) * 0.42;
            ctx.strokeStyle = `rgba(175, 250, 255, ${alpha})`;
            ctx.lineWidth = 8 * b.life;
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
          ctx.restore();
        }
      }

      // =========================================================================
      // 13. RENDERING: 12 REALISTIC CUSTOM-DRAWN UNDERWATER OBJECTS
      // =========================================================================
      // 13. RENDERING: 10 REALISTIC CUSTOM-DRAWN UNDERWATER OBJECTS
      // =========================================================================
      function drawFishingHook(x, y) {
        ctx.save();
        ctx.translate(x, y);
        ctx.strokeStyle = '#d4e2e8';
        ctx.lineWidth = 2.2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(0, -14);
        ctx.lineTo(0, 2);
        ctx.arc(5, 2, 5, Math.PI, 0, true);
        ctx.lineTo(10, -2);
        ctx.stroke();
        ctx.restore();
      }

      function drawUnderwaterObject(id, t, scale = 1, showHook = true) {
        ctx.save();
        ctx.scale(scale, scale);

        if (showHook) {
          drawFishingHook(0, -26);
        }

        const wave = Math.sin(t * 3.4);

        switch (id) {
          case 'carp': {
            // Mirror Carp: realistic olive-bronze body, scales, fins
            // Tail fin
            ctx.fillStyle = '#8b683c';
            ctx.beginPath();
            ctx.moveTo(-28, 0);
            ctx.quadraticCurveTo(-44, -14 + wave * 5, -48, -18 + wave * 6);
            ctx.quadraticCurveTo(-40, 0, -48, 18 + wave * 6);
            ctx.quadraticCurveTo(-42, 12 + wave * 5, -28, 0);
            ctx.fill();

            // Dorsal fin
            ctx.fillStyle = '#735834';
            ctx.beginPath();
            ctx.moveTo(-18, -14);
            ctx.quadraticCurveTo(0, -30, 18, -15);
            ctx.closePath();
            ctx.fill();

            // Body
            const grad = ctx.createLinearGradient(0, -22, 0, 22);
            grad.addColorStop(0, '#5a6337');
            grad.addColorStop(0.5, '#b89652');
            grad.addColorStop(1, '#e6d39c');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(2, 0, 34, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            // Scales shimmer
            ctx.strokeStyle = 'rgba(72, 56, 28, 0.35)';
            ctx.lineWidth = 1.2;
            for (let sx = -18; sx <= 12; sx += 8) {

      function drawBottomObjects() {
        for (let i = 0; i < game.objects.length; i++) {
          const o = game.objects[i];
          if (o.caught) continue; // drawn separately while reeling/arcing/celebrating

          const floatY = Math.sin(game.time * 2.2 + o.phase) * 3.5;
          const hoverLift = o.hoverAmount * 9;
          const jiggleX = o.jiggleTimer > 0 ? Math.sin(o.jiggleTimer * 44) * 9 * o.jiggleTimer : 0;
          const jiggleRot = o.jiggleTimer > 0 ? Math.sin(o.jiggleTimer * 38) * 0.22 * o.jiggleTimer : 0;

          const drawX = o.x + jiggleX;
          const drawY = o.baseY + floatY - hoverLift;

          // Organic underwater light ripple on hover (no rectangles!)
          if (o.hoverAmount > 0.02) {
            ctx.save();
            const r = 46 * o.scale * (0.85 + 0.18 * Math.sin(game.time * 5));
            const glow = ctx.createRadialGradient(drawX, drawY + 8, 4, drawX, drawY + 8, r);
            glow.addColorStop(0, `rgba(180, 250, 245, ${0.28 * o.hoverAmount})`);
            glow.addColorStop(0.65, `rgba(110, 225, 225, ${0.14 * o.hoverAmount})`);
            glow.addColorStop(1, 'rgba(110, 225, 225, 0)');
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.ellipse(drawX, drawY + 8, r * 1.2, r * 0.65, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
          }

          // Natural riverbed contact shadow
          ctx.fillStyle = 'rgba(6, 22, 28, 0.38)';
          ctx.beginPath();
          ctx.ellipse(o.x, o.baseY + 26 * o.scale, 34 * o.scale, 8 * o.scale, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.save();
          ctx.translate(drawX, drawY);
          ctx.rotate(jiggleRot);
          drawUnderwaterObject(o.id, game.time + o.phase, o.scale * (1 + o.hoverAmount * 0.07), true);
          ctx.restore();
        }
      }

      // =========================================================================
      // 14. RENDERING: WATER SURFACE, BUBBLES, SPLASHES & CAUGHT OBJECT
      // =========================================================================
      function drawWaterSurface() {
        ctx.save();
        // Multi-layered shimmering waves along waterlineY
        for (let layer = 0; layer < 2; layer++) {
          ctx.beginPath();
          ctx.moveTo(0, waterlineY + 12);
          for (let x = 0; x <= W; x += 24) {
            const wy =
              waterlineY +
              Math.sin(x * 0.015 + game.time * (2.2 + layer * 0.7) + layer * 2) * (3.2 - layer) +
              Math.cos(x * 0.032 - game.time * 1.6) * 1.6;
            ctx.lineTo(x, wy);
          }
          ctx.lineTo(W, waterlineY + 14);
          ctx.closePath();
          ctx.fillStyle = layer === 0 ? 'rgba(94, 198, 198, 0.35)' : 'rgba(218, 248, 240, 0.25)';
          ctx.fill();
        }

        // Specular golden sun glints on the water surface
        const sunX = W * 0.78;
        for (let i = 0; i < 12; i++) {
          const gx = sunX + Math.sin(i * 2.1 + game.time * 0.9) * 150;
          const gy = waterlineY + 3 + (i % 4) * 3.5;
          const gw = 16 + Math.sin(game.time * 3 + i) * 10;
          ctx.fillStyle = `rgba(255, 246, 200, ${0.28 + 0.18 * Math.sin(game.time * 4 + i)})`;
          ctx.beginPath();
          ctx.ellipse(gx, gy, Math.max(4, gw), 1.8, 0, 0, Math.PI * 2);
          ctx.fill();
        }

        // Expanding surface splash ripples
        for (const r of game.surfaceRipples) {
          ctx.strokeStyle = `rgba(235, 252, 255, ${r.alpha})`;
          ctx.lineWidth = 2.2;
          ctx.beginPath();
          ctx.ellipse(r.x, r.y, r.rx, r.rx * 0.16, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      function drawBubblesAndFX() {
        // Underwater bubbles (ambient + finger/mouse trace bubbles)
        for (const b of game.bubbles) {
          const a = b.isTrace ? b.alpha * Math.max(0, Math.min(1, b.life)) : b.alpha;
          ctx.save();
          ctx.fillStyle = b.isTrace
            ? `rgba(205, 252, 255, ${a * 0.48})`
            : `rgba(195, 244, 250, ${a * 0.28})`;
          ctx.strokeStyle = `rgba(235, 254, 255, ${a * 0.85})`;
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          // Specular dot
          ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
          ctx.beginPath();
          ctx.arc(b.x - b.r * 0.32, b.y - b.r * 0.32, b.r * 0.26, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // Caught object while reeling, arcing out of water, or celebrating in boat
        if (game.caughtObj && game.caughtObj.caught) {
          ctx.save();
          ctx.translate(game.caughtX, game.caughtY);
          ctx.rotate(game.caughtRot);
          drawUnderwaterObject(game.caughtObj.id, game.time * 1.4, game.caughtScale, game.state === 'reeling');
          ctx.restore();
        }

        // Water splash droplets
        for (const s of game.splashes) {
          ctx.fillStyle = `rgba(225, 250, 255, ${Math.max(0, s.life * 0.88)})`;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Celebration sparkles (gold stars for good catches, bouncing water drops for funny catches)
        for (const sp of game.sparkles) {
          const a = Math.max(0, Math.min(1, sp.life));
          ctx.save();
          ctx.translate(sp.x, sp.y);
          ctx.rotate(sp.rot);
          if (sp.isGood) {
            ctx.fillStyle = `rgba(255, 232, 128, ${a})`;
            ctx.beginPath();
            for (let k = 0; k < 4; k++) {
              const ang = (k * Math.PI) / 2;
              ctx.lineTo(Math.cos(ang) * sp.size, Math.sin(ang) * sp.size);
              ctx.lineTo(Math.cos(ang + Math.PI / 4) * sp.size * 0.35, Math.sin(ang + Math.PI / 4) * sp.size * 0.35);
            }
            ctx.closePath();
            ctx.fill();
          } else {
            ctx.fillStyle = `rgba(175, 238, 255, ${a * 0.9})`;
            ctx.beginPath();
            ctx.arc(0, 0, sp.size * 0.65, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // Smooth underwater transition veil between rounds
        if (game.transitionAlpha > 0.005) {
          ctx.fillStyle = `rgba(10, 46, 58, ${game.transitionAlpha * 0.72})`;
          ctx.fillRect(0, 0, W, H);
        }
      }

      // =========================================================================
      // 15. MAIN ANIMATION LOOP
      // =========================================================================
      let lastTime = 0;
      function frame(now) {
        if (!lastTime) lastTime = now;
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        update(dt);

        ctx.clearRect(0, 0, W, H);
        drawSkyAndScenery();
        drawUnderwaterWorld();
        drawLabyrinthLines();
        drawBottomObjects();
        drawGrandpaAndBoat();
        drawWaterSurface();
        drawFloatingSnagsAndBobber();
        drawBubblesAndFX();

        requestAnimationFrame(frame);
      }

      // =========================================================================
      // 16. BOOTSTRAP
      // =========================================================================
      window.addEventListener('resize', resizeCanvas);

      window.onload = function () {
        resizeCanvas();
        initAmbientWorld();
        generateNewLabyrinth();
        game.initialized = true;
        requestAnimationFrame(frame);
      };
    })();
  </script>
</body>
