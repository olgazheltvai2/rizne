<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Monster Wash</title>
  <style>
    /* ================= ОСНОВНІ СТИЛІ ЕКРАНА ТА ФОНУ ================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d4b56;
      font-family: sans-serif;
    }

    /* Головний контейнер сцени */
    #game-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Головне SVG-полотно на весь екран */
    #main-svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Інтерактивний монстрик */
    #monster-group {
      cursor: pointer;
      transition: filter 0.2s ease;
    }
    #monster-group:hover {
      filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.45));
    }

    /* Інтерактивна качечка-компаньйон та кран */
    #duck-companion, #faucet-group {
      cursor: pointer;
    }

    /* ================= КНОПКИ КЕРУВАННЯ (НАЗАД, ПІДГЛЯНУТИ, ДАЛІ) ================= */
    .nav-btn {
      position: fixed;
      bottom: 24px;
      width: 76px;
      height: 76px;
      border: none;
      background: none;
      cursor: pointer;
      z-index: 50;
      padding: 0;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s, filter 0.2s;
      filter: drop-shadow(0 8px 14px rgba(8, 38, 46, 0.45));
    }

    .nav-btn:hover {
      transform: scale(1.12) translateY(-3px);
    }

    .nav-btn:active {
      transform: scale(0.92);
    }

    .nav-btn:disabled {
      opacity: 0.32;
      pointer-events: none;
      filter: grayscale(0.6);
    }

    /* Кнопка попереднього рівня (ліворуч) */
    #btn-prev {
      left: 28px;
    }

    /* Кнопка наступного рівня (праворуч) */
    #btn-next {
      right: 28px;
    }

    /* Спеціальна кнопка "Подивитись попереднього монстрика" (по центру внизу) */
    #btn-peek {
      left: 50%;
      transform: translateX(-50%);
      width: 92px;
      height: 92px;
      bottom: 18px;
    }

    #btn-peek:hover {
      transform: translateX(-50%) scale(1.12) translateY(-3px);
    }

    #btn-peek:active {
      transform: translateX(-50%) scale(0.92);
    }

    /* Активний стан кнопки підглядання (коли дитина дивиться на попереднього монстрика) */
    #btn-peek.peek-active {
      filter: drop-shadow(0 0 22px #ffd166) drop-shadow(0 0 35px #ff9f1c);
      transform: translateX(-50%) scale(1.14);
    }

    /* Анімація крапельки води з крана */
    @keyframes waterDrip {
      0% { transform: translateY(0) scale(0.4); opacity: 0.9; }
      70% { transform: translateY(95px) scale(1); opacity: 0.9; }
      100% { transform: translateY(115px) scale(1.5, 0.3); opacity: 0; }
    }

    .drip-anim {
      animation: waterDrip 2.4s infinite ease-in;
      transform-box: fill-box;
      transform-origin: center;
    }

    /* Анімація пунктирного сяйва дзеркала в режимі перегляду попереднього монстрика */
    @keyframes magicDash {
      to { stroke-dashoffset: -120; }
    }

    #peek-mirror-glow {
      animation: magicDash 2.5s linear infinite;
      transition: opacity 0.25s ease;
    }
  </style>
</head>
<body>

<div id="game-stage">
  <!-- ГОЛОВНЕ ІГРОВЕ ПОЛОТНО SVG -->
  <svg id="main-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Градієнти та візерунки кахлів ванної кімнати -->
      <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1abc9c"/>
        <stop offset="50%" stop-color="#16a085"/>
        <stop offset="100%" stop-color="#0e6655"/>
      </linearGradient>

      <pattern id="tilePattern" width="120" height="120" patternUnits="userSpaceOnUse">
        <rect width="120" height="120" fill="url(#wallGrad)"/>
        <rect x="4" y="4" width="112" height="112" rx="14" fill="#25d0b0" fill-opacity="0.22" stroke="#48e5c7" stroke-width="2" stroke-opacity="0.35"/>
        <path d="M60 20 Q75 45 100 60 Q75 75 60 100 Q45 75 20 60 Q45 45 60 20 Z" fill="#ffffff" fill-opacity="0.06"/>
        <circle cx="60" cy="60" r="8" fill="#ffd166" fill-opacity="0.15"/>
        <circle cx="16" cy="16" r="3" fill="#ffffff" fill-opacity="0.25"/>
        <circle cx="104" cy="16" r="3" fill="#ffffff" fill-opacity="0.25"/>
        <circle cx="16" cy="104" r="3" fill="#ffffff" fill-opacity="0.25"/>
        <circle cx="104" cy="104" r="3" fill="#ffffff" fill-opacity="0.25"/>
      </pattern>

      <!-- Рама дзеркала -->
      <linearGradient id="mirrorFrameGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffbe55"/>
        <stop offset="50%" stop-color="#f39c12"/>
        <stop offset="100%" stop-color="#d68910"/>
      </linearGradient>

      <!-- Поверхня дзеркала -->
      <radialGradient id="mirrorGlassGrad" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#dff9fb"/>
        <stop offset="65%" stop-color="#a5eef5"/>
        <stop offset="100%" stop-color="#68d6e3"/>
      </radialGradient>

      <!-- Поверхня дзеркала під час спогаду (перегляду попереднього) -->
      <radialGradient id="mirrorMemoryGrad" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#fff8d6"/>
        <stop offset="65%" stop-color="#ffe599"/>
        <stop offset="100%" stop-color="#f6b93b"/>
      </radialGradient>

      <!-- Стільниця умивальника -->
      <linearGradient id="sinkCounterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ff9f68"/>
        <stop offset="25%" stop-color="#ff7b54"/>
        <stop offset="100%" stop-color="#c84b31"/>
      </linearGradient>

      <!-- Керамічний умивальник -->
      <linearGradient id="basinGrad" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#d2f4f7"/>
        <stop offset="30%" stop-color="#ffffff"/>
        <stop offset="70%" stop-color="#f0fbfc"/>
        <stop offset="100%" stop-color="#b8e4ea"/>
      </linearGradient>

      <!-- Латунний кран -->
      <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fff3b0"/>
        <stop offset="40%" stop-color="#f4d35e"/>
        <stop offset="80%" stop-color="#ee964b"/>
        <stop offset="100%" stop-color="#b5651d"/>
      </linearGradient>

      <!-- Смугастий рушник -->
      <pattern id="towelPattern" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
        <rect width="40" height="40" fill="#ff6b81"/>
        <rect width="20" height="40" fill="#ff4757"/>
        <line x1="0" y1="0" x2="0" y2="40" stroke="#ffeaa7" stroke-width="4"/>
      </pattern>

      <!-- Мильна бульбашка (глянцева) -->
      <radialGradient id="soapBubbleGrad" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
        <stop offset="25%" stop-color="#e8fdff" stop-opacity="0.85"/>
        <stop offset="65%" stop-color="#a8e6cf" stop-opacity="0.5"/>
        <stop offset="88%" stop-color="#ffafcc" stop-opacity="0.7"/>
        <stop offset="100%" stop-color="#bde0fe" stop-opacity="0.9"/>
      </radialGradient>

      <!-- Золотиста бульбашка для кнопки перегляду попереднього монстрика -->
      <radialGradient id="peekBubbleGrad" cx="35%" cy="30%" r="68%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
        <stop offset="30%" stop-color="#fff3b0" stop-opacity="0.9"/>
        <stop offset="70%" stop-color="#ffbe0b" stop-opacity="0.75"/>
        <stop offset="100%" stop-color="#fb5607" stop-opacity="0.95"/>
      </radialGradient>

      <!-- Густа біла піна для намилювання -->
      <radialGradient id="foamPuffGrad" cx="38%" cy="32%" r="65%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="60%" stop-color="#f3fcff"/>
        <stop offset="88%" stop-color="#d2f1ff"/>
        <stop offset="100%" stop-color="#a9def9"/>
      </radialGradient>

      <!-- Глибина рота монстрика -->
      <linearGradient id="mouthInsideGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#4a0e2e"/>
        <stop offset="100%" stop-color="#8c1d40"/>
      </linearGradient>

      <!-- Язик монстрика -->
      <linearGradient id="tongueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ff6b8b"/>
        <stop offset="100%" stop-color="#ff2e63"/>
      </linearGradient>

      <!-- Градієнти для 7 кольорів та текстур обличчя монстрика -->
      <radialGradient id="monsterSkin0" cx="45%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#ff7eb3"/>
        <stop offset="70%" stop-color="#ff4d88"/>
        <stop offset="100%" stop-color="#c9184a"/>
      </radialGradient>
      <radialGradient id="monsterSkin1" cx="45%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#a8ff78"/>
        <stop offset="65%" stop-color="#54e346"/>
        <stop offset="100%" stop-color="#1e8449"/>
      </radialGradient>
      <radialGradient id="monsterSkin2" cx="45%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#ffd166"/>
        <stop offset="65%" stop-color="#ff9f1c"/>
        <stop offset="100%" stop-color="#e0530c"/>
      </radialGradient>
      <radialGradient id="monsterSkin3" cx="45%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#72efdd"/>
        <stop offset="65%" stop-color="#00bbf9"/>
        <stop offset="100%" stop-color="#0077b6"/>
      </radialGradient>
      <radialGradient id="monsterSkin4" cx="45%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#e0aaff"/>
        <stop offset="65%" stop-color="#9d4edd"/>
        <stop offset="100%" stop-color="#5a189a"/>
      </radialGradient>
      <radialGradient id="monsterSkin5" cx="45%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#ffadad"/>
        <stop offset="65%" stop-color="#ff5d5d"/>
        <stop offset="100%" stop-color="#b7094c"/>
      </radialGradient>
      <radialGradient id="monsterSkin6" cx="45%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#fff677"/>
        <stop offset="65%" stop-color="#f7b801"/>
        <stop offset="100%" stop-color="#f18701"/>
      </radialGradient>

      <!-- Тіні для об'ємних елементів -->
      <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#082e36" flood-opacity="0.38"/>
      </filter>

      <filter id="partShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#1d092b" flood-opacity="0.28"/>
      </filter>
    </defs>

    <!-- ================= 1. ФОН ВАННОЇ КІМНАТИ ================= -->
    <rect width="1600" height="900" fill="url(#tilePattern)"/>

    <!-- Декоративний бордюр на плитці -->
    <rect x="0" y="610" width="1600" height="28" fill="#f4d35e" opacity="0.85"/>
    <path d="M0 624 L1600 624" stroke="#ee964b" stroke-width="6" stroke-dasharray="30 15"/>

    <!-- Ліва поличка з кольоровими пляшечками шампуню -->
    <g id="left-shelf" transform="translate(80, 260)" filter="url(#softShadow)">
      <!-- Пляшечка 1 (фіолетова з дозатором) -->
      <path d="M40 30 Q40 0 70 0 L90 0 Q120 0 120 30 L130 140 Q130 160 110 160 L50 160 Q30 160 30 140 Z" fill="#9b5de5"/>
      <rect x="65" y="-22" width="30" height="22" rx="6" fill="#fee440"/>
      <path d="M80 -22 L80 -35 L110 -35" stroke="#fee440" stroke-width="10" stroke-linecap="round" fill="none"/>
      <circle cx="80" cy="85" r="28" fill="#f15bb5" opacity="0.8"/>
      <circle cx="72" cy="76" r="8" fill="#ffffff" opacity="0.6"/>
      <!-- Пляшечка 2 (коралова) -->
      <rect x="145" y="45" width="75" height="115" rx="25" fill="#ff595e"/>
      <rect x="165" y="25" width="35" height="22" rx="6" fill="#ffffff"/>
      <path d="M160 95 Q182 75 205 95 Q182 115 160 95 Z" fill="#ffca3a"/>
      <!-- Дерев'яна поличка -->
      <rect x="10" y="155" width="240" height="26" rx="13" fill="url(#mirrorFrameGrad)"/>
      <path d="M35 181 L55 215 L65 181 Z" fill="#d68910"/>
      <path d="M215 181 L195 215 L185 181 Z" fill="#d68910"/>
    </g>

    <!-- Правий вішак із яскравим смугастим рушником -->
    <g id="right-towel" transform="translate(1310, 270)" filter="url(#softShadow)">
      <circle cx="95" cy="15" r="24" fill="url(#brassGrad)"/>
      <path d="M95 25 C45 25 45 95 95 95 C145 95 145 25 95 25" stroke="url(#brassGrad)" stroke-width="12" fill="none"/>
      <path d="M55 70 Q95 82 135 70 L155 310 Q125 325 95 305 Q65 285 35 310 Z" fill="url(#towelPattern)"/>
      <path d="M40 312 L40 330 M58 310 L58 328 M76 306 L76 325 M95 306 L95 325 M114 312 L114 330 M132 315 L132 332 M148 312 L148 328" stroke="#ffeaa7" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- Велике фігурне дзеркало в центрі (рамка навколо монстрика) -->
    <g id="mirror-container" transform="translate(800, 415)" filter="url(#softShadow)">
      <!-- Зовнішня золота різьблена рама -->
      <rect x="-430" y="-375" width="860" height="720" rx="180" fill="url(#mirrorFrameGrad)" stroke="#ffeaa7" stroke-width="6"/>
      <!-- Декоративні лампочки на рамі дзеркала -->
      <circle cx="-395" cy="-200" r="14" fill="#fff9c4"/>
      <circle cx="-395" cy="0" r="14" fill="#fff9c4"/>
      <circle cx="-395" cy="200" r="14" fill="#fff9c4"/>
      <circle cx="395" cy="-200" r="14" fill="#fff9c4"/>
      <circle cx="395" cy="0" r="14" fill="#fff9c4"/>
      <circle cx="395" cy="200" r="14" fill="#fff9c4"/>
      <circle cx="-200" cy="-348" r="14" fill="#fff9c4"/>
      <circle cx="0" cy="-348" r="14" fill="#fff9c4"/>
      <circle cx="200" cy="-348" r="14" fill="#fff9c4"/>

      <!-- Скляна поверхня дзеркала -->
      <rect id="mirror-glass" x="-395" y="-340" width="790" height="650" rx="155" fill="url(#mirrorGlassGrad)" stroke="#55c5d1" stroke-width="8"/>

      <!-- Сяючий контур-рамка (вмикається, коли дитина підглядає попереднього монстрика) -->
      <g id="peek-mirror-glow" opacity="0">
        <rect x="-388" y="-333" width="776" height="636" rx="148" fill="none" stroke="#ff9f1c" stroke-width="14" stroke-dasharray="32 20" stroke-linecap="round"/>
        <!-- Іконка-підказка ока зверху дзеркала під час перегляду попереднього стану -->
        <g transform="translate(0, -325)">
          <rect x="-70" y="-32" width="140" height="56" rx="28" fill="#ff9f1c" stroke="#ffffff" stroke-width="4"/>
          <path d="M-38 -4 Q0 -28 38 -4 Q0 20 -38 -4 Z" fill="#ffffff"/>
          <circle cx="0" cy="-4" r="11" fill="#0d4b56"/>
          <circle cx="-4" cy="-8" r="4" fill="#ffffff"/>
        </g>
      </g>

      <!-- Бліки на дзеркалі -->
      <path d="M-320 -260 L-160 -320 L-280 -120 Z" fill="#ffffff" opacity="0.35"/>
      <path d="M-350 80 L220 -310 L290 -280 L-330 160 Z" fill="#ffffff" opacity="0.22"/>
    </g>

    <!-- Фонові літаючі мильні бульбашки -->
    <g id="ambient-bubbles"></g>

    <!-- ================= 2. ГОЛОВНИЙ ГЕРОЙ — КУМЕДНИЙ МОНСТРИК ================= -->
    <g id="monster-stage" transform="translate(800, 435)">
      <g id="monster-group">
        <!-- Група плавного дихання та погойдування монстрика -->
        <g id="monster-breath-group">
          <!-- Шия та плечі монстрика -->
          <path id="monster-shoulders" d="M-190 230 Q-140 160 0 160 Q140 160 190 230 L230 310 L-230 310 Z" fill="url(#monsterSkin0)"/>

          <!-- ШАР 1: ВУХА / РІЖКИ (7 видів) -->
          <g id="part-ears" filter="url(#partShadow)"></g>

          <!-- ШАР 2: ФОРМА ОБЛИЧЧЯ (7 видів) -->
          <g id="part-face" filter="url(#softShadow)"></g>

          <!-- Рум'янець на щічках -->
          <g id="monster-cheeks" opacity="0.45">
            <ellipse cx="-145" cy="45" rx="36" ry="20" fill="#ff3366"/>
            <ellipse cx="145" cy="45" rx="36" ry="20" fill="#ff3366"/>
          </g>

          <!-- ШАР 3: РОТ (7 видів) -->
          <g id="part-mouth" transform="translate(0, 95)" filter="url(#partShadow)"></g>

          <!-- ШАР 4: НІС (7 видів) -->
          <g id="part-nose" transform="translate(0, 8)" filter="url(#partShadow)"></g>

          <!-- ШАР 5: ОЧІ (7 видів — без кліпання, лише виразно переводять погляд) -->
          <g id="part-eyes" transform="translate(0, -75)" filter="url(#partShadow)"></g>
        </g>
      </g>

      <!-- ШАР 6: ГУСТА ПІНА ТА ЛАПКИ, ЩО НАМИЛЮЮТЬ ОБЛИЧЧЯ -->
      <g id="foam-overlay-layer" pointer-events="none"></g>

      <!-- Лапки монстрика з милом та мочалкою (з'являються під час намилювання) -->
      <g id="scrubbing-hands" opacity="0" pointer-events="none">
        <!-- Ліва лапка з рожевим запашним милом -->
        <g id="hand-left" transform="translate(-220, 120)">
          <path d="M-140 220 Q-90 40 -10 -20 Q45 -55 75 -10 Q105 35 40 110 L-40 250 Z" fill="url(#monsterSkin0)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3"/>
          <g transform="rotate(-20)">
            <rect x="-45" y="-55" width="110" height="72" rx="28" fill="#ff85a1" stroke="#ff477e" stroke-width="4"/>
            <rect x="-30" y="-42" width="80" height="46" rx="18" fill="#fbb1bd"/>
            <circle cx="-25" cy="-50" r="14" fill="#ffffff"/>
            <circle cx="45" cy="-20" r="18" fill="#ffffff"/>
            <circle cx="20" cy="-55" r="12" fill="#ffffff"/>
          </g>
        </g>

        <!-- Права лапка з пухнастою жовтою губкою-мочалкою -->
        <g id="hand-right" transform="translate(220, 120)">
          <path d="M140 220 Q90 40 10 -20 Q-45 -55 -75 -10 Q-105 35 -40 110 L40 250 Z" fill="url(#monsterSkin0)" stroke="#ffffff" stroke-width="3" stroke-opacity="0.3"/>
          <g transform="rotate(18)">
            <rect x="-70" y="-60" width="125" height="86" rx="32" fill="#ffd166" stroke="#f4a261" stroke-width="5"/>
            <circle cx="-35" cy="-30" r="8" fill="#e07a5f" opacity="0.5"/>
            <circle cx="10" cy="-35" r="6" fill="#e07a5f" opacity="0.5"/>
            <circle cx="-10" cy="0" r="9" fill="#e07a5f" opacity="0.5"/>
            <circle cx="30" cy="-5" r="7" fill="#e07a5f" opacity="0.5"/>
            <circle cx="-50" cy="-55" r="16" fill="#ffffff"/>
            <circle cx="40" cy="-50" r="20" fill="#ffffff"/>
            <circle cx="0" cy="-62" r="15" fill="#ffffff"/>
          </g>
        </g>
      </g>

      <!-- ШАР 7: Святкові бризки та бульбашки при відкритті нового образу -->
      <g id="burst-particles" pointer-events="none"></g>
    </g>

    <!-- ================= 3. ПЕРЕДНІЙ ПЛАН: УМИВАЛЬНИК, КРАН ТА КАЧЕЧКА ================= -->
    <g id="foreground-sink">
      <!-- Стільниця -->
      <rect x="0" y="745" width="1600" height="165" fill="url(#sinkCounterGrad)"/>
      <rect x="0" y="745" width="1600" height="18" fill="#ffbe76" opacity="0.6"/>

      <!-- Чаша умивальника -->
      <path d="M430 715 L1170 715 Q1210 715 1195 755 Q1150 865 800 865 Q450 865 405 755 Q390 715 430 715 Z" fill="url(#basinGrad)" filter="url(#softShadow)"/>
      <ellipse cx="800" cy="722" rx="370" ry="24" fill="#a8e0e8"/>
      <!-- Піна в умивальнику -->
      <path d="M460 724 Q520 695 580 722 Q650 690 730 720 Q800 692 880 722 Q960 695 1030 722 Q1090 700 1135 724 Z" fill="#ffffff" opacity="0.9"/>

      <!-- Вінтажний латунний кран зліва від чаші -->
      <g id="faucet-group" transform="translate(465, 620)" filter="url(#softShadow)">
        <rect x="-28" y="75" width="56" height="32" rx="8" fill="url(#brassGrad)"/>
        <path d="M-18 75 L-18 10 C-18 -45 85 -45 95 15 L95 35 L68 35 L68 20 C65 -12 15 -12 15 15 L15 75 Z" fill="url(#brassGrad)"/>
        <g id="faucet-valve" transform="translate(0, -18)">
          <rect x="-8" y="-22" width="16" height="25" rx="4" fill="url(#brassGrad)"/>
          <rect x="-32" y="-28" width="64" height="14" rx="7" fill="url(#brassGrad)"/>

<script>
  /* =========================================================================
   * 1. ЗВУКОВИЙ РУШІЙ (Web Audio API) — активні звукові ефекти без жодних слів
   * ========================================================================= */
  class SoundFX {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        this.ctx = new AudioCtx();
      }
      if (this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Звук бульбашки, що лускає або з'являється
    playBubblePop(baseFreq = 400) {
      this.init();
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();

      osc.type = 'sine';
      osc.frequency.setValueAtTime(baseFreq, now);
      osc.frequency.exponentialRampToValueAtTime(baseFreq * 2.4, now + 0.09);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.095);
    }

    // Звук інтенсивного намилювання (шум мочалки + серія бульбашок)
    playScrubAndLather() {
      this.init();
      const now = this.ctx.currentTime;

      const bufferSize = this.ctx.sampleRate * 1.3;
      const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      const noise = this.ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = this.ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 3.5;

      for (let i = 0; i < 6; i++) {
        filter.frequency.setValueAtTime(600, now + i * 0.2);
        filter.frequency.linearRampToValueAtTime(1600, now + i * 0.2 + 0.1);
      }

      const noiseGain = this.ctx.createGain();
      noiseGain.gain.setValueAtTime(0.16, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.01, now + 1.25);

      noise.connect(filter);
      filter.connect(noiseGain);
      noiseGain.connect(this.ctx.destination);
      noise.start(now);
      noise.stop(now + 1.28);

      for (let i = 0; i < 14; i++) {
        setTimeout(() => {
          this.playBubblePop(280 + Math.random() * 520);
        }, i * 85);
      }
    }

    // Яскравий фідбек при появі оновленого монстрика
    playMonsterReveal(variant = 0) {
      this.init();
      const now = this.ctx.currentTime;

      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, idx) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = idx % 2 === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, now + idx * 0.055);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.06, now + idx * 0.055 + 0.22);

        gain.gain.setValueAtTime(0.16, now + idx * 0.055);
        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.055 + 0.26);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + idx * 0.055);
        osc.stop(now + idx * 0.055 + 0.27);
      });

      const boing = this.ctx.createOscillator();
      const bGain = this.ctx.createGain();
      boing.type = 'sawtooth';

      const bFilter = this.ctx.createBiquadFilter();
      bFilter.type = 'lowpass';
      bFilter.frequency.value = 1100;

      const startFreq = 180 + (variant * 45);
      boing.frequency.setValueAtTime(startFreq, now + 0.12);
      boing.frequency.exponentialRampToValueAtTime(startFreq * 2.2, now + 0.28);
      boing.frequency.exponentialRampToValueAtTime(startFreq * 1.4, now + 0.45);

      bGain.gain.setValueAtTime(0.14, now + 0.12);
      bGain.gain.exponentialRampToValueAtTime(0.001, now + 0.46);

      boing.connect(bFilter);
      bFilter.connect(bGain);
      bGain.connect(this.ctx.destination);
      boing.start(now + 0.12);
      boing.stop(now + 0.47);
    }

    // Звук для кнопки перегляду попереднього монстрика ("Підглянути / Повернутись")
    playPeekToggle(isPeekingBack) {
      this.init();
      const now = this.ctx.currentTime;
      const freqs = isPeekingBack ? [784, 659, 523] : [523, 659, 784];
      freqs.forEach((f, i) => {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, now + i * 0.045);
        gain.gain.setValueAtTime(0.15, now + i * 0.045);
        gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.045 + 0.14);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now + i * 0.045);
        osc.stop(now + i * 0.045 + 0.15);
      });
    }

      this.init();

      const osc = this.ctx.createOscillator();

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  }

  /* =========================================================================
   * 3. ЛОГІКА ГРИ, ІСТОРІЯ СТАНІВ ТА ПЕРЕГЛЯД ПОПЕРЕДНЬОГО МОНСТРИКА
   * ========================================================================= */
  const CATEGORIES = ['face', 'ears', 'eyes', 'nose', 'mouth'];
  const TOTAL_VARIANTS = 7;

  let historyStack = [];
  let currentHistoryIndex = -1;
  let lastChangedCategory = null;
  let isAnimating = false;
  let isPeekingPrevious = false; // Чи увімкнено зараз перегляд попереднього монстрика

  // DOM-елементи
  const elFace = document.getElementById('part-face');
  const elEars = document.getElementById('part-ears');
  const elEyes = document.getElementById('part-eyes');
  const elNose = document.getElementById('part-nose');
  const elMouth = document.getElementById('part-mouth');
  const elShoulders = document.getElementById('monster-shoulders');
  const elFoamLayer = document.getElementById('foam-overlay-layer');
  const elScrubHands = document.getElementById('scrubbing-hands');
  const elHandLeft = document.getElementById('hand-left');
  const elHandRight = document.getElementById('hand-right');
  const elBurstParticles = document.getElementById('burst-particles');
  const elMirrorGlass = document.getElementById('mirror-glass');
  const elPeekGlow = document.getElementById('peek-mirror-glow');

  const btnPrev = document.getElementById('btn-prev');
  const btnPeek = document.getElementById('btn-peek');
  const btnNext = document.getElementById('btn-next');
  const monsterGroup = document.getElementById('monster-group');

  // Початковий стан монстрика
  const initialState = {
    face: 0,
    ears: 0,
    eyes: 0,
    nose: 0,
    mouth: 0
  };

  // Генерує новий стан, де відносно попереднього змінюється РІВНО ОДНА частина тіла
  function generateNextMonsterState(currentState) {
    const nextState = { ...currentState };

    let availableCategories = CATEGORIES.filter(c => c !== lastChangedCategory);
    if (Math.random() < 0.25 || availableCategories.length === 0) {
      availableCategories = CATEGORIES;
    }
    const chosenCategory = availableCategories[Math.floor(Math.random() * availableCategories.length)];
    lastChangedCategory = chosenCategory;

    const currentVal = currentState[chosenCategory];
    let newVal = Math.floor(Math.random() * (TOTAL_VARIANTS - 1));
    if (newVal >= currentVal) {
      newVal += 1;
    }

    nextState[chosenCategory] = newVal;
    return nextState;
  }

  // Відображення стану монстрика на екрані
  function renderMonsterState(state, isPeekMode = false) {
    elFace.innerHTML = getFaceSVG(state.face);
    elEars.innerHTML = getEarsSVG(state.ears, state.face);
    elEyes.innerHTML = getEyesSVG(state.eyes);
    elNose.innerHTML = getNoseSVG(state.nose);
    elMouth.innerHTML = getMouthSVG(state.mouth);

    elShoulders.setAttribute('fill', `url(#monsterSkin${state.face})`);
    elHandLeft.querySelector('path').setAttribute('fill', `url(#monsterSkin${state.face})`);
    elHandRight.querySelector('path').setAttribute('fill', `url(#monsterSkin${state.face})`);

    // Одразу застосовуємо поточне положення погляду до нових зіниць
    applyGazeToPupils(gazeState.curX, gazeState.curY);

    // Оновлюємо вигляд дзеркала (звичайне або режим підглядання попереднього монстрика)
    if (isPeekMode) {
      elMirrorGlass.setAttribute('fill', 'url(#mirrorMemoryGrad)');
      elPeekGlow.setAttribute('opacity', '1');
      btnPeek.classList.add('peek-active');
    } else {
      elMirrorGlass.setAttribute('fill', 'url(#mirrorGlassGrad)');
      elPeekGlow.setAttribute('opacity', '0');
      btnPeek.classList.remove('peek-active');
    }

    // Оновлюємо доступність кнопок
    btnPrev.disabled = (currentHistoryIndex <= 0);
    btnPeek.disabled = (currentHistoryIndex <= 0);
  }

  // Функція увімкнення/вимкнення перегляду попереднього монстрика
  function setPeekPreviousMode(enable) {
    if (isAnimating || currentHistoryIndex <= 0) return;
    isPeekingPrevious = enable;
    sfx.playPeekToggle(enable);

    if (isPeekingPrevious) {
      // Показуємо попереднього монстрика
      renderMonsterState(historyStack[currentHistoryIndex - 1], true);
    } else {
      // Повертаємо поточного монстрика
      renderMonsterState(historyStack[currentHistoryIndex], false);
    }
  }

  /* =========================================================================
   * 4. АНІМАЦІЯ НАМИЛЮВАННЯ ОБЛИЧЧЯ ПІНОЮ ТА ВІДКРИТТЯ НОВОГО ОБРАЗУ
   * ========================================================================= */
  function createFoamCloud() {
    elFoamLayer.innerHTML = '';
    const foamPositions = [];

    for (let r = 0; r <= 280; r += 55) {
      const count = r === 0 ? 1 : Math.floor((2 * Math.PI * r) / 65);
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + (r * 0.15);
        foamPositions.push({
          x: Math.cos(angle) * r + (Math.random() * 24 - 12),
          y: Math.sin(angle) * (r * 0.92) - 15 + (Math.random() * 24 - 12),
          rad: 68 + Math.random() * 38,
          delay: Math.random() * 420
        });
      }
    }

    for (let i = 0; i < 18; i++) {
      foamPositions.push({
        x: (Math.random() - 0.5) * 620,
        y: (Math.random() - 0.5) * 520 - 30,
        rad: 55 + Math.random() * 40,
        delay: Math.random() * 500
      });
    }

    return foamPositions.map(pos => {
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      g.setAttribute('transform', `translate(${pos.x}, ${pos.y}) scale(0)`);

      const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      circle.setAttribute('r', pos.rad);
      circle.setAttribute('fill', 'url(#foamPuffGrad)');

      const shine = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      shine.setAttribute('cx', -pos.rad * 0.28);
      shine.setAttribute('cy', -pos.rad * 0.28);
      shine.setAttribute('r', pos.rad * 0.22);
      shine.setAttribute('fill', '#ffffff');
      shine.setAttribute('opacity', '0.85');

      g.appendChild(circle);
      g.appendChild(shine);
      elFoamLayer.appendChild(g);

      return { el: g, x: pos.x, y: pos.y, delay: pos.delay };
    });
  }

  function triggerRevealParticles() {
    elBurstParticles.innerHTML = '';
    const count = 22;

    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2 + Math.random() * 0.3;
      const dist = 260 + Math.random() * 190;
      const tx = Math.cos(angle) * dist;
      const ty = Math.sin(angle) * dist;
      const size = 14 + Math.random() * 24;

      const bubble = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      bubble.setAttribute('cx', 0);
      bubble.setAttribute('cy', 0);
      bubble.setAttribute('r', size);
      bubble.setAttribute('fill', 'url(#soapBubbleGrad)');
      elBurstParticles.appendChild(bubble);

      const startTime = performance.now();
      const duration = 650 + Math.random() * 350;

      function animParticle(now) {
        const p = Math.min(1, (now - startTime) / duration);
        const ease = 1 - Math.pow(1 - p, 3);
        bubble.setAttribute('transform', `translate(${tx * ease}, ${ty * ease}) scale(${1 - p * 0.5})`);
        bubble.setAttribute('opacity', String(1 - p));
        if (p < 1) {
          requestAnimationFrame(animParticle);
        } else {
          bubble.remove();
        }
      }
      requestAnimationFrame(animParticle);
    }
  }

  // Повний цикл гри при кліку на монстрика
  function washAndTransformMonster() {
    if (isAnimating) return;

    // Якщо був увімкнений режим перегляду попереднього монстрика — спочатку повертаємо поточного
    if (isPeekingPrevious) {
      setPeekPreviousMode(false);
      return;
    }

    isAnimating = true;
    sfx.playScrubAndLather();

    const foamPuffs = createFoamCloud();
    elScrubHands.setAttribute('opacity', '1');

    const startTime = performance.now();
    const latherDuration = 1250;
    const holdDuration = 280;
    const rinseDuration = 520;
    let swapped = false;

    function step(now) {
      const elapsed = now - startTime;

      if (elapsed < latherDuration) {
        const t = elapsed / 1000;
        const lx = -140 + Math.sin(t * 19) * 110;
        const ly = 20 + Math.cos(t * 15) * 95;
        const rx = 140 + Math.cos(t * 18) * 110;
        const ry = 10 + Math.sin(t * 16) * 95;

        elHandLeft.setAttribute('transform', `translate(${lx}, ${ly}) rotate(${Math.sin(t * 14) * 18})`);
        elHandRight.setAttribute('transform', `translate(${rx}, ${ry}) rotate(${Math.cos(t * 14) * 18})`);

        foamPuffs.forEach(puff => {
          const localP = Math.max(0, Math.min(1, (elapsed - puff.delay) / 450));
          const scale = localP < 1 ? localP * 1.15 : 1.15 + Math.sin(elapsed * 0.02 + puff.x) * 0.06;
          puff.el.setAttribute('transform', `translate(${puff.x}, ${puff.y}) scale(${scale})`);
        });

        requestAnimationFrame(step);
      } else if (elapsed < latherDuration + holdDuration) {
        elScrubHands.setAttribute('opacity', '0');

        if (!swapped) {
          swapped = true;
          const currentState = historyStack[currentHistoryIndex];
          const nextState = generateNextMonsterState(currentState);

          historyStack = historyStack.slice(0, currentHistoryIndex + 1);
          historyStack.push(nextState);
          currentHistoryIndex++;

          renderMonsterState(nextState, false);
        }

        foamPuffs.forEach(puff => {
          const wobble = 1.15 + Math.sin(elapsed * 0.025 + puff.y) * 0.07;
          puff.el.setAttribute('transform', `translate(${puff.x}, ${puff.y}) scale(${wobble})`);
        });

        requestAnimationFrame(step);
      } else if (elapsed < latherDuration + holdDuration + rinseDuration) {
        const rinseElapsed = elapsed - (latherDuration + holdDuration);
        const p = Math.min(1, rinseElapsed / rinseDuration);

        foamPuffs.forEach(puff => {
          const s = Math.max(0, 1.15 * (1 - Math.pow(p, 1.6)));
          puff.el.setAttribute('transform', `translate(${puff.x * (1 + p * 0.25)}, ${puff.y * (1 + p * 0.25)}) scale(${s})`);
        });

        requestAnimationFrame(step);
      } else {
        elFoamLayer.innerHTML = '';
        triggerRevealParticles();
        sfx.playMonsterReveal(currentHistoryIndex % 5);
        bounceMonsterAndDuck();
        isAnimating = false;
      }
    }

    requestAnimationFrame(step);
  }

  function bounceMonsterAndDuck() {
    const startTime = performance.now();
    const duckBody = document.getElementById('duck-anim-body');

    function animBounce(now) {
      const p = Math.min(1, (now - startTime) / 550);
      const jump = Math.sin(p * Math.PI * 2) * (1 - p) * 28;
      const scaleX = 1 + Math.sin(p * Math.PI * 3) * (1 - p) * 0.08;
      const scaleY = 1 - Math.sin(p * Math.PI * 3) * (1 - p) * 0.08;

      monsterGroup.setAttribute('transform', `translate(0, ${-Math.abs(jump)}) scale(${scaleX}, ${scaleY})`);
      duckBody.setAttribute('transform', `translate(0, ${-Math.abs(jump * 1.1)}) rotate(${Math.sin(p * Math.PI * 4) * 10})`);

      if (p < 1) {
        requestAnimationFrame(animBounce);
      } else {
        monsterGroup.setAttribute('transform', '');
        duckBody.setAttribute('transform', '');
      }
    }
    requestAnimationFrame(animBounce);
  }

  /* =========================================================================
   * 5. СИСТЕМА ПЛАВНОГО ПЕРЕВЕДЕННЯ ПОГЛЯДУ (БЕЗ КЛІПАННЯ)
   * ========================================================================= */
  const gazeState = {
    curX: 0,
    curY: 0,
    targetX: 0,
    targetY: 0,
    lastPointerTime: 0,
    nextAutoGazeTime: 0
  };

  // Точки інтересу у ванній кімнаті, куди монстрик сам переводить погляд, коли мишка не рухається
  const gazeTargets = [
    { x: -14, y: -4 },  // Дивиться вліво на пляшечки з шампунем
    { x: 14, y: -2 },   // Дивиться вправо на смугастий рушник
    { x: 11, y: 11 },   // Дивиться вниз-вправо на качечку
    { x: -11, y: 10 },  // Дивиться вниз-вліво на латунний кран
    { x: 0, y: -12 },   // Роздивляється лампочки вгорі дзеркала
    { x: 0, y: 0 },     // Дивиться прямо на дитину
    { x: -12, y: -9 },  // Дивиться вгору-вліво на мильні бульбашки
    { x: 12, y: -9 }    // Дивиться вгору-вправо
  ];

  function applyGazeToPupils(dx, dy) {
    document.querySelectorAll('.pupil').forEach(pupil => {
      pupil.setAttribute('transform', `translate(${dx.toFixed(2)}, ${dy.toFixed(2)})`);
    });
    const duckPupil = document.getElementById('duck-pupil');
    if (duckPupil) {
      duckPupil.setAttribute('transform', `translate(${(dx * 0.25).toFixed(2)}, ${(dy * 0.25).toFixed(2)})`);
    }
  }

  // Стеження за курсором мишки або дотиком
  window.addEventListener('pointermove', (e) => {
    const rect = document.getElementById('main-svg').getBoundingClientRect();
    const nx = Math.max(-1, Math.min(1, ((e.clientX - rect.left) / rect.width - 0.5) * 2.2));
    const ny = Math.max(-1, Math.min(1, ((e.clientY - rect.top) / rect.height - 0.48) * 2.2));

    gazeState.targetX = nx * 15;
    gazeState.targetY = ny * 12;
    gazeState.lastPointerTime = performance.now();
  });

  // Головний цикл життя сцени: плавне переведення погляду та дихання монстрика
  const breathGroup = document.getElementById('monster-breath-group');
  function ambientLifeLoop(now) {
    // Якщо курсор не рухався понад 1.8 секунди — монстрик самостійно переводить погляд
    if (now - gazeState.lastPointerTime > 1800 && now > gazeState.nextAutoGazeTime) {
      const pick = gazeTargets[Math.floor(Math.random() * gazeTargets.length)];
      gazeState.targetX = pick.x + (Math.random() * 4 - 2);
      gazeState.targetY = pick.y + (Math.random() * 4 - 2);
      gazeState.nextAutoGazeTime = now + 1300 + Math.random() * 1400;
    }

    // Плавна інтерполяція руху зіниць (очі ковзають від точки до точки)
    gazeState.curX += (gazeState.targetX - gazeState.curX) * 0.09;
    gazeState.curY += (gazeState.targetY - gazeState.curY) * 0.09;
    applyGazeToPupils(gazeState.curX, gazeState.curY);

    // Плавне дихання монстрика та рух вушок
    const t = now * 0.0022;
    const breathY = Math.sin(t) * 6;
    const breathScale = 1 + Math.sin(t) * 0.015;
    const earWiggle = Math.sin(t * 1.3) * 1.8;

    breathGroup.setAttribute('transform', `translate(0, ${breathY}) scale(${breathScale}, ${1 / breathScale})`);
    elEars.setAttribute('transform', `rotate(${earWiggle})`);

    requestAnimationFrame(ambientLifeLoop);
  }
  requestAnimationFrame(ambientLifeLoop);

  // Фонові мильні бульбашки у ванній кімнаті
  const ambientBubblesGroup = document.getElementById('ambient-bubbles');
  const bgBubbles = [];
  for (let i = 0; i < 14; i++) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    const r = 12 + Math.random() * 26;
    c.setAttribute('r', r);
    c.setAttribute('fill', 'url(#soapBubbleGrad)');
    c.setAttribute('opacity', '0.65');
    ambientBubblesGroup.appendChild(c);
    bgBubbles.push({
      el: c,
      x: 120 + Math.random() * 1360,
      y: Math.random() * 900,
      speed: 0.4 + Math.random() * 0.8,
      wobbleSpeed: 0.01 + Math.random() * 0.02,
      phase: Math.random() * Math.PI * 2
    });
  }

  function animateAmbientBubbles() {
    bgBubbles.forEach(b => {
      b.y -= b.speed;
      b.phase += b.wobbleSpeed;
      if (b.y < -50) b.y = 940;
      const curX = b.x + Math.sin(b.phase) * 22;
      b.el.setAttribute('cx', curX);
      b.el.setAttribute('cy', b.y);
    });
    requestAnimationFrame(animateAmbientBubbles);
  }
  requestAnimationFrame(animateAmbientBubbles);

  /* =========================================================================
   * 6. ОБРОБНИКИ ПОДІЙ (Клік на монстрика, Качечку, Кран, Кнопки)
   * ========================================================================= */
  monsterGroup.addEventListener('click', () => {
    washAndTransformMonster();
  });

  document.getElementById('duck-companion').addEventListener('click', () => {
    sfx.playDuckSqueak();
    bounceMonsterAndDuck();
  });

  document.getElementById('faucet-group').addEventListener('click', () => {
    sfx.playBubblePop(520);
    const valve = document.getElementById('faucet-valve');
    valve.setAttribute('transform', 'translate(0, -18) scale(-1, 1)');
    setTimeout(() => valve.setAttribute('transform', 'translate(0, -18) scale(1, 1)'), 250);
  });

  // КНОПКА "ПОДИВИТИСЬ ПОПЕРЕДНЬОГО" (працює і по кліку-перемиканню, і при утриманні)
  let peekPressTime = 0;
  btnPeek.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (isAnimating || currentHistoryIndex <= 0) return;
    peekPressTime = performance.now();
    // Якщо ще не в режимі підглядання — одразу показуємо попереднього монстрика
    if (!isPeekingPrevious) {
      setPeekPreviousMode(true);
    } else {
      // Якщо вже дивились на попереднього — клік повертає поточного монстрика
      setPeekPreviousMode(false);
      peekPressTime = 0;
    }
  });

  window.addEventListener('pointerup', () => {
    // Якщо кнопку тримали затиснутою довше ніж 350 мс — при відпусканні автоматично повертаємо поточного
    if (peekPressTime > 0 && isPeekingPrevious && (performance.now() - peekPressTime > 350)) {
      setPeekPreviousMode(false);
    }
    peekPressTime = 0;
  });

  // Кнопка "НАЗАД" (перехід на попередній крок історії)
  btnPrev.addEventListener('click', () => {
    if (isAnimating || currentHistoryIndex <= 0) return;
    isPeekingPrevious = false;
    currentHistoryIndex--;
    sfx.playBubblePop(350);
    renderMonsterState(historyStack[currentHistoryIndex], false);
    triggerRevealParticles();
    bounceMonsterAndDuck();
  });

  // Кнопка "ДАЛІ" (миттєвий перехід до наступного образу без очікування намилювання)
  btnNext.addEventListener('click', () => {
    if (isAnimating) return;
    isPeekingPrevious = false;

    if (currentHistoryIndex < historyStack.length - 1) {
      currentHistoryIndex++;
      renderMonsterState(historyStack[currentHistoryIndex], false);
    } else {
      const currentState = historyStack[currentHistoryIndex];
      const nextState = generateNextMonsterState(currentState);
      historyStack.push(nextState);
      currentHistoryIndex++;
      renderMonsterState(nextState, false);
    }

    sfx.playMonsterReveal(currentHistoryIndex % 5);
    triggerRevealParticles();
    bounceMonsterAndDuck();
  });

  // Старт гри
  historyStack.push(initialState);
  currentHistoryIndex = 0;
  renderMonsterState(initialState, false);
</script>
</body>
</html>
