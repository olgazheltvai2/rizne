    ctx.restore();
  }

  // ===================== 6 UNEXPECTED COMEDIC FINALES =====================
  function drawFinaleScene() {
    const t = stateTime;
    if (currentFinale === 0) {
      // FINALE 0: GIANT WIND HURRICANE + BEACH BALL BONK!
      const wp = clamp(t * 2, 0, 1);
      drawWindFan(wp);
      // Studio lamp post on right that actor clings to horizontally like a flag!
      const px = 980;
      ctx.strokeStyle = '#3b4657'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(px, 748); ctx.lineTo(px, 410); ctx.stroke();
      ctx.fillStyle = '#ffe66d';
      ctx.beginPath(); ctx.arc(px, 398, 20, 0, Math.PI * 2); ctx.fill();

      const flagFlap = Math.sin(t * 18) * 0.14;
      drawActor(px - 22, 600, currentOutfit, {
        bodyRot: Math.PI * 0.44 + flagFlap,
        windTilt: 1,
        expr: t > 1.7 ? 'happy' : 'surprised',
        noShadow: true
      });

      // Giant glossy beach ball flies in & bonks the screen!
      if (t > 1.1) {
        const bt = t - 1.1;
        const bx = lerp(-120, 1740, clamp(bt / 1.5, 0, 1));
        const by = 460 - Math.abs(Math.sin(bt * 4.5)) * 280;
        const bSc = 1 + Math.exp(-Math.pow((bt - 0.48) * 5, 2)) * 2.1; // zooms right into camera lens at t=1.58!
        if (Math.abs(bt - 0.48) < 0.05) camShake = 18;
        drawBeachBall(bx, by, 72 * bSc, bt * 7);
      }
    } else if (currentFinale === 1) {
      // FINALE 1: HIDDEN TRAPDOOR + MEGA-SPRING TRAMPOLINE!
      let ay = 735, rot = 0, expr = 'surprised';
      if (t < 0.65) {
        // Drops down into trapdoor!
        const p = clamp((t - 0.1) / 0.5, 0, 1);
        ay = lerp(735, 920, p * p);
      } else if (t < 2.2) {
        // BOINGS sky-high doing a hilarious mid-air joyful flip!
        const p = (t - 0.65) / 1.55;
        ay = 735 - Math.sin(p * Math.PI) * 540;
        rot = p * Math.PI * 2;
        expr = 'hero';
        // Draw mega chrome spring popping out of trapdoor
        if (p < 0.35) {
          ctx.strokeStyle = '#d9e2ec'; ctx.lineWidth = 8;
          ctx.beginPath();
          for (let i = 0; i < 6; i++) {
            const sy = 740 - i * 28 * (1 - p * 2.4);
            ctx.lineTo(760 + (i % 2 ? 32 : -32), sy);
          }
          ctx.stroke();
        }
      } else {
        // Hero landing + victory bounce!
        expr = 'happy';
        ay = 735 - Math.abs(Math.sin((t - 2.2) * 5)) * 28;
      }
      // Clip actor inside pit while falling
      ctx.save();
      if (t < 0.68) {
        ctx.beginPath(); ctx.rect(0, 0, VW, 745); ctx.clip();
      }
      drawActor(760, ay, currentOutfit, { bodyRot: rot, expr, dance: t > 2.2 ? t - 2.2 : 0 });
      ctx.restore();
    } else if (currentFinale === 2) {
      // FINALE 2: BUSTER KEATON FALLING STUDIO WALL GAG!
      const expr = t < 0.95 ? 'surprised' : t < 1.5 ? 'neutral' : 'happy';
      drawActor(760, 735, currentOutfit, { expr, dance: t > 1.65 ? t - 1.65 : 0 });

      // Giant painted facade tipping forward right onto the actor — with an arched cutout window!
      const fallP = clamp((t - 0.15) / 0.8, 0, 1);
      const easeFall = fallP * fallP * fallP;
      if (t > 0.93 && t < 1.02) {
        camShake = 22;
        spawnPuff(620, 750, 14);
        spawnPuff(900, 750, 14);
      }
      ctx.save();
      ctx.translate(760, 765);
      // Perspective foreshortening as wall tips flat onto stage floor around actor!
      const wallScaleY = lerp(1, 0.24, easeFall);
      ctx.scale(1 + easeFall * 0.14, wallScaleY);
      // Draw wooden house facade with hole cut out using evenodd rule!
      ctx.beginPath();
      ctx.rect(-290, -480, 580, 480);
      // Cutout window right around actor!
      ctx.moveTo(-105, -24);
      ctx.lineTo(-105, -315);
      ctx.arc(0, -315, 105, Math.PI, 0, false);
      ctx.lineTo(105, -24);
      ctx.closePath();
      const wg = ctx.createLinearGradient(0, -480, 0, 0);
      wg.addColorStop(0, '#d97b54'); wg.addColorStop(1, '#9e4b2b');
      ctx.fillStyle = wg;
      ctx.fill('evenodd');
      ctx.strokeStyle = '#5c2a16'; ctx.lineWidth = 8;
      ctx.strokeRect(-290, -480, 580, 480);
      // Decorative shutters around cutout
      ctx.fillStyle = '#2a9d8f';
      ctx.fillRect(-155, -320, 44, 240);
      ctx.fillRect(111, -320, 44, 240);
      ctx.restore();
    } else if (currentFinale === 3) {
      // FINALE 3: GIANT IRIDESCENT SOAP BUBBLE LEVITATION + POP!
      // Brass Bubble Cannon on left
      ctx.save();
      ctx.translate(290, 680);
      ctx.fillStyle = '#2d3748'; rr(ctx, -40, 20, 80, 35, 8); ctx.fill();
      ctx.rotate(-0.35);
      const cg = ctx.createLinearGradient(0, -28, 0, 28);
      cg.addColorStop(0, '#ffd166'); cg.addColorStop(0.5, '#d49a35'); cg.addColorStop(1, '#7a5214');
      ctx.fillStyle = cg; rr(ctx, -20, -28, 110, 56, 12); ctx.fill();
      ctx.restore();

      const popped = t >= 2.45;
      let ax = 760, ay = 735, rot = 0;
      if (!popped) {
        const lift = clamp((t - 0.25) / 1.0, 0, 1);
        ax = 760 + Math.sin(t * 2.1) * 140 * lift;
        ay = 735 - easeInOut(lift) * 280 + Math.sin(t * 3.8) * 24;
        rot = Math.sin(t * 2.7) * 0.24;
      } else {
        const dt = t - 2.45;
        if (dt < 0.06) {
          spawnConfetti(ax, 460, 40, 420);
          spawnSparkles(ax, 460, 20);
        }
        const land = clamp(dt / 0.45, 0, 1);
        ay = lerp(460, 735, easeOutBack(land));
      }

      drawActor(ax, ay, currentOutfit, {
        bodyRot: rot,
        expr: popped ? 'happy' : 'surprised',
        dance: popped ? t - 2.5 : 0,
        noShadow: !popped
      });

      // Giant wobbling iridescent bubble around actor
      if (!popped && t > 0.15) {
        const bR = clamp((t - 0.15) * 3.5, 0, 1) * 205;
        const wobX = 1 + Math.sin(t * 7) * 0.04;
        const wobY = 1 + Math.cos(t * 7) * 0.04;
        ctx.save();
        ctx.translate(ax, ay - 140);
        ctx.scale(wobX, wobY);
        const bg = ctx.createRadialGradient(-55, -65, 18, 0, 0, bR);
        bg.addColorStop(0, 'rgba(255,255,255,0.45)');
        bg.addColorStop(0.55, 'rgba(130,235,255,0.16)');
        bg.addColorStop(0.82, 'rgba(255,140,230,0.34)');
        bg.addColorStop(1, 'rgba(100,255,210,0.58)');
        ctx.fillStyle = bg;
        ctx.beginPath(); ctx.arc(0, 0, bR, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.75)'; ctx.lineWidth = 3; ctx.stroke();
        // Gloss arc
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.beginPath(); ctx.ellipse(-bR * 0.42, -bR * 0.42, bR * 0.2, bR * 0.09, -0.7, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    } else if (currentFinale === 4) {
      // FINALE 4: DISCO MIRROR-BALL SHORT CIRCUIT + FUNKY DANCE!
      const dropY = lerp(-120, 145, easeOutBack(clamp(t / 0.7, 0, 1)));
      // Cable
      ctx.strokeStyle = '#9aa8ba'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(760, 0); ctx.lineTo(760, dropY); ctx.stroke();
      // Faceted Mirror Ball
      ctx.save();
      ctx.translate(760, dropY);
      const mg = ctx.createRadialGradient(-24, -24, 10, 0, 0, 74);
      mg.addColorStop(0, '#ffffff'); mg.addColorStop(0.6, '#b8c7d9'); mg.addColorStop(1, '#4a5568');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.arc(0, 0, 72, 0, Math.PI * 2); ctx.fill();
      // Glittering spinning facets
      ctx.save();
      ctx.beginPath(); ctx.arc(0, 0, 72, 0, Math.PI * 2); ctx.clip();
      const shift = (time * 60) % 20;
      for (let fy = -70; fy <= 70; fy += 18) {
        for (let fx = -90; fx <= 90; fx += 20) {
          const lit = Math.sin(fx * 0.2 + fy * 0.3 + time * 9) > 0.35;
          ctx.fillStyle = lit ? `hsl(${(fx * 4 + time * 200) % 360}, 95%, 80%)` : 'rgba(255,255,255,0.22)';
          ctx.fillRect(fx + shift - 10, fy, 15, 14);
        }
      }
      ctx.restore();
      ctx.restore();

      // Actor doing full multi-limb funky victory dance!
      const slideX = 760 + Math.sin(t * 3.8) * 95;
      drawActor(slideX, 735, currentOutfit, { expr: 'happy', dance: t + 0.2 });
    } else {
      // FINALE 5: RUNAWAY CAMERA DOLLY SURF!
      const surfX = 760 + Math.sin(t * 2.8) * 380;
      dollyX = surfX;
      // Exhaust bubbles & stars trailing dolly
      if (Math.random() < 0.55) {
        particles.push({
          type: 'puff', x: surfX - Math.cos(t * 2.8) * 90, y: 785,
          vx: -Math.cos(t * 2.8) * 140, vy: -40 - Math.random() * 60,
          sz: 12 + Math.random() * 14, col: `hsla(${(time * 220) % 360}, 90%, 72%, 0.75)`,
          life: 0, maxLife: 0.7, grav: -40
        });
      }
      // Actor surfing right on top of the zooming dolly platform!
      drawActor(surfX + 18, 762, currentOutfit, {
        bodyRot: Math.cos(t * 2.8) * 0.14,
        expr: 'hero',
        dance: t * 0.8,
        noShadow: true
      });
    }
  }

  function drawBeachBall(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y); ctx.rotate(rot);
    const cols = ['#ff595e', '#fff8e7', '#1982c4', '#fff8e7', '#ffca3a', '#fff8e7'];
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = cols[i];
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, i * Math.PI / 3, (i + 1) * Math.PI / 3);
      ctx.closePath(); ctx.fill();
    }
    // Glossy 3D sphere shading
    const sg = ctx.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
    sg.addColorStop(0, 'rgba(255,255,255,0.58)');
    sg.addColorStop(0.5, 'rgba(255,255,255,0)');
    sg.addColorStop(1, 'rgba(0,0,0,0.28)');
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(0, 0, r * 0.18, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  // ===================== PARTICLES & FLYING ITEMS =====================
  function updateAndDrawParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life += dt;
      if (p.life >= p.maxLife) { particles.splice(i, 1); continue; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += p.grav * dt;
      p.rot = (p.rot || 0) + (p.vrot || 0) * dt;
      const a = 1 - p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = clamp(a * 1.4, 0, 1);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot || 0);
      ctx.fillStyle = p.col;
      if (p.type === 'rect') {
        ctx.fillRect(-p.sz * 0.5, -p.sz * 0.3, p.sz, p.sz * 0.6);
      } else if (p.type === 'star') {
        drawStarPath(ctx, 0, 0, 5, p.sz, p.sz * 0.45); ctx.fill();
      } else if (p.type === 'puff') {
        ctx.beginPath(); ctx.arc(0, 0, p.sz * (0.7 + (1 - a) * 0.7), 0, Math.PI * 2); ctx.fill();
      } else if (p.type === 'leaf') {
        ctx.beginPath(); ctx.ellipse(0, 0, p.sz, p.sz * 0.45, 0, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function updateAndDrawFlyingItems(dt) {
    for (let i = flyingItems.length - 1; i >= 0; i--) {
      const f = flyingItems[i];
      f.t += dt;
      if (f.t < 0) continue;
      const p = clamp(f.t / f.dur, 0, 1);
      const x = lerp(f.sx, f.ex, p);
      const arc = Math.sin(p * Math.PI) * (f.mode === 'equip' ? -130 : -75);
      const y = lerp(f.sy, f.ey, p) + arc;
      const rot = f.rot + f.spin * p;

      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rot);
      const sc = f.mode === 'equip' ? lerp(0.85, 1.05, p) : 1;
      ctx.scale(sc, sc);
      drawItem(f.cat, f.id, 'icon');
      ctx.restore();

      if (p >= 1) {
        if (f.mode === 'equip') {
          currentOutfit[f.cat] = f.id;
          actorReactT = 1;
          actorExpr = 'happy';
          spawnSparkles(f.ex, f.ey, 10);
        }
        flyingItems.splice(i, 1);
      }
    }
  }

  // ===================== MAIN UPDATE LOOP =====================
  let lastTS = performance.now();
  function tick(ts) {
    const dt = Math.min(0.05, (ts - lastTS) / 1000);
    lastTS = ts;
    time += dt;
    stateTime += dt;

    // Ambient clouds & dust motes
    clouds.forEach(cl => {
      cl.x += (cl.spd + windPower * 180) * dt;
      if (cl.x > VW + 220) cl.x = -220;
    });
    dustMotes.forEach(m => {
      m.x += (m.vx + windPower * 400) * dt;
      m.y += m.vy * dt;
      if (m.y < 80) m.y = 780;
      if (m.x > VW + 40) m.x = -40;
      if (m.x < -40) m.x = VW + 40;
    });

    // Natural eye blinking
    blinkTimer -= dt;
    if (blinkTimer <= 0) {
      isBlinking = !isBlinking;
      blinkTimer = isBlinking ? 0.14 : 2.1 + Math.random() * 2.8;
    }
    if (actorReactT > 0) actorReactT = Math.max(0, actorReactT - dt * 3.2);
    if (introClapAnim > 0) introClapAnim = Math.max(0, introClapAnim - dt * 2.5);
    if (actionClapAnim > 0) actionClapAnim = Math.max(0, actionClapAnim - dt * 2.5);
    if (wipeAnim > 0) wipeAnim = Math.max(0, wipeAnim - dt * 3.0);
    if (camShake > 0) camShake = Math.max(0, camShake - dt * 45);

    // State Machine
    if (state === 'ENTER') {
      const p = clamp(stateTime / 1.05, 0, 1);
      actorX = lerp(-120, 760, easeInOut(p));
      if (Math.floor(stateTime * 5) !== Math.floor((stateTime - dt) * 5)) sfx.step();
      if (p >= 1) {
        state = 'OBSERVE';
        stateTime = 0;
        actorExpr = 'happy';
        spawnSparkles(actorX, 550, 14);
      }
    } else if (state === 'OBSERVE') {
      const rem = observeDur - stateTime;
      const sec = Math.ceil(rem);
      if (sec !== lastTickSec && sec <= 3 && sec > 0) {
        lastTickSec = sec;
        sfx.tick(true);
      }
      if (stateTime >= observeDur) {
        triggerWindBlow();
      }
    } else if (state === 'WIND') {
      windPower = Math.sin(clamp(stateTime / 1.55, 0, 1) * Math.PI);
      if (stateTime > 0.75) {
        actorX = lerp(actorX, 480, dt * 4.5);
        trunkX = lerp(trunkX, 892, dt * 5.2);
      }
      if (stateTime >= 1.55) {
        windPower = 0;
        actorX = 480;
        trunkX = 892;
        actorExpr = 'surprised';
        state = 'DRESS';
        stateTime = 0;
      }
    } else if (state === 'DRESS') {
      actorX = lerp(actorX, 480, dt * 6);
      trunkX = lerp(trunkX, 892, dt * 7);
      if (stateTime > 1.2 && actorExpr === 'surprised') actorExpr = 'neutral';
    } else if (state === 'CHECK') {
      if (stateTime >= 0.45) {
        const wrong = activeCats.filter(cat => currentOutfit[cat] !== targetOutfit[cat]);
        if (wrong.length === 0) {
          // ALL CORRECT! Launch unexpected comedic finale!
          currentFinale = nextFinaleId();
          state = 'FINALE';
          stateTime = 0;
          actorExpr = 'hero';
          sfx.finaleSound(currentFinale);
          spawnConfetti(760, 420, 55, 580);
        } else {
          // Lock the correct ones so kids feel rewarded, bounce off only the wrong ones!
          activeCats.forEach(cat => {
            if (currentOutfit[cat] === targetOutfit[cat]) {
              lockedCats[cat] = true;
            }
          });
          wrong.forEach((cat, idx) => {
            const anc = slotAnchor(cat, actorX, actorY);
            spawnPuff(anc.x, anc.y, 10);
            flyingItems.push({
              cat, id: currentOutfit[cat],
              sx: anc.x, sy: anc.y,
              ex: trunkX + 180, ey: 220 + idx * 110,
              t: 0, dur: 0.65, rot: 0, spin: (idx % 2 ? 1 : -1) * 11, mode: 'reject'
            });
            delete currentOutfit[cat];
          });
          sfx.mistake();
          camShake = 11;
          actorExpr = 'dizzy';
          state = 'MISTAKE';
          stateTime = 0;
        }
      }
    } else if (state === 'MISTAKE') {
      if (stateTime >= 1.05) {
        actorExpr = 'neutral';
        state = 'DRESS';
        stateTime = 0;
      }
    } else if (state === 'FINALE') {
      trunkX = lerp(trunkX, 1690, dt * 5.5);
      actorX = lerp(actorX, 760, dt * 4.5);
      if (stateTime > 1.6 && Math.random() < 0.08) {
        spawnConfetti(320 + Math.random() * 960, 140 + Math.random() * 200, 10, 260);
      }
    }

    render();
    requestAnimationFrame(tick);
  }

  // ===================== MAIN RENDER =====================
  function render() {
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.translate(offX, offY);
    ctx.scale(scale, scale);

    if (camShake > 0.2) {
      ctx.translate((Math.random() - 0.5) * camShake, (Math.random() - 0.5) * camShake);
    }

    drawBackground();

    // Floating sunlit dust motes
    ctx.fillStyle = 'rgba(255,248,215,0.34)';
    dustMotes.forEach(m => {
      ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    });

    // Camera Dolly (except drawn after actor in Finale 5 so surf looks cohesive)
    const obsProg = (state === 'OBSERVE') ? clamp(1 - stateTime / observeDur, 0, 1) : -1;
    if (!(state === 'FINALE' && currentFinale === 5)) {
      drawCameraDolly(dollyX, 760, obsProg);
    }

    // Scene Actor / Finale Choreography
    if (state === 'INTRO') {
      // Friendly preview actor waving behind live clapperboard
      drawActor(760, 735, { hat: 'cap', glasses: 'star', jacket: 'varsity', prop: 'megaphone', boots: 'rollers' }, { expr: 'happy', dance: time * 0.25 });
      // Subtle translucent vignette behind big intro clapperboard
      ctx.fillStyle = 'rgba(12,20,34,0.35)';
      ctx.fillRect(-400, -200, VW + 800, VH + 400);
      drawClapperButton(800, 455, 250, 185, true, introClapAnim, true);
    } else if (state === 'FINALE') {
      if (currentFinale === 5) drawCameraDolly(dollyX, 760, -1);
      drawFinaleScene();
    } else {
      const walkPhase = (state === 'ENTER') ? stateTime * 10 : 0;
      drawActor(actorX, actorY, currentOutfit, {
        walk: walkPhase,
        windTilt: windPower,
        expr: actorExpr
      });
    }

    // Wind fan during blow transition
    if (state === 'WIND') drawWindFan(windPower);

    // Backstage Wardrobe Trunk
    drawWardrobeTrunk();

    // Flying animated items (blowing off / flying onto actor / rejecting)
    updateAndDrawFlyingItems(0.016);

    // Action Clapperboard Button during DRESS
    if (state === 'DRESS' || state === 'CHECK') {
      const allFilled = activeCats.every(c => !!currentOutfit[c]);
      drawClapperButton(BTN_ACTION.x, BTN_ACTION.y, BTN_ACTION.w, BTN_ACTION.h, allFilled, actionClapAnim, false);
    }

    // Prominent celebratory Next Arrow button during Finale (after 2.6s)
    if (state === 'FINALE' && stateTime > 2.6) {
      const hov = hitCircle(pointer.x, pointer.y, BTN_FINALE_NEXT.x, BTN_FINALE_NEXT.y, BTN_FINALE_NEXT.r);
      const pulse = 1 + Math.sin(time * 6) * 0.06;
      ctx.save();
      ctx.translate(BTN_FINALE_NEXT.x, BTN_FINALE_NEXT.y);
      ctx.scale((hov ? 1.12 : 1) * pulse, (hov ? 1.12 : 1) * pulse);
      const g = ctx.createRadialGradient(-12, -12, 8, 0, 0, BTN_FINALE_NEXT.r);
      g.addColorStop(0, '#38d9a9'); g.addColorStop(1, '#0e7a5d');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(0, 0, BTN_FINALE_NEXT.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffe66d'; ctx.lineWidth = 5; ctx.stroke();
      ctx.fillStyle = '#fffdf0';
      ctx.beginPath();
      ctx.moveTo(-14, -22); ctx.lineTo(22, 0); ctx.lineTo(-14, 22); ctx.closePath(); ctx.fill();
      ctx.restore();
    }

    // Particles (confetti, puffs, sparkles, wind leaves)
    updateAndDrawParticles(0.016);

    // Minimal Corner Controls (Always available Next + Sound toggle)
    drawMinimalHUD();

    // Crisp cinema shutter wipe on quick-next
    if (wipeAnim > 0.01) {
      ctx.fillStyle = `rgba(14,22,36,${wipeAnim * 0.85})`;
      ctx.fillRect(-400, -200, VW + 800, VH + 400);
    }

    ctx.restore();
  }

  // ===================== INPUT HANDLING =====================
  function updateCursor() {
    let hot = false;
    if (hitCircle(pointer.x, pointer.y, BTN_NEXT.x, BTN_NEXT.y, BTN_NEXT.r) ||
        hitCircle(pointer.x, pointer.y, BTN_MUTE.x, BTN_MUTE.y, BTN_MUTE.r)) hot = true;
    if (state === 'INTRO') hot = true;
    if (state === 'OBSERVE' && hitCircle(pointer.x, pointer.y, BTN_SKIP_OBS.x, BTN_SKIP_OBS.y, BTN_SKIP_OBS.r)) hot = true;
    if (state === 'DRESS') {
      if (shelfHitBoxes.some(b => !lockedCats[b.cat] && hitRect(pointer.x, pointer.y, b.x, b.y, b.w, b.h))) hot = true;
      const allFilled = activeCats.every(c => !!currentOutfit[c]);
      if (allFilled && hitRect(pointer.x, pointer.y, BTN_ACTION.x - BTN_ACTION.w * 0.5, BTN_ACTION.y - BTN_ACTION.h * 0.5, BTN_ACTION.w, BTN_ACTION.h)) hot = true;
    }
    if (state === 'FINALE' && stateTime > 2.6 && hitCircle(pointer.x, pointer.y, BTN_FINALE_NEXT.x, BTN_FINALE_NEXT.y, BTN_FINALE_NEXT.r)) hot = true;
    canvas.style.cursor = hot ? 'pointer' : 'default';
  }

  canvas.addEventListener('pointermove', e => {
    const p = toVirtual(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y;
    updateCursor();
  });

  canvas.addEventListener('pointerdown', e => {
    sfx.unlock();
    const p = toVirtual(e.clientX, e.clientY);
    pointer.x = p.x; pointer.y = p.y;

    // Mute toggle
    if (hitCircle(p.x, p.y, BTN_MUTE.x, BTN_MUTE.y, BTN_MUTE.r)) {
      sfx.muted = !sfx.muted;
      if (!sfx.muted) sfx.pop();
      return;
    }

    // Minimalistic Always-On "Next" skip button
    if (hitCircle(p.x, p.y, BTN_NEXT.x, BTN_NEXT.y, BTN_NEXT.r)) {
      sfx.clap();
      startNewRound(true);
      return;
    }

    if (state === 'INTRO') {
      introClapAnim = 1;
      sfx.clap();
      startNewRound(false);
      return;
    }

    // Fast-forward observation if student memorized early
    if (state === 'OBSERVE' && hitCircle(p.x, p.y, BTN_SKIP_OBS.x, BTN_SKIP_OBS.y, BTN_SKIP_OBS.r)) {
      triggerWindBlow();
      return;
    }

    // Wardrobe selection during DRESS
    if (state === 'DRESS') {
      for (const b of shelfHitBoxes) {
        if (!lockedCats[b.cat] && hitRect(p.x, p.y, b.x, b.y, b.w, b.h)) {
          const catIdx = CATEGORIES.indexOf(b.cat);
          sfx.equip(catIdx);
          // Cancel any in-flight item for same category
          flyingItems = flyingItems.filter(f => !(f.mode === 'equip' && f.cat === b.cat));
          const anc = slotAnchor(b.cat, actorX, actorY);
          flyingItems.push({
            cat: b.cat, id: b.id,
            sx: b.x + b.w * 0.5, sy: b.y + b.h * 0.5,
            ex: anc.x, ey: anc.y,
            t: 0, dur: 0.24, rot: -0.25, spin: 0.25, mode: 'equip'
          });
          return;
        }
      }

      // Action Clapperboard to submit
      const allFilled = activeCats.every(c => !!currentOutfit[c]);
      if (allFilled && hitRect(p.x, p.y, BTN_ACTION.x - BTN_ACTION.w * 0.5, BTN_ACTION.y - BTN_ACTION.h * 0.5, BTN_ACTION.w, BTN_ACTION.h)) {
        triggerCheck();
        return;
      }
    }

    // Finale Next button
    if (state === 'FINALE' && stateTime > 2.6 && hitCircle(p.x, p.y, BTN_FINALE_NEXT.x, BTN_FINALE_NEXT.y, BTN_FINALE_NEXT.r)) {
      sfx.clap();
      startNewRound(true);
      return;
    }
  });

  requestAnimationFrame(tick);
})();
</script>
</body>
