<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Studio Take 2</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #131c2b;
    touch-action: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // Virtual 16:9 stage coordinates
  const VW = 1600, VH = 900;
  let scale = 1, offX = 0, offY = 0, dpr = 1;
  let pointer = { x: -999, y: -999, down: false };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    scale = Math.min(w / VW, h / VH);
    offX = (w - VW * scale) * 0.5;
    offY = (h - VH * scale) * 0.5;
  }
  window.addEventListener('resize', resize);
  resize();

  function toVirtual(clientX, clientY) {
    return {
      x: (clientX - offX) / scale,
      y: (clientY - offY) / scale
    };
  }

  // ===================== SOUND ENGINE (Web Audio API) =====================
  class SoundFX {
    constructor() {
      this.ctx = null;
      this.muted = false;
      this.noiseBuf = null;
    }
    unlock() {
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
          const len = this.ctx.sampleRate * 2;
          this.noiseBuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
          const data = this.noiseBuf.getChannelData(0);
          for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      } catch (e) {}
    }
    tone(freq, dur, type = 'sine', vol = 0.15, slideTo = null, delay = 0) {
      if (this.muted || !this.ctx) return;
      try {
        const t = this.ctx.currentTime + delay;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, t);
        if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + Math.min(0.02, dur * 0.25));
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.connect(g); g.connect(this.ctx.destination);
        osc.start(t); osc.stop(t + dur + 0.02);
      } catch (e) {}
    }
    noise(dur, filterFreq = 1000, q = 1, vol = 0.12, type = 'bandpass', delay = 0, freqEnd = null) {
      if (this.muted || !this.ctx || !this.noiseBuf) return;
      try {
        const t = this.ctx.currentTime + delay;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf;
        const flt = this.ctx.createBiquadFilter();
        flt.type = type;
        flt.frequency.setValueAtTime(filterFreq, t);
        if (freqEnd) flt.frequency.exponentialRampToValueAtTime(Math.max(40, freqEnd), t + dur);
        flt.Q.value = q;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(vol, t + Math.min(0.03, dur * 0.2));
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(flt); flt.connect(g); g.connect(this.ctx.destination);
        src.start(t); src.stop(t + dur + 0.03);
      } catch (e) {}
    }
    clap() {
      this.noise(0.09, 1800, 1.5, 0.35, 'bandpass', 0, 700);
      this.tone(240, 0.07, 'triangle', 0.24, 90);
      this.tone(820, 0.04, 'square', 0.08, 320);
    }
    step() {
      this.noise(0.05, 420, 1.2, 0.09, 'lowpass');
      this.tone(110, 0.045, 'sine', 0.08, 65);
    }
    tick(urgent = false) {
      this.tone(urgent ? 980 : 640, 0.04, 'triangle', urgent ? 0.11 : 0.06, urgent ? 1120 : 580);
    }
    windBlast() {
      this.noise(1.5, 300, 0.7, 0.28, 'bandpass', 0, 1400);
      this.noise(1.3, 1200, 1.2, 0.14, 'highpass', 0.15, 400);
      this.tone(420, 0.45, 'sine', 0.12, 1300, 0.12);
      this.tone(950, 0.4, 'sine', 0.1, 320, 0.52);
      this.tone(580, 0.35, 'triangle', 0.09, 1450, 0.78);
    }
    equip(catIdx) {
      const base = [340, 620, 260, 440, 210][catIdx] || 400;
      this.tone(base, 0.11, 'sine', 0.16, base * 1.48);
      this.tone(base * 1.5, 0.09, 'triangle', 0.11, base * 1.9, 0.06);
      this.noise(0.07, 1400 + catIdx * 200, 2, 0.07, 'bandpass');
    }
    mistake() {
      this.tone(330, 0.22, 'sawtooth', 0.11, 270, 0);
      this.tone(265, 0.34, 'sawtooth', 0.11, 185, 0.2);
      this.tone(170, 0.25, 'sine', 0.16, 480, 0.12);
      this.tone(460, 0.2, 'sine', 0.12, 190, 0.36);
      this.noise(0.18, 900, 1.5, 0.12, 'bandpass', 0.1);
    }
    fanfare() {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((n, i) => {
        this.tone(n, 0.28, 'triangle', 0.14, null, i * 0.085);
        this.tone(n * 0.5, 0.3, 'sawtooth', 0.05, null, i * 0.085);
      });
    }
    finaleSound(type) {
      if (type === 0) { // Hurricane + Beach Ball Bonk
        this.noise(2.3, 400, 0.8, 0.25, 'bandpass', 0, 1700);
        this.tone(180, 0.22, 'sine', 0.22, 420, 1.55); // boing bonk
        this.tone(110, 0.16, 'triangle', 0.25, 60, 1.55);
        setTimeout(() => this.fanfare(), 1800);
      } else if (type === 1) { // Trapdoor + Trampoline
        this.noise(0.14, 700, 1, 0.22, 'lowpass', 0.1);
        this.tone(760, 0.45, 'sine', 0.14, 180, 0.2);
        this.tone(160, 0.55, 'sine', 0.2, 1180, 0.82); // mega boing
        this.tone(240, 0.35, 'triangle', 0.14, 760, 0.86);
        setTimeout(() => this.fanfare(), 1650);
      } else if (type === 2) { // Buster Keaton Wall Fall
        this.tone(420, 0.12, 'sawtooth', 0.1, 880, 0.05); // rope snap
        this.tone(220, 0.6, 'triangle', 0.08, 120, 0.2); // creak
        this.noise(0.32, 260, 0.8, 0.38, 'lowpass', 0.95, 70); // crash
        this.tone(90, 0.28, 'sine', 0.3, 35, 0.95);
        setTimeout(() => {
          this.tone(520, 0.14, 'sine', 0.12, 740, 0);
          this.tone(740, 0.2, 'sine', 0.14, 1040, 0.14);
          this.fanfare();
        }, 1650);
      } else if (type === 3) { // Giant Bubble Float + Pop
        for (let i = 0; i < 6; i++) {
          this.tone(260 + i * 95, 0.18, 'sine', 0.11, 350 + i * 110, 0.15 + i * 0.13);
        }
        this.tone(620, 0.9, 'sine', 0.07, 880, 1.0);
        // Pop!
        this.noise(0.06, 2200, 2, 0.32, 'bandpass', 2.45, 500);
        this.tone(900, 0.05, 'sine', 0.22, 140, 2.45);
        setTimeout(() => this.fanfare(), 2550);
      } else if (type === 4) { // Disco Short Circuit
        this.noise(0.18, 2800, 3, 0.18, 'bandpass', 0.05, 600);
        this.noise(0.15, 2200, 2, 0.15, 'bandpass', 0.25, 900);
        // Funky bassline groove
        const bass = [130.8, 130.8, 155.5, 174.6, 196.0, 174.6, 155.5, 196.0, 261.6, 196.0, 174.6, 155.5];
        bass.forEach((f, i) => {
          const d = 0.55 + i * 0.21;
          this.tone(f, 0.16, 'sawtooth', 0.11, f * 0.96, d);
          if (i % 2 === 1) this.noise(0.05, 4200, 1.5, 0.07, 'highpass', d);
          if (i % 4 === 0) this.tone(523.25 * (i === 8 ? 1.5 : 1), 0.14, 'triangle', 0.09, null, d);
        });
      } else if (type === 5) { // Camera Dolly Surf
        this.tone(110, 0.45, 'sawtooth', 0.1, 240, 0.05);
        this.tone(240, 0.5, 'sawtooth', 0.09, 170, 0.55);
        this.noise(0.9, 600, 1, 0.12, 'bandpass', 0.2, 1500);
        for (let i = 0; i < 8; i++) {
          this.tone(480 + i * 80, 0.09, 'sine', 0.09, 680 + i * 90, 0.45 + i * 0.18);
        }
        setTimeout(() => this.fanfare(), 1650);
      }
    }
    pop() {
      this.tone(520, 0.07, 'sine', 0.11, 780);
    }
  }
  const sfx = new SoundFX();

  // ===================== DATA & LIBRARIES =====================
  const CATEGORIES = ['hat', 'glasses', 'jacket', 'prop', 'boots'];
  const ITEMS = {
    hat: ['aviator', 'hardhat', 'beanie', 'cap', 'fedora', 'helmet'],
    glasses: ['cinema3d', 'ski', 'round', 'star', 'snorkel', 'aviatorShades'],
    jacket: ['denim', 'raincoat', 'varsity', 'hawaiian', 'puffer', 'striped'],
    prop: ['megaphone', 'ukulele', 'camera', 'skateboard', 'boombox', 'umbrella'],
    boots: ['rollers', 'rainboots', 'sneakers', 'springs', 'flippers', 'cowboy']
  };

  const ACTORS = [
    { gender: 'f', skin: '#f3c19d', skinDark: '#d89b74', hair: '#4a2b18', hairHi: '#75482d', style: 'pigtails', eye: '#2c6e5b', suit: '#3a4f6b', trim: '#56c2b6' },
    { gender: 'm', skin: '#eab38b', skinDark: '#cc8c62', hair: '#252120', hairHi: '#4a4341', style: 'spiky', eye: '#3b4e70', suit: '#3b4a66', trim: '#f29f4b' },
    { gender: 'f', skin: '#c9885b', skinDark: '#a3653d', hair: '#1d181a', hairHi: '#3d3439', style: 'buns', eye: '#3d2817', suit: '#433d63', trim: '#eb6f92' },
    { gender: 'm', skin: '#f7cfb0', skinDark: '#dcab88', hair: '#b85c24', hairHi: '#df8244', style: 'wavy', eye: '#2b7796', suit: '#2f525c', trim: '#f5c249' },
    { gender: 'f', skin: '#f5caa8', skinDark: '#d7a17d', hair: '#d4a34a', hairHi: '#f0cb7a', style: 'bob', eye: '#37689e', suit: '#3a4c6e', trim: '#78d18a' },
    { gender: 'm', skin: '#a96b45', skinDark: '#824d2e', hair: '#1a1514', hairHi: '#3a302d', style: 'curly', eye: '#2d1f16', suit: '#35485e', trim: '#53b8e8' }
  ];

  // ===================== HELPERS =====================
  function rr(c, x, y, w, h, r) {
    r = Math.min(r, w * 0.5, h * 0.5);
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function easeOutBack(t) {
    const c1 = 1.70158, c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }
  function easeInOut(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function hitCircle(px, py, cx, cy, r) {
    const dx = px - cx, dy = py - cy;
    return dx * dx + dy * dy <= r * r;
  }
  function hitRect(px, py, x, y, w, h) {
    return px >= x && px <= x + w && py >= y && py <= y + h;
  }

  // ===================== GAME STATE =====================
  let time = 0;
  let roundNum = 0;
  let state = 'INTRO'; // INTRO, ENTER, OBSERVE, WIND, DRESS, CHECK, MISTAKE, FINALE
  let stateTime = 0;
  let observeDur = 8.0;
  let lastTickSec = -1;

  let actorIdx = 0;
  let backdropIdx = 0;
  let activeCats = ['hat', 'glasses', 'jacket', 'prop'];
  let targetOutfit = {};
  let currentOutfit = {};
  let lockedCats = {};
  let shelfChoices = {}; // cat -> [id1, id2, id3, id4]
  let finaleBag = [];
  let currentFinale = 0;
  let finalePhaseSoundDone = false;

  // Spatial animations
  let actorX = 760, actorY = 735;
  let trunkX = 1660;
  let windPower = 0;
  let camShake = 0;
  let dollyX = 155;
  let introClapAnim = 0;
  let actionClapAnim = 0;
  let wipeAnim = 0;
  let actorReactT = 0;
  let actorExpr = 'neutral';
  let blinkTimer = 2.4;
  let isBlinking = false;

  // Dynamic entities
  let flyingItems = []; // { cat, id, sx, sy, ex, ey, t, dur, rot, spin, mode }
  let particles = [];
  let dustMotes = [];
  let clouds = [];
  for (let i = 0; i < 6; i++) {
    clouds.push({ x: i * 320 + Math.random() * 140, y: 75 + Math.random() * 130, s: 0.7 + Math.random() * 0.7, spd: 6 + Math.random() * 10 });
  }
  for (let i = 0; i < 34; i++) {
    dustMotes.push({ x: Math.random() * VW, y: 120 + Math.random() * 680, r: 1.5 + Math.random() * 2.5, vx: (Math.random() - 0.5) * 12, vy: -4 - Math.random() * 10, a: Math.random() * Math.PI * 2 });
  }

  // Button rects (updated every frame)
  const BTN_NEXT = { x: 1528, y: 54, r: 34 };
  const BTN_MUTE = { x: 1450, y: 54, r: 28 };
  const BTN_SKIP_OBS = { x: 205, y: 580, r: 38 };
  const BTN_ACTION = { x: 470, y: 818, w: 144, h: 98 };
  const BTN_FINALE_NEXT = { x: 1425, y: 790, r: 52 };
  let shelfHitBoxes = []; // { cat, id, x, y, w, h }

  function nextFinaleId() {
    if (finaleBag.length === 0) finaleBag = shuffle([0, 1, 2, 3, 4, 5]);
    return finaleBag.pop();
  }

  function startNewRound(instant = false) {
    roundNum++;
    const prevActor = actorIdx;
    do { actorIdx = Math.floor(Math.random() * ACTORS.length); } while (actorIdx === prevActor);
    backdropIdx = (backdropIdx + 1 + Math.floor(Math.random() * 2)) % 3;

    // Round 1: 4 vivid slots; Round 2+: 5 slots (with occasional 4-slot breather)
    activeCats = (roundNum === 1 || (roundNum > 3 && roundNum % 4 === 0))
      ? ['hat', 'glasses', 'jacket', 'prop']
      : ['hat', 'glasses', 'jacket', 'prop', 'boots'];

    observeDur = activeCats.length === 4 ? 7.5 : 9.0;
    targetOutfit = {};
    currentOutfit = {};
    lockedCats = {};
    shelfChoices = {};

    for (const cat of activeCats) {
      const pool = shuffle(ITEMS[cat]);
      const chosen = pool[0];
      targetOutfit[cat] = chosen;
      currentOutfit[cat] = chosen; // worn during ENTER and OBSERVE
      shelfChoices[cat] = shuffle(pool.slice(0, 4));
    }

    flyingItems = [];
    particles = [];
    windPower = 0;
    camShake = 0;
    dollyX = 155;
    trunkX = 1680;
    actorX = -130;
    actorY = 735;
    actorExpr = 'happy';
    actorReactT = 0;
    lastTickSec = -1;
    finalePhaseSoundDone = false;
    state = 'ENTER';
    stateTime = 0;
    if (instant) wipeAnim = 1;
  }

  function spawnConfetti(x, y, count = 45, spread = 520) {
    const cols = ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#ff70a6', '#ffd166', '#4cc9f0'];
    for (let i = 0; i < count; i++) {
      const ang = -Math.PI * 0.5 + (Math.random() - 0.5) * 2.2;
      const spd = 180 + Math.random() * spread;
      particles.push({
        type: Math.random() < 0.35 ? 'star' : 'rect',
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 120,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 14,
        sz: 7 + Math.random() * 9,
        col: cols[Math.floor(Math.random() * cols.length)],
        life: 0, maxLife: 2.2 + Math.random() * 1.4,
        grav: 420
      });
    }
  }

  function spawnPuff(x, y, count = 12, col = 'rgba(240,235,220,0.85)') {
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 40 + Math.random() * 130;
      particles.push({
        type: 'puff',
        x: x + (Math.random() - 0.5) * 30,
        y: y + (Math.random() - 0.5) * 30,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 20,
        sz: 14 + Math.random() * 20,
        col,
        life: 0, maxLife: 0.65 + Math.random() * 0.4,
        grav: -35
      });
    }
  }

  function spawnSparkles(x, y, count = 14) {
    const cols = ['#ffe66d', '#fff8c9', '#56f0d8', '#ffb703'];
    for (let i = 0; i < count; i++) {
      const ang = Math.random() * Math.PI * 2;
      const spd = 60 + Math.random() * 160;
      particles.push({
        type: 'star',
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd - 40,
        rot: Math.random() * Math.PI,
        vrot: (Math.random() - 0.5) * 10,
        sz: 6 + Math.random() * 7,
        col: cols[i % cols.length],
        life: 0, maxLife: 0.7 + Math.random() * 0.4,
        grav: 120
      });
    }
  }

  function slotAnchor(cat, ax, ay) {
    if (cat === 'hat') return { x: ax, y: ay - 270 };
    if (cat === 'glasses') return { x: ax, y: ay - 216 };
    if (cat === 'jacket') return { x: ax, y: ay - 115 };
    if (cat === 'prop') return { x: ax + 78, y: ay - 108 };
    return { x: ax, y: ay - 18 };
  }

  function triggerWindBlow() {
    state = 'WIND';
    stateTime = 0;
    actorExpr = 'wind';
    sfx.windBlast();
    // Launch all worn items flying offscreen right
    activeCats.forEach((cat, idx) => {
      const id = currentOutfit[cat];
      if (!id) return;
      const anc = slotAnchor(cat, actorX, actorY);
      flyingItems.push({
        cat, id,
        sx: anc.x, sy: anc.y,
        ex: 1750 + idx * 90, ey: anc.y - 160 + (idx % 2 ? 220 : -90),
        t: -idx * 0.08, dur: 0.95,
        rot: 0, spin: (idx % 2 ? 1 : -1) * (9 + idx * 1.5),
        mode: 'blow'
      });
    });
    currentOutfit = {};
    // Blow leaves & papers
    const leafCols = ['#5ea84f', '#89c454', '#e8a838', '#d96b38'];
    for (let i = 0; i < 28; i++) {
      particles.push({
        type: 'leaf',
        x: -40 - Math.random() * 300,
        y: 120 + Math.random() * 640,
        vx: 950 + Math.random() * 650,
        vy: (Math.random() - 0.5) * 260,
        rot: Math.random() * 6,
        vrot: (Math.random() - 0.5) * 18,
        sz: 9 + Math.random() * 9,
        col: leafCols[i % leafCols.length],
        life: 0, maxLife: 1.7, grav: 40
      });
    }
  }

  function triggerCheck() {
    state = 'CHECK';
    stateTime = 0;
    actionClapAnim = 1;
    sfx.clap();
  }

  // ===================== STUDIO BACKGROUND & SET =====================
  function drawBackground() {
    // Extend beyond 1600x900 for any aspect ratio
    const minX = -offX / scale - 20;
    const maxX = VW + offX / scale + 20;
    const minY = -offY / scale - 20;
    const maxY = VH + offY / scale + 20;
    const fullW = maxX - minX;
    const fullH = maxY - minY;

    // Sky gradient (dims into rich indigo during Disco Finale!)
    const discoAmt = (state === 'FINALE' && currentFinale === 4) ? clamp((stateTime - 0.15) * 2.5, 0, 1) : 0;
    const sky = ctx.createLinearGradient(0, minY, 0, 620);
    if (discoAmt > 0.01) {
      sky.addColorStop(0, lerpColor('#3f8fd2', '#101536', discoAmt));
      sky.addColorStop(0.55, lerpColor('#8bcbf2', '#1e2152', discoAmt));
      sky.addColorStop(1, lerpColor('#f9e2b8', '#33245c', discoAmt));
    } else {
      sky.addColorStop(0, '#3f8fd2');
      sky.addColorStop(0.58, '#8cccf2');
      sky.addColorStop(1, '#fae4be');
    }
    ctx.fillStyle = sky;
    ctx.fillRect(minX, minY, fullW, 660 - minY);

    // Warm sun glow (fades in disco)
    if (discoAmt < 0.95) {
      ctx.save();
      ctx.globalAlpha = 1 - discoAmt;
      const sunG = ctx.createRadialGradient(260, 150, 15, 260, 150, 260);
      sunG.addColorStop(0, 'rgba(255,250,220,0.92)');
      sunG.addColorStop(0.25, 'rgba(255,232,165,0.45)');
      sunG.addColorStop(1, 'rgba(255,220,140,0)');
      ctx.fillStyle = sunG;
      ctx.beginPath(); ctx.arc(260, 150, 260, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // Soft drifting volumetric clouds
    ctx.save();
    ctx.globalAlpha = 1 - discoAmt * 0.72;
    clouds.forEach(cl => {
      drawCloud(cl.x, cl.y, cl.s);
    });
    ctx.restore();

    // Distant studio lot silhouettes (soundstages & swaying palms)
    drawStudioHorizon(minX, maxX, discoAmt);

    // Giant Painted Hollywood Studio Backdrop Flat (behind the stage!)
    drawBackdropFlat(backdropIdx, discoAmt);

    // Studio wooden/asphalt lot floor
    const floorY = 638;
    const flG = ctx.createLinearGradient(0, floorY, 0, maxY);
    flG.addColorStop(0, discoAmt > 0.5 ? '#262b40' : '#4a5363');
    flG.addColorStop(0.25, discoAmt > 0.5 ? '#1c2033' : '#3a4252');
    flG.addColorStop(1, discoAmt > 0.5 ? '#121524' : '#262d3a');
    ctx.fillStyle = flG;
    ctx.fillRect(minX, floorY, fullW, maxY - floorY);

    // Subtle concrete/stage seam lines & texture
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 2;
    for (let i = -2; i <= 10; i++) {
      ctx.beginPath();
      ctx.moveTo(800 + (i - 4) * 160, floorY);
      ctx.lineTo(800 + (i - 4) * 290, maxY);
      ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,205,75,0.32)';
    ctx.lineWidth = 4;
    ctx.setLineDash([28, 18]);
    ctx.beginPath();
    ctx.moveTo(minX, floorY + 14);
    ctx.lineTo(maxX, floorY + 14);
    ctx.stroke();
    ctx.setLineDash([]);

    // Steel dolly tracks on floor
    drawDollyTracks(minX, maxX);

    // Red gaffer-tape X mark on stage floor (splits open during Trapdoor Finale!)
    const markX = (state === 'DRESS' || state === 'CHECK' || state === 'MISTAKE') ? 480 : 760;
    const trapOpen = (state === 'FINALE' && currentFinale === 1) ? clamp(Math.sin(clamp((stateTime - 0.05) * 2.1, 0, Math.PI)), 0, 1) : 0;
    drawFloorMark(markX, 742, trapOpen);

    // Overhead Steel Lighting Truss & Glowing Fresnel Spotlights
    drawOverheadTruss(minX, maxX, discoAmt);

    // Studio spotlight cone on actor
    drawSpotlightBeams(actorX, discoAmt);
  }

  function lerpColor(hex1, hex2, t) {
    const a = parseInt(hex1.slice(1), 16), b = parseInt(hex2.slice(1), 16);
    const r = Math.round(lerp((a >> 16) & 255, (b >> 16) & 255, t));
    const g = Math.round(lerp((a >> 8) & 255, (b >> 8) & 255, t));
    const bl = Math.round(lerp(a & 255, b & 255, t));
    return `rgb(${r},${g},${bl})`;
  }

    ctx.save();

      ctx.beginPath(); ctx.ellipse(0, 35, 16, 6, 0, 0, Math.PI * 2); ctx.fill();

  // ===================== STUDIO CAMERA DOLLY & WIND FAN =====================
  function drawCameraDolly(x, y, obsProgress = -1) {
    ctx.save();
    ctx.translate(x, y);

    // Shadow under dolly
    ctx.fillStyle = 'rgba(10,14,22,0.45)';
    ctx.beginPath(); ctx.ellipse(0, 48, 92, 14, 0, 0, Math.PI * 2); ctx.fill();

    // Rolling steel platform

    platG.addColorStop(0, '#5a6678');
    platG.addColorStop(1, '#2b323d');
    ctx.fillStyle = platG;
    rr(ctx, -82, 12, 164, 24, 6); ctx.fill();
    // Yellow hazard bumper stripe
    ctx.fillStyle = '#f2b738';
    rr(ctx, -78, 16, 156, 6, 3); ctx.fill();

    // 4 rubber dolly wheels
    [-58, 58].forEach(wx => {
      ctx.fillStyle = '#181c22';
      ctx.beginPath(); ctx.arc(wx, 38, 15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#8d99ae';
      ctx.beginPath(); ctx.arc(wx, 38, 6, 0, Math.PI * 2); ctx.fill();
    });

    // Hydraulic pedestal column
    const colG = ctx.createLinearGradient(-18, 0, 18, 0);
    colG.addColorStop(0, '#2a313d');
    colG.addColorStop(0.5, '#7c8b9e');
    colG.addColorStop(1, '#202630');
    ctx.fillStyle = colG;
    ctx.fillRect(-14, -120, 28, 134);

    // Cinema Camera Body
    ctx.save();
    ctx.translate(0, -148);
    const bodyG = ctx.createLinearGradient(0, -34, 0, 38);
    bodyG.addColorStop(0, '#3a4352');
    bodyG.addColorStop(1, '#1a1f28');
    ctx.fillStyle = bodyG;
    rr(ctx, -56, -34, 118, 68, 10); ctx.fill();

    // Twin Film Reels on top (spin while filming!)
    const reelRot = (state === 'OBSERVE' || state === 'FINALE' || state === 'CHECK') ? time * 4.5 : time * 0.4;
    [-26, 26].forEach(rx => {
      ctx.save();
      ctx.translate(rx, -64);
      ctx.rotate(reelRot);
      ctx.fillStyle = '#252c38';
      ctx.beginPath(); ctx.arc(0, 0, 29, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#9aa8ba'; ctx.lineWidth = 3;
      ctx.stroke();
      ctx.fillStyle = '#475469';
      for (let k = 0; k < 4; k++) {
        const a = k * Math.PI * 0.5;
        ctx.beginPath(); ctx.arc(Math.cos(a) * 14, Math.sin(a) * 14, 6, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = '#e0a938';
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });

    // Matte Box & Multi-coated Glass Lens pointing right
    ctx.fillStyle = '#151921';
    ctx.beginPath();
    ctx.moveTo(60, -24); ctx.lineTo(106, -36); ctx.lineTo(106, 36); ctx.lineTo(60, 24);
    ctx.closePath(); ctx.fill();
    const lensG = ctx.createLinearGradient(96, -24, 108, 24);
    lensG.addColorStop(0, '#48cae4');

  function drawWindFan(power) {
    if (power <= 0.01) return;
    ctx.save();
    const fx = lerp(-140, 120, clamp(power * 1.4, 0, 1));
    const fy = 530;
    ctx.translate(fx, fy);

    // Industrial Tripod Stand
    ctx.strokeStyle = '#333b48'; ctx.lineWidth = 10; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 40); ctx.lineTo(-48, 220);
    ctx.moveTo(0, 40); ctx.lineTo(48, 220);
    ctx.moveTo(0, 40); ctx.lineTo(0, 210);
    ctx.stroke();

    // Heavy Metallic Yellow-Steel Cage
    const cageG = ctx.createRadialGradient(-20, -20, 10, 0, 0, 105);
    cageG.addColorStop(0, '#ffd166');
    cageG.addColorStop(0.75, '#d98c24');
    cageG.addColorStop(1, '#6e4511');
    ctx.fillStyle = cageG;
    ctx.beginPath(); ctx.ellipse(-18, 0, 46, 102, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#1b222c';
    ctx.beginPath(); ctx.ellipse(4, 0, 34, 92, 0, 0, Math.PI * 2); ctx.fill();

    // High-speed blurred blades
    ctx.save();
    ctx.translate(6, 0);
    ctx.scale(0.36, 1);
    ctx.rotate(time * 38);
    ctx.fillStyle = 'rgba(200,220,245,0.75)';
    for (let i = 0; i < 4; i++) {
      ctx.rotate(Math.PI * 0.5);
      ctx.beginPath(); ctx.ellipse(0, -48, 18, 42, 0.25, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    // Protective front grille rings
    ctx.strokeStyle = '#9aa8ba'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(12, 0, 34, 92, 0, 0, Math.PI * 2); ctx.stroke();

    // Dynamic Wind Streaks shooting right
    ctx.strokeStyle = `rgba(240,250,255,${0.45 * power})`;
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (let i = 0; i < 8; i++) {
      const sy = -110 + i * 32 + Math.sin(time * 18 + i) * 14;
      const sx = 60 + ((time * 1400 + i * 230) % 1350);
      const len = 90 + (i % 3) * 65;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(sx + len * 0.5, sy - 10, sx + len, sy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawStarPath(c, cx, cy, spikes, outerR, innerR) {
    let rot = Math.PI / 2 * 3;
    const step = Math.PI / spikes;
    c.beginPath();
    c.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      c.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      c.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    c.closePath();
  }

      ctx.strokeStyle = '#242933'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, -h); ctx.lineTo(0, h); ctx.stroke();
    } else if (id === 'striped') {
      // Nautical Breton navy-cream striped sweater + red neckerchief
      ctx.save();
      rr(ctx, -w, -h, w * 2, h * 2, 18); ctx.clip();
      ctx.fillStyle = '#f5eedc'; ctx.fillRect(-w, -h, w * 2, h * 2);
      ctx.fillStyle = '#1b3a5c';
      for (let sy = -h + 10; sy < h; sy += 20) {
        ctx.fillRect(-w, sy, w * 2, 9);
      }
      ctx.restore();
      // Red knotted neckerchief at collar
      ctx.fillStyle = '#e63946';
      ctx.beginPath();
      ctx.moveTo(-26, -h); ctx.lineTo(26, -h); ctx.lineTo(0, -h + 28); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.arc(0, -h + 24, 7, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawProp(id, mode) {
    if (mode === 'icon') ctx.scale(0.84, 0.84);
    if (id === 'megaphone') {
      ctx.rotate(-0.2);
      // Grip
      ctx.fillStyle = '#2b323d';
      rr(ctx, -22, 6, 14, 34, 5); ctx.fill();
      // Cone
      const g = ctx.createLinearGradient(-34, -30, 40, 30);
      g.addColorStop(0, '#ff595e'); g.addColorStop(0.55, '#d62828'); g.addColorStop(1, '#8a1414');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-36, -12); ctx.lineTo(36, -34); ctx.lineTo(36, 34); ctx.lineTo(-36, 12);
      ctx.closePath(); ctx.fill();
      // Chrome rim & interior
      ctx.fillStyle = '#d9e2ec';
      ctx.beginPath(); ctx.ellipse(36, 0, 10, 34, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#2c3542';
      ctx.beginPath(); ctx.ellipse(36, 0, 6, 26, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#eef4fa';
      ctx.fillRect(-10, -20, 12, 40);
    } else if (id === 'ukulele') {
      ctx.rotate(-0.45);
      // Neck
      ctx.fillStyle = '#5c381f';
      rr(ctx, -6, -62, 12, 56, 3); ctx.fill();
      ctx.fillStyle = '#3d2312';
      rr(ctx, -9, -74, 18, 16, 4); ctx.fill();
      // Spruce wood figure-8 body
      const wg = ctx.createRadialGradient(-8, 14, 4, 0, 20, 34);
      wg.addColorStop(0, '#f7c873'); wg.addColorStop(0.7, '#d48d3b'); wg.addColorStop(1, '#8c5219');
      ctx.fillStyle = wg;
      ctx.beginPath(); ctx.arc(0, 6, 19, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(0, 30, 26, 0, Math.PI * 2); ctx.fill();
      // Soundhole & strings
      ctx.fillStyle = '#2b190d';
      ctx.beginPath(); ctx.arc(0, 14, 9, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(255,248,230,0.75)'; ctx.lineWidth = 1;
      for (let s = -3; s <= 3; s += 2) {
        ctx.beginPath(); ctx.moveTo(s, -60); ctx.lineTo(s, 36); ctx.stroke();
      }
      ctx.fillStyle = '#3b2210'; ctx.fillRect(-10, 34, 20, 6);
    } else if (id === 'camera') {
      // Retro instant film camera with rainbow stripe
      const bg = ctx.createLinearGradient(-38, -28, 38, 28);
      bg.addColorStop(0, '#f2efe9'); bg.addColorStop(1, '#c9c3b8');
      ctx.fillStyle = bg;
      rr(ctx, -38, -28, 76, 56, 10); ctx.fill();
      // Dark leather lower grip
      ctx.fillStyle = '#242933';
      rr(ctx, -38, 4, 76, 24, 8); ctx.fill();
      // Rainbow vertical stripe
      ['#e63946', '#f4a261', '#e9c46a', '#2a9d8f', '#264653'].forEach((c, i) => {
        ctx.fillStyle = c; ctx.fillRect(-6 + i * 2.6, 4, 2.6, 24);
      });
      // Multi-coated circular lens
      ctx.fillStyle = '#1b2029';
      ctx.beginPath(); ctx.arc(0, -6, 19, 0, Math.PI * 2); ctx.fill();
      const lg = ctx.createRadialGradient(-5, -10, 2, 0, -6, 14);
      lg.addColorStop(0, '#90e0ef'); lg.addColorStop(0.5, '#0077b6'); lg.addColorStop(1, '#03045e');
      ctx.fillStyle = lg;
      ctx.beginPath(); ctx.arc(0, -6, 13, 0, Math.PI * 2); ctx.fill();
      // Flash & red shutter button
      ctx.fillStyle = '#ff595e'; ctx.beginPath(); ctx.arc(24, -14, 6, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff5c0'; rr(ctx, -30, -22, 16, 10, 3); ctx.fill();
    } else if (id === 'skateboard') {
      ctx.rotate(-0.35);
      // Purple & neon-lime street skateboard
      const dg = ctx.createLinearGradient(-18, -56, 18, 56);
      dg.addColorStop(0, '#7209b7'); dg.addColorStop(0.5, '#9d4edd'); dg.addColorStop(1, '#480ca8');
      ctx.fillStyle = dg;
      rr(ctx, -20, -56, 40, 112, 19); ctx.fill();
      ctx.strokeStyle = '#c7f9cc'; ctx.lineWidth = 3;
      rr(ctx, -16, -52, 32, 104, 16); ctx.stroke();
      // Neon lime lightning graphic
      ctx.fillStyle = '#aacc00';
      ctx.beginPath();
      ctx.moveTo(4, -36); ctx.lineTo(-10, -2); ctx.lineTo(2, -2);
      ctx.lineTo(-6, 36); ctx.lineTo(12, -8); ctx.lineTo(0, -8); ctx.closePath(); ctx.fill();
      // Trucks & orange wheels
      [-32, 32].forEach(wy => {
        ctx.fillStyle = '#cfd8e3'; ctx.fillRect(-25, wy - 4, 50, 8);
        ctx.fillStyle = '#ff9f1c';
        rr(ctx, -28, wy - 8, 8, 16, 3); ctx.fill();
        rr(ctx, 20, wy - 8, 8, 16, 3); ctx.fill();
      });
    } else if (id === 'boombox') {
      // Chrome handle
      ctx.strokeStyle = '#9aa8ba'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(-28, -22); ctx.lineTo(-24, -38); ctx.lineTo(24, -38); ctx.lineTo(28, -22); ctx.stroke();
      // Brushed steel body
      const bg = ctx.createLinearGradient(0, -24, 0, 26);
      bg.addColorStop(0, '#768599'); bg.addColorStop(0.5, '#465263'); bg.addColorStop(1, '#262d38');
      ctx.fillStyle = bg;
      rr(ctx, -46, -24, 92, 50, 8); ctx.fill();
      // Twin mesh speakers
      [-26, 26].forEach(sx => {
        ctx.fillStyle = '#181c24'; ctx.beginPath(); ctx.arc(sx, 3, 16, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#4cc9f0'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.fillStyle = '#3a4659'; ctx.beginPath(); ctx.arc(sx, 3, 6, 0, Math.PI * 2); ctx.fill();
      });
      // Cassette deck center
      ctx.fillStyle = '#12161f'; rr(ctx, -10, -8, 20, 22, 3); ctx.fill();
      ctx.fillStyle = '#ffca3a'; ctx.fillRect(-7, -3, 14, 8);
    } else if (id === 'umbrella') {
      ctx.rotate(-0.22);
      // Wooden curved handle & shaft
      ctx.strokeStyle = '#c8d2de'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, -48); ctx.lineTo(0, 32); ctx.stroke();
      ctx.strokeStyle = '#7d4a21'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 28); ctx.lineTo(0, 42); ctx.arc(-9, 42, 9, 0, Math.PI); ctx.stroke();
      // Vibrant rainbow canopy panels
      const cols = ['#ef476f', '#ffd166', '#06d6a0', '#118ab2'];
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = cols[i];
        ctx.beginPath();
        ctx.moveTo(0, -44);
        const x1 = -48 + i * 24, x2 = x1 + 24;
        ctx.quadraticCurveTo((x1 + x2) * 0.5, -36, x2, -10);
        ctx.quadraticCurveTo((x1 + x2) * 0.5, -18, x1, -10);
        ctx.closePath(); ctx.fill();
      }
    }
  }

  function drawBoots(id, mode) {
    // Draw a pair of shoes/gear (in 'icon' mode side-by-side, in 'wear' mode also called per foot with side)
    if (mode === 'icon') {
      ctx.save(); ctx.translate(-22, 8); ctx.scale(0.75, 0.75); drawSingleFoot(id, -1); ctx.restore();
      ctx.save(); ctx.translate(22, 8); ctx.scale(0.75, 0.75); drawSingleFoot(id, 1); ctx.restore();
    } else {
      drawSingleFoot(id, mode === 'left' ? -1 : 1);
    }
  }

  function drawSingleFoot(id, dir) {
    ctx.save();
    ctx.scale(dir, 1);
    if (id === 'rollers') {
      // Turquoise quad roller skate with coral wheels
      ctx.fillStyle = '#00b4d8';
      ctx.beginPath();
      ctx.moveTo(-14, -34); ctx.lineTo(10, -34); ctx.lineTo(14, -10);
      ctx.quadraticCurveTo(30, -8, 30, 4); ctx.lineTo(-16, 4); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#e0fbfc'; ctx.fillRect(-16, 2, 46, 5);
      // Wheels
      [-10, 14].forEach(wx => {
        ctx.fillStyle = '#ff6b6b'; ctx.beginPath(); ctx.arc(wx, 12, 8, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffe66d'; ctx.beginPath(); ctx.arc(wx, 12, 3, 0, Math.PI * 2); ctx.fill();
      });
      // Toe stop
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(28, 10, 5, 0, Math.PI * 2); ctx.fill();
    } else if (id === 'rainboots') {
      const g = ctx.createLinearGradient(-16, -42, 24, 14);
      g.addColorStop(0, '#ff4d5a'); g.addColorStop(1, '#a81320');
      ctx.fillStyle = g;
      rr(ctx, -15, -42, 27, 46, 7); ctx.fill();
      ctx.beginPath(); ctx.ellipse(8, 2, 22, 12, 0, 0, Math.PI * 2); ctx.fill();
      // Yellow trim & sole
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(-16, -42, 29, 7);
      rr(ctx, -16, 9, 46, 7, 3); ctx.fill();
      // Glossy highlight
      ctx.fillStyle = 'rgba(255,255,255,0.38)';
      rr(ctx, -10, -30, 6, 26, 3); ctx.fill();
    } else if (id === 'sneakers') {
      // High-top black & white checkered sneaker with red toe
      ctx.fillStyle = '#1f242e';
      rr(ctx, -15, -30, 26, 34, 6); ctx.fill();
      ctx.beginPath(); ctx.ellipse(9, 2, 22, 11, 0, 0, Math.PI * 2); ctx.fill();
      // Checkers
      ctx.fillStyle = '#f5f5f5';
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        if ((r + c) % 2 === 0) ctx.fillRect(-13 + c * 7, -24 + r * 7, 7, 7);
      }
      // Red toe cap & crisp sole
      ctx.fillStyle = '#e63946';
      ctx.beginPath(); ctx.arc(22, 2, 9, -Math.PI * 0.5, Math.PI * 0.5); ctx.fill();
      ctx.fillStyle = '#eef2f7'; rr(ctx, -16, 8, 46, 7, 3); ctx.fill();
    } else if (id === 'springs') {
      // Metallic neon-lime bouncy coil-spring boots
      ctx.fillStyle = '#38b000';
      rr(ctx, -15, -32, 34, 24, 8); ctx.fill();
      ctx.strokeStyle = '#d9e2ec'; ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-10, -8); ctx.lineTo(14, -2); ctx.lineTo(-10, 4); ctx.lineTo(14, 10); ctx.lineTo(-10, 14);
      ctx.stroke();
      ctx.fillStyle = '#252b36'; rr(ctx, -16, 12, 38, 6, 3); ctx.fill();
    } else if (id === 'flippers') {
      // Cobalt & neon yellow swim fins
      ctx.fillStyle = '#1d4ed8';
      ctx.beginPath();
      ctx.moveTo(-15, -18); ctx.lineTo(8, -18); ctx.lineTo(44, 6); ctx.lineTo(44, 15); ctx.lineTo(-16, 15);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#facc15';
      ctx.beginPath(); ctx.moveTo(6, -10); ctx.lineTo(40, 7); ctx.lineTo(40, 12); ctx.lineTo(6, 2); ctx.fill();
    } else if (id === 'cowboy') {
      // Stitched tan leather Western boots with silver toe tip
      const g = ctx.createLinearGradient(-16, -42, 24, 14);
      g.addColorStop(0, '#c67d3b'); g.addColorStop(1, '#784418');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(-15, -42); ctx.quadraticCurveTo(0, -34, 12, -42);
      ctx.lineTo(12, -6); ctx.lineTo(30, 4); ctx.lineTo(26, 13); ctx.lineTo(-16, 13); ctx.closePath(); ctx.fill();
      // Silver toe cap & heel
      ctx.fillStyle = '#d8e1eb';
      ctx.beginPath(); ctx.moveTo(20, 0); ctx.lineTo(31, 5); ctx.lineTo(26, 13); ctx.lineTo(18, 12); ctx.fill();
      ctx.fillStyle = '#3d220c'; ctx.fillRect(-16, 10, 14, 7);
      // Decorative gold stitching
      ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(-6, -30); ctx.lineTo(0, -18); ctx.lineTo(6, -30); ctx.stroke();
    }
    ctx.restore();
  }

  // ===================== ARTICULATED REALISTIC ACTOR =====================
  function drawActor(x, y, outfit, opts = {}) {
    const a = ACTORS[actorIdx];
    const breath = Math.sin(time * 2.7) * 2.5;
    const walk = opts.walk || 0;
    const dance = opts.dance || 0;
    const windTilt = opts.windTilt || 0;
    const bodyRot = opts.bodyRot || 0;
    const scX = opts.scX || 1;
    const scY = opts.scY || 1;
    const expr = opts.expr || actorExpr;
    const react = Math.sin(clamp(actorReactT, 0, 1) * Math.PI);

    ctx.save();
    ctx.translate(x, y);

    // Realistic soft ground shadow (tracks height if jumping)
    if (!opts.noShadow) {
      const shS = clamp(1 - Math.max(0, 735 - y) / 500, 0.25, 1);
      ctx.fillStyle = `rgba(12,18,28,${0.36 * shS})`;
      ctx.beginPath();
      ctx.ellipse(0, 735 - y + 8, 66 * shS, 16 * shS, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.rotate(bodyRot + windTilt * 0.25);
    ctx.scale(scX * (1 + react * 0.06), scY * (1 - react * 0.05));

    const legSwing = Math.sin(walk) * 22 + Math.sin(dance * 6) * 10;
    const bounceY = Math.abs(Math.sin(walk)) * -10 + Math.abs(Math.sin(dance * 6)) * -18;
    ctx.translate(0, bounceY);

    // ---- LEGS & FOOTWEAR ----
    [-22, 22].forEach((lx, idx) => {
      const dir = idx === 0 ? -1 : 1;
      const sw = idx === 0 ? legSwing : -legSwing;
      ctx.save();
      ctx.translate(lx, -78);
      ctx.rotate((sw * 0.015) + (dance ? Math.sin(dance * 6 + idx * 3) * 0.12 : 0));
      // Trousers (rehearsal tracksuit pants)
      const pg = ctx.createLinearGradient(-14, 0, 14, 65);
      pg.addColorStop(0, a.suit); pg.addColorStop(1, '#202a3b');
      ctx.fillStyle = pg;
      rr(ctx, -14, -4, 28, 70, 12); ctx.fill();
      // Side stripe
      ctx.fillStyle = a.trim;
      ctx.fillRect(dir * 9, 4, 4, 54);
      // Footwear
      ctx.save();
      ctx.translate(dir * 3, 66);
      if (outfit.boots) {
        drawBoots(outfit.boots, idx === 0 ? 'left' : 'right');
      } else {
        // Default plain dark rehearsal sneakers
        ctx.scale(dir, 1);
        ctx.fillStyle = '#333d4f';
        ctx.beginPath(); ctx.ellipse(7, 2, 21, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#cfd8e3';
        rr(ctx, -14, 8, 42, 6, 3); ctx.fill();
      }
      ctx.restore();
      ctx.restore();
    });

    // ---- BACK ARM (Left arm) ----
    ctx.save();
    ctx.translate(-46, -152 + breath);
    const armLAng = 0.22 + Math.sin(walk + Math.PI) * 0.35
      + (expr === 'surprised' || expr === 'dizzy' ? 2.1 : 0)
      + (dance ? Math.sin(dance * 6) * 1.1 + 1.4 : 0)
      + (windTilt > 0.2 ? -0.9 : 0);
    ctx.rotate(armLAng);
    drawArm(a, outfit.jacket, false);
    ctx.restore();

    // ---- TORSO & JACKET ----
    ctx.save();
    ctx.translate(0, -124 + breath);
    if (outfit.jacket) {
      drawJacket(outfit.jacket, 'wear');
    } else {
      // Plain comfortable rehearsal tracksuit top
      const tg = ctx.createLinearGradient(-44, -52, 44, 52);
      tg.addColorStop(0, a.suit); tg.addColorStop(1, '#253247');
      ctx.fillStyle = tg;
      rr(ctx, -44, -52, 88, 104, 18); ctx.fill();
      ctx.fillStyle = a.trim;
      ctx.fillRect(-44, -8, 88, 10);
      ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(0, -52); ctx.lineTo(0, 52); ctx.stroke();
    }
    ctx.restore();

    // ---- NECK & HEAD ----
    const headTilt = Math.sin(time * 1.6) * 0.045 + (expr === 'dizzy' ? Math.sin(time * 18) * 0.16 : 0) + (dance ? Math.sin(dance * 6) * 0.14 : 0);
    ctx.save();
    ctx.translate(0, -214 + breath * 1.1);
    ctx.rotate(headTilt);

    // Back hair layer
    drawHairBack(a, windTilt);

    // Neck
    ctx.fillStyle = a.skinDark;
    rr(ctx, -13, 28, 26, 22, 8); ctx.fill();

    // Ears
    [-42, 42].forEach(ex => {
      ctx.fillStyle = a.skin;
      ctx.beginPath(); ctx.ellipse(ex, 4, 9, 13, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = a.skinDark;
      ctx.beginPath(); ctx.ellipse(ex, 4, 4, 7, 0, 0, Math.PI * 2); ctx.fill();
    });

    // Head shape with warm natural lighting
    const hg = ctx.createRadialGradient(-14, -14, 8, 0, 0, 52);
    hg.addColorStop(0, a.skin);
    hg.addColorStop(0.75, a.skin);
    hg.addColorStop(1, a.skinDark);
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(0, 0, 44, 48, 0, 0, Math.PI * 2);
    ctx.fill();

    // Soft rosy cheeks
    ctx.fillStyle = 'rgba(235, 110, 110, 0.22)';
    ctx.beginPath(); ctx.ellipse(-24, 14, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(24, 14, 10, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Expressive Face
    drawFace(a, expr);

    // Front hair bangs
    drawHairFront(a, windTilt);

    // Eyewear
    if (outfit.glasses) {
      ctx.save();
      ctx.translate(0, -2);
      drawGlasses(outfit.glasses, 'wear');
      ctx.restore();
    }

    // Headgear
    if (outfit.hat) {
      ctx.save();
      ctx.translate(0, -34);
      drawHat(outfit.hat, 'wear');
      ctx.restore();
    }
    ctx.restore(); // end head

    // ---- FRONT ARM (Right arm holding prop!) ----
    ctx.save();
    ctx.translate(46, -152 + breath);
    let armRAng = -0.28 - Math.sin(walk) * 0.35;
    if (outfit.prop) armRAng = -0.68 + Math.sin(time * 3) * 0.08 - react * 0.35;
    if (dance) armRAng = -1.6 + Math.cos(dance * 6) * 0.7;
    if (expr === 'dizzy') armRAng = -2.3 + Math.sin(time * 12) * 0.2;
    ctx.rotate(armRAng);
    drawArm(a, outfit.jacket, true);
    if (outfit.prop) {
      ctx.save();
      ctx.translate(10, 74);
      ctx.rotate(-armRAng * 0.75);
      drawProp(outfit.prop, 'wear');
      ctx.restore();
    }
    ctx.restore();

    ctx.restore();
  }

  function drawArm(a, jacketId, isRight) {
    // Sleeve color matches jacket
    const sleeveMap = {
      denim: '#355c87', raincoat: '#f5be18', varsity: '#f7efe1',
      hawaiian: '#20a89c', puffer: '#3b4659', striped: '#1b3a5c'
    };
    const col = sleeveMap[jacketId] || a.suit;
    // Upper/lower sleeve
    ctx.fillStyle = col;
    rr(ctx, -12, -8, 24, 66, 11); ctx.fill();
    // Hand
    ctx.fillStyle = a.skin;
    ctx.beginPath(); ctx.arc(0, 65, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = a.skinDark;
    ctx.beginPath(); ctx.arc(isRight ? -8 : 8, 61, 5, 0, Math.PI * 2); ctx.fill();
  }

  function drawHairBack(a, wind) {
    ctx.fillStyle = a.hair;
    const w = wind * 24;
    if (a.style === 'pigtails') {
      [-46, 46].forEach(px => {
        ctx.beginPath();
        ctx.ellipse(px + w * 0.6, 8, 18, 32, px < 0 ? 0.3 : -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = a.trim;
        ctx.beginPath(); ctx.arc(px * 0.88, -14, 7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = a.hair;
      });
    } else if (a.style === 'buns') {
      [-38, 38].forEach(bx => {
        ctx.beginPath(); ctx.arc(bx, -32, 19, 0, Math.PI * 2); ctx.fill();
      });
    } else if (a.style === 'bob') {
      ctx.beginPath();
      ctx.ellipse(w * 0.3, 4, 52, 48, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawHairFront(a, wind) {
    const w = wind * 18;
    const g = ctx.createLinearGradient(-40, -52, 40, -10);
    g.addColorStop(0, a.hairHi); g.addColorStop(1, a.hair);
    ctx.fillStyle = g;
    if (a.style === 'spiky') {
      ctx.beginPath();
      ctx.moveTo(-43, -10);
      ctx.quadraticCurveTo(-45, -48, -18, -48);
      ctx.lineTo(-10 + w, -62); ctx.lineTo(2, -48);
      ctx.lineTo(14 + w, -60); ctx.lineTo(22, -46);
      ctx.quadraticCurveTo(46, -42, 43, -10);
      ctx.quadraticCurveTo(22, -28, 0, -24);
      ctx.quadraticCurveTo(-24, -28, -43, -10);
      ctx.fill();
    } else if (a.style === 'curly') {
      for (let i = -3; i <= 3; i++) {
        ctx.beginPath();
        ctx.arc(i * 12 + w * 0.4, -36 - Math.cos(i * 0.6) * 10, 14, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.beginPath();
      ctx.arc(0, -12, 45, Math.PI * 1.06, Math.PI * -0.06);
      ctx.quadraticCurveTo(18 + w * 0.4, -30, -4, -18);
      ctx.quadraticCurveTo(-24 + w * 0.3, -28, -44, -10);
      ctx.fill();
    }
  }

  function drawFace(a, expr) {
    // Eyes
    const lookX = (state === 'DRESS') ? 3 : Math.sin(time * 0.8) * 2;
    [-16, 16].forEach((ex, idx) => {
      if (isBlinking && expr !== 'surprised' && expr !== 'wind') {
        ctx.strokeStyle = '#2b2019'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(ex - 7, -1); ctx.quadraticCurveTo(ex, 4, ex + 7, -1); ctx.stroke();
      } else {
        // Sclera
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.ellipse(ex, -2, expr === 'surprised' ? 9.5 : 8.5, expr === 'surprised' ? 11 : 9.5, 0, 0, Math.PI * 2);
        ctx.fill();
        // Iris & Pupil
        const ox = expr === 'dizzy' ? Math.cos(time * 12 + idx * 3) * 3.5 : lookX;
        const oy = expr === 'dizzy' ? Math.sin(time * 12 + idx * 3) * 3.5 : 0;
        ctx.fillStyle = a.eye;
        ctx.beginPath(); ctx.arc(ex + ox, -1 + oy, 5.2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#12151c';
        ctx.beginPath(); ctx.arc(ex + ox, -1 + oy, 2.7, 0, Math.PI * 2); ctx.fill();
        // Specular catchlight
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.arc(ex + ox - 2, -3.5 + oy, 1.9, 0, Math.PI * 2); ctx.fill();
      }
      // Expressive Eyebrows
      ctx.strokeStyle = a.hair; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
      ctx.beginPath();
      const by = (expr === 'surprised' || expr === 'wind') ? -18 : -14;
      const tilt = (expr === 'dizzy') ? (idx === 0 ? -4 : 4) : (expr === 'happy' || expr === 'hero' ? -2 : 0);
      ctx.moveTo(ex - 9, by + tilt); ctx.quadraticCurveTo(ex, by - 4, ex + 9, by - tilt);
      ctx.stroke();
    });

    // Nose
    ctx.strokeStyle = a.skinDark; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(0, 1); ctx.quadraticCurveTo(4, 9, -1, 11); ctx.stroke();

    // Mouth
    ctx.strokeStyle = '#6e2d2d'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    if (expr === 'happy' || expr === 'hero') {
      ctx.fillStyle = '#8c2832';
      ctx.beginPath();
      ctx.arc(0, 18, 14, 0.1, Math.PI - 0.1); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-10, 19, 20, 4);
    } else if (expr === 'surprised' || expr === 'wind') {
      ctx.fillStyle = '#75222b';
      ctx.beginPath(); ctx.ellipse(0, 23, 8, 10, 0, 0, Math.PI * 2); ctx.fill();
    } else if (expr === 'dizzy') {
      ctx.beginPath();
      ctx.moveTo(-11, 24); ctx.quadraticCurveTo(-5, 19, 0, 24); ctx.quadraticCurveTo(5, 29, 11, 23);
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(0, 18, 11, 0.25, Math.PI - 0.25); ctx.stroke();
    }
  }

  // ===================== BACKSTAGE WARDROBE TRUNK =====================
  function drawWardrobeTrunk() {
    if (trunkX > 1640) return;
    const tx = trunkX, ty = 92, tw = 670, th = 776;
    shelfHitBoxes = [];

    ctx.save();
    // Deep drop shadow
    ctx.fillStyle = 'rgba(8,12,20,0.48)';
    rr(ctx, tx - 14, ty + 14, tw + 24, th + 12, 24); ctx.fill();

    // Outer Riveted Vintage Flight-Case Trunk (rich navy-teal & mahogany, NO white boxes!)
    const caseG = ctx.createLinearGradient(tx, ty, tx + tw, ty + th);
    caseG.addColorStop(0, '#1e354a');
    caseG.addColorStop(0.5, '#172838');
    caseG.addColorStop(1, '#101d2b');
    ctx.fillStyle = caseG;
    rr(ctx, tx, ty, tw, th, 20); ctx.fill();

    // Brushed Brass Metallic Frame & Corner Protectors
    ctx.strokeStyle = '#c89b46'; ctx.lineWidth = 6;
    rr(ctx, tx + 3, ty + 3, tw - 6, th - 6, 18); ctx.stroke();

    // Corner brass plates
    [[tx, ty], [tx + tw - 28, ty], [tx, ty + th - 28], [tx + tw - 28, ty + th - 28]].forEach(([cx, cy]) => {
      ctx.fillStyle = '#d4a64a';
      rr(ctx, cx, cy, 28, 28, 6); ctx.fill();
      ctx.fillStyle = '#7a5a1e';
      ctx.beginPath(); ctx.arc(cx + 14, cy + 14, 3.5, 0, Math.PI * 2); ctx.fill();
    });

    // Warm Backstage Vanity Bulbs along top bar!
    const bulbCount = 9;
    for (let i = 0; i < bulbCount; i++) {
      const bx = tx + 52 + i * ((tw - 104) / (bulbCount - 1));
      const by = ty + 24;
      const glow = 0.8 + Math.sin(time * 4 + i * 0.7) * 0.2;
      const bg = ctx.createRadialGradient(bx, by, 2, bx, by, 22);
      bg.addColorStop(0, `rgba(255,248,200,${glow})`);
      bg.addColorStop(0.4, `rgba(255,214,110,${0.45 * glow})`);
      bg.addColorStop(1, 'rgba(255,190,70,0)');
      ctx.fillStyle = bg;
      ctx.beginPath(); ctx.arc(bx, by, 22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff9d6';
      ctx.beginPath(); ctx.arc(bx, by, 8, 0, Math.PI * 2); ctx.fill();
    }

    // Velvet-Lined Wooden Shelves for active categories
    const n = activeCats.length;
    const innerTop = ty + 52;
    const innerH = th - 72;
    const rowGap = 12;
    const rowH = (innerH - rowGap * (n - 1)) / n;
    const shelfTints = [
      ['#2c4d63', '#1d3647'],
      ['#47385c', '#302440'],
      ['#275452', '#193b39'],
      ['#5c3d38', '#3d2622'],
      ['#4c4a2e', '#33311d']
    ];

    activeCats.forEach((cat, rIdx) => {
      const ry = innerTop + rIdx * (rowH + rowGap);
      const rx = tx + 22, rw = tw - 44;

      // Recessed plush shelf bay
      const sg = ctx.createLinearGradient(rx, ry, rx, ry + rowH);
      sg.addColorStop(0, shelfTints[rIdx][1]);
      sg.addColorStop(1, shelfTints[rIdx][0]);
      ctx.fillStyle = sg;
      rr(ctx, rx, ry, rw, rowH, 14); ctx.fill();

      // Subtle diagonal stitched velvet texture lines
      ctx.save();
      rr(ctx, rx, ry, rw, rowH, 14); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,0.035)'; ctx.lineWidth = 2;
      for (let sx = -rowH; sx < rw + rowH; sx += 26) {
        ctx.beginPath(); ctx.moveTo(rx + sx, ry); ctx.lineTo(rx + sx + rowH, ry + rowH); ctx.stroke();
      }
      ctx.restore();

      // Brass shelf lip
      ctx.strokeStyle = 'rgba(218,175,85,0.45)'; ctx.lineWidth = 2;
      rr(ctx, rx, ry, rw, rowH, 14); ctx.stroke();

      // Category silhouette emblem on far left of shelf
      drawCategoryBadge(rx + 36, ry + rowH * 0.5, cat, !!lockedCats[cat]);

      // 4 Item Cushions per shelf
      const choices = shelfChoices[cat] || [];
      const padX = 76;
      const gapX = 12;
      const cw = (rw - padX - 14 - gapX * 3) / 4;
      const ch = rowH - 18;
      const cy = ry + 9;

      choices.forEach((id, cIdx) => {
        const cx = rx + padX + cIdx * (cw + gapX);
        const isSel = currentOutfit[cat] === id;
        const isLocked = lockedCats[cat] && isSel;
        const isHov = state === 'DRESS' && !lockedCats[cat] && hitRect(pointer.x, pointer.y, cx, cy, cw, ch);

        shelfHitBoxes.push({ cat, id, x: cx, y: cy, w: cw, h: ch });

        ctx.save();
        // Cushion base (colored velvet/leather — never white!)
        const cg = ctx.createRadialGradient(cx + cw * 0.5, cy + ch * 0.4, 8, cx + cw * 0.5, cy + ch * 0.5, cw * 0.72);
        if (isLocked) {
          cg.addColorStop(0, '#2c7a5f'); cg.addColorStop(1, '#164536');
        } else if (isSel) {
          cg.addColorStop(0, '#785a26'); cg.addColorStop(1, '#473311');
        } else if (isHov) {
          cg.addColorStop(0, '#3e5e78'); cg.addColorStop(1, '#233a4d');
        } else {
          cg.addColorStop(0, '#2a4154'); cg.addColorStop(1, '#192836');
        }
        ctx.fillStyle = cg;
        rr(ctx, cx, cy, cw, ch, 12); ctx.fill();

        // Active golden/emerald border
        ctx.strokeStyle = isLocked ? '#38d9a9' : isSel ? '#ffd166' : isHov ? '#8ecae6' : 'rgba(255,255,255,0.12)';
        ctx.lineWidth = (isSel || isLocked) ? 3.5 : 1.5;
        rr(ctx, cx, cy, cw, ch, 12); ctx.stroke();

        // Draw crisp procedural item inside cushion
        ctx.save();
        ctx.translate(cx + cw * 0.5, cy + ch * 0.52);
        const itemScale = clamp(Math.min(cw, ch) / 118, 0.72, 1.05) * (isHov ? 1.08 : 1);
        ctx.scale(itemScale, itemScale);
        drawItem(cat, id, 'icon');
        ctx.restore();

        // Subtle golden star pin if locked
        if (isLocked) {
          drawStarPath(ctx, cx + cw - 15, cy + 15, 5, 9, 4);
          ctx.fillStyle = '#38d9a9'; ctx.fill();
        }
        ctx.restore();
      });
    });

    ctx.restore();
  }

  function drawCategoryBadge(x, y, cat, locked) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = locked ? '#216e55' : '#132230';
    ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = locked ? '#38d9a9' : '#c89b46'; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.fillStyle = locked ? '#a8ffdf' : '#f2d48f';
    ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    if (cat === 'hat') {
      ctx.beginPath(); ctx.arc(0, 3, 10, Math.PI, 0); ctx.fill();
      ctx.fillRect(-13, 3, 26, 3.5);
    } else if (cat === 'glasses') {
      ctx.beginPath(); ctx.arc(-6, 0, 5, 0, Math.PI * 2); ctx.arc(6, 0, 5, 0, Math.PI * 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-1, 0); ctx.lineTo(1, 0); ctx.stroke();
    } else if (cat === 'jacket') {
      ctx.beginPath();
      ctx.moveTo(-8, -9); ctx.lineTo(-13, -3); ctx.lineTo(-9, 1); ctx.lineTo(-7, -2);
      ctx.lineTo(-7, 10); ctx.lineTo(7, 10); ctx.lineTo(7, -2); ctx.lineTo(9, 1);
      ctx.lineTo(13, -3); ctx.lineTo(8, -9); ctx.closePath(); ctx.fill();
    } else if (cat === 'prop') {
      drawStarPath(ctx, 0, 0, 5, 11, 5); ctx.fill();
    } else {
      ctx.beginPath();
      ctx.moveTo(-8, -9); ctx.lineTo(0, -9); ctx.lineTo(0, 1); ctx.lineTo(11, 4); ctx.lineTo(11, 9); ctx.lineTo(-8, 9);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

  // ===================== CLAPPERBOARD & MINIMAL BUTTONS =====================
  function drawClapperButton(cx, cy, w, h, ready = true, clapT = 0, big = false) {
    const hov = hitRect(pointer.x, pointer.y, cx - w * 0.5, cy - h * 0.5, w, h);
    ctx.save();
    ctx.translate(cx, cy);
    const pulse = ready ? 1 + Math.sin(time * 5.2) * 0.045 : 1;
    const sc = (hov && ready ? 1.08 : 1) * pulse;
    ctx.scale(sc, sc);

    // Warm golden aura when ready
    if (ready) {
      const ag = ctx.createRadialGradient(0, 0, w * 0.2, 0, 0, w * 0.85);
      ag.addColorStop(0, 'rgba(255,215,90,0.48)');
      ag.addColorStop(1, 'rgba(255,215,90,0)');
      ctx.fillStyle = ag;
      ctx.beginPath(); ctx.arc(0, 0, w * 0.85, 0, Math.PI * 2); ctx.fill();
    }

    // Shadow
    ctx.fillStyle = 'rgba(0,0,0,0.42)';
    rr(ctx, -w * 0.5 + 4, -h * 0.35 + 8, w, h * 0.85, 12); ctx.fill();

    // Clapper Slate Body (deep slate-navy, glossy)
    const sg = ctx.createLinearGradient(0, -h * 0.3, 0, h * 0.5);
    sg.addColorStop(0, ready ? '#243a4f' : '#262d38');
    sg.addColorStop(1, ready ? '#13212e' : '#181c24');
    ctx.fillStyle = sg;
    rr(ctx, -w * 0.5, -h * 0.28, w, h * 0.78, 12); ctx.fill();
    ctx.strokeStyle = ready ? '#ffd166' : '#4a5568';
    ctx.lineWidth = big ? 4 : 3;
    rr(ctx, -w * 0.5, -h * 0.28, w, h * 0.78, 12); ctx.stroke();

    // Play / Action Triangle Icon in center of slate (zero text!)
    ctx.fillStyle = ready ? '#38d9a9' : '#4a5568';
    ctx.beginPath();
    const tr = big ? 28 : 18;
    ctx.moveTo(-tr * 0.55, -tr * 0.72 + h * 0.12);
    ctx.lineTo(tr * 0.95, h * 0.12);
    ctx.lineTo(-tr * 0.55, tr * 0.72 + h * 0.12);
    ctx.closePath(); ctx.fill();

    // Lower striped bar
    drawStripeBar(-w * 0.5, -h * 0.28, w, h * 0.19, ready);

    // Upper hinged clapper stick!
    ctx.save();
    ctx.translate(-w * 0.5, -h * 0.28);
    const openAngle = clapT > 0
      ? -0.35 * (1 - clamp(clapT * 3, 0, 1))
      : ready ? (-0.28 - Math.sin(time * 4.5) * 0.08) : -0.06;
    ctx.rotate(openAngle);
    drawStripeBar(0, -h * 0.19, w, h * 0.19, ready);
    // Brass hinge rivet
    ctx.fillStyle = '#ffd166';
    ctx.beginPath(); ctx.arc(10, 0, big ? 7 : 5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    ctx.restore();
  }

  function drawStripeBar(x, y, w, h, bright) {
    ctx.save();
    rr(ctx, x, y, w, h, 4); ctx.clip();
    ctx.fillStyle = '#181e28'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = bright ? '#f7e5b7' : '#6c7585';
    const step = w / 5;
    for (let i = -1; i < 6; i++) {
      ctx.beginPath();
      ctx.moveTo(x + i * step, y + h);
      ctx.lineTo(x + i * step + step * 0.5, y + h);
      ctx.lineTo(x + i * step + step * 0.85, y);
      ctx.lineTo(x + i * step + step * 0.35, y);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }

    } else {
      ctx.strokeStyle = '#38d9a9'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(4, 0, 7, -0.7, 0.7); ctx.stroke();
      ctx.beginPath(); ctx.arc(4, 0, 12, -0.7, 0.7); ctx.stroke();
