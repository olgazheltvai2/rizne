<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кухня Шефа-Єнота</title>
<style>
  /* =========================================================
     ОСНОВНІ СТИЛІ ТА СКИДАННЯ
     Жодних білих прямокутників — усі елементи стилізовані
     під теплу дерев'яно-мідну кухню з об'ємними тінями.
     ========================================================= */
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #3b2314;
    font-family: Arial, sans-serif;
  }

  /* Головний контейнер гри на весь екран */
  #game-root {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  /* Живий сюжетний SVG-фон кухні */
  #bg-scene {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  /* Шар інтерфейсу: Єнот зліва + ігрова зона справа */
  #stage-layout {
    position: relative;
    z-index: 5;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 1.5vh 2.5vw 2.2vh 1.5vw;
    gap: 1.5vw;
  }

  /* Блок живого персонажа (Шеф-Єнот) */
  #character-zone {
    position: relative;
    width: 24vw;
    min-width: 200px;
    max-width: 340px;
    height: 62vh;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    z-index: 8;
  }

  #raccoon-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 14px 18px rgba(32, 14, 4, 0.45));
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Ігрова зона (завдання зверху + варіанти відповідей на столі знизу) */
  #puzzle-zone {
    flex: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding-top: 1.2vh;
    padding-bottom: 0.5vh;
    z-index: 7;
  }

  /* Область поточного завдання */
  #board-container {
    width: 100%;
    max-width: 960px;
    height: 69vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  #board-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 16px 24px rgba(34, 16, 6, 0.45));
  }

  /* Ряд із 4 керамічно-дерев'яних підставок для варіантів відповідей */
  #options-row {
    width: 100%;
    max-width: 920px;
    height: 23vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.8vw;
    padding: 0 1vw;
  }

  /* Окрема кнопка-підставка для відповіді (жодних білих прямокутників!) */
  .option-coaster {
    position: relative;
    flex: 1;
    max-width: 205px;
    height: 100%;
    max-height: 175px;
    border: none;
    background: transparent;
    cursor: pointer;
    padding: 0;
    outline: none;
    transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.2s ease;
    filter: drop-shadow(0 10px 12px rgba(28, 12, 3, 0.48));
  }

  .option-coaster:hover {
    transform: translateY(-9px) scale(1.05);
    filter: drop-shadow(0 18px 20px rgba(28, 12, 3, 0.55)) brightness(1.06);
  }

  .option-coaster:active {
    transform: translateY(-2px) scale(0.97);
  }

  .option-coaster.disabled {
    pointer-events: none;
  }

  .option-coaster.shake {
    animation: coasterShake 0.5s ease;
  }

  .option-coaster.pop-win {
    animation: coasterWin 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  /* Мінімалістичні латунні кнопки навігації (Назад / Далі) */
  .nav-btn {
    position: absolute;
    top: 2.2vh;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 3px solid #f7d58b;
    background: radial-gradient(circle at 32% 28%, #e6a94c 0%, #a86420 65%, #6e3a0c 100%);
    box-shadow:
      0 6px 14px rgba(26, 10, 2, 0.55),
      inset 0 2px 4px rgba(255, 245, 210, 0.65),
      inset 0 -3px 6px rgba(60, 25, 4, 0.6);
    cursor: pointer;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.18s ease;
  }

  .nav-btn:hover {
    transform: scale(1.1);
    filter: brightness(1.12);
  }

  .nav-btn:active {
    transform: scale(0.94);
  }

  #btn-prev { left: 1.8vw; }
  #btn-next { right: 1.8vw; }

  /* Шар для візуальних ефектів (конфетті, зірочки, хмарки борошна) */
  #fx-layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 25;
  }

  /* =========================================================
     АНІМАЦІЇ ФОНУ, ПЕРСОНАЖА ТА ІГРОВИХ ЕЛЕМЕНТІВ
     ========================================================= */
  @keyframes swayPan {
    0%, 100% { transform: rotate(-2.2deg); }
    50% { transform: rotate(2.2deg); }
  }

  @keyframes driftCloud {
    0% { transform: translateX(-40px); }
    100% { transform: translateX(260px); }
  }

  @keyframes steamRise {
    0% { transform: translateY(10px) scale(0.7); opacity: 0; }
    30% { opacity: 0.55; }
    100% { transform: translateY(-75px) scale(1.35); opacity: 0; }
  }

  @keyframes raccoonBreathe {
    0%, 100% { transform: translateY(0px) scaleY(1); }
    50% { transform: translateY(-4px) scaleY(1.015); }
  }

  @keyframes tailWag {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(9deg); }
  }

  @keyframes raccoonJump {
    0% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-34px) scale(1.06, 0.96); }
    55% { transform: translateY(-6px) scale(0.97, 1.04); }
    75% { transform: translateY(-20px) scale(1.03); }
    100% { transform: translateY(0) scale(1); }
  }

  @keyframes hatPop {
    0% { transform: translateY(0) rotate(0deg); }
    35% { transform: translateY(-38px) rotate(-14deg); }
    65% { transform: translateY(-22px) rotate(12deg); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  @keyframes raccoonShock {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-10px) rotate(-5deg); }
    40% { transform: translateX(10px) rotate(5deg); }
    60% { transform: translateX(-7px) rotate(-3deg); }
    80% { transform: translateX(6px) rotate(2deg); }
  }

  @keyframes coasterShake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px) rotate(-4deg); }
    40% { transform: translateX(10px) rotate(4deg); }
    60% { transform: translateX(-7px) rotate(-2deg); }
    80% { transform: translateX(5px) rotate(2deg); }
  }

  @keyframes coasterWin {
    0% { transform: scale(1); }
    40% { transform: scale(1.16) translateY(-14px); }
    100% { transform: scale(1.04) translateY(-4px); }
  }

  @keyframes pulseQuestion {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(1.12); opacity: 1; }
  }

  .pan-sway-1 { transform-origin: 495px 86px; animation: swayPan 5.4s ease-in-out infinite; }
  .pan-sway-2 { transform-origin: 605px 86px; animation: swayPan 6.7s ease-in-out infinite reverse; }
  .pan-sway-3 { transform-origin: 705px 86px; animation: swayPan 4.8s ease-in-out infinite; }
  .cloud-1 { animation: driftCloud 34s linear infinite; }
  .cloud-2 { animation: driftCloud 46s linear infinite -18s; }
  .steam-1 { animation: steamRise 3.2s ease-out infinite; }
  .steam-2 { animation: steamRise 3.2s ease-out infinite 1.1s; }
  .steam-3 { animation: steamRise 3.2s ease-out infinite 2.2s; }

  .raccoon-body-idle {
    transform-origin: 150px 320px;
    animation: raccoonBreathe 3.4s ease-in-out infinite;
  }

  .raccoon-tail {
    transform-origin: 95px 295px;
    animation: tailWag 2.8s ease-in-out infinite;
  }

  .raccoon-happy {
    animation: raccoonJump 0.85s ease-in-out;
  }

  .raccoon-happy #chef-hat {
    transform-origin: 155px 80px;
    animation: hatPop 0.85s ease-in-out;
  }

  .raccoon-shock {
    animation: raccoonShock 0.55s ease-in-out;
  }

  /* Адаптація під планшети й вужчі екрани */
  @media (max-width: 900px) {
    #character-zone { width: 22vw; min-width: 140px; height: 48vh; }
    .nav-btn { width: 48px; height: 48px; }
  }
</style>
</head>
<body>

<div id="game-root">

  <!-- =========================================================
       КНОПКИ НАВІГАЦІЇ (НАЗАД / ДАЛІ) БЕЗ ЗАЙВИХ СЛІВ
       ========================================================= -->
  <button id="btn-prev" class="nav-btn" aria-label="Попередній рівень">
    <svg width="26" height="26" viewBox="0 0 26 26">
      <path d="M17 4 L7 13 L17 22" fill="none" stroke="#fff7df" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <button id="btn-next" class="nav-btn" aria-label="Наступний рівень">
    <svg width="26" height="26" viewBox="0 0 26 26">
      <path d="M9 4 L19 13 L9 22" fill="none" stroke="#fff7df" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- =========================================================
       СЮЖЕТНИЙ ЖИВИЙ SVG-ФОН: ЗАТИШНА КУХНЯ ШЕФА-ЄНОТА
       ========================================================= -->
  <svg id="bg-scene" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
    <defs>
      <!-- Градієнти стін, неба, дерева та міді -->
      <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#f2cf9b"/>
        <stop offset="55%" stop-color="#dfad70"/>
        <stop offset="100%" stop-color="#b97b42"/>
      </linearGradient>

      <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#60b6f2"/>
        <stop offset="65%" stop-color="#a8dcf8"/>
        <stop offset="100%" stop-color="#eef7d8"/>
      </linearGradient>

      <linearGradient id="counterTopGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#a86736"/>
        <stop offset="22%" stop-color="#8b4d22"/>
        <stop offset="100%" stop-color="#5c2f11"/>
      </linearGradient>

      <linearGradient id="counterFrontGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#5a2e12"/>
        <stop offset="100%" stop-color="#2e1506"/>
      </linearGradient>

      <linearGradient id="copperGrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#f9c28c"/>
        <stop offset="40%" stop-color="#cf6f34"/>
        <stop offset="85%" stop-color="#8c3b14"/>
        <stop offset="100%" stop-color="#572108"/>
      </linearGradient>

      <linearGradient id="brassRail" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#fbe4a0"/>
        <stop offset="50%" stop-color="#c48a34"/>
        <stop offset="100%" stop-color="#704711"/>
      </linearGradient>

      <radialGradient id="sunGlow" cx="15%" cy="18%" r="55%">
        <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#fff8d6" stop-opacity="0"/>
      </radialGradient>

      <!-- Патерн теплої керамічної плитки на фартусі кухні -->
      <pattern id="tilePattern" width="76" height="44" patternUnits="userSpaceOnUse">
        <rect width="76" height="44" fill="#c78b56"/>
        <rect x="2" y="2" width="72" height="19" rx="3" fill="#e8be8a"/>
        <rect x="2" y="2" width="72" height="5" rx="2" fill="#f5d9b0" opacity="0.55"/>
        <rect x="-36" y="23" width="72" height="19" rx="3" fill="#dfb078"/>
        <rect x="40" y="23" width="72" height="19" rx="3" fill="#e5b882"/>
      </pattern>

      <!-- Патерн візерунку шпалер у верхній частині стіни -->
      <pattern id="wallStripe" width="60" height="60" patternUnits="userSpaceOnUse">
        <rect width="60" height="60" fill="none"/>
        <path d="M0 0 L0 60" stroke="#c68949" stroke-width="18" opacity="0.14"/>
        <circle cx="30" cy="30" r="3" fill="#fff2d6" opacity="0.22"/>
      </pattern>

      <!-- Маска для вікна -->
      <clipPath id="windowClip">
        <path d="M90 120 Q205 40 320 120 L320 420 L90 420 Z"/>
      </clipPath>
    </defs>

    <!-- Стіна та смугасті шпалери -->
    <rect width="1600" height="900" fill="url(#wallGrad)"/>
    <rect width="1600" height="470" fill="url(#wallStripe)"/>

    <!-- Керамічна плитка кухонного фартуха -->
    <rect x="0" y="450" width="1600" height="230" fill="url(#tilePattern)"/>
    <rect x="0" y="444" width="1600" height="12" fill="#7c471e"/>
    <rect x="0" y="444" width="1600" height="4" fill="#bd804b"/>

    <!-- Арочне вікно зліва з живими хмаринками -->
    <g id="kitchen-window">
      <g clip-path="url(#windowClip)">
        <rect x="85" y="45" width="240" height="380" fill="url(#skyGrad)"/>
        <!-- Далекі пагорби -->
        <ellipse cx="145" cy="405" rx="130" ry="60" fill="#7ab556"/>
        <ellipse cx="275" cy="415" rx="120" ry="52" fill="#5e9640"/>
        <!-- Хмарки, що повільно пливуть -->
        <g class="cloud-1" opacity="0.92">
          <ellipse cx="120" cy="155" rx="34" ry="18" fill="#ffffff"/>
          <ellipse cx="145" cy="148" rx="28" ry="20" fill="#ffffff"/>
          <ellipse cx="170" cy="158" rx="26" ry="14" fill="#ffffff"/>
        </g>
        <g class="cloud-2" opacity="0.8">
          <ellipse cx="90" cy="235" rx="26" ry="13" fill="#ffffff"/>
          <ellipse cx="115" cy="228" rx="22" ry="15" fill="#ffffff"/>
        </g>
      </g>
      <!-- Дерев'яна рама вікна -->
      <path d="M90 120 Q205 40 320 120 L320 420 L90 420 Z" fill="none" stroke="#6f3b17" stroke-width="14"/>
      <path d="M96 123 Q205 48 314 123 L314 414 L96 414 Z" fill="none" stroke="#a66432" stroke-width="4"/>
      <line x1="205" y1="78" x2="205" y2="420" stroke="#6f3b17" stroke-width="9"/>
      <line x1="90" y1="265" x2="320" y2="265" stroke="#6f3b17" stroke-width="9"/>
      <!-- Підвіконня та горщик із базиліком -->
      <rect x="74" y="416" width="262" height="22" rx="6" fill="#7d441d"/>
      <rect x="74" y="416" width="262" height="7" rx="3" fill="#b4713c"/>
      <g transform="translate(245, 355)">
        <path d="M12 36 L44 36 L39 64 L17 64 Z" fill="#c75d31"/>
        <rect x="8" y="28" width="40" height="10" rx="3" fill="#d96e3f"/>
        <ellipse cx="22" cy="18" rx="12" ry="8" transform="rotate(-25 22 18)" fill="#4ca146"/>
        <ellipse cx="36" cy="16" rx="13" ry="8" transform="rotate(25 36 16)" fill="#3b8838"/>
        <ellipse cx="28" cy="8" rx="11" ry="7" fill="#63be58"/>
      </g>
    </g>

    <!-- Латунна рейка з мідними сковорідками, що злегка гойдаються -->
    <g id="hanging-pans" opacity="0.92">
      <rect x="430" y="78" width="340" height="12" rx="6" fill="url(#brassRail)"/>
      <circle cx="445" cy="84" r="9" fill="#7a4c16"/>
      <circle cx="755" cy="84" r="9" fill="#7a4c16"/>

      <!-- Сковорідка 1 -->
      <g class="pan-sway-1">
        <path d="M495 86 L495 162" stroke="#5c2d10" stroke-width="7" stroke-linecap="round"/>
        <circle cx="495" cy="202" r="44" fill="url(#copperGrad)" stroke="#5c2509" stroke-width="3"/>
        <circle cx="495" cy="202" r="33" fill="#8f431a" opacity="0.45"/>
        <path d="M472 182 Q486 172 505 178" fill="none" stroke="#ffd8b0" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      </g>

      <!-- Сковорідка 2 -->
      <g class="pan-sway-2">
        <path d="M605 86 L605 148" stroke="#5c2d10" stroke-width="6" stroke-linecap="round"/>
        <circle cx="605" cy="182" r="34" fill="url(#copperGrad)" stroke="#5c2509" stroke-width="3"/>
        <circle cx="605" cy="182" r="24" fill="#8f431a" opacity="0.45"/>
        <path d="M588 168 Q600 160 614 166" fill="none" stroke="#ffd8b0" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      </g>

      <!-- Ополоник -->
      <g class="pan-sway-3">
        <path d="M705 86 L705 190" stroke="#7d4c1c" stroke-width="6" stroke-linecap="round"/>
        <ellipse cx="705" cy="202" rx="18" ry="15" fill="url(#copperGrad)" stroke="#5c2509" stroke-width="2.5"/>
      </g>
    </g>

    <!-- Верхня полиця з баночками спецій справа -->
    <g id="bg-shelf" transform="translate(1150, 120)" opacity="0.88">
      <rect x="0" y="75" width="380" height="18" rx="4" fill="#7c441c"/>
      <rect x="0" y="75" width="380" height="5" rx="2" fill="#b7733c"/>
      <path d="M35 93 L35 128 L65 93 Z" fill="#592e10"/>
      <path d="M345 93 L345 128 L315 93 Z" fill="#592e10"/>
      <!-- Декоративні баночки -->
      <g transform="translate(40, 18)">
        <rect x="0" y="12" width="42" height="46" rx="10" fill="#d97236" stroke="#703110" stroke-width="2"/>
        <rect x="5" y="18" width="10" height="32" rx="4" fill="#fff2dc" opacity="0.35"/>
        <rect x="4" y="4" width="34" height="10" rx="3" fill="#c9953b"/>
      </g>
      <g transform="translate(110, 10)">
        <rect x="0" y="14" width="46" height="52" rx="12" fill="#548c44" stroke="#2c5222" stroke-width="2"/>
        <rect x="6" y="20" width="10" height="36" rx="4" fill="#fff2dc" opacity="0.35"/>
        <rect x="6" y="4" width="34" height="11" rx="3" fill="#a83b2c"/>
      </g>
      <g transform="translate(185, 22)">
        <rect x="0" y="12" width="40" height="42" rx="9" fill="#e6b13c" stroke="#7d560d" stroke-width="2"/>
        <rect x="5" y="18" width="9" height="28" rx="4" fill="#fff2dc" opacity="0.4"/>
        <rect x="4" y="4" width="32" height="9" rx="3" fill="#6b3e1a"/>
      </g>
    </g>

    <!-- Мідний казанок із парою зліва на плиті -->
    <g id="steaming-pot" transform="translate(18, 560)">
      <path class="steam-1" d="M70 -10 Q55 -35 72 -58 Q88 -80 70 -105" fill="none" stroke="#fff8ec" stroke-width="8" stroke-linecap="round" opacity="0.4"/>
      <path class="steam-2" d="M105 -5 Q122 -30 102 -55 Q85 -78 106 -102" fill="none" stroke="#fff8ec" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
      <path class="steam-3" d="M88 -12 Q78 -35 92 -60" fill="none" stroke="#fff8ec" stroke-width="6" stroke-linecap="round" opacity="0.3"/>
      <ellipse cx="90" cy="40" rx="78" ry="18" fill="#592209"/>
      <path d="M18 40 C16 115, 32 130, 90 130 C148 130, 164 115, 162 40 Z" fill="url(#copperGrad)" stroke="#542108" stroke-width="3"/>
      <ellipse cx="90" cy="40" rx="72" ry="13" fill="#df8848" stroke="#63290b" stroke-width="2.5"/>
      <path d="M40 60 Q45 105 62 114" fill="none" stroke="#ffd8b4" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- Дерев'яна стільниця на передньому плані -->
    <g id="kitchen-counter">
      <rect x="0" y="655" width="1600" height="190" fill="url(#counterTopGrad)"/>
      <!-- Текстура деревних волокон -->
      <path d="M0 688 Q420 678 840 692 T1600 685" fill="none" stroke="#633212" stroke-width="3" opacity="0.35"/>
      <path d="M0 735 Q360 748 780 732 T1600 742" fill="none" stroke="#4a2209" stroke-width="3" opacity="0.3"/>
      <path d="M0 788 Q480 774 960 792 T1600 782" fill="none" stroke="#3c1b06" stroke-width="4" opacity="0.32"/>
      <!-- Світлий край стільниці -->
      <rect x="0" y="655" width="1600" height="8" fill="#cb8b52" opacity="0.7"/>
      <!-- Нижня передня кромка столу -->
      <rect x="0" y="842" width="1600" height="60" fill="url(#counterFrontGrad)"/>
      <rect x="0" y="842" width="1600" height="5" fill="#7c421a"/>
    </g>

    <!-- Теплий сонячний промінь з вікна -->
    <rect width="1600" height="900" fill="url(#sunGlow)"/>
  </svg>

  <!-- =========================================================
       ОСНОВНА СЦЕНА: ПЕРСОНАЖ + ІГРОВЕ ПОЛЕ + ВАРІАНТИ

<script>
/* ============================================================================
   1. ЗВУКОВИЙ РУШІЙ (WEB AUDIO API) — БАГАТІ, КУМЕДНІ ЗВУКИ БЕЗ ЖОДНИХ СЛІВ
   ============================================================================ */
const SoundFX = (() => {
  let ctx = null;
  function getCtx() {
    if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  // М'який дерев'яний клік при наведенні
  function hover() {
    const c = getCtx(), now = c.currentTime;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.exponentialRampToValueAtTime(680, now + 0.045);
    g.gain.setValueAtTime(0.06, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
    osc.connect(g); g.connect(c.destination);
    osc.start(now); osc.stop(now + 0.055);
  }

  // Дзвінкий звук перемикання рівня
  function nav() {
    const c = getCtx(), now = c.currentTime;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(360, now);
    osc.frequency.exponentialRampToValueAtTime(620, now + 0.09);
    g.gain.setValueAtTime(0.14, now);
    g.gain.exponentialRampToValueAtTime(0.001, now + 0.11);
    osc.connect(g); g.connect(c.destination);
    osc.start(now); osc.stop(now + 0.12);
  }

  // Веселе пищання/хіхікання єнота при кліку на нього
  function raccoonGiggle() {
    const c = getCtx(), now = c.currentTime;
    [540, 740, 620, 880].forEach((freq, i) => {
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = 'sine';
      const t = now + i * 0.065;
      osc.frequency.setValueAtTime(freq, t);
      osc.frequency.exponentialRampToValueAtTime(freq * 1.25, t + 0.055);
      g.gain.setValueAtTime(0.11, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
      osc.connect(g); g.connect(c.destination);
      osc.start(t); osc.stop(t + 0.065);
    });
  }

  // Різноманітні переможні фанфари (4 варіанти для живості)
  let winCounter = 0;
  function win() {
    const c = getCtx(), now = c.currentTime;
    const melodies = [
      [523.25, 659.25, 783.99, 1046.5],
      [587.33, 739.99, 880.0, 1174.66],
      [440.0, 554.37, 659.25, 880.0, 1108.73],
      [523.25, 659.25, 587.33, 783.99, 1046.5]
    ];
    const notes = melodies[winCounter++ % melodies.length];
    notes.forEach((f, idx) => {
      const t = now + idx * 0.085;
      const osc = c.createOscillator(), osc2 = c.createOscillator(), g = c.createGain();
      osc.type = 'triangle';
      osc2.type = 'sine';
      osc.frequency.setValueAtTime(f, t);
      osc2.frequency.setValueAtTime(f * 2, t);
      g.gain.setValueAtTime(0.16, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
      osc.connect(g); osc2.connect(g); g.connect(c.destination);
      osc.start(t); osc2.start(t);
      osc.stop(t + 0.38); osc2.stop(t + 0.38);
    });
  }

  // Кумедні неагресивні звуки помилки (3 варіанти: пружина, слайд, сковорідка)
  let errCounter = 0;
  function wrong() {
    const c = getCtx(), now = c.currentTime;
    const mode = errCounter++ % 3;
    const osc = c.createOscillator(), g = c.createGain();
    if (mode === 0) {
      // Кумедний "боїнг"
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(240, now);
      osc.frequency.exponentialRampToValueAtTime(115, now + 0.28);
      g.gain.setValueAtTime(0.12, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
    } else if (mode === 1) {
      // Свисток униз
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(480, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.32);
      g.gain.setValueAtTime(0.15, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
    } else {
      // Легкий дзвін каструльки
      osc.type = 'square';
      osc.frequency.setValueAtTime(290, now);
      osc.frequency.setValueAtTime(210, now + 0.11);
      g.gain.setValueAtTime(0.09, now);
      g.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
    }
    osc.connect(g); g.connect(c.destination);
    osc.start(now); osc.stop(now + 0.36);
  }

  // Грандіозна мелодія фіналу після 15 рівня
  function finale() {
    const c = getCtx(), now = c.currentTime;
    const notes = [523, 659, 784, 659, 784, 1046, 1318];
    notes.forEach((f, i) => {
      const t = now + i * 0.1;
      const osc = c.createOscillator(), g = c.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.17, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      osc.connect(g); g.connect(c.destination);
      osc.start(t); osc.stop(t + 0.48);
    });
  }

  return { hover, nav, raccoonGiggle, win, wrong, finale };
})();

/* ============================================================================
   2. ЖИВИЙ ПЕРСОНАЖ (ШЕФ-ЄНОТ): КЛІПАННЯ, ПОГЛЯД ЗА КУРСОРОМ ТА ЕМОЦІЇ
   ============================================================================ */
const Raccoon = (() => {
  const actor = document.getElementById('raccoon-actor');
  const eyesNormal = document.getElementById('eyes-normal');
  const eyesHappy = document.getElementById('eyes-happy');
  const eyesShock = document.getElementById('eyes-shock');
  const mouthNormal = document.getElementById('mouth-normal');
  const mouthHappy = document.getElementById('mouth-happy');
  const mouthShock = document.getElementById('mouth-shock');
  const pupilL = document.getElementById('pupil-l');
  const pupilR = document.getElementById('pupil-r');
  const lidL = document.getElementById('lid-l');
  const lidR = document.getElementById('lid-r');
  const flourNose = document.getElementById('flour-nose');
  const cheekL = document.getElementById('cheek-l');
  const cheekR = document.getElementById('cheek-r');
  let emotionTimer = null;

  // Стеження очима за рухом миші
  window.addEventListener('mousemove', (e) => {
    const rect = document.getElementById('raccoon-svg').getBoundingClientRect();
    const cx = rect.left + rect.width * 0.52;
    const cy = rect.top + rect.height * 0.42;
    const dx = Math.max(-1, Math.min(1, (e.clientX - cx) / 380));
    const dy = Math.max(-1, Math.min(1, (e.clientY - cy) / 320));
    const tx = dx * 5.2, ty = dy * 4.5;
    pupilL.setAttribute('transform', `translate(${tx.toFixed(1)}, ${ty.toFixed(1)})`);
    pupilR.setAttribute('transform', `translate(${tx.toFixed(1)}, ${ty.toFixed(1)})`);
  });

  // Природне кліпання кожні 3–5 секунд
  function scheduleBlink() {
    setTimeout(() => {
      if (eyesNormal.getAttribute('display') !== 'none') {
        lidL.setAttribute('ry', '19');
        lidR.setAttribute('ry', '19');
        setTimeout(() => {
          lidL.setAttribute('ry', '0');
          lidR.setAttribute('ry', '0');
        }, 140);
      }
      scheduleBlink();
    }, 2600 + Math.random() * 2800);
  }
  scheduleBlink();

  function setMood(mood, duration = 1200) {
    clearTimeout(emotionTimer);
    actor.classList.remove('raccoon-happy', 'raccoon-shock');
    void actor.offsetWidth; // скидання анімації

    eyesNormal.setAttribute('display', mood === 'normal' ? 'inline' : 'none');
    eyesHappy.setAttribute('display', mood === 'happy' ? 'inline' : 'none');
    eyesShock.setAttribute('display', mood === 'shock' ? 'inline' : 'none');

    mouthNormal.setAttribute('display', mood === 'normal' ? 'inline' : 'none');
    mouthHappy.setAttribute('display', mood === 'happy' ? 'inline' : 'none');
    mouthShock.setAttribute('display', mood === 'shock' ? 'inline' : 'none');

    flourNose.setAttribute('opacity', mood === 'shock' ? '1' : '0');
    cheekL.setAttribute('opacity', mood === 'happy' ? '0.78' : '0.35');
    cheekR.setAttribute('opacity', mood === 'happy' ? '0.78' : '0.35');

    if (mood === 'happy') actor.classList.add('raccoon-happy');
    if (mood === 'shock') actor.classList.add('raccoon-shock');

    if (mood !== 'normal' && duration > 0) {
      emotionTimer = setTimeout(() => setMood('normal', 0), duration);
    }
  }

  // Пасхалка: клік по єноту викликає сміх і підстрибування
  document.getElementById('character-zone').addEventListener('click', () => {
    SoundFX.raccoonGiggle();
    setMood('happy', 900);
  });

  return { setMood };
})();

/* ============================================================================
   3. ДЕТАЛІЗОВАНА SVG-БІБЛІОТЕКА ПРОДУКТІВ ТА ОБ'ЄКТІВ (БЕЗ ЕМОДЗІ!)
   Кожен об'єкт малюється в локальних координатах [-50..50, -50..50]
   ============================================================================ */
let uidCounter = 1;
const uid = (p) => `${p}_${uidCounter++}`;

const Art = {
  // Реалістичне яблуко з блиском і листочком
  apple() {
    const g = uid('ap');
    return `
      <defs>
        <radialGradient id="${g}" cx="35%" cy="30%" r="65%">
          <stop offset="0%" stop-color="#ff7a6b"/>

          <stop offset="100%" stop-color="#7c0e09"/>
        </radialGradient>
      </defs>
      <ellipse cx="0" cy="36" rx="24" ry="7" fill="#2a1105" opacity="0.28"/>
      <path d="M0 -24 C-18 -34, -38 -18, -34 8 C-30 30, -14 38, 0 32 C14 38, 30 30, 34 8 C38 -18, 18 -34, 0 -24 Z" fill="url(#${g})" stroke="#610c07" stroke-width="2.5"/>
      <path d="M-20 -12 C-24 -2, -22 10, -14 16" fill="none" stroke="#ffd2cc" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
      <path d="M-6 -24 Q0 -18 6 -24" fill="none" stroke="#6b0f0a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M0 -22 Q3 -36 10 -40" fill="none" stroke="#633614" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M4 -33 C16 -46, 32 -40, 26 -24 C16 -22, 8 -26, 4 -33 Z" fill="#4aa844" stroke="#235c1f" stroke-width="2"/>
      <path d="M6 -32 Q16 -34 22 -28" fill="none" stroke="#9be38a" stroke-width="1.5"/>
    `;
  },

  // Соковита груша
  pear() {
    const g = uid('pr');
    return `
      <defs>
        <radialGradient id="${g}" cx="36%" cy="38%" r="65%">
          <stop offset="0%" stop-color="#f7ea7c"/>
          <stop offset="55%" stop-color="#b8c934"/>
          <stop offset="100%" stop-color="#6c7d14"/>
        </radialGradient>

// Допоміжна функція малювання групи однакових або різних предметів (для вагів та рядів)
function renderItemGroup(items, scale = 1) {
  // items: масив об'єктів виду { type: 'apple', props: {} }
  const n = items.length;
  const layouts = {
    1: [[0, 0, 1.0]],
    2: [[-28, 2, 0.78], [28, 2, 0.78]],
    3: [[0, -20, 0.68], [-27, 16, 0.68], [27, 16, 0.68]],
    4: [[-25, -18, 0.62], [25, -18, 0.62], [-25, 20, 0.62], [25, 20, 0.62]],
    5: [[-28, -20, 0.56], [28, -20, 0.56], [0, 0, 0.56], [-28, 22, 0.56], [28, 22, 0.56]],
    6: [[-30, -18, 0.52], [0, -18, 0.52], [30, -18, 0.52], [-30, 18, 0.52], [0, 18, 0.52], [30, 18, 0.52]],
    8: [[-34,-18,0.45],[-11,-18,0.45],[11,-18,0.45],[34,-18,0.45],[-34,18,0.45],[-11,18,0.45],[11,18,0.45],[34,18,0.45]]
  };
  const coords = layouts[n] || layouts[4];
  return items.map((it, i) => {
    const [x, y, s] = coords[i] || [0, 0, 0.5];
    const svg = Art[it.type](it.props || {});
    return `<g transform="translate(${x}, ${y}) scale(${(s * scale).toFixed(2)})">${svg}</g>`;
  }).join('');
}

/* ============================================================================
   5. ВІЗУАЛЬНІ ЕФЕКТИ (ЗІРОЧКИ, КОНФЕТТІ, ХМАРКИ БОРОШНА)
   ============================================================================ */
const FX = (() => {
  const layer = document.getElementById('fx-layer');

  function burstStars(cx = 920, cy = 400, count = 26) {
    const colors = ['#ffe156', '#ff6b6b', '#55efc4', '#74b9ff', '#ff9ff3', '#ffa502'];
    for (let i = 0; i < count; i++) {
      const el = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
      const size = 8 + Math.random() * 14;
      el.setAttribute('points', `0,${-size} ${size*0.32},${-size*0.32} ${size},0 ${size*0.32},${size*0.32} 0,${size} ${-size*0.32},${size*0.32} ${-size},0 ${-size*0.32},${-size*0.32}`);
      el.setAttribute('fill', colors[i % colors.length]);
      layer.appendChild(el);

      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const dist = 110 + Math.random() * 260;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist - 60;
      const rot = (Math.random() - 0.5) * 360;

      const anim = el.animate([
        { transform: `translate(${cx}px, ${cy}px) scale(0.2) rotate(0deg)`, opacity: 1 },
        { transform: `translate(${cx + dx}px, ${cy + dy}px) scale(1.1) rotate(${rot}deg)`, opacity: 0 }
      ], { duration: 850 + Math.random() * 450, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
      anim.onfinish = () => el.remove();
    }
  }

  // Кумедна хмарка борошна при помилці
  function flourPuff(cx = 240, cy = 540) {
    for (let i = 0; i < 12; i++) {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('r', 12 + Math.random() * 22);
      c.setAttribute('fill', '#fffaf0');
      layer.appendChild(c);
      const angle = Math.random() * Math.PI * 2;
      const dist = 35 + Math.random() * 90;
      const anim = c.animate([
        { transform: `translate(${cx}px, ${cy}px) scale(0.3)`, opacity: 0.9 },
        { transform: `translate(${cx + Math.cos(angle)*dist}px, ${cy + Math.sin(angle)*dist}px) scale(1.5)`, opacity: 0 }
      ], { duration: 600 + Math.random() * 250, easing: 'ease-out' });
      anim.onfinish = () => c.remove();
    }
  }

  return { burstStars, flourPuff };
})();

// Перемішування масиву варіантів відповідей
function shuffle(arr) {
  const copy = [...arr];
  for (let i = copy.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  return copy;
}

          <line x1="245" y1="-28" x2="325" y2="108" stroke="#c9933a" stroke-width="3.5"/>
          <line x1="245" y1="-28" x2="245" y2="108" stroke="#a67222" stroke-width="2.5"/>
          <g id="pan-right-content" transform="translate(245, 58)">
            <circle cx="0" cy="0" r="44" fill="url(#goldGlow)"/>
            <circle cx="0" cy="0" r="34" fill="none" stroke="#ffe494" stroke-width="3.5" stroke-dasharray="8 6"/>
            <text x="0" y="15" text-anchor="middle" font-size="44" font-weight="bold" fill="#ffe494">?</text>
          </g>
          <path d="M152 106 Q245 148 338 106 Z" fill="url(#brassBeam)" stroke="#5c3607" stroke-width="3"/>
          <ellipse cx="245" cy="106" rx="93" ry="12" fill="#f7ce74" stroke="#5c3607" stroke-width="2.5"/>
        </g>
      </g>
      <circle cx="0" cy="-28" r="10" fill="#fff2c2" stroke="#5c3607" stroke-width="2.5"/>
    </g>
  `;
}

// --- РЕЖИМ 2: СЛАНЦЕВА ДОШКА-МАТРИЦЯ 3x3 ---
function renderMatrixBoard(lvl) {
  const cell = 136, gap = 16;
  const gridW = cell * 3 + gap * 2;
  const startX = (940 - gridW) / 2;
  const startY = 44;

  const cellsHtml = lvl.grid.map((item, idx) => {
    const r = Math.floor(idx / 3), c = idx % 3;
    const cx = startX + c * (cell + gap) + cell / 2;
    const cy = startY + r * (cell + gap) + cell / 2;
    if (!item) {
      return `
        <g id="matrix-target-slot" transform="translate(${cx}, ${cy})">
          <rect x="${-cell/2}" y="${-cell/2}" width="${cell}" height="${cell}" rx="18" fill="#4f3923" stroke="#f7cb68" stroke-width="4" stroke-dasharray="10 7"/>
          <g id="matrix-target-content">
            <text x="0" y="20" text-anchor="middle" font-size="60" font-weight="bold" fill="#ffe082">?</text>
          </g>
        </g>
      `;
    }
    return `
      <g transform="translate(${cx}, ${cy})">
        <rect x="${-cell/2}" y="${-cell/2}" width="${cell}" height="${cell}" rx="18" fill="url(#tileRecess)" stroke="#735b46" stroke-width="2.5"/>
        <g transform="scale(1.18)">${Art[item.type](item.props || {})}</g>
      </g>
    `;
  }).join('');

  boardSvg.innerHTML = `
    ${sharedBoardDefs()}
    <!-- Сланцеве деко з латунними ручками -->
    <g>
      <path d="M168 210 C128 210, 128 330, 168 330" fill="none" stroke="url(#brassBeam)" stroke-width="14" stroke-linecap="round"/>
      <path d="M772 210 C812 210, 812 330, 772 330" fill="none" stroke="url(#brassBeam)" stroke-width="14" stroke-linecap="round"/>
      <rect x="178" y="12" width="584" height="516" rx="28" fill="url(#woodFrame)" stroke="#4a2409" stroke-width="4"/>
      <rect x="196" y="26" width="548" height="488" rx="20" fill="url(#slateGrad)"/>
      ${cellsHtml}
    </g>
  `;
}

// --- РЕЖИМ 3: ДЕРЕВ'ЯНА ПОЛИЦЯ-ПОСЛІДОВНІСТЬ ---
function renderSequenceBoard(lvl) {
  const count = lvl.slots.length + 1; // 4 предмети + 1 знак питання
  const slotW = 152, gap = 22;
  const totalW = count * slotW + (count - 1) * gap;
  const startX = (940 - totalW) / 2;

  const slotsHtml = lvl.slots.map((items, i) => {
    const cx = startX + i * (slotW + gap) + slotW / 2;
    return `
      <g transform="translate(${cx}, 255)">
        <rect x="-74" y="-86" width="148" height="162" rx="22" fill="url(#tileRecess)" stroke="#9e6d3e" stroke-width="3"/>
        <g transform="scale(1.08)">${renderItemGroup(items, 1)}</g>
        <!-- Стрілка переходу до наступного кроку -->
        <path d="M78 -4 L94 -4" stroke="#f7d58b" stroke-width="5" stroke-linecap="round"/>
        <polygon points="94,-11 106,-4 94,3" fill="#f7d58b"/>
      </g>
    `;
  }).join('');

  const qx = startX + lvl.slots.length * (slotW + gap) + slotW / 2;

  boardSvg.innerHTML = `
    ${sharedBoardDefs()}
    <!-- Велика різьблена кухонна полиця з декоративною спинкою -->
    <g>
      <rect x="24" y="102" width="892" height="290" rx="28" fill="url(#woodFrame)" stroke="#4a2409" stroke-width="4"/>
      <rect x="42" y="120" width="856" height="248" rx="18" fill="url(#slateGrad)"/>
      <!-- Латунні заклепки по кутах -->
      <circle cx="58" cy="136" r="6" fill="#e6b050"/>
      <circle cx="882" cy="136" r="6" fill="#e6b050"/>
      <circle cx="58" cy="352" r="6" fill="#e6b050"/>
      <circle cx="882" cy="352" r="6" fill="#e6b050"/>

      ${slotsHtml}

      <!-- Останній слот зі знаком питання -->
      <g transform="translate(${qx}, 255)">
        <rect id="seq-target-frame" x="-74" y="-86" width="148" height="162" rx="22" fill="#4f3923" stroke="#f7cb68" stroke-width="4.5" stroke-dasharray="10 7"/>
        <g id="seq-target-content">
          <text x="0" y="22" text-anchor="middle" font-size="66" font-weight="bold" fill="#ffe082">?</text>
        </g>
      </g>

      <!-- Масивна нижня дошка полиці -->
      <rect x="12" y="384" width="916" height="32" rx="10" fill="url(#woodFrame)" stroke="#421f07" stroke-width="3.5"/>
      <rect x="20" y="387" width="900" height="7" rx="3" fill="#d99659" opacity="0.55"/>
    </g>
  `;
}

/* ============================================================================
   7. РЕНДЕРИНГ 4 ВАРІАНТІВ ВІДПОВІДЕЙ НА КЕРАМІЧНИХ ПІДСТАВКАХ
   ============================================================================ */
function renderOptions(lvl) {
  optionsRow.innerHTML = '';
  const shuffled = shuffle(lvl.options);

  shuffled.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'option-coaster';
    const gId = uid('cst');
    const contentSvg = lvl.mode === 'matrix'
      ? `<g transform="translate(95, 84) scale(1.22)">${Art[opt.item.type](opt.item.props || {})}</g>`
      : `<g transform="translate(95, 84) scale(1.12)">${renderItemGroup(opt.items, 1)}</g>`;

    btn.innerHTML = `
      <svg viewBox="0 0 190 170" width="100%" height="100%">
        <defs>
          <radialGradient id="${gId}" cx="35%" cy="28%" r="72%">
            <stop offset="0%" stop-color="#f5d59c"/>
            <stop offset="68%" stop-color="#c98842"/>
            <stop offset="100%" stop-color="#874c1c"/>
          </radialGradient>
        </defs>
        <!-- Стилізована дерев'яно-керамічна підставка з латунним обідком -->
        <rect x="8" y="10" width="174" height="150" rx="32" fill="url(#${gId})" stroke="#54290b" stroke-width="4"/>
        <rect x="18" y="20" width="154" height="130" rx="24" fill="#402d22" stroke="#f2c97d" stroke-width="2.5"/>
        <ellipse cx="95" cy="85" rx="64" ry="52" fill="#594132" opacity="0.55"/>
        ${contentSvg}
      </svg>
    `;

    btn.addEventListener('mouseenter', () => { if (!isLocked) SoundFX.hover(); });
    btn.addEventListener('click', () => handleChoice(lvl, opt, btn));
    optionsRow.appendChild(btn);
  });
}

/* ============================================================================
   8. ОБРОБКА ВІДПОВІДІ, ФІЗИКА ВАГІВ ТА ПЕРЕХІД МІЖ РІВНЯМИ
   ============================================================================ */
function handleChoice(lvl, opt, btn) {
  if (isLocked) return;
  isLocked = true;

  // Відображаємо обраний варіант прямо на ігровій дошці
  if (lvl.mode === 'scale') {
    const panRightContent = document.getElementById('pan-right-content');
    const beam = document.getElementById('scale-beam');
    const ptr = document.getElementById('scale-pointer');
    const panL = document.getElementById('pan-left');
    const panR = document.getElementById('pan-right');

    panRightContent.innerHTML = renderItemGroup(opt.items, 1.0);

    // Реалістичний нахил вагів залежно від ваги обраного варіанту
    let angle = 0;
    if (opt.weight < lvl.targetWeight) angle = -13;     // залегко — ліва чаша переважає
    else if (opt.weight > lvl.targetWeight) angle = 13; // заважко — права чаша падає вниз

    beam.style.transform = `rotate(${angle}deg)`;
    ptr.style.transform = `rotate(${angle}deg)`;
    panL.style.transform = `rotate(${-angle}deg)`;
    panR.style.transform = `rotate(${-angle}deg)`;
  } else if (lvl.mode === 'matrix') {
    document.getElementById('matrix-target-content').innerHTML =
      `<g transform="scale(1.18)">${Art[opt.item.type](opt.item.props || {})}</g>`;
  } else if (lvl.mode === 'sequence') {
    document.getElementById('seq-target-content').innerHTML =
      `<g transform="scale(1.08)">${renderItemGroup(opt.items, 1)}</g>`;
  }

  if (opt.correct) {
    // ПРАВИЛЬНА ВІДПОВІДЬ: яскравий фідбек без слів
    btn.classList.add('pop-win');
    SoundFX.win();
    Raccoon.setMood('happy', 1450);
    FX.burstStars(920, 380, 30);

    setTimeout(() => {
      if (currentLevel === LEVELS.length - 1) {
        showFinale();
      } else {
        loadLevel(currentLevel + 1);
      }
    }, 1500);
  } else {
    // ПОМИЛКА: кумедна реакція єнота, борошно та швидке повернення до спроби
    btn.classList.add('shake');
    SoundFX.wrong();
    Raccoon.setMood('shock', 1000);
    FX.flourPuff(255, 560);

    setTimeout(() => {
      btn.classList.remove('shake');
      // Повертаємо знак питання, щоб дитина могла спробувати ще
      if (lvl.mode === 'scale') {
        document.getElementById('pan-right-content').innerHTML = `
          <circle cx="0" cy="0" r="44" fill="url(#goldGlow)"/>
          <circle cx="0" cy="0" r="34" fill="none" stroke="#ffe494" stroke-width="3.5" stroke-dasharray="8 6"/>
          <text x="0" y="15" text-anchor="middle" font-size="44" font-weight="bold" fill="#ffe494">?</text>
        `;
        const beam = document.getElementById('scale-beam');
        const ptr = document.getElementById('scale-pointer');
        const panL = document.getElementById('pan-left');
        const panR = document.getElementById('pan-right');
        beam.style.transform = 'rotate(-11deg)';
        ptr.style.transform = 'rotate(-11deg)';
        panL.style.transform = 'rotate(11deg)';
        panR.style.transform = 'rotate(11deg)';
      } else if (lvl.mode === 'matrix') {
        document.getElementById('matrix-target-content').innerHTML =
          `<text x="0" y="20" text-anchor="middle" font-size="60" font-weight="bold" fill="#ffe082">?</text>`;
      } else if (lvl.mode === 'sequence') {
        document.getElementById('seq-target-content').innerHTML =
          `<text x="0" y="22" text-anchor="middle" font-size="66" font-weight="bold" fill="#ffe082">?</text>`;
      }
      isLocked = false;
    }, 950);
  }
}

// Святковий фінал після проходження всіх 15 завдань (без жодного тексту)
function showFinale() {
  isLocked = false;
  SoundFX.finale();
  Raccoon.setMood('happy', 3500);
  FX.burstStars(800, 320, 45);
  setTimeout(() => FX.burstStars(520, 400, 32), 350);
  setTimeout(() => FX.burstStars(1120, 380, 32), 650);

  boardSvg.innerHTML = `
    ${sharedBoardDefs()}
    <g transform="translate(470, 270)" style="cursor:pointer" id="finale-cake">
      <circle cx="0" cy="0" r="210" fill="url(#goldGlow)"/>
      <!-- Великий триповерховий святковий торт -->
      <ellipse cx="0" cy="145" rx="165" ry="30" fill="url(#brassBeam)" stroke="#5c3607" stroke-width="4"/>
      <rect x="-125" y="55" width="250" height="86" rx="14" fill="#f7c873" stroke="#754112" stroke-width="4"/>
      <rect x="-125" y="92" width="250" height="16" fill="#eb547c"/>
      <rect x="-88" y="-22" width="176" height="78" rx="14" fill="#ffe1a8" stroke="#754112" stroke-width="4"/>
      <rect x="-88" y="14" width="176" height="14" fill="#5fd1a4"/>
      <rect x="-52" y="-88" width="104" height="68" rx="12" fill="#f78fb3" stroke="#75213d" stroke-width="4"/>
      <!-- Свічка та золота зірка зверху -->
      <rect x="-7" y="-140" width="14" height="52" rx="4" fill="#fff5d6" stroke="#855f1d" stroke-width="2.5"/>
      <path d="M0 -178 Q16 -156 0 -140 Q-16 -156 0 -178 Z" fill="#ff9f1a"/>
      <circle cx="0" cy="-152" r="5" fill="#fff7b0"/>
      <!-- Декоративні вишеньки -->
      <g transform="translate(-85, 42) scale(0.55)">${Art.cherry()}</g>
      <g transform="translate(85, 42) scale(0.55)">${Art.cherry()}</g>
      <g transform="translate(0, -34) scale(0.55)">${Art.cherry()}</g>
    </g>
  `;
  optionsRow.innerHTML = '';

  // Клік по святковому торту запускає гру спочатку
  document.getElementById('finale-cake').addEventListener('click', () => {
    SoundFX.nav();
    loadLevel(0);
  });
}

// Завантаження конкретного рівня за індексом
function loadLevel(index) {
  currentLevel = (index + LEVELS.length) % LEVELS.length;
  isLocked = false;
  const lvl = LEVELS[currentLevel];

  if (lvl.mode === 'scale') renderScaleBoard(lvl);
  else if (lvl.mode === 'matrix') renderMatrixBoard(lvl);
  else if (lvl.mode === 'sequence') renderSequenceBoard(lvl);

  renderOptions(lvl);
}

/* ============================================================================
   9. НАВІГАЦІЯ (КНОПКИ НАЗАД / ДАЛІ ТА СТРІЛКИ НА КЛАВІАТУРІ)
   ============================================================================ */
document.getElementById('btn-prev').addEventListener('click', () => {
  SoundFX.nav();
  loadLevel(currentLevel - 1);
});

document.getElementById('btn-next').addEventListener('click', () => {
  SoundFX.nav();
  loadLevel(currentLevel + 1);
});

window.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowLeft') { SoundFX.nav(); loadLevel(currentLevel - 1); }
  if (e.key === 'ArrowRight') { SoundFX.nav(); loadLevel(currentLevel + 1); }
});

// Старт гри з 1-го рівня
loadLevel(0);
</script>
