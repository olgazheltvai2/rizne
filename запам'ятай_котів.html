<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cats Room Memory</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #261710 0%, #120a06 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  /* Ornate carved wood frame feeling around the widescreen canvas */
  #stage-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: repeating-linear-gradient(
      45deg,
      #1a0f0a,
      #1a0f0a 14px,
      #22140d 14px,
      #22140d 28px
    );
  }
  canvas {
    display: block;
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.85),
      0 0 0 6px #3d2314,
      0 0 0 10px #8c6239,
      0 0 0 14px #24130b;
    border-radius: 14px;
    cursor: pointer;
    touch-action: none;
  }
</style>
</head>
<body>

<div id="stage-container">
  <canvas id="gameCanvas" width="1920" height="1080"></canvas>
</div>

<script>
/**
 * WORDLESS WIDESCREEN MEMORY GAME: 4 REALISTIC CATS IN A LIVING ROOM
 * Pure procedural HTML5 Canvas + Web Audio API synthesizer.
 * Zero text, zero white rectangles, infinite generator, rich animations.
 */

(function () {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');

  const W = 1920;
  const H = 1080;

  // Responsive 16:9 widescreen scaling
  function resizeCanvas() {
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    const targetRatio = W / H;
    const winRatio = winW / winH;

    let drawW, drawH;
    if (winRatio > targetRatio) {
      drawH = winH * 0.97;
      drawW = drawH * targetRatio;
    } else {
      drawW = winW * 0.98;
      drawH = drawW / targetRatio;
    }
    canvas.style.width = `${Math.floor(drawW)}px`;
    canvas.style.height = `${Math.floor(drawH)}px`;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ============================================================================
  // WEB AUDIO API SOUND SYNTHESIZER (No external audio files)
  // ============================================================================
  class SoundEngine {
    constructor() {
      this.ctx = null;
    }

    init() {
      if (!this.ctx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          this.ctx = new AudioCtx();
        }
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }

    // Crisp mechanical light switch click
    playSwitchClick(pitchOffset = 1) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(950 * pitchOffset, now);
      osc.frequency.exponentialRampToValueAtTime(180 * pitchOffset, now + 0.045);

      gain.gain.setValueAtTime(0.35, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.048);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.05);
    }

    // Electric bulb flicker buzz
    playBulbBuzz(duration = 0.09) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(110, now);

      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.005, now + duration);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    // Soft padded cat footsteps scurrying in the dark
    playDarkScurry() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      for (let i = 0; i < 6; i++) {
        const t = now + i * 0.11 + Math.random() * 0.03;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(160 + (i % 2) * 45, t);
        osc.frequency.exponentialRampToValueAtTime(55, t + 0.06);

        gain.gain.setValueAtTime(0.14, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.065);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.07);
      }
    }

    // Expressive synthesized cat meow + purr
    playHappyMeow(catIndex = 0, celebrationStyle = 0) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;

      // Pitch tailored to each cat
      const basePitches = [520, 440, 390, 480];
      const base = basePitches[catIndex % 4];

      // 1) Melodic Meow formant contour
      const meowOsc = this.ctx.createOscillator();
      const meowGain = this.ctx.createGain();
      const filter = this.ctx.createBiquadFilter();

      meowOsc.type = 'sawtooth';
      meowOsc.frequency.setValueAtTime(base * 0.85, now);
      meowOsc.frequency.linearRampToValueAtTime(base * 1.45, now + 0.14);
      meowOsc.frequency.exponentialRampToValueAtTime(base * 1.05, now + 0.42);

      filter.type = 'bandpass';
      filter.frequency.setValueAtTime(1200, now);
      filter.frequency.linearRampToValueAtTime(2100, now + 0.15);
      filter.frequency.linearRampToValueAtTime(950, now + 0.42);
      filter.Q.value = 3.2;

      meowGain.gain.setValueAtTime(0.001, now);
      meowGain.gain.linearRampToValueAtTime(0.22, now + 0.06);
      meowGain.gain.exponentialRampToValueAtTime(0.001, now + 0.44);

      meowOsc.connect(filter);
      filter.connect(meowGain);
      meowGain.connect(this.ctx.destination);
      meowOsc.start(now);
      meowOsc.stop(now + 0.46);

      // 2) Celebratory musical fanfare (varies by celebrationStyle)
      const chords = [
        [523.25, 659.25, 783.99, 1046.50, 1318.51], // C major sparkle
        [587.33, 739.99, 880.00, 1174.66, 1479.98], // D major bright
        [440.00, 554.37, 659.25, 880.00, 1108.73],  // A major warm
        [493.88, 622.25, 739.99, 987.77, 1244.51]   // B major royal
      ];
      const notes = chords[celebrationStyle % chords.length];
      notes.forEach((freq, idx) => {
        const t = now + 0.08 + idx * 0.075;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = celebrationStyle % 2 === 0 ? 'triangle' : 'sine';
        osc.frequency.setValueAtTime(freq, t);

        gain.gain.setValueAtTime(0.001, t);
        gain.gain.linearRampToValueAtTime(0.18, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.48);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.5);
      });
    }

    // Questioning "Mrrp?" when clicking a cat that did NOT move
    playWrongCatMrrp(catIndex = 0) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const base = 310 + (catIndex % 4) * 35;

      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(base, now);
      osc.frequency.linearRampToValueAtTime(base * 0.78, now + 0.14);
      osc.frequency.linearRampToValueAtTime(base * 0.92, now + 0.26);

      gain.gain.setValueAtTime(0.001, now);
      gain.gain.linearRampToValueAtTime(0.22, now + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.3);
    }

    // Distractor: Puppy playful yip
    playPuppyYip() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [0, 0.16].forEach((offset, i) => {
        const t = now + offset;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(380 + i * 60, t);
        osc.frequency.exponentialRampToValueAtTime(680 + i * 80, t + 0.06);
        osc.frequency.exponentialRampToValueAtTime(260, t + 0.12);

        gain.gain.setValueAtTime(0.16, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.13);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.14);
      });
    }

    // Distractor: Parrot tropical chirp
    playParrotChirp() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1100, now);
      osc.frequency.exponentialRampToValueAtTime(2200, now + 0.07);
      osc.frequency.exponentialRampToValueAtTime(950, now + 0.14);
      osc.frequency.exponentialRampToValueAtTime(1850, now + 0.22);

      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.25);
    }

    // Distractor: Mouse high squeak
    playMouseSqueak() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(2400, now);
      osc.frequency.linearRampToValueAtTime(3100, now + 0.05);
      osc.frequency.linearRampToValueAtTime(2200, now + 0.11);

      gain.gain.setValueAtTime(0.12, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.13);
    }

    // Distractor: Aquarium water bubble plop
    playBubbleSplash() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      [0, 0.07, 0.15].forEach((off, i) => {
        const t = now + off;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(350 + i * 140, t);
        osc.frequency.exponentialRampToValueAtTime(980 + i * 180, t + 0.065);

        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.07);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.08);
      });
    }

    // Distractor: Soft yarn roll / chime
    playSoftThump() {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(280, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.14);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(now);
      osc.stop(now + 0.16);
    }

    // Memory Peek toggle shimmer
    playMemoryShimmer(entering = true) {
      this.init();
      if (!this.ctx) return;
      const now = this.ctx.currentTime;
      const freqs = entering ? [784, 659, 523, 392] : [392, 523, 659, 784];
      freqs.forEach((f, idx) => {
        const t = now + idx * 0.045;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, t);

        gain.gain.setValueAtTime(0.12, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.22);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.24);
      });
    }
  }

  const sound = new SoundEngine();

  // ============================================================================
  // ROOM CAT SPOTS (11 distinct cozy places in the living room)
  // ============================================================================
  const SPOTS = [
    { id: 'bookshelf_top',   x: 205,  y: 208, pose: 'lounge', scale: 0.88, flip: 1,  layer: 'mid' },
    { id: 'window_sill',     x: 410,  y: 482, pose: 'sit',    scale: 0.92, flip: 1,  layer: 'mid' },
    { id: 'curtain_peek',    x: 562,  y: 500, pose: 'peek',   scale: 0.92, flip: -1, layer: 'mid_front' },
    { id: 'cardboard_box',   x: 215,  y: 855, pose: 'box',    scale: 0.98, flip: 1,  layer: 'front' },
    { id: 'under_table',     x: 465,  y: 810, pose: 'loaf',   scale: 0.88, flip: 1,  layer: 'mid' },
    { id: 'sofa_cushion',    x: 805,  y: 642, pose: 'curl',   scale: 0.96, flip: 1,  layer: 'mid_front' },
    { id: 'ottoman_top',     x: 885,  y: 865, pose: 'loaf',   scale: 1.02, flip: -1, layer: 'front' },
    { id: 'clock_top',       x: 1170, y: 184, pose: 'lounge', scale: 0.85, flip: -1, layer: 'mid' },
    { id: 'fireplace_hearth',x: 1455, y: 815, pose: 'curl',   scale: 0.96, flip: -1, layer: 'front' },
    { id: 'armchair_seat',   x: 1685, y: 668, pose: 'sit',    scale: 0.96, flip: -1, layer: 'mid_front' },
    { id: 'woven_basket',    x: 1720, y: 895, pose: 'box',    scale: 0.98, flip: -1, layer: 'front' }
  ];

  // ============================================================================
  // THE 4 CATS DEFINITIONS (White, Ginger, Grey, Black)
  // ============================================================================
  const CAT_DEFS = [
    {
      id: 'white',
      index: 0,
      baseColor: '#f7f4ef',
      midColor: '#e6dfd5',
      shadowColor: '#c7bdb0',
      earInner: '#f2b6bc',
      noseColor: '#f09ca6',
      eyeColor: '#3aa6ff',
      eyeRim: '#1a5c96',
      stripes: false,
      fluffy: true
    },
    {
      id: 'ginger',
      index: 1,
      baseColor: '#e87a24',
      midColor: '#cf5f10',
      shadowColor: '#993d04',
      bellyColor: '#fae3c6',
      earInner: '#e89b8c',
      noseColor: '#d96b59',
      eyeColor: '#48c957',
      eyeRim: '#1a6624',
      stripes: true,
      stripeColor: '#8c3200',
      fluffy: false
    },
    {
      id: 'grey',
      index: 2,
      baseColor: '#84919e',
      midColor: '#667380',
      shadowColor: '#47525e',
      earInner: '#b8949c',
      noseColor: '#524952',
      eyeColor: '#f5a623',
      eyeRim: '#8c5300',
      stripes: false,
      fluffy: true
    },
    {
      id: 'black',
      index: 3,
      baseColor: '#23232b',
      midColor: '#16161c',
      shadowColor: '#0b0b0f',
      shineColor: '#44465e',
      earInner: '#4d3b44',
      noseColor: '#36343d',
      eyeColor: '#c8f526',
      eyeRim: '#5c7800',
      stripes: false,
      fluffy: false
    }
  ];

  // ============================================================================
  // DISTRACTOR POSITIONS & STATES
  // ============================================================================
  const PUPPY_SPOTS = [
    { x: 1155, y: 905, flip: -1 },
    { x: 615,  y: 900, flip: 1  },
    { x: 1320, y: 935, flip: -1 }
  ];

  const MOUSE_HOLES = [
    { x: 335,  y: 742, flip: 1  },
    { x: 1085, y: 742, flip: -1 },
    { x: 1595, y: 742, flip: -1 }
  ];

  const YARN_SPOTS = [
    { x: 540,  y: 965, color: '#d9383a' },
    { x: 1035, y: 975, color: '#d9383a' },
    { x: 1410, y: 970, color: '#d9383a' },
    { x: 705,  y: 950, color: '#d9383a' }
  ];

  const PARROT_STATES = [
    { offsetX: -18, offsetY: 0,   flip: 1,  wingOpen: 0 },
    { offsetX: 18,  offsetY: 0,   flip: -1, wingOpen: 0 },
    { offsetX: 0,   offsetY: -22, flip: -1, wingOpen: 0.4 }
  ];

  // ============================================================================
  // GAME STATE
  // ============================================================================
  let currentCats = [];       // [{ catId, spotIndex, reactionTimer, reactionType, celebStyle }]
  let previousCats = [];      // Cloned snapshot before the most recent blackout
  let movedCatId = 'ginger';  // Which cat moved in the latest blackout
  let movedFromSpot = 0;      // Spot index where that cat came from
  let roundSolved = false;    // Whether the moved cat has been clicked yet this round
  let celebrationCounter = 0; // Cycles through 4 distinct celebration styles

  let distractors = {
    puppySpot: 0,
    puppyAnim: 0,
    mouseHole: 1,
    mouseAnim: 0,
    yarnSpot: 0,
    yarnAnim: 0,
    parrotState: 0,
    parrotAnim: 0,
    aquariumAnim: 0,
    pillowVariant: 0
  };
  let previousDistractors = null;

  // Light & Blackout sequence state
  let lightState = 'on'; // 'on' | 'flicker_out' | 'dark' | 'flicker_in'
  let blackoutTimer = 0;
  let roomBrightness = 1.0;
  let switchToggleDown = false;
  let cordPullOffset = 0;
  let peekPreviousMode = false;

  // Ambient particles & visual effects
  const stars = Array.from({ length: 45 }, () => ({
    x: 315 + Math.random() * 230,
    y: 130 + Math.random() * 290,
    r: 0.8 + Math.random() * 1.8,
    phase: Math.random() * Math.PI * 2
  }));

  const dustMotes = Array.from({ length: 55 }, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 0.25,
    vy: -0.1 - Math.random() * 0.25,
    r: 1.2 + Math.random() * 2.4,
    alpha: 0.15 + Math.random() * 0.35,
    phase: Math.random() * Math.PI * 2
  }));

  const fireParticles = Array.from({ length: 28 }, () => ({
    x: 1455 + (Math.random() - 0.5) * 110,
    y: 690 - Math.random() * 80,
    vx: (Math.random() - 0.5) * 0.6,
    vy: -1.2 - Math.random() * 1.8,
    size: 4 + Math.random() * 12,
    life: Math.random()
  }));

  let celebrationParticles = [];
  let trailParticles = [];
  let fishBubbles = [
    { x: 455, y: 580, r: 3 },
    { x: 485, y: 560, r: 4 },
    { x: 470, y: 545, r: 2.5 }
  ];

  // ============================================================================
  // INITIALIZE CAT POSITIONS & PREVIOUS STATE
  // ============================================================================
  function initGame() {
    // Pick 5 distinct random spots: first 4 for initial previous state, 5th for moved cat
    const indices = SPOTS.map((_, idx) => idx);
    for (let i = indices.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [indices[i], indices[j]] = [indices[j], indices[i]];
    }

    previousCats = CAT_DEFS.map((cat, idx) => ({
      catId: cat.id,
      spotIndex: indices[idx],
      reactionTimer: 0,
      reactionType: null,
      celebStyle: 0
    }));

    previousDistractors = { ...distractors };

    // Copy to currentCats and move one cat to indices[4] so game is immediately playable
    currentCats = previousCats.map(c => ({ ...c }));
    const initialMover = Math.floor(Math.random() * 4);
    movedCatId = currentCats[initialMover].catId;
    movedFromSpot = currentCats[initialMover].spotIndex;
    currentCats[initialMover].spotIndex = indices[4];

    // Also shift distractors slightly between previous and current
    distractors.puppySpot = (previousDistractors.puppySpot + 1) % PUPPY_SPOTS.length;
    distractors.mouseHole = (previousDistractors.mouseHole + 1) % MOUSE_HOLES.length;
  }

  initGame();

  // Trigger an automatic first light-blink shortly after load so the player
  // immediately sees the lights flicker and a cat move on screen!
  let autoFirstBlinkScheduled = true;
  setTimeout(() => {
    if (autoFirstBlinkScheduled && lightState === 'on') {
      triggerBlackout(false);
    }
  }, 1100);

  // ============================================================================
  // TRIGGER LIGHT BLINK & BLACKOUT TRANSITION
  // ============================================================================
  function triggerBlackout(fromCord = false) {
    autoFirstBlinkScheduled = false;
    if (lightState !== 'on') return;

    peekPreviousMode = false;
    lightState = 'flicker_out';
    blackoutTimer = 0;
    switchToggleDown = !switchToggleDown;
    if (fromCord) cordPullOffset = 28;

    sound.playSwitchClick(0.95);
  }

  // Perform the actual swap of 1 cat + distractors while the room is pitch dark
  function performDarkRoomSwap() {
    // Save current arrangement as previous arrangement
    previousCats = currentCats.map(c => ({
      catId: c.catId,
      spotIndex: c.spotIndex,
      reactionTimer: 0,
      reactionType: null,
      celebStyle: 0
    }));
    previousDistractors = { ...distractors };

    // Find all currently occupied spot indices
    const occupied = new Set(currentCats.map(c => c.spotIndex));
    const availableSpots = [];
    for (let i = 0; i < SPOTS.length; i++) {
      if (!occupied.has(i)) availableSpots.push(i);
    }

    // Choose 1 random cat to move (prefer a different cat than last time for variety)
    const candidateCatIndices = [0, 1, 2, 3];
    const filtered = candidateCatIndices.filter(idx => currentCats[idx].catId !== movedCatId);
    const chosenCatIdx = (Math.random() < 0.8 && filtered.length > 0)
      ? filtered[Math.floor(Math.random() * filtered.length)]
      : candidateCatIndices[Math.floor(Math.random() * 4)];

    const newSpotIndex = availableSpots[Math.floor(Math.random() * availableSpots.length)];

    movedCatId = currentCats[chosenCatIdx].catId;
    movedFromSpot = currentCats[chosenCatIdx].spotIndex;
    currentCats[chosenCatIdx].spotIndex = newSpotIndex;
    currentCats.forEach(c => {
      c.reactionTimer = 0;
      c.reactionType = null;
    });

    roundSolved = false;
    celebrationParticles = [];
    trailParticles = [];

    // Move distracting animals & objects to challenge observation!
    distractors.puppySpot = (distractors.puppySpot + 1 + Math.floor(Math.random() * 2)) % PUPPY_SPOTS.length;
    distractors.mouseHole = (distractors.mouseHole + 1 + Math.floor(Math.random() * 2)) % MOUSE_HOLES.length;
    distractors.yarnSpot = (distractors.yarnSpot + 1 + Math.floor(Math.random() * 3)) % YARN_SPOTS.length;
    distractors.parrotState = (distractors.parrotState + 1) % PARROT_STATES.length;
    distractors.pillowVariant = (distractors.pillowVariant + 1) % 3;

    sound.playDarkScurry();
  }

  // ============================================================================
  // SPAWN CELEBRATION & TRAIL PARTICLES
  // ============================================================================
  function spawnCelebration(x, y, fromX, fromY, style) {
    const palette = [
      ['#ffd700', '#ffae00', '#fff3b0', '#ff6b6b'],
      ['#ff7eb3', '#7afcff', '#feff9c', '#fff740'],
      ['#59ffb9', '#ffd166', '#38b6ff', '#ff9f1c'],
      ['#ffbe0b', '#fb5607', '#ff006e', '#8338ec']
    ][style % 4];

    // Burst particles around the discovered cat
    for (let i = 0; i < 48; i++) {
      const angle = (Math.PI * 2 * i) / 48 + (Math.random() - 0.5) * 0.2;
      const speed = 3 + Math.random() * 9;
      const shapes = ['star', 'note', 'paw', 'heart'];
      celebrationParticles.push({
        x,
        y: y - 20,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 3.5,
        size: 10 + Math.random() * 14,
        color: palette[i % palette.length],
        shape: shapes[(style + i) % shapes.length],
        rot: Math.random() * Math.PI * 2,
        vRot: (Math.random() - 0.5) * 0.14,
        life: 1.0
      });
    }

    // Golden paw-step trail showing how the cat moved from its old spot to its new spot
    const steps = 11;
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      // Curved arc between old spot and new spot
      const midX = (fromX + x) * 0.5;
      const midY = Math.min(fromY, y) - 130;
      const px = (1 - t) * (1 - t) * fromX + 2 * (1 - t) * t * midX + t * t * x;
      const py = (1 - t) * (1 - t) * fromY + 2 * (1 - t) * t * midY + t * t * y;

      trailParticles.push({
        x: px,
        y: py,
        delay: i * 0.04,
        age: 0,
        life: 1.35,
        angle: Math.atan2(y - fromY, x - fromX)
      });
    }
  }

  // ============================================================================
  // DRAWING HELPERS (SHAPES, FUR, TEXTURES)
  // ============================================================================
  function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawStarShape(cx, cy, spikes, outerR, innerR) {
    let rot = (Math.PI / 2) * 3;
    const step = Math.PI / spikes;
    ctx.beginPath();
    ctx.moveTo(cx, cy - outerR);
    for (let i = 0; i < spikes; i++) {
      ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
      rot += step;
      ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
      rot += step;
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawPawPrint(x, y, size, color, alpha = 1, angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle + Math.PI / 2);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;

    // Main pad
    ctx.beginPath();
    ctx.ellipse(0, 4, size * 0.55, size * 0.42, 0, 0, Math.PI * 2);
    ctx.fill();

    // 4 toes
    const toes = [
      { dx: -size * 0.55, dy: -size * 0.25 },
      { dx: -size * 0.2,  dy: -size * 0.55 },
      { dx: size * 0.2,   dy: -size * 0.55 },
      { dx: size * 0.55,  dy: -size * 0.25 }
    ];
    toes.forEach(t => {
      ctx.beginPath();
      ctx.ellipse(t.dx, t.dy, size * 0.2, size * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // ============================================================================
  // STORY-DRIVEN LIVING ROOM BACKGROUND RENDERER
  // ============================================================================
  function drawLivingRoomBackground(time) {
    // 1. Upper Antique Striped Wallpaper
    const wallGrad = ctx.createLinearGradient(0, 0, 0, 740);

      for (let y = 40; y < 720; y += 80) {
        ctx.beginPath();
        ctx.moveTo(x + 13, y);
        ctx.lineTo(x + 21, y + 12);
        ctx.lineTo(x + 13, y + 24);
        ctx.lineTo(x + 5, y + 12);
        ctx.closePath();
        ctx.fill();

    // 2. Wooden Wainscoting (Lower Wall Panels)

    wainscotGrad.addColorStop(0, '#4f2d1d');
    wainscotGrad.addColorStop(1, '#331b10');
    ctx.fillStyle = wainscotGrad;
    ctx.fillRect(0, 535, W, 210);

    // Top chair-rail molding
    ctx.fillStyle = '#6e412a';
    ctx.fillRect(0, 525, W, 14);
    ctx.fillStyle = '#2b160c';
    ctx.fillRect(0, 539, W, 4);

    // Recessed wooden panels
    for (let x = 25; x < W; x += 160) {
      ctx.strokeStyle = '#29150c';
      ctx.lineWidth = 4;
      ctx.strokeRect(x, 558, 130, 145);
      ctx.strokeStyle = '#633a26';
      ctx.lineWidth = 2;
      ctx.strokeRect(x + 4, 562, 122, 137);
    }

    // Baseboard trim
    ctx.fillStyle = '#28140b';
    ctx.fillRect(0, 718, W, 28);

    // 3. Hardwood Floorboards with Perspective Planks
    const floorGrad = ctx.createLinearGradient(0, 742, 0, H);
    floorGrad.addColorStop(0, '#4a2918');
    floorGrad.addColorStop(0.4, '#5e351f');
    floorGrad.addColorStop(1, '#381e10');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, 742, W, H - 742);

    // Horizontal plank seams
    ctx.strokeStyle = 'rgba(25, 11, 4, 0.55)';
    ctx.lineWidth = 2;
    const plankYs = [775, 815, 862, 916, 978, 1045];
    plankYs.forEach((py, rowIdx) => {
      ctx.beginPath();
      ctx.moveTo(0, py);
      ctx.lineTo(W, py);
      ctx.stroke();

      // Perspective joints
      for (let gx = (rowIdx * 110) % 240; gx < W; gx += 240) {
        const prevY = rowIdx === 0 ? 742 : plankYs[rowIdx - 1];
        ctx.beginPath();
        ctx.moveTo(gx, prevY);
        ctx.lineTo(gx + (gx - W / 2) * 0.06, py);
        ctx.stroke();
      }
    });

    // 4. Ornate Persian Rug in Center of Floor
    ctx.save();
    ctx.translate(970, 915);
    // Outer fringe
    ctx.strokeStyle = '#d9c29c';
    ctx.lineWidth = 3;
    for (let a = -0.35; a <= 0.35; a += 0.03) {
      ctx.beginPath();
      ctx.moveTo(-585, Math.sin(a) * 190);
      ctx.lineTo(-608, Math.sin(a) * 198);
      ctx.moveTo(585, Math.sin(a) * 190);
      ctx.lineTo(608, Math.sin(a) * 198);
      ctx.stroke();
    }
    // Main crimson rug body
    ctx.fillStyle = '#7d1e24';
    ctx.beginPath();
    ctx.ellipse(0, 0, 590, 128, 0, 0, Math.PI * 2);
    ctx.fill();

    // Gold & navy ornate border
    ctx.strokeStyle = '#d4a24c';
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.ellipse(0, 0, 555, 112, 0, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#1d2d44';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.ellipse(0, 0, 520, 98, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Center medallion
    ctx.fillStyle = '#c9933b';
    ctx.beginPath();
    ctx.ellipse(0, 0, 210, 48, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#203647';
    ctx.beginPath();
    ctx.ellipse(0, 0, 120, 28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 5. Three Baseboard Mouseholes (Distractor Mouse peeks out of one!)
    MOUSE_HOLES.forEach((hole, idx) => {
      ctx.save();
      ctx.fillStyle = '#0e0704';
      ctx.beginPath();
      ctx.arc(hole.x, hole.y, 20, Math.PI, 0);
      ctx.lineTo(hole.x + 20, hole.y + 4);
      ctx.lineTo(hole.x - 20, hole.y + 4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#3d2214';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.restore();
    });

    // 6. GRAND ARCHED WINDOW (Left-Center) with Living Night Sky
    ctx.save();
    const winX = 290, winY = 110, winW = 280, winH = 380;
    ctx.beginPath();
    ctx.arc(winX + winW / 2, winY + 130, winW / 2, Math.PI, 0);
    ctx.lineTo(winX + winW, winY + winH);
    ctx.lineTo(winX, winY + winH);
    ctx.closePath();
    ctx.clip();

    // Night sky gradient
    const skyGrad = ctx.createLinearGradient(winX, winY, winX, winY + winH);
    skyGrad.addColorStop(0, '#0b1528');
    skyGrad.addColorStop(0.6, '#182b49');
    skyGrad.addColorStop(1, '#263f66');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(winX, winY, winW, winH);

    // Twinkling stars
    stars.forEach(s => {
      const twinkle = 0.4 + 0.6 * Math.sin(time * 2.5 + s.phase);
      ctx.fillStyle = `rgba(255, 248, 215, ${twinkle})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Glowing Crescent Moon
    ctx.save();
    ctx.translate(485, 195);
    const moonGlow = ctx.createRadialGradient(0, 0, 10, 0, 0, 75);
    moonGlow.addColorStop(0, 'rgba(255, 245, 200, 0.5)');
    moonGlow.addColorStop(1, 'rgba(255, 245, 200, 0)');
    ctx.fillStyle = moonGlow;
    ctx.beginPath();
    ctx.arc(0, 0, 75, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff5c0';
    ctx.beginPath();
    ctx.arc(0, 0, 32, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#11203a';
    ctx.beginPath();
    ctx.arc(-12, -6, 28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Drifting night clouds
    const cloudShift = Math.sin(time * 0.35) * 28;
    ctx.fillStyle = 'rgba(42, 68, 105, 0.55)';
    ctx.beginPath();
    ctx.arc(360 + cloudShift, 260, 38, 0, Math.PI * 2);
    ctx.arc(400 + cloudShift, 252, 46, 0, Math.PI * 2);
    ctx.arc(445 + cloudShift, 262, 35, 0, Math.PI * 2);
    ctx.fill();

    // Swaying tree branch silhouette outside window
    const branchSway = Math.sin(time * 1.4) * 0.04;
    ctx.save();
    ctx.translate(290, 400);
    ctx.rotate(branchSway);
    ctx.strokeStyle = '#09101d';
    ctx.lineWidth = 9;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(60, -25, 130, -15);
    ctx.moveTo(55, -20);
    ctx.quadraticCurveTo(85, -55, 115, -60);
    ctx.stroke();
    ctx.restore();

    // Window muntins (wooden panes)
    ctx.strokeStyle = '#3d2212';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(winX + winW / 2, winY);
    ctx.lineTo(winX + winW / 2, winY + winH);
    ctx.moveTo(winX, winY + 160);
    ctx.lineTo(winX + winW, winY + 160);
    ctx.moveTo(winX, winY + 280);
    ctx.lineTo(winX + winW, winY + 280);
    ctx.stroke();
    ctx.restore();

    // Window outer wooden arch frame & deep sill
    ctx.strokeStyle = '#4e2b18';
    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.arc(winX + winW / 2, winY + 130, winW / 2, Math.PI, 0);
    ctx.lineTo(winX + winW, winY + winH);
    ctx.lineTo(winX, winY + winH);
    ctx.closePath();
    ctx.stroke();

    // Velvet Left Curtain (Right curtain is drawn in mid_front so a cat can peek from behind it!)
    drawCurtain(winX - 22, winY + 15, 76, 425, 1);

    // Deep Wooden Windowsill
    ctx.fillStyle = '#5c341e';
    drawRoundedRect(winX - 24, winY + winH - 6, winW + 48, 24, 6);
    ctx.fill();
    ctx.strokeStyle = '#2d160b';
    ctx.lineWidth = 3;
    ctx.stroke();

    // 7. TALL MAHOGANY BOOKSHELF (Left Wall)
    drawBookshelf(time);

    // 8. FRAMED LANDSCAPE PAINTING (Above Sofa)
    drawFramedPainting(745, 180, 250, 175);

    // 9. WALL LIGHT SWITCH (Interactive! Between Window and Sofa)
    drawWallLightSwitch(635, 470, time);

    // 10. GRANDFATHER CLOCK (Right-Center)
    drawGrandfatherClock(1170, 184, time);

    // 11. COZY BRICK FIREPLACE WITH ANIMATED FLAMES
    drawFireplace(1455, 455, time);

    // 12. PLUSH EMERALD VELVET SOFA (Center-Left)
    drawSofa(820, 625);

    // 13. SIDE TABLE WITH ANIMATED AQUARIUM (Left-Center)
    drawTableAndAquarium(465, 620, time);

    // 14. BURGUNDY TUFTED ARMCHAIR (Right)
    drawArmchair(1690, 650);

    // 15. BRASS PARROT PERCH STAND (Between Clock and Fireplace)
    drawParrotStand(1305, 515);
  }

  function drawCurtain(x, y, w, h, side) {
    ctx.save();
    const grad = ctx.createLinearGradient(x, y, x + w, y);
    grad.addColorStop(0, '#5e1119');
    grad.addColorStop(0.5, '#8f1d28');
    grad.addColorStop(1, '#4a0b11');
    ctx.fillStyle = grad;

    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + w, y);
    ctx.quadraticCurveTo(x + w - side * 18, y + h * 0.55, x + w - side * 8, y + h);
    ctx.lineTo(x + side * 6, y + h);
    ctx.quadraticCurveTo(x + side * 12, y + h * 0.5, x, y);
    ctx.closePath();
    ctx.fill();

    // Gold tassel tie-back
    ctx.fillStyle = '#d9a74a';
    ctx.fillRect(x + 8, y + h * 0.56, w - 16, 10);
    ctx.restore();
  }

  function drawBookshelf(time) {
    const bx = 68, by = 205, bw = 210, bh = 550;
    ctx.save();
    // Main mahogany body
    ctx.fillStyle = '#2b160c';
    ctx.fillRect(bx, by, bw, bh);
    ctx.strokeStyle = '#59311c';
    ctx.lineWidth = 10;
    ctx.strokeRect(bx, by, bw, bh);

    // Top crown molding (where cat can lounge!)
    ctx.fillStyle = '#663922';
    drawRoundedRect(bx - 12, by - 14, bw + 24, 18, 5);
    ctx.fill();

    // Shelves & colorful books
    const shelfYs = [310, 420, 530, 640];
    const bookColors = ['#b8332a', '#2c6e49', '#2b59c3', '#d49b35', '#7b2cbf', '#c95d39'];
    shelfYs.forEach((sy, sIdx) => {
      // Books on shelf
      let curX = bx + 12;
      for (let b = 0; b < 7; b++) {
        const bookW = 18 + ((b * 7 + sIdx * 3) % 10);
        const bookH = 68 + ((b * 11 + sIdx * 5) % 24);
        if (curX + bookW < bx + bw - 22) {
          ctx.fillStyle = bookColors[(b + sIdx * 2) % bookColors.length];
          ctx.fillRect(curX, sy - bookH, bookW - 2, bookH);
          // Gold spine stripe
          ctx.fillStyle = '#e6c27a';
          ctx.fillRect(curX + 2, sy - bookH + 10, bookW - 6, 4);
          curX += bookW;
        }
      }
      // Wooden shelf plank
      ctx.fillStyle = '#59311c';
      ctx.fillRect(bx + 4, sy, bw - 8, 12);
    });

    // Trailing green ivy plant on the 2nd shelf
    ctx.fillStyle = '#a85632';
    ctx.beginPath();
    ctx.arc(bx + bw - 32, 310 - 18, 18, 0, Math.PI);
    ctx.fill();
    ctx.strokeStyle = '#2d6a4f';
    ctx.lineWidth = 3;
    for (let v = 0; v < 3; v++) {
      ctx.beginPath();
      ctx.moveTo(bx + bw - 30 + v * 6, 305);
      const sway = Math.sin(time * 1.8 + v) * 6;
      ctx.quadraticCurveTo(bx + bw - 15 + sway, 355, bx + bw - 25 + v * 8 + sway, 405 + v * 15);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFramedPainting(x, y, w, h) {
    ctx.save();

    const frameGrad = ctx.createLinearGradient(x, y, x + w, y + h);
    frameGrad.addColorStop(0, '#e0b354');
    frameGrad.addColorStop(0.5, '#9e6f1e');
    frameGrad.addColorStop(1, '#d4a243');
    ctx.fillStyle = frameGrad;
    drawRoundedRect(x - 14, y - 14, w + 28, h + 28, 8);
    ctx.fill();

    ctx.fillStyle = '#2b1b12';
    ctx.fillRect(x - 4, y - 4, w + 8, h + 8);

    // Warm sunset hills landscape inside
    const paintSky = ctx.createLinearGradient(x, y, x, y + h);
    paintSky.addColorStop(0, '#f2a65a');
    paintSky.addColorStop(0.6, '#f5cb5c');
    paintSky.addColorStop(1, '#386641');
    ctx.fillStyle = paintSky;
    ctx.fillRect(x, y, w, h);

    // Rolling hills
    ctx.fillStyle = '#2d5a27';
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.quadraticCurveTo(x + w * 0.35, y + h * 0.55, x + w * 0.7, y + h * 0.8);
    ctx.quadraticCurveTo(x + w * 0.85, y + h * 0.65, x + w, y + h * 0.75);
    ctx.lineTo(x + w, y + h);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawWallLightSwitch(x, y, time) {

    const pulse = 0.35 + 0.35 * Math.sin(time * 3.5);

    plateGrad.addColorStop(0.5, '#b8862d');
    plateGrad.addColorStop(1, '#7a5414');

    drawRoundedRect(x - 20, y - 30, 40, 60, 7);

  function drawGrandfatherClock(cx, topY, time) {
    ctx.save();
    // Tall wooden case
    ctx.fillStyle = '#3b1f10';
    ctx.fillRect(cx - 48, topY + 95, 96, 465);
    ctx.strokeStyle = '#211007';
    ctx.lineWidth = 4;
    ctx.strokeRect(cx - 48, topY + 95, 96, 465);

    // Recessed pendulum window
    ctx.fillStyle = '#170b05';
    drawRoundedRect(cx - 28, topY + 120, 56, 290, 28);
    ctx.fill();

    // Swinging brass pendulum
    const swingAngle = Math.sin(time * 2.8) * 0.16;
    ctx.save();
    ctx.translate(cx, topY + 130);
    ctx.rotate(swingAngle);
    ctx.strokeStyle = '#d4a243';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 195);
    ctx.stroke();

    const bobGrad = ctx.createRadialGradient(-5, 200, 3, 0, 205, 24);
    bobGrad.addColorStop(0, '#fff2b2');
    bobGrad.addColorStop(0.5, '#d4a243');
    bobGrad.addColorStop(1, '#85580f');
    ctx.fillStyle = bobGrad;
    ctx.beginPath();
    ctx.arc(0, 205, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Clock head hood (flat crown at topY where cat can lounge!)
    ctx.fillStyle = '#4f2a17';
    drawRoundedRect(cx - 58, topY, 116, 102, 8);
    ctx.fill();
    ctx.strokeStyle = '#241108';
    ctx.lineWidth = 4;
    ctx.stroke();

    // Flat top molding
    ctx.fillStyle = '#693920';
    drawRoundedRect(cx - 64, topY - 8, 128, 12, 4);
    ctx.fill();

    // Warm antique brass & cream dial (no white rectangle!)
    const dialGrad = ctx.createRadialGradient(cx, topY + 52, 5, cx, topY + 52, 40);
    dialGrad.addColorStop(0, '#f5deb3');
    dialGrad.addColorStop(0.8, '#d4af6a');
    dialGrad.addColorStop(1, '#8a6220');
    ctx.fillStyle = dialGrad;
    ctx.beginPath();
    ctx.arc(cx, topY + 52, 38, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#472d07';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Tick marks & hands
    ctx.strokeStyle = '#2b1903';
    for (let i = 0; i < 12; i++) {
      const a = (i * Math.PI) / 6;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(a) * 29, topY + 52 + Math.sin(a) * 29);
      ctx.lineTo(cx + Math.cos(a) * 34, topY + 52 + Math.sin(a) * 34);
      ctx.stroke();
    }
    // Hands
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(cx, topY + 52);

    ctx.lineTo(cx + Math.cos(time * 0.4) * 27, topY + 52 + Math.sin(time * 0.4) * 27);

    // Base pedestal
    ctx.fillStyle = '#4a2614';
    drawRoundedRect(cx - 58, topY + 530, 116, 40, 5);

  function drawFireplace(cx, topY, time) {
    ctx.save();
    const fw = 310, fh = 320;
    // Warm ambient firelight glow on floor & wall
    const fireGlow = ctx.createRadialGradient(cx, topY + 230, 20, cx, topY + 240, 340);
    const flicker = 0.88 + 0.12 * Math.sin(time * 11) * Math.cos(time * 7);
    fireGlow.addColorStop(0, `rgba(255, 130, 30, ${0.42 * flicker})`);
    fireGlow.addColorStop(0.5, `rgba(255, 80, 10, ${0.16 * flicker})`);
    fireGlow.addColorStop(1, 'rgba(255, 60, 0, 0)');
    ctx.fillStyle = fireGlow;
    ctx.beginPath();
    ctx.arc(cx, topY + 240, 340, 0, Math.PI * 2);
    ctx.fill();

    // Brick surround
    ctx.fillStyle = '#6e2b1c';
    ctx.fillRect(cx - fw / 2, topY, fw, fh);

    // Individual brick pattern
    ctx.strokeStyle = '#3d160d';
    ctx.lineWidth = 2;
    for (let by = topY + 16; by < topY + fh; by += 24) {
      ctx.beginPath();
      ctx.moveTo(cx - fw / 2, by);
      ctx.lineTo(cx + fw / 2, by);
      ctx.stroke();
      const offset = ((by / 24) % 2) * 26;
      for (let bx = cx - fw / 2 + offset; bx < cx + fw / 2; bx += 52) {
        ctx.beginPath();
        ctx.moveTo(bx, by - 24);
        ctx.lineTo(bx, by);
        ctx.stroke();
      }
    }

    // Carved wooden mantelpiece shelf
    ctx.fillStyle = '#4a2715';
    drawRoundedRect(cx - fw / 2 - 22, topY - 18, fw + 44, 28, 6);
    ctx.fill();
    ctx.strokeStyle = '#241107';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Decorative brass candle & clock/vase on mantelpiece
    ctx.fillStyle = '#d4a243';
    ctx.beginPath();
    ctx.ellipse(cx - 110, topY - 26, 16, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f5deb3';
    ctx.fillRect(cx - 115, topY - 58, 10, 32);
    ctx.fillStyle = '#ffae00';
    ctx.beginPath();
    ctx.ellipse(cx - 110, topY - 65, 5, 9, Math.sin(time * 8) * 0.2, 0, Math.PI * 2);
    ctx.fill();

    // Dark firebox opening
    ctx.fillStyle = '#170a06';
    ctx.beginPath();
    ctx.arc(cx, topY + 145, 98, Math.PI, 0);
    ctx.lineTo(cx + 98, topY + fh);
    ctx.lineTo(cx - 98, topY + fh);
    ctx.closePath();
    ctx.fill();

    // Glowing logs
    ctx.fillStyle = '#3d1c0a';
    drawRoundedRect(cx - 65, topY + 265, 130, 22, 8);
    ctx.fill();
    drawRoundedRect(cx - 50, topY + 250, 100, 20, 8);
    ctx.fill();

    // Animated multi-layered flames
    fireParticles.forEach(fp => {
      fp.y += fp.vy;
      fp.x += fp.vx + Math.sin(time * 5 + fp.life * 6) * 0.4;
      fp.life -= 0.022;
      if (fp.life <= 0) {
        fp.x = cx + (Math.random() - 0.5) * 95;
        fp.y = topY + 265;
        fp.life = 1.0;
      }
      const r = fp.size * fp.life;
      ctx.fillStyle = fp.life > 0.6 ? '#fff07c' : fp.life > 0.3 ? '#ff7b00' : '#d62828';
      ctx.beginPath();
      ctx.arc(fp.x, fp.y, Math.max(1, r), 0, Math.PI * 2);
      ctx.fill();
    });

    // Stone Hearth Slab (where a cat can curl up!)
    const hearthGrad = ctx.createLinearGradient(cx - 180, topY + fh, cx + 180, topY + fh + 65);
    hearthGrad.addColorStop(0, '#594e47');
    hearthGrad.addColorStop(0.5, '#73655c');
    hearthGrad.addColorStop(1, '#403732');
    ctx.fillStyle = hearthGrad;
    drawRoundedRect(cx - 175, topY + fh - 6, 350, 68, 12);
    ctx.fill();
    ctx.strokeStyle = '#29221e';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }

  function drawTableAndAquarium(cx, cy, time) {
    ctx.save();
    // Wooden side table legs (space underneath for a cat to loaf!)
    ctx.fillStyle = '#3b1f10';
    ctx.fillRect(cx - 88, cy, 16, 215);
    ctx.fillRect(cx + 72, cy, 16, 215);

    ctx.fillRect(cx - 65, cy + 15, 14, 175);
    ctx.fillRect(cx + 51, cy + 15, 14, 175);

    // Table apron & tabletop
    ctx.fillStyle = '#59301a';
    drawRoundedRect(cx - 108, cy - 16, 216, 26, 8);
    ctx.fill();
    ctx.strokeStyle = '#291409';
    ctx.lineWidth = 3;
    ctx.stroke();

    // Lace/embroidered golden table runner
    ctx.fillStyle = '#d4a243';
    ctx.beginPath();
    ctx.moveTo(cx - 45, cy + 10);
    ctx.lineTo(cx + 45, cy + 10);
    ctx.lineTo(cx, cy + 42);
    ctx.closePath();
    ctx.fill();

    // GLASS AQUARIUM ON TABLE (Interactive Distractor!)
    const aqY = cy - 68;
    const splashOffset = distractors.aquariumAnim > 0 ? Math.sin(distractors.aquariumAnim * 25) * 4 : 0;
    ctx.save();
    ctx.translate(cx + splashOffset, aqY);

    // Water body
    const waterGrad = ctx.createLinearGradient(0, -45, 0, 48);
    waterGrad.addColorStop(0, 'rgba(64, 196, 255, 0.55)');
    waterGrad.addColorStop(1, 'rgba(15, 92, 140, 0.78)');
    ctx.fillStyle = waterGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 54, -0.25 * Math.PI, 1.25 * Math.PI);
    ctx.closePath();
    ctx.fill();

    // Sandy bottom & swaying green seaweeds
    ctx.fillStyle = '#d9b26f';
    ctx.beginPath();
    ctx.arc(0, 2, 50, 0.22 * Math.PI, 0.78 * Math.PI);
    ctx.fill();

    ctx.strokeStyle = '#2b9348';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    for (let s = -18; s <= 18; s += 18) {
      ctx.beginPath();
      ctx.moveTo(s, 40);
      ctx.quadraticCurveTo(s + Math.sin(time * 3 + s) * 8, 12, s + Math.cos(time * 2 + s) * 6, -10);
      ctx.stroke();
    }

    // Animated swimming goldfish
    const fishX = Math.sin(time * 1.7 + (distractors.aquariumAnim * 4)) * 24;
    const fishY = Math.cos(time * 2.3) * 8;
    const fishDir = Math.cos(time * 1.7 + (distractors.aquariumAnim * 4)) >= 0 ? 1 : -1;
    ctx.save();
    ctx.translate(fishX, fishY);
    ctx.scale(fishDir, 1);
    ctx.fillStyle = '#ff7b00';
    ctx.beginPath();
    ctx.ellipse(0, 0, 13, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    // Fantail
    ctx.fillStyle = '#ffaa00';
    ctx.beginPath();
    ctx.moveTo(-10, 0);
    ctx.lineTo(-22, -8 + Math.sin(time * 12) * 3);
    ctx.lineTo(-19, 0);
    ctx.lineTo(-22, 8 + Math.sin(time * 12) * 3);
    ctx.closePath();
    ctx.fill();
    // Eye
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(7, -2, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Rising bubbles
    ctx.fillStyle = 'rgba(220, 250, 255, 0.75)';
    fishBubbles.forEach(b => {
      b.y -= 0.6 + (distractors.aquariumAnim > 0 ? 2.2 : 0);
      if (b.y < aqY - 35) b.y = aqY + 25;
      ctx.beginPath();
      ctx.arc(b.x - cx, b.y - aqY, b.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Glass bowl outline & rim
    ctx.strokeStyle = 'rgba(210, 245, 255, 0.7)';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(0, 0, 55, -0.78 * Math.PI, 1.78 * Math.PI);
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, -35, 36, 7, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    ctx.restore();
  }
