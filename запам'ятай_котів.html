  // ============================================================================
  // DISTRACTING ANIMALS & ITEMS RENDERER (Puppy, Parrot, Mouse, Yarn)
  // ============================================================================
  function drawDistractors(stateObj, time) {
    // 1. LITTLE MOUSE PEEKING FROM BASEBOARD MOUSEHOLE
    const hole = MOUSE_HOLES[stateObj.mouseHole];
    ctx.save();
    const mouseHop = stateObj.mouseAnim > 0 ? Math.abs(Math.sin(stateObj.mouseAnim * 18)) * 18 : 0;
    ctx.translate(hole.x + hole.flip * 10, hole.y + 2 - mouseHop);
    ctx.scale(hole.flip, 1);

    // Mouse body
    ctx.fillStyle = '#7d746d';
    ctx.beginPath();
    ctx.ellipse(0, -6, 16, 11, 0, 0, Math.PI * 2);
    ctx.fill();
    // Pointed snout
    ctx.beginPath();
    ctx.moveTo(10, -12);
    ctx.lineTo(24, -4);
    ctx.lineTo(10, 2);
    ctx.closePath();
    ctx.fill();
    // Big round ears
    ctx.fillStyle = '#635b55';
    ctx.beginPath();
    ctx.arc(4, -16, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#e89da2';
    ctx.beginPath();
    ctx.arc(5, -16, 5, 0, Math.PI * 2);
    ctx.fill();
    // Shiny eye & pink nose
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(13, -7, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#ff758f';
    ctx.beginPath();
    ctx.arc(24, -4, 2.8, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 2. COLORFUL PARROT ON BRASS STAND
    const pState = PARROT_STATES[stateObj.parrotState];
    const flap = stateObj.parrotAnim > 0 ? Math.sin(stateObj.parrotAnim * 28) * 0.7 : pState.wingOpen;
    const hopY = stateObj.parrotAnim > 0 ? -Math.abs(Math.sin(stateObj.parrotAnim * 14)) * 16 : 0;
    ctx.save();
    ctx.translate(1305 + pState.offsetX, 505 + pState.offsetY + hopY);
    ctx.scale(pState.flip, 1);

    // Long tail feathers
    ctx.fillStyle = '#1d4ed8';
    ctx.beginPath();
    ctx.moveTo(-6, 12);
    ctx.lineTo(-18, 58);
    ctx.lineTo(-4, 52);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.moveTo(-2, 12);
    ctx.lineTo(-8, 64);
    ctx.lineTo(4, 48);
    ctx.closePath();
    ctx.fill();

    // Scarlet body
    ctx.fillStyle = '#e11d48';
    ctx.beginPath();
    ctx.ellipse(0, -6, 16, 24, -0.15, 0, Math.PI * 2);
    ctx.fill();

    // Gold & Blue Wing
    ctx.save();
    ctx.translate(-4, -12);
    ctx.rotate(-flap);
    ctx.fillStyle = '#f59e0b';
    ctx.beginPath();
    ctx.ellipse(0, 8, 10, 18, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2563eb';
    ctx.beginPath();
    ctx.ellipse(-2, 16, 7, 12, 0.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Head & Curved Beak
    ctx.fillStyle = '#e11d48';
    ctx.beginPath();
    ctx.arc(4, -28, 13, 0, Math.PI * 2);
    ctx.fill();

    // Cream cheek patch
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath();
    ctx.arc(8, -27, 6.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath();
    ctx.arc(9, -28, 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Hooked beak
    ctx.fillStyle = '#fcd34d';
    ctx.beginPath();
    ctx.moveTo(14, -33);
    ctx.quadraticCurveTo(26, -30, 20, -19);
    ctx.lineTo(13, -24);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 3. CUTE DACHSHUND PUPPY ON FLOOR
    const pup = PUPPY_SPOTS[stateObj.puppySpot];
    const pupJump = stateObj.puppyAnim > 0 ? Math.abs(Math.sin(stateObj.puppyAnim * 16)) * 22 : 0;
    const wagSpeed = stateObj.puppyAnim > 0 ? 28 : 6;
    ctx.save();
    ctx.translate(pup.x, pup.y - pupJump);
    ctx.scale(pup.flip, 1);

    // Shadow on floor
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.beginPath();
    ctx.ellipse(0, 26 + pupJump, 58, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // Wagging tail
    ctx.save();
    ctx.translate(-44, -8);
    ctx.rotate(Math.sin(time * wagSpeed) * 0.38);
    ctx.strokeStyle = '#6b3818';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(-18, -14, -24, -26);
    ctx.stroke();
    ctx.restore();

    // Back & Front short legs
    ctx.fillStyle = '#8c4a20';
    drawRoundedRect(-42, 4, 14, 22, 6);
    ctx.fill();
    drawRoundedRect(24, 4, 14, 22, 6);
    ctx.fill();

    // Long sausage body
    const pupGrad = ctx.createLinearGradient(0, -24, 0, 16);
    pupGrad.addColorStop(0, '#783c16');
    pupGrad.addColorStop(0.7, '#9e5424');
    pupGrad.addColorStop(1, '#c47a44');
    ctx.fillStyle = pupGrad;
    drawRoundedRect(-48, -18, 92, 32, 16);
    ctx.fill();

    // Red collar with gold tag
    ctx.strokeStyle = '#d62828';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(32, -16);
    ctx.lineTo(42, 8);
    ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.beginPath();
    ctx.arc(43, 13, 5, 0, Math.PI * 2);
    ctx.fill();

    // Puppy Head & Snout
    ctx.fillStyle = '#8c4a20';
    ctx.beginPath();
    ctx.arc(44, -22, 20, 0, Math.PI * 2);
    ctx.fill();
    // Long snout
    drawRoundedRect(48, -24, 28, 16, 8);
    ctx.fill();
    // Shiny black nose
    ctx.fillStyle = '#1a1412';
    ctx.beginPath();
    ctx.arc(75, -19, 5.5, 0, Math.PI * 2);
    ctx.fill();
    // Expressive eye + tan eyebrow dot
    ctx.fillStyle = '#d99b66';
    ctx.beginPath();
    ctx.arc(54, -31, 3.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#140c06';
    ctx.beginPath();
    ctx.arc(53, -24, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(54.5, -25.5, 1.4, 0, Math.PI * 2);
    ctx.fill();

    // Big floppy ear
    ctx.fillStyle = '#4d240b';
    ctx.beginPath();
    ctx.ellipse(34, -12, 11, 21, 0.25, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 4. RED YARN BALL WITH KNITTING NEEDLES
    const yarn = YARN_SPOTS[stateObj.yarnSpot];
    const rollX = stateObj.yarnAnim > 0 ? Math.sin(stateObj.yarnAnim * 15) * 26 : 0;
    const rollRot = stateObj.yarnAnim > 0 ? stateObj.yarnAnim * 8 : 0;
    ctx.save();
    ctx.translate(yarn.x + rollX, yarn.y);

    // Trailing crimson yarn thread on floor
    ctx.strokeStyle = '#c92a2a';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(0, 12);
    ctx.quadraticCurveTo(35, 22, 62, 10);
    ctx.quadraticCurveTo(82, 0, 95, 16);
    ctx.stroke();

    ctx.rotate(rollRot);
    // Crossed wooden knitting needles
    ctx.strokeStyle = '#deb887';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-36, -24);
    ctx.lineTo(36, 20);
    ctx.moveTo(-32, 24);
    ctx.lineTo(34, -26);
    ctx.stroke();

    // Yarn sphere
    const yGrad = ctx.createRadialGradient(-8, -8, 4, 0, 0, 26);
    yGrad.addColorStop(0, '#ff6b6b');
    yGrad.addColorStop(0.6, '#c92a2a');
    yGrad.addColorStop(1, '#780f0f');
    ctx.fillStyle = yGrad;
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.fill();

    // Wrapped yarn texture arcs
    ctx.strokeStyle = 'rgba(255, 190, 190, 0.35)';
    ctx.lineWidth = 2.5;
    for (let a = 0; a < Math.PI; a += 0.5) {
      ctx.beginPath();
      ctx.ellipse(0, 0, 23, 10, a, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // ============================================================================
  // REALISTIC PROCEDURAL CAT RENDERER (All 4 Cats + 5 Natural Poses + Reactions)
  // ============================================================================
  function drawRealisticCat(catPlacement, time, isMemoryGhost = false) {
    const def = CAT_DEFS.find(d => d.id === catPlacement.catId);
    const spot = SPOTS[catPlacement.spotIndex];
    if (!def || !spot) return;

    ctx.save();
    let x = spot.x;
    let y = spot.y;
    let scale = spot.scale;
    let rot = 0;

    // Active reaction animations (Wrong cat head-shake OR Moved cat 4 celebration styles!)
    if (catPlacement.reactionTimer > 0) {
      const p = catPlacement.reactionTimer; // 1.0 -> 0.0
      if (catPlacement.reactionType === 'wrong') {
        // Comical "not me!" side-to-side head & shoulder shake
        x += Math.sin(p * Math.PI * 10) * 10;
      } else if (catPlacement.reactionType === 'correct') {
        const style = catPlacement.celebStyle % 4;
        if (style === 0) {
          // Style 0: Joyful high jump + full backflip!
          y -= Math.sin(p * Math.PI) * 125;
          rot = (1 - p) * Math.PI * 2 * spot.flip;
        } else if (style === 1) {
          // Style 1: Playful stretch & bouncy dance
          y -= Math.abs(Math.sin(p * Math.PI * 3)) * 65;
          scale *= 1 + 0.16 * Math.sin(p * Math.PI * 6);
          rot = Math.sin(p * Math.PI * 4) * 0.22;
        } else if (style === 2) {
          // Style 2: Energetic figure-eight pounce with golden aura
          x += Math.sin(p * Math.PI * 4) * 42;
          y -= Math.abs(Math.sin(p * Math.PI * 2)) * 85;
        } else {
          // Style 3: Royal levitating spin & starlight pulse
          y -= Math.sin(p * Math.PI) * 90;
          scale *= 1 + 0.2 * Math.sin(p * Math.PI);
        }
      }
    }

    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(scale * spot.flip, scale);

    // If in Memory Peek mode and this is the cat that was about to move, draw a warm golden halo!
    if (isMemoryGhost && catPlacement.catId === movedCatId) {
      const halo = ctx.createRadialGradient(0, -25, 10, 0, -25, 95);
      halo.addColorStop(0, 'rgba(255, 215, 80, 0.55)');
      halo.addColorStop(1, 'rgba(255, 215, 80, 0)');
      ctx.fillStyle = halo;
      ctx.beginPath();
      ctx.arc(0, -25, 95, 0, Math.PI * 2);
      ctx.fill();
    }

    // Breathing rhythm
    const breath = Math.sin(time * 2.6 + def.index * 1.7) * 2.2;
    const tailPhase = time * (catPlacement.reactionTimer > 0 ? 12 : 2.8) + def.index * 2.1;

    // Ground contact shadow (except inside box/basket or behind curtain)
    if (spot.pose !== 'box' && spot.pose !== 'peek') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.32)';
      ctx.beginPath();
      ctx.ellipse(0, 14, 58, 13, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // Pose-specific body & tail drawing
    const pose = spot.pose; // 'sit' | 'loaf' | 'curl' | 'lounge' | 'box' | 'peek'

    if (pose === 'sit') {
      // Swaying tail behind sitting body
      drawCatTail(def, -34, 4, tailPhase, 0.4);
      // Haunches & chest
      drawCatTorso(def, 0, -24, 40, 48 + breath, -0.08);
      // Front paws neatly together
      drawCatPaw(def, 18, 10, 13, 9);
      drawCatPaw(def, 30, 8, 13, 9);
      // Head
      drawCatHead(def, 18, -72 + breath * 0.5, time, catPlacement);
    } else if (pose === 'loaf') {
      // Tail curled behind loaf
      drawCatTail(def, -52, 2, tailPhase, 0.15);
      // Rounded loaf body
      drawCatTorso(def, -6, -12, 56, 36 + breath, 0);
      // Tucked front paws
      drawCatPaw(def, 36, 8, 14, 8);
      // Head
      drawCatHead(def, 38, -36 + breath * 0.5, time, catPlacement);
    } else if (pose === 'curl') {
      // Cozy curled-up posture
      drawCatTorso(def, 0, -10, 54, 34 + breath, 0.05);
      // Head resting low on front paws
      drawCatPaw(def, 28, 10, 14, 8);
      drawCatHead(def, 26, -20 + breath * 0.4, time, catPlacement);
      // Fluffy tail wrapped around the front!
      drawCatTail(def, -42, 8, tailPhase * 0.5, -1.2);
    } else if (pose === 'lounge') {
      // High shelf / clock lounge with dangling tail and dangling front paw!
      drawCatTail(def, -46, 6, tailPhase, 1.35); // Hanging down
      drawCatTorso(def, -4, -14, 55, 34 + breath, 0);
      // Dangling front leg over the ledge
      ctx.save();
      ctx.fillStyle = def.baseColor;
      drawRoundedRect(24, -4, 15, 38, 7);
      ctx.fill();
      drawCatPaw(def, 31, 34, 11, 9);
      ctx.restore();
      drawCatHead(def, 38, -36 + breath * 0.5, time, catPlacement);
    } else if (pose === 'box') {
      // Sitting inside cardboard box or woven basket: chest & paws over rim
      drawCatTail(def, -38, -18, tailPhase, 0.6);
      drawCatTorso(def, 0, -18, 42, 34 + breath, 0);
      drawCatHead(def, 8, -52 + breath * 0.5, time, catPlacement);
      // Paws resting on front edge of box/basket
      drawCatPaw(def, -12, -8, 13, 10);
      drawCatPaw(def, 24, -8, 13, 10);
    } else if (pose === 'peek') {
      // Peeking out from behind right velvet curtain
      drawCatTorso(def, -18, -12, 38, 36, 0);
      drawCatPaw(def, 18, 10, 13, 9);
      drawCatHead(def, 22, -42 + breath * 0.4, time, catPlacement);
    }

    ctx.restore();
  }

  function drawCatTail(def, startX, startY, phase, baseAngle) {
    ctx.save();
    ctx.translate(startX, startY);
    ctx.rotate(baseAngle);
    const wag = Math.sin(phase) * 18;

    ctx.strokeStyle = def.midColor;
    ctx.lineWidth = def.fluffy ? 18 : 13;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.bezierCurveTo(-28, -12 + wag * 0.4, -52, -28 + wag, -64, -8 + wag * 1.2);
    ctx.stroke();

    ctx.strokeStyle = def.baseColor;
    ctx.lineWidth = def.fluffy ? 14 : 10;
    ctx.stroke();

    // Ginger tabby tail rings
    if (def.stripes) {
      ctx.strokeStyle = def.stripeColor;
      ctx.lineWidth = def.fluffy ? 14 : 10;
      ctx.setLineDash([6, 9]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.restore();
  }

  function drawCatTorso(def, cx, cy, rx, ry, angle) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(angle);

    const grad = ctx.createRadialGradient(rx * 0.2, -ry * 0.25, rx * 0.15, 0, 0, Math.max(rx, ry));
    grad.addColorStop(0, def.baseColor);
    grad.addColorStop(0.7, def.midColor);
    grad.addColorStop(1, def.shadowColor);

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();

    // Fluffy chest ruff for White & Grey cats, or cream chest for Ginger tabby
    if (def.fluffy || def.bellyColor) {
      ctx.fillStyle = def.bellyColor || def.baseColor;
      ctx.beginPath();
      ctx.ellipse(rx * 0.42, -ry * 0.08, rx * 0.42, ry * 0.65, 0.15, 0, Math.PI * 2);
      ctx.fill();
    }

    // Tabby stripes on torso
    if (def.stripes) {
      ctx.strokeStyle = def.stripeColor;
      ctx.lineWidth = 4.5;
      ctx.lineCap = 'round';
      for (let i = -2; i <= 1; i++) {
        ctx.beginPath();
        ctx.arc(i * 13, -4, ry * 0.72, -Math.PI * 0.72, -Math.PI * 0.25);
        ctx.stroke();
      }
    }

    // Glossy specular sheen for sleek Black cat
    if (def.shineColor) {
      ctx.strokeStyle = def.shineColor;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(-4, -ry * 0.25, rx * 0.6, -Math.PI * 0.75, -Math.PI * 0.3);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCatPaw(def, x, y, rx, ry) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = def.bellyColor || def.baseColor;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = def.shadowColor;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Subtle toe lines
    ctx.beginPath();
    ctx.moveTo(rx * 0.3, -ry * 0.3);
    ctx.lineTo(rx * 0.75, -ry * 0.2);
    ctx.moveTo(rx * 0.35, ry * 0.25);
    ctx.lineTo(rx * 0.8, ry * 0.3);
    ctx.stroke();
    ctx.restore();
  }

  function drawCatHead(def, hx, hy, time, catPlacement) {
    ctx.save();
    ctx.translate(hx, hy);

    // Subtle head tilt or wrong-click shake
    let headTilt = Math.sin(time * 1.4 + def.index * 2) * 0.05;
    let earFlatten = 0;
    if (catPlacement.reactionTimer > 0 && catPlacement.reactionType === 'wrong') {
      headTilt = Math.sin(catPlacement.reactionTimer * Math.PI * 12) * 0.26;
      earFlatten = 0.38;
    }
    ctx.rotate(headTilt);

    // 1. Ears (with occasional twitch)
    const twitch = Math.sin(time * 6 + def.index * 3) > 0.94 ? 0.14 : 0;
    // Left/Back Ear
    ctx.save();
    ctx.translate(-14, -22);
    ctx.rotate(-0.28 - earFlatten + twitch);
    ctx.fillStyle = def.midColor;
    ctx.beginPath();
    ctx.moveTo(-12, 6);
    ctx.quadraticCurveTo(-8, -24, 2, -26);
    ctx.quadraticCurveTo(14, -14, 12, 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = def.earInner;
    ctx.beginPath();
    ctx.moveTo(-6, 4);
    ctx.quadraticCurveTo(-4, -16, 2, -18);
    ctx.quadraticCurveTo(8, -10, 7, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // Right/Front Ear
    ctx.save();
    ctx.translate(14, -22);
    ctx.rotate(0.25 + earFlatten);
    ctx.fillStyle = def.baseColor;
    ctx.beginPath();
    ctx.moveTo(-12, 6);
    ctx.quadraticCurveTo(-8, -24, 2, -26);
    ctx.quadraticCurveTo(14, -14, 12, 6);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = def.earInner;
    ctx.beginPath();
    ctx.moveTo(-6, 4);
    ctx.quadraticCurveTo(-4, -16, 2, -18);
    ctx.quadraticCurveTo(8, -10, 7, 4);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // 2. Main Cranium & Fluffy Cheek Ruffs
    const headGrad = ctx.createRadialGradient(4, -6, 5, 0, 0, 32);
    headGrad.addColorStop(0, def.baseColor);
    headGrad.addColorStop(0.75, def.midColor);
    headGrad.addColorStop(1, def.shadowColor);
    ctx.fillStyle = headGrad;

    ctx.beginPath();
    ctx.ellipse(0, 0, def.fluffy ? 31 : 27, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    // Fluffy cheek tufts for white and grey cats
    if (def.fluffy) {
      ctx.fillStyle = def.baseColor;
      ctx.beginPath();
      ctx.moveTo(-25, 2);
      ctx.lineTo(-36, 6);
      ctx.lineTo(-28, 12);
      ctx.lineTo(-33, 17);
      ctx.lineTo(-18, 18);
      ctx.moveTo(25, 2);
      ctx.lineTo(36, 6);
      ctx.lineTo(28, 12);
      ctx.lineTo(33, 17);
      ctx.lineTo(18, 18);
      ctx.fill();
    }

    // Tabby forehead "M" markings
    if (def.stripes) {
      ctx.strokeStyle = def.stripeColor;
      ctx.lineWidth = 2.8;
      ctx.beginPath();
      ctx.moveTo(-10, -12);
      ctx.lineTo(-5, -19);
      ctx.lineTo(0, -13);
      ctx.lineTo(5, -19);
      ctx.lineTo(10, -12);
      ctx.stroke();
    }

    // 3. Expressive Cat Eyes (with natural blinking)
    const blinkCycle = (time * 0.7 + def.index * 1.3) % 4.5;
    const eyeOpen = (blinkCycle > 4.32) ? 0.08 : 1.0;

    [-10, 11].forEach((ex, idx) => {
      ctx.save();
      ctx.translate(ex, -2);
      ctx.scale(1, eyeOpen);

      // Luminous iris
      ctx.fillStyle = def.eyeColor;
      ctx.beginPath();
      ctx.ellipse(0, 0, 7.2, 6.6, idx === 0 ? 0.1 : -0.1, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = def.eyeRim;
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Vertical slit pupil (dilates wider when excited/celebrating!)
      const pupilW = (catPlacement.reactionTimer > 0 && catPlacement.reactionType === 'correct') ? 4.8 : 2.5;
      ctx.fillStyle = '#0d0d12';
      ctx.beginPath();
      ctx.ellipse(0.5, 0, pupilW, 5.6, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dual specular catchlights
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(-2.2, -2.2, 2.1, 0, Math.PI * 2);
      ctx.arc(2.2, 2.0, 1.0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    // 4. Plump Whisker Pads, Cute Triangle Nose & Mouth
    ctx.fillStyle = def.bellyColor || def.baseColor;
    ctx.beginPath();
    ctx.arc(-5, 10, 7.5, 0, Math.PI * 2);
    ctx.arc(6, 10, 7.5, 0, Math.PI * 2);
    ctx.fill();

    // Nose
    ctx.fillStyle = def.noseColor;
    ctx.beginPath();
    ctx.moveTo(-4.5, 5.5);
    ctx.lineTo(5.5, 5.5);
    ctx.lineTo(0.5, 10.5);
    ctx.closePath();
    ctx.fill();

    // Happy open meow mouth when celebrating!
    if (catPlacement.reactionTimer > 0.35 && catPlacement.reactionType === 'correct') {
      ctx.fillStyle = '#d95d6e';
      ctx.beginPath();
      ctx.arc(0.5, 13, 5, 0, Math.PI);
      ctx.fill();
    }

    // 5. Long Delicate Whiskers
    ctx.strokeStyle = 'rgba(255, 250, 240, 0.72)';
    ctx.lineWidth = 1.3;
    [-1, 1].forEach(dir => {
      for (let w = -1; w <= 1; w++) {
        ctx.beginPath();
        ctx.moveTo(dir * 10, 10 + w * 2.5);
        ctx.quadraticCurveTo(dir * 26, 9 + w * 4, dir * 40, 12 + w * 6);
        ctx.stroke();
      }
    });

    ctx.restore();
  }

  // ============================================================================
  // CEILING CHANDELIER WITH PULL-CORD & WARM ROOM LIGHTING
  // ============================================================================
  function drawChandelierAndLighting(time) {
    const cx = 960;

    // 1. Warm light cone when room lights are on
    if (roomBrightness > 0.05) {
      ctx.save();
      ctx.globalAlpha = roomBrightness * 0.22;
      const cone = ctx.createRadialGradient(cx, 135, 30, cx, 540, 880);
      cone.addColorStop(0, 'rgba(255, 230, 150, 0.9)');
      cone.addColorStop(0.5, 'rgba(255, 200, 110, 0.35)');
      cone.addColorStop(1, 'rgba(255, 180, 90, 0)');
      ctx.fillStyle = cone;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    // 2. Pull-cord hanging down from chandelier center (Interactive!)
    if (cordPullOffset > 0) {
      cordPullOffset *= 0.84;
      if (cordPullOffset < 0.5) cordPullOffset = 0;
    }
    const cordEndY = 235 + cordPullOffset;

    ctx.save();
    // Subtle golden pulse around pull-cord acorn so player sees it's interactive
    const pulse = 0.3 + 0.3 * Math.sin(time * 3.5 + 1);
    const cordGlow = ctx.createRadialGradient(cx, cordEndY, 4, cx, cordEndY, 34);
    cordGlow.addColorStop(0, `rgba(255, 220, 100, ${pulse})`);
    cordGlow.addColorStop(1, 'rgba(255, 220, 100, 0)');
    ctx.fillStyle = cordGlow;
    ctx.beginPath();
    ctx.arc(cx, cordEndY, 34, 0, Math.PI * 2);
    ctx.fill();

    // Beaded brass chain
    ctx.strokeStyle = '#d4a243';
    ctx.lineWidth = 3;
    ctx.setLineDash([4, 3]);
    ctx.beginPath();
    ctx.moveTo(cx, 125);
    ctx.lineTo(cx, cordEndY);
    ctx.stroke();
    ctx.setLineDash([]);

    // Brass acorn pull handle
    ctx.fillStyle = '#f0c76e';
    ctx.beginPath();
    ctx.ellipse(cx, cordEndY + 6, 9, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#5c3b09';
    ctx.lineWidth = 2;
    ctx.stroke();

    // 3. Ornate Brass 3-Bulb Chandelier
    ctx.strokeStyle = '#b8862d';
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(cx, 0);
    ctx.lineTo(cx, 95);
    ctx.stroke();

    // Curved brass arms
    ctx.lineWidth = 6;
    [-115, 0, 115].forEach(offsetX => {
      if (offsetX !== 0) {
        ctx.beginPath();
        ctx.moveTo(cx, 85);
        ctx.quadraticCurveTo(cx + offsetX * 0.5, 135, cx + offsetX, 105);
        ctx.stroke();
      }
      // Glowing glass shade & bulb
      const bx = cx + offsetX;
      const by = offsetX === 0 ? 115 : 105;

      if (roomBrightness > 0.2) {
        const bGlow = ctx.createRadialGradient(bx, by + 12, 4, bx, by + 12, 56);
        bGlow.addColorStop(0, `rgba(255, 245, 190, ${0.85 * roomBrightness})`);
        bGlow.addColorStop(1, 'rgba(255, 210, 100, 0)');
        ctx.fillStyle = bGlow;
        ctx.beginPath();
        ctx.arc(bx, by + 12, 56, 0, Math.PI * 2);
        ctx.fill();
      }

      // Frosted amber glass bell shade
      ctx.fillStyle = roomBrightness > 0.3 ? '#ffe89e' : '#6e5c3e';
      ctx.beginPath();
      ctx.moveTo(bx - 16, by - 6);
      ctx.lineTo(bx + 16, by - 6);
      ctx.lineTo(bx + 28, by + 18);
      ctx.lineTo(bx - 28, by + 18);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#7a5414';
      ctx.lineWidth = 2.5;
      ctx.stroke();
    });

    // Center brass finial
    ctx.fillStyle = '#d4a243';
    ctx.beginPath();
    ctx.arc(cx, 92, 18, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // ============================================================================
  // BLACKOUT OVERLAY (Darkness + Moonlight Beam + Glowing Cat Eyes in the Dark)
  // ============================================================================
  function drawDarknessOverlay(activeCats, time) {
    if (roomBrightness >= 0.99) return;

    const darknessAlpha = (1 - roomBrightness) * 0.92;
    ctx.save();

    // Deep midnight blue-black darkness blanket
    ctx.fillStyle = `rgba(6, 9, 20, ${darknessAlpha})`;
    ctx.fillRect(0, 0, W, H);

    // Moonlight shaft streaming from the arched window across the dark room
    ctx.globalCompositeOperation = 'screen';
    const moonBeam = ctx.createLinearGradient(350, 180, 920, 980);
    moonBeam.addColorStop(0, `rgba(120, 175, 255, ${0.26 * (1 - roomBrightness)})`);
    moonBeam.addColorStop(1, 'rgba(120, 175, 255, 0)');
    ctx.fillStyle = moonBeam;
    ctx.beginPath();
    ctx.moveTo(290, 210);
    ctx.lineTo(570, 210);
    ctx.lineTo(1060, 1080);
    ctx.lineTo(430, 1080);
    ctx.closePath();
    ctx.fill();

    // Warm ember glow around the fireplace in the dark
    const emberGlow = ctx.createRadialGradient(1455, 720, 20, 1455, 720, 320);
    emberGlow.addColorStop(0, `rgba(255, 100, 20, ${0.45 * (1 - roomBrightness)})`);
    emberGlow.addColorStop(1, 'rgba(255, 60, 0, 0)');
    ctx.fillStyle = emberGlow;
    ctx.beginPath();
    ctx.arc(1455, 720, 320, 0, Math.PI * 2);
    ctx.fill();

    // Glowing cat eyes blinking in the dark!
    ctx.globalCompositeOperation = 'source-over';
    if (roomBrightness < 0.35) {
      activeCats.forEach(c => {
        const def = CAT_DEFS.find(d => d.id === c.catId);
        const spot = SPOTS[c.spotIndex];
        if (!def || !spot) return;

        // Slight darting motion of eyes while in the dark
        const dartX = (c.catId === movedCatId) ? Math.sin(time * 14) * 18 : 0;
        const ex = spot.x + spot.flip * 22 + dartX;
        const ey = spot.y - (spot.pose === 'sit' ? 70 : 38) * spot.scale;

        ctx.save();
        ctx.translate(ex, ey);
        ctx.fillStyle = def.eyeColor;
        ctx.shadowColor = def.eyeColor;
        ctx.shadowBlur = 14;
        [-9, 9].forEach(dx => {
          ctx.beginPath();
          ctx.ellipse(dx, 0, 5.5, 4.5, 0, 0, Math.PI * 2);
          ctx.fill();
        });
        ctx.restore();
      });
    }

    ctx.restore();
  }

  // ============================================================================
  // TOP-RIGHT ICONIC HUD BUTTONS (100% Wordless, Ornate Brass & Mahogany)
  // 1) "Peek Previous Arrangement" Button (Eye + Rewind Arrow)
  // 2) Minimalist "Next" Button (Sleek Double Forward Arrow + Spark)
  // ============================================================================
  const BTN_PEEK = { x: 1710, y: 74, r: 44 };
  const BTN_NEXT = { x: 1825, y: 74, r: 44 };

  function drawOrnateHudButtons(time) {
    // 1. PEEK PREVIOUS ARRANGEMENT BUTTON
    ctx.save();
    ctx.translate(BTN_PEEK.x, BTN_PEEK.y);
    if (peekPreviousMode) {
      const aura = ctx.createRadialGradient(0, 0, 18, 0, 0, 68);
      aura.addColorStop(0, 'rgba(255, 215, 70, 0.85)');
      aura.addColorStop(1, 'rgba(255, 215, 70, 0)');
      ctx.fillStyle = aura;
      ctx.beginPath();
      ctx.arc(0, 0, 68, 0, Math.PI * 2);
      ctx.fill();
    }

    // Outer carved brass ring
    const brass1 = ctx.createLinearGradient(-44, -44, 44, 44);
    brass1.addColorStop(0, '#ffe38f');
    brass1.addColorStop(0.5, '#b88328');
    brass1.addColorStop(1, '#5e3c08');
    ctx.fillStyle = brass1;
    ctx.beginPath();
    ctx.arc(0, 0, BTN_PEEK.r, 0, Math.PI * 2);
    ctx.fill();

    // Inner jewel medallion (warm amber when active, deep royal teal when idle)
    const inner1 = ctx.createRadialGradient(-10, -10, 4, 0, 0, 36);
    if (peekPreviousMode) {
      inner1.addColorStop(0, '#ffb703');
      inner1.addColorStop(1, '#9c5200');
    } else {
      inner1.addColorStop(0, '#2a6f62');
      inner1.addColorStop(1, '#12362f');
    }
    ctx.fillStyle = inner1;
    ctx.beginPath();
    ctx.arc(0, 0, 36, 0, Math.PI * 2);
    ctx.fill();

    // Icon: Circular Rewind Arrow + Watchful Eye inside
    ctx.strokeStyle = '#fff3c4';
    ctx.lineWidth = 3.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(0, 0, 24, -Math.PI * 0.75, Math.PI * 0.85);
    ctx.stroke();

    // Rewind arrowhead
    ctx.fillStyle = '#fff3c4';
    ctx.beginPath();
    ctx.moveTo(-22, -16);
    ctx.lineTo(-10, -24);
    ctx.lineTo(-13, -10);
    ctx.closePath();
    ctx.fill();

    // Eye symbol in center
    ctx.beginPath();
    ctx.moveTo(-14, 2);
    ctx.quadraticCurveTo(0, -10, 14, 2);
    ctx.quadraticCurveTo(0, 14, -14, 2);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, 2, 4.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 2. MINIMALIST "NEXT" BUTTON (Immediate Skip / Trigger Next Round)
    ctx.save();
    ctx.translate(BTN_NEXT.x, BTN_NEXT.y);

    // Gentle pulse when round is solved to invite clicking Next
    if (roundSolved) {
      const s = 1 + 0.06 * Math.sin(time * 6);
      ctx.scale(s, s);
      const nextAura = ctx.createRadialGradient(0, 0, 20, 0, 0, 66);
      nextAura.addColorStop(0, 'rgba(255, 210, 80, 0.65)');
      nextAura.addColorStop(1, 'rgba(255, 210, 80, 0)');
      ctx.fillStyle = nextAura;
      ctx.beginPath();
      ctx.arc(0, 0, 66, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = brass1;
    ctx.beginPath();
    ctx.arc(0, 0, BTN_NEXT.r, 0, Math.PI * 2);
    ctx.fill();

    const inner2 = ctx.createRadialGradient(-10, -10, 4, 0, 0, 36);
    inner2.addColorStop(0, '#8f242e');
    inner2.addColorStop(1, '#450c12');
    ctx.fillStyle = inner2;
    ctx.beginPath();
    ctx.arc(0, 0, 36, 0, Math.PI * 2);
    ctx.fill();

    // Icon: Sleek Forward Double-Chevron Arrow
    ctx.fillStyle = '#fff3c4';
    [-11, 5].forEach(ox => {
      ctx.beginPath();
      ctx.moveTo(ox - 4, -14);
      ctx.lineTo(ox + 12, 0);
      ctx.lineTo(ox - 4, 14);
      ctx.lineTo(ox - 4, -14);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
  }

  // ============================================================================
  // MEMORY PEEK SEPIA-GOLD VIGNETTE EFFECT
  // ============================================================================
  function drawMemoryPeekOverlay(time) {
    if (!peekPreviousMode) return;
    ctx.save();

    // Warm golden memory vignette frame around the widescreen view
    const vig = ctx.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, W * 0.62);
    vig.addColorStop(0, 'rgba(255, 215, 120, 0.06)');
    vig.addColorStop(0.7, 'rgba(218, 155, 45, 0.22)');
    vig.addColorStop(1, 'rgba(110, 65, 10, 0.65)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Ornate dashed golden memory border
    ctx.strokeStyle = 'rgba(255, 225, 130, 0.75)';
    ctx.lineWidth = 6;
    ctx.setLineDash([18, 12]);
    ctx.lineDashOffset = -time * 40;
    drawRoundedRect(24, 24, W - 48, H - 48, 22);
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.restore();
  }

  // ============================================================================
  // CELEBRATION & PAW-TRAIL PARTICLES RENDERER
  // ============================================================================
  function updateAndDrawParticles(dt) {
    // 1. Golden Paw-Print Trail from previous spot to new spot
    for (let i = trailParticles.length - 1; i >= 0; i--) {
      const tp = trailParticles[i];
      tp.age += dt;
      if (tp.age >= tp.delay) {
        const progress = (tp.age - tp.delay) / tp.life;
        if (progress >= 1) {
          trailParticles.splice(i, 1);
          continue;
        }
        const alpha = Math.sin(progress * Math.PI) * 0.85;
        drawPawPrint(tp.x, tp.y, 16, '#ffd700', alpha, tp.angle);
      }
    }

    // 2. Burst Celebration Particles (Stars, Musical Notes, Hearts, Paws)
    for (let i = celebrationParticles.length - 1; i >= 0; i--) {
      const p = celebrationParticles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.22; // gentle gravity
      p.rot += p.vRot;
      p.life -= dt * 0.75;

      if (p.life <= 0) {
        celebrationParticles.splice(i, 1);
        continue;
      }

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = p.color;

      if (p.shape === 'star') {
        drawStarShape(0, 0, 5, p.size, p.size * 0.45);
      } else if (p.shape === 'note') {
        // Musical eighth note
        ctx.beginPath();
        ctx.ellipse(-4, 4, p.size * 0.45, p.size * 0.32, -0.3, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(p.size * 0.3, 4);
        ctx.lineTo(p.size * 0.3, -p.size * 0.9);
        ctx.quadraticCurveTo(p.size * 0.8, -p.size * 0.6, p.size * 0.7, -p.size * 0.2);
        ctx.stroke();
      } else if (p.shape === 'heart') {
        const s = p.size * 0.6;
        ctx.beginPath();
        ctx.moveTo(0, s * 0.4);
        ctx.bezierCurveTo(-s, -s * 0.4, -s * 0.5, -s * 1.2, 0, -s * 0.4);
        ctx.bezierCurveTo(s * 0.5, -s * 1.2, s, -s * 0.4, 0, s * 0.4);
        ctx.fill();
      } else {
        drawPawPrint(0, 0, p.size * 0.8, p.color, p.life, 0);
      }
      ctx.restore();
    }
  }

  // ============================================================================
  // AMBIENT FLOATING DUST MOTES
  // ============================================================================
  function drawDustMotes(time) {
    ctx.save();
    dustMotes.forEach(m => {
      m.x += m.vx + Math.sin(time + m.phase) * 0.15;
      m.y += m.vy;
      if (m.y < 0) m.y = H;
      if (m.x < 0) m.x = W;
      if (m.x > W) m.x = 0;

      ctx.fillStyle = `rgba(255, 232, 175, ${m.alpha * roomBrightness})`;
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.restore();
  }

  // ============================================================================
  // UNIFIED SCENE RENDERER WITH PROPER DEPTH LAYERING
  // ============================================================================
  function renderScene(time, dt) {
    ctx.clearRect(0, 0, W, H);

    // Choose whether we are rendering the live state or the Peek Previous state
    const activeCats = (peekPreviousMode && previousCats.length) ? previousCats : currentCats;
    const activeDistractors = (peekPreviousMode && previousDistractors) ? previousDistractors : distractors;

    // 1. Living Room Background & Furniture
    drawLivingRoomBackground(time);

    // 2. Back halves of containers (Box, Basket, Ottoman)
    drawContainerBack('cardboard_box');
    drawContainerBack('ottoman_top');
    drawContainerBack('woven_basket');

    // 3. Mid-layer cats (Bookshelf top, Windowsill, Clock top, Under table)
    activeCats.forEach(c => {
      const sp = SPOTS[c.spotIndex];
      if (sp && sp.layer === 'mid') {
        drawRealisticCat(c, time, peekPreviousMode);
      }
    });

    // 4. Mid-front cats (Sofa cushion, Armchair seat, Curtain peek)
    activeCats.forEach(c => {
      const sp = SPOTS[c.spotIndex];
      if (sp && sp.layer === 'mid_front') {
        drawRealisticCat(c, time, peekPreviousMode);
      }
    });

    // Right window curtain overlaps in front of the curtain-peeking cat!
    drawContainerFront('curtain_peek');

    // 5. Distracting Animals & Objects (Mouse, Parrot, Puppy, Yarn Ball)
    drawDistractors(activeDistractors, time);

    // 6. Front-layer cats (Cardboard box, Woven basket, Fireplace hearth, Ottoman)
    activeCats.forEach(c => {
      const sp = SPOTS[c.spotIndex];
      if (sp && sp.layer === 'front') {
        drawRealisticCat(c, time, peekPreviousMode);
      }
    });

    // 7. Front rims of Cardboard Box & Woven Basket (so cats sit INSIDE them!)
    drawContainerFront('cardboard_box');
    drawContainerFront('woven_basket');

    // 8. Chandelier, Pull-Cord & Ambient Dust Motes
    drawChandelierAndLighting(time);
    drawDustMotes(time);

    // 9. Celebration sparkles & Paw-print movement trail
    updateAndDrawParticles(dt);

    // 10. Blackout Darkness & Glowing Cat Eyes
    drawDarknessOverlay(activeCats, time);

    // 11. Memory Peek Golden Vignette (when viewing Previous Arrangement)
    drawMemoryPeekOverlay(time);

    // 12. Top-Right HUD Iconic Buttons (Peek Previous + Next)
    drawOrnateHudButtons(time);
  }

  // ============================================================================
  // UPDATE LOOP (Light Flicker State Machine & Animation Timers)
  // ============================================================================
  let lastTime = performance.now();

  function update(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    const time = now / 1000;

    // Update cat reaction timers
    currentCats.forEach(c => {
      if (c.reactionTimer > 0) {
        c.reactionTimer = Math.max(0, c.reactionTimer - dt * 0.72);
      }
    });

    // Update distractor click animations
    ['puppyAnim', 'mouseAnim', 'yarnAnim', 'parrotAnim', 'aquariumAnim'].forEach(key => {
      if (distractors[key] > 0) {
        distractors[key] = Math.max(0, distractors[key] - dt * 1.4);
      }
    });

    // Light Blink & Blackout state machine
    if (lightState === 'flicker_out') {
      blackoutTimer += dt;
      // Realistic 3-blink fluorescent/incandescent flicker pattern
      if (blackoutTimer < 0.08) {
        roomBrightness = 0.25;
      } else if (blackoutTimer < 0.16) {
        if (roomBrightness < 0.5) sound.playBulbBuzz(0.06);
        roomBrightness = 0.92;
      } else if (blackoutTimer < 0.25) {
        roomBrightness = 0.12;
      } else if (blackoutTimer < 0.33) {
        roomBrightness = 0.75;
      } else {
        roomBrightness = 0.0;
        lightState = 'dark';
        blackoutTimer = 0;
        performDarkRoomSwap();
      }
    } else if (lightState === 'dark') {
      blackoutTimer += dt;
      roomBrightness = 0.0;
      if (blackoutTimer >= 1.05) {
        lightState = 'flicker_in';
        blackoutTimer = 0;
        sound.playSwitchClick(1.12);
      }
    } else if (lightState === 'flicker_in') {
      blackoutTimer += dt;
      if (blackoutTimer < 0.07) {
        roomBrightness = 0.85;
      } else if (blackoutTimer < 0.13) {
        roomBrightness = 0.35;
      } else {
        roomBrightness = 1.0;
        lightState = 'on';
        blackoutTimer = 0;
      }
    }

    renderScene(time, dt);
    requestAnimationFrame(update);
  }

  // ============================================================================
  // INTERACTION & HIT-TESTING (Mouse & Touch)
  // ============================================================================
  function getCanvasCoords(evt) {
    const rect = canvas.getBoundingClientRect();
    const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
    const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
    return {
      x: ((clientX - rect.left) / rect.width) * W,
      y: ((clientY - rect.top) / rect.height) * H
    };
  }

  function handlePointerDown(evt) {
    evt.preventDefault();
    sound.init();
    autoFirstBlinkScheduled = false;

    const pt = getCanvasCoords(evt);

    // 1. Check Top-Right "Peek Previous Arrangement" Button
    if (Math.hypot(pt.x - BTN_PEEK.x, pt.y - BTN_PEEK.y) <= BTN_PEEK.r + 8) {
      if (lightState === 'on') {
        peekPreviousMode = !peekPreviousMode;
        sound.playMemoryShimmer(peekPreviousMode);
      }
      return;
    }

    // 2. Check Top-Right Minimalist "Next" Button (Immediate next task!)
    if (Math.hypot(pt.x - BTN_NEXT.x, pt.y - BTN_NEXT.y) <= BTN_NEXT.r + 8) {
      triggerBlackout(false);
      return;
    }

    // If user is currently in Peek Previous Mode, clicking anywhere in the room
    // smoothly returns them to the current room state so they can answer
    if (peekPreviousMode) {
      peekPreviousMode = false;
      sound.playMemoryShimmer(false);
      return;
    }

    // Ignore room clicks while lights are actively flickering/dark
    if (lightState !== 'on') return;

    // 3. Check Wall Light Switch (x: 635, y: 470)
    if (Math.abs(pt.x - 635) <= 44 && Math.abs(pt.y - 470) <= 52) {
      triggerBlackout(false);
      return;
    }

    // 4. Check Hanging Chandelier & Pull-Cord (x: 960, y: 0..265)
    if (
      (Math.abs(pt.x - 960) <= 145 && pt.y <= 145) ||
      (Math.abs(pt.x - 960) <= 42 && pt.y >= 110 && pt.y <= 275)
    ) {
      triggerBlackout(true);
      return;
    }

    // 5. Check Clicking on any of the 4 Cats!
    // Check front-to-back so overlapping elements feel accurate
    for (let i = currentCats.length - 1; i >= 0; i--) {
      const catPlacement = currentCats[i];
      const spot = SPOTS[catPlacement.spotIndex];
      const hitX = spot.x;
      const hitY = spot.y - 28 * spot.scale;
      const dist = Math.hypot(pt.x - hitX, pt.y - hitY);

      if (dist <= 78 * spot.scale) {
        if (catPlacement.catId === movedCatId) {
          // If already solved and celebration finished, clicking the winner cat again can even trigger next round!
          if (roundSolved && catPlacement.reactionTimer <= 0.05) {
            triggerBlackout(false);
            return;
          }
          // CORRECT! This is the cat that moved!
          roundSolved = true;
          catPlacement.reactionType = 'correct';
          catPlacement.reactionTimer = 1.0;
          catPlacement.celebStyle = celebrationCounter++;

          const oldSpot = SPOTS[movedFromSpot] || spot;
          spawnCelebration(spot.x, spot.y - 30, oldSpot.x, oldSpot.y - 20, catPlacement.celebStyle);
          sound.playHappyMeow(CAT_DEFS.findIndex(d => d.id === catPlacement.catId), catPlacement.celebStyle);
        } else {
          // WRONG CAT! Play comical "Not me!" head-shake & questioning mrrp
          catPlacement.reactionType = 'wrong';
          catPlacement.reactionTimer = 0.65;
          sound.playWrongCatMrrp(CAT_DEFS.findIndex(d => d.id === catPlacement.catId));
        }
        return;
      }
    }

    // 6. Check Interactive Distractors (Puppy, Parrot, Mouse, Yarn, Aquarium)
    const pup = PUPPY_SPOTS[distractors.puppySpot];
    if (Math.hypot(pt.x - pup.x, pt.y - pup.y) <= 72) {
      distractors.puppyAnim = 1.0;
      sound.playPuppyYip();
      return;
    }

    if (Math.hypot(pt.x - 1305, pt.y - 490) <= 68) {
      distractors.parrotAnim = 1.0;
      sound.playParrotChirp();
      return;
    }

    const hole = MOUSE_HOLES[distractors.mouseHole];
    if (Math.hypot(pt.x - hole.x, pt.y - hole.y) <= 48) {
      distractors.mouseAnim = 1.0;
      sound.playMouseSqueak();
      return;
    }

    const yarn = YARN_SPOTS[distractors.yarnSpot];
    if (Math.hypot(pt.x - yarn.x, pt.y - yarn.y) <= 46) {
      distractors.yarnAnim = 1.0;
      sound.playSoftThump();
      return;
    }

    // Aquarium bowl on side table
    if (Math.hypot(pt.x - 465, pt.y - 552) <= 65) {
      distractors.aquariumAnim = 1.0;
      sound.playBubbleSplash();
      return;
    }
  }

  canvas.addEventListener('pointerdown', handlePointerDown, { passive: false });

  // Start main animation loop on load
  window.onload = function () {
    lastTime = performance.now();
    requestAnimationFrame(update);
  };
})();
</script>
</body>
