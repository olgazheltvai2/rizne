<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pig & Wolves</title>
    <style>
        /* Скидання стилів та базові налаштування */
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        
        body {
            background-color: #0b1a0e;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Головний контейнер гри зі строгим співвідношенням 16:9 (альбомна орієнтація) */
        #game-view {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 16:9 ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 ratio */
            border-radius: 15px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            overflow: hidden;
            /* Фон завантажується з репозиторію за вимогою користувача, з резервним градієнтом */
            background-image: url('https://olgazheltvai2.github.io/images/backgrounds/game_bg.jpg'), linear-gradient(135deg, #1e3d23 0%, #0a1f10 100%);
            background-size: cover;
            background-position: center;
        }

        /* Додатковий шар для створення ефекту глибини та легкої розмитості фону */
        #bg-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, transparent 40%, rgba(0,0,0,0.5) 100%);
            backdrop-filter: blur(2px) saturate(1.2);
            z-index: 1;
        }

        /* Контейнер для персонажа та ігрового поля */
        #scene {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8%;
        }

        /* Живий персонаж (Ведмідь-спостерігач) */
        #character {
            width: 28%;
            max-width: 350px;
            height: auto;
            transform-origin: bottom center;
            animation: breathe 3.5s infinite ease-in-out;
            filter: drop-shadow(0 15px 15px rgba(0,0,0,0.6));
        }
        .bear-arm-l { transform-origin: 80% 20%; animation: waveArm 5s infinite ease-in-out; }
        .bear-ears { transform-origin: 50% 50%; animation: earWiggle 4s infinite; }
        .bear-eyes { animation: blink 4.5s infinite; transform-origin: center; }
        
        @keyframes breathe { 0%, 100% { transform: scaleY(1) translateY(0); } 50% { transform: scaleY(1.03) translateY(-10px); } }
        @keyframes waveArm { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-15deg); } }
        @keyframes earWiggle { 0%, 90%, 100% { transform: rotate(0deg); } 95% { transform: rotate(8deg); } }
        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }

        /* Ігрове поле - фіксоване, непрозоре, контрастне */
        #board-container {
            position: relative;
            width: 42vw;
            height: 42vw;
            max-width: 500px;
            max-height: 500px;
            background: linear-gradient(135deg, #3d2314 0%, #1f1008 100%);
            border-radius: 20px;
            padding: 1.5vw;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(255,255,255,0.1);
            border: 4px solid #5c3826;
            transition: box-shadow 0.4s ease;
        }

        /* Підсвітка чий зараз хід */
        #board-container.turn-pig { box-shadow: 0 0 50px #ff8da1, inset 0 0 20px #ff8da1; border-color: #ffb6c1; }
        #board-container.turn-wolf { box-shadow: 0 0 50px #a3c4d6, inset 0 0 20px #a3c4d6; border-color: #87ceeb; }

        /* Грід 5х5 */
        #grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 1.2%;
            width: 100%; height: 100%;
            position: relative;
        }

        /* Клітинки поля - повністю непрозорі та контрастні */
        .cell {
            background: linear-gradient(145deg, #6b8e23, #4a6616);
            border-radius: 12px;
            box-shadow: inset 3px 3px 6px rgba(255,255,255,0.15), inset -3px -3px 6px rgba(0,0,0,0.6), 0 5px 10px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        /* Декоративний візерунок на клітинках */
        .cell::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(#30420f 15%, transparent 16%);
            background-size: 10px 10px;
            opacity: 0.3;
        }

        /* Підсвітка можливих ходів (псевдоелемент, щоб не ламати розміри) */
        .cell::after {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 70%; height: 70%;
            transform: translate(-50%, -50%) scale(0);
            border-radius: 50%;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            z-index: 5;
        }
        .cell.highlight-pig::after {
            background: radial-gradient(circle, rgba(255,182,193,0.8) 0%, transparent 70%);
            box-shadow: 0 0 20px #ff8da1;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: pulse-dot 1s infinite alternate;
        }
        .cell.highlight-wolf::after {
            background: radial-gradient(circle, rgba(163,196,214,0.8) 0%, transparent 70%);
            box-shadow: 0 0 20px #a3c4d6;
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
            animation: pulse-dot 1s infinite alternate;
        }

        @keyframes pulse-dot { 
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; } 
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; } 
        }

        /* Клікабельний шар поверх гріда */
        .click-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 20;
            cursor: pointer;
        }

        /* Контейнер для сутностей */
        #entities {
            position: absolute;
            top: 1.5vw; left: 1.5vw;
            width: calc(100% - 3vw);
            height: calc(100% - 3vw);
            pointer-events: none;
            z-index: 10;
        }

        .entity {
            position: absolute;
            width: 20%; /* 1/5 від сітки */
            height: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .entity svg { 
            width: 85%; height: 85%; 
            filter: drop-shadow(0 8px 6px rgba(0,0,0,0.6)); 
        }
        
        .acorn { z-index: 11; }
        .wolf { z-index: 12; }
        .pig { z-index: 13; }

        .wolf.selected svg {
            filter: drop-shadow(0 0 20px #a3c4d6) brightness(1.3);
            transform: scale(1.15);
        }

        .eaten {
            transform: scale(0) rotate(360deg) !important;
            opacity: 0;
            transition: all 0.6s cubic-bezier(0.55, 0.085, 0.68, 0.53) !important;
        }

        /* Оверлей вибору ролі - стилізований */
        #role-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 26, 14, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .role-panel {
            display: flex;
            gap: 5vw;
            padding: 4vw;
            background: radial-gradient(circle, #3d2314 0%, #1f1008 100%);
            border-radius: 30px;
            border: 5px solid #7b5836;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
        }
        .role-btn {
            background: linear-gradient(145deg, #4a2f1d, #2b180d);
            border: 4px solid #7b5836;
            border-radius: 25px;
            width: 18vw; height: 22vw;
            max-width: 200px; max-height: 250px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .role-btn:hover { transform: translateY(-15px) scale(1.05); }
        .role-btn.pig-btn:hover { box-shadow: 0 15px 40px #ff8da1; border-color: #ff8da1; }
        .role-btn.wolf-btn:hover { box-shadow: 0 15px 40px #a3c4d6; border-color: #a3c4d6; }
        .role-btn svg { width: 70%; height: 70%; pointer-events: none; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }

        /* Canvas для ефектів */
        #fx-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 50;
        }

        /* Мінімалістичні кнопки навігації */
        .nav-btn {
            position: absolute;
            bottom: 3vh;
            width: 6vh; height: 6vh;
            background: rgba(255,255,255,0.15);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            z-index: 90;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        .nav-btn:hover { 
            background: rgba(255,255,255,0.3); 
            transform: scale(1.15) translateY(-5px); 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .nav-btn svg { width: 40%; height: 40%; fill: #fff; }
        #btn-prev { left: 3vw; }
        #btn-next { right: 3vw; }

    </style>
</head>
<body>

<div id="game-view">
    <div id="bg-overlay"></div>
    <canvas id="fx-canvas"></canvas>

    <!-- Навігаційні кнопки -->
    <div id="btn-prev" class="nav-btn" onclick="location.reload()">
        <svg viewBox="0 0 24 24"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
    </div>
    <div id="btn-next" class="nav-btn" onclick="location.reload()">
        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/></svg>
    </div>

    <div id="scene">
        <!-- Анімований персонаж (Ведмідь) -->
        <div id="character">
            <svg viewBox="0 0 400 500" xmlns="http://www.w3.org/2000/svg">
                <!-- Тіло -->
                <path d="M 100 450 C 50 250, 150 150, 200 150 C 250 150, 350 250, 300 450 Z" fill="#5c3826" stroke="#3d2314" stroke-width="6"/>
                <path d="M 140 450 C 120 300, 170 220, 200 220 C 230 220, 280 300, 260 450 Z" fill="#8b5a2b"/>
                <!-- Права лапа -->
                <path d="M 280 250 C 350 280, 380 380, 320 420 C 280 440, 260 350, 280 250 Z" fill="#5c3826" stroke="#3d2314" stroke-width="4"/>
                <!-- Ліва лапа (махає) -->
                <g class="bear-arm-l">
                    <path d="M 120 250 C 50 200, 20 280, 50 350 C 80 400, 140 350, 120 250 Z" fill="#5c3826" stroke="#3d2314" stroke-width="4"/>
                    <circle cx="60" cy="320" r="20" fill="#3d2314"/>
                    <circle cx="45" cy="290" r="12" fill="#3d2314"/>
                    <circle cx="80" cy="285" r="12" fill="#3d2314"/>
                </g>
                <!-- Голова -->
                <g class="bear-ears">
                    <circle cx="130" cy="110" r="40" fill="#5c3826" stroke="#3d2314" stroke-width="5"/>
                    <circle cx="130" cy="110" r="25" fill="#8b5a2b"/>
                    <circle cx="270" cy="110" r="40" fill="#5c3826" stroke="#3d2314" stroke-width="5"/>
                    <circle cx="270" cy="110" r="25" fill="#8b5a2b"/>
                </g>
                <circle cx="200" cy="160" r="90" fill="#5c3826" stroke="#3d2314" stroke-width="6"/>
                <!-- Мордочка -->
                <ellipse cx="200" cy="190" rx="45" ry="35" fill="#e8c396"/>
                <path d="M 180 180 Q 200 200 220 180 Q 200 210 180 180" fill="#3d2314"/>
                <circle cx="200" cy="170" r="12" fill="#1a0f08"/>
                <!-- Очі -->
                <g class="bear-eyes">
                    <circle cx="165" cy="135" r="12" fill="#1a0f08"/>
                    <circle cx="168" cy="132" r="4" fill="#fff"/>
                    <circle cx="235" cy="135" r="12" fill="#1a0f08"/>
                    <circle cx="232" cy="132" r="4" fill="#fff"/>
                </g>
            </svg>
        </div>

        <!-- Ігрове поле -->
        <div id="board-container">
            <div id="grid"></div>
            <div id="entities"></div>
        </div>
    </div>

    <!-- Вибір ролі -->
    <div id="role-overlay">
        <div class="role-panel">
            <div class="role-btn pig-btn" onclick="startGame('pig')">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="55" r="35" fill="#ffb6c1" stroke="#e0728c" stroke-width="3"/>
                    <polygon points="15,35 5,10 35,25" fill="#fca3b7" stroke="#e0728c" stroke-width="2"/>
                    <polygon points="85,35 95,10 65,25" fill="#fca3b7" stroke="#e0728c" stroke-width="2"/>
                    <ellipse cx="50" cy="65" rx="18" ry="12" fill="#ff8da1" stroke="#e0728c" stroke-width="2"/>
                    <circle cx="43" cy="65" r="3" fill="#ba4a62"/>
                    <circle cx="57" cy="65" r="3" fill="#ba4a62"/>
                    <circle cx="35" cy="45" r="5" fill="#333"/>
                    <circle cx="65" cy="45" r="5" fill="#333"/>
                    <circle cx="36" cy="43" r="2" fill="#fff"/>
                    <circle cx="66" cy="43" r="2" fill="#fff"/>
                </svg>
            </div>
            <div class="role-btn wolf-btn" onclick="startGame('wolves')">
                <svg viewBox="0 0 100 100">
                    <circle cx="50" cy="55" r="35" fill="#6d767a" stroke="#4a5259" stroke-width="3"/>
                    <polygon points="20,40 10,5 40,30" fill="#5b6266" stroke="#4a5259" stroke-width="2"/>
                    <polygon points="80,40 90,5 60,30" fill="#5b6266" stroke="#4a5259" stroke-width="2"/>
                    <polygon points="25,55 75,55 50,90" fill="#4a5259"/>
                    <circle cx="35" cy="45" r="7" fill="#ffcc00"/>
                    <circle cx="65" cy="45" r="7" fill="#ffcc00"/>
                    <polygon points="32,42 40,45 32,45" fill="#353b3d"/>
                    <polygon points="68,42 60,45 68,45" fill="#353b3d"/>
                    <circle cx="50" cy="85" r="5" fill="#111"/>
                </svg>
            </div>
        </div>
    </div>
</div>

<script>
    // --- АУДІО ДВИЖОК (Синтезатор) ---
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    
    function playTone(freq, type, duration, vol = 0.1) {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const FX = {
        pigMove: () => playTone(650, 'sine', 0.2, 0.2),
        wolfSelect: () => playTone(350, 'square', 0.1, 0.1),
        wolfMove: () => playTone(250, 'sawtooth', 0.25, 0.3),
        eatAcorn: () => { playTone(1000, 'triangle', 0.1, 0.1); setTimeout(()=>playTone(1300, 'triangle', 0.15, 0.15), 80); },
        pigDie: () => { playTone(180, 'sawtooth', 0.6, 0.4); setTimeout(()=>playTone(120, 'sawtooth', 0.8, 0.5), 250); },
        winPig: () => { [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.4, 0.3), i*150)); },
        error: () => playTone(150, 'square', 0.2, 0.3)
    };

    // --- CANVAS АНІМАЦІЇ (Частинки) ---
    const canvas = document.getElementById('fx-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    
    function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function spawnParticles(gridX, gridY, colorStr, amount, type) {
        const board = document.getElementById('board-container');
        const rect = board.getBoundingClientRect();
        const pad = rect.width * 0.035; // padding 1.5vw
        const cellW = (rect.width - pad*2) / 5;
        const cellH = (rect.height - pad*2) / 5;
        
        const px = rect.left + pad + (gridX * cellW) + (cellW / 2);
        const py = rect.top + pad + (gridY * cellH) + (cellH / 2);

        for (let i = 0; i < amount; i++) {
            const angle = Math.random() * Math.PI * 2;
            const speed = Math.random() * (type === 'explode' ? 18 : 6) + 3;
            particles.push({
                x: px, y: py,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed - (type === 'confetti' ? 6 : 0),
                size: Math.random() * 10 + 5,
                color: colorStr,
                life: 1,
                decay: Math.random() * 0.02 + 0.015,
                type: type,
                angle: Math.random() * 360,
                rotSpeed: (Math.random() - 0.5) * 10
            });
        }
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            if (p.type === 'confetti') p.vy += 0.25; // Гравітація
            p.life -= p.decay;
            p.angle += p.rotSpeed;
            
            ctx.globalAlpha = Math.max(0, p.life);
            ctx.fillStyle = p.color;
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate(p.angle * Math.PI / 180);
            
            if (p.type === 'confetti') {
                ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
            } else {
                ctx.beginPath();
                ctx.arc(0, 0, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
            ctx.globalAlpha = 1;
            
            if (p.life <= 0) particles.splice(i, 1);
        }
        requestAnimationFrame(animateParticles);
    }
    animateParticles();

    // --- ЛОГІКА ГРИ ---
    const SVG_PIG = `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="35" fill="#ffb6c1" stroke="#e0728c" stroke-width="2"/><polygon points="15,35 5,10 35,25" fill="#fca3b7" stroke="#e0728c" stroke-width="2"/><polygon points="85,35 95,10 65,25" fill="#fca3b7" stroke="#e0728c" stroke-width="2"/><ellipse cx="50" cy="65" rx="18" ry="12" fill="#ff8da1" stroke="#e0728c" stroke-width="2"/><circle cx="43" cy="65" r="3" fill="#ba4a62"/><circle cx="57" cy="65" r="3" fill="#ba4a62"/><circle cx="35" cy="45" r="5" fill="#333"/><circle cx="65" cy="45" r="5" fill="#333"/><circle cx="36" cy="43" r="2" fill="#fff"/><circle cx="66" cy="43" r="2" fill="#fff"/></svg>`;
    const SVG_WOLF = `<svg viewBox="0 0 100 100"><circle cx="50" cy="55" r="35" fill="#6d767a" stroke="#4a5259" stroke-width="2"/><polygon points="20,40 10,5 40,30" fill="#5b6266" stroke="#4a5259" stroke-width="2"/><polygon points="80,40 90,5 60,30" fill="#5b6266" stroke="#4a5259" stroke-width="2"/><polygon points="25,55 75,55 50,90" fill="#4a5259"/><circle cx="35" cy="45" r="7" fill="#ffcc00"/><circle cx="65" cy="45" r="7" fill="#ffcc00"/><polygon points="32,42 40,45 32,45" fill="#353b3d"/><polygon points="68,42 60,45 68,45" fill="#353b3d"/><circle cx="50" cy="85" r="5" fill="#111"/></svg>`;
    const SVG_ACORN = `<svg viewBox="0 0 100 100"><path d="M 25 45 Q 25 90 50 90 Q 75 90 75 45 Z" fill="#8B5A2B"/><path d="M 20 45 C 20 20, 80 20, 80 45 Z" fill="#5E3A19"/><path d="M 50 25 C 50 10, 55 5, 65 5" fill="none" stroke="#5E3A19" stroke-width="5" stroke-linecap="round"/></svg>`;

    const GRID_SIZE = 5;
    
    let state = {
        turn: '', 
        pig: {x: 2, y: 2, eaten: false},
        wolves: [{x: 0, y: 0, moved: false}, {x: 4, y: 4, moved: false}],
        acorns: [],
        selectedWolfIdx: -1,
        active: false
    };

    function generateGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${x}-${y}`;
                
                let clickLayer = document.createElement('div');
                clickLayer.className = 'click-layer';
                clickLayer.onclick = () => handleCellClick(x, y);
                cell.appendChild(clickLayer);
                
                grid.appendChild(cell);
            }
        }
    }

    function initAcorns() {
        let cells = [];
        for (let x = 0; x < GRID_SIZE; x++) {
            for (let y = 0; y < GRID_SIZE; y++) {
                if ((x===2&&y===2) || (x===0&&y===0) || (x===4&&y===4)) continue;
                cells.push({x, y});
            }
        }
        // Рандомізація та вибір 10 жолудів
        cells.sort(() => Math.random() - 0.5);
        state.acorns = cells.slice(0, 10);
    }

    function renderEntities() {
        const container = document.getElementById('entities');
        container.innerHTML = '';
        
        // Малюємо жолуді
        state.acorns.forEach(a => {
            let el = createEntityEl('acorn', SVG_ACORN, a.x, a.y);
            container.appendChild(el);
        });

        // Малюємо свинку
        if (!state.pig.eaten) {
            let pEl = createEntityEl('pig', SVG_PIG, state.pig.x, state.pig.y);
            container.appendChild(pEl);
        }

        // Малюємо вовків
        state.wolves.forEach((w, idx) => {
            let wEl = createEntityEl('wolf', SVG_WOLF, w.x, w.y);
            if (state.selectedWolfIdx === idx) wEl.classList.add('selected');
            container.appendChild(wEl);
        });
    }

    function createEntityEl(cls, svg, x, y) {
        let div = document.createElement('div');
        div.className = `entity ${cls}`;
        div.innerHTML = svg;
        // Позиціювання у відсотках для адаптивності
        div.style.transform = `translate(${x * 100}%, ${y * 100}%)`;
        return div;
    }

    // Тороїдальне загортання координат
    const wrap = (val) => (val % GRID_SIZE + GRID_SIZE) % GRID_SIZE;

    const dirs = [
        {dx: 0, dy: -1}, {dx: 0, dy: 1}, {dx: -1, dy: 0}, {dx: 1, dy: 0},
        {dx: -1, dy: -1}, {dx: 1, dy: -1}, {dx: -1, dy: 1}, {dx: 1, dy: 1}
    ];

    // Оновлена логіка: Свинка завжди ходить рівно на 3 кроки в одному напрямку
    function getValidPigMoves() {
        let valid = [];
        for (let d of dirs) {
            let blocked = false;
            let path = [];
            let cx = state.pig.x;
            let cy = state.pig.y;
            
            for (let s = 1; s <= 3; s++) {
                cx = wrap(cx + d.dx);
                cy = wrap(cy + d.dy);
                // Вовки є перешкодами на будь-якому етапі стрибка
                if (state.wolves.some(w => w.x === cx && w.y === cy)) {
                    blocked = true; 
                    break;
                }
                path.push({x: cx, y: cy});
            }
            if (!blocked) {
                valid.push({ endX: cx, endY: cy, path: path });
            }
        }
        return valid;
    }

    // Вовки ходять на 1 клітинку
    function getValidWolfMoves(wIdx) {
        const wolf = state.wolves[wIdx];
        let valid = [];
        for (let d of dirs) {
            let cx = wrap(wolf.x + d.dx);
            let cy = wrap(wolf.y + d.dy);
            
            let otherW = state.wolves[wIdx === 0 ? 1 : 0];
            if (otherW.x === cx && otherW.y === cy) continue; // Не наступати на іншого вовка
            
            valid.push({x: cx, y: cy});
        }
        return valid;
    }

    function updateHighlight() {
        document.querySelectorAll('.cell').forEach(c => {
            c.classList.remove('highlight-pig', 'highlight-wolf');
        });
        
        if (!state.active) return;

        if (state.turn === 'pig') {
            getValidPigMoves().forEach(m => {
                document.getElementById(`cell-${m.endX}-${m.endY}`).classList.add('highlight-pig');
            });
        } else {
            if (state.selectedWolfIdx !== -1) {
                getValidWolfMoves(state.selectedWolfIdx).forEach(m => {
                    document.getElementById(`cell-${m.x}-${m.y}`).classList.add('highlight-wolf');
                });
            }
        }
    }

    function updateUI() {
        const board = document.getElementById('board-container');
        board.className = state.turn === 'pig' ? 'turn-pig' : 'turn-wolf';
    }

    function handleCellClick(x, y) {
        if (!state.active) return;
        
        if (state.turn === 'pig') {
            let moves = getValidPigMoves();
            let chosenMove = moves.find(m => m.endX === x && m.endY === y);
            
            if (chosenMove) {
                // Рух свинки
                state.pig.x = x; state.pig.y = y;
                FX.pigMove();
                
                // З'їдання жолудів на всьому шляху стрибка
                chosenMove.path.forEach(step => {
                    let aIdx = state.acorns.findIndex(a => a.x === step.x && a.y === step.y);
                    if (aIdx !== -1) {
                        state.acorns.splice(aIdx, 1);
                        FX.eatAcorn();
                        spawnParticles(step.x, step.y, '#ffd700', 12, 'explode');
                    }
                });
                
                state.turn = 'wolves';
                state.wolves.forEach(w => w.moved = false);
                state.selectedWolfIdx = -1;
                
                checkWin();
            } else {
                FX.error();
            }
        } else {
            // Вибір вовка
            let wIdx = state.wolves.findIndex(w => w.x === x && w.y === y);
            if (wIdx !== -1 && !state.wolves[wIdx].moved) {
                state.selectedWolfIdx = wIdx;
                FX.wolfSelect();
                renderEntities();
                updateHighlight();
                return;
            }
            
            // Рух обраного вовка
            if (state.selectedWolfIdx !== -1) {
                let moves = getValidWolfMoves(state.selectedWolfIdx);
                if (moves.some(m => m.x === x && m.y === y)) {
                    state.wolves[state.selectedWolfIdx].x = x;
                    state.wolves[state.selectedWolfIdx].y = y;
                    state.wolves[state.selectedWolfIdx].moved = true;
                    FX.wolfMove();
                    
                    state.selectedWolfIdx = -1;
                    
                    if (!checkWin()) {
                        if (state.wolves.every(w => w.moved)) {
                            state.turn = 'pig';
                        }
                    }
                } else {
                    FX.error();
                }
            }
        }
        
        if (state.active) {
            renderEntities();
            updateHighlight();
            updateUI();
        }
    }

    function checkWin() {
        // Перемога вовків (з'їли свинку)
        if (state.wolves.some(w => w.x === state.pig.x && w.y === state.pig.y)) {
            state.active = false;
            state.pig.eaten = true;
            FX.pigDie();
            
            renderEntities(); 
            const pigEl = document.querySelector('.pig');
            if (pigEl) pigEl.classList.add('eaten');
            
            spawnParticles(state.pig.x, state.pig.y, '#ff4444', 40, 'explode');
            setTimeout(() => {
                for(let i=0; i<150; i++) spawnParticles(2, 2, ['#353b3d', '#4a5259', '#a3c4d6'][Math.floor(Math.random()*3)], 1, 'confetti');
            }, 600);
            return true;
        }
        // Перемога свинки (з'їла всі жолуді)
        if (state.acorns.length === 0) {
            state.active = false;
            FX.winPig();
            
            spawnParticles(state.pig.x, state.pig.y, '#ffb6c1', 30, 'explode');
            setTimeout(() => {
                for(let i=0; i<200; i++) spawnParticles(2, 2, ['#ff8da1', '#ffd700', '#ffffff'][Math.floor(Math.random()*3)], 1, 'confetti');
            }, 300);
            return true;
        }
        return false;
    }

    function startGame(firstRole) {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        
        document.getElementById('role-overlay').style.display = 'none';
        
        state.turn = firstRole;
        state.active = true;
        
        generateGrid();
        initAcorns();
        renderEntities();
        updateHighlight();
        updateUI();
    }
</script>
</body>
</html>
