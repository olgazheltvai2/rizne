<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Комплексний Урок: Настрій, Погода, Сезони, Календар</title>
    
    <!-- Підключення Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        /* ================= УНІВЕРСАЛЬНІ СТИЛІ ТА СИСТЕМА ФОНІВ ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { 
            width: 100vw; height: 100vh; overflow: hidden; 
            background-color: #0b192c; background-size: cover; background-position: center; background-repeat: no-repeat; 
            font-family: Arial, sans-serif !important; 
            transition: background-image 0.5s ease; 
        }
        
        #block-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999999; justify-content: center; align-items: center; color: red; font-size: 5vw; font-weight: bold; text-align: center; backdrop-filter: blur(10px); }

        #theme-btn { position: fixed; bottom: 20px; right: 20px; font-size: 40px; cursor: pointer; z-index: 10000; text-shadow: 0 0 15px rgba(0,0,0,0.8); transition: transform 0.3s; }
        #theme-btn:hover { transform: scale(1.1) rotate(45deg); }
        
        #theme-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-height: 60vh; background: rgba(0,0,0,0.8); border: 2px solid #fff; border-radius: 20px; z-index: 10001; overflow-y: auto; padding: 30px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; backdrop-filter: blur(10px); }
        .theme-thumb { position: relative; width: 100%; aspect-ratio: 16/9; background-size: cover; background-position: center; cursor: pointer; border-radius: 10px; border: 3px solid transparent; transition: border-color 0.3s, transform 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        .theme-thumb:hover { border-color: #ffeb3b; transform: scale(1.05); }
        .theme-text { position: absolute; bottom: 8px; left: 8px; color: #fff; font-weight: bold; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 5px; font-size: 16px; }
        #theme-close { display: none; position: fixed; top: 15px; right: 25px; color: #fff; cursor: pointer; font-size: 40px; z-index: 10002; text-shadow: 0 0 10px rgba(0,0,0,0.8); }

        /* ================= МАЙСТЕР-НАВІГАЦІЯ (ЕТАПИ) ================= */
        #master-nav { position: fixed; top: 15px; left: 50%; transform: translateX(-50%); z-index: 9000; display: flex; gap: 20px; }
        .master-btn { padding: 12px 25px; font-size: 18px; font-weight: bold; border-radius: 30px; border: 2px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.5); color: #fff; cursor: pointer; backdrop-filter: blur(5px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: all 0.3s; font-family: Arial, sans-serif !important; }
        .master-btn:hover { background: rgba(255,255,255,0.2); border-color: #fff; }
        
        .game-step { display: none; width: 100%; height: 100%; position: absolute; top:0; left:0; }
        .game-step.active { display: flex; flex-direction: column; justify-content: center; align-items: center; }

        /* ================= СТИЛІ: НАСТРІЙ (КРОК 1) ================= */
        #step-mood .aspect-ratio-container { position: relative; width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #step-mood .game-area { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -40%); width: 85%; height: 65%; z-index: 10; display: flex; justify-content: space-evenly; align-items: flex-end; padding: 30px; background: rgba(11, 25, 44, 0.4); border-radius: 40px; box-shadow: inset 0 10px 30px rgba(255, 255, 255, 0.05), 0 30px 60px rgba(0,0,0,0.6); border-bottom: 15px solid rgba(22, 36, 71, 0.6); backdrop-filter: blur(8px); }
        #step-mood .station { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 16%; }
        #step-mood .smiley-wrapper { width: 100%; aspect-ratio: 1/1; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 15px 15px rgba(0,0,0,0.5)); }
        #step-mood .bounce { animation: bounceSmiley 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes bounceSmiley { 0%, 100% { transform: translateY(0) scale(1) rotate(0deg); } 50% { transform: translateY(-25px) scale(1.2) rotate(5deg); } }
        #step-mood .flask-wrapper { width: 100%; aspect-ratio: 1/1.5; cursor: pointer; position: relative; transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: drop-shadow(0 20px 20px rgba(0,0,0,0.6)); }
        #step-mood .flask-wrapper:hover { transform: scale(1.08) translateY(-8px); }
        #step-mood .success-anim { animation: successPulse 0.7s ease-out; }
        @keyframes successPulse { 0% { transform: scale(1); filter: drop-shadow(0 20px 20px rgba(0,0,0,0.6)) brightness(1); } 50% { transform: scale(1.15) translateY(-20px); filter: drop-shadow(0 0 40px currentColor) brightness(1.6); } 100% { transform: scale(1); filter: drop-shadow(0 20px 20px rgba(0,0,0,0.6)) brightness(1); } }
        .mood-particle { position: absolute; border-radius: 50%; pointer-events: none; z-index: 100; animation: floatUp 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; box-shadow: 0 0 12px currentColor, inset 0 0 6px rgba(255,255,255,0.9); }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-180px) scale(0); opacity: 0; } }

        /* ================= СТИЛІ: ПОГОДА (КРОК 2) ================= */
        #step-weather #weather-grid { position: relative; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 20px; width: 90%; max-width: 1000px; height: 85%; padding: 30px; background: rgba(20, 50, 100, 0.3); border-radius: 30px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.2); backdrop-filter: blur(12px); border: 2px solid rgba(255, 255, 255, 0.3); }
        @media (max-width: 800px) { #step-weather #weather-grid { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(4, 1fr); } }
        #step-weather .weather-card { position: relative; border-radius: 20px; cursor: pointer; display: flex; justify-content: center; align-items: center; background: linear-gradient(145deg, rgba(255,255,255,0.15), rgba(0,0,0,0.15)); box-shadow: 5px 5px 15px rgba(0,0,0,0.2), inset 2px 2px 5px rgba(255,255,255,0.4); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); overflow: visible; }
        #step-weather .weather-card:hover { transform: translateY(-10px) scale(1.05); box-shadow: 10px 15px 25px rgba(0,0,0,0.3), inset 2px 2px 10px rgba(255,255,255,0.6); background: linear-gradient(145deg, rgba(255,255,255,0.25), rgba(0,0,0,0.1)); }
        #step-weather .weather-card.selected { transform: scale(1.1); background: radial-gradient(circle, rgba(255, 223, 0, 0.6) 0%, rgba(255, 150, 0, 0.4) 100%); border: 3px solid #ffea00; box-shadow: 0 0 30px rgba(255, 234, 0, 0.8), inset 0 0 15px rgba(255, 255, 255, 0.8); animation: pulseGlow 2s infinite alternate; }
        @keyframes pulseGlow { 0% { box-shadow: 0 0 20px rgba(255, 234, 0, 0.6), inset 0 0 10px rgba(255, 255, 255, 0.5); } 100% { box-shadow: 0 0 40px rgba(255, 234, 0, 1), inset 0 0 20px rgba(255, 255, 255, 0.9); } }
        #step-weather .icon-container { width: 80%; height: 80%; pointer-events: none; }
        #step-weather .spin { animation: spin 10s linear infinite; } @keyframes spin { 100% { transform: rotate(360deg); } }
        #step-weather .swing { transform-origin: top center; animation: swing 3s ease-in-out infinite alternate; } @keyframes swing { 0% { transform: rotate(-10deg); } 100% { transform: rotate(10deg); } }
        #step-weather .drop { animation: drop 1s linear infinite; } @keyframes drop { 0% { transform: translateY(-10px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translateY(20px); opacity: 0; } }
        #step-weather .flash { animation: flash 4s infinite; } @keyframes flash { 0%, 95%, 98% { opacity: 0; } 96%, 99%, 100% { opacity: 1; } }
        .weather-particle { position: absolute; pointer-events: none; border-radius: 50%; animation: explode 0.8s ease-out forwards; }
        @keyframes explode { 0% { transform: scale(1) translate(0, 0); opacity: 1; } 100% { transform: scale(0) translate(var(--tx), var(--ty)); opacity: 0; } }

        /* ================= СТИЛІ: ПОРА РОКУ (КРОК 3) ================= */
        #step-season #scene-container { position: relative; width: 100%; height: 100%; overflow: hidden; }
        #step-season #main-svg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5;}
        #step-season #season-title { position: absolute; top: 12%; left: 50%; transform: translateX(-50%); font-size: 10vw; font-weight: 900; color: white; text-transform: uppercase; letter-spacing: 0.1em; text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(255, 255, 255, 0.5); z-index: 10; transition: opacity 0.5s ease, transform 0.5s ease, color 1.5s ease; }
        #step-season .title-animate { animation: bounceIn 1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        #step-season .season-controls { position: absolute; bottom: 8%; width: 100%; display: flex; justify-content: center; gap: 40px; z-index: 20; }
        #step-season .season-btn { background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px); border: 2px solid rgba(255, 255, 255, 0.5); color: white; padding: 15px 40px; font-size: 24px; font-weight: bold; border-radius: 50px; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-family: Arial, sans-serif !important; }
        #step-season .season-btn:hover { background: rgba(255, 255, 255, 0.4); transform: translateY(-5px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        #step-season .season-element { transition: fill 1.5s ease, stroke 1.5s ease, opacity 1.5s ease; }
        #step-season #sun { transform-origin: 200px 200px; transition: transform 2s ease; }
        #step-season .sun-rays { transform-origin: 200px 200px; animation: spin 20s linear infinite; }
        #step-season .cloud { animation: floatClouds 60s linear infinite; }
        #step-season .cloud:nth-child(2) { animation-duration: 80s; animation-delay: -30s; }
        #step-season .cloud:nth-child(3) { animation-duration: 50s; animation-delay: -15s; }
        @keyframes floatClouds { from { transform: translateX(-300px); } to { transform: translateX(2200px); } }
        #step-season #tree-leaves { transform-origin: 400px 600px; transition: fill 1.5s ease, opacity 1s ease; animation: treeSway 5s ease-in-out infinite alternate; }
        @keyframes treeSway { 0% { transform: skewX(-2deg); } 100% { transform: skewX(2deg); } }

        /* ================= СТИЛІ: ЧИСЛО ТА КАЛЕНДАР (КРОК 4) ================= */
        #step-calendar #task-board { position: relative; width: 85%; height: 80%; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 20px; background: rgba(120, 40, 140, 0.25); border-radius: 40px; padding: 30px; box-shadow: inset 0 0 40px rgba(255, 100, 255, 0.2), 0 20px 50px rgba(0,0,0,0.5); backdrop-filter: blur(15px); border: 2px solid rgba(255, 150, 255, 0.3); overflow: hidden; z-index: 10;}
        #step-calendar .board-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        #step-calendar .game-item { cursor: pointer; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; justify-content: center; align-items: center; text-align: center; font-weight: bold; color: #fff; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); position: relative; }
        #step-calendar .game-item:hover { transform: scale(1.1) translateY(-5px); filter: drop-shadow(0px 10px 15px rgba(255, 200, 255, 0.4)); z-index: 10; }
        #step-calendar .game-item:active { transform: scale(0.95); }
        #step-calendar .game-item.selected { transform: scale(1.15); filter: drop-shadow(0 0 20px #ffeb3b) brightness(1.2); z-index: 10; }
        #step-calendar .item-time { width: 250px; height: 200px; font-size: 32px; }
        #step-calendar .item-day { width: 220px; height: 90px; font-size: 26px; }
        #step-calendar .item-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        #step-calendar .combined-layout { display: flex; width: 100%; height: 100%; gap: 30px; }
        #step-calendar .dates-section { flex: 1.2; display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-content: center; padding: 20px; background: rgba(0, 0, 0, 0.3); border-radius: 30px; border: 1px dashed rgba(255,255,255,0.3); }
        #step-calendar .months-section { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; align-content: center; padding: 20px; background: rgba(0, 0, 0, 0.3); border-radius: 30px; border: 1px dashed rgba(255,255,255,0.3); }
        #step-calendar .item-date { width: 100%; aspect-ratio: 1; font-size: 24px; color: #fff; text-shadow: 1px 1px 2px #000; }
        #step-calendar .item-month { width: 100%; height: 80px; font-size: 18px; color: #fff; text-shadow: 1px 1px 2px #000; }
        #step-calendar #cal-nav-controls { position: absolute; bottom: 30px; right: 40px; display: flex; gap: 20px; z-index: 30; }
        #step-calendar .cal-nav-btn { background: transparent; border: none; cursor: pointer; width: 70px; height: 70px; transition: transform 0.2s, filter 0.2s; position: relative; }
        #step-calendar .cal-nav-btn:hover { transform: scale(1.2); filter: brightness(1.2); }
        #step-calendar .cal-nav-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- Універсальний блок контролю -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <!-- Theme Manager -->
    <div id="theme-btn" onclick="openThemeManager()">⚙️</div>
    <div id="theme-close" onclick="closeThemeManager()">✖</div>
    <div id="theme-modal"></div>

    <!-- Майстер-навігація -->
    <div id="master-nav">
        <button id="btn-master-prev" class="master-btn" style="display:none;" onclick="changeMasterStep(-1)">НАЗАД</button>
        <button id="btn-master-next" class="master-btn" onclick="changeMasterStep(1)">НАСТУПНИЙ ЕТАП</button>
    </div>

    <!-- ================= КРОК 1: НАСТРІЙ ================= -->
    <div id="step-mood" class="game-step active">
        <div class="aspect-ratio-container">
            <div class="game-area" id="gameBoard"></div>
        </div>
    </div>

    <!-- ================= КРОК 2: ПОГОДА ================= -->
    <div id="step-weather" class="game-step">
        <div id="weather-grid"></div>
    </div>

    <!-- ================= КРОК 3: ПОРА РОКУ ================= -->
    <div id="step-season" class="game-step">
        <div id="scene-container">
            <div id="season-title">ЗИМА</div>
            <svg id="main-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
                <defs>
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="15" result="blur" />
                        <feComposite in="SourceGraphic" in2="blur" operator="over" />
                    </filter>
                    <filter id="drop-shadow">
                        <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity="0.3"/>
                    </filter>
                    <linearGradient id="hill1-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop class="season-element hill1-top" offset="0%" stop-color="#fff" />
                        <stop class="season-element hill1-bot" offset="100%" stop-color="#e0e0e0" />
                    </linearGradient>
                    <linearGradient id="hill2-grad" x1="0" y1="0" x2="0" y2="1">
                        <stop class="season-element hill2-top" offset="0%" stop-color="#f5f5f5" />
                        <stop class="season-element hill2-bot" offset="100%" stop-color="#cccccc" />
                    </linearGradient>
                </defs>
                <g id="sky-elements">
                    <g id="sun" transform="translate(0, 0)">
                        <circle cx="200" cy="200" r="80" class="season-element sun-core" fill="#FFFBE6" filter="url(#glow)"/>
                        <g class="season-element sun-rays" stroke="#FFD700" stroke-width="8" stroke-linecap="round" opacity="0.5">
                            <line x1="200" y1="80" x2="200" y2="40" /> <line x1="200" y1="320" x2="200" y2="360" />
                            <line x1="80" y1="200" x2="40" y2="200" /> <line x1="320" y1="200" x2="360" y2="200" />
                            <line x1="115" y1="115" x2="85" y2="85" /> <line x1="285" y1="285" x2="315" y2="315" />
                            <line x1="115" y1="285" x2="85" y2="315" /> <line x1="285" y1="115" x2="315" y2="85" />
                        </g>
                    </g>
                    <g class="cloud" opacity="0.8"> <path d="M 200 300 Q 230 250 280 270 Q 330 230 380 270 Q 430 260 450 300 Q 480 340 430 360 L 230 360 Q 180 340 200 300 Z" fill="#ffffff" filter="url(#drop-shadow)" opacity="0.6"/> </g>
                    <g class="cloud" opacity="0.6" transform="scale(0.7) translate(1000, 100)"> <path d="M 200 300 Q 230 250 280 270 Q 330 230 380 270 Q 430 260 450 300 Q 480 340 430 360 L 230 360 Q 180 340 200 300 Z" fill="#ffffff" filter="url(#drop-shadow)"/> </g>
                    <g class="cloud" opacity="0.7" transform="scale(1.2) translate(500, -50)"> <path d="M 200 300 Q 230 250 280 270 Q 330 230 380 270 Q 430 260 450 300 Q 480 340 430 360 L 230 360 Q 180 340 200 300 Z" fill="#ffffff" filter="url(#drop-shadow)"/> </g>
                </g>
                <g id="landscape" opacity="0.9">
                    <path class="season-element" d="M 0 700 Q 500 500 1000 700 T 2000 650 L 2000 1100 L 0 1100 Z" fill="url(#hill2-grad)" />
                    <path d="M 380 900 Q 400 700 350 550 Q 380 650 400 550 Q 420 650 450 550 Q 400 700 420 900 Z" fill="#5C4033" filter="url(#drop-shadow)"/>
                    <path d="M 380 650 Q 320 600 280 500" stroke="#5C4033" stroke-width="15" stroke-linecap="round" fill="none"/>
                    <path d="M 410 680 Q 480 620 520 530" stroke="#5C4033" stroke-width="12" stroke-linecap="round" fill="none"/>
                    <g id="tree-leaves" fill="#ffffff" opacity="0.9" filter="url(#drop-shadow)">
                        <circle cx="350" cy="500" r="120" /> <circle cx="450" cy="480" r="110" />
                        <circle cx="400" cy="400" r="140" /> <circle cx="280" cy="450" r="90" />
                        <circle cx="520" cy="420" r="80" />
                    </g>
                    <path class="season-element" d="M -100 850 Q 400 700 1000 850 T 2100 800 L 2100 1100 L -100 1100 Z" fill="url(#hill1-grad)" filter="url(#drop-shadow)"/>
                </g>
                <g id="particles-layer"></g>
            </svg>
            <div class="season-controls">
                <button class="season-btn" onclick="handleSeasonChange(-1)">НАЗАД</button>
                <button class="season-btn" onclick="handleSeasonChange(1)">ДАЛІ</button>
            </div>
        </div>
    </div>

    <!-- ================= КРОК 4: ЧИСЛО ТА КАЛЕНДАР ================= -->
    <div id="step-calendar" class="game-step">
        <div id="task-board"></div>
        <div id="cal-nav-controls">
            <button class="cal-nav-btn" id="cal-btn-back" onclick="handleCalendarNav('prev')">
                <svg viewBox="0 0 100 100">
                    <path d="M 50 5 L 95 50 L 50 95 L 5 50 Z" fill="#9c27b0" stroke="#ce93d8" stroke-width="4"/>
                    <path d="M 60 30 L 35 50 L 60 70" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button class="cal-nav-btn" id="cal-btn-next" onclick="handleCalendarNav('next')">
                <svg viewBox="0 0 100 100">
                    <path d="M 50 5 L 95 50 L 50 95 L 5 50 Z" fill="#00bcd4" stroke="#80deea" stroke-width="4"/>
                    <path d="M 40 30 L 65 50 L 40 70" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // ================= ГЛОБАЛЬНИЙ АУДІО КОНТЕКСТ =================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); if (audioCtx.state === 'suspended') audioCtx.resume(); }
        document.body.addEventListener('click', initAudio, { once: true });

        // ================= FIREBASE ТА ІДЕНТИФІКАЦІЯ =================
        const firebaseConfig = { databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/", projectId: "lesson-13c44" };
        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.database(); } catch(e) { console.warn("Firebase offline mode"); }

        const urlParams = new URLSearchParams(window.location.search);
        let myName = urlParams.get('user') || sessionStorage.getItem('userName');
        if (!myName) myName = 'Гість_' + Math.floor(Math.random() * 1000);
        sessionStorage.setItem('userName', myName);

        const tabId = Math.random().toString(36).substr(2, 9);
        const senderId = myName + '_' + tabId;
        let isRemoteAction = false;

        if (db) {
            // Радар
            db.ref('.info/connected').on('value', s => {
                if(s.val()) {
                    const ref = db.ref('online_users/' + myName + '/' + tabId);
                    ref.set(true); ref.onDisconnect().remove();
                }
            });
            window.addEventListener('beforeunload', () => db.ref('online_users/' + myName + '/' + tabId).remove());

            // Блокування
            db.ref('blocked_users/' + myName).on('value', s => { document.getElementById('block-overlay').style.display = s.val() ? 'flex' : 'none'; });
            
            // Захист від нескінченного циклу оновлення
            let isInitialRefresh = true;
            db.ref('force_refresh').on('value', s => { 
                if (isInitialRefresh) { isInitialRefresh = false; return; }
                if(s.val()) window.location.reload(); 
            });

            // Захист від нескінченного циклу лобі
            let isInitialLobby = true;
            db.ref('current_activity').on('value', s => {
                if (isInitialLobby) { isInitialLobby = false; return; }
                if(s.val() === 'lobby') window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            });

            // Синхронізація фону
            db.ref('game_theme').on('value', s => {
                if(s.val()) { document.body.style.backgroundImage = `url(${s.val()})`; localStorage.setItem('mySavedGameBg', s.val()); }
            });
        } else {
            const savedBg = localStorage.getItem('mySavedGameBg');
            if(savedBg) document.body.style.backgroundImage = `url(${savedBg})`;
        }

        // ================= СИНХРОНІЗАЦІЯ ДІЙ =================
        function sendAction(data) {
            if(!db || isRemoteAction) return;
            data.senderId = senderId;
            data.timestamp = firebase.database.ServerValue.TIMESTAMP;
            db.ref('game_action').set(data);
        }

        if (db) {
            let lastTimestamp = 0;
            db.ref('game_action').on('value', s => {
                const data = s.val();
                if(!data || data.senderId === senderId || data.timestamp <= lastTimestamp) return;
                lastTimestamp = data.timestamp;
                isRemoteAction = true;
                processRemoteAction(data);
                setTimeout(() => isRemoteAction = false, 50);
            });
        }

        function processRemoteAction(data) {
            if (data.type === 'master_step') changeMasterStep(data.dir, true);
            else if (data.type === 'mood_flask') processFlaskClick(data.index, null, true);
            else if (data.type === 'weather_card') processWeatherClick(data.id, true);
            else if (data.type === 'season_nav') handleSeasonChange(data.dir, true);
            else if (data.type === 'calendar_nav') handleCalendarNav(data.dir, true);
            else if (data.type === 'calendar_item') selectCalendarItem(data.idx, data.group, true);
        }

        // ================= THEME MANAGER =================
        let themesLoaded = false;
        async function openThemeManager() {
            document.getElementById('theme-modal').style.display = 'grid';
            document.getElementById('theme-close').style.display = 'block';
            if (themesLoaded) return;
            const modal = document.getElementById('theme-modal');
            modal.innerHTML = '';
            for (let i = 1; i <= 1000; i++) {
                const url = `https://olgazheltvai2.github.io/images/backgrounds/background_${i}.webp`;
                try {
                    const test = new Image();
                    test.src = url;
                    await new Promise((resolve, reject) => { test.onload = resolve; test.onerror = reject; });
                    const div = document.createElement('div');
                    div.className = 'theme-thumb';
                    div.style.backgroundImage = `url(${url})`;
                    div.innerHTML = `<div class="theme-text">Фон ${i}</div>`;
                    div.onclick = () => {
                        document.body.style.backgroundImage = `url(${url})`;
                        localStorage.setItem('mySavedGameBg', url);
                        if(db) db.ref('game_theme').set(url);
                    };
                    modal.appendChild(div);
                } catch (e) { break; } 
            }
            themesLoaded = true;
        }
        function closeThemeManager() {
            document.getElementById('theme-modal').style.display = 'none';
            document.getElementById('theme-close').style.display = 'none';
        }

        // ================= МАЙСТЕР-НАВІГАЦІЯ =================
        const steps = ['step-mood', 'step-weather', 'step-season', 'step-calendar'];
        const stepNames = ['ПОГОДА', 'ПОРА РОКУ', 'КАЛЕНДАР', ''];
        let currentMasterStep = 0;

        function updateMasterNav() {
            document.querySelectorAll('.game-step').forEach((el, i) => {
                el.classList.toggle('active', i === currentMasterStep);
            });
            document.getElementById('btn-master-prev').style.display = currentMasterStep > 0 ? 'block' : 'none';
            document.getElementById('btn-master-next').style.display = currentMasterStep < steps.length - 1 ? 'block' : 'none';
            if (currentMasterStep < steps.length - 1) {
                document.getElementById('btn-master-next').innerText = "ДАЛІ: " + stepNames[currentMasterStep];
            }
        }

        function changeMasterStep(dir, fromRemote = false) {
            initAudio();
            currentMasterStep += dir;
            if (currentMasterStep < 0) currentMasterStep = 0;
            if (currentMasterStep >= steps.length) currentMasterStep = steps.length - 1;
            updateMasterNav();
            if (!fromRemote) sendAction({ type: 'master_step', dir: dir });
        }
