<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вчительська панель (Пульт)</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-database-compat.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f0f8ff; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .main-container { background-color: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; max-width: 600px; width: 90%; }
        h1 { color: #333; margin-bottom: 20px; }
        h2 { color: #555; font-size: 18px; margin-bottom: 10px; margin-top: 0; display: flex; justify-content: space-between; align-items: center;}
        .control-group { margin-bottom: 20px; padding: 20px; border: 2px dashed #ccc; border-radius: 10px; background-color: rgba(255, 255, 255, 0.5); }
        button { color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; transition: background 0.3s; margin: 5px; font-weight: bold; }
        .btn-lobby { background-color: #2ecc71; width: 100%; }
        .btn-lobby:hover { background-color: #27ae60; }
        .btn-send { background-color: #3498db; }
        .btn-send:hover { background-color: #2980b9; }
        input[type="text"] { padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 8px; width: 60%; margin-right: 10px; }
        .status { margin-top: 20px; font-weight: bold; color: #e74c3c; font-size: 18px; padding: 15px; border-radius: 8px; background-color: rgba(0, 0, 0, 0.05); }
        
        .user-row { display: flex; justify-content: space-between; align-items: center; background: white; padding: 10px 15px; border-radius: 8px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .user-name { font-weight: bold; font-size: 18px; display: flex; align-items: center; gap: 10px; }
        .dot { height: 12px; width: 12px; background-color: #2ecc71; border-radius: 50%; display: inline-block; }
        .btn-block { background-color: #e74c3c; padding: 8px 15px; font-size: 14px; }
        .btn-unblock { background-color: #f39c12; padding: 8px 15px; font-size: 14px; }
        .btn-refresh { background-color: #95a5a6; padding: 6px 12px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Вчительська панель</h1>
        
        <div class="control-group" style="border-color: #3498db;">
            <h2>
                <span>Радар: Хто онлайн 📡</span>
                <button class="btn-refresh" onclick="forceRefreshRadar()">🔄 Оновити</button>
            </h2>
            <div id="online-users-list">Очікування даних...</div>
        </div>
        
        <div class="control-group">
            <h2>Швидке керування</h2>
            <button class="btn-lobby" onclick="setActivity('lobby')">Повернути всіх у Лобі</button>
        </div>

        <div class="control-group">
            <h2>Запустити нову гру</h2>
            <div style="display: flex; justify-content: center; align-items: center;">
                <input type="text" id="game-input" placeholder="Назва (напр. math_1.html)">
                <button class="btn-send" onclick="sendCustomGame()">Відправити</button>
            </div>
        </div>

        <div class="status" id="current-status">Стан екрану: Завантаження...</div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const statusEl = document.getElementById('current-status');

        function setActivity(activityName) {
            db.ref('current_activity').set(activityName).catch(err => alert("Помилка відправки!"));
        }

        function sendCustomGame() {
            const inputVal = document.getElementById('game-input').value.trim();
            if (inputVal !== '') { setActivity(inputVal); document.getElementById('game-input').value = ''; }
        }

        db.ref('current_activity').on('value', (snapshot) => {
            const current = snapshot.val();
            if (current === 'lobby') {
                statusEl.innerText = "Зараз на екрані: Кімната очікування";
                statusEl.style.color = "#27ae60"; 
            } else {
                statusEl.innerText = `Зараз на екрані: ${current}`;
                statusEl.style.color = "#e74c3c"; 
            }
        });

        // --- ЛОГІКА РАДАРУ ---
        let blockedData = {};
        db.ref('blocked_users').on('value', (snap) => {
            blockedData = snap.val() || {};
            renderOnlineUsers(); 
        });

        let onlineData = {};
        db.ref('online_users').on('value', (snap) => {
            onlineData = snap.val() || {};
            renderOnlineUsers();
        });

        function renderOnlineUsers() {
            const listEl = document.getElementById('online-users-list');
            listEl.innerHTML = '';
            const users = Object.keys(onlineData);
            
            if (users.length === 0) {
                listEl.innerHTML = '<p style="color: #7f8c8d; font-style: italic;">Нікого немає онлайн</p>';
                return;
            }

            users.forEach(user => {
                const isBlocked = blockedData[user] === true;
                const div = document.createElement('div');
                div.className = 'user-row';
                
                const dotColor = isBlocked ? '#e74c3c' : '#2ecc71';
                
                div.innerHTML = `
                    <div class="user-name"><span class="dot" style="background-color: ${dotColor}"></span> ${user}</div>
                    <button class="${isBlocked ? 'btn-unblock' : 'btn-block'}" onclick="toggleBlock('${user}', ${!isBlocked})">
                        ${isBlocked ? '▶️ Розблокувати' : '⏸ Заблокувати'}
                    </button>
                `;
                listEl.appendChild(div);
            });
        }

        function toggleBlock(user, blockStatus) {
            db.ref('blocked_users/' + user).set(blockStatus);
        }

        function forceRefreshRadar() {
            db.ref('online_users').remove().then(() => {
                db.ref('force_refresh').set(Date.now());
            });
        }
    </script>
</body>
</html>
