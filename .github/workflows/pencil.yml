name: Force Update Pencil Cache

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Bust Cache for Pencil Script
        run: |
          find . -maxdepth 2 -name "*.html" ! -name "teacher_panel.html" | while read -r file; do
            # Видаляємо всі попередні рядки з pencil.js, щоб уникнути дублювання
            sed -i '/pencil\.js/d' "$file"
            
            # Вставляємо нове посилання з антикеш-параметром ?v=2
            sed -i 's|</body>|<script src="https://olgazheltvai2.github.io/rizne/pencil.js?v=2"></script></body>|gi' "$file"
          done

      - name: Save changes
        run: |
          git config --global user.name "GitHub Robot"
          git config --global user.email "robot@github.com"
          git add .
          git commit -m "Примусове оновлення кешу pencil.js" || echo "Нічого змінювати"
          git push
