name: Remove Global Pencil

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-pencil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Clean up HTML files
        run: |
          find . -maxdepth 2 -name "*.html" | while read -r file; do
            # Видаляємо рядок з підключенням pencil.js
            sed -i '/pencil\.js/d' "$file"
            
            # Видаляємо милицю для кліків, якщо вона була додана
            sed -i '/canvas-click-fix/d' "$file"
          done

      - name: Save changes
        run: |
          git config --global user.name "GitHub Robot"
          git config --global user.email "robot@github.com"
          git add .
          git commit -m "Видалено глобальний олівець з усіх ігор" || echo "Нічого змінювати"
          git push
