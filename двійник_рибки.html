          const rx = layout.pondMinX + 40 + Math.random() * (W - layout.pondMinX - 80);
          const ry = 40 + Math.random() * (H - 80);
          spawnRipple(rx, ry, 42 + Math.random() * 26, "rgba(200, 240, 240, 0.25)", 1.3);
        }

        // Hover detection during active play
        if (state === "playing" && pointer.active) {
          let foundHover = null;
          for (let i = pondFishes.length - 1; i >= 0; i--) {
            if (pondFishes[i].hitTest(pointer.x, pointer.y)) {
              foundHover = pondFishes[i];
              break;
            }
          }
          if (foundHover && foundHover !== hoveredFish) {
            sound.playHoverTick();
          }
          hoveredFish = foundHover;
        } else {
          hoveredFish = null;
        }

        // Update Koi fish
        if (targetFish) targetFish.update(dt, pondFishes, null);
        for (let i = 0; i < pondFishes.length; i++) {
          pondFishes[i].update(dt, pondFishes, hoveredFish);
        }

        // Update ripples
        for (let i = ripples.length - 1; i >= 0; i--) {
          const rp = ripples[i];
          rp.r += dt * (rp.maxR * 0.85);
          rp.alpha = Math.max(0, 1 - rp.r / rp.maxR);
          if (rp.alpha <= 0.01) ripples.splice(i, 1);
        }

        // Update particles (water droplets, lotus petals, golden pollen)
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.type === "droplet") {
            p.vx *= 0.94;
            p.vy *= 0.94;
          } else if (p.type === "petal") {
            p.vx *= 0.97;
            p.vy *= 0.97;
            p.rot += p.vRot * dt;
          }
        }

        // Update active celebration spectacle
        if (state === "celebrating") {
          celebrationTimer -= dt;

          // Dragonfly celebration spiral
          for (let i = 0; i < celebrationDragonflies.length; i++) {
            const d = celebrationDragonflies[i];
            d.orbitAngle += dt * 3.4;
            d.orbitRadius = Math.max(46, d.orbitRadius - dt * 36);
            d.wingPhase += dt * 58;
            if (matchedFishRef) {
              d.cx += (matchedFishRef.head.x - d.cx) * Math.min(1, dt * 4);
              d.cy += (matchedFishRef.head.y - d.cy) * Math.min(1, dt * 4);
            }
            const px = d.cx + Math.cos(d.orbitAngle) * d.orbitRadius;
            const py = d.cy + Math.sin(d.orbitAngle) * d.orbitRadius;
            if (Math.random() < 0.45) {
              particles.push({
                type: "pollen",
                x: px,
                y: py,
                vx: (Math.random() - 0.5) * 16,
                vy: (Math.random() - 0.5) * 16,
                r: 2 + Math.random() * 2.5,
                life: 0.65,
                maxLife: 0.65,
                color: "#ffe875"
              });
            }
          }

          // Blooming celebration lotuses
          for (let i = 0; i < celebrationLotuses.length; i++) {
            const l = celebrationLotuses[i];
            l.scale += (1 - l.scale) * Math.min(1, dt * 4.5);
            l.rot += dt * 0.45;
          }

          // Firefly vortex
          for (let i = 0; i < fireflies.length; i++) {
            const f = fireflies[i];
            f.angle += dt * f.speed;
            f.radius = Math.max(16, f.radius * (1 - dt * 0.25));
            f.rise += dt * 22;
          }

          if (celebrationTimer <= 0) {
            beginTransition();
          }
        }

        // Smooth water-curtain transition between rounds
        if (state === "transition") {
          if (transitionPhase === 0) {
            transitionAlpha += dt * 2.4;
            if (transitionAlpha >= 1) {
              transitionAlpha = 1;
              transitionPhase = 1;
              startNewRound(true);
              state = "transition";
            }
          } else {
            transitionAlpha -= dt * 2.2;
            if (transitionAlpha <= 0) {
              transitionAlpha = 0;
              state = "playing";
            }
          }
        }
      }

      function render(dt, time) {
        // 1. Static cached pond floor, pebbles, and left mossy stone basin
        ctx.drawImage(bgCanvas, 0, 0, W, H);

        // 2. Gently swaying underwater aquatic grass
        drawAquaticGrass(time);

        // 3. Soft shimmering water caustics
        drawCaustics(time);

        // 4. Target Koi inside left stone basin & Pond Koi on the right
        if (targetFish) targetFish.draw(ctx, time);
        for (let i = 0; i < pondFishes.length; i++) {
          if (!pondFishes[i].isLeaping) {
            pondFishes[i].draw(ctx, time);
          }
        }

        // 5. Expanding surface water ripples
        for (let i = 0; i < ripples.length; i++) {
          const rp = ripples[i];
          ctx.save();
          ctx.globalAlpha = rp.alpha;
          ctx.strokeStyle = rp.color;
          ctx.lineWidth = rp.lineWidth;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        // 6. Bamboo spout water stream
        drawSpoutStream(time);

        // 7. Floating lily pads & blooming lotus flowers
        drawLilyPads(time);

        // Celebration blooming lotuses
        for (let i = 0; i < celebrationLotuses.length; i++) {
          const l = celebrationLotuses[i];
          drawLotusFlower(ctx, l.x, l.y, l.size, l.rot, l.scale);
        }

        // Draw leaping fish above lily pads so it visibly jumps out of water
        for (let i = 0; i < pondFishes.length; i++) {
          if (pondFishes[i].isLeaping) {
            pondFishes[i].draw(ctx, time);
          }
        }

        // 8. Particles (water splashes, lotus petals, golden pollen)
        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          const a = Math.max(0, p.life / p.maxLife);
          ctx.save();
          ctx.globalAlpha = a;
          if (p.type === "petal") {
            ctx.translate(p.x, p.y);
            ctx.rotate(p.rot);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
            ctx.fill();
          } else {
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.restore();
        }

        // 9. Firefly vortex celebration
        for (let i = 0; i < fireflies.length; i++) {
          const f = fireflies[i];
          const fx = f.cx + Math.cos(f.angle) * f.radius;
          const fy = f.cy + Math.sin(f.angle) * f.radius - f.rise;
          const pulse = 0.6 + 0.4 * Math.sin(time * 9 + f.phase);
          ctx.save();
          const fg = ctx.createRadialGradient(fx, fy, 0.5, fx, fy, f.size * 4.2);
          fg.addColorStop(0, `rgba(255, 252, 200, ${0.95 * pulse})`);
          fg.addColorStop(0.4, `rgba(255, 215, 95, ${0.55 * pulse})`);
          fg.addColorStop(1, "rgba(255, 200, 60, 0)");
          ctx.fillStyle = fg;
          ctx.beginPath();
          ctx.arc(fx, fy, f.size * 4.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        // 10. Ambient & Celebration Dragonflies flying over the pond
        updateAndDrawDragonflies(dt, time);

        for (let i = 0; i < celebrationDragonflies.length; i++) {
          const d = celebrationDragonflies[i];
          const dx = d.cx + Math.cos(d.orbitAngle) * d.orbitRadius;
          const dy = d.cy + Math.sin(d.orbitAngle) * d.orbitRadius;
          drawDragonfly(ctx, dx, dy, d.orbitAngle + Math.PI * 0.5, d.color, d.wingPhase, 1.15);
        }

        // 11. Gentle water-shimmer transition overlay
        if (transitionAlpha > 0.005) {
          ctx.save();
          ctx.globalAlpha = transitionAlpha * 0.88;
          ctx.fillStyle = palette.waterDeep;
          ctx.fillRect(0, 0, W, H);
          ctx.restore();
        }
      }

      function loop(now) {
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const time = now * 0.001;

        update(dt, time);
        render(dt, time);

        requestAnimationFrame(loop);
      }

      // =========================================================================
      // 12. RESIZE & INITIALIZATION
      // =========================================================================
      function handleResize() {
        W = window.innerWidth;
        H = window.innerHeight;
        DPR = Math.min(window.devicePixelRatio || 1, 2);

        canvas.width = Math.floor(W * DPR);
        canvas.height = Math.floor(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

        computeLayout();
        renderStaticBackdrop();
        createEcosystem();
      }

      function lerpAngle(a, b, t) {
        let diff = b - a;
        while (diff < -Math.PI) diff += Math.PI * 2;
        while (diff > Math.PI) diff -= Math.PI * 2;
        return a + diff * t;
      }

      window.addEventListener("resize", () => {
        handleResize();
        // Keep existing fish cleanly inside updated bounds
        if (targetFish) {
          targetFish.head.x = layout.basinCenterX;
          targetFish.head.y = layout.basinCenterY;
        }
      });

      window.onload = () => {
        handleResize();
        startNewRound(false);
        lastTime = performance.now();
        requestAnimationFrame(loop);
      };
    })();
  </script>
</body>
