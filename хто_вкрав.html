      // 2. GRUMPY GINGER CAT (Upper-left behind blanket)
      function drawCat(c, ch, t) {
        c.save();
        const breath = Math.sin(t * 2.7 + ch.seed) * 2;
        const isBusted = ch.state === "busted";
        const isWrong = ch.state === "wrong";
        const isShock = ch.state === "react_grandma";
        const gagT = ch.stateTimer;

        // Wrong animation: ducking down briefly into bushes!
        let duckY = 0;
        if (isWrong) {
          duckY = Math.sin(Math.min(1, gagT / 1.1) * Math.PI) * 48;
        }

        // Busted animation: bat item up, catch on nose, then flop sideways playing dead!
        let flopAngle = 0;
        let flopY = 0;
        if (isBusted && gagT > 1.05) {
          const p = easeOutBack(clamp((gagT - 1.05) / 0.45, 0, 1));
          flopAngle = p * (Math.PI * 0.47);
          flopY = p * 34;
        }

        // Ground shadow
        c.fillStyle = "rgba(25, 48, 12, 0.35)";
        c.beginPath();
        c.ellipse(0, 62, 58, 18, 0, 0, Math.PI * 2);
        c.fill();

        c.translate(0, duckY + flopY);
        c.rotate(flopAngle);

        // Flicking striped tabby tail
        c.save();
        c.translate(36, 36);
        const flick = Math.sin(t * (isBusted ? 10 : 3.5)) * 0.35;
        c.strokeStyle = "#c9661a"; c.lineWidth = 14; c.lineCap = "round";
        c.beginPath();
        c.moveTo(0, 0);
        c.bezierCurveTo(28, -6, 38, -36 + flick * 30, 18 + flick * 22, -52);
        c.stroke();
        c.strokeStyle = "#8a3a08"; c.lineWidth = 4;
        c.setLineDash([4, 10]); c.stroke(); c.setLineDash([]);
        c.restore();

        // Tabby body
        const bodyGrad = c.createRadialGradient(-10, 4, 8, 0, 18, 66);
        bodyGrad.addColorStop(0, "#f5a542");
        bodyGrad.addColorStop(0.6, "#d97521");
        bodyGrad.addColorStop(1, "#99450d");
        c.fillStyle = bodyGrad;
        c.strokeStyle = "#522104"; c.lineWidth = 2.4;
        c.beginPath();
        c.ellipse(0, 18 + breath * 0.4, 46, 48, 0, 0, Math.PI * 2);
        c.fill(); c.stroke();

        // Cream chest fluff
        c.fillStyle = "#fce7c2";
        c.beginPath();
        c.ellipse(0, 26, 22, 28, 0, 0, Math.PI * 2);
        c.fill();

        // Front paws
        c.fillStyle = "#e88b31"; c.strokeStyle = "#522104"; c.lineWidth = 2;
        c.beginPath(); c.ellipse(-18, 56, 13, 9, 0, 0, Math.PI * 2); c.fill(); c.stroke();
        c.beginPath(); c.ellipse(18, 56, 13, 9, 0, 0, Math.PI * 2); c.fill(); c.stroke();

        // Pointing paw on Grandma surprise
        if (isShock) {
          c.save(); c.translate(52, -4 + Math.sin(t * 20) * 5); c.rotate(-0.2);
          c.beginPath(); c.ellipse(0, 0, 18, 9, 0, 0, Math.PI * 2); c.fill(); c.stroke();
          c.restore();
        }

        // Head
        c.save();
        c.translate(0, -34 + breath);
        // Pointy cat ears
        [-32, 32].forEach((ex, i) => {
          c.save();
          c.translate(ex, -28);
          c.rotate(i === 0 ? -0.35 : 0.35);
          c.fillStyle = "#d97521"; c.strokeStyle = "#522104"; c.lineWidth = 2.4;
          c.beginPath(); c.moveTo(-14, 14); c.lineTo(0, -20); c.lineTo(14, 14); c.closePath();
          c.fill(); c.stroke();
          c.fillStyle = "#f2a6a6";
          c.beginPath(); c.moveTo(-7, 10); c.lineTo(0, -9); c.lineTo(7, 10); c.closePath(); c.fill();
          c.restore();
        });

        // Fluffy wide grumpy cheeks
        const headGrad = c.createRadialGradient(-8, -12, 8, 0, 0, 52);
        headGrad.addColorStop(0, "#fab152");
        headGrad.addColorStop(0.65, "#de7b24");
        headGrad.addColorStop(1, "#a64c0f");
        c.fillStyle = headGrad;
        c.strokeStyle = "#522104"; c.lineWidth = 2.4;
        c.beginPath();
        c.ellipse(0, 0, 48, 39, 0, 0, Math.PI * 2);
        c.fill(); c.stroke();

        // Forehead tabby M stripes
        c.strokeStyle = "#8a3a08"; c.lineWidth = 3.2; c.lineCap = "round";
        [-12, 0, 12].forEach(sx => {
          c.beginPath(); c.moveTo(sx, -35); c.lineTo(sx * 0.7, -20); c.stroke();
        });

        // Whiskers
        c.strokeStyle = "rgba(255, 245, 230, 0.85)"; c.lineWidth = 1.8;
        [-1, 1].forEach(dir => {
          [-2, 5, 12].forEach((wy, idx) => {
            c.beginPath();
            c.moveTo(dir * 24, wy);
            c.lineTo(dir * 58, wy + (idx - 1) * 5 + Math.sin(t * 5 + idx) * 1.5);
            c.stroke();
          });
        });

        // Pink nose & grumpy frown (or dropped jaw on shock)
        c.fillStyle = "#e87676";
        c.beginPath(); c.moveTo(-6, 5); c.lineTo(6, 5); c.lineTo(0, 12); c.closePath(); c.fill();

        if (isShock) {
          c.fillStyle = "#5c1a24";
          c.beginPath(); c.ellipse(0, 21, 9, 11, 0, 0, Math.PI * 2); c.fill();
        } else {
          c.strokeStyle = "#4d1f05"; c.lineWidth = 2.6;
          c.beginPath();
          c.moveTo(-12, 20); c.quadraticCurveTo(0, 12, 12, 20);
          c.stroke();
        }

        // Eyes (dizzy when playing dead, bulging on shock, grumpy otherwise)
        const eyeExpr = (isBusted && gagT > 1.15) ? "dizzy" : (isShock || ch.state === "react" ? "bulge" : "grumpy");
        drawGlossyEye(c, -17, -4, 10.5, ch.lookX, ch.lookY, ch.blink, eyeExpr);
        drawGlossyEye(c, 17, -4, 10.5, ch.lookX, ch.lookY, ch.blink, eyeExpr);

        // Furrowed grumpy brow
        if (eyeExpr === "grumpy") {
          c.strokeStyle = "#522104"; c.lineWidth = 3.2;
          c.beginPath();
          c.moveTo(-31, -15); c.lineTo(-4, -9);
          c.moveTo(31, -15); c.lineTo(4, -9);
          c.stroke();
        }
        c.restore();

        // Carrying item during heist OR tossed & balanced on nose during busted gag!
        if (ch.carryingItem) {
          c.save(); c.translate(0, 16); drawPicnicItem(c, ch.carryingItem, 0.8, false); c.restore();
        } else if (isBusted && ch.stolenItem) {
          c.save();
          if (gagT < 0.7) {
            const arc = Math.sin((gagT / 0.7) * Math.PI) * 115;
            c.translate(0, -45 - arc);
            c.rotate(gagT * 9);
          } else {
            c.translate(0, -46);
            c.rotate(Math.sin(gagT * 8) * 0.12);
          }
          drawPicnicItem(c, ch.stolenItem, 0.85, false);
          c.restore();
        }

        c.restore();
      }

      // 3. GOOFY PUG (Center-right behind blanket)
      function drawPug(c, ch, t) {
        c.save();
        const breath = Math.sin(t * 4.5 + ch.seed) * 2.4;
        const isBusted = ch.state === "busted";
        const isWrong = ch.state === "wrong";
        const isShock = ch.state === "react_grandma";
        const gagT = ch.stateTimer;

        // Happy wiggly spin wobble when busted!
        const spinScaleX = isBusted ? Math.cos(gagT * 9) * 0.25 + (Math.cos(gagT * 9) >= 0 ? 0.75 : -0.75) : 1;
        const bounceY = isBusted ? -Math.abs(Math.sin(gagT * 11)) * 22 : 0;

        // Ground shadow
        c.fillStyle = "rgba(25, 48, 12, 0.36)";
        c.beginPath();
        c.ellipse(0, 66, 62, 19, 0, 0, Math.PI * 2);
        c.fill();

        c.translate(0, bounceY);
        c.scale(isBusted ? (Math.sin(gagT * 6) > 0 ? 1 : -1) * (0.88 + Math.abs(Math.cos(gagT * 6)) * 0.14) : 1, 1);

        // Curly cinnamon-roll tail
        c.strokeStyle = "#b8905c"; c.lineWidth = 10; c.lineCap = "round";
        c.beginPath();
        c.arc(44, 24, 14, -Math.PI * 0.6, Math.PI * 1.15);
        c.stroke();
        c.strokeStyle = "#4d361d"; c.lineWidth = 2; c.stroke();

        // Wrinkled chubby fawn body
        const bGrad = c.createRadialGradient(-10, 12, 10, 0, 22, 62);
        bGrad.addColorStop(0, "#f2d8ae");
        bGrad.addColorStop(0.65, "#d4ae79");
        bGrad.addColorStop(1, "#9c7444");
        c.fillStyle = bGrad;
        c.strokeStyle = "#4a3319"; c.lineWidth = 2.4;
        c.beginPath();
        c.ellipse(0, 22 + breath * 0.4, 48, 44, 0, 0, Math.PI * 2);
        c.fill(); c.stroke();

        // Neck skin folds
        c.strokeStyle = "rgba(92, 60, 28, 0.42)"; c.lineWidth = 2.6;
        c.beginPath(); c.arc(0, -10, 34, 0.25, Math.PI - 0.25); c.stroke();

        // Sturdy paws
        c.fillStyle = "#c9a16b"; c.strokeStyle = "#4a3319"; c.lineWidth = 2.2;
        c.beginPath(); c.ellipse(-26, 60, 14, 10, 0, 0, Math.PI * 2); c.fill(); c.stroke();
        c.beginPath(); c.ellipse(24, 60, 14, 10, 0, 0, Math.PI * 2); c.fill(); c.stroke();

        // Pointing paw on Grandma surprise
        if (isShock) {
          c.save(); c.translate(54, -8 + Math.sin(t * 22) * 5); c.rotate(-0.3);
          c.beginPath(); c.ellipse(0, 0, 19, 9, 0, 0, Math.PI * 2); c.fill(); c.stroke();
          c.restore();
        }

        // Round wrinkly Pug head
        c.save();
        const shakeX = isWrong ? Math.sin(gagT * 28) * 8 : 0;
        c.translate(shakeX, -28 + breath);

        // Velvety dark floppy ears
        [-40, 40].forEach((ex, i) => {
          c.fillStyle = "#362820"; c.strokeStyle = "#1c130e"; c.lineWidth = 2;
          c.beginPath();
          c.moveTo(ex * 0.72, -26);
          c.quadraticCurveTo(ex * 1.45, -16, ex * 1.12, 10);
          c.quadraticCurveTo(ex * 0.85, 6, ex * 0.72, -12);
          c.closePath();
          c.fill(); c.stroke();
        });

        const hGrad = c.createRadialGradient(-8, -10, 8, 0, 0, 50);
        hGrad.addColorStop(0, "#f5dec0");
        hGrad.addColorStop(0.7, "#d6b17c");
        hGrad.addColorStop(1, "#a67d4b");
        c.fillStyle = hGrad;
        c.strokeStyle = "#4a3319"; c.lineWidth = 2.4;
        c.beginPath(); c.ellipse(0, 0, 46, 38, 0, 0, Math.PI * 2); c.fill(); c.stroke();

        // Forehead wrinkles
        c.strokeStyle = "rgba(92, 60, 28, 0.5)"; c.lineWidth = 2.2;
        c.beginPath(); c.arc(0, -18, 16, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
        c.beginPath(); c.arc(0, -12, 12, Math.PI * 1.2, Math.PI * 1.8); c.stroke();

        // Dark velvet pug muzzle
        c.fillStyle = "#3d2d24";
        c.beginPath(); c.ellipse(0, 12, 24, 17, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#1f1612";
        c.beginPath(); c.ellipse(0, 4, 10, 6.5, 0, 0, Math.PI * 2); c.fill();

        // Panting pink tongue (HUGE wobbling tongue on wrong guess!)
        const tongueLen = isWrong ? 26 + Math.sin(gagT * 26) * 5 : (isShock ? 4 : 13 + Math.sin(t * 9) * 2.5);
        c.fillStyle = "#ff7899"; c.strokeStyle = "#a3314d"; c.lineWidth = 1.8;
        c.beginPath();
        c.moveTo(-7, 17);
        c.quadraticCurveTo(-8, 17 + tongueLen, 0, 19 + tongueLen);
        c.quadraticCurveTo(8, 17 + tongueLen, 7, 17);
        c.closePath();
        c.fill(); c.stroke();

        // Big goofy glossy pug eyes (extra bulging when busted or shocked!)
        const eyeExpr = (isBusted || isShock || ch.state === "react") ? "bulge" : "normal";
        drawGlossyEye(c, -21, -5, 13, ch.lookX, ch.lookY, ch.blink, eyeExpr);
        drawGlossyEye(c, 21, -5, 13, ch.lookX, ch.lookY, ch.blink, eyeExpr);
        c.restore();

        // Item display during heist or popped out when busted
        if (ch.carryingItem) {
          c.save(); c.translate(-14, 14); drawPicnicItem(c, ch.carryingItem, 0.8, false); c.restore();
        } else if (isBusted && ch.stolenItem) {
          c.save();
          const popY = -74 - Math.abs(Math.sin(gagT * 10)) * 18;
          c.translate(0, popY);
          c.rotate(Math.sin(gagT * 8) * 0.2);
          drawPicnicItem(c, ch.stolenItem, 0.88, false);
          c.restore();
        }

        c.restore();
      }

      // 4. CHEEKY WHITE GOOSE (Right of blanket — flexible S-curve Bezier neck!)
      function drawGoose(c, ch, t) {
        c.save();
        const breath = Math.sin(t * 3.4 + ch.seed) * 2;
        const isBusted = ch.state === "busted";
        const isWrong = ch.state === "wrong";
        const isShock = ch.state === "react_grandma";
        const gagT = ch.stateTimer;

        const waddleX = isBusted ? Math.sin(gagT * 7) * 38 : 0;
        const waddleTilt = isBusted ? Math.sin(gagT * 14) * 0.14 : 0;

        // Ground shadow
        c.fillStyle = "rgba(25, 48, 12, 0.35)";
        c.beginPath();
        c.ellipse(waddleX, 74, 58, 18, 0, 0, Math.PI * 2);
        c.fill();

        c.translate(waddleX, 0);
        c.rotate(waddleTilt);

        // Orange webbed feet
        const footStep = isBusted ? Math.sin(gagT * 14) * 10 : 0;
        c.fillStyle = "#f27e1f"; c.strokeStyle = "#8a3c06"; c.lineWidth = 2;
        [-18, 18].forEach((fx, i) => {
          const fy = 66 + (i === 0 ? footStep : -footStep);
          c.beginPath();
          c.moveTo(fx, 44); c.lineTo(fx, fy);
          c.lineTo(fx - 18, fy + 8); c.lineTo(fx + 14, fy + 8); c.lineTo(fx + 4, fy);
          c.closePath();
          c.fill(); c.stroke();
        });

        // Flapping wings
        const flap = (isBusted || isWrong || ch.state === "react") ? Math.sin(t * 26) * 0.65 : Math.sin(t * 2.2) * 0.06;
        // Back wing
        c.save();
        c.translate(22, 6);
        c.rotate(-0.2 + flap);
        c.fillStyle = "#dbe4ed"; c.strokeStyle = "#697d91"; c.lineWidth = 2.2;
        c.beginPath(); c.ellipse(26, 0, 34, 16, -0.25, 0, Math.PI * 2); c.fill(); c.stroke();
        c.restore();

        // Volumetric white feathered body
        const bGrad = c.createRadialGradient(-12, 8, 8, 0, 18, 66);
        bGrad.addColorStop(0, "#ffffff");
        bGrad.addColorStop(0.65, "#e8eff5");
        bGrad.addColorStop(1, "#b8cad9");
        c.fillStyle = bGrad;
        c.strokeStyle = "#5c6f82"; c.lineWidth = 2.4;
        c.beginPath();
        c.ellipse(4, 18 + breath * 0.5, 52, 38, -0.1, 0, Math.PI * 2);
        c.fill(); c.stroke();

        // Front wing
        c.save();
        c.translate(-8, 12);
        c.rotate(0.15 - flap);
        c.fillStyle = "#f5f9fc"; c.strokeStyle = "#697d91"; c.lineWidth = 2.2;
        c.beginPath(); c.ellipse(20, 4, 34, 17, 0.2, 0, Math.PI * 2); c.fill(); c.stroke();
        c.restore();

        // Flexible S-curve Bezier neck (stretches out dynamically when snatching!)
        const neckStretchX = ch.neckReachX || 0;
        const neckStretchY = ch.neckReachY || 0;
        const headX = -22 + neckStretchX + (isWrong ? 22 : (isShock ? 28 : 0));
        const headY = -74 + neckStretchY + breath + (isBusted ? Math.sin(gagT * 14) * 8 : 0);

        c.strokeStyle = "#5c6f82"; c.lineWidth = 27; c.lineCap = "round";
        c.beginPath();
        c.moveTo(-18, 2);
        c.bezierCurveTo(-46 + neckStretchX * 0.35, -36, headX + 18, headY + 34, headX, headY);
        c.stroke();

        c.strokeStyle = "#f7fafc"; c.lineWidth = 22;
        c.beginPath();
        c.moveTo(-18, 2);
        c.bezierCurveTo(-46 + neckStretchX * 0.35, -36, headX + 18, headY + 34, headX, headY);
        c.stroke();

        // Goose Head & Honking Orange Beak
        c.save();
        c.translate(headX, headY);
        const lookDir = (isWrong || isShock) ? 1 : -1;
        c.scale(lookDir, 1);

        c.fillStyle = "#ffffff"; c.strokeStyle = "#5c6f82"; c.lineWidth = 2.2;
        c.beginPath(); c.ellipse(0, 0, 23, 19, 0, 0, Math.PI * 2); c.fill(); c.stroke();

        // Open/honking bright orange beak
        const beakOpen = (isBusted || isWrong || isShock) ? 0.32 + Math.abs(Math.sin(t * 16)) * 0.22 : 0.05;
        c.fillStyle = "#ff851b"; c.strokeStyle = "#8a3c06"; c.lineWidth = 2;
        // Upper bill
        c.save(); c.rotate(-beakOpen);
        c.beginPath(); c.moveTo(16, -6); c.quadraticCurveTo(46, -8, 48, 2); c.lineTo(16, 4); c.closePath();
        c.fill(); c.stroke(); c.restore();
        // Lower bill
        c.save(); c.rotate(beakOpen);
        c.beginPath(); c.moveTo(15, 2); c.lineTo(44, 4); c.quadraticCurveTo(40, 12, 15, 9); c.closePath();
        c.fill(); c.stroke(); c.restore();

        // Eye
        const eyeExpr = (isBusted || isShock || ch.state === "react") ? "bulge" : "normal";
        drawGlossyEye(c, 5, -5, 8.5, ch.lookX * lookDir, ch.lookY, ch.blink, eyeExpr);
        c.restore();

        // Item carried in beak OR bouncing comically on Goose's head when busted!
        if (ch.carryingItem) {
          c.save();
          c.translate(headX - 34, headY + 8);
          drawPicnicItem(c, ch.carryingItem, 0.78, false);
          c.restore();
        } else if (isBusted && ch.stolenItem) {
          c.save();
          const bounce = Math.abs(Math.sin(gagT * 12)) * 22;
          c.translate(headX - 4, headY - 34 - bounce);
          c.rotate(Math.sin(gagT * 10) * 0.25);
          drawPicnicItem(c, ch.stolenItem, 0.85, false);
          c.restore();
        }

        c.restore();
      }

      // 5. HYPERACTIVE SQUIRREL (Front-right)
      function drawSquirrel(c, ch, t) {
        c.save();
        const breath = Math.sin(t * 5.2 + ch.seed) * 1.8;
        const isBusted = ch.state === "busted";
        const isWrong = ch.state === "wrong";
        const isShock = ch.state === "react_grandma";
        const gagT = ch.stateTimer;

        // Spring-rocket bouncing across grass when busted!
        let hopX = 0, hopY = 0, dizzy = false;
        if (isBusted) {
          if (gagT < 1.65) {
            hopX = -Math.sin((gagT / 1.65) * Math.PI) * 140;
            hopY = -Math.abs(Math.sin(gagT * 9.5)) * 105;
          } else {
            dizzy = true;
            hopY = Math.sin(gagT * 8) * 3;
          }
        }
        const wrongSpin = isWrong ? Math.sin(gagT * 24) * 0.22 : 0;

        // Ground shadow
        c.fillStyle = "rgba(25, 48, 12, 0.34)";
        c.beginPath();
        c.ellipse(hopX, 52, 46 * (1 - Math.abs(hopY) * 0.003), 14, 0, 0, Math.PI * 2);
        c.fill();

        c.translate(hopX, hopY);
        c.rotate(wrongSpin);

        // Huge fluffy curled chestnut tail
        c.save();
        c.translate(22, 16);
        c.rotate(Math.sin(t * 6) * 0.12);
        const tGrad = c.createRadialGradient(26, -34, 8, 22, -26, 62);
        tGrad.addColorStop(0, "#e38236");
        tGrad.addColorStop(0.6, "#b5541a");
        tGrad.addColorStop(1, "#78310a");
        c.fillStyle = tGrad;
        c.strokeStyle = "#4d1e05"; c.lineWidth = 2.4;
        c.beginPath();
        c.moveTo(0, 14);
        c.bezierCurveTo(64, 18, 72, -62, 24, -76);
        c.bezierCurveTo(-4, -84, -8, -46, 18, -36);
        c.bezierCurveTo(36, -28, 28, -4, 0, -4);
        c.closePath();
        c.fill(); c.stroke();
        c.restore();

        // Chestnut body & cream belly
        const bGrad = c.createRadialGradient(-8, 4, 6, 0, 14, 42);
        bGrad.addColorStop(0, "#de7b33");
        bGrad.addColorStop(1, "#964112");
        c.fillStyle = bGrad;
        c.strokeStyle = "#4d1e05"; c.lineWidth = 2.2;
        c.beginPath(); c.ellipse(0, 14 + breath * 0.5, 29, 34, 0.1, 0, Math.PI * 2); c.fill(); c.stroke();

        c.fillStyle = "#fce7c7";
        c.beginPath(); c.ellipse(-8, 18, 16, 23, 0.1, 0, Math.PI * 2); c.fill();

        // Feet
        c.fillStyle = "#a64a16"; c.strokeStyle = "#4d1e05"; c.lineWidth = 2;
        c.beginPath(); c.ellipse(-12, 46, 14, 7, 0, 0, Math.PI * 2); c.fill(); c.stroke();
        c.beginPath(); c.ellipse(12, 46, 14, 7, 0, 0, Math.PI * 2); c.fill(); c.stroke();

        // Head with ENORMOUSLY stuffed cheeks when busted!
        c.save();
        c.translate(-6, -26 + breath);

        // Tufted ears
        [-14, 14].forEach((ex, i) => {
          c.fillStyle = "#b5541a"; c.strokeStyle = "#4d1e05"; c.lineWidth = 2;
          c.beginPath(); c.ellipse(ex, -24, 7, 13, i === 0 ? -0.25 : 0.25, 0, Math.PI * 2); c.fill(); c.stroke();
        });

        c.fillStyle = "#cf6c27"; c.strokeStyle = "#4d1e05"; c.lineWidth = 2.2;
        c.beginPath(); c.ellipse(0, 0, 27, 24, 0, 0, Math.PI * 2); c.fill(); c.stroke();

        // Giant chipmunk-stuffed cheeks during busted gag!
        const cheekR = isBusted ? 22 + Math.sin(gagT * 10) * 2.5 : 10;
        c.fillStyle = "#f2a05e";
        c.beginPath();
        c.ellipse(-16, 8, cheekR, cheekR * 0.85, 0, 0, Math.PI * 2);
        c.ellipse(12, 8, cheekR * 0.9, cheekR * 0.8, 0, 0, Math.PI * 2);
        c.fill();
        if (isBusted) { c.strokeStyle = "#7a360d"; c.lineWidth = 2; c.stroke(); }

        // Cute nose & buck teeth
        c.fillStyle = "#2b160c";
        c.beginPath(); c.ellipse(-8, 2, 5, 3.8, 0, 0, Math.PI * 2); c.fill();
        if (!isBusted) {
          c.fillStyle = "#ffffff"; c.strokeStyle = "#4d1e05"; c.lineWidth = 1.4;
          c.fillRect(-11, 9, 4, 6); c.strokeRect(-11, 9, 4, 6);
          c.fillRect(-7, 9, 4, 6); c.strokeRect(-7, 9, 4, 6);
        }

        const eyeExpr = dizzy ? "dizzy" : (isShock || ch.state === "react" ? "bulge" : "normal");
        drawGlossyEye(c, -12, -8, 8.5, ch.lookX, ch.lookY, ch.blink, eyeExpr);
        drawGlossyEye(c, 8, -8, 8, ch.lookX, ch.lookY, ch.blink, eyeExpr);
        c.restore();

        // Orbiting golden stars when squirrel lands dizzy!
        if (dizzy) {
          for (let i = 0; i < 3; i++) {
            const a = gagT * 5 + i * (Math.PI * 2 / 3);
            const sx = -6 + Math.cos(a) * 36;
            const sy = -64 + Math.sin(a) * 11;
            drawStarShape(c, sx, sy, 8, "#ffe24f", "#c97a08");
          }
        }

        // Pointing paw up at Grandma on shock
        if (isShock) {
          c.save(); c.translate(-10, -48 + Math.sin(t * 22) * 4); c.rotate(-1.5);
          c.fillStyle = "#b5541a"; c.strokeStyle = "#4d1e05"; c.lineWidth = 2;
          c.beginPath(); c.ellipse(0, 0, 14, 7, 0, 0, Math.PI * 2); c.fill(); c.stroke();
          c.restore();
        }

        // Item carried during heist or peeking out of huge cheeks when busted
        if (ch.carryingItem) {
          c.save(); c.translate(-22, 6); drawPicnicItem(c, ch.carryingItem, 0.72, false); c.restore();
        } else if (isBusted && ch.stolenItem) {
          c.save();
          c.translate(-26, -12 + Math.sin(gagT * 10) * 4);
          drawPicnicItem(c, ch.stolenItem, 0.75, false);
          c.restore();
        }

        c.restore();
      }

      // 6. GRANDMA IN WOODEN ROCKING CHAIR (Upper-right — Unexpected Finale!)
      function drawGrandma(c, ch, t) {
        c.save();
        const isBusted = ch.state === "busted";
        const isWrong = ch.state === "wrong";
        const isSneaking = ch.state === "grandma_heist";
        const gagT = ch.stateTimer;

        // Smooth rocking chair physics (rocking faster when celebrating!)
        const rockSpeed = isBusted ? 5.8 : (isSneaking ? 1.2 : 1.75);
        const rockAmp = isBusted ? 0.13 : (isSneaking ? 0.03 : 0.075);
        const rockAngle = Math.sin(t * rockSpeed) * rockAmp;

        // Ground shadow under rocking chair
        c.fillStyle = "rgba(24, 48, 12, 0.38)";
        c.beginPath();
        c.ellipse(0, 92, 92, 22, 0, 0, Math.PI * 2);
        c.fill();

        c.translate(0, 74);
        c.rotate(rockAngle);
        c.translate(0, -74);

        // --- WOODEN ROCKING CHAIR (Back frame & slats) ---
        c.strokeStyle = "#4d270e"; c.lineWidth = 2.4;
        const woodGrad = c.createLinearGradient(-60, -100, 60, 80);
        woodGrad.addColorStop(0, "#9e5c2c");
        woodGrad.addColorStop(0.5, "#7d441d");
        woodGrad.addColorStop(1, "#542a0e");

        // Backrest posts & slats
        c.fillStyle = woodGrad;
        drawRoundedRectPath(c, 22, -106, 13, 124, 5); c.fill(); c.stroke();
        drawRoundedRectPath(c, -26, -102, 12, 118, 5); c.fill(); c.stroke();
        drawRoundedRectPath(c, -30, -104, 68, 18, 6); c.fill(); c.stroke();
        drawRoundedRectPath(c, -24, -76, 56, 12, 4); c.fill(); c.stroke();

        // Chair legs
        c.lineWidth = 8; c.strokeStyle = "#6e3b17"; c.lineCap = "round";
        c.beginPath();
        c.moveTo(-48, 28); c.lineTo(-56, 78);
        c.moveTo(28, 28); c.lineTo(38, 78);
        c.stroke();

        // Curved wooden rocker runner
        c.strokeStyle = "#5c2f10"; c.lineWidth = 10;
        c.beginPath();
        c.moveTo(-88, 64);
        c.quadraticCurveTo(-8, 96, 76, 68);
        c.stroke();
        c.strokeStyle = "#96582a"; c.lineWidth = 4;
        c.beginPath();
        c.moveTo(-86, 62);
        c.quadraticCurveTo(-8, 92, 74, 66);
        c.stroke();

        // --- GRANDMA'S BODY & COZY CARDIGAN ---
        // Slippers peeking out below shawl
        c.fillStyle = "#8a4b6e"; c.strokeStyle = "#421e32"; c.lineWidth = 2;
        c.beginPath(); c.ellipse(-66, 62, 16, 9, -0.15, 0, Math.PI * 2); c.fill(); c.stroke();
        c.beginPath(); c.ellipse(-44, 68, 16, 9, -0.1, 0, Math.PI * 2); c.fill(); c.stroke();

        // Knitted teal-blue lap shawl (hides stolen goodies underneath!)
        const shawlGrad = c.createLinearGradient(-72, 10, 26, 62);
        shawlGrad.addColorStop(0, "#75adc4");
        shawlGrad.addColorStop(0.55, "#4e839c");
        shawlGrad.addColorStop(1, "#335c70");
        c.fillStyle = shawlGrad;
        c.strokeStyle = "#223f4d"; c.lineWidth = 2.4;
        c.beginPath();
        c.moveTo(-18, 6);
        c.quadraticCurveTo(-62, 12, -74, 52);
        c.quadraticCurveTo(-36, 66, 16, 48);
        c.quadraticCurveTo(28, 22, -18, 6);
        c.closePath();
        c.fill(); c.stroke();
        // Cozy knit pattern stripes on shawl
        c.strokeStyle = "rgba(255, 245, 220, 0.35)"; c.lineWidth = 2.5;
        c.setLineDash([6, 5]);
        c.beginPath(); c.moveTo(-64, 34); c.quadraticCurveTo(-28, 44, 12, 32); c.stroke();
        c.setLineDash([]);

        // Cozy plum-berry cardigan torso
        const cardGrad = c.createRadialGradient(-10, -24, 10, 0, -14, 58);
        cardGrad.addColorStop(0, "#c76ea1");
        cardGrad.addColorStop(0.65, "#9c4878");
        cardGrad.addColorStop(1, "#6b2b50");
        c.fillStyle = cardGrad;
        c.strokeStyle = "#451832"; c.lineWidth = 2.4;
        c.beginPath();
        c.ellipse(0, -16, 38, 44, 0.14, 0, Math.PI * 2);
        c.fill(); c.stroke();

        // Soft lace collar & pearl buttons
        c.fillStyle = "#fff5e6";
        c.beginPath(); c.ellipse(-6, -50, 18, 9, 0.1, 0, Math.PI * 2); c.fill();
        c.fillStyle = "#ffe9c7";
        [-34, -20, -6].forEach(by => {
          c.beginPath(); c.arc(-18, by, 3.2, 0, Math.PI * 2); c.fill();
        });

        // Chair armrest (in front of lap)
        c.fillStyle = woodGrad; c.strokeStyle = "#4d270e"; c.lineWidth = 2.2;
        drawRoundedRectPath(c, -48, 8, 76, 13, 6); c.fill(); c.stroke();

        // --- GRANDMA'S HEAD, SILVER BUN & ROUND SPECTACLES ---
        c.save();
        const headNod = isBusted ? Math.sin(gagT * 10) * 0.12 : (isSneaking ? -0.06 : Math.sin(t * 1.75) * 0.08 + 0.14);
        c.translate(-8, -74);
        c.rotate(headNod);

        // Silver hair bun at top-back
        const hairGrad = c.createRadialGradient(14, -28, 4, 16, -24, 24);
        hairGrad.addColorStop(0, "#ffffff");
        hairGrad.addColorStop(0.65, "#d8dee6");
        hairGrad.addColorStop(1, "#9aa5b5");
        c.fillStyle = hairGrad;
        c.strokeStyle = "#5a6473"; c.lineWidth = 2;
        c.beginPath(); c.arc(18, -24, 18, 0, Math.PI * 2); c.fill(); c.stroke();
        // Hairpin
        c.strokeStyle = "#e0587a"; c.lineWidth = 3;
        c.beginPath(); c.moveTo(8, -32); c.lineTo(28, -16); c.stroke();

        // Warm rosy face
        const faceGrad = c.createRadialGradient(-8, -4, 6, 0, 2, 32);
        faceGrad.addColorStop(0, "#ffe4cc");
        faceGrad.addColorStop(0.75, "#f2bfa0");
        faceGrad.addColorStop(1, "#d99b7a");
        c.fillStyle = faceGrad;
        c.strokeStyle = "#7a4a33"; c.lineWidth = 2.2;
        c.beginPath(); c.ellipse(-2, 0, 26, 28, 0, 0, Math.PI * 2); c.fill(); c.stroke();

        // Fluffy silver bangs
        c.fillStyle = hairGrad;
        c.beginPath();
        c.arc(-2, -14, 24, Math.PI * 0.95, Math.PI * 2.1);
        c.quadraticCurveTo(18, -2, 8, -12);
        c.quadraticCurveTo(-8, -16, -24, -4);
        c.closePath();
        c.fill(); c.stroke();

        // Rosy cheeks
        c.fillStyle = "rgba(235, 110, 120, 0.36)";
        c.beginPath(); c.ellipse(-18, 8, 7, 4.5, 0, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.ellipse(8, 8, 7, 4.5, 0, 0, Math.PI * 2); c.fill();

        // Eyes & Round Gold Spectacles
        if (isBusted) {
          // Huge mischievous grin + playful wink!
          drawGlossyEye(c, -14, -2, 6.2, -0.4, 0.1, 0, "normal");
          // Winking right eye
          c.strokeStyle = "#4d2a18"; c.lineWidth = 2.6; c.lineCap = "round";
          c.beginPath(); c.arc(4, -1, 6, Math.PI * 1.15, Math.PI * 1.85); c.stroke();
        } else if (isSneaking) {
          // One sly open peeking eye + one closed!
          drawGlossyEye(c, -14, -2, 6.5, -0.7, 0.4, 0, "normal");
          c.strokeStyle = "#4d2a18"; c.lineWidth = 2.4;
          c.beginPath(); c.arc(4, 0, 6, 0.15, Math.PI - 0.15); c.stroke();
        } else if (isWrong && gagT < 0.65) {
          // Briefly blinks awake confused!
          drawGlossyEye(c, -14, -2, 6.2, -0.5, 0.2, 0, "bulge");
          drawGlossyEye(c, 4, -2, 6.2, -0.5, 0.2, 0, "bulge");
        } else {
          // Peacefully snoozing closed eyes
          c.strokeStyle = "#4d2a18"; c.lineWidth = 2.4; c.lineCap = "round";
          c.beginPath(); c.arc(-14, 0, 6, 0.15, Math.PI - 0.15); c.stroke();
          c.beginPath(); c.arc(4, 0, 6, 0.15, Math.PI - 0.15); c.stroke();
        }

        // Gold round spectacles frames
        c.strokeStyle = "#d49e2a"; c.lineWidth = 2.2;
        c.beginPath(); c.arc(-14, -1, 9.5, 0, Math.PI * 2); c.stroke();
        c.beginPath(); c.arc(4, -1, 9.5, 0, Math.PI * 2); c.stroke();
        c.beginPath(); c.moveTo(-4.5, -1); c.lineTo(-5.5, -1); c.stroke();

        // Mouth
        if (isBusted) {
          // Big triumphant mischievous grin!
          c.fillStyle = "#8a2939";
          c.beginPath(); c.arc(-5, 11, 11, 0, Math.PI); c.closePath(); c.fill();
          c.fillStyle = "#ffffff";
          c.fillRect(-13, 11, 16, 3.5);
        } else if (isSneaking) {
          // Cheeky smirk
          c.strokeStyle = "#6e2c26"; c.lineWidth = 2.4; c.lineCap = "round";
          c.beginPath(); c.moveTo(-13, 13); c.quadraticCurveTo(-5, 18, 4, 11); c.stroke();
        } else {
          // Peaceful open snoring mouth
          const snore = 4 + Math.sin(t * 2.6) * 2.4;
          c.fillStyle = "#7a2c38";
          c.beginPath(); c.ellipse(-5, 14, 5.5, snore, 0, 0, Math.PI * 2); c.fill();
        }
        c.restore();

        // Grandma's cozy arm + BUSTED celebration juggling stolen item!
        c.fillStyle = "#9c4878"; c.strokeStyle = "#451832"; c.lineWidth = 2.2;
        if (isBusted && ch.stolenItem) {
          // Raised proud arm happily juggling/nibbling the stolen item!
          c.beginPath(); c.ellipse(-34, -22, 18, 10, -0.5, 0, Math.PI * 2); c.fill(); c.stroke();
          c.fillStyle = "#f2bfa0";
          c.beginPath(); c.arc(-50, -32, 9, 0, Math.PI * 2); c.fill(); c.stroke();

          c.save();
          const jugY = -74 - Math.abs(Math.sin(gagT * 6.5)) * 42;
          const jugX = -56 + Math.sin(gagT * 3.25) * 18;
          c.translate(jugX, jugY);
          c.rotate(gagT * 4.5);
          drawPicnicItem(c, ch.stolenItem, 0.96, false);
          c.restore();
        } else if (!isSneaking) {
          // Hands resting innocently on lap shawl
          c.beginPath(); c.ellipse(-26, 4, 22, 11, 0.25, 0, Math.PI * 2); c.fill(); c.stroke();
          c.fillStyle = "#f2bfa0";
          c.beginPath(); c.arc(-44, 12, 8.5, 0, Math.PI * 2); c.fill(); c.stroke();
        }

        c.restore();

        // --- GRANDMA'S HOOKED WOODEN CANE (Drawn in world space during Grandma Heist!) ---
        if (isSneaking && ch.caneTip) {
          c.save();
          const startX = -32;
          const startY = -6;
          const tipX = ch.caneTip.x - ch.x;
          const tipY = ch.caneTip.y - ch.y;

          // Cane shaft
          c.strokeStyle = "#4a2409"; c.lineWidth = 10; c.lineCap = "round";
          c.beginPath(); c.moveTo(startX, startY); c.lineTo(tipX, tipY); c.stroke();
          c.strokeStyle = "#a8642c"; c.lineWidth = 6;
          c.beginPath(); c.moveTo(startX, startY); c.lineTo(tipX, tipY); c.stroke();

          // Curved shepherd's hook at tip
          const angle = Math.atan2(tipY - startY, tipX - startX);
          c.save();
          c.translate(tipX, tipY);
          c.rotate(angle);
          c.strokeStyle = "#4a2409"; c.lineWidth = 10;
          c.beginPath(); c.arc(12, 12, 16, -Math.PI * 0.5, Math.PI * 0.75); c.stroke();
          c.strokeStyle = "#a8642c"; c.lineWidth = 6;
          c.beginPath(); c.arc(12, 12, 16, -Math.PI * 0.5, Math.PI * 0.75); c.stroke();
          c.restore();

          // Item hooked onto cane!
          if (ch.carryingItem) {
            c.save();
            c.translate(tipX, tipY + 4);
            drawPicnicItem(c, ch.carryingItem, 0.85, false);
            c.restore();
          }
          c.restore();
        }
      }

      /* =========================================================================
         7. PARTICLES, LIVING GARDEN AMBIENCE & HANGING WOODEN SIGN
         ========================================================================= */
      const particles = [];
      const butterflies = [
        { x: 260, y: 210, phase: 0.4, speed: 0.55, c1: "#ff9e44", c2: "#ffe066", scale: 1.05 },
        { x: 960, y: 170, phase: 2.1, speed: 0.48, c1: "#5cc4ff", c2: "#b8ecff", scale: 0.92 },
        { x: 1410, y: 580, phase: 4.0, speed: 0.62, c1: "#d57bff", c2: "#f7c2ff", scale: 1.0 }
      ];
      const clouds = [
        { x: 140, y: 78, s: 1.15, spd: 9 },
        { x: 760, y: 62, s: 0.92, spd: 6.5 },
        { x: 1380, y: 92, s: 1.25, spd: 8 }
      ];

      function drawStarShape(c, x, y, r, fill, stroke) {
        c.save();
        c.translate(x, y);
        c.beginPath();
        for (let i = 0; i < 10; i++) {
          const rad = i % 2 === 0 ? r : r * 0.46;
          const a = (i * Math.PI) / 5 - Math.PI / 2;
          const px = Math.cos(a) * rad, py = Math.sin(a) * rad;
          if (i === 0) c.moveTo(px, py); else c.lineTo(px, py);
        }
        c.closePath();
        c.fillStyle = fill; c.fill();
        if (stroke) { c.strokeStyle = stroke; c.lineWidth = 1.6; c.stroke(); }
        c.restore();
      }

      function spawnBurst(x, y, count = 42, grand = false) {
        const colors = ["#ff5964", "#ffcf33", "#4cd964", "#38b6ff", "#c77dff", "#ff8c42", "#fff59d"];
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const spd = (grand ? 180 : 120) + Math.random() * (grand ? 380 : 280);
          const type = i % 5 === 0 ? "star" : (i % 4 === 0 ? "crumb" : "confetti");
          particles.push({
            type,
            x, y,
            vx: Math.cos(a) * spd,
            vy: Math.sin(a) * spd - (140 + Math.random() * 140),
            g: type === "confetti" ? 260 : 420,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 11,
            size: type === "star" ? 8 + Math.random() * 8 : 6 + Math.random() * 7,
            color: colors[i % colors.length],
            life: 1.2 + Math.random() * 1.1,
            maxLife: 2.3
          });
        }
      }

      function spawnAmbientParticle(type, x, y, extra = {}) {
        particles.push({
          type,
          x, y,
          vx: extra.vx ?? (Math.random() - 0.5) * 40,
          vy: extra.vy ?? -55 - Math.random() * 35,
          g: extra.g ?? -10,
          rot: extra.rot ?? 0,
          vrot: extra.vrot ?? (Math.random() - 0.5) * 3,
          size: extra.size ?? 10,
          color: extra.color ?? "#ffffff",
          life: extra.life ?? 1.2,
          maxLife: extra.life ?? 1.2
        });
      }

      function spawnLeafGust() {
        const leafColors = ["#6bbf3b", "#92d448", "#f0b432", "#e87e2c", "#ff9bb5"];
        for (let i = 0; i < 65; i++) {
          particles.push({
            type: "leaf",
            x: -120 - Math.random() * 480,
            y: 120 + Math.random() * 740,
            vx: 1650 + Math.random() * 950,
            vy: (Math.random() - 0.5) * 260,
            g: 0,
            rot: Math.random() * Math.PI * 2,
            vrot: (Math.random() - 0.5) * 14,
            size: 14 + Math.random() * 16,
            color: leafColors[i % leafColors.length],
            life: 1.15,
            maxLife: 1.15,
            waveSeed: Math.random() * 10
          });
        }
      }

      function updateAndDrawParticles(c, dt, t) {
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            particles.splice(i, 1);
            continue;
          }
          p.vy += p.g * dt;
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          if (p.type === "leaf") {
            p.y += Math.sin(t * 14 + p.waveSeed) * 180 * dt;
          }
          p.rot += p.vrot * dt;

          const alpha = clamp(p.life / Math.min(0.45, p.maxLife), 0, 1);
          c.save();
          c.globalAlpha = alpha;
          c.translate(p.x, p.y);
          c.rotate(p.rot);

          if (p.type === "confetti") {
            c.fillStyle = p.color;
            c.fillRect(-p.size * 0.6, -p.size * 0.35, p.size * 1.2, p.size * 0.7);
          } else if (p.type === "crumb") {
            c.fillStyle = "#b87435";
            c.beginPath(); c.arc(0, 0, p.size * 0.5, 0, Math.PI * 2); c.fill();
          } else if (p.type === "star") {
            drawStarShape(c, 0, 0, p.size, p.color, "rgba(120,65,5,0.45)");
          } else if (p.type === "bubble") {
            c.strokeStyle = "rgba(180, 238, 255, 0.9)";
            c.fillStyle = "rgba(215, 248, 255, 0.32)";
            c.lineWidth = 2;
            c.beginPath(); c.arc(0, 0, p.size, 0, Math.PI * 2); c.fill(); c.stroke();
            c.fillStyle = "rgba(255,255,255,0.8)";
            c.beginPath(); c.arc(-p.size * 0.32, -p.size * 0.32, p.size * 0.25, 0, Math.PI * 2); c.fill();
          } else if (p.type === "toot") {
            c.fillStyle = "rgba(145, 214, 72, 0.72)";
            c.beginPath();
            c.arc(0, 0, p.size, 0, Math.PI * 2);
            c.arc(p.size * 0.6, -p.size * 0.3, p.size * 0.7, 0, Math.PI * 2);
            c.fill();
          } else if (p.type === "note") {
            // Non-letter musical eighth-note (for whistling & Grandma snooze)
            c.fillStyle = p.color;
            c.strokeStyle = p.color;
            c.lineWidth = 2.6;
            c.beginPath(); c.ellipse(-3, 5, 5.5, 4, -0.35, 0, Math.PI * 2); c.fill();
            c.beginPath(); c.moveTo(2, 4); c.lineTo(2, -11); c.quadraticCurveTo(10, -9, 10, -2); c.stroke();
          } else if (p.type === "sweat") {
            c.fillStyle = "#5ccbff";
            c.beginPath();
            c.moveTo(0, -p.size);
            c.quadraticCurveTo(p.size * 0.7, 0, 0, p.size * 0.7);
            c.quadraticCurveTo(-p.size * 0.7, 0, 0, -p.size);
            c.fill();
          } else if (p.type === "leaf") {
            c.fillStyle = p.color;
            c.strokeStyle = "rgba(45, 70, 15, 0.45)"; c.lineWidth = 1.6;
            c.beginPath();
            c.ellipse(0, 0, p.size, p.size * 0.52, 0, 0, Math.PI * 2);
            c.fill(); c.stroke();
            c.beginPath(); c.moveTo(-p.size * 0.85, 0); c.lineTo(p.size * 0.85, 0); c.stroke();
          } else if (p.type === "snorepuff") {
            // Soft non-letter translucent floating snooze puff bubble
            c.fillStyle = "rgba(255, 252, 235, 0.58)";
            c.strokeStyle = "rgba(180, 198, 224, 0.65)";
            c.lineWidth = 1.6;
            c.beginPath();
            c.arc(0, 0, p.size, 0, Math.PI * 2);
            c.arc(p.size * 0.6, -p.size * 0.2, p.size * 0.68, 0, Math.PI * 2);
            c.fill(); c.stroke();
          }
          c.restore();
        }
      }

      function drawDynamicGardenAmbience(c, t, dt) {
        // 1. Drifting warm clouds
        clouds.forEach(cl => {
          cl.x += cl.spd * dt;
          if (cl.x > STAGE_W + 460) cl.x = -460;
          c.save();
          c.translate(cl.x, cl.y);
          c.scale(cl.s, cl.s);
          c.fillStyle = "rgba(255, 252, 240, 0.72)";
          c.beginPath();
          c.arc(-44, 8, 28, 0, Math.PI * 2);
          c.arc(-8, -8, 38, 0, Math.PI * 2);
          c.arc(36, 4, 30, 0, Math.PI * 2);
          c.arc(62, 14, 20, 0, Math.PI * 2);
          c.fill();
          c.restore();
        });

        // 2. Soft Volumetric Sunbeams streaming from top-left oak canopy
        c.save();
        const beamPulse = 0.08 + Math.sin(t * 0.9) * 0.025;
        for (let i = 0; i < 4; i++) {
          const bx = 120 + i * 210;
          const grad = c.createLinearGradient(bx, 0, bx + 260, 740);
          grad.addColorStop(0, `rgba(255, 248, 190, ${beamPulse})`);
          grad.addColorStop(1, "rgba(255, 248, 190, 0)");
          c.fillStyle = grad;
          c.beginPath();
          c.moveTo(bx, -260);
          c.lineTo(bx + 115, -260);
          c.lineTo(bx + 420, 760);
          c.lineTo(bx + 230, 760);
          c.closePath();
          c.fill();
        }
        c.restore();

        // 3. Swaying sunlit oak canopy branches top-left
        c.save();
        const sway = Math.sin(t * 1.35) * 0.03;
        c.translate(50, -30);
        c.rotate(sway);
        const foliage = [
          [-90, 30, 120], [50, 20, 135], [195, 5, 115], [320, -25, 95], [115, 110, 92], [-20, 125, 95]
        ];
        foliage.forEach(([fx, fy, fr], idx) => {
          const g = c.createRadialGradient(fx - fr * 0.25, fy - fr * 0.3, 12, fx, fy, fr);
          g.addColorStop(0, idx % 2 === 0 ? "#88cb4a" : "#9bd654");
          g.addColorStop(0.65, "#4c8f29");
          g.addColorStop(1, "#2a5915");
          c.fillStyle = g;
          c.beginPath(); c.arc(fx, fy, fr, 0, Math.PI * 2); c.fill();
        });
        c.restore();

        // 4. Gently nodding lawn daisies
        const daisies = [
          [285, 675], [312, 825], [1285, 685], [1465, 670], [1190, 848], [460, 868], [840, 872]
        ];
        daisies.forEach(([dx, dy], idx) => {
          const nod = Math.sin(t * 2.2 + idx * 1.4) * 4;
          c.strokeStyle = "#3f7a1d"; c.lineWidth = 2.4;
          c.beginPath(); c.moveTo(dx, dy + 14); c.quadraticCurveTo(dx + nod * 0.5, dy + 5, dx + nod, dy); c.stroke();
          c.fillStyle = "#fffdf2";
          for (let p = 0; p < 6; p++) {
            const pa = (p * Math.PI) / 3;
            c.beginPath(); c.ellipse(dx + nod + Math.cos(pa) * 5.5, dy + Math.sin(pa) * 5.5, 4, 2.6, pa, 0, Math.PI * 2); c.fill();
          }
          c.fillStyle = "#f7c42d";
          c.beginPath(); c.arc(dx + nod, dy, 3.6, 0, Math.PI * 2); c.fill();
        });
      }

      function drawButterflies(c, t, dt) {
        butterflies.forEach(bf => {
          bf.phase += dt * bf.speed;
          const bx = bf.x + Math.sin(bf.phase * 1.3) * 145 + Math.cos(bf.phase * 0.6) * 65;
          const by = bf.y + Math.sin(bf.phase * 2.4) * 42;
          const flap = Math.abs(Math.sin(t * 13 + bf.phase * 5));
          const dir = Math.cos(bf.phase * 1.3) >= 0 ? 1 : -1;

          c.save();
          c.translate(bx, by);
          c.scale(bf.scale * dir, bf.scale);
          c.rotate(Math.sin(bf.phase * 2.4) * 0.18);

          // Wings
          c.fillStyle = bf.c1;
          c.strokeStyle = "rgba(45, 25, 10, 0.55)"; c.lineWidth = 1.4;
          c.beginPath(); c.ellipse(-5, -6, 12, 8 * flap + 2, -0.4, 0, Math.PI * 2); c.fill(); c.stroke();
          c.fillStyle = bf.c2;
          c.beginPath(); c.ellipse(6, -5, 10, 7 * flap + 2, 0.4, 0, Math.PI * 2); c.fill(); c.stroke();
          c.fillStyle = "#3b2416";
          c.beginPath(); c.ellipse(0, 0, 2.2, 7, 0, 0, Math.PI * 2); c.fill();
          c.restore();
        });
      }

      // Hanging Carved Wooden Sign with Rope & Pendulum Physics
      const signState = {
        visible: false,
        y: -150,
        targetY: -150,
        vy: 0,
        swayAngle: 0,
        swayVel: 0,
        itemId: null
      };

      function showSign(itemId) {
        signState.visible = true;
        signState.itemId = itemId;
        signState.targetY = 82;
        signState.swayVel = (Math.random() > 0.5 ? 1 : -1) * 0.32;
        sfx.signDrop();
      }

      function hideSign() {
        signState.visible = false;
        signState.targetY = -170;
      }

      function updateAndDrawSign(c, dt, t) {
        // Spring drop physics
        const force = (signState.targetY - signState.y) * 58;
        signState.vy = (signState.vy + force * dt) * Math.pow(0.08, dt);
        signState.y += signState.vy * dt;

        // Gentle pendulum sway
        const swayForce = -signState.swayAngle * 14 + Math.sin(t * 1.4) * 0.04;
        signState.swayVel = (signState.swayVel + swayForce * dt) * Math.pow(0.28, dt);
        signState.swayAngle += signState.swayVel * dt;

        if (signState.y < -130 || !signState.itemId) return;

        const text = currentLang === "uk"
          ? ITEM_MAP[signState.itemId].uk
          : ITEM_MAP[signState.itemId].ru;

        c.save();
        c.translate(STAGE_W * 0.5, signState.y);
        c.rotate(signState.swayAngle);

        const w = 580;
        const h = 84;

        // Braided hemp suspension ropes
        [-w * 0.36, w * 0.36].forEach(rx => {
          c.strokeStyle = "#8a6234"; c.lineWidth = 8;
          c.beginPath(); c.moveTo(rx, -h * 0.5 + 4); c.lineTo(rx, -420); c.stroke();
          c.strokeStyle = "#d4a86a"; c.lineWidth = 3; c.setLineDash([7, 5]);
          c.beginPath(); c.moveTo(rx, -h * 0.5 + 4); c.lineTo(rx, -420); c.stroke();
          c.setLineDash([]);
        });

        // Soft drop shadow
        c.fillStyle = "rgba(30, 18, 6, 0.38)";
        drawRoundedRectPath(c, -w * 0.5 + 4, -h * 0.5 + 10, w, h, 20);
        c.fill();

        // Carved wooden plank gradient
        const pGrad = c.createLinearGradient(0, -h * 0.5, 0, h * 0.5);
        pGrad.addColorStop(0, "#ba783d");
        pGrad.addColorStop(0.5, "#945424");
        pGrad.addColorStop(1, "#6e3914");
        c.fillStyle = pGrad;
        c.strokeStyle = "#452108";
        c.lineWidth = 4;
        drawRoundedRectPath(c, -w * 0.5, -h * 0.5, w, h, 18);
        c.fill();
        c.stroke();

        // Wood grain & subtle knot clipped inside plank
        c.save();
        c.clip();
        c.strokeStyle = "rgba(62, 29, 8, 0.25)";
        c.lineWidth = 2;
        for (let gy = -32; gy <= 32; gy += 11) {
          c.beginPath();
          c.moveTo(-w * 0.5, gy);
          c.bezierCurveTo(-120, gy + 5, 120, gy - 6, w * 0.5, gy + 2);
          c.stroke();
        }
        // Subtle bevel inner top highlight
        c.strokeStyle = "rgba(255, 224, 165, 0.35)";
        c.lineWidth = 3;
        c.beginPath(); c.moveTo(-w * 0.48, -h * 0.5 + 4); c.lineTo(w * 0.48, -h * 0.5 + 4); c.stroke();
        c.restore();

        // Forged iron nail heads
        [[-w * 0.44, -22], [w * 0.44, -22], [-w * 0.44, 22], [w * 0.44, 22]].forEach(([nx, ny]) => {
          c.fillStyle = "#3b2c23";
          c.beginPath(); c.arc(nx, ny, 5.5, 0, Math.PI * 2); c.fill();
          c.fillStyle = "rgba(255,255,255,0.35)";
          c.beginPath(); c.arc(nx - 1.5, ny - 1.5, 2, 0, Math.PI * 2); c.fill();
        });

        // Bold crisp carved question text ONLY
        c.font = "900 37px 'Nunito', 'Fredoka', sans-serif";
        c.textAlign = "center";
        c.textBaseline = "middle";
        c.lineWidth = 6;
        c.strokeStyle = "#3f1b06";
        c.strokeText(text, 0, 2);
        c.fillStyle = "#fff7de";
        c.fillText(text, 0, 2);

        c.restore();
      }

      /* =========================================================================
         8. CHARACTERS, BLANKET ITEMS & PLOT-DRIVEN MEMORY STATE MACHINE
         ========================================================================= */
      const CHARACTERS = [
        { id: "raccoon",  homeX: 315,  homeY: 618, hitRx: 78, hitRy: 92,  draw: drawRaccoon },
        { id: "cat",      homeX: 605,  homeY: 468, hitRx: 68, hitRy: 80,  draw: drawCat },
        { id: "pug",      homeX: 965,  homeY: 492, hitRx: 72, hitRy: 84,  draw: drawPug },
        { id: "goose",    homeX: 1218, homeY: 602, hitRx: 78, hitRy: 98,  draw: drawGoose },
        { id: "squirrel", homeX: 1368, homeY: 752, hitRx: 66, hitRy: 74,  draw: drawSquirrel },
        { id: "grandma",  homeX: 1335, homeY: 382, hitRx: 96, hitRy: 108, draw: drawGrandma }
      ].map((c, idx) => ({
        ...c,
        x: c.homeX,
        y: c.homeY,
        lookX: 0,
        lookY: 0,
        blink: 0,
        blinkTimer: 1.5 + Math.random() * 3,
        seed: idx * 1.7,
        state: "idle", // idle | heist | grandma_heist | innocent | wrong | busted | react | react_grandma
        stateTimer: 0,
        carryingItem: null,
        stolenItem: null,
        neckReachX: 0,
        neckReachY: 0,
        caneTip: null,
        hoverAmt: 0,
        fxTimer: 0
      }));

      const CHAR_MAP = Object.fromEntries(CHARACTERS.map(ch => [ch.id, ch]));

      // 6 natural organic slots on the patchwork picnic blanket
      const BLANKET_SLOTS = [
        { x: 565, y: 635 },
        { x: 775, y: 618 },
        { x: 975, y: 642 },
        { x: 525, y: 748 },
        { x: 760, y: 752 },
        { x: 998, y: 744 }
      ];

      const game = {
        phase: "intro", // intro | heist | gust | guess | celebrate
        phaseTimer: 0,
        roundCount: 0,
        lastTargetItem: null,
        blanketItems: [], // { itemId, x, y, scale, taken, rot }
        heistQueue: [],
        activeHeist: null,
        flyingItem: null, // For Mid-air Pass Comedy Twist A
        targetItemId: null,
        culpritId: null,
        isGrandmaTwist: false,
        hoveredCharId: null,
        pointerStage: { x: 800, y: 600 },
        screenShake: 0,
        celebrateRays: 0
      };

      function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function resetCharacters() {
        CHARACTERS.forEach(ch => {
          ch.x = ch.homeX;
          ch.y = ch.homeY;
          ch.state = "idle";
          ch.stateTimer = 0;
          ch.carryingItem = null;
          ch.stolenItem = null;
          ch.neckReachX = 0;
          ch.neckReachY = 0;
          ch.caneTip = null;
          ch.fxTimer = 0;
        });
      }

      function startNewRound() {
        game.roundCount++;
        hideSign();
        nextBtn.classList.remove("pulse-ready");
        resetCharacters();
        game.flyingItem = null;
        game.activeHeist = null;
        game.celebrateRays = 0;
        game.screenShake = 0;

        // Pick 5 or 6 random items from the 10-item pool
        const itemCount = game.roundCount === 1 ? 5 : (Math.random() < 0.55 ? 6 : 5);
        const pickedItems = shuffle(ITEMS).slice(0, itemCount);
        const chosenSlots = shuffle(BLANKET_SLOTS).slice(0, itemCount);

        game.blanketItems = pickedItems.map((it, idx) => ({
          itemId: it.id,
          x: chosenSlots[idx].x + (Math.random() - 0.5) * 26,
          y: chosenSlots[idx].y + (Math.random() - 0.5) * 18,
          scale: it.scale,
          rot: (Math.random() - 0.5) * 0.14,
          taken: false,
          popIn: 0
        }));

        // Determine twists!
        // Guaranteed Grandma's Unexpected Finale on Round 3, then ~30% of subsequent rounds!
        const doGrandmaTwist = (game.roundCount === 3) || (game.roundCount > 3 && Math.random() < 0.30);
        // Comedy Twist A (Mid-air Pass): ~35% of rounds after round 1 (and guaranteed on round 2 for delightful variety!)
        const doMidAirPass = !doGrandmaTwist && ((game.roundCount === 2) || (game.roundCount > 2 && Math.random() < 0.38));

        game.isGrandmaTwist = doGrandmaTwist;

        const animals = shuffle(["raccoon", "cat", "pug", "goose", "squirrel"]);
        const numSteals = game.roundCount === 1 ? 3 : Math.min(itemCount - 1, 3 + Math.floor(Math.random() * 2)); // 3 or 4 steals
        const stolenIndices = shuffle(game.blanketItems.map((_, i) => i)).slice(0, numSteals);

        const queue = [];
        let passTargetItem = null;
        let passCatcherId = null;

        if (doGrandmaTwist) {
          // Animals steal (numSteals - 1) items, and Grandma secretly hooks 1 item with her cane!
          const grandmaSlotPos = Math.min(numSteals - 1, 2); // happens right amidst the action
          let animalPtr = 0;
          for (let i = 0; i < numSteals; i++) {
            const bIdx = stolenIndices[i];
            if (i === grandmaSlotPos) {
              queue.push({
                type: "grandma_cane",
                thiefId: "grandma",
                blanketIdx: bIdx,
                itemId: game.blanketItems[bIdx].itemId,
                duration: 1.55,
                elapsed: 0,
                grabbed: false,
                soundPlayed: false
              });
            } else {
              queue.push({
                type: "normal",
                thiefId: animals[animalPtr++],
                blanketIdx: bIdx,
                itemId: game.blanketItems[bIdx].itemId,
                duration: 1.25,
                elapsed: 0,
                grabbed: false,
                stepTick: 0
              });
            }
          }
        } else if (doMidAirPass) {
          // One heist is a hilarious trip-and-toss mid-air pass to another animal!
          const passPos = Math.min(numSteals - 1, 1);
          const thiefA = animals[0];
          const thiefB = animals[1];
          const others = animals.slice(2);
          let otherPtr = 0;

          for (let i = 0; i < numSteals; i++) {
            const bIdx = stolenIndices[i];
            if (i === passPos) {
              passTargetItem = game.blanketItems[bIdx].itemId;
              passCatcherId = thiefB;
              queue.push({
                type: "pass",
                thiefId: thiefA,
                catcherId: thiefB,
                blanketIdx: bIdx,
                itemId: game.blanketItems[bIdx].itemId,
                duration: 1.85,
                elapsed: 0,
                grabbed: false,
                tossed: false,
                caught: false,
                stepTick: 0
              });
            } else {
              queue.push({
                type: "normal",
                thiefId: others[otherPtr++],
                blanketIdx: bIdx,
                itemId: game.blanketItems[bIdx].itemId,
                duration: 1.25,
                elapsed: 0,
                grabbed: false,
                stepTick: 0
              });
            }
          }
        } else {
          for (let i = 0; i < numSteals; i++) {
            const bIdx = stolenIndices[i];
            queue.push({
              type: "normal",
              thiefId: animals[i],
              blanketIdx: bIdx,
              itemId: game.blanketItems[bIdx].itemId,
              duration: 1.28,
              elapsed: 0,
              grabbed: false,
              stepTick: 0
            });
          }
        }

        // Choose which stolen item to ask about
        if (doGrandmaTwist) {
          const gAct = queue.find(a => a.type === "grandma_cane");
          game.targetItemId = gAct.itemId;
          game.culpritId = "grandma";
        } else if (doMidAirPass && Math.random() < 0.78) {
          game.targetItemId = passTargetItem;
          game.culpritId = passCatcherId;
        } else {
          // Pick a random stolen item (avoiding repeating the exact last question item if possible)
          let candidates = queue.filter(a => a.itemId !== game.lastTargetItem);
          if (!candidates.length) candidates = queue;
          const chosen = candidates[Math.floor(Math.random() * candidates.length)];
          game.targetItemId = chosen.itemId;
          game.culpritId = chosen.type === "pass" ? chosen.catcherId : chosen.thiefId;
        }
        game.lastTargetItem = game.targetItemId;

        game.heistQueue = queue;
        game.phase = "heist";
        game.phaseTimer = 0;
      }

      function updateHeistPhase(dt) {
        // Brief readable 0.55s beat to admire the picnic blanket before the first theft darts out
        if (game.phaseTimer < 0.55) return;

        if (!game.activeHeist) {
          if (game.heistQueue.length > 0) {
            game.activeHeist = game.heistQueue.shift();
          } else {
            // All thefts complete -> launch brief leaf gust distraction!
            game.phase = "gust";
            game.phaseTimer = 0;
            spawnLeafGust();
            sfx.leafWhoosh();
            return;
          }
        }

        const act = game.activeHeist;
        act.elapsed += dt;
        const p = clamp(act.elapsed / act.duration, 0, 1);
        const bItem = game.blanketItems[act.blanketIdx];
        const thief = CHAR_MAP[act.thiefId];

        if (act.type === "grandma_cane") {
          thief.state = "grandma_heist";
          if (!act.soundPlayed) {
            act.soundPlayed = true;
            sfx.caneYoink();
          }
          const reachStart = { x: thief.homeX - 40, y: thief.homeY - 6 };
          if (p < 0.45) {
            const k = easeInOutQuad(p / 0.45);
            thief.caneTip = {
              x: lerp(reachStart.x, bItem.x, k),
              y: lerp(reachStart.y, bItem.y, k)
            };
          } else if (p < 0.55) {
            thief.caneTip = { x: bItem.x, y: bItem.y };
            if (!act.grabbed) {
              act.grabbed = true;
              bItem.taken = true;
              thief.carryingItem = act.itemId;
              sfx.snatch();
            }
          } else {
            const k = easeInOutQuad((p - 0.55) / 0.45);
            thief.caneTip = {
              x: lerp(bItem.x, reachStart.x - 10, k),
              y: lerp(bItem.y, reachStart.y + 18, k)
            };
          }

          if (p >= 1) {
            thief.caneTip = null;
            thief.carryingItem = null;
            thief.stolenItem = act.itemId;
            thief.state = "idle"; // Snaps instantly back to innocent snoring!
            game.activeHeist = null;
          }
          return;
        }

        // Animal locomotion (Goose stretches neck + waddles slightly; others dart/hop/scurry!)
        thief.state = "heist";
        const isGoose = thief.id === "goose";

        if (act.type === "normal") {
          if (p < 0.46) {
            const k = easeInOutQuad(p / 0.46);
            if (isGoose) {
              thief.x = lerp(thief.homeX, bItem.x + 125, k);
              thief.y = lerp(thief.homeY, bItem.y + 20, k);
              thief.neckReachX = (bItem.x - (thief.x - 22)) * k;
              thief.neckReachY = (bItem.y - (thief.y - 74)) * k;
            } else {
              thief.x = lerp(thief.homeX, bItem.x, k);
              thief.y = lerp(thief.homeY, bItem.y - 12, k) - Math.abs(Math.sin(k * Math.PI * 3)) * (thief.id === "squirrel" ? 36 : 14);
            }
            if (act.elapsed - act.stepTick > 0.14) {
              act.stepTick = act.elapsed;
              sfx.tiptoe(thief.id === "squirrel" ? 1.5 : 1);
            }
          } else {
            if (!act.grabbed) {
              act.grabbed = true;
              bItem.taken = true;
              thief.carryingItem = act.itemId;
              sfx.snatch();
            }
            const k = easeInOutQuad((p - 0.46) / 0.54);
            if (isGoose) {
              thief.x = lerp(bItem.x + 125, thief.homeX, k);
              thief.y = lerp(bItem.y + 20, thief.homeY, k);
              thief.neckReachX = lerp(bItem.x - (bItem.x + 103), 0, k);
              thief.neckReachY = lerp(bItem.y - (bItem.y - 54), 0, k);
            } else {
              thief.x = lerp(bItem.x, thief.homeX, k);
              thief.y = lerp(bItem.y - 12, thief.homeY, k) - Math.abs(Math.sin(k * Math.PI * 3)) * (thief.id === "squirrel" ? 32 : 12);
            }
          }

          if (p >= 1) {
            thief.x = thief.homeX;
            thief.y = thief.homeY;
            thief.neckReachX = 0;
            thief.neckReachY = 0;
            thief.carryingItem = null;
            thief.stolenItem = act.itemId;
            thief.state = "idle";
            game.activeHeist = null;
          }
        } else if (act.type === "pass") {
          // Comedy Twist A: Thief A grabs item, stumbles halfway back, tosses high arc to Catcher B!
          const catcher = CHAR_MAP[act.catcherId];
          const midX = lerp(bItem.x, thief.homeX, 0.45);
          const midY = lerp(bItem.y, thief.homeY, 0.45);

          if (p < 0.30) {
            const k = easeInOutQuad(p / 0.30);
            thief.x = lerp(thief.homeX, bItem.x, k);
            thief.y = lerp(thief.homeY, bItem.y - 10, k) - Math.abs(Math.sin(k * Math.PI * 2)) * 18;
            if (act.elapsed - act.stepTick > 0.14) {
              act.stepTick = act.elapsed;
              sfx.tiptoe(1.1);
            }
          } else if (p < 0.48) {
            if (!act.grabbed) {
              act.grabbed = true;
              bItem.taken = true;
              thief.carryingItem = act.itemId;
              sfx.snatch();
            }
            const k = easeInOutQuad((p - 0.30) / 0.18);
            thief.x = lerp(bItem.x, midX, k);
            thief.y = lerp(bItem.y - 10, midY, k);
          } else if (p < 0.86) {
            // Stumble & launch item in tall crystal-clear arc!
            if (!act.tossed) {
              act.tossed = true;
              thief.carryingItem = null;
              sfx.tripToss();
              // Little dust/star stumble burst
              spawnBurst(midX, midY + 10, 10, false);
            }
            const k = (p - 0.48) / 0.38;
            // Thief A recovers back home
            const rk = easeOutCubic(clamp(k * 1.15, 0, 1));
            thief.x = lerp(midX, thief.homeX, rk);
            thief.y = lerp(midY, thief.homeY, rk);

            // High parabolic flight arc to Catcher B!
            const fx = lerp(midX, catcher.homeX, k);
            const fy = lerp(midY - 20, catcher.homeY - 22, k) - Math.sin(k * Math.PI) * 235;
            game.flyingItem = {
              itemId: act.itemId,
              x: fx,
              y: fy,
              rot: k * Math.PI * 3.2
            };
            // Catcher anticipates with little excited hop
            catcher.y = catcher.homeY - Math.sin(k * Math.PI) * 22;
          } else {
            if (!act.caught) {
              act.caught = true;
              game.flyingItem = null;
              catcher.carryingItem = act.itemId;
              sfx.catchPop();
              spawnBurst(catcher.homeX, catcher.homeY - 25, 10, false);
            }
            const k = (p - 0.86) / 0.14;
            catcher.y = catcher.homeY + Math.sin(k * Math.PI) * 10;
          }

          if (p >= 1) {
            thief.x = thief.homeX; thief.y = thief.homeY; thief.state = "idle";
            catcher.x = catcher.homeX; catcher.y = catcher.homeY;
            catcher.carryingItem = null;
            catcher.stolenItem = act.itemId;
            catcher.state = "idle";
            game.flyingItem = null;
            game.activeHeist = null;
          }
        }
      }

      function handleCharacterClick(ch) {
        if (game.phase !== "guess") return;

        if (ch.id === game.culpritId) {
          // CORRECT CULPRIT BUSTED!
          game.phase = "celebrate";
          game.phaseTimer = 0;
          game.celebrateRays = 1;
          game.screenShake = ch.id === "grandma" ? 14 : 9;

          ch.state = "busted";
          ch.stateTimer = 0;
          ch.stolenItem = game.targetItemId;

          const isGrandma = ch.id === "grandma";
          sfx.victoryFanfare(isGrandma);
          setTimeout(() => sfx.characterVoice(ch.id, true), 140);

          spawnBurst(ch.x, ch.y - 20, isGrandma ? 85 : 58, isGrandma);
          if (isGrandma) {
            // Extra celebratory confetti cascade across the whole garden!
            spawnBurst(480, 320, 35, true);
            spawnBurst(960, 260, 35, true);
          }

          // All OTHER characters react dynamically!
          CHARACTERS.forEach(other => {
            if (other.id !== ch.id) {
              other.state = isGrandma ? "react_grandma" : "react";
              other.stateTimer = 0;
            }
          });

          // Gently pulse the Next button after gag kicks in
          setTimeout(() => {
            if (game.phase === "celebrate") {
              nextBtn.classList.add("pulse-ready");
            }
          }, 1250);
        } else {
          // WRONG SUSPECT — hilarious non-verbal slapstick denial!
          ch.state = "wrong";
          ch.stateTimer = 0;
          game.screenShake = 5;
          sfx.wrongBoing(ch.id);

          // Character-specific non-verbal denial particles
          if (ch.id === "squirrel") {
            for (let i = 0; i < 4; i++) {
              spawnAmbientParticle("sweat", ch.x + (i - 1.5) * 18, ch.y - 48, {
                vx: (i - 1.5) * 45, vy: -80 - Math.random() * 40, g: 240, size: 7, life: 0.85
              });
            }
          } else if (ch.id === "raccoon" || ch.id === "goose") {
            spawnAmbientParticle("note", ch.x + 28, ch.y - 68, {
              vx: 35, vy: -75, g: -5, color: "#4e7dff", life: 1.1
            });
          } else if (ch.id === "grandma") {
            spawnAmbientParticle("snorepuff", ch.x - 36, ch.y - 94, {
              vx: -25, vy: -45, size: 11, life: 1.3
            });
          }
        }
      }

      /* =========================================================================
         9. POINTER / TOUCH INTERACTION & HIT-TESTING
         ========================================================================= */
      function hitTestCharacter(sx, sy) {
        // Check front-to-back (higher Y first) for natural overlap priority
        const sorted = CHARACTERS.slice().sort((a, b) => b.y - a.y);
        for (const ch of sorted) {
          const dx = (sx - ch.x) / ch.hitRx;
          const dy = (sy - ch.y) / ch.hitRy;
          if (dx * dx + dy * dy <= 1.0) {
            return ch;
          }
        }
        return null;
      }

      canvas.addEventListener("pointermove", e => {
        const pt = screenToStage(e.clientX, e.clientY);
        game.pointerStage = pt;
        if (game.phase === "guess") {
          const hit = hitTestCharacter(pt.x, pt.y);
          game.hoveredCharId = hit ? hit.id : null;
          canvas.style.cursor = hit ? "pointer" : "default";
        } else {
          game.hoveredCharId = null;
          canvas.style.cursor = "default";
        }
      });

      canvas.addEventListener("pointerdown", e => {
        sfx.unlock();
        const pt = screenToStage(e.clientX, e.clientY);
        game.pointerStage = pt;
        if (game.phase === "guess") {
          const hit = hitTestCharacter(pt.x, pt.y);
          if (hit) {
            handleCharacterClick(hit);
          }
        }
      });

      langBtn.addEventListener("click", () => {
        sfx.unlock();
        sfx.uiClick();
        currentLang = currentLang === "uk" ? "ru" : "uk";
        updateLanguageUI();
        // Little playful nudge on the hanging sign if visible
        if (signState.visible) {
          signState.swayVel += 0.22;
        }
      });

      nextBtn.addEventListener("click", () => {
        sfx.unlock();
        sfx.uiClick();
        spawnLeafGust();
        sfx.leafWhoosh();
        startNewRound();
      });

      /* =========================================================================
         10. MAIN ANIMATION LOOP (60FPS High-DPI Painterly Rendering)
         ========================================================================= */
      let lastTime = 0;

      function updateSimulation(dt, t) {
        game.phaseTimer += dt;
        if (game.screenShake > 0) {
          game.screenShake = Math.max(0, game.screenShake - dt * 28);
        }

        // Blanket item gentle pop-in scale
        game.blanketItems.forEach(it => {
          it.popIn = Math.min(1, it.popIn + dt * 3.8);
        });

        // Phase transitions
        if (game.phase === "intro") {
          if (game.phaseTimer >= 0.95) {
            startNewRound();
          }
        } else if (game.phase === "heist") {
          updateHeistPhase(dt);
        } else if (game.phase === "gust") {
          if (game.phaseTimer >= 0.85) {
            game.phase = "guess";
            game.phaseTimer = 0;
            CHARACTERS.forEach(ch => {
              ch.state = "innocent";
              ch.stateTimer = 0;
            });
            showSign(game.targetItemId);
          }
        }

        // Update characters (eye tracking, blinking, gag particles, innocent whistling, Grandma snooze puffs)
        CHARACTERS.forEach(ch => {
          ch.stateTimer += dt;
          ch.fxTimer += dt;

          // Smooth hover aura
          const targetHover = game.hoveredCharId === ch.id ? 1 : 0;
          ch.hoverAmt = lerp(ch.hoverAmt, targetHover, Math.min(1, dt * 12));

          // Natural blinking
          ch.blinkTimer -= dt;
          if (ch.blinkTimer <= 0) {
            ch.blink = 1;
            ch.blinkTimer = 2.2 + Math.random() * 3.4;
          } else if (ch.blink > 0) {
            ch.blink = Math.max(0, ch.blink - dt * 7.5);
          }

          // Eye gaze target
          let gx = game.pointerStage.x;
          let gy = game.pointerStage.y;
          if (game.flyingItem) {
            gx = game.flyingItem.x;
            gy = game.flyingItem.y;
          } else if (game.phase === "heist" && game.activeHeist) {
            const act = game.activeHeist;
            const bItem = game.blanketItems[act.blanketIdx];
            gx = bItem.x; gy = bItem.y;
          } else if (ch.state === "innocent") {
            // Hilariously glancing up at the sky pretending innocence!
            gx = ch.x + Math.sin(t * 0.9 + ch.seed) * 140;
            gy = ch.y - 260;
          } else if (ch.state === "react_grandma") {
            gx = CHAR_MAP.grandma.homeX;
            gy = CHAR_MAP.grandma.homeY - 40;
          }

          const angle = Math.atan2(gy - (ch.y - 30), gx - ch.x);
          ch.lookX = lerp(ch.lookX, Math.cos(angle), Math.min(1, dt * 8));
          ch.lookY = lerp(ch.lookY, Math.sin(angle), Math.min(1, dt * 8));

          // Recover from wrong guess after ~1.1s back to innocent
          if (ch.state === "wrong" && ch.stateTimer > 1.1) {
            ch.state = "innocent";
            ch.stateTimer = 0;
          }

          // Ongoing non-verbal comedic ambient particles
          if (ch.id === "grandma" && ch.state !== "busted" && ch.state !== "grandma_heist" && ch.fxTimer > 1.55) {
            ch.fxTimer = 0;
            // Soft floating non-letter snooze puff & musical eighth-note
            spawnAmbientParticle(Math.random() > 0.45 ? "snorepuff" : "note", ch.x - 24, ch.y - 96, {
              vx: -12 + Math.random() * 24,
              vy: -38 - Math.random() * 18,
              g: -4,
              size: 9 + Math.random() * 5,
              color: "#7687bd",
              life: 1.9
            });
          }

          if (ch.state === "innocent" && ch.id !== "grandma" && ch.fxTimer > 3.2 + (ch.seed % 2)) {
            ch.fxTimer = 0;
            if (Math.random() < 0.45) {
              spawnAmbientParticle("note", ch.x + 22, ch.y - 68, {
                vx: 22, vy: -52, g: -4, color: "#fff3a1", life: 1.35
              });
            }
          }

          // Continuous slapstick particles during BUSTED gags!
          if (ch.state === "busted") {
            if (ch.id === "raccoon") {
              if (ch.stateTimer < 1.2 && ch.fxTimer > 0.14) {
                ch.fxTimer = 0;
                spawnAmbientParticle("crumb", ch.x + 8, ch.y - 12, {
                  vx: (Math.random() - 0.5) * 180, vy: -90 - Math.random() * 70, g: 380, size: 7, life: 0.75
                });
              } else if (ch.stateTimer >= 1.25 && ch.fxTimer > 0.36) {
                ch.fxTimer = 0;
                sfx.bubblePop();
                spawnAmbientParticle("bubble", ch.x + 6, ch.y - 24, {
                  vx: (Math.random() - 0.5) * 45, vy: -95 - Math.random() * 45, g: -15, size: 9 + Math.random() * 8, life: 1.8
                });
              }
            } else if (ch.id === "pug" && ch.fxTimer > 0.42) {
              ch.fxTimer = 0;
              spawnAmbientParticle("toot", ch.x + 38, ch.y + 24, {
                vx: 55 + Math.random() * 35, vy: -25 - Math.random() * 25, g: -12, size: 12 + Math.random() * 6, life: 1.15
              });
            } else if (ch.id === "grandma" && ch.fxTimer > 0.32) {
              ch.fxTimer = 0;
              spawnAmbientParticle("star", ch.x - 52 + (Math.random() - 0.5) * 70, ch.y - 80, {
                vx: (Math.random() - 0.5) * 90, vy: -95, g: 140, size: 10, color: "#ffe14d", life: 1.1
              });
            }
          }
        });
      }

      function renderScene(t, dt) {
        ctx.save();
        ctx.scale(view.dpr, view.dpr);

        // Apply subtle comedic screen micro-shake
        const sx = game.screenShake > 0 ? (Math.random() - 0.5) * game.screenShake : 0;
        const sy = game.screenShake > 0 ? (Math.random() - 0.5) * game.screenShake : 0;

        ctx.translate(view.offsetX + sx, view.offsetY + sy);
        ctx.scale(view.scale, view.scale);

        // 1. Pre-rendered Lush Painterly Backyard + Blanket + Basket
        ctx.drawImage(bgCanvas, -BG_PAD_X, -BG_PAD_Y);

        // 2. Dynamic Living Garden Ambience (clouds, sunbeams, swaying oak canopy, daisies)
        drawDynamicGardenAmbience(ctx, t, dt);

        // 3. Sunlit Radial Celebration Rays behind busted culprit
        if (game.phase === "celebrate" && game.culpritId) {
          const cul = CHAR_MAP[game.culpritId];
          ctx.save();
          ctx.translate(cul.x, cul.y - 10);
          ctx.rotate(t * 0.55);
          const rays = 14;
          for (let i = 0; i < rays; i++) {
            const a = (i * Math.PI * 2) / rays;
            const rg = ctx.createRadialGradient(0, 0, 15, 0, 0, 250);
            rg.addColorStop(0, "rgba(255, 245, 145, 0.45)");
            rg.addColorStop(1, "rgba(255, 245, 145, 0)");
            ctx.fillStyle = rg;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.arc(0, 0, 250, a, a + Math.PI / rays);
            ctx.closePath();
            ctx.fill();
          }
          ctx.restore();
        }

        // 4. Picnic Items resting on the blanket
        game.blanketItems.forEach(it => {
          if (it.taken) return;
          ctx.save();
          ctx.translate(it.x, it.y);
          ctx.rotate(it.rot);
          const s = easeOutBack(it.popIn) * it.scale;
          drawPicnicItem(ctx, it.itemId, s, true);
          ctx.restore();
        });

        // 5. All 6 Articulated Characters sorted back-to-front by Y
        const sortedChars = CHARACTERS.slice().sort((a, b) => a.y - b.y);
        sortedChars.forEach(ch => {
          ctx.save();
          ctx.translate(ch.x, ch.y);

          // Soft sunlit hover halo during Guess phase (no boxes!)
          if (ch.hoverAmt > 0.02 && game.phase === "guess") {
            const hg = ctx.createRadialGradient(0, 0, 20, 0, 0, Math.max(ch.hitRx, ch.hitRy) * 1.18);
            hg.addColorStop(0, `rgba(255, 244, 156, ${0.42 * ch.hoverAmt})`);
            hg.addColorStop(0.65, `rgba(255, 224, 102, ${0.22 * ch.hoverAmt})`);
            hg.addColorStop(1, "rgba(255, 224, 102, 0)");
            ctx.fillStyle = hg;
            ctx.beginPath();
            ctx.ellipse(0, 0, ch.hitRx * 1.25, ch.hitRy * 1.18, 0, 0, Math.PI * 2);
            ctx.fill();
            const popS = 1 + ch.hoverAmt * 0.045;
            ctx.scale(popS, popS);
          }

          // Reacting hop when another suspect is caught
          if (ch.state === "react") {
            const hop = Math.abs(Math.sin(ch.stateTimer * 10)) * 16;
            ctx.translate(0, -hop);
          } else if (ch.state === "react_grandma") {
            const jolt = ch.stateTimer < 0.35 ? -Math.sin((ch.stateTimer / 0.35) * Math.PI) * 28 : 0;
            ctx.translate(0, jolt);
          }

          ch.draw(ctx, ch, t);
          ctx.restore();
        });

        // 6. Mid-Air Flying Item (Comedy Twist A: Stumble & Toss!)
        if (game.flyingItem) {
          ctx.save();
          ctx.translate(game.flyingItem.x, game.flyingItem.y);
          // Sparkling golden arc aura around tossed item for crystal clarity
          const fg = ctx.createRadialGradient(0, 0, 8, 0, 0, 62);
          fg.addColorStop(0, "rgba(255, 248, 170, 0.7)");
          fg.addColorStop(1, "rgba(255, 248, 170, 0)");
          ctx.fillStyle = fg;
          ctx.beginPath(); ctx.arc(0, 0, 62, 0, Math.PI * 2); ctx.fill();
          ctx.rotate(game.flyingItem.rot);
          drawPicnicItem(ctx, game.flyingItem.itemId, 0.98, false);
          ctx.restore();
        }

        // 7. Fluttering Butterflies
        drawButterflies(ctx, t, dt);

        // 8. Active Particles (Confetti, Crumbs, Bubbles, Toot Puffs, Leaves, Stars)
        updateAndDrawParticles(ctx, dt, t);

        // 9. Suspended Carved Wooden Question Sign
        updateAndDrawSign(ctx, dt, t);

        ctx.restore();
      }

      function gameLoop(now) {
        if (!lastTime) lastTime = now;
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;
        const t = now / 1000;

        updateSimulation(dt, t);
        renderScene(t, dt);
        requestAnimationFrame(gameLoop);
      }

      // Initialize on window load
      window.addEventListener("resize", resizeCanvas);
      window.onload = function () {
        resizeCanvas();
        buildStaticBackdrop();
        updateLanguageUI();
        requestAnimationFrame(gameLoop);
      };
    })();
  </script>
