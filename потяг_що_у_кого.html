<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Express Memory</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: radial-gradient(circle at center, #2b1810 0%, #140a06 100%);
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  #stage-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game-svg {
    width: 100%;
    height: 100%;
    display: block;
    filter: drop-shadow(0 20px 50px rgba(0,0,0,0.85));
  }

  /* Living animations */
  @keyframes trainRock {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    25% { transform: translateY(-2.5px) rotate(0.18deg); }
    50% { transform: translateY(1px) rotate(0deg); }
    75% { transform: translateY(-2px) rotate(-0.18deg); }
  }
  @keyframes lampSway {
    0%, 100% { transform: rotate(-2.2deg); }
    50% { transform: rotate(2.2deg); }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1) translateY(0px); }
    50% { transform: scaleY(1.025) translateY(-3px); }
  }
  @keyframes happyBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    30% { transform: translateY(-22px) scale(1.05, 0.96); }
    55% { transform: translateY(0) scale(0.96, 1.04); }
    75% { transform: translateY(-10px) scale(1.02, 0.98); }
  }
  @keyframes wrongShake {
    0%, 100% { transform: translateX(0) rotate(0deg); }
    20% { transform: translateX(-14px) rotate(-5deg); }
    40% { transform: translateX(14px) rotate(5deg); }
    60% { transform: translateX(-10px) rotate(-3deg); }
    80% { transform: translateX(8px) rotate(2deg); }
  }
  @keyframes pulseGlow {
    0%, 100% { filter: drop-shadow(0 0 8px rgba(255, 215, 100, 0.55)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 22px rgba(255, 225, 110, 0.95)); transform: scale(1.05); }
  }
  @keyframes danceBob {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-14px) rotate(2deg); }
  }
  @keyframes steamRise {
    0% { opacity: 0.85; transform: translateY(0) scale(0.7); }
    100% { opacity: 0; transform: translateY(-35px) scale(1.5); }
  }

  .train-rocking {
    animation: trainRock 0.85s ease-in-out infinite;
    transform-origin: 800px 450px;
  }
  .lamp-sway {
    animation: lampSway 2.6s ease-in-out infinite;
  }
  .char-breathe {
    animation: breathe 2.8s ease-in-out infinite;
    transform-origin: 0px 120px;
  }
  .char-happy {
    animation: happyBounce 0.65s ease-out;
    transform-origin: 0px 120px;
  }
  .char-wrong {
    animation: wrongShake 0.48s ease-in-out;
    transform-origin: 0px 120px;
  }
  .char-dance {
    animation: danceBob 0.55s ease-in-out infinite;
    transform-origin: 0px 120px;
  }

  /* Safe inner-layer button transforms (never override outer SVG translate!) */
  .btn-hit {
    cursor: pointer;
  }
  .ui-btn-inner {
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.16s;
    transform-origin: 0px 0px;
  }
  .btn-hit:hover .ui-btn-inner {
    transform: scale(1.1);
    filter: drop-shadow(0 0 12px rgba(255, 220, 130, 0.85));
  }
  .btn-hit:active .ui-btn-inner {
    transform: scale(0.93);
  }
  .lever-pulse {
    animation: pulseGlow 1.9s ease-in-out infinite;
    transform-origin: 0px 0px;
  }
  .btn-hit:hover .lever-pulse {
    animation: none;
    transform: scale(1.07);
    filter: drop-shadow(0 0 22px rgba(255, 225, 120, 0.95));
  }
  .btn-hit:active .lever-pulse {
    animation: none;
    transform: scale(0.95);
  }

  #lever-slide {
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
  }
  #tray-slide {
    transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
  }

  .drag-item {
    cursor: grab;
    transition: filter 0.18s;
  }
  .drag-item:hover {
    filter: drop-shadow(0 8px 14px rgba(0,0,0,0.45)) brightness(1.06);
  }
  .drag-item.dragging {
    cursor: grabbing;
    filter: drop-shadow(0 22px 24px rgba(0,0,0,0.55)) brightness(1.08);
  }
  .drag-item.selected {
    filter: drop-shadow(0 0 18px #ffd54f) brightness(1.12);
  }
  .char-slot {
    cursor: pointer;
    transition: filter 0.2s;
  }
  .char-slot.drop-target {
    filter: drop-shadow(0 0 24px rgba(255, 230, 110, 0.95));
  }
  .steam-puff {
    animation: steamRise 1.8s ease-out infinite;
  }
</style>
</head>
<body>

               M1124,105 H1471 A34,34 0 0 1 1505,139 V381 A34,34 0 0 1 1471,415 H1124 A34,34 0 0 1 1090,381 V139 A34,34 0 0 1 1124,105 Z"
            fill="url(#wallGrad)" fill-rule="evenodd"/>
      <path d="M0,0 H1600 V900 H0 Z

               M626,105 H973 A34,34 0 0 1 1007,139 V381 A34,34 0 0 1 973,415 H626 A34,34 0 0 1 592,381 V139 A34,34 0 0 1 626,105 Z

    </g>
  </svg>
</div>

<script>

  let audioCtx = null;

  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") {
      audioCtx.resume();
    }
  }

  function playTone(freq, type, duration, vol = 0.15, slideTo = null, delay = 0) {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime + delay;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(now);
    osc.stop(now + duration + 0.03);
  }

  function playNoise(duration, vol = 0.08, filterFreq = 800, delay = 0) {
    if (muted) return;
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime + delay;
    const bufSize = Math.floor(audioCtx.sampleRate * duration);
    const buf = audioCtx.createBuffer(1, bufSize, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.frequency.setValueAtTime(filterFreq, now);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.001, now);
    gain.gain.linearRampToValueAtTime(vol, now + 0.06);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
    src.connect(filter);
    filter.connect(gain);
    gain.connect(audioCtx.destination);
    src.start(now);
  }

  function drawEyes(g, cx1, cx2, cy, irisColor, r = 13) {
    const eyesGroup = el("g", { class: "eyes-group" }, g);
    [cx1, cx2].forEach((cx) => {
      const eye = el("g", { class: "single-eye", "data-cx": cx, "data-cy": cy }, eyesGroup);
      const openG = el("g", { class: "eye-open" }, eye);
      el("ellipse", { cx, cy, rx: r, ry: r * 1.08, fill: "#fffdf8", stroke: "#2b1b12", "stroke-width": 2.2 }, openG);
      const pupilG = el("g", { class: "pupil-track" }, openG);
      el("circle", { cx, cy: cy + 1, r: r * 0.64, fill: irisColor }, pupilG);
      el("circle", { cx, cy: cy + 1, r: r * 0.36, fill: "#111" }, pupilG);
      el("circle", { cx: cx - r * 0.25, cy: cy - r * 0.28, r: r * 0.22, fill: "#fff" }, pupilG);
      el("circle", { cx: cx + r * 0.22, cy: cy + r * 0.25, r: r * 0.1, fill: "#fff", opacity: 0.8 }, pupilG);
      el("ellipse", { cx, cy, rx: r + 1, ry: r * 1.1, fill: "#2b1b12", opacity: 0, class: "eyelid-blink" }, eye);
      el("path", { d: `M${cx - r},${cy + 2} Q${cx},${cy - r} ${cx + r},${cy + 2}`, fill: "none", stroke: "#2b1b12", "stroke-width": 4.2, "stroke-linecap": "round", opacity: 0, class: "eye-happy" }, eye);
      const wrongG = el("g", { opacity: 0, class: "eye-wrong" }, eye);
      el("line", { x1: cx - 8, y1: cy - 8, x2: cx + 8, y2: cy + 8, stroke: "#2b1b12", "stroke-width": 4, "stroke-linecap": "round" }, wrongG);
      el("line", { x1: cx + 8, y1: cy - 8, x2: cx - 8, y2: cy + 8, stroke: "#2b1b12", "stroke-width": 4, "stroke-linecap": "round" }, wrongG);
    });
    const brows = el("g", { class: "brows-confused", opacity: 0 }, eyesGroup);
    el("path", { d: `M${cx1 - 15},${cy - 18} Q${cx1},${cy - 28} ${cx1 + 12},${cy - 22}`, fill: "none", stroke: "#2b1b12", "stroke-width": 4, "stroke-linecap": "round" }, brows);

    return eyesGroup;
  }

    document.getElementById("seat-c2").setAttribute("stop-color", theme.seat[1]);
    document.getElementById("seat-c3").setAttribute("stop-color", theme.seat[2]);

    [pClouds, pFar, pMid, pNear].forEach(g => g.innerHTML = "");

    for (let rep = 0; rep < 2; rep++) {
      const ox = rep * 1600;
      [[220,155,1],[620,140,0.8],[1020,165,1.15],[1420,145,0.9]].forEach(([x,y,s]) => {

    for (let rep = 0; rep < 2; rep++) {
      const ox = rep * 1600;
      el("path", {
        d: `M${ox},420 L${ox+180},235 L${ox+390},330 L${ox+640},205 L${ox+920},320 L${ox+1190},220 L${ox+1420},315 L${ox+1600},420 Z`,

    for (let rep = 0; rep < 2; rep++) {
      const ox = rep * 1600;

    pClouds.setAttribute("transform", `translate(${-(worldOffset * 0.12) % 1600}, 0)`);

  // ========================

  // ========================
  const particlesLayer = document.getElementById("particles-layer");

  function spawnParticles(x, y, count = 18, palette = ["#ffe047", "#ff6b8b", "#5ce1e6", "#ffffff", "#80ff72"]) {
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
      const speed = 3 + Math.random() * 8;
      let vx = Math.cos(angle) * speed;
      let vy = Math.sin(angle) * speed - 3.5;
      let px = x, py = y, life = 1;
      const color = palette[i % palette.length];
      const isStar = i % 2 === 0;
      const node = isStar
        ? el("polygon", { points: "0,-10 3,-3 10,-3 4,2 6,10 0,5 -6,10 -4,2 -10,-3 -3,-3", fill: color }, particlesLayer)
        : el("circle", { cx: 0, cy: 0, r: 4 + Math.random() * 5, fill: color }, particlesLayer);

      let rot = Math.random() * 360;
      function step() {
        px += vx;
        py += vy;
        vy += 0.28;
        rot += 8;
        life -= 0.025;
        if (life <= 0) {
          node.remove();
          return;
        }
        node.setAttribute("transform", `translate(${px},${py}) rotate(${rot}) scale(${life})`);
        node.setAttribute("opacity", life);
        requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function setCharacterMood(p, mood) {
    const b = p.bodyEl;
    b.classList.remove("char-happy", "char-wrong", "char-dance");
    const opens = b.querySelectorAll(".eye-open");
    const happys = b.querySelectorAll(".eye-happy");
    const wrongs = b.querySelectorAll(".eye-wrong");
    const brows = b.querySelector(".brows-confused");
    const mNorm = b.querySelectorAll(".mouth-normal");
    const mShock = b.querySelector(".mouth-shock");
    const sweat = b.querySelector(".sweat-drop");

    opens.forEach(e => e.setAttribute("opacity", mood === "happy" || mood === "wrong" ? 0 : 1));
    happys.forEach(e => e.setAttribute("opacity", mood === "happy" ? 1 : 0));
    wrongs.forEach(e => e.setAttribute("opacity", mood === "wrong" ? 1 : 0));
    if (brows) brows.setAttribute("opacity", mood === "confused" ? 1 : 0);
    mNorm.forEach(e => e.setAttribute("opacity", mood === "confused" || mood === "wrong" ? 0 : 1));
    if (mShock) mShock.setAttribute("opacity", mood === "confused" || mood === "wrong" ? 1 : 0);
    if (sweat) sweat.setAttribute("opacity", mood === "confused" ? 1 : 0);

    if (mood === "happy") {
      void b.offsetWidth;
      b.classList.add("char-happy");
    } else if (mood === "wrong") {
      void b.offsetWidth;
      b.classList.add("char-wrong");
    } else if (mood === "dance") {
      opens.forEach(e => e.setAttribute("opacity", 0));
      happys.forEach(e => e.setAttribute("opacity", 1));
      b.classList.add("char-dance");
    }
  }

  setInterval(() => {
    if (phase === "tunnel") return;
    passengers.forEach(p => {
      if (Math.random() < 0.35) {
        const lids = p.bodyEl.querySelectorAll(".eyelid-blink");
        const opens = p.bodyEl.querySelectorAll(".eye-open");
        if (opens[0] && opens[0].getAttribute("opacity") !== "0") {
          lids.forEach(l => l.setAttribute("opacity", 1));
          setTimeout(() => lids.forEach(l => l.setAttribute("opacity", 0)), 130);

  // Realistic eye-tracking
  function updateEyeTracking(svgX, svgY) {
    passengers.forEach(p => {
      const dx = svgX - p.x;
      const dy = svgY - (p.y - 28);
      const dist = Math.hypot(dx, dy) || 1;
      const maxShift = 4.2;
      const ox = (dx / dist) * Math.min(maxShift, dist / 40);
      const oy = (dy / dist) * Math.min(maxShift, dist / 40);
      p.bodyEl.querySelectorAll(".pupil-track").forEach(pt => {
        pt.setAttribute("transform", `translate(${ox.toFixed(1)},${oy.toFixed(1)})`);
      });
    });
  }

  function clientToSvg(clientX, clientY) {
    const pt = svg.createSVGPoint();
    pt.x = clientX;
    pt.y = clientY;
    const ctm = svg.getScreenCTM();
    return ctm ? pt.matrixTransform(ctm.inverse()) : { x: 800, y: 450 };
  }

  // ========================
  // START NEW INFINITE ROUND
  // ========================
  function startNewRound() {
    clearAllTimers();
    roundCount++;
    phase = "memorize";
    selectedItem = null;
    dragState = null;
    comboCount = 0;
    trainSpeed = 1.0;

    const theme = WORLD_THEMES[(roundCount - 1 + Math.floor(Math.random() * 2)) % WORLD_THEMES.length];
    buildParallaxScenery(theme);

    charsLayer.innerHTML = "";
    itemsLayer.innerHTML = "";
    particlesLayer.innerHTML = "";
    chaosEyesLayer.innerHTML = "";

    tunnelOverlay.setAttribute("opacity", 0);
    windowTunnelMask.setAttribute("x", 1600);
    sunbeamsLayer.setAttribute("opacity", 1);

    // Show brass lever smoothly, hide tray
    leverSlide.style.transform = "translateY(0px)";
    leverSlide.style.opacity = "1";
    leverGroup.style.pointerEvents = "auto";

    traySlide.style.transform = "translateY(240px)";
    traySlide.style.opacity = "0";

    btnNextInner.classList.remove("lever-pulse");

    const numChars = (roundCount === 1) ? 3 : (Math.random() < 0.55 ? 3 : 4);
    const chosenTypes = shuffle(CHARACTER_TYPES).slice(0, numChars);
    const chosenHats = shuffle(HATS);
    const chosenObjs = shuffle(OBJECTS);

    const xPositions = numChars === 3 ? [350, 800, 1250] : [255, 618, 982, 1345];
    const baseScale = numChars === 3 ? 1.05 : 0.94;

    let hatIdx = 0, objIdx = 0;
    passengers = chosenTypes.map((type, idx) => {
      const slotEl = el("g", {
        class: "char-slot",
        transform: `translate(${xPositions[idx]}, 545) scale(${baseScale})`
      }, charsLayer);

      const bodyEl = buildCharacterSVG(type);
      bodyEl.style.animationDelay = `${-idx * 0.7}s`;
      slotEl.appendChild(bodyEl);

      let hat = null, obj = null;
      if (roundCount === 1) {
        if (idx % 2 === 0) hat = chosenHats[hatIdx++];
        else obj = chosenObjs[objIdx++];
      } else {
        const mode = Math.random();
        if (mode < 0.38) {
          hat = chosenHats[hatIdx++];
        } else if (mode < 0.76) {
          obj = chosenObjs[objIdx++];
        } else {
          hat = chosenHats[hatIdx++];
          obj = chosenObjs[objIdx++];
        }
      }

      const p = {
        id: idx,
        type,
        x: xPositions[idx],
        y: 545,
        scale: baseScale,
        slotEl,
        bodyEl,
        hat,
        obj,
        restoredHat: false,
        restoredObj: false
      };

      if (hat) hat.draw(bodyEl.querySelector(".hat-anchor"));
      if (obj) obj.draw(bodyEl.querySelector(".obj-anchor"));

      slotEl.addEventListener("pointerdown", () => {
        if (phase === "restore" && selectedItem) {
          attemptDrop(selectedItem, p);
        }
      });

      return p;
    });

    if (passengers.reduce((s, p) => s + (p.hat ? 1 : 0) + (p.obj ? 1 : 0), 0) < 3) {
      const p0 = passengers[0];
      if (!p0.hat) {
        p0.hat = chosenHats[hatIdx++];
        p0.hat.draw(p0.bodyEl.querySelector(".hat-anchor"));
      }
    }

    startNewRound.unusedHats = chosenHats.slice(hatIdx);
    startNewRound.unusedObjs = chosenObjs.slice(objIdx);
  }

  // ========================
  // PHASE 2: TUNNEL CHAOS!
  // ========================
  function triggerTunnel() {
    if (phase !== "memorize") return;
    phase = "tunnel";
    SFX.whistle();

    leverSlide.style.transform = "translateY(150px)";
    leverSlide.style.opacity = "0";
    leverGroup.style.pointerEvents = "none";

    trainSpeed = 2.4;
    let maskX = 1600;
    function slideInMask() {
      maskX -= 75;
      if (maskX <= 0) {
        windowTunnelMask.setAttribute("x", 0);
        enterDarkness();
        return;
      }
      windowTunnelMask.setAttribute("x", maskX);
      requestAnimationFrame(slideInMask);
    }
    addTimer(() => requestAnimationFrame(slideInMask), 450);
  }

  function enterDarkness() {
    sunbeamsLayer.setAttribute("opacity", 0);
    tunnelOverlay.style.transition = "opacity 0.22s ease";
    tunnelOverlay.setAttribute("opacity", 1);
    SFX.tunnelChaos();

    chaosEyesLayer.innerHTML = "";
    const eyePairs = [];
    for (let i = 0; i < passengers.length; i++) {
      const gx = 280 + i * 320 + Math.random() * 80;
      const gy = 380 + Math.random() * 140;
      const g = el("g", { transform: `translate(${gx},${gy})` }, chaosEyesLayer);
      el("ellipse", { cx: -18, cy: 0, rx: 11, ry: 13, fill: "#fff7b8" }, g);
      el("circle", { cx: -16, cy: 0, r: 5, fill: "#111" }, g);
      el("ellipse", { cx: 18, cy: 0, rx: 11, ry: 13, fill: "#fff7b8" }, g);
      el("circle", { cx: 20, cy: 0, r: 5, fill: "#111" }, g);
      eyePairs.push(g);
    }

    const hopInterval = setInterval(() => {
      eyePairs.forEach(g => {
        const nx = 220 + Math.random() * 1160;
        const ny = 240 + Math.random() * 360;
        const rot = (Math.random() - 0.5) * 35;
        g.setAttribute("transform", `translate(${nx},${ny}) rotate(${rot})`);
      });
    }, 340);

    addTimer(() => {
      clearInterval(hopInterval);
      exitTunnelToRestore();
    }, 2150);
  }

  // ========================
  // PHASE 3: AFTERMATH & RESTORE
  // ========================
  function exitTunnelToRestore() {
    phase = "restore";
    trainSpeed = 1.0;

    const neededItems = [];
    passengers.forEach(p => {
      p.bodyEl.querySelector(".hat-anchor").innerHTML = "";
      p.bodyEl.querySelector(".obj-anchor").innerHTML = "";
      p.restoredHat = !p.hat;
      p.restoredObj = !p.obj;
      if (p.hat) neededItems.push({ prop: p.hat, ownerId: p.id, isDecoy: false });
      if (p.obj) neededItems.push({ prop: p.obj, ownerId: p.id, isDecoy: false });
      setCharacterMood(p, "confused");
    });

    const decoyCount = neededItems.length <= 4 ? 2 : 1;
    const decoys = shuffle([...(startNewRound.unusedHats || []), ...(startNewRound.unusedObjs || [])]).slice(0, decoyCount);
    decoys.forEach(prop => neededItems.push({ prop, ownerId: -1, isDecoy: true }));

    tunnelOverlay.style.transition = "opacity 0.35s ease";
    tunnelOverlay.setAttribute("opacity", 0);
    sunbeamsLayer.setAttribute("opacity", 1);

    let maskX = 0;
    function slideOutMask() {
      maskX -= 85;
      if (maskX <= -1600) {
        windowTunnelMask.setAttribute("x", 1600);
        return;
      }
      windowTunnelMask.setAttribute("x", maskX);
      requestAnimationFrame(slideOutMask);
    }
    requestAnimationFrame(slideOutMask);

    traySlide.style.transform = "translateY(0px)";
    traySlide.style.opacity = "1";

    const shuffled = shuffle(neededItems);
    const total = shuffled.length;
    const spacing = Math.min(205, 1320 / total);
    const startX = 800 - ((total - 1) * spacing) / 2;

    trayItems = shuffled.map((entry, i) => {
      const hx = startX + i * spacing;
      const hy = 790;
      const g = el("g", {
        class: "drag-item",
        transform: `translate(${hx}, ${hy}) scale(1.06)`
      }, itemsLayer);

      el("ellipse", { cx: 0, cy: 14, rx: 58, ry: 22, fill: "rgba(0,0,0,0.32)" }, g);
      const artG = el("g", { class: "item-art" }, g);
      entry.prop.draw(artG);
      el("circle", { cx: 0, cy: 0, r: 64, fill: "transparent" }, g);

      const itemObj = {
        ...entry,
        homeX: hx,
        homeY: hy,
        el: g,
        placed: false
      };

      setupItemInteraction(itemObj);
      return itemObj;
    });
  }

  // ========================
  // DRAG & DROP + CLICK-TO-PLACE
  // ========================
  function setupItemInteraction(itemObj) {
    itemObj.el.addEventListener("pointerdown", (e) => {
      if (phase !== "restore" || itemObj.placed) return;
      e.stopPropagation();
      ensureAudio();
      SFX.pickup();

      itemsLayer.appendChild(itemObj.el);

      const pt = clientToSvg(e.clientX, e.clientY);
      dragState = {
        item: itemObj,
        startX: pt.x,
        startY: pt.y,
        lastX: pt.x,
        moved: false
      };
      itemObj.el.classList.add("dragging");
    });
  }

  window.addEventListener("pointermove", (e) => {
    const pt = clientToSvg(e.clientX, e.clientY);
    if (phase === "restore" || phase === "memorize") {
      updateEyeTracking(pt.x, pt.y);
    }

    if (!dragState) return;
    const dx = pt.x - dragState.startX;
    const dy = pt.y - dragState.startY;
    if (Math.hypot(dx, dy) > 10) dragState.moved = true;

    const vx = Math.max(-22, Math.min(22, (pt.x - dragState.lastX) * 0.9));
    dragState.lastX = pt.x;

    dragState.item.el.setAttribute("transform", `translate(${pt.x}, ${pt.y}) scale(1.22) rotate(${vx})`);

    const target = findTargetPassenger(pt.x, pt.y);
    passengers.forEach(p => {
      p.slotEl.classList.toggle("drop-target", target && target.id === p.id);
    });
  });

  window.addEventListener("pointerup", (e) => {
    if (!dragState) return;
    const { item, moved } = dragState;
    dragState = null;
    item.el.classList.remove("dragging");
    passengers.forEach(p => p.slotEl.classList.remove("drop-target"));

    const pt = clientToSvg(e.clientX, e.clientY);

    if (!moved) {
      if (selectedItem === item) {
        selectedItem.el.classList.remove("selected");
        selectedItem.el.setAttribute("transform", `translate(${item.homeX}, ${item.homeY}) scale(1.06)`);
        selectedItem = null;
      } else {
        if (selectedItem) {
          selectedItem.el.classList.remove("selected");
          selectedItem.el.setAttribute("transform", `translate(${selectedItem.homeX}, ${selectedItem.homeY}) scale(1.06)`);
        }
        selectedItem = item;
        item.el.classList.add("selected");
        item.el.setAttribute("transform", `translate(${item.homeX}, ${item.homeY - 16}) scale(1.16)`);
      }
      return;
    }

    const target = findTargetPassenger(pt.x, pt.y);
    if (target) {
      attemptDrop(item, target);
    } else {
      returnItemHome(item);
    }
  });

  function findTargetPassenger(x, y) {
    if (y > 685) return null;
    let best = null, bestDist = 175;
    passengers.forEach(p => {
      const d = Math.hypot(x - p.x, y - (p.y - 10));
      if (d < bestDist) {
        bestDist = d;
        best = p;
      }
    });
    return best;
  }

  function returnItemHome(item) {
    item.el.classList.remove("selected");
    if (selectedItem === item) selectedItem = null;
    item.el.setAttribute("transform", `translate(${item.homeX}, ${item.homeY}) scale(1.06)`);
  }

  function attemptDrop(item, passenger) {
    if (selectedItem === item) {
      item.el.classList.remove("selected");
      selectedItem = null;
    }

    const isRightOwner = !item.isDecoy && item.ownerId === passenger.id;
    if (isRightOwner) {
      item.placed = true;
      item.el.remove();
      comboCount++;
      SFX.correct(comboCount);

      const anchor = item.prop.type === "hat"
        ? passenger.bodyEl.querySelector(".hat-anchor")
        : passenger.bodyEl.querySelector(".obj-anchor");
      item.prop.draw(anchor);

      if (item.prop.type === "hat") passenger.restoredHat = true;
      else passenger.restoredObj = true;

      const fxY = item.prop.type === "hat" ? passenger.y - 95 : passenger.y + 85;
      spawnParticles(passenger.x, fxY, 22);

      setCharacterMood(passenger, "happy");
      addTimer(() => {
        if (phase === "restore") {
          const allDoneForThis = passenger.restoredHat && passenger.restoredObj;
          setCharacterMood(passenger, allDoneForThis ? "normal" : "confused");
        }
      }, 950);

      checkVictory();
    } else {
      comboCount = 0;
      SFX.wrong();
      setCharacterMood(passenger, "wrong");
      spawnParticles(passenger.x, passenger.y - 40, 8, ["#ff6b6b", "#ffa94d", "#fff"]);
      returnItemHome(item);
      addTimer(() => {
        if (phase === "restore") {
          const allDoneForThis = passenger.restoredHat && passenger.restoredObj;
          setCharacterMood(passenger, allDoneForThis ? "normal" : "confused");
        }
      }, 620);
    }
  }

  function checkVictory() {
    const allRestored = passengers.every(p => p.restoredHat && p.restoredObj);
    if (!allRestored) return;

    phase = "victory";
    SFX.victory();

    trayItems.forEach(it => {
      if (!it.placed) {
        spawnParticles(it.homeX, it.homeY, 10, ["#ffe066", "#ffffff"]);
        it.el.remove();
      }
    });

    traySlide.style.transform = "translateY(240px)";
    traySlide.style.opacity = "0";

    passengers.forEach((p, idx) => {
      setCharacterMood(p, "dance");
      addTimer(() => {
        spawnParticles(p.x, p.y - 60, 26);
      }, idx * 180);
    });

    btnNextInner.classList.add("lever-pulse");
    addTimer(() => {
      if (phase === "victory") {
        btnNextInner.classList.remove("lever-pulse");
        startNewRound();
      }
    }, 3400);
  }

  // ========================
  // UI BUTTONS
  // ========================
  leverGroup.addEventListener("pointerdown", () => {
    ensureAudio();
    triggerTunnel();
  });

  document.getElementById("btn-next").addEventListener("pointerdown", () => {
    ensureAudio();
    SFX.next();
    btnNextInner.classList.remove("lever-pulse");
    startNewRound();
  });

  document.getElementById("btn-sound").addEventListener("pointerdown", () => {
    muted = !muted;
    document.getElementById("sound-on-icon").setAttribute("opacity", muted ? 0 : 1);
    document.getElementById("sound-off-icon").setAttribute("opacity", muted ? 1 : 0);
    if (!muted) {
      ensureAudio();
      SFX.pickup();
    }
  });

  startNewRound();
  requestAnimationFrame(animateWorld);
})();
</script>
