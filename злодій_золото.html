<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Полювання на скарби</title>
    
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            overflow: hidden;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: background-image 0.5s ease-in-out;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Горизонтальне розташування з великим відступом */
        #game-content-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 60px; /* Панель відсунуто далі від поля */
            padding: 20px;
            z-index: 2;
        }

        /* --- Ігрова панель керування (справа) --- */
        #ui-panel {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            width: 320px;
            border: 4px solid #ffffff;
            flex-shrink: 0; /* Панель зберігає свій розмір */
            max-height: 90vh;
            overflow-y: auto;
        }

        .role-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #ui-panel button {
            padding: 12px 15px;
            border: 3px solid transparent;
            border-radius: 12px;
            background: #8ab4f8;
            color: #1a1a2e;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            width: 100%;
        }

        #ui-panel button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
        }

        .role-active {
            background: #ffeb3b !important;
            border: 3px solid #f57f17 !important;
        }

        #turn-display {
            font-weight: bold;
            font-size: 1.4rem;
            text-transform: uppercase;
            text-align: center;
            padding: 10px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
        }

        .admin-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .admin-buttons button {
            background: #ff7043 !important;
            color: white !important;
            padding: 8px;
            font-size: 1.2rem;
            flex: 1;
        }

        /* Блок гравців та блокування */
        #players-radar {
            margin-top: 10px;
            background: rgba(0,0,0,0.05);
            padding: 10px;
            border-radius: 10px;
        }

        #players-radar h4 {
            margin-bottom: 10px;
            text-align: center;
            color: #333;
        }

        #players-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: white;
            padding: 8px 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            border: 1px solid #ddd;
        }

        .player-item button {
            background: #f44336 !important;
            color: white !important;
            padding: 4px 8px !important;
            font-size: 0.8rem !important;
            width: auto !important;
            margin: 0 !important;
        }

        /* --- Ігрове поле --- */
        #board-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 800px;
            /* Обмежуємо висоту, щоб завжди було видно */
            max-height: 85vh; 
            aspect-ratio: 1 / 1;
        }

        #board {
            position: relative;
            z-index: 2;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 2%; /* Відносні відступи, щоб сітка не розлазилась */
            width: 100%;
            height: 100%;
            background: rgba(138, 180, 248, 0.4); /* Максимально прозорий фон */
            padding: 3%;
            border-radius: 24px;
            border: 6px solid #ffffff;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .cell {
            width: 100%;
            height: 100%;
            min-width: 0; /* Важливо для запобігання вилізання */
            min-height: 0;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            border: 4px solid transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            position: relative;
        }

        .cell:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            z-index: 3;
        }

        .highlight {
            background: #e8f5e9;
            border-color: #4caf50;
            box-shadow: inset 0 0 20px rgba(76, 175, 80, 0.4);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .piece {
            font-size: 8vmin;
            max-font-size: 5.5rem;
            line-height: 1;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));
        }

        /* --- Фідбеки --- */
        #feedback-overlay {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(12px);
            border-radius: 16px;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.7);
        }

        .win-screen {
            background: rgba(255, 215, 0, 0.75);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .lose-screen {
            background: rgba(255, 0, 0, 0.75);
            animation: shakeDrop 0.6s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shakeDrop {
            0% { transform: translateY(-100%); }
            40% { transform: translateY(0); }
            60% { transform: translateX(-20px); }
            80% { transform: translateX(20px); }
            100% { transform: translateX(0); }
        }

        /* --- Theme Manager UI --- */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.9);
            border: 3px solid #333;
            border-radius: 50%;
            font-size: 30px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s;
        }
        #theme-btn:hover {
            transform: scale(1.15);
        }
        #theme-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85vw;
            max-width: 900px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 50px rgba(0,0,0,0.6);
            z-index: 1001;
            padding: 25px;
            flex-direction: column;
        }
        #theme-modal.active {
            display: flex;
        }
        #theme-modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
            font-weight: bold;
        }
        #theme-close {
            cursor: pointer;
            background: #ff4d4d;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-weight: bold;
            font-size: 1.2rem;
        }
        #theme-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 10px;
        }
        .theme-item {
            position: relative;
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            border: 4px solid transparent;
            transition: border-color 0.2s;
            background-color: #eee;
        }
        .theme-item:hover {
            border-color: #4caf50;
        }
        .theme-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .theme-title {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 16px;
            font-weight: bold;
        }

        /* --- Access Control --- */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.9);
            color: #ff4d4d;
            font-size: 6vmin;
            font-weight: bold;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 950px) {
            #game-content-wrapper {
                flex-direction: column;
                height: 100vh;
                padding-top: 10px;
                gap: 20px;
                overflow-y: auto;
            }
            #ui-panel {
                width: 90vw;
                max-width: 600px;
                flex-direction: row;
                flex-wrap: wrap;
                padding: 15px;
                flex-shrink: 0;
            }
            #board-container {
                width: 92vmin;
                max-height: 92vmin;
                flex-shrink: 0;
            }
            .role-buttons {
                flex-direction: row;
                flex: 1;
                min-width: 100%;
            }
            #players-radar {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="game-content-wrapper">
            
            <!-- Ігрове поле -->
            <div id="board-container">
                <div id="board">
                    <div id="feedback-overlay"></div>
                </div>
            </div>

            <!-- Панель керування -->
            <div id="ui-panel">
                <div class="role-buttons">
                    <button onclick="setRole('thief')" id="btn-role-thief">🦹‍♂️ Грати за Злодія</button>
                    <button onclick="setRole('guard')" id="btn-role-guard">👮‍♂️ Грати за Охорону</button>
                </div>
                
                <div id="turn-display">Хід: 🦹‍♂️ Злодія</div>
                
                <div class="admin-buttons">
                    <button onclick="removeGuard()" title="Прибрати 1 охоронця">-👮</button>
                    <button onclick="addGuard()" title="Додати 1 охоронця">+👮</button>
                    <button onclick="restartGame()" title="Почати спочатку" style="background: #4caf50 !important;">🔄 Знову</button>
                </div>

                <div id="players-radar">
                    <h4>Гравці онлайн:</h4>
                    <div id="players-list"></div>
                </div>
                
                <div style="text-align: center; color: #888; font-size: 0.85rem; margin-top: 10px; font-weight: bold;">
                    Версія гри: 2.0
                </div>
            </div>

        </div>
    </div>

    <!-- Theme Manager UI -->
    <button id="theme-btn">⚙️</button>
    <div id="theme-modal">
        <div id="theme-modal-header">
            <span>Обери фон</span>
            <button id="theme-close">✕</button>
        </div>
        <div id="theme-gallery"></div>
    </div>

    <!-- Access Control Overlay -->
    <div id="block-overlay">Зачекай! Зараз не твій урок.</div>

    <script>
        // --- FIREBASE CONFIGURATION ---
        const firebaseConfig = {
            databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
            projectId: "lesson-13c44"
        };
        
        let app, db;
        try {
            if (!firebase.apps.length) {
                app = firebase.initializeApp(firebaseConfig);
            } else {
                app = firebase.app();
            }
            db = firebase.database();
        } catch (error) {
            console.error("Firebase init error:", error);
            db = null;
        }

        // --- Ідентифікація Користувача ---
        let myName = new URLSearchParams(window.location.search).get('user') || sessionStorage.getItem('userName');
        if (!myName) {
            myName = 'Гість_' + Math.floor(Math.random() * 1000);
            sessionStorage.setItem('userName', myName);
        } else {
            sessionStorage.setItem('userName', myName);
        }

        // --- THEME MANAGER LOGIC ---
        const themeBtn = document.getElementById('theme-btn');
        const themeModal = document.getElementById('theme-modal');
        const themeClose = document.getElementById('theme-close');
        const themeGallery = document.getElementById('theme-gallery');
        const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';
        let backgroundsLoaded = false;

        const savedBg = localStorage.getItem('mySavedGameBg');
        if (savedBg) document.body.style.backgroundImage = `url('${savedBg}')`;

        themeBtn.addEventListener('click', () => {
            themeModal.classList.add('active');
            if (!backgroundsLoaded) loadBackgrounds();
        });
        themeClose.addEventListener('click', () => {
            themeModal.classList.remove('active');
        });

        async function loadBackgrounds() {
            backgroundsLoaded = true;
            for (let i = 1; i <= 100; i++) { 
                const url = `${baseUrl}background_${i}.webp`;
                checkImage(url, i);
            }
        }

        function checkImage(url, index) {
            const img = new Image();
            img.onload = () => {
                const div = document.createElement('div');
                div.className = 'theme-item';
                div.innerHTML = `
                    <img src="${url}" alt="Фон ${index}" loading="lazy">
                    <div class="theme-title">Фон ${index}</div>
                `;
                div.onclick = () => selectTheme(url);
                div.dataset.index = index;
                const items = Array.from(themeGallery.children);
                let inserted = false;
                for (let i = 0; i < items.length; i++) {
                    if (parseInt(items[i].dataset.index) > index) {
                        themeGallery.insertBefore(div, items[i]);
                        inserted = true;
                        break;
                    }
                }
                if (!inserted) themeGallery.appendChild(div);
            };
            img.src = url;
        }

        function selectTheme(url) {
            document.body.style.backgroundImage = `url('${url}')`;
            localStorage.setItem('mySavedGameBg', url);
            themeModal.classList.remove('active');
            if (db) {
                db.ref('game_theme').set({ url: url, timestamp: Date.now() });
            }
        }

        if (db) {
            db.ref('game_theme').on('value', snap => {
                const data = snap.val();
                if (data && data.url) {
                    document.body.style.backgroundImage = `url('${data.url}')`;
                    localStorage.setItem('mySavedGameBg', data.url);
                }
            });
        }

        // --- GAME LOGIC & STATE ---
        const boardSize = 5;
        let myTabId = 'tab_' + Math.random().toString(36).substr(2, 9);
        let isRemoteAction = false;
        let myRole = null; 
        let selected = null;

        function getInitialState() {
            let state = {
                thief: { r: 0, c: 2 },
                guards: [ { r: 4, c: 0 }, { r: 4, c: 4 } ],
                bags: [],
                currentTurn: 'thief',
                gameOver: false
            };
            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    if ((r + c) % 2 === 0) {
                        if ((r === state.thief.r && c === state.thief.c) || 
                            state.guards.some(g => g.r === r && g.c === c)) {
                            continue;
                        }
                        state.bags.push({ r, c });
                    }
                }
            }
            return state;
        }

        let gameState = getInitialState();

        function sanitizeState() {
            if (!gameState) gameState = getInitialState();
            if (!gameState.thief) gameState.thief = { r: 0, c: 2 };
            if (!gameState.guards) gameState.guards = [];
            if (!gameState.bags) gameState.bags = []; 
            if (!gameState.currentTurn) gameState.currentTurn = 'thief';
        }

        function restartGame() {
            gameState = getInitialState();
            pushGameState();
            
            const overlay = document.getElementById('feedback-overlay');
            overlay.style.display = 'none';
            overlay.className = '';
            selected = null;
            
            render();
        }

        function setRole(role) {
            myRole = role;
            document.getElementById('btn-role-thief').classList.toggle('role-active', role === 'thief');
            document.getElementById('btn-role-guard').classList.toggle('role-active', role === 'guard');
            selected = null;
            render();
        }

        function updateTurnUI() {
            const display = document.getElementById('turn-display');
            if (gameState.currentTurn === 'thief') {
                display.innerHTML = 'Хід: 🦹‍♂️ Злодія';
                display.style.color = '#1565C0';
                display.style.border = '2px solid #1565C0';
            } else {
                display.innerHTML = 'Хід: 👮‍♂️ Охорони';
                display.style.color = '#C62828';
                display.style.border = '2px solid #C62828';
            }
        }

        function removeGuard() {
            sanitizeState();
            if (gameState.guards.length > 0) {
                gameState.guards.pop();
                pushGameState();
                render();
            }
        }

        function addGuard() {
            sanitizeState();
            for (let r = boardSize - 1; r >= 0; r--) {
                for (let c = boardSize - 1; c >= 0; c--) {
                    if (gameState.thief.r === r && gameState.thief.c === c) continue;
                    if (gameState.guards.some(g => g.r === r && g.c === c)) continue;
                    // Охоронець не може з'явитися на останньому мішку
                    if (gameState.bags.length === 1 && gameState.bags[0].r === r && gameState.bags[0].c === c) continue;
                    
                    gameState.guards.push({ r, c });
                    const bagIdx = gameState.bags.findIndex(b => b.r === r && b.c === c);
                    if (bagIdx !== -1) gameState.bags.splice(bagIdx, 1);
                    
                    pushGameState();
                    render();
                    return;
                }
            }
        }

        function render() {
            sanitizeState();
            const board = document.getElementById('board');
            
            const overlay = document.getElementById('feedback-overlay');
            board.innerHTML = '';
            board.appendChild(overlay);

            for (let r = 0; r < boardSize; r++) {
                for (let c = 0; c < boardSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.onclick = () => handleCellClick(r, c);

                    if (selected && myRole === gameState.currentTurn && isValidMove(selected, r, c)) {
                        cell.classList.add('highlight');
                    }

                    let hasThief = (gameState.thief.r === r && gameState.thief.c === c);
                    let hasGuard = gameState.guards.findIndex(g => g.r === r && g.c === c);
                    let hasBag = gameState.bags.some(b => b.r === r && b.c === c);

                    if (hasThief && hasGuard !== -1) {
                        cell.innerHTML = '<div class="piece" style="font-size: 5vmin;">💥</div>';
                    } else if (hasThief) {
                        cell.innerHTML = '<div class="piece">🦹‍♂️</div>';
                        if (selected && selected.type === 'thief') cell.style.borderColor = '#2196F3';
                    } else if (hasGuard !== -1) {
                        cell.innerHTML = '<div class="piece">👮‍♂️</div>';
                        if (selected && selected.type === 'guard' && selected.idx === hasGuard) {
                            cell.style.borderColor = '#F44336';
                        }
                    } else if (hasBag) {
                        cell.innerHTML = '<div class="piece">💰</div>';
                    }

                    board.appendChild(cell);
                }
            }
            updateTurnUI();
            checkGameState(); 
        }

        function pushGameState() {
            if (isRemoteAction || !db) return;
            sanitizeState();
            db.ref('game_action').set({
                senderId: myTabId,
                timestamp: Date.now(),
                type: 'state_update',
                data: gameState
            });
        }

        function handleCellClick(r, c) {
            sanitizeState();
            if (gameState.gameOver) return;
            if (!myRole || myRole !== gameState.currentTurn) return;

            if (selected && isValidMove(selected, r, c)) {
                executeMove(selected, r, c);
                return;
            }

            if (gameState.currentTurn === 'thief' && gameState.thief.r === r && gameState.thief.c === c) {
                selected = { type: 'thief' };
                render();
                return;
            }

            if (gameState.currentTurn === 'guard') {
                const guardIdx = gameState.guards.findIndex(g => g.r === r && g.c === c);
                if (guardIdx !== -1) {
                    selected = { type: 'guard', idx: guardIdx };
                    render();
                    return;
                }
            }
            
            selected = null;
            render();
        }

        function executeMove(piece, r, c) {
            if (piece.type === 'thief') {
                const stepR = r > gameState.thief.r ? 1 : (r < gameState.thief.r ? -1 : 0);
                const stepC = c > gameState.thief.c ? 1 : (c < gameState.thief.c ? -1 : 0);
                let currR = gameState.thief.r;
                let currC = gameState.thief.c;
                let eaten = false;
                
                while (currR !== r || currC !== c) {
                    if (stepR !== 0) currR += stepR;
                    if (stepC !== 0) currC += stepC;
                    const bagIdx = gameState.bags.findIndex(b => b.r === currR && b.c === currC);
                    // З'їдаємо лише один мішок, навіть якщо їх кілька
                    if (bagIdx !== -1 && !eaten) {
                        gameState.bags.splice(bagIdx, 1);
                        eaten = true;
                    }
                }
                gameState.thief = { r, c };
                
            } else if (piece.type === 'guard') {
                gameState.guards[piece.idx] = { r, c };
            }

            selected = null;
            gameState.currentTurn = gameState.currentTurn === 'thief' ? 'guard' : 'thief';
            
            checkGameState();
            pushGameState(); 
            render();
        }

        function isValidMove(piece, r, c) {
            if (piece.type === 'thief') {
                // Дозволяємо рух ТІЛЬКИ по діагоналі
                const dr = Math.abs(gameState.thief.r - r);
                const dc = Math.abs(gameState.thief.c - c);
                if (dr !== dc || dr === 0) return false;

                const stepR = r > gameState.thief.r ? 1 : (r < gameState.thief.r ? -1 : 0);
                const stepC = c > gameState.thief.c ? 1 : (c < gameState.thief.c ? -1 : 0);
                let currR = gameState.thief.r + stepR;
                let currC = gameState.thief.c + stepC;
                let bagsInPath = 0;
                
                while (currR !== r || currC !== c) {
                    if (gameState.guards.some(otherG => otherG.r === currR && otherG.c === currC)) {
                        return false; 
                    }
                    if (gameState.bags.some(b => b.r === currR && b.c === currC)) {
                        bagsInPath++;
                    }
                    currR += stepR;
                    currC += stepC;
                }
                if (gameState.guards.some(g => g.r === r && g.c === c)) return false;
                if (gameState.bags.some(b => b.r === r && b.c === c)) {
                    bagsInPath++;
                }

                // Заборона робити хід, якщо на шляху більше ніж 1 мішок
                if (bagsInPath > 1) return false;

                return true;

            } else if (piece.type === 'guard') {
                const g = gameState.guards[piece.idx];
                if (g.r !== r && g.c !== c) return false;
                if (g.r === r && g.c === c) return false;
                
                // Заборона ставати на останній мішок
                if (gameState.bags.length === 1 && gameState.bags[0].r === r && gameState.bags[0].c === c) {
                    return false;
                }
                
                const stepR = r > g.r ? 1 : (r < g.r ? -1 : 0);
                const stepC = c > g.c ? 1 : (c < g.c ? -1 : 0);
                let currR = g.r + stepR;
                let currC = g.c + stepC;
                
                while (currR !== r || currC !== c) {
                    if (gameState.guards.some(otherG => otherG !== g && otherG.r === currR && otherG.c === currC)) {
                        return false;
                    }
                    currR += stepR;
                    currC += stepC;
                }
                return true;
            }
            return false;
        }

        function checkGameState() {
            const overlay = document.getElementById('feedback-overlay');
            
            if (gameState.guards.some(g => g.r === gameState.thief.r && g.c === gameState.thief.c)) {
                gameState.gameOver = true;
                overlay.innerHTML = '<div style="font-size: 5rem; margin-bottom: 15px;">🚨🚔🚨</div><h1 style="font-size: 2.5rem; margin-bottom: 10px;">ОХОРОНА ПЕРЕМОГЛА!</h1><p style="font-size: 1.2rem;">Злодія спіймано!</p>';
                overlay.className = 'lose-screen';
                overlay.style.display = 'flex';
                return;
            }

            if (gameState.bags.length === 0) {
                gameState.gameOver = true;
                overlay.innerHTML = '<div style="font-size: 5rem; margin-bottom: 15px;">👑🏆👑</div><h1 style="font-size: 2.5rem; margin-bottom: 10px;">ЗЛОДІЙ ПЕРЕМІГ!</h1><p style="font-size: 1.2rem;">Всі скарби зібрано!</p>';
                overlay.className = 'win-screen';
                overlay.style.display = 'flex';
                return;
            }
            
            if (!gameState.gameOver) {
                overlay.style.display = 'none';
            }
        }

        // --- FIREBASE SYNC, RESET & РАДАР ГРАВЦІВ ---
        if (db) {
            // Перевірка: якщо остання дія була більше ніж годину тому, затерти стару гру
            db.ref('game_action').once('value').then(snap => {
                const action = snap.val();
                if (!action || (Date.now() - action.timestamp > 1000 * 60 * 60)) {
                    restartGame();
                }
            });

            db.ref('game_action').on('value', snap => {
                const action = snap.val();
                if (!action || action.senderId === myTabId) return;
                
                if (action.type === 'state_update') {
                    isRemoteAction = true;
                    gameState = action.data;
                    sanitizeState(); 
                    
                    selected = null; 
                    render();
                    isRemoteAction = false;
                }
            });

            const playersList = document.getElementById('players-list');
            
            db.ref('online_users').on('value', snap => {
                const users = snap.val() || {};
                playersList.innerHTML = '';
                
                let count = 0;
                for (const user in users) {
                    count++;
                    const userDiv = document.createElement('div');
                    userDiv.className = 'player-item';
                    
                    let nameSpan = document.createElement('span');
                    nameSpan.innerText = user + (user === myName ? " (Ви)" : "");
                    userDiv.appendChild(nameSpan);

                    if (user !== myName) {
                        const blockBtn = document.createElement('button');
                        blockBtn.innerText = '❌ Приховати';
                        blockBtn.title = 'Заблокувати цього гравця';
                        blockBtn.onclick = () => {
                            db.ref(`blocked_users/${user}`).set(true);
                        };
                        userDiv.appendChild(blockBtn);
                    }
                    playersList.appendChild(userDiv);
                }
                if (count === 0) playersList.innerHTML = '<div style="text-align:center; color:#666;">Нікого немає</div>';
            });
        }

        render();

        // --- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ ---
        (function() {
            if (!db) return; 

            const blockOverlay = document.getElementById('block-overlay');
            const connectedRef = db.ref('.info/connected');
            const userRef = db.ref(`online_users/${myName}/${myTabId}`);
            
            let immunity = true;
            setTimeout(() => { immunity = false; }, 1500);

            connectedRef.on('value', (snap) => {
                if (snap.val() === true) {
                    userRef.set(true);
                    userRef.onDisconnect().remove();
                }
            });

            window.addEventListener('beforeunload', () => {
                userRef.remove();
            });

            db.ref(`blocked_users/${myName}`).on('value', (snap) => {
                if (snap.val() === true) {
                    blockOverlay.style.display = 'flex';
                } else {
                    blockOverlay.style.display = 'none';
                }
            });

            db.ref('force_refresh').on('value', (snap) => {
                const val = snap.val();
                if (val && val.timestamp && Date.now() - val.timestamp < 5000) {
                    window.location.reload();
                }
            });

            db.ref('current_activity').on('value', (snap) => {
                if (immunity) return;
                const activity = snap.val();
                if (activity === 'lobby') {
                    window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
                }
            });
        })();
    </script>
