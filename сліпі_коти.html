<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game</title>
    <!-- Firebase SDK (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        /* Базові налаштування, жодних білих фонів */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a2a3a;
            /* Динамічний фон перекриє це, але залишаємо базовий для старту */
            background-image: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        /* Головний контейнер: максимально прозорий */
        #game-layout {
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 30px;
            background: rgba(15, 25, 35, 0.3); /* Максимально прозорий */
            padding: 20px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5), inset 0 0 0 3px rgba(76, 175, 80, 0.5);
            backdrop-filter: blur(5px);
            max-width: 100vw;
            max-height: 100vh;
        }

        /* Ігрове поле */
        #board-container {
            position: relative;
            width: 450px;
            height: 450px;
            max-width: 90vw;
            max-height: 90vw;
            background-color: rgba(93, 64, 55, 0.8);
            border: 6px solid #3E2723;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.6), inset 0 0 40px rgba(0,0,0,0.8);
            overflow: hidden;
        }

        /* Складний візерунок дошки */
        .board-bg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(45deg, rgba(78,52,46,0.9) 25%, transparent 25%, transparent 75%, rgba(78,52,46,0.9) 75%, rgba(78,52,46,0.9)),
                linear-gradient(45deg, rgba(78,52,46,0.9) 25%, transparent 25%, transparent 75%, rgba(78,52,46,0.9) 75%, rgba(78,52,46,0.9));
            background-size: 20% 20%;
            background-position: 0 0, 10% 10%;
            z-index: 1;
        }

        .grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            z-index: 10;
        }

        .cell {
            width: 100%;
            height: 100%;
            border: 2px solid rgba(0, 0, 0, 0.3);
            position: relative;
            cursor: pointer;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            transition: background 0.3s, box-shadow 0.3s;
        }

        /* Туман війни */
        .fog-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000000;
            opacity: 1;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 30;
        }

        /* Підсвітка клітинок ходу */
        .highlight-mouse {
            background: rgba(139, 195, 74, 0.4);
            box-shadow: inset 0 0 20px rgba(139, 195, 74, 0.8);
        }

        .highlight-cat {
            background: rgba(244, 67, 54, 0.4);
            box-shadow: inset 0 0 20px rgba(244, 67, 54, 0.8);
            z-index: 35; 
        }

        /* Сутності на полі - відцентровані та масштабовані */
        .entity {
            position: absolute;
            width: 20%; 
            height: 20%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
            pointer-events: none;
        }

        .cheese { z-index: 15; }
        .mouse { z-index: 20; }
        .cat { z-index: 40; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.8)); } 

        .win-pulse {
            animation: pulseWin 0.6s alternate infinite;
        }
        @keyframes pulseWin {
            0% { transform: scale(1); filter: drop-shadow(0 0 15px #FFEB3B); }
            100% { transform: scale(1.2); filter: drop-shadow(0 0 35px #FFEB3B); }
        }

        .lose-shake {
            animation: shakeLose 0.3s ease-in-out infinite;
        }

        /* Бічна панель з кнопками справа */
        #sidebar-right {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0,0,0,0.4);
            padding: 15px;
            border-radius: 20px;
            border: 2px solid rgba(96, 125, 139, 0.5);
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }

        .role-selector {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .role-btn {
            padding: 10px;
            border-radius: 10px;
            border: 2px solid transparent;
            background: #2c3e50;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .role-btn.active-role {
            border-color: #4CAF50;
            background: #4CAF50;
        }

        .icon-btn {
            background: linear-gradient(145deg, #2c3e50, #34495e);
            border: 2px solid #5D6D7E;
            border-radius: 15px;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            box-shadow: 0 4px 0 #1A252F, 0 6px 10px rgba(0,0,0,0.5);
            position: relative;
            color: white;
        }

        .icon-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #1A252F, 0 2px 3px rgba(0,0,0,0.5);
        }

        .icon-btn:hover {
            filter: brightness(1.2);
            border-color: #4CAF50;
        }

        .icon-btn svg {
            width: 60%;
            height: 60%;
            pointer-events: none;
        }

        #turn-indicator {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: radial-gradient(circle, #34495e, #1a252f);
            border: 4px solid #8BC34A;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px rgba(139, 195, 74, 0.6);
            transition: all 0.4s ease;
        }
        
        #turn-indicator.cat-turn-active {
            border-color: #F44336;
            box-shadow: 0 0 20px rgba(244, 67, 54, 0.6);
        }

        /* Адаптивність (Mobile Friendly) */
        @media (max-width: 768px) {
            #game-layout {
                flex-direction: column;
                padding: 10px;
            }
            #sidebar-right {
                flex-direction: row;
                flex-wrap: wrap;
                padding: 10px;
            }
            .role-selector {
                flex-direction: row;
            }
        }

        /* Theme Manager UI */
        #theme-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0,0,0,0.7);
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 1000;
            color: white;
            transition: transform 0.2s;
        }
        #theme-btn:hover { transform: scale(1.1); }
        
        #theme-modal, #players-modal {
            display: none;
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(20, 30, 40, 0.95);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #4CAF50;
            z-index: 1001;
            width: 90vw;
            max-width: 600px;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            color: white;
        }
        
        #theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 15px;
        }
        
        .theme-item {
            position: relative;
            cursor: pointer;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid transparent;
            aspect-ratio: 16/9;
            background-color: #333;
        }
        
        .theme-item:hover { border-color: #4CAF50; }
        .theme-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .theme-item span {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: #fff;
            text-align: center;
            font-size: 12px;
            padding: 4px;
        }
        .close-modal {
            position: absolute;
            top: 10px;
            right: 15px;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }

        #players-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }

        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 10px;
            border-radius: 8px;
        }

        .btn-kick {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        #btn-clear-phantoms {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #C62828;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-family: Arial, sans-serif;
        }

        /* Універсальний екран-заглушка */
        #block-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            color: red;
            font-size: 3vw;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-layout">
    <!-- Ігрове поле по центру -->
    <div id="board-container">
        <div class="board-bg"></div>
        <div class="grid" id="grid"></div>
        <div id="entities"></div>
    </div>

    <!-- Панель керування справа -->
    <div id="sidebar-right">
        <!-- Вибір ролі -->
        <div class="role-selector">
            <button class="role-btn active-role" id="role-mouse">Я Миша</button>
            <button class="role-btn" id="role-cat">Я Кіт</button>
        </div>

        <!-- Індикатор ходу -->
        <div id="turn-indicator"></div>

        <!-- Кнопка гравців -->
        <button class="icon-btn" id="btn-players" title="Підключені гравці">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="35" r="20" fill="#FFF"/>
                <path d="M20 90 Q50 60 80 90" fill="none" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Кнопка додавання кота -->
        <button class="icon-btn" id="btn-add-cat" title="Додати кота">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#E65100"/>
                <path d="M25 50h50M50 25v50" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>
                <polygon points="25,15 40,25 30,40" fill="#E65100"/>
                <polygon points="75,15 60,25 70,40" fill="#E65100"/>
            </svg>
        </button>

        <!-- Кнопка видалення гравця (кота на полі) -->
        <button class="icon-btn" id="btn-remove-player" title="Прибрати кота з поля">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#C62828"/>
                <path d="M25 50h50" stroke="#FFF" stroke-width="12" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Кнопка Почати заново (Restart) -->
        <button class="icon-btn" id="btn-restart" title="Почати заново">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="none" stroke="#B0BEC5" stroke-width="8"/>
                <path d="M50 20 A30 30 0 1 1 20 50" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round"/>
                <polygon points="10,50 30,50 20,70" fill="#FFF"/>
            </svg>
        </button>
    </div>
</div>

<!-- Модальне вікно списку гравців -->
<div id="players-modal">
    <div class="close-modal" id="close-players">&times;</div>
    <h2 style="text-align:center; margin-bottom:10px;">Онлайн гравці</h2>
    <div id="players-list-container"></div>
    <button id="btn-clear-phantoms">Очистити всіх фантомів (Скинути онлайн)</button>
</div>

<!-- Theme Manager UI -->
<div id="theme-btn">⚙️</div>
<div id="theme-modal">
    <div class="close-modal" id="close-theme">&times;</div>
    <div id="theme-grid"></div>
</div>

<script>
    // --- FIREBASE ІНІЦІАЛІЗАЦІЯ ---
    const firebaseConfig = {
        databaseURL: "https://lesson-13c44-default-rtdb.firebaseio.com/",
        projectId: "lesson-13c44"
    };
    
    let isFirebaseActive = false;
    let db = null;
    
    try {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        isFirebaseActive = true;
    } catch(e) {
        console.log("Firebase offline mode");
    }

    // --- УНІВЕРСАЛЬНИЙ БЛОК КОНТРОЛЮ (Логіка) ---
    const urlParams = new URLSearchParams(window.location.search);
    let myName = urlParams.get('user') || sessionStorage.getItem('myName');
    if (!myName) {
        myName = 'Гість_' + Math.floor(Math.random() * 1000);
    }
    sessionStorage.setItem('myName', myName);
    const mySenderId = Math.random().toString(36).substr(2, 9);
    let isRemoteAction = false;

    if (isFirebaseActive) {
        // Радар
        const tabId = Math.random().toString(36).substr(2, 9);
        const presenceRef = db.ref(`online_users/${myName}/${tabId}`);
        
        db.ref('.info/connected').on('value', snap => {
            if (snap.val()) {
                presenceRef.set(true);
                presenceRef.onDisconnect().remove();
            }
        });
        window.addEventListener('beforeunload', () => presenceRef.remove());

        // Refresh
        db.ref('force_refresh').on('value', snap => {
            if (snap.val() && snap.val().timestamp > Date.now() - 10000) window.location.reload();
        });

        // Блокування
        db.ref(`blocked_users/${myName}`).on('value', snap => {
            const overlay = document.getElementById('block-overlay');
            if (snap.val()) overlay.style.display = 'flex';
            else overlay.style.display = 'none';
        });

        // Повернення в лобі (Імунітет 1 сек)
        let initTime = Date.now();
        db.ref('current_activity').on('value', snap => {
            if (Date.now() - initTime < 1000) return; 
            if (snap.val() === 'lobby') {
                window.location.href = 'https://olgazheltvai2.github.io/rizne/lobby.html?user=' + encodeURIComponent(myName);
            }
        });

        // Модальне вікно керування гравцями
        const playersBtn = document.getElementById('btn-players');
        const playersModal = document.getElementById('players-modal');
        const closePlayers = document.getElementById('close-players');
        const playersListContainer = document.getElementById('players-list-container');
        const btnClearPhantoms = document.getElementById('btn-clear-phantoms');

        playersBtn.onclick = () => playersModal.style.display = 'block';
        closePlayers.onclick = () => playersModal.style.display = 'none';

        db.ref('online_users').on('value', snap => {
            playersListContainer.innerHTML = '';
            const users = snap.val() || {};
            for (let userName in users) {
                const div = document.createElement('div');
                div.className = 'player-item';
                
                const nameSpan = document.createElement('span');
                nameSpan.textContent = userName + (userName === myName ? " (Ви)" : "");
                
                const kickBtn = document.createElement('button');
                kickBtn.className = 'btn-kick';
                kickBtn.textContent = 'Видалити';
                kickBtn.onclick = () => {
                    db.ref(`online_users/${userName}`).remove();
                };
                
                div.appendChild(nameSpan);
                div.appendChild(kickBtn);
                playersListContainer.appendChild(div);
            }
        });

        // НОВИЙ АЛГОРИТМ ПІНГУ ДЛЯ ОЧИЩЕННЯ ФАНТОМІВ
        // Кожен підключений клієнт слухає гілку trigger_ping
        db.ref('trigger_ping').on('value', snap => {
            if (snap.val()) {
                // Відновлюємо свою присутність, якщо нас випадково видалили
                presenceRef.set(true);
            }
        });

        btnClearPhantoms.onclick = () => {
            // Видаляємо всіх без виключення (фантомів і реальних),
            // і одразу відправляємо сигнал перереєстрації
            db.ref('online_users').remove().then(() => {
                db.ref('trigger_ping').set(Date.now());
            });
        };
    }

    // --- СИСТЕМА ДИНАМІЧНИХ ФОНІВ (Theme Manager) ---
    const themeBtn = document.getElementById('theme-btn');
    const themeModal = document.getElementById('theme-modal');
    const closeTheme = document.getElementById('close-theme');
    const themeGrid = document.getElementById('theme-grid');
    const baseUrl = 'https://olgazheltvai2.github.io/images/backgrounds/';

    function setBackground(url) {
        document.body.style.backgroundImage = `url('${url}')`;
        localStorage.setItem('mySavedGameBg', url);
    }

    // Відновлення фону
    const savedBg = localStorage.getItem('mySavedGameBg');
    if (savedBg) setBackground(savedBg);

    if (isFirebaseActive) {
        db.ref('game_theme').on('value', snap => {
            if (snap.val() && snap.val() !== localStorage.getItem('mySavedGameBg')) {
                setBackground(snap.val());
            }
        });
    }

    themeBtn.onclick = () => {
        themeModal.style.display = 'block';
        if (themeGrid.children.length === 0) loadThemes();
    };
    closeTheme.onclick = () => themeModal.style.display = 'none';

    function loadThemes() {
        let maxThemesToScan = 1000;
        let batchSize = 20;
        let currentIdx = 1;

        function loadBatch() {
            for (let i = 0; i < batchSize; i++) {
                if (currentIdx > maxThemesToScan) return;
                const bgNum = currentIdx++;
                const imgUrl = `${baseUrl}background_${bgNum}.webp`;
                
                const img = new Image();
                img.onload = () => {
                    const div = document.createElement('div');
                    div.className = 'theme-item';
                    div.innerHTML = `<img src="${imgUrl}"><span>Фон ${bgNum}</span>`;
                    div.onclick = () => {
                        setBackground(imgUrl);
                        if (isFirebaseActive) db.ref('game_theme').set(imgUrl);
                        themeModal.style.display = 'none';
                    };
                    // Вставляємо по порядку
                    div.dataset.id = bgNum;
                    let inserted = false;
                    for (let child of themeGrid.children) {
                        if (parseInt(child.dataset.id) > bgNum) {
                            themeGrid.insertBefore(div, child);
                            inserted = true;
                            break;
                        }
                    }
                    if (!inserted) themeGrid.appendChild(div);
                };
                img.src = imgUrl;
            }
            if (currentIdx <= maxThemesToScan) setTimeout(loadBatch, 100);
        }
        loadBatch();
    }

    // --- Аудіо синтезатор ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type, duration, vol=0.1, slideFreq=null) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        if (slideFreq) {
            osc.frequency.exponentialRampToValueAtTime(slideFreq, audioCtx.currentTime + duration);
        }
        
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    const Sounds = {
        mouseMove: () => playTone(700, 'sine', 0.1, 0.15, 800),
        catMove: () => playTone(150, 'square', 0.15, 0.2, 100),
        cheese: () => {
            playTone(1200, 'triangle', 0.1, 0.1, 1600);
            setTimeout(() => playTone(1600, 'triangle', 0.1, 0.1, 2000), 100);
        },
        win: () => {
            playTone(400, 'sine', 0.1, 0.3, 600);
            setTimeout(() => playTone(600, 'sine', 0.2, 0.3, 900), 100);
            setTimeout(() => playTone(900, 'sine', 0.4, 0.3, 1200), 300);
        },
        lose: () => {
            playTone(300, 'sawtooth', 0.2, 0.3, 150);
            setTimeout(() => playTone(150, 'sawtooth', 0.4, 0.3, 50), 200);
        },
        click: () => playTone(900, 'sine', 0.05, 0.1),
        add: () => playTone(500, 'triangle', 0.1, 0.2, 800)
    };

    // --- SVG Графіка ---
    const SVG_MOUSE = `
        <svg viewBox="0 0 100 100" width="85%" height="85%">
            <defs>
                <radialGradient id="mouseFur" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#E0E0E0"/>
                    <stop offset="100%" stop-color="#9E9E9E"/>
                </radialGradient>
            </defs>
            <path d="M50 75 Q20 100 15 80 T10 95" fill="none" stroke="#F48FB1" stroke-width="5" stroke-linecap="round"/>
            <circle cx="30" cy="30" r="18" fill="#9E9E9E"/>
            <circle cx="30" cy="30" r="10" fill="#F48FB1"/>
            <circle cx="70" cy="30" r="18" fill="#9E9E9E"/>
            <circle cx="70" cy="30" r="10" fill="#F48FB1"/>
            <ellipse cx="50" cy="55" rx="30" ry="40" fill="url(#mouseFur)"/>
            <circle cx="40" cy="45" r="5" fill="#000"/>
            <circle cx="60" cy="45" r="5" fill="#000"/>
            <circle cx="42" cy="43" r="2" fill="#FFF"/>
            <circle cx="62" cy="43" r="2" fill="#FFF"/>
            <circle cx="50" cy="55" r="4" fill="#F48FB1"/>
            <path d="M42 55 L20 50 M42 58 L20 60 M58 55 L80 50 M58 58 L80 60" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        </svg>
    `;

    const SVG_CAT = `
        <svg viewBox="0 0 100 100" width="95%" height="95%">
            <defs>
                <radialGradient id="catFur" cx="50%" cy="50%" r="50%">
                    <stop offset="0%" stop-color="#FF9800"/>
                    <stop offset="100%" stop-color="#E65100"/>
                </radialGradient>
            </defs>
            <path d="M50 75 Q80 100 90 75 T95 90" fill="none" stroke="#E65100" stroke-width="10" stroke-linecap="round"/>
            <circle cx="25" cy="75" r="10" fill="#FFB74D"/>
            <circle cx="75" cy="75" r="10" fill="#FFB74D"/>
            <ellipse cx="50" cy="65" rx="40" ry="35" fill="url(#catFur)"/>
            <path d="M20 65 Q50 40 80 65" fill="none" stroke="#BF360C" stroke-width="5" stroke-linecap="round"/>
            <path d="M25 75 Q50 55 75 75" fill="none" stroke="#BF360C" stroke-width="5" stroke-linecap="round"/>
            <circle cx="50" cy="40" r="32" fill="url(#catFur)"/>
            <polygon points="22,30 15,0 42,20" fill="#E65100"/>
            <polygon points="25,25 20,5 38,20" fill="#FFCC80"/>
            <polygon points="78,30 85,0 58,20" fill="#E65100"/>
            <polygon points="75,25 80,5 62,20" fill="#FFCC80"/>
            <ellipse cx="35" cy="35" rx="7" ry="10" fill="#FFF59D"/>
            <ellipse cx="65" cy="35" rx="7" ry="10" fill="#FFF59D"/>
            <ellipse cx="35" cy="35" rx="2" ry="7" fill="#000"/>
            <ellipse cx="65" cy="35" rx="2" ry="7" fill="#000"/>
            <polygon points="46,45 54,45 50,52" fill="#D32F2F"/>
            <path d="M30 48 L10 40 M30 52 L10 55 M70 48 L90 40 M70 52 L90 55" stroke="#333" stroke-width="2" stroke-linecap="round"/>
        </svg>
    `;

    const SVG_CHEESE = `
        <svg viewBox="0 0 100 100" width="70%" height="70%">
            <defs>
                <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFEE58"/>
                    <stop offset="100%" stop-color="#FBC02D"/>
                </linearGradient>
            </defs>
            <path d="M15 75 L50 15 L85 75 Z" fill="url(#cheeseGrad)" stroke="#F57F17" stroke-width="4" stroke-linejoin="round"/>
            <path d="M15 75 L50 95 L85 75" fill="#F9A825" stroke="#F57F17" stroke-width="4" stroke-linejoin="round"/>
            <circle cx="45" cy="50" r="7" fill="#F57F17" opacity="0.8"/>
            <circle cx="65" cy="65" r="8" fill="#F57F17" opacity="0.8"/>
            <circle cx="40" cy="75" r="5" fill="#F57F17" opacity="0.8"/>
            <circle cx="55" cy="35" r="4" fill="#F57F17" opacity="0.8"/>
        </svg>
    `;

    // --- Логіка Гри ---
    const SIZE = 5;
    let numCatsConfig = 2;
    let myRole = 'mouse'; // 'mouse' або 'cat'
    let state = {
        turn: 'mouse', // 'mouse' або 'cat'
        mouse: {x: 0, y: 0, el: null},
        cats: [],
        cheeses: [],
        gameOver: false
    };

    const gridEl = document.getElementById('grid');
    const entitiesEl = document.getElementById('entities');
    const turnIndicator = document.getElementById('turn-indicator');
    const cells = [];

    // --- Вибір ролі ---
    document.getElementById('role-mouse').onclick = () => {
        myRole = 'mouse';
        document.getElementById('role-mouse').classList.add('active-role');
        document.getElementById('role-cat').classList.remove('active-role');
        updateUI(); // Негайне оновлення видимості при зміні ролі
    };
    document.getElementById('role-cat').onclick = () => {
        myRole = 'cat';
        document.getElementById('role-cat').classList.add('active-role');
        document.getElementById('role-mouse').classList.remove('active-role');
        updateUI(); // Негайне оновлення видимості при зміні ролі
    };

    // --- Мережева синхронізація дій ---
    function sendAction(type, data) {
        if (!isFirebaseActive) return;
        db.ref('game_action').set({
            senderId: mySenderId,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            type: type,
            data: data
        });
    }

    if (isFirebaseActive) {
        db.ref('game_action').on('value', snap => {
            const val = snap.val();
            if (!val || val.senderId === mySenderId) return;
            
            isRemoteAction = true;
            if (val.type === 'INIT') {
                numCatsConfig = val.data.numCats;
                applyState(val.data.seedState);
            } else if (val.type === 'ACTION') {
                handleCellClickLogic(val.data.x, val.data.y, true);
            } else if (val.type === 'ADD_CAT') {
                numCatsConfig = val.data.numCats;
                applyState(val.data.seedState);
            } else if (val.type === 'REMOVE_CAT') {
                removeRandomCatLogic();
            }
            isRemoteAction = false;
        });
    }

    function buildGrid() {
        gridEl.innerHTML = '';
        cells.length = 0;
        for (let y = 0; y < SIZE; y++) {
            cells[y] = [];
            for (let x = 0; x < SIZE; x++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                
                const fog = document.createElement('div');
                fog.className = 'fog-overlay';
                cell.appendChild(fog);

                cell.addEventListener('click', () => {
                    if (isRemoteAction) return;
                    handleCellClickLogic(x, y, false);
                });
                gridEl.appendChild(cell);
                cells[y][x] = { el: cell, fog: fog };
            }
        }
    }

    function getEmptyPos(tempState) {
        let x, y, occupied;
        do {
            x = Math.floor(Math.random() * SIZE);
            y = Math.floor(Math.random() * SIZE);
            occupied = false;
            if (tempState.mouse && tempState.mouse.x === x && tempState.mouse.y === y) occupied = true;
            if (tempState.cats.some(c => c.x === x && c.y === y)) occupied = true;
            if (tempState.cheeses.some(c => c.x === x && c.y === y)) occupied = true;
        } while (occupied);
        return {x, y};
    }

    function createEntity(type, x, y, svg) {
        const el = document.createElement('div');
        el.className = `entity ${type}`;
        el.innerHTML = svg;
        updateEntityPos(el, x, y);
        entitiesEl.appendChild(el);
        return el;
    }

    function updateEntityPos(el, x, y) {
        // Використовуємо відсотки для ідеального центрування та масштабування
        el.style.transform = `translate(${x * 100}%, ${y * 100}%)`;
    }

    function generateGameState() {
        let tempState = { mouse: null, cats: [], cheeses: [] };
        tempState.mouse = { x: Math.floor(SIZE/2), y: Math.floor(SIZE/2) };
        for(let i = 0; i < numCatsConfig; i++) {
            let pos = getEmptyPos(tempState);
            tempState.cats.push({x: pos.x, y: pos.y});
        }
        for(let i = 0; i < 10; i++) {
            let pos = getEmptyPos(tempState);
            tempState.cheeses.push({x: pos.x, y: pos.y});
        }
        return tempState;
    }

    function applyState(seedState) {
        entitiesEl.innerHTML = '';
        state.gameOver = false;
        state.turn = 'mouse';
        state.cats = [];
        state.cheeses = [];
        
        buildGrid();

        state.mouse = { 
            x: seedState.mouse.x, 
            y: seedState.mouse.y, 
            el: createEntity('mouse', seedState.mouse.x, seedState.mouse.y, SVG_MOUSE) 
        };

        seedState.cats.forEach(c => {
            state.cats.push({
                x: c.x, y: c.y,
                el: createEntity('cat', c.x, c.y, SVG_CAT)
            });
        });

        seedState.cheeses.forEach(c => {
            state.cheeses.push({
                x: c.x, y: c.y,
                el: createEntity('cheese', c.x, c.y, SVG_CHEESE)
            });
        });

        updateUI();
    }

    function initGame(triggerSync = true) {
        initAudio();
        const seed = generateGameState();
        if (triggerSync) {
            sendAction('INIT', { numCats: numCatsConfig, seedState: seed });
        }
        applyState(seed);
    }

    function getValidMouseMoves() {
        const moves = [];
        for(let dy = -1; dy <= 1; dy++) {
            for(let dx = -1; dx <= 1; dx++) {
                if(dx === 0 && dy === 0) continue;
                const nx = state.mouse.x + dx;
                const ny = state.mouse.y + dy;
                if(nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) {
                    moves.push({x: nx, y: ny});
                }
            }
        }
        return moves;
    }

    function getValidCatMoves(cat) {
        const moves = [];
        const dirs = [{dx:0,dy:1}, {dx:0,dy:-1}, {dx:1,dy:0}, {dx:-1,dy:0}];
        for(let d of dirs) {
            const nx = cat.x + d.dx;
            const ny = cat.y + d.dy;
            if(nx >= 0 && nx < SIZE && ny >= 0 && ny < SIZE) {
                if (!state.cats.some(c => c !== cat && c.x === nx && c.y === ny)) {
                    moves.push({x: nx, y: ny, catRef: cat});
                }
            }
        }
        return moves;
    }

    function getAllValidCatMoves() {
        let allMoves = [];
        state.cats.forEach(cat => {
            allMoves = allMoves.concat(getValidCatMoves(cat));
        });
        return allMoves;
    }

    function updateUI() {
        // Скидаємо всі підсвітки і робимо туман скрізь за замовчуванням
        for(let y=0; y<SIZE; y++) {
            for(let x=0; x<SIZE; x++) {
                cells[y][x].el.classList.remove('highlight-mouse', 'highlight-cat');
                delete cells[y][x].el.dataset.catMove; 
                cells[y][x].fog.style.opacity = '1'; 
            }
        }

        // За замовчуванням приховуємо мишу і сир
        state.cheeses.forEach(c => c.el.style.opacity = '0');
        if (state.mouse && state.mouse.el) state.mouse.el.style.opacity = '0';

        // Індикатор ходу
        if (state.turn === 'mouse') {
            turnIndicator.innerHTML = SVG_MOUSE;
            turnIndicator.classList.remove('cat-turn-active');
        } else {
            turnIndicator.innerHTML = SVG_CAT;
            turnIndicator.classList.add('cat-turn-active');
        }

        if (state.gameOver) {
            // При завершенні гри показуємо все
            for(let y=0; y<SIZE; y++) {
                for(let x=0; x<SIZE; x++) {
                    cells[y][x].fog.style.opacity = '0';
                }
            }
            state.cheeses.forEach(c => c.el.style.opacity = '1');
            if(state.mouse && state.mouse.el) state.mouse.el.style.opacity = '1';
            return;
        }

        // ЗАПОБІГАННЯ ПІДВИСАННЮ: Перевіряємо чи може миша походити
        if (state.turn === 'mouse') {
            const moves = getValidMouseMoves();
            if (moves.length === 0) {
                winGame('cats'); // Миша в пастці, коти перемагають
                return;
            }
        }

        // ЗАПОБІГАННЯ ПІДВИСАННЮ: Перевіряємо чи можуть коти походити
        if (state.turn === 'cat') {
            const catMoves = getAllValidCatMoves();
            if (catMoves.length === 0) {
                state.turn = 'mouse'; // Коти заблоковані, передаємо хід миші
                setTimeout(updateUI, 100);
                return;
            }
        }

        // Застосовуємо логіку видимості в залежності від обраної ролі
        if (myRole === 'mouse') {
            // Миша бачить все поле без туману
            for(let y=0; y<SIZE; y++) {
                for(let x=0; x<SIZE; x++) {
                    cells[y][x].fog.style.opacity = '0';
                }
            }
            state.cheeses.forEach(c => c.el.style.opacity = '1');
            if (state.mouse && state.mouse.el) state.mouse.el.style.opacity = '1';

            if (state.turn === 'mouse') {
                const moves = getValidMouseMoves();
                moves.forEach(m => cells[m.y][m.x].el.classList.add('highlight-mouse'));
            }
        } else if (myRole === 'cat') {
            // Кіт бачить ТІЛЬКИ клітинки де він є, або ті, куди може піти
            const catMoves = getAllValidCatMoves();
            
            // Відкриваємо клітинки, на яких безпосередньо стоять коти
            state.cats.forEach(c => {
                cells[c.y][c.x].fog.style.opacity = '0';
                const cheeseIdx = state.cheeses.findIndex(ch => ch.x === c.x && ch.y === c.y);
                if (cheeseIdx !== -1) state.cheeses[cheeseIdx].el.style.opacity = '1';
                if (state.mouse && state.mouse.x === c.x && state.mouse.y === c.y) state.mouse.el.style.opacity = '1';
            });

            // Відкриваємо клітинки, куди коти можуть походити
            catMoves.forEach(m => {
                cells[m.y][m.x].fog.style.opacity = '0';
                
                const cheeseIdx = state.cheeses.findIndex(c => c.x === m.x && c.y === m.y);
                if (cheeseIdx !== -1) state.cheeses[cheeseIdx].el.style.opacity = '1';
                if (state.mouse && state.mouse.x === m.x && state.mouse.y === m.y) state.mouse.el.style.opacity = '1';

                // Підсвічуємо хід, лише якщо зараз черга кота
                if (state.turn === 'cat') {
                    cells[m.y][m.x].el.classList.add('highlight-cat');
                    cells[m.y][m.x].el.dataset.catMove = state.cats.indexOf(m.catRef);
                }
            });
        }
    }

    function handleCellClickLogic(x, y, fromRemote) {
        if (state.gameOver) return;
        
        // Перевірка ролей для локальних кліків
        if (!fromRemote) {
            if (state.turn === 'mouse' && myRole !== 'mouse') return;
            if (state.turn === 'cat' && myRole !== 'cat') return;
        }

        initAudio();

        if (state.turn === 'mouse') {
            const moves = getValidMouseMoves();
            if (moves.some(m => m.x === x && m.y === y)) {
                if (!fromRemote) sendAction('ACTION', {x, y});

                state.mouse.x = x;
                state.mouse.y = y;
                updateEntityPos(state.mouse.el, x, y);
                
                const cheeseIdx = state.cheeses.findIndex(c => c.x === x && c.y === y);
                if (cheeseIdx !== -1) {
                    const c = state.cheeses.splice(cheeseIdx, 1)[0];
                    c.el.remove();
                    Sounds.cheese();
                    
                    if (state.cheeses.length === 0) {
                        winGame('mouse');
                        return;
                    }
                } else {
                    Sounds.mouseMove();
                }

                if (state.cats.some(c => c.x === x && c.y === y)) {
                    winGame('cats');
                    return;
                }

                state.turn = 'cat';
                updateUI();
            }
        } else {
            const cellEl = cells[y][x].el;
            if (cellEl.dataset.catMove !== undefined) {
                if (!fromRemote) sendAction('ACTION', {x, y});

                const catIdx = parseInt(cellEl.dataset.catMove);
                const cat = state.cats[catIdx];
                
                cat.x = x;
                cat.y = y;
                updateEntityPos(cat.el, x, y);
                Sounds.catMove();
                
                if (cat.x === state.mouse.x && cat.y === state.mouse.y) {
                    winGame('cats');
                    return;
                }

                state.turn = 'mouse';
                updateUI();
            }
        }
    }

    function winGame(winner) {
        state.gameOver = true;
        
        for(let y=0; y<SIZE; y++) {
            for(let x=0; x<SIZE; x++) {
                cells[y][x].fog.style.opacity = '0';
                cells[y][x].el.classList.remove('highlight-mouse', 'highlight-cat');
            }
        }
        state.cheeses.forEach(c => c.el.style.opacity = '1');
        state.mouse.el.style.opacity = '1';

        if (winner === 'mouse') {
            Sounds.win();
            state.mouse.el.classList.add('win-pulse');
        } else {
            Sounds.lose();
            state.mouse.el.classList.add('lose-shake');
        }
    }

    function removeRandomCatLogic() {
        if (state.cats.length > 0) {
            const idx = Math.floor(Math.random() * state.cats.length);
            state.cats[idx].el.remove();
            state.cats.splice(idx, 1);
            numCatsConfig = Math.max(1, state.cats.length);
            updateUI();
        }
    }

    // --- Обробники Кнопок ---
    document.getElementById('btn-add-cat').addEventListener('click', () => {
        Sounds.add();
        numCatsConfig++;
        if (numCatsConfig > 5) numCatsConfig = 1;
        initGame(true);
    });

    document.getElementById('btn-remove-player').addEventListener('click', () => {
        Sounds.click();
        sendAction('REMOVE_CAT', {});
        removeRandomCatLogic();
    });

    document.getElementById('btn-restart').addEventListener('click', () => {
        Sounds.click();
        initGame(true);
    });

    // Запуск
    window.onload = () => initGame(false);
</script>

<!-- Універсальний екран-заглушка -->
<div id="block-overlay">Зачекай! Зараз не твій урок.</div>
</body>
